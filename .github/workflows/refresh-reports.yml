name: Informes L-M-V (Claude)

on:
  schedule:
    # 5 intentos por tarde de L-M-V (los "1,3,5" en UTC 0-2h son la MISMA tarde de Chile
    # del lunes/miércoles/viernes: martes/jueves/sábado 0-2 UTC = L-M-V 20-22h Chile).
    - cron: "3 22 * * 1,3,5"   # 18:03 Chile
    - cron: "3 23 * * 1,3,5"   # 19:03 Chile
    - cron: "3 0 * * 2,4,6"    # 20:03 Chile
    - cron: "3 1 * * 2,4,6"    # 21:03 Chile
    - cron: "3 2 * * 2,4,6"    # 22:03 Chile
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: America/Santiago

jobs:
  guard:
    # Deja pasar: corridas manuales siempre; programadas solo si hoy (Chile) aún
    # no existe el commit "Informes <fecha>" — el respaldo de las 19:03 rescata
    # un principal saltado o fallido (p. ej. por límite de uso de la suscripción).
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # VENTANA HORARIA: los crons válidos son vespertinos (18:03/18:33 + respaldo).
          # GitHub a veces dispara el cron con 10+ horas de retraso (madrugada siguiente):
          # esas corridas capturan el cierre de AYER y lo etiquetan como HOY — se bloquean.
          hora=$(date +%H)
          if [ "$hora" -lt 17 ]; then
            echo "Disparo schedule fuera de ventana (hora Chile: $hora) — cron retrasado de ayer; no se ejecuta."
            echo "run=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          today=$(date +%F)
          # ¿ya corrió la corrida VESPERTINA de hoy? (un commit de madrugada no cuenta)
          last_ts=$(git log -n 80 --pretty='%ct %s' | grep "Informes ${today}" | head -1 | cut -d' ' -f1)
          if [ -n "$last_ts" ] && [ "$(date -d @$last_ts +%H)" -ge 17 ]; then
            echo "Ya existe corrida vespertina de hoy — este disparo sobra."
            echo "run=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if false; then
            echo "Ya hay informes del ${today} — este disparo sobra, no se hace nada."
            echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "Aún no hay informes del ${today} — se ejecuta."
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

  informes:
    needs: guard
    if: needs.guard.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Refrescar informes de los 6 activos dinámicos
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat scripts/REFRESH_PROMPT.md)" \
            --permission-mode acceptEdits \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Agent,TodoWrite"

      - name: Fecha de informe en los 6 dinámicos
        run: python scripts/stamp_report_date.py

      - name: Snapshot de señales (base del backtest)
        run: python scripts/snapshot_signals.py

      - name: Números frescos + reconstrucción
        run: python scripts/update_numbers.py

      - name: Commit
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Informes $(date +%F) (9 dinámicos + rotación de viernes)"
          git push

      - name: Preparar sitio
        run: mkdir -p _site && cp index.html _site/index.html && cp pwa/* _site/

      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: _site

      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
