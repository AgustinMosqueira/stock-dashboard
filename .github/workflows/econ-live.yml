name: Datos económicos en vivo (intradía)

# Cada ~30 min en horario de mercado (07-19 Chile, días hábiles): re-descarga el
# calendario económico para mostrar los resultados que van saliendo ("salió: X").
# No comitea nada — solo redespliega Pages cuando hay cambios. Gratis, sin IA.
on:
  schedule:
    - cron: "7,37 11-23 * * 1-5"   # minutos impares para esquivar la congestión de GitHub
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: America/Santiago

jobs:
  econ:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar resultados del calendario económico
        id: upd
        run: |
          python scripts/update_econ_live.py
          echo "changed=$([ -f _econ_changed ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Commit — la publicación por rama despliega en cada push
        if: steps.upd.outputs.changed == 'yes'
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html stock-dashboard.html data/econ-calendar.json
          git diff --cached --quiet || git commit -m "Datos económicos $(date '+%F %H:%M')"
          git push

      - name: Preparar sitio
        if: steps.upd.outputs.changed == 'yes'
        run: mkdir -p _site && cp index.html _site/index.html && cp pwa/* _site/

      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        if: steps.upd.outputs.changed == 'yes'
        with:
          path: _site

      - id: deploy
        if: steps.upd.outputs.changed == 'yes'
        uses: actions/deploy-pages@v4
