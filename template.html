<title>Stock Research — Dashboard de Equity Research</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d0d0d">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stocks">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #f3f3f0;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --hairline: #e1e0d9;
    --border: rgba(11, 11, 11, 0.10);
    --accent: #2a78d6;
    --accent-soft: rgba(42, 120, 214, 0.12);
    --track: #e7e6e0;
    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --good-tint: rgba(12, 163, 12, 0.13);
    --warning-tint: rgba(250, 178, 25, 0.16);
    --serious-tint: rgba(236, 131, 90, 0.16);
    --critical-tint: rgba(208, 59, 59, 0.13);
    --hecho-bg: rgba(42, 120, 214, 0.10);
    --hecho-ink: #1c5cab;
    --lectura-bg: rgba(74, 58, 167, 0.10);
    --lectura-ink: #4a3aa7;
    --up: #006300;
    --down: #d03b3b;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --surface-2: #222220;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --hairline: #2c2c2a;
      --border: rgba(255, 255, 255, 0.10);
      --accent: #3987e5;
      --accent-soft: rgba(57, 135, 229, 0.18);
      --track: #2c2c2a;
      --good-tint: rgba(12, 163, 12, 0.18);
      --warning-tint: rgba(250, 178, 25, 0.15);
      --serious-tint: rgba(236, 131, 90, 0.15);
      --critical-tint: rgba(208, 59, 59, 0.18);
      --hecho-bg: rgba(57, 135, 229, 0.16);
      --hecho-ink: #86b6ef;
      --lectura-bg: rgba(144, 133, 233, 0.16);
      --lectura-ink: #9085e9;
      --up: #2ebd5f;
      --down: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #222220;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-soft: rgba(57, 135, 229, 0.18);
    --track: #2c2c2a;
    --good-tint: rgba(12, 163, 12, 0.18);
    --warning-tint: rgba(250, 178, 25, 0.15);
    --serious-tint: rgba(236, 131, 90, 0.15);
    --critical-tint: rgba(208, 59, 59, 0.18);
    --hecho-bg: rgba(57, 135, 229, 0.16);
    --hecho-ink: #86b6ef;
    --lectura-bg: rgba(144, 133, 233, 0.16);
    --lectura-ink: #9085e9;
    --up: #2ebd5f;
    --down: #e66767;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #f3f3f0;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --hairline: #e1e0d9;
    --border: rgba(11, 11, 11, 0.10);
    --accent: #2a78d6;
    --accent-soft: rgba(42, 120, 214, 0.12);
    --track: #e7e6e0;
    --good-tint: rgba(12, 163, 12, 0.13);
    --warning-tint: rgba(250, 178, 25, 0.16);
    --serious-tint: rgba(236, 131, 90, 0.16);
    --critical-tint: rgba(208, 59, 59, 0.13);
    --hecho-bg: rgba(42, 120, 214, 0.10);
    --hecho-ink: #1c5cab;
    --lectura-bg: rgba(74, 58, 167, 0.10);
    --lectura-ink: #4a3aa7;
    --up: #006300;
    --down: #d03b3b;
  }

  html { background: var(--page); }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; }
  :is(a, button, input, summary):focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }

  .topbar {
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
    padding: 18px 24px 14px;
    border-bottom: 1px solid var(--hairline);
  }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
  .brand .tick { color: var(--accent); font-family: var(--mono); font-weight: 600; }
  .topbar .meta { color: var(--muted); font-size: 12.5px; }
  .topbar .spacer { flex: 1; }
  .edu-chip {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-2);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
  }

  .layout {
    display: grid;
    grid-template-columns: 288px minmax(0, 1fr);
    gap: 0;
    min-height: calc(100vh - 60px);
  }
  .rail {
    border-right: 1px solid var(--hairline);
    padding: 18px 14px 24px;
  }
  .rail-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 8px 10px;
  }
  .search {
    width: 100%;
    margin: 0 0 12px;
    padding: 8px 11px;
    font: inherit;
    font-size: 13.5px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 8px;
  }
  .search::placeholder { color: var(--muted); }
  .no-match {
    background: var(--surface);
    border: 1px dashed var(--hairline);
    border-radius: 9px;
    padding: 12px 13px;
    font-size: 12.5px;
    color: var(--ink-2);
    line-height: 1.5;
  }
  .no-match .q { font-family: var(--mono); font-weight: 700; color: var(--ink); }
  .ask-btn {
    display: block; text-align: center; text-decoration: none;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 13px;
    border-radius: 9px; padding: 10px 12px; margin: 10px 0 6px;
  }
  .ask-btn:hover { filter: brightness(1.08); }
  .ask-note { font-size: 11px; color: var(--muted); }
  .head-actions a.btn { text-decoration: none; display: inline-flex; align-items: center; }
  .btn.danger { color: var(--down); border-color: var(--critical-tint); }
  .btn.danger:hover { border-color: var(--down); background: var(--critical-tint); }
  .no-match p { margin: 0 0 8px; }
  .no-match p:last-child { margin: 0; }
  .stock-list { display: flex; flex-direction: column; gap: 6px; }
  .stock-card {
    display: grid;
    grid-template-columns: 1fr auto;
    column-gap: 10px;
    row-gap: 1px;
    align-items: center;
    width: 100%;
    text-align: left;
    background: none;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 9px 10px;
    cursor: pointer;
  }
  .stock-card:hover { background: var(--surface-2); }
  .stock-card.active {
    background: var(--surface);
    border-color: var(--border);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  }
  .stock-card .t { font-family: var(--mono); font-weight: 700; font-size: 14px; }
  .stock-card .n {
    grid-column: 1;
    color: var(--muted);
    font-size: 11.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stock-card .p { grid-column: 1; color: var(--ink-2); font-size: 12px; font-family: var(--mono); }
  .stock-card .pw { grid-column: 1; font-size: 10.5px; color: var(--muted); }
  .delta { font-family: var(--mono); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .delta.up { color: var(--up); }
  .delta.down { color: var(--down); }
  .delta.flat { color: var(--muted); }
  .head-delta { font-size: 19px; }
  .head-price {
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    color: var(--ink);
    white-space: nowrap;
  }
  .head-week { margin-top: 4px; font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .head-week .delta { font-size: 12.5px; }
  .score-chip {
    grid-column: 2;
    grid-row: 1 / span 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 46px;
    border-radius: 8px;
    padding: 5px 7px;
    line-height: 1.15;
  }
  .score-chip .v { font-family: var(--mono); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
  .score-chip .g { font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; }
  .rail-note { color: var(--muted); font-size: 11.5px; padding: 16px 8px 0; line-height: 1.5; }

  .main { padding: 26px 32px 56px; max-width: 980px; }

  .company-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .company-head h1 { margin: 0; font-size: 26px; letter-spacing: -0.015em; }
  .company-head .ticker {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 6px;
    padding: 2px 8px;
  }
  .company-head .date { color: var(--muted); font-size: 12.5px; }
  .head-actions { margin-left: auto; display: flex; gap: 8px; }
  .btn {
    border: 1px solid var(--hairline);
    background: var(--surface);
    border-radius: 7px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink-2);
  }
  .btn:hover { background: var(--surface-2); color: var(--ink); }
  .mode-switch {
    display: inline-flex;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 2px;
    background: var(--surface);
    gap: 2px;
  }
  .mode-switch button {
    border: none;
    background: none;
    border-radius: 999px;
    padding: 4px 14px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-2);
    cursor: pointer;
    white-space: nowrap;
  }
  .mode-switch button:hover { color: var(--ink); }
  .mode-switch button.active {
    background: var(--accent);
    color: #ffffff;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 8px;
    margin: 18px 0 22px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 9px;
    padding: 10px 12px;
    min-width: 0;
  }
  .stat .l {
    font-size: 10.5px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
    white-space: nowrap;
  }
  .stat .v { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--ink); overflow-wrap: break-word; }

  .hero {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 22px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    padding: 18px 22px;
    margin-bottom: 26px;
  }
  .hero .reading { color: var(--ink-2); font-size: 14px; max-width: 62ch; }
  .hero .reading strong { color: var(--ink); }
  .grade-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border-radius: 999px;
    padding: 3px 12px 3px 8px;
    font-weight: 700;
    font-size: 13px;
    margin-top: 8px;
  }
  .grade-pill .dot { width: 9px; height: 9px; border-radius: 50%; }
  .gauge-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .gauge-num {
    font-family: var(--mono);
    font-size: 34px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .gauge-cap { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

  .grade-good { background: var(--good-tint); }
  .grade-good .dot { background: var(--good); }
  .grade-warning { background: var(--warning-tint); }
  .grade-warning .dot { background: var(--warning); }
  .grade-serious { background: var(--serious-tint); }
  .grade-serious .dot { background: var(--serious); }
  .grade-critical { background: var(--critical-tint); }
  .grade-critical .dot { background: var(--critical); }

  .section-nav {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 10px 0;
    margin: 0 0 8px;
    background: var(--page);
    border-bottom: 1px solid var(--hairline);
    scrollbar-width: none;
  }
  .section-nav::-webkit-scrollbar { display: none; }
  .section-nav a {
    flex: 0 0 auto;
    text-decoration: none;
    color: var(--ink-2);
    font-size: 12.5px;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 4px 11px;
    white-space: nowrap;
    background: var(--surface);
  }
  .section-nav a:hover { color: var(--ink); background: var(--surface-2); }
  .section-nav a .k { font-family: var(--mono); color: var(--muted); margin-right: 4px; }

  .report-section { padding: 22px 0 6px; border-bottom: 1px solid var(--hairline); scroll-margin-top: 54px; }
  .report-section:last-of-type { border-bottom: none; }
  .sec-eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .report-section h2 { margin: 2px 0 12px; font-size: 19px; letter-spacing: -0.01em; }
  .prose { max-width: 74ch; color: var(--ink-2); }
  .prose p { margin: 0 0 12px; }
  .prose ul { margin: 0 0 12px; padding-left: 20px; }
  .prose li { margin-bottom: 7px; }
  .prose strong { color: var(--ink); }
  .badge {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.05em;
    border-radius: 4px;
    padding: 1px 6px;
    margin-right: 4px;
    vertical-align: 0.08em;
  }
  .badge.hecho { background: var(--hecho-bg); color: var(--hecho-ink); }
  .badge.lectura { background: var(--lectura-bg); color: var(--lectura-ink); }
  .prose .md-h { font-weight: 700; color: var(--ink); margin: 16px 0 8px; }
  .md-table { overflow-x: auto; margin: 0 0 12px; }
  .md-table table { border-collapse: collapse; font-size: 12.5px; min-width: 340px; }
  .md-table th, .md-table td { padding: 5px 10px; text-align: left; border-bottom: 1px solid var(--hairline); }
  .md-table th {
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .md-table td { font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .signal-close { margin: 12px 0 0; color: var(--ink-2); font-size: 13.5px; max-width: 78ch; }
  .signal-close strong { color: var(--ink); }

  .score-detail { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 18px 20px; }
  .cat-row { display: grid; grid-template-columns: 190px minmax(0, 1fr) 88px; gap: 12px; align-items: center; padding: 7px 0; }
  .cat-row .name { font-size: 13px; font-weight: 600; }
  .cat-row .w { color: var(--muted); font-size: 11.5px; font-family: var(--mono); margin-left: 6px; font-weight: 400; }
  .bar { position: relative; height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--accent); }
  .cat-row .val {
    font-family: var(--mono);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    text-align: right;
    color: var(--ink-2);
  }
  .cat-row .val b { color: var(--ink); font-size: 13.5px; }
  .cat-just { margin: 2px 0 10px; padding: 0 0 8px; border-bottom: 1px dashed var(--hairline); color: var(--ink-2); font-size: 12.5px; max-width: 78ch; }
  .cat-just:last-of-type { border-bottom: none; }
  .score-total {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
    border-top: 1px solid var(--hairline);
    margin-top: 10px;
    padding-top: 12px;
  }
  .score-total .num { font-family: var(--mono); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .score-note { color: var(--muted); font-size: 12px; margin-top: 10px; max-width: 74ch; }

  details.weights { margin-top: 14px; border-top: 1px solid var(--hairline); padding-top: 10px; }
  details.weights summary { cursor: pointer; font-size: 13px; color: var(--ink-2); user-select: none; }
  details.weights summary:hover { color: var(--ink); }
  .w-grid { display: grid; grid-template-columns: 170px minmax(0, 1fr) 52px; gap: 10px 12px; align-items: center; margin: 12px 0 6px; }
  .w-grid label { font-size: 12.5px; color: var(--ink-2); }
  .w-grid input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
  .w-grid .wv { font-family: var(--mono); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
  .w-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .w-foot .warn { color: var(--serious); font-weight: 600; }

  details.sources { margin: 20px 0 0; }
  details.sources summary { cursor: pointer; font-size: 13px; color: var(--ink-2); }
  details.sources ul { columns: 2; column-gap: 28px; padding-left: 18px; margin: 10px 0 0; font-size: 12.5px; color: var(--muted); }
  details.sources li { margin-bottom: 5px; break-inside: avoid; }

  .disclaimer {
    margin: 30px 0 0;
    border-left: 3px solid var(--hairline);
    padding: 4px 0 4px 14px;
    color: var(--muted);
    font-size: 12.5px;
    max-width: 74ch;
  }

  .toast {
    position: fixed;
    bottom: 18px;
    right: 18px;
    background: var(--surface);
    color: var(--ink-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 9px 14px;
    font-size: 13px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: none; }

  @media (prefers-reduced-motion: reduce) {
    .toast { transition: none; }
    html { scroll-behavior: auto; }
  }
  html { scroll-behavior: smooth; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .rail { border-right: none; border-bottom: 1px solid var(--hairline); padding-bottom: 12px; }
    .stock-list { flex-direction: row; overflow-x: auto; padding-bottom: 6px; }
    .stock-card { min-width: 168px; }
    .rail-note { display: none; }
    .main { padding: 20px 16px 48px; }
    .hero { grid-template-columns: 1fr; }
    .cat-row { grid-template-columns: 1fr; gap: 5px; }
    .cat-row .val { text-align: left; }
    details.sources ul { columns: 1; }
  }

  /* — Calendario — */
  .layout.cal-mode { grid-template-columns: minmax(0, 1fr); }
  .layout.cal-mode .rail { display: none; }
  .cal-wrap { max-width: 880px; margin: 0 auto; padding: 30px 22px 60px; }
  .cal-head h1 { font-size: 24px; margin: 0 0 6px; }
  .cal-head .sub { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  .cal-month {
    margin: 30px 0 4px;
    font-size: 11.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink-2);
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 7px;
  }
  .cal-day { display: grid; grid-template-columns: 66px minmax(0, 1fr); gap: 16px; padding: 13px 0; border-bottom: 1px solid var(--hairline); }
  .cal-day:last-child { border-bottom: none; }
  .cal-date { text-align: center; padding-top: 2px; }
  .cal-date .dnum { font-family: var(--mono); font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.05; }

ental":"**Resultados 1T26** (reportados 6/7-may-2026):\n\n- HECHO: Ventas consolidadas CLP 819.515 millones (+0,2% a/a); EBITDA CLP 131.644 millones (+0,1%), margen estable en 16,1%; utilidad controladora CLP 53.856 millones (−6,8%, ~US$58M); UPA CLP 145,8; volúmenes consolidados +1,8% (press release 1Q26 / TipRanks / La Tercera, may-2026).\n- HECHO — **Chile, el motor**: ventas +3,9%, EBITDA +13,7% a CLP 107.357 millones, margen 20,0% (+173 pb), ayudado por la apreciación del CLP de 8,1% vs USD (menores costos dolarizados) y volúmenes +3,9% liderados por categorías no alcohólicas (press release 1Q26, may-2026).\n- HECHO — **Negocios Internacionales** (Argentina, Bolivia, Paraguay, Uruguay): ventas −6,7%, EBITDA −18,6% a CLP 28.489 millones; volúmenes −1,7% con caída de un dígito medio en cerveza en Argentina (press release 1Q26).\n- HECHO — **Vinos**: ventas −7,2%, EBITDA −50,1% a CLP 3.288 millones (margen −508 pb) por mayor costo del vino y sobreoferta global (~US$19B de inventario excedente en la industria) (press release 1Q26; DF, 12-jun-2026).\n- HECHO: TTM en USD (ADR): revenue US$3,13B (−2,2%), utilidad neta US$121,8M (−32,0%); ROE 7,3-7,9%; Deuda/Patrimonio 0,71x (StockAnalysis 20-jul-2026; Visfin jul-2026).\n\n**Propiedad y movimientos corporativos:**\n\n- HECHO: IRSA controla el 65,87% de CCU; IRSA es JV 50/50 entre Quiñenco y Heineken. Free float: 20,04% local + 14,09% ADR (ccuinvestor.com, 2026).\n- HECHO: CCU completó la compra de la participación de Nestlé en el JV de aguas por US$180 millones (DF, 12-jun-2026).\n- HECHO: Eduardo Ffrench-Davis asumió como CEO el 1-jul-2026 tras 28 años de Patricio Jottar, quien pasa al directorio; Alexandre Carreteiro (presidente de Heineken Américas) fue nombrado vicepresidente del directorio (TipRanks, jul-2026).\n- LECTURA: el negocio chileno (dos tercios del EBITDA) está en su mejor momento de márgenes en años; el problema de CCU no es operacional en su core, sino la exposición a Argentina y al ciclo global del vino. La mayor injerencia de Heineken en el directorio puede traer disciplina de márgenes o tensión con Quiñenco — sin evidencia de conflicto por ahora.","valuacion":"- HECHO: P/E trailing 17,25x local / 16,9-18,4x ADR; forward ~15x (BTG estima 13,3x); EV/EBITDA 8,66x (Investing/Visfin/StockAnalysis, jul-2026).\n- HECHO: la acción transa **~20% por debajo de su promedio de valuación de los últimos 10 años** (DF, 12-jun-2026).\n- HECHO: dividend yield ~3,0% local (dividendo definitivo N°272 de $74,53 por acción pagado desde el 24-abr-2026) (TipRanks/Diario Estrategia, abr-2026).\n- HECHO — targets locales: consenso **$5.877 CLP (+11%)**, máx $6.600, mín $4.365; 2 buy / 4 hold / 4 sell (Investing.com, jul-2026). Casas (DF, 12-jun-2026): **BICE Sobreponderar PO $7.794 (+52%)**, **BTG Neutral PO $6.500**, **UBS Vender PO $4.750** (argumenta crecimiento de ingresos de un dígito hasta 2028).\n- HECHO: ADR consenso Hold, target US$12,46 (+10,8%, 7 analistas) (StockAnalysis, 20-jul-2026).\n- LECTURA: la valuación es el corazón de la tesis alcista — múltiplos comprimidos contra la propia historia con un IPSA que transa ~12% caro vs la suya. Pero el descuento tiene causa: el upside depende de que Argentina y Vinos se normalicen, no del negocio chileno que ya opera bien y está en el precio. La dispersión BICE/UBS (de +52% a −7%) refleja exactamente esa apuesta.","tecnico":"- HECHO: precio $5.285 CLP, +1,28% en la sesión del lunes 20-jul y +1,63% vs 5 ruedas atrás (TradingView tiempo real, 20-jul-2026).\n- HECHO: RSI(14) diario 56,3 — neutral con sesgo alcista; MACD(12,26,9) +12,6 sobre señal −1,0 (histograma +13,6): **cruce alcista reciente** (calculado sobre 130 barras diarias de TradingView, 20-jul-2026).\n- HECHO: precio sobre la SMA20 (~$5.183, +2,0%) y SMA50 (~$5.204, +1,6%), y justo en la SMA100 (~$5.285); bajo la MM200 publicada (~$5.670) (TradingView 20-jul-2026; Visfin jul-2026).\n- HECHO: señal técnica diaria \"Strong Buy\", semanal neutral (Investing.com, jul-2026). Mínimo de 52 semanas $4.947 tocado a inicios de mayo; desde ahí, piso doble en la zona $5.000-5.050 (jun y feb).\n- LECTURA: estructura de base tras 12 meses bajistas (−16,6% en las últimas ~26 semanas). Soportes: $5.183-5.204 (SMA20/50) y $5.000-4.947; resistencias: $5.443 (máximo intradía del 20-jul), $5.670 (MM200) — su recuperación sería la confirmación de cambio de tendencia — y la zona $6.600. El cruce de MACD con RSI aún lejos de sobrecompra deja espacio al rebote, pero mientras siga bajo la MM200 es un rebote dentro de tendencia bajista, no una tendencia alcista nueva.","catalizadores":"- HECHO: **resultados 2T26 el 6-ago-2026** (StockAnalysis, jul-2026). LECTURA: trimestre de invierno, estacionalmente débil en volúmenes; el foco estará en si Chile sostiene margen 20% y en el ritmo de deterioro/mejora argentino.\n- HECHO: **nuevo CEO** Eduardo Ffrench-Davis desde el 1-jul-2026, con prioridad declarada en márgenes y eficiencia; renovación de comités del directorio entre julio y agosto (DF 12-jun-2026; TipRanks jul-2026). LECTURA: primer plan estratégico del nuevo management es el catalizador idiosincrático más cercano.\n- HECHO: **tipo de cambio** — USD/CLP ~926 (14-jul-2026), con el CLP apreciado 8,1% vs USD en 1T26: viento a favor directo en costos dolarizados del segmento Chile (dolarhoy.net; press release 1Q26).\n- HECHO: **insumos** — aluminio LME ~US$3.160-3.200/t con inventarios −43% en el año y déficit proyectado (~930 kt según Macquarie); cebada y lúpulo europeos +12-18% de costo desembarcado en 1T26 (TradingEconomics/AgMetalMiner/Expert Market Research, jul-2026).\n- HECHO: **Argentina** — consumo masivo −3,3% acumulado en 2026, pero inflación mensual desacelerando (<2% proyectado para julio) y expectativa de recuperación gradual del consumo en 2S26 (Bloomberg Línea/Infobae, jun-2026). LECTURA: la recuperación argentina es la opción de mayor convexidad de la tesis.\n- HECHO: **macro Chile** — PIB 1T26 −0,5% a/a, Imacec de mayo −0,9% (quinto retroceso ia. Con el consenso en Hold y el IPSA caro, el papel ofrece asimetría razonable bajo $5.300 con soporte claro en $5.000, catalizador fechado el 6-ago (2T26) y la incógnita del plan del nuevo CEO. La señal es **Hold** con sesgo constructivo: para pasar a Buy se necesita recuperar la MM200 y/o evidencia de que Argentina dejó de drenar EBITDA; para venderla, perder los $5.000 que ya defendió dos veces."},"scores":{"tecnica":{"score":60,"just":"Rebote con confirmación: cruce alcista de MACD, RSI 56 con espacio, precio sobre SMA20/50 y doble piso defendido en $5.000. Se descuenta porque sigue bajo la MM200 ($5.670) y 20% bajo el máximo de 52 semanas — es una base dentro de tendencia bajista, aún no una tendencia alcista."},"fundamental":{"score":62,"just":"Chile (dos tercios del EBITDA) con margen 20% y EBITDA +13,7%, balance sano (D/E 0,71x) y valuación 20% bajo su media histórica con 3% de yield. Los lastres pesan: Argentina −18,6% y Vinos −50,1% de EBITDA, utilidad total −6,8% y ROE mediocre (~7,5%)."},"sentimiento":{"score":46,"just":"Consenso tibio con 4 de 10 analistas locales en venta, laggard notorio del rally IPSA y titulares de prensa escépticos (\"hacen dudar al mercado\"). A favor: dispersión de targets con el extremo alcista (BICE +52%) bien argumentado y flujos extranjeros récord hacia la bolsa chilena que eventualmente rotan a rezagados."},"riesgo":{"score":50,"just":"Negocio defensivo de consumo básico con 65% del mercado cervecero chileno y controlador sólido (Quiñenco/Heineken), pero triple exposición adversa: macro chilena deteriorándose (5 Imacec negativos), Argentina sin piso confirmado, sobreoferta global de vino, más costos de aluminio y cebada al alza y nuevas restricciones publicitarias vigentes desde el 7-jul."},"conviccion":{"score":55,"just":"Catalizadores concretos y fechados (2T26 el 6-ago, plan del nuevo CEO, recuperación argentina en 2S26) y tesis falsable con niveles claros ($5.000 abajo, MM200 $5.670 arriba). La convicción es media porqu e desde los mínimos de junio (~1.133). El cuadro es de **equilibrio inestable con sesgo de cautela**:\n\n- **HECHO:** El diferencial de tasas sigue siendo claramente favorable al USD (Fed Funds 3.50–3.75% vs. tasa de depósito BCE 2.25%), aunque el BCE **subió** 25 pb en junio mientras la Fed está en pausa — el diferencial se está cerrando en el margen a favor del EUR.\n- **HECHO:** La semana entrante es de alto riesgo de evento: **reunión del BCE el jueves 23-jul** (mercado descuenta ~95% de mantención) y **FOMC el 28-29-jul** (~87–89% de mantención).\n- **HECHO:** Los especuladores están **netos cortos en EUR** (-12,605 contratos, COT al 14-jul-2026), aunque recortando cortos.\n- **LECTURA:** Los riesgos de cola (guerra en Medio Oriente y shock energético asimétrico contra Europa, reapertura de la disputa arancelaria EEUU-UE, crisis política/energética en Francia) recaen desproporcionadamente sobre el EUR.\n\n**Señal resultante: Caution (Grado C — 46/100).** Sin ventaja clara para comprar EUR; el par sigue siendo un rango 1.133–1.155 dominado por bancos centrales y geopolítica.\n\n---"},{"title":"Diferencial de tasas y política monetaria","nav":"Tasas","body":"**BCE (HECHO):**\n- Tasa de depósito vigente: **2.25%**, tras una **subida de 25 pb decidida en la reunión de junio (17-jun-2026)** en respuesta a la presión inflacionaria derivada del shock energético (ECB / Trading Economics, jul-2026).\n- Próxima reunión: **jueves 23-jul-2026** (decisión 13:45 CET, conferencia de Lagarde 14:30 CET) — es decir, **sí hay reunión la semana del 20-jul**. Es reunión sin proyecciones de staff.\n- Expectativas de mercado: **~95.3% de mantención en 2.25%**, con una cola alcista de ~3.4% para +25 pb (rateprobability.com / ecb-watch, consultado 19-jul-2026).\n- Tono de Lagarde: **hawkish**. El 2-jul defendió la subida de junio citando proyecciones de inflación en torno al 3% para 2026 y la necesidad de mantenerse vigilante (ECB Forum Sintra, jul-2026).\n\n**Fed (HECHO):**\n- Rango objetivo vigente: **3.50%–3.75%**; en junio el FOMC mantuvo y señaló que la inflación sigue elevada respecto de la meta del 2% (core PCE ~2.9%).\n- FOMC 28-29-jul-2026: **~89% de probabilidad de mantención** según CME FedWatch (~86.7% según fuentes alternativas al 18-jul-2026). Consenso: tasas sin cambios al menos hasta el otoño boreal, condicionado a progreso en inflación.\n- Tono del presidente de la Fed, Kevin Warsh (Sintra, 1-jul-2026): sin señales para julio, pero \"los precios están demasiado altos\" — sesgo restrictivo.\n\n**Divergencia (LECTURA):** El **nivel** del diferencial (~125–150 pb en tasas de política; 2 años: UST 4.16% vs. Schatz ~2.6–2.8%) favorece al USD y sostiene el carry en contra del EUR. Pero la **dirección** favorece marginalmente al EUR: el BCE está subiendo (y conserva cola hawkish) mientras la Fed está estática. Riesgo señalado por estrategas: que el mercado retire el tightening del BCE antes que el de la Fed, limitando el alza del EUR (VT Markets, jul-2026).\n\n---"},{"title":"Balanza de pagos y flujos","nav":"Balanza","body":"**Cuenta corriente (HECHO):**\n- Superávit de la eurozona de **€25 mil millones en mayo-2026** (+€8 mm m/m): bienes +€16 mm, servicios +€14 mm, renta primaria +€12 mm, renta secundaria -€18 mm (BCE, 17-jul-2026).\n- Acumulado 12 meses a mayo-2026: **€272 mm (1.7% del PIB)**, frente a €318 mm (2.0% del PIB) un año antes — **superávit en contracción**, principalmente por menor superávit de bienes (de €350 mm a €286 mm) (BCE, 17-jul-2026).\n- Proyección del staff del Eurosistema (jun-2026): caída adicional a **~1.3% del PIB en 2026** por mayores precios de importación de energía a raíz de la guerra en Medio Oriente (ECB Economic Bulletin, 2026).\n\n**Flujos de portafolio 2026 (HECHO/LECTURA):**\n- HECHO: La rotación hacia Europa de comienzos de año **se revirtió a mitad de 2026**: la porción de flujos de ETFs de renta variable de EEUU hacia fondos centrados en EEUU subió todos los meses del año, alcanzando ~85% en junio (iShares H1-2026). En Europa, los flujos hacia productos centrados en EEUU se **cuadruplicaron** interanual (Morningstar, 2026). En money markets, USD fue la clasificación más comprada (+€15.98 mm) mientras los fondos EUR registraron salidas (-€5.06 mm) (Lipper/LSEG, may-2026).\n- LECTURA: El colchón estructural de cuenta corriente sigue siendo un soporte de fondo para el EUR, pero se erosiona por energía, y los flujos de portafolio han vuelto a favorecer activos en USD por el atractivo relativo de las tasas americanas. Neto: **levemente negativo para el EUR**.\n\n---"},{"title":"Posicionamiento","nav":"Posicionamiento","body":"**HECHO — CFTC COT, Euro FX (CME), datos al martes 14-jul-2026, publicado 17-jul-2026 (Tradingster/CFTC):**\n- No comerciales (especuladores): largos 230,307 / cortos 242,912 → **neto -12,605 contratos (corto)**.\n- Variación semanal: +6,877 largos, +3,255 cortos → **neto +3,622 hacia largo** (los cortos se están recortando).\n- Interés abierto: 799,495 contratos — mercado profundo y líquido.\n- Tendencia de meses: el neto largo de ~+21,000 contratos de marzo-2026 (percentil 15 del rango de 52 semanas, mínimo de 1 año) se ha degradado hasta territorio **neto corto** (AhaSignals/Investing.com, 2026).\n\n**LECTURA:** Posicionamiento levemente bajista en EUR pero **cercano a plano y mejorando** — no hay extremo de posicionamiento que genere señal contraria potente en ninguna dirección. Un BCE hawkish el 23-jul podría forzar cobertura de cortos (riesgo alcista táctico); la señal estructural es neutral-negativa.\n\n---"},{"title":"Análisis técnico","nav":"Técnico","body":"**HECHO — TradingView (17-jul-2026):**\n- Precio: **1.14382**.\n- RSI(14) diario: **47.2** — neutral.\n- MACD(12,26): **-0.0025** vs. señal **-0.0036**; histograma **+0.0011** — momentum bajista moderándose.\n- Medias: precio **sobre SMA20 (1.1414)** pero **bajo SMA50 (1.1530)**.\n- Ventana 80 días: caída desde máximos ~**1.182** (abril) hasta mínimos ~**1.133** (junio); rebote reciente a ~1.148 y cierre 1.1438.\n\n**LECTURA:**\n- La estructura de mediano plazo sigue siendo **correctiva/bajista** (máximos y mínimos decrecientes desde abril; precio bajo SMA50), pero el rebote desde 1.133 con histograma MACD al alza y recuperación de la SMA20 sugiere que la caída **perdió fuerza**.\n- Soportes: 1.1414 (SMA20), luego 1.133 (mínimo de junio — pivote clave). Resistencias: 1.148 (techo del rebote), 1.1530 (SMA50), luego zona 1.16.\n- Un cierre diario sobre la SMA50 (~1.153) convertiría el rebote en cambio de tendencia; la pérdida de 1.133 reactivaría el tramo bajista hacia 1.12. Con RSI en 47 y precio entre medias, el veredicto técnico es **neutral** (par ni alcista ni bajista con convicción).\n\n---"},{"title":"Intervención y riesgo de banco central","nav":"Intervención","body":"**HECHO/LECTURA:** El riesgo de intervención cambiaria **directa** en EUR/USD es históricamente bajo (última intervención coordinada relevante: 2000/2011); ni el BCE ni el Tesoro de EEUU han señalado nada en 2026 a los niveles actuales. El riesgo relevante es **de cola**:\n\n1. **Energía / Medio Oriente (HECHO):** Tras los ataques de Israel-EEUU contra Irán (28-feb-2026) y la disrupción del Estrecho de Ormuz (~1/5 del suministro global de GNL afectado), el gas europeo opera en ~€46/MWh; los escenarios de crisis prolongada de la Comisión Europea/JRC contemplan petróleo hasta ~USD 180/bbl y gas ~€80/MWh en 4T-2026 (JRC, may-2026; Bloomberg, 9-jul-2026). **LECTURA:** shock asimétricamente negativo para el EUR (Europa importadora neta; EEUU exportador de energía).\n2. **Aranceles EEUU-UE (HECHO):** El acuerdo provisional del 20-may-2026 (arancel máximo ~15% a productos UE) coexiste con amenazas de Trump de tarifas \"mucho más altas\" si no se ratifica, reabriendo la guerra comercial (ING, Euronews, 2026). **LECTURA:** riesgo bajista para crecimiento europeo y EUR.\n3. **Política europea (HECHO):** Crisis política y presupuestaria en Francia, con hoja de ruta energética bl ó el 30-jul un Q3 FY26 récord: ingresos $109,4B (+16%) y EPS $2,02 (+29%, incluye $0,11 de reintegro arancelario), sobre el consenso de $1,89. Pero la guía de septiembre decepcionó: crecimiento 9-11% vs ~12% esperado y margen bruto 47-48% (vs 50,1%) por costos de memoria al alza; la acción cayó ~6% esa noche y hoy cotiza $311, -9,7% bajo su máximo de $344,57. HECHO: Ternus asume como CEO el 1-sep; iPhone 18 y iPhone Fold llegan en septiembre. LECTURA: el problema es de oferta y costos, no de demanda — el mercado está repreciando márgenes, no la franquicia.","fundamental":"- HECHO: Q3 FY26 revenue $109,4B (+16% YoY) y EPS $2,02 (+29%, con $0,11 de reintegro arancelario); iPhone +22% a $54,3B, récord de trimestre de junio (Apple IR, 30-jul-2026).\n- HECHO: guía Q4 FY26 de +9-11% (consenso ~12%) y margen bruto 47-48% vs 50,1% de Q3, que incluía ~2pp no recurrentes (digitalapplied, 30-jul-2026).\n- HECHO: Cook espera pagar «costos de memoria aún mayores más allá de septiembre» por demanda de hiperescaladores; Apple ya subió precios de Mac e iPad (CNBC, 30-jul-2026).\n- HECHO: Services +12% a $30,7B, leve miss vs $31,2B; Siri renovada llega «este otoño» en EE.UU., con UE y China rezagadas y posible tier pago de iCloud+.\n- LECTURA: Cook definió la restricción como «demand forecast miss» — iPhone y Mac venden mejor de lo previsto; el riesgo real está en márgenes, no en volumen.","valuacion":"- HECHO: P/E ~35,5x trailing (EPS TTM $8,75), 43% sobre su media de 10 años de 25,0x (financecharts, ago-2026).\n- HECHO: market cap ~US$4,54T; revenue TTM $466,8B y utilidad $128,9B (stockanalysis, ago-2026).\n- HECHO: target consenso ~$322,82 (46 analistas, Buy) y $333,18 en TipRanks; Wedbush $350 — upside de solo 4-12% desde $311 (ago-2026).\n- LECTURA: a 35x, la valuación exige que el ciclo iPhone 18/Fold y la monetización de Siri compensen 2-3pp de compresión de margen por memoria; poco margen de error.","tecnico":"- Precio $311: prácticamente sobre su SMA50 (+0,4%) y +11,5% sobre SMA200 — la caída post-earnings se frenó justo en el soporte de mediano plazo.\n- RSI 45,8 neutral; percentil 1Y de 73,8: corrigió desde el máximo de $344,57 sin romper la estructura alcista.\n- Semana +0,7%: estabilización, no rebote; volatilidad 30d ~40, elevada para AAPL.\n- Relativo 30d vs benchmark -1,7%: bajo rendimiento leve, sin capitulación.\n- LECTURA: sin cambio de carácter aún — ni ruptura bajista confirmada ni reversión alcista; el rango $300-315 define el corto plazo.","catalizadores":"**Catalizadores:**\n- Evento iPhone 18 + iPhone Fold en septiembre: primer factor de forma nuevo en años, potencial supercycle.\n- Ternus asume el 1-sep: primera transición desde 2011, posible reenfoque en producto.\n- Siri renovada «este otoño» con posible tier pago de iCloud+ (nueva línea de monetización de Services).\n- Earnings Q4 FY26 (~29-oct): prueba de que el margen aguanta en 47-48%.\n\n**Riesgos (por materialidad):**\n- Costos de memoria crecientes «más allá de septiembre» — compresión de margen bruto sin fecha de término.\n- P/E 43% sobre su media histórica: riesgo de derating si el ciclo iPhone 18 decepciona.\n- Restricción de oferta de chips limita el upside de unidades pese a demanda fuerte.\n- Rollout de Siri sin resolver en UE y China — retrasa la narrativa IA en ~30% del mercado.","sentimiento":"- HECHO: caída ~6% after-hours tras la guía pese al beat; desde entonces lateraliza ~10% bajo máximos (CNBC/digitalapplied, jul-ago-2026).\n- HECHO: consenso Buy con target ~$322-333, apenas sobre el precio — analistas constructivos pero sin convicción direccional.\n- HECHO: Wedbush mantiene Outperform con $350 apoyado en el ciclo de upgrade de iPhones con IA.\n- LECTURA: ni miedo ni euforia; el sentimiento neutral no ofrece ventaja contrarian, y la sucesión de CEO mantiene una prima suave de incertidumbre.","conclusion":"Apple es la franquicia de mayor calidad del grupo, pero a ~35x con márgenes comprimiéndose por memoria y un target consenso a solo 4% del pre -2026).\n- HECHO: visibilidad de ~$500B en ingresos de Blackwell + Rubin desde inicio de CY2025 hasta fin de CY2026 (CFO Colette Kress).\n- HECHO: EE.UU. habría autorizado a firmas chinas a comprar H200, y NVIDIA evalúa ampliar capacidad de producción del chip (Investing.com/Finviz, ago-2026).\n- HECHO: compromisos de compra por $119B — riesgo de inventario real si la demanda algún día se enfría (24/7 Wall St, ago-2026).","valuacion":"- HECHO: P/E 33,4x trailing / 21,9x forward — 38% por debajo de su media de 10 años (54,2x) (fullratio/stockanalysis, ago-2026).\n- HECHO: market cap ~$4,31T; la acción sube ~23% en 52 semanas (stockanalysis, ago-2026).\n- HECHO: target consenso ~$302,83 (rango $250-500), 36 de 37 analistas en compra — implica ~+38% desde $219 (24/7 Wall St, ago-2026).\n- LECTURA: pagar ~22x forward por el líder con crecimiento guiado sin China (que hoy vale cero en el modelo) es razonable; el riesgo central no es el múltiplo sino la durabilidad del capex de sus 4-5 grandes clientes.","tecnico":"- Precio $219,22: +6,5% sobre SMA50 y +13,2% sobre SMA200; recuperó el nivel de $210 perdido en la corrección de julio (FX Leaders, 4-ago-2026).\n- Semana +9,2% y +3,4% hoy: cambio de carácter positivo confirmado tras el susto de «financiamiento circular».\n- RSI 61,6: momentum sano, aún sin sobrecompra; percentil 1Y de 76,1, ~7% bajo el máximo de $236,54 (14-may).\n- Relativo 30d vs benchmark +9,9%: liderazgo de mercado recuperado.\n- LECTURA: el rebote pre-earnings ya recorrió gran parte del camino — comprar hoy es pagar el evento; la entrada con ventaja quedó en $195-210.","catalizadores":"**Catalizadores:**\n- Earnings 26-ago: la guía Q3 FY27 será lo determinante, más que el print de $91B.\n- Formalización de licencias H200 a China: revenue no incluido en guía = upside puro; NVDA ya evalúa ampliar capacidad.\n- Ramp de Blackwell Ultra y cronograma de Rubin con $500B de visibilidad declarada.\n- Capex de hiperescaladores en máximos históricos (AMZN $220B, GOOG ~$200B) con demanda supply-constrained.\n\n**Riesgos (por materialidad):**\n- Barra de expectativas altísima: cumplir $91B no basta, hay que volver a subir la guía con consenso ya en $91,8B.\n- Temores de «financiamiento circular» en acuerdos con neoclouds y clientes participados — puede reactivarse con cualquier titular.\n- $119B en compromisos de compra: riesgo de inventario si el ciclo de capex se corta.\n- Concentración extrema de ingresos en 4-5 hiperescaladores y dependencia regulatoria (licencias China revocables).","sentimiento":"- HECHO: 36 de 37 analistas en compra (97%) con consenso $302,83 — unanimidad casi total (24/7 Wall St, ago-2026).\n- HECHO: flujo de notas pre-earnings dominado por titulares alcistas («hyperscaler guarantee», «blockbuster earnings»).\n- LECTURA contrarian: la unanimidad deja poco comprador marginal si la guía solo cumple; el +9% semanal ya paga parte de la sorpresa positiva.\n- LECTURA: no hay euforia minorista de tipo burbuja — el pesimismo de julio (circular financing) se purgó; sentimiento optimista pero no eufórico.","conclusion":"Nvidia mantiene los mejores fundamentales del grupo: guía de $91B sin contar China, capex de clientes en máximos y $500B de visibilidad Blackwell/Rubin, a una valuación (22x forward) muy por debajo de su historia. Pero el setup de corto plazo es exigente: rebote de +9% semanal, consenso unánime y un evento binario el 26-ago donde cumplir no basta — hay que volver a subir la barra. Mantener posiciones; para capital nuevo preferimos compra parcial en debilidad hacia $195-210 o después del 26-ago con la incertidumbre resuelta. Las licencias H200 a China son la opción gratuita de la tesis."},"scores":{"tecnica":{"score":60,"just":"Cambio de carácter positivo real: recuperó $210 y las medias tras la corrección de julio, con RSI 61,6 sin sobrecompra. Se descuenta puntaje porque el rebote de +9,2% semanal ya consumió parte de la ventaja de entrada pre-evento."},"fundamental":{"score":80,"just":"Guía $91B oducción récord de NdPr 917 t (+63%) y ventas 1.006 t (+117%) (MP IR, may-2026).\n- HECHO: acuerdo DoD (jul-2025) vigente: piso de $110/kg para NdPr por 10 años vía contract-for-difference, préstamo de $150M para separación de pesadas, y compromiso de compra del 100% de los imanes del 10X (10.000 t/año NdFeB, comisionado 2028); $1.000M de financiamiento comprometido por JPMorgan/Goldman (MP IR / FAS).\n- HECHO: acuerdo Apple $500M (jul-2025) vigente: imanes de tierras raras 100% recicladas desde Independence (Fort Worth), envíos desde 2027.\n- HECHO: Magnetics (Independence) en Q1 2026: revenue $21,1M (+306% a/a) y EBITDA de segmento $9,6M; 10X con groundbreaking realizado y comisionado de separación de pesadas por iniciarse en Mountain Pass (MP IR, may-2026).\n- HECHO: MOFCOM incluyó a MP en su lista de control (22-jun-2026), vetando exportaciones chinas de ítems dual-use hacia la empresa. LECTURA: no afecta ventas (MP dejó de vender concentrado a China en 2025) pero puede encarecer equipos/insumos; alcance completo no verificable.","valuacion":"- HECHO: sin P/E trailing (pérdidas TTM, EPS -$0,34); forward P/E ~99x y P/S TTM ~20x (stockanalysis.com, ago-2026) — el precio descuenta la ejecución 2027-28, no las utilidades actuales.\n- HECHO: target consenso ~$77,5-79,5, Strong Buy, 18 compras / 0 ventas (CNN / Investing.com, jul-ago 2026): ~+62% de upside implícito.\n- HECHO: NdPr óxido en ¥747-767/kg (~US$112-115/kg) a fines de jul-2026, sobre el piso DoD de $110; aleación NdPr ~US$133/kg al 1-jul, máximo 2026 (Mainrich / Rare Earth Exchanges, jul-2026). LECTURA: con spot > piso, el CFD del DoD pasa de subsidio a opción gratuita.\n- HECHO: InvestingPro había marcado sobrevaluación en los máximos y 'acertó' la caída de ~50% (Investing.com, jul-2026). LECTURA: tras el -52% desde el pico, la acción está barata vs su rango 12m pero cara vs fundamentales corrientes; el valor real depende de la capacidad de imanes ya contratada.\n- LECTURA: dilución potencial (warrants/preferentes del DoD, ~178M acciones hoy) modera el upside por acción; no cuantificada aquí — no verificable sin el 10-Q más reciente.","tecnico":"- Piso en $38,10 (29-jul), prácticamente el mínimo 52-sem ($37,81), seguido de reversión en V: +25,75% en 5 ruedas con velas de +9,3%, +6,0% y +8,3% — evidencia de cambio de carácter tras la bajista feb-jul.\n- RSI pasó de sobreventa extrema (<30 el 22-jul, metalschannel) a zona neutral-alta: la estructura de mínimos decrecientes se rompió al recuperar $43-44.\n- Precio aún -52% bajo el máximo 52-sem; resistencias en ~$49-52 (zona perdida en jun tras la blacklist) y luego ~$57,5.\n- Beta 1,92 (stockanalysis.com): amplifica ambos lados; el rebote actual llega justo antes de un evento binario (earnings 6-ago), con gap risk elevado.\n- Volumen de la semana de rebote: no verificable al cierre del 5-ago; la amplitud de las velas sugiere participación institucional, no solo short covering.","catalizadores":"**Catalizadores:**\n- Earnings Q2 2026 mañana (6-ago): consenso $95,7M / EPS aj. $0,01; confirmación de EBITDA ajustado positivo y ramp de Magnetics sería validación clave de la tesis.\n- Comisionado de separación de tierras raras pesadas en Mountain Pass (2S26): primera capacidad de pesadas a escala en EE.UU., financiada con $150M del DoD.\n- Inicio de envíos de imanes reciclados a Apple (2027) y avance del 10X (10.000 t/año, 2028) con $1.000M de JPMorgan/Goldman comprometidos.\n- Escalada de controles chinos (blacklist a MP el 22-jun; extensión a 14 firmas de la UE el 24-jul) sostiene el premium ex-China de NdPr sobre el piso de $110/kg.\n\n**Riesgos (por materialidad):**\n- Ejecución del salto de escala en imanes (Independence ~1.000 t → 10X 10.000 t hacia 2028): retrasos o sobrecostos romperían la tesis que justifica el múltiplo.\n- Valuación exigente (forward P/E ~99x, P/S ~20x): sin margen de error si NdPr recae bajo $110 y el negocio queda dependiendo del CFD estatal.\n- Blacklist china sobre ítems dual-use puede encarecer capex/opex de las expansiones; magnitud no verificable.\n- Insider selling elevado (>1,2M acciones vendidas por ejecutivos incl. CEO/CFO en el último trimestre; tickeron, jul-2026) y dilución potencial por instrumentos del DoD.","sentimiento":"- HECHO: consenso sell-side unánime en Strong Buy (18 compras, 0 ventas), target ~$77,5 (CNN / stockanalysis, ago-2026) — sin capitulación de analistas pese al -52% desde el pico.\n- HECHO: RSI entró en sobreventa (<30) el 22-jul (metalschannel) tras la ola de ventas por la blacklist china y el insider selling: extremo de miedo clásico.\n- LECTURA contrarian: el punto de máximo pesimismo fue fines de julio; el rebote de +25,7% ya consumió parte de esa ventana. Con el sell-side 100% comprador, el contrarian puro hoy es neutral, no alcista.\n- LECTURA: prensa dividida — notas de 'fair value acertó la caída de 50%' conviven con 'mejor acción de reshoring' — dispersión narrativa típica de un stock-historia dependiente de política industrial.","conclusion":"MP es la apuesta estructural de EE.UU. en tierras raras: piso DoD de $110/kg por 10 años, offtake del 100% del 10X, Apple $500M y Q1 2026 ya con EBITDA ajustado positivo — el downside de flujo está contractualmente acotado y el upside depende de ejecutar imanes 2027-28. Pero el punto de entrada táctico óptimo fue la capitulación de julio ($38-42); tras +25,75% en una semana y un earnings binario mañana, comprar hoy es pagar el rebote. Plan: esperar el reporte del 6-ago y acumular en retrocesos hacia $42-45 con la tesis confirmada. Invalidación: cierre sostenido bajo $37,8 o daño al acuerdo DoD."},"scores":{"tecnica":{"score":60,"just":"Cambio de carácter genuino: reversión en V desde el soporte 52-sem con RSI saliendo de sobreventa (<30 el 22-jul) y ruptura de la secuencia de mínimos decrecientes. Se descuenta puntaje por extensión de corto plazo (+25,75% en 5 ruedas) justo antes de un evento binario — no se premia la dirección, se premia la evidencia, y parte de ella ya está <script id="stock-data" type="application/json">__STOCKS_JSON__</script>
<script>
  "use strict";
  const ORDER = ["AAPL","MSFT","NVDA","GOOGL","AMZN","TSLA","MU","MP","SPCX","BTC","HDSY","CLSK","MSTR","CCU","CMPC","CENCOSUD","USD/CLP","EUR/USD","USD/JPY"];
  const _staticData = JSON.parse(document.getElementById("static-data").textContent);
  const _dynData = JSON.parse(document.getElementById("stock-data").textContent);
  const _byTicker = {};
  _staticData.forEach((s) => (_byTicker[s.ticker] = s));
  _dynData.forEach((s) => (_byTicker[s.ticker] = s));
  const STOCKS = ORDER.filter((t) => _byTicker[t]).map((t) => _byTicker[t])
    .concat(Object.values(_byTicker).filter((s) => !ORDER.includes(s.ticker)));
  const REPORT_DATE = "18 de julio de 2026"; // fallback para activos sin reportDate propio
  const reportDateOf = (s) => s.reportDate || REPORT_DATE;
  const DEFAULT_WEIGHTS = { tecnica: 25, fundamental: 25, sentimiento: 20, riesgo: 15, conviccion: 15 };
  const CATS = [
    { key: "tecnica", name: "Fortaleza Técnica" },
    { key: "fundamental", name: "Calidad Fundamental" },
    { key: "sentimiento", name: "Sentimiento y Momentum" },
    { key: "riesgo", name: "Perfil de Riesgo" },
    { key: "conviccion", name: "Convicción de Tesis" },
  ];
  const GRADES = [
    { min: 85, grade: "A+", signal: "Strong Buy", cls: "good" },
    { min: 70, grade: "A", signal: "Buy", cls: "good" },
    { min: 55, grade: "B", signal: "Hold", cls: "warning" },
    { min: 40, grade: "C", signal: "Caution", cls: "serious" },
    { min: 25, grade: "D", signal: "Caution", cls: "critical" },
    { min: 0, grade: "F", signal: "Avoid", cls: "critical" },
  ];
  const OPP_CATS = [
    { key: "valuacion_hist", name: "Valuación vs su historia", weight: 25 },
    { key: "asimetria", name: "Asimetría al precio actual", weight: 25 },
    { key: "calidad", name: "Calidad del negocio", weight: 20 },
    { key: "catalizadores", name: "Ruta de catalizadores", weight: 15 },
    { key: "contrarian", name: "Señal contraria", weight: 15 },
  ];
  const OPP_SIGNALS = [
    { min: 80, label: "Comprar escalonado", cls: "good" },
    { min: 65, label: "Acumular en zona", cls: "good" },
    { min: 50, label: "Esperar gatillo", cls: "warning" },
    { min: 35, label: "Mantener / Observar", cls: "serious" },
    { min: 0, label: "Reducir / Evitar", cls: "critical" },
  ];
  function compositeOpp(stock) {
    const o = stock.opportunity;
    if (!o || !o.cats) return null;
    let sum = 0, w = 0;
    OPP_CATS.forEach((c) => {
      const v = o.cats[c.key] && o.cats[c.key].score;
      if (v != null) { sum += v * c.weight; w += c.weight; }
    });
    return w ? Math.round(sum / w) : null;
  }
  function oppSignalFor(score) {
    return OPP_SIGNALS.find((s) => score >= s.min) || OPP_SIGNALS[OPP_SIGNALS.length - 1];
  }

  const SECTIONS = [
    { num: 1, key: "resumen", title: "Resumen ejecutivo", nav: "Resumen" },
    { num: 2, key: "fundamental", title: "Análisis fundamental", nav: "Fundamental" },
    { num: 3, key: "valuacion", title: "Valuación", nav: "Valuación" },
    { num: 4, key: "tecnico", title: "Análisis técnico", nav: "Técnico" },
    { num: 5, key: "catalizadores", title: "Catalizadores y riesgos", nav: "Catalizadores" },
    { num: 6, key: "sentimiento", title: "Sentimiento", nav: "Sentimiento" },
    { num: 7, key: "score", title: "Score Compuesto", nav: "Score" },
    { num: 8, key: "conclusion", title: "Conclusión", nav: "Conclusión" },
  ];
  const STAT_LABELS = {
    precio: "Precio",
    rango52s: "Rango 52 sem.",
    marketCap: "Market cap",
    pe: "P/E",
    targetConsenso: "Target consenso",
    proximoEarnings: "Próx. earnings",
  };
  const DISCLAIMER =
    "Este informe es una herramienta de investigación educativa generada con IA. No constituye " +
    "asesoría de inversión ni recomendación de compra/venta. Verifique todos los datos de forma " +
    "independiente antes de tomar decisiones financieras.";

  const DATA_DATE = "__DATA_DATE__";
  const MODES = {
    equity: {
      title: "Stock Research — Dashboard de Equity Research",
      brand: "Stock Research",
      meta: "Equity research + score compuesto · investigado vía web search el " + DATA_DATE,
      note:
        "El score 0–100 pondera 5 categorías (técnica 25% · fundamental 25% · sentimiento 20% · " +
        "riesgo 15% · convicción 15%). Es una lectura cuantitativa, no una recomendación. " +
        "Los pesos son ajustables en la sección de score.",
      filter: (s) => !s.ticker.includes("/"),
    },
    fx: {
      title: "Stock Research — Dashboard FX Research",
      brand: "FX Research",
      meta: "Research de divisas + score compuesto FX · investigado vía web search el " + DATA_DATE,
      note:
        "El score FX 0–100 pondera 5 categorías (tasas 30% · macro 20% · técnico 20% · " +
        "posicionamiento 15% · riesgo de intervención 15%). La señal explicita ambos lados del par " +
        "(p. ej. 'Compra USD / Venta CLP'): score alto favorece a la divisa base, score bajo a la contraparte. " +
        "Es una lectura cuantitativa, no una recomendación.",
      filter: (s) => s.ticker.includes("/"),
    },
    calendar: {
      title: "Stock Research — Calendario de eventos",
      brand: "Calendario",
      meta: "Fechas clave de resultados y eventos macro · investigado vía web search el " + DATA_DATE,
      note:
        "El calendario agrega automáticamente las fechas relevantes (resultados, bancos centrales, " +
        "eventos corporativos) de todos los activos cubiertos, tanto de equity como de FX.",
      filter: () => true,
    },
    tech: {
      title: "Stock Research — Panel Técnico",
      brand: "Panel Técnico",
      meta: "Estado técnico de toda la cobertura · TradingView (scanner) · " + DATA_DATE,
      note:
        "Datos 100% mecánicos calculados a diario desde TradingView, separados de la " +
        "interpretación cualitativa de los informes.",
      filter: () => true,
    },
  };
  const NOTE_UPD =
    "<br><br><strong>Actualización:</strong> los datos fueron investigados vía web search el " + DATA_DATE +
    " y son estáticos. Para refrescarlos o agregar un activo, pídeselo a Claude en la conversación " +
    "del proyecto — la página se actualiza en esta misma URL.";

  const state = { mode: "equity", ticker: STOCKS[0].ticker, weights: { ...DEFAULT_WEIGHTS }, query: "", techSort: { key: "ticker", dir: 1 }, calFilter: null };

  function modeAssets() {
    return STOCKS.filter(MODES[state.mode].filter);
  }
  function applyMode(mode) {
    state.mode = mode;
    const m = MODES[mode];
    document.title = m.title;
    document.getElementById("brandName").textContent = m.brand;
    document.getElementById("metaLine").textContent = m.meta;
    document.getElementById("railNote").innerHTML = m.note + NOTE_UPD;
    document.querySelectorAll("#modeSwitch button, #tabBar button").forEach((b) => {
      const on = b.dataset.mode === mode;
      b.classList.toggle("active", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
    });
    document.querySelector(".layout").classList.toggle("cal-mode", mode === "calendar" || mode === "tech");
    const assets = modeAssets();
    if (mode !== "calendar" && mode !== "tech" && !assets.some((s) => s.ticker === state.ticker)) state.ticker = assets[0].ticker;
    state.query = "";
    document.getElementById("search").value = "";
    render();
    window.scrollTo({ top: 0 });
  }

  function statsPairs(s) {
    return s.statsList || Object.keys(STAT_LABELS).map((k) => [STAT_LABELS[k], s.stats[k]]);
  }
  function priceOf(s) {
    const raw = statsPairs(s)[0][1];
    return (raw.match(/^[$¥€]?[\d.,]+/) || [raw])[0];
  }
  function catsOf(s) {
    return s.customCats || CATS.map((c) => ({ key: c.key, name: c.name, weight: DEFAULT_WEIGHTS[c.key] }));
  }
  function signalOf(s, g) {
    if (!s.baseCurrency) return g.signal;
    const parts = s.ticker.split("/");
    const base = s.baseCurrency;
    const quote = parts[0] === base ? parts[1] : parts[0];
    if (g.min >= 85) return `Compra fuerte ${base} / Venta ${quote}`;
    if (g.min >= 70) return `Compra ${base} / Venta ${quote}`;
    if (g.min >= 55) return `Neutral ${base}/${quote} — sin sesgo direccional`;
    if (g.min >= 25) return `Caution — sesgo Venta ${base} / Compra ${quote}`;
    return `Venta ${base} / Compra ${quote}`;
  }
  const REPO_URL = "https://github.com/AgustinMosqueira/stock-dashboard";
  function requestUrl(ticker, tipo) {
    const t = String(ticker).toUpperCase();
    let body, title;
    if (tipo === "alta") {
      title = "informe: " + t;
      body = `Solicito el informe de ${t}.\n\nSi el ticker es ambiguo, indica aquí el símbolo exacto de TradingView (ej. NASDAQ:${t}).\n\nEnviado desde el dashboard.`;
    } else if (tipo === "eliminar") {
      title = "eliminar: " + t;
      body = `Solicito ELIMINAR ${t} del dashboard.\n\nSu histórico de precios queda archivado por si se vuelve a agregar más adelante.\n\nEnviado desde el dashboard.`;
    } else {
      title = "informe: " + t;
      body = `Solicito ACTUALIZAR el informe de ${t}.\n\nEnviado desde el dashboard.`;
    }
    return `${REPO_URL}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
  }
  function matches(s, q) {
    return s.ticker.toLowerCase().includes(q) || s.company.toLowerCase().includes(q);
  }
  function fmtPct(v) {
    if (v === null || v === undefined) return null;
    const sign = v > 0 ? "+" : v < 0 ? "−" : "";
    return sign + Math.abs(v).toFixed(2).replace(".", ",") + " %";
  }
  function deltaSpan(v, extraCls) {
    const f = fmtPct(v);
    if (f === null) return "";
    const dir = v > 0 ? "up" : v < 0 ? "down" : "flat";
    return `<span class="delta ${dir}${extraCls ? " " + extraCls : ""}">${f}</span>`;
  }

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function inline(s) {
    return s
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\bHECHO(?=\s*:|\b)/g, '<span class="badge hecho">HECHO</span>')
      .replace(/\bLECTURA(?=\s*:|\b)/g, '<span class="badge lectura">LECTURA</span>');
  }
  function md(text) {
    const blocks = esc(text).split(/\n\s*\n/);
    return blocks
      .map((b) => {
        const lines = b.split("\n").map((l) => l.trim()).filter(Boolean);
        if (!lines.length) return "";
        if (lines.every((l) => /^[-•] /.test(l))) {
          return "<ul>" + lines.map((l) => "<li>" + inline(l.slice(2)) + "</li>").join("") + "</ul>";
        }
        if (lines.length >= 2 && lines.every((l) => l.startsWith("|"))) {
          const cells = (l) => l.replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
          const head = cells(lines[0]);
          const rows = lines.slice(1).filter((l) => !/^\|[\s\-:|]+\|$/.test(l)).map(cells);
          return (
            '<div class="md-table"><table><thead><tr>' + head.map((c) => `<th>${c}</th>`).join("") +
            "</tr></thead><tbody>" +
            rows.map((r) => "<tr>" + r.map((c) => `<td>${c}</td>`).join("") + "</tr>").join("") +
            "</tbody></table></div>"
          );
        }
        if (lines.length === 1 && /^#{2,4} /.test(lines[0])) {
          return '<p class="md-h">' + inline(lines[0].replace(/^#{2,4} /, "")) + "</p>";
        }
        return "<p>" + inline(lines.join(" ")) + "</p>";
      })
      .join("");
  }

  function normWeights(w) {
    const sum = CATS.reduce((a, c) => a + w[c.key], 0);
    if (sum === 0) return { norm: { ...DEFAULT_WEIGHTS }, sum: 0 };
    const norm = {};
    CATS.forEach((c) => (norm[c.key] = (w[c.key] / sum) * 100));
    return { norm, sum };
  }
  function composite(stock, weights) {
    if (stock.customCats) {
      return Math.round(stock.customCats.reduce((a, c) => a + stock.scores[c.key].score * c.weight / 100, 0));
    }
    const { norm } = normWeights(weights);
    return Math.round(CATS.reduce((a, c) => a + stock.scores[c.key].score * norm[c.key] / 100, 0));
  }
  function gradeFor(score) {
    return GRADES.find((g) => score >= g.min);
  }

  function gaugeSVG(score, size) {
    const r = size / 2 - 7;
    const cx = size / 2, cy = size / 2;
    const start = 135, sweepMax = 270;
    const sweep = sweepMax * score / 100;
    const arc = (a0, a1, color, wd) => {
      const p = (a) => {
        const rad = (a - 90) * Math.PI / 180;
        return `${(cx + r * Math.cos(rad)).toFixed(2)} ${(cy + r * Math.sin(rad)).toFixed(2)}`;
      };
      const large = a1 - a0 > 180 ? 1 : 0;
      return `<path d="M ${p(a0)} A ${r} ${r} 0 ${large} 1 ${p(a1)}" fill="none" stroke="${color}" stroke-width="${wd}" stroke-linecap="round"/>`;
    };
    let marks = "";
    for (let v = 0; v <= 100; v += 25) {
      const a = (start + sweepMax * v / 100 - 90) * Math.PI / 180;
      const r1 = r - 8, r2 = r - 12;
      marks += `<line x1="${(cx + r1 * Math.cos(a)).toFixed(1)}" y1="${(cy + r1 * Math.sin(a)).toFixed(1)}" x2="${(cx + r2 * Math.cos(a)).toFixed(1)}" y2="${(cy + r2 * Math.sin(a)).toFixed(1)}" stroke="var(--hairline)" stroke-width="1.5"/>`;
    }
    return (
      `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Score compuesto ${score} de 100">` +
      arc(start, start + sweepMax, "var(--track)", 9) +
      (score > 0 ? arc(start, start + Math.max(sweep, 3), "var(--accent)", 9) : "") +
      marks +
      `</svg>`
    );
  }

  function renderRail() {
    const assets = modeAssets();
    document.getElementById("railCount").textContent = assets.length;
    const list = document.getElementById("stockList");
    const q = state.query.trim().toLowerCase();
    const shown = q ? assets.filter((s) => matches(s, q)) : assets;
    let html = shown.map((s) => {
      const sc = composite(s, state.weights);
      const g = gradeFor(sc);
      return (
        `<button class="stock-card${s.ticker === state.ticker ? " active" : ""}" data-t="${s.ticker}" aria-pressed="${s.ticker === state.ticker}">` +
        `<span class="t">${s.ticker} ${deltaSpan(s.change && s.change.day)}</span>` +
        `<span class="score-chip grade-${g.cls}"><span class="v">${sc}</span><span class="g">${g.grade}</span></span>` +
        `<span class="n">${esc(s.company)}</span>` +
        `<span class="p">${esc(priceOf(s))}</span>` +
        (s.change && s.change.week != null ? `<span class="pw">Semana: ${deltaSpan(s.change.week)}</span>` : "") +
        `</button>`
      );
    }).join("");
    if (q && shown.length === 0) {
      html =
        `<div class="no-match">` +
        `<p><span class="q">${esc(state.query.trim().toUpperCase())}</span> no está en la cobertura actual.</p>` +
        `<p>Este dashboard no puede investigar activos nuevos por sí solo: los informes se generan con búsqueda web al momento del análisis.</p>` +
        `<p>Puedes pedir su informe desde aquí: se investiga con la misma metodología (score de pulso, oportunidad 6-18 meses y plan de acción) y aparece en esta misma URL en ~15-20 minutos. Te aviso por Telegram cuando esté.</p>` +
        `<a class="ask-btn" target="_blank" rel="noopener" href="${requestUrl(state.query.trim(), "alta")}">📄 Solicitar informe de ${esc(state.query.trim().toUpperCase())}</a>` +
        `<p class="ask-note">Se abre GitHub con la solicitud lista: solo toca «Create». Requiere tu sesión de GitHub (nadie más puede pedirlo).</p>` +
        `</div>`;
    }
    list.innerHTML = html;
    list.querySelectorAll(".stock-card").forEach((b) =>
      b.addEventListener("click", () => {

  function scoreSection(stock) {
    const { norm, sum } = normWeights(state.weights);
    const cats = catsOf(stock);
    const sc = composite(stock, state.weights);
    const g = gradeFor(sc);
    const sig = signalOf(stock, g);
    const rows = cats.map((c) => {
      const v = stock.scores[c.key].score;
      const w = stock.customCats ? c.weight : norm[c.key];
      return (
        `<div class="cat-row">` +
        `<div class="name">${esc(c.name)}<span class="w">${w.toFixed(0)}%</span></div>` +
        `<div class="bar"><div class="fill" style="width:${v}%"></div></div>` +
        `<div class="val"><b>${v}</b> · ${(v * w / 100).toFixed(1)}</div>` +
        `</div>` +
        `<div class="cat-just">${inline(esc(stock.scores[c.key].just))}</div>`
      );
    }).join("");
    let weightsBlock = "";
    if (!stock.customCats) {
      const sliders = CATS.map(
        (c) =>
          `<label for="w-${c.key}">${c.name}</label>` +
          `<input type="range" id="w-${c.key}" data-k="${c.key}" min="0" max="60" step="5" value="${state.weights[c.key]}">` +
          `<div class="wv" id="wv-${c.key}">${state.weights[c.key]}%</div>`
      ).join("");
      const sumWarn = sum !== 100 ? `<span class="warn">Los pesos suman ${sum}% — se normalizan proporcionalmente a 100%.</span>` : "";
      weightsBlock =
        `<details class="weights"><summary>Ajustar pesos del score</summary>` +
        `<div class="w-grid">${sliders}</div>` +
        `<div class="w-foot">${sumWarn}<button class="btn" id="resetW" type="button">Restaurar pesos por defecto</button></div>` +
        `</details>`;
    } else {
      weightsBlock = `<p class="score-note">Este activo usa las categorías y pesos específicos de su metodología (fijos, no ajustables).</p>`;
    }
    return (
      `<div class="score-detail">` +
      rows +
      `<div class="score-total"><span class="num">${sc} / 100</span>` +
      `<span class="grade-pill grade-${g.cls}"><span class="dot"></span>Señal: ${esc(sig)} · Grado ${g.grade}</span></div>` +
      `<p class="signal-close"><strong>Señal: ${esc(sig)}</strong> (Grado ${g.grade} — ${sc}/100)` +
      (stock.baseCurrency ? ` — un score alto favorece a la divisa base (${esc(stock.baseCurrency)}); la señal indica qué se compra y qué se vende en el par` : "") +
      `, sustentada en el desglose de las 5 categorías: ` +
      cats.map((c) => `${esc(c.name)} ${stock.scores[c.key].score}`).join(" · ") + `.</p>` +
      `<p class="score-note">La señal traduce el score cuantitativo a la escala convencional de research y nunca se presenta sin su desglose; no es una orden de ejecución.</p>` +
      weightsBlock +
      `</div>`
    );
  }

  function opportunitySection(stock) {
    const o = stock.opportunity;
    const os = compositeOpp(stock);
    const sig = oppSignalFor(os);
    const rows = OPP_CATS.map((c) => {
      const cat = o.cats[c.key] || {};
      const v = cat.score != null ? cat.score : 50;
      return (
        `<div class="cat-row">` +
        `<div class="name">${esc(c.name)}<span class="w">${c.weight}%</span></div>` +
        `<div class="bar"><div class="fill" style="width:${v}%"></div></div>` +
        `<div class="val"><b>${v}</b> · ${(v * c.weight / 100).toFixed(1)}</div>` +
        `</div>` +
        `<div class="cat-just">${inline(esc(cat.just || ""))}</div>`
      );
    }).join("");
    const p = o.plan || {};
    const gatillos = (p.gatillos || []).map((g) => `<li>${esc(g)}</li>`).join("");
    const item = (l, v) => v ? `<div class="opp-item"><div class="l">${l}</div><div class="v">${esc(v)}</div></div>` : "";
    const plan =
      `<div class="opp-plan">` +
      item("Recomendación", p.recomendacion) +
      item("Zona de compra", p.zona_compra) +
      item("Invalidación (stop)", p.invalidacion) +
      (gatillos ? `<div class="opp-item"><div class="l">Gatillos de confirmación</div><ul class="v opp-gatillos">${gatillos}</ul></div>` : "") +
      item("Horizonte", p.horizonte) +
      item("Tamaño sugerido", p.tamano) +
      item("Confianza", p.confianza) +
      `</div>`;
    return (
      `<div class="score-detail">` +
      `<p class="score-note">A diferencia del score de pulso (estado actual), este score responde: <strong>¿conviene comprar a ESTE precio pensando en 6-18 meses?</strong> Un activo castigado puede tener pulso bajo y oportunidad alta.</p>` +
      rows +
      `<div class="score-total"><span class="num">${os} / 100</span>` +
      `<span class="grade-pill grade-${sig.cls}"><span class="dot"></span>${esc(sig.label)}</span></div>` +
      `<h3 class="opp-h">Plan de acción</h3>` + plan +
      `<p class="score-note">El plan es investigación educativa con niveles concretos para decidir con reglas — no una orden de ejecución ni asesoría de inversión.</p>` +
      `</div>`
    );
  }

  function sectionPlan(stock) {
    if (!stock.customSections) {
      return SECTIONS.map((s) => ({
        num: s.num, key: s.key, title: s.title, nav: s.nav,
        body: s.key === "score" ? null : stock.sections[s.key],
      }));
    }
    const plan = [];
    let num = 1;
    stock.customSections.forEach((cs) => {
      if (num === stock.scoreIndex) {
        plan.push({ num: num, key: "score", title: "Score Compuesto FX", nav: "Score", body: null });
        num++;
      }
      plan.push({ num: num, key: "cs" + num, title: cs.title, nav: cs.nav || cs.title, body: cs.body });
      num++;
    });
    if (num === stock.scoreIndex) plan.push({ num: num, key: "score", title: "Score Compuesto FX", nav: "Score", body: null });
    return plan;
  }
  function withOpportunity(stock, plan) {
    if (!stock.opportunity || compositeOpp(stock) == null) return plan;
    const i = plan.findIndex((s) => s.key === "score");
    plan.splice(i + 1, 0, { key: "opportunity", title: "Oportunidad y plan de acción (6-18 meses)", nav: "Oportunidad", body: null });
    plan.forEach((s, idx) => (s.num = idx + 1));
    return plan;
  }

  // — Calendario de eventos —
  const MONTHS_ES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const MONTH_ABBR = { ene: 0, feb: 1, mar: 2, abr: 3, may: 4, jun: 5, jul: 6, ago: 7, sep: 8, sept: 8, set: 8, oct: 9, nov: 10, dic: 11 };
  const WEEKDAYS_ES = ["dom","lun","mar","mié","jue","vie","sáb"];
  const KIND_LABELS = { earnings: "Resultados", macro: "Macro", corporate: "Corporativo" };

  function busDaysUntil(d, today0) {
    let n = 0;
    const cur = new Date(today0);
    while (cur < d && n < 30) {
      cur.setDate(cur.getDate() + 1);
      const wd = cur.getDay();
      if (wd !== 0 && wd !== 6) n++;
    }
    return n;
  }
  function parseISODate(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function parseSpanishDate(txt) {
    const m = /(\d{1,2})[-\s]*(ene|feb|mar|abr|may|jun|jul|ago|sept|sep|set|oct|nov|dic)[a-z]*\.?[-\s]*(\d{4})/i.exec(txt || "");
    if (!m) return null;
    const mo = MONTH_ABBR[m[2].toLowerCase()];
    return mo == null ? null : new Date(+m[3], mo, +m[1]);
  }
  function assetEvents(s) {
    const out = (s.events || [])
      .map((e) => ({ ...e, d: parseISODate(e.date) || parseSpanishDate(e.date) }))
      .filter((e) => e.d && e.label);
    if (!out.some((e) => (e.kind || "") === "earnings")) {
      const pair = statsPairs(s).find(([l]) => /earnings|evento/i.test(l));
      const d = pair && parseSpanishDate(pair[1]);
      if (d) out.push({ d: d, label: (/earnings/i.test(pair[0]) ? "Resultados — " : "") + pair[1], kind: /earnings/i.test(pair[0]) ? "earnings" : "macro" });
    }
    return out.map((e) => ({ ...e, ticker: s.ticker, isFx: s.ticker.includes("/") }));
  }
  // Agrupación de eventos macro compartidos (FOMC, BCE, IPC…): un mismo evento que
  // afecta a varios activos aparece una sola vez con la lista de afectados.
  const MACRO_KEYS = ["fomc", "fed", "bce", "ecb", "boj", "banco central", "bcch", "tpm",
    "ipc", "cpi", "pce", "payroll", "nfp", "ipom", "halving", "opep", "opec", "jackson hole"];
  function normLabel(l) {
    return (l || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim();
  }
  function eventKey(e) {
    if (e.econ) return null;  // los datos del calendario económico no se agrupan entre sí
    if ((e.kind || "macro") !== "macro") return null;  // earnings/corporate nunca se agrupan
    const n = normLabel(e.label);
    for (const k of MACRO_KEYS) if (n.includes(k)) return "k:" + k;
    return "l:" + n;
  }
  function mergeDay(dayEvts) {
    const groups = new Map();
    let uid = 0;
    dayEvts.forEach((e) => {
      const key = eventKey(e) || "u:" + uid++;
      if (!groups.has(key)) {
        groups.set(key, { ...e, tickers: [e.ticker] });
      } else {
        const g = groups.get(key);
        if (!g.tickers.includes(e.ticker)) g.tickers.push(e.ticker);
        if (e.label.length < g.label.length) g.label = e.label;  // se queda la etiqueta más limpia
        if (!g.time && e.time) g.time = e.time;
        if ((e.info || "").length > (g.info || "").length) g.info = e.info;
      }
    });
    return Array.from(groups.values());
  }

  // indicadores donde un número MÁS ALTO significa economía MÁS DÉBIL
  const ECON_INVERTED = ["jobless claims", "unemployment rate"];
  function econResultInfo(e) {
    if (e.actual == null) return null;
    const ref = e.forecast != null ? e.forecast : e.previous;
    if (ref == null) return null;
    const u = e.unit || "";
    const fmtv = (v) => `${v}${u}`;
    const refName = e.forecast != null ? "lo esperado" : "el dato previo";
    const n = normLabel(e.label);
    const esRateDecision = n.includes("interest rate decision") || n.includes("fomc");
    const diff = e.actual - ref;

    if (e.country === "CL") {
      if (diff === 0) {
        return esRateDecision
          ? `TPM en ${fmtv(e.actual)}, sin sorpresa vs ${refName}. El impacto en el peso y en USD/CLP dependerá del tono del comunicado del BCCh (sesgo futuro de tasas).`
          : `Salió ${fmtv(e.actual)}, en línea con ${refName}: impacto acotado en el peso chileno y USD/CLP; el mercado pasa al siguiente catalizador.`;
      }
      const fuerte = ECON_INVERTED.some((k) => n.includes(k)) ? diff < 0 : diff > 0;
      return fuerte
        ? `Salió ${fmtv(e.actual)} vs ${fmtv(ref)} ${refName}: dato FUERTE para la economía chilena. Apoya al peso (presión BAJISTA para USD/CLP) y respalda que el BCCh mantenga la TPM alta por más tiempo.`
        : `Salió ${fmtv(e.actual)} vs ${fmtv(ref)} ${refName}: dato DÉBIL para la economía chilena. Debilita al peso (presión ALCISTA para USD/CLP) y abre espacio a recortes de TPM del BCCh.`;
    }

    if (esRateDecision && diff === 0) {
      return `Tasa en ${fmtv(e.actual)}, sin sorpresa vs ${refName}. Treasuries y dólar se moverán con el comunicado y la conferencia de prensa (tono hawkish = yields y dólar arriba; dovish = abajo).`;
    }
    if (diff === 0) {
      return `Salió ${fmtv(e.actual)}, en línea con ${refName}: impacto acotado — Treasuries y dólar suelen quedar donde estaban, a la espera del próximo catalizador.`;
    }
    const fuerte = ECON_INVERTED.some((k) => n.includes(k)) ? diff < 0 : diff > 0;
    return fuerte
      ? `Salió ${fmtv(e.actual)} vs ${fmtv(ref)} ${refName}: dato FUERTE (lectura hawkish). Respalda a la Fed en mantener tasas altas → rendimientos de los Treasuries al ALZA (cae su precio) y presión ALCISTA para el dólar.`
      : `Salió ${fmtv(e.actual)} vs ${fmtv(ref)} ${refName}: dato DÉBIL (lectura dovish). Abre espacio a recortes de la Fed → rendimientos de los Treasuries a la BAJA (sube su precio) y presión BAJISTA para el dólar.`;
