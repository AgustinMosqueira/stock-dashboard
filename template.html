  function renderCalendar() {
    const today = new Date();
    const today0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const f = state.calFilter;
    const evts = STOCKS.flatMap(assetEvents)
      .filter((e) => e.d >= today0)
      .filter((e) => !f || e.ticker === f)
      .sort((a, b) => a.d - b.d || (b.kind === "earnings") - (a.kind === "earnings") || a.ticker.localeCompare(b.ticker));

    const byDay = new Map();
    evts.forEach((e) => {
      const k = e.d.getTime();
      if (!byDay.has(k)) byDay.set(k, []);
      byDay.get(k).push(e);
    });
    // eventos económicos: se agregan después de los de activos, ordenados por hora
    ECON.map((e) => ({ ...e, d: parseISODate(e.date), econ: true }))
      .filter((e) => e.d && e.d >= today0)
      .filter((e) => !f || (ECON_RELEVANT[e.country] || []).includes(f))
      .sort((a, b) => a.d - b.d || (a.time || "").localeCompare(b.time || ""))
      .forEach((e) => {
        const k = e.d.getTime();
        if (!byDay.has(k)) byDay.set(k, []);
        byDay.get(k).push(e);
      });
    const dayKeys = Array.from(byDay.keys()).sort((a, b) => a - b);
    const byDaySorted = new Map(dayKeys.map((k) => [k, byDay.get(k)]));
    byDay.clear();
    byDaySorted.forEach((v, k) => byDay.set(k, v));

    const chips = [`<button type="button" class="cal-fchip${!f ? " active" : ""}" data-f="">Todos</button>`]
      .concat(STOCKS.map((s) =>
        `<button type="button" class="cal-fchip${f === s.ticker ? " active" : ""}" data-f="${esc(s.ticker)}">${esc(s.ticker)}</button>`))
      .join("");
    let html = `<div class="cal-wrap"><div class="cal-head"><h1>Calendario de eventos</h1>` +
      `<p class="sub">Resultados, bancos centrales, eventos corporativos y datos económicos 🇺🇸/🇨🇱 · ` +
      `de hoy en adelante · datos del ${esc(DATA_DATE)}</p></div>` +
      `<div class="cal-filter" role="tablist" aria-label="Filtrar calendario por activo">${chips}</div>` +
      (f ? `<div class="cal-fstatus"><span>📌 Calendario filtrado por <b>${esc(f)}</b></span>` +
           `<button type="button" class="cal-fclear">Quitar filtro ✕</button></div>` : "");

    // — Resultados de ayer: la VISTA muestra solo ayer (pedido del usuario);
    // los datos igual se recolectan con 3 días de ventana para auto-repararse. —
    const from7 = new Date(today0);
    from7.setDate(from7.getDate() - 1);
    const pastEvts = STOCKS.flatMap(assetEvents)
      .filter((e) => e.d >= from7 && e.d < today0)
      .filter((e) => !f || e.ticker === f)
      .concat(ECON.map((e) => ({ ...e, d: parseISODate(e.date), econ: true }))
        .filter((e) => e.d && e.d >= from7 && e.d < today0)
        .filter((e) => !f || (ECON_RELEVANT[e.country] || []).includes(f)));
    if (pastEvts.length) {
      const byPastDay = new Map();
      pastEvts.sort((a, b) => b.d - a.d || (a.time || "").localeCompare(b.time || ""))
        .forEach((e) => {
          const k = e.d.getTime();
          if (!byPastDay.has(k)) byPastDay.set(k, []);
          byPastDay.get(k).push(e);
        });
      let inner = "";
      byPastDay.forEach((evts, k) => {
        const d = new Date(k);
        inner += `<div class="cal-past-day">${WEEKDAYS_ES[d.getDay()]} ${d.getDate()} de ${MONTHS_ES[d.getMonth()]}</div>` +
          mergeDay(evts).map(evtRow).join("");
      });
      html += `<details class="cal-past"><summary>📋 Resultados de ayer (${pastEvts.length})` +
        `<span class="cal-past-sub">qué pasó realmente: datos, earnings y bancos centrales</span></summary>${inner}</details>`;
    }

    if (!byDay.size) {
      html += `<div class="cal-empty">No hay eventos fechados en la cobertura actual. Se poblarán con la próxima actualización de datos.</div>`;
    } else {
      let lastMonth = "";
      byDay.forEach((dayEvts, k) => {
        const d = new Date(k);
        const mKey = MONTHS_ES[d.getMonth()] + " " + d.getFullYear();
        if (mKey !== lastMonth) {
          lastMonth = mKey;
          html += `<div class="cal-month">${esc(mKey)}</div>`;
        }
        const isToday = d.getTime() === today0.getTime();
        const isNear = busDaysUntil(d, today0) <= 5;
        const daysAway = Math.round((d - today0) / 86400000);
        const soon = isToday ? "" : (isNear ? `<div class="dwk cal-soon">en ${daysAway} d</div>` : "");
        html += `<div class="cal-day${isToday ? " is-today" : ""}${isNear ? " is-near" : ""}">` +
          `<div class="cal-date"><div class="dnum">${d.getDate()}</div><div class="dwk">${isToday ? "hoy" : WEEKDAYS_ES[d.getDay()]}</div>${soon}</div>` +
          `<div class="cal-evts">` +
          mergeDay(dayEvts).map(evtRow).join("") +
          `</div></div>`;
      });
    }

    html += `<div class="cal-note">Cada activo aporta sus fechas (campo de eventos + "Próx. earnings" de su informe); ` +
      `al agregar un activo nuevo al dashboard, sus fechas aparecen aquí automáticamente. Toca un ticker para abrir su informe. ` +
      `Los datos 🇺🇸/🇨🇱 provienen del calendario económico de TradingView, filtrados con una escala interna de importancia 1-5: solo se incluyen los realmente relevantes (4-5), así que si un dato aparece aquí, importa. Toca cualquiera para ver qué significa (` +
      `se actualiza a diario; horarios en hora de Chile). ${esc(DISCLAIMER)}</div></div>`;

    document.getElementById("main").innerHTML = html;
    document.querySelectorAll("#main .cal-tick").forEach((b) =>
      b.addEventListener("click", () => {
        const t = b.dataset.goto;
        state.ticker = t;
        applyMode(t.includes("/") ? "fx" : "equity");
      })
    );
    document.querySelectorAll("#main .cal-fclear").forEach((b) =>
      b.addEventListener("click", () => {
        state.calFilter = null;
        renderCalendar();
      })
    );
    document.querySelectorAll("#main .cal-fchip").forEach((b) =>
      b.addEventListener("click", () => {
        state.calFilter = b.dataset.f || null;
        renderCalendar();
        window.scrollTo({ top: 0 });
      })
    );
    document.querySelectorAll("#main .cal-econ, #main .cal-tap").forEach((el) =>
      el.addEventListener("click", (ev) => {
        if (ev.target.closest(".cal-tick")) return;
        el.classList.toggle("open");
      })
    );
  }

  // — Panel Técnico (todo lo gratuito, junto y a mano) —
  const TECH_COLS = [
    { key: "ticker", label: "Ticker", num: false },
    { key: "price", label: "Precio" },
    { key: "change_1d_pct", label: "Día", fmt: "delta" },
    { key: "change_1w_pct", label: "Semana", fmt: "delta" },
    { key: "rsi", label: "RSI", fmt: "rsi" },
    { key: "pct_vs_sma50", label: "vs SMA50", fmt: "delta" },
    { key: "pct_vs_sma200", label: "vs SMA200", fmt: "delta" },
    { key: "volatility_30d", label: "Vol. 30d", fmt: "pct1" },
    { key: "sharpe", label: "Sharpe", fmt: "n2" },
    { key: "price_percentile_1y", label: "Pctl. 1A", fmt: "pctl" },
    { key: "vs_benchmark_30d_pct", label: "vs Bench 30d", fmt: "delta" },
    { key: "volume_ratio", label: "Vol. rel.", fmt: "ratio" },
  ];
  function techCell(col, s) {
    if (col.key === "ticker") return `<td class="t" data-goto="${esc(s.ticker)}" title="Ver informe">${esc(s.ticker)}</td>`;
    const t = s.technical || {};
    const v = t[col.key];
    if (v === null || v === undefined) return `<td><span class="mut">—</span></td>`;
    let cls = "", txt;
    if (col.fmt === "delta") {
      txt = (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(2).replace(".", ",") + " %";
      cls = v > 0 ? "pos" : v < 0 ? "neg" : "";
    } else if (col.fmt === "rsi") {
      txt = v.toFixed(0);
      cls = v >= 70 || v <= 30 ? "xtreme" : "";
    } else if (col.fmt === "pctl") {
      txt = v.toFixed(0);
      cls = v >= 90 || v <= 10 ? "xtreme" : "";
    } else if (col.fmt === "pct1") {
      txt = v.toFixed(1).replace(".", ",") + " %";
    } else if (col.fmt === "n2") {
      txt = v.toFixed(2).replace(".", ",");
      cls = v > 0 ? "pos" : v < 0 ? "neg" : "";
    } else if (col.fmt === "ratio") {
      txt = v.toFixed(2).replace(".", ",") + "×";
      cls = v >= 2 ? "xtreme" : "";
    } else {
      txt = v >= 1000 ? v.toLocaleString("es-CL", { maximumFractionDigits: 0 })
        : v.toFixed(v < 10 ? 3 : 2).replace(".", ",");
    }
    return `<td${cls ? ` class="${cls}"` : ""}>${txt}</td>`;
  }
  function renderTech() {
    const { key, dir } = state.techSort;
    const rows = STOCKS.slice().sort((a, b) => {
      if (key === "ticker") return a.ticker.localeCompare(b.ticker) * dir;
      const av = (a.technical || {})[key], bv = (b.technical || {})[key];
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      return (av - bv) * dir;
    });
    const fetched = (STOCKS.map((s) => s.sourcesMeta && s.sourcesMeta.price && s.sourcesMeta.price.fetched_at).find(Boolean) || "").replace("T", " ").slice(0, 16);
    const ths = TECH_COLS.map((c) =>
      `<th data-k="${c.key}" class="${c.key === key ? "sorted" + (dir === 1 ? " asc" : "") : ""}">${c.label}</th>`
    ).join("");
    const trs = rows.map((s) => `<tr>${TECH_COLS.map((c) => techCell(c, s)).join("")}</tr>`).join("");
    document.getElementById("main").innerHTML =
      `<div class="tech-wrap"><div class="tech-head"><h1>Panel Técnico</h1>` +
      `<p class="sub">Los ${STOCKS.length} activos de un vistazo: precio, momentum, medias móviles, riesgo y posición en el rango anual. ` +
      `Haz clic en una columna para ordenar; en un ticker, para abrir su informe.</p></div>` +
      (fetched ? `<p class="tech-ts">Última actualización de datos: ${esc(fetched)} (TradingView scanner)</p>` : "") +
      `<div class="tech-scroll"><table class="tech"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>` +
      `<p class="tech-note">RSI en rojo si está en sobrecompra (≥70) o sobreventa (≤30); percentil 1A en rojo en los extremos del rango anual (≥90 / ≤10); ` +
      `Vol. rel. en rojo si el volumen del día duplica su promedio de 20 ruedas. «vs Bench 30d» compara el retorno de 30 días contra el benchmark del activo ` +
      `(S&P 500, Nikkei 225, DXY, Bitcoin, cripto total o ECH como proxy de Chile). Sharpe y volatilidad requieren ≥30 ruedas de histórico acumulado. ` +
      `${DISCLAIMER}</p></div>`;
    document.querySelectorAll("#main th[data-k]").forEach((th) =>
      th.addEventListener("click", () => {
        const k = th.dataset.k;
        state.techSort = { key: k, dir: state.techSort.key === k ? -state.techSort.dir : (k === "ticker" ? 1 : -1) };
        renderTech();
      })
    );
    document.querySelectorAll("#main td.t").forEach((td) =>
      td.addEventListener("click", () => {
        const t = td.dataset.goto;
        state.ticker = t;
        applyMode(t.includes("/") ? "fx" : "equity");
      })
    );
  }

  // — Riesgo, percentil y benchmark en el detalle del activo —
  const RISK_TIPS = {
    vol: "Cuánto se mueve el precio en un año típico (desvío estándar anualizado de los retornos diarios de las últimas 30 ruedas). Más alto = más movimiento y más riesgo.",
    sharpe: "Retorno anualizado por encima de la tasa libre de riesgo, por unidad de volatilidad total. Por encima de 1 es bueno; negativo significa que rindió menos que la tasa libre de riesgo.",
    sortino: "Como el Sharpe, pero solo castiga la volatilidad de los días de caída. Útil cuando las subidas bruscas no molestan, solo las bajadas.",
    mdd: "La peor caída acumulada desde un máximo durante el último año. Cuánto llegó a perder quien compró en el peor momento.",
  };
  function riskSection(s) {
    if (!s.risk && !s.benchmark) return "";
    let html = "";
    if (s.risk) {
      const accum = `<span class="v accum">Acumulando datos (${s.risk.n_days}d/${s.risk.window || 30}d)</span>`;
      const tile = (label, tip, val) =>
        `<div class="risk-tile" title="${esc(tip)}"><div class="l">${label} <span class="q">ⓘ</span></div>` +
        (val === null ? accum : `<span class="v">${val}</span>`) + `</div>`;
      const f = (v, suf, nd) => (v === null || v === undefined ? null : v.toFixed(nd).replace(".", ",") + suf);
      html += `<div class="risk-grid">` +
        tile("Volatilidad 30d", RISK_TIPS.vol, f(s.risk.volatility_30d, " %", 1)) +
        tile("Sharpe", RISK_TIPS.sharpe, f(s.risk.sharpe, "", 2)) +
        tile("Sortino", RISK_TIPS.sortino, f(s.risk.sortino, "", 2)) +
        tile("Max drawdown 1A", RISK_TIPS.mdd, f(s.risk.max_drawdown_1y, " %", 1)) +
        `</div>`;
    }
    const b = s.benchmark;
    if (b && (b.price_percentile_1y != null || b.relative_performance_30d != null)) {
      let bar = "";
      if (b.price_percentile_1y != null) {
        bar = `<div class="pct-wrap" title="Posición del precio actual dentro de su rango de 52 semanas: 0 = mínimo del año, 100 = máximo.">` +
          `<div class="pct-bar"><div class="fill" style="width:${b.price_percentile_1y}%"></div></div>` +
          `<div class="pct-lbl"><span>Mín. 1A</span><span>Percentil <b>${Math.round(b.price_percentile_1y)}</b>${b.partial ? " (rango parcial)" : ""}</span><span>Máx. 1A</span></div></div>`;
      }
      let badge = "";
      const rel = b.relative_performance_30d;
      if (rel != null) {
        const cls = rel >= 0 ? "out" : "under";
        const word = rel >= 0 ? "Outperform" : "Underperform";
        badge = `<span class="bench-badge ${cls}" title="Retorno de 30 días del activo menos el de su benchmark (puntos porcentuales).">` +
          `${word} vs ${esc(b.label || b.ticker)} 30d: ${rel > 0 ? "+" : ""}${rel.toFixed(1).replace(".", ",")} pp</span>`;
      } else {
        badge = `<span class="bench-badge na">Benchmark: ${esc(b.label || b.ticker)}</span>`;
      }
      html += `<div class="bench-row">${bar}${badge}</div>`;
    }
    const tr = s.trend;
    if (tr && (tr.piso || tr.techo || tr.max)) {
      const chips = (tr.senales_piso || []).map((x) => `<span class="tr-chip up">${esc(x)}</span>`)
        .concat((tr.senales_techo || []).map((x) => `<span class="tr-chip down">${esc(x)}</span>`)).join("");
      const hot = tr.piso >= 4 ? " hot-up" : tr.techo >= 4 ? " hot-down" : "";
      html += `<div class="trend-row${hot}" title="Detector mecánico de cambio de carácter: 7 señales de piso (giro alcista) y 7 de techo (giro bajista) evaluadas a diario sobre el histórico. 4+ señales = zona de giro.">` +
        `<span class="tr-t">🧭 Detector de giro</span>` +
        `<span class="tr-n">piso <b>${tr.piso}</b>/7 · techo <b>${tr.techo}</b>/7</span>` +
        (chips ? `<div class="tr-chips">${chips}</div>` : `<span class="tr-none">sin señales activas hoy</span>`) +
        `</div>`;
    }
    if (s.metricChanges && s.metricChanges.length) {
      const NAMES = { rsi: "RSI", percentil_1y: "Percentil 1A", precio_pct: "Precio", score: "Score" };
      html += `<details class="sources"><summary>Cambios bruscos de métricas — últimos 90 días (${s.metricChanges.length})</summary><ul>` +
        s.metricChanges.map((c) => {
          const d = parseISODate(c.date);
          const fd = d ? `${d.getDate()} ${MONTHS_ES[d.getMonth()].slice(0, 3)} ${d.getFullYear()}` : c.date;
          return `<li>${fd} — ${NAMES[c.metric] || c.metric}: ${c.from} → ${c.to}</li>`;
        }).join("") + `</ul></details>`;
    }
    return html;
  }

  // — Gráfico interactivo por activo (widget oficial de TradingView, gratis) —
  const CHART_SYMBOLS = {
    "AAPL": "NASDAQ:AAPL", "MSFT": "NASDAQ:MSFT", "NVDA": "NASDAQ:NVDA",
    "GOOGL": "NASDAQ:GOOGL", "AMZN": "NASDAQ:AMZN", "TSLA": "NASDAQ:TSLA", "MU": "NASDAQ:MU",
    "SPCX": "NASDAQ:SPCX", "CLSK": "NASDAQ:CLSK", "MSTR": "NASDAQ:MSTR", "MP": "NYSE:MP", "HDSY": "OTC:HSYDF",
    "CCU": "BCS:CCU", "CMPC": "BCS:CMPC", "CENCOSUD": "BCS:CENCOSUD", "BTC": "CRYPTO:BTCUSD",
    "USD/CLP": "VANTAGE:USDCLP", "EUR/USD": "FX:EURUSD", "USD/JPY": "FX:USDJPY",
  };
  const CHART_NOTES = {
    "HDSY": "Gráfico vía OTC:HSYDF (cotización OTC en EE.UU., en USD, que replica a la acción de Tokio): la Bolsa de Tokio no permite embeber los datos de 6324. El precio del informe y las métricas siguen siendo los de Tokio, en ¥.",
  };
  // Rangos del gráfico propio: etiqueta → días hacia atrás (null = todo el histórico)
  const OWN_RANGES = [["1M", 30], ["3M", 90], ["6M", 182], ["YTD", "ytd"], ["1A", 365], ["Todo", null]];
  function mountOwnChart(el, stock) {
    const serie = (stock.chartSeries || []).filter((p) => p && p[1] != null);
    if (serie.length < 5) { el.style.display = "none"; return; }
    let rango = "6M";
    const fmtNum = (v) => {
      const d = v >= 1000 ? 0 : v >= 100 ? 1 : 2;
      return v.toLocaleString("es-CL", { minimumFractionDigits: d, maximumFractionDigits: d });
    };
    function draw() {
      const hoy = new Date();
      const def = OWN_RANGES.find((r) => r[0] === rango)[1];
      let desde = null;
      if (def === "ytd") desde = new Date(hoy.getFullYear(), 0, 1);
      else if (typeof def === "number") { desde = new Date(hoy); desde.setDate(desde.getDate() - def); }
      const pts = serie.filter((p) => !desde || parseISODate(p[0]) >= desde);
      const data = pts.length >= 2 ? pts : serie.slice(-30);
      const vals = data.map((p) => p[1]);
      const min = Math.min(...vals), max = Math.max(...vals);
      const span = (max - min) || 1;
      const W = 1000, H = 320, PL = 8, PR = 62, PT = 16, PB = 26;
      const x = (i) => PL + (i / Math.max(data.length - 1, 1)) * (W - PL - PR);
      const y = (v) => PT + (1 - (v - min) / span) * (H - PT - PB);
      const linea = data.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
      const area = `${linea}L${x(data.length - 1).toFixed(1)},${H - PB}L${PL},${H - PB}Z`;
      const chg = (data[data.length - 1][1] / data[0][1] - 1) * 100;
      const up = chg >= 0;
      const ticksY = [max, min + span / 2, min].map((v) =>
        `<text x="${W - PR + 8}" y="${(y(v) + 4).toFixed(1)}" class="own-lbl">${esc(fmtNum(v))}</text>` +
        `<line x1="${PL}" y1="${y(v).toFixed(1)}" x2="${W - PR}" y2="${y(v).toFixed(1)}" class="own-grid"/>`).join("");
      const fechas = [data[0][0], data[Math.floor(data.length / 2)][0], data[data.length - 1][0]];
      const ticksX = fechas.map((f, k) => {
        const d = parseISODate(f);
        const txt = d ? `${d.getDate()} ${MONTHS_ES[d.getMonth()].slice(0, 3)} ${String(d.getFullYear()).slice(2)}` : f;
        const px = k === 0 ? PL + 4 : k === 1 ? (PL + W - PR) / 2 : W - PR - 4;
        const anchor = k === 0 ? "start" : k === 1 ? "middle" : "end";
        return `<text x="${px}" y="${H - 8}" text-anchor="${anchor}" class="own-lbl">${esc(txt)}</text>`;
      }).join("");
      const botones = OWN_RANGES.map(([lbl]) =>
        `<button type="button" class="own-r${lbl === rango ? " on" : ""}" data-r="${lbl}">${lbl}</button>`).join("");
      el.innerHTML =
        `<div class="own-head">` +
        `<div class="own-btns">${botones}</div>` +
        `<div class="own-chg ${up ? "up" : "down"}">${up ? "+" : "−"}${Math.abs(chg).toFixed(2).replace(".", ",")} % <span>en ${esc(rango)}</span></div>` +
        `</div>` +
        `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="own-svg">` +
        `<defs><linearGradient id="ogr" x1="0" y1="0" x2="0" y2="1">` +
        `<stop offset="0%" stop-color="#3987e5" stop-opacity="0.35"/><stop offset="100%" stop-color="#3987e5" stop-opacity="0"/>` +
        `</linearGradient></defs>${ticksY}` +
        `<path d="${area}" fill="url(#ogr)"/><path d="${linea}" fill="none" stroke="#3987e5" stroke-width="2" vector-effect="non-scaling-stroke"/>` +
        `${ticksX}</svg>`;
      el.querySelectorAll(".own-r").forEach((b) =>
        b.addEventListener("click", () => { rango = b.dataset.r; draw(); }));
    }
    el.classList.add("own-chart");
    draw();
  }

  function mountChart(stock) {
    const el = document.getElementById("tvChart");
    if (!el) return;
    if (stock.chartSeries && stock.chartSeries.length > 5) { mountOwnChart(el, stock); return; }
    const sym = CHART_SYMBOLS[stock.ticker];
    if (!sym) { el.style.display = "none"; return; }
    const wrap = document.createElement("div");
    wrap.className = "tradingview-widget-container";
    wrap.innerHTML = '<div class="tradingview-widget-container__widget"></div>';
    const s = document.createElement("script");
    s.src = "https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js";
    s.async = true;
    s.type = "text/javascript";
    s.text = JSON.stringify({
      symbols: [[esc(stock.company), sym + "|1D"]],
      chartOnly: false,  // el encabezado del widget muestra cuánto se movió el precio en el rango elegido
      width: "100%",
      height: "100%",
      autosize: true,
      locale: "es",
      colorTheme: "dark",
      lineColor: "#3987e5",
      topColor: "rgba(57, 135, 229, 0.28)",
      bottomColor: "rgba(57, 135, 229, 0)",
      showVolume: false,
      hideDateRanges: false,
      hideMarketStatus: true,
      hideSymbolLogo: true,
      scalePosition: "right",
      scaleMode: "Normal",
      fontSize: "10",
      noTimeScale: false,
      valuesTracking: "1",
      changeMode: "price-and-percent",
      chartType: "area",
      lineWidth: 2,
      dateRanges: ["1d|3", "5d|15", "1m|60", "ytd|1D", "60m|1W"],
      dateFormat: "dd MMM 'yy",
    });
    wrap.appendChild(s);
    el.appendChild(wrap);
    const obs = new MutationObserver(() => {
      if (el.querySelector("iframe")) {
        const fb = el.querySelector(".tv-fallback");
        if (fb) fb.remove();
        obs.disconnect();
      }
    });
    obs.observe(el, { childList: true, subtree: true });
  }

  function render() {
    if (state.mode === "calendar") { renderCalendar(); return; }
    if (state.mode === "tech") { renderTech(); return; }
    renderRail();
    const stock = STOCKS.find((s) => s.ticker === state.ticker);
    const cats = catsOf(stock);
    const sc = composite(stock, state.weights);
    const g = gradeFor(sc);
    const weakest = cats.reduce((a, c) => (stock.scores[c.key].score < stock.scores[a.key].score ? c : a), cats[0]);

    const stats = statsPairs(stock)
      .filter(([l]) => l !== "Precio")
      .map(([l, v]) => `<div class="stat"><div class="l">${esc(l)}</div><div class="v">${esc(v)}</div></div>`)
      .join("");

    const plan = withOpportunity(stock, sectionPlan(stock));
    const total = plan.length;
    const nav = plan.map(
      (s) => `<a href="#sec-${s.key}"><span class="k">${s.num}</span>${esc(s.nav)}</a>`
    ).join("");

    const OPEN_KEYS = ["resumen", "score", "opportunity", "cs1"];
    const sections = plan.map((s) => {
      const body = s.key === "score" ? scoreSection(stock)
        : s.key === "opportunity" ? opportunitySection(stock)
        : `<div class="prose">${md(s.body)}</div>`;
      const open = OPEN_KEYS.includes(s.key);
      return (
        `<section class="report-section" id="sec-${s.key}">` +
        `<details class="sec-fold"${open ? " open" : ""}>` +
        `<summary><span class="sec-eyebrow">Sección ${s.num} / ${total}</span><h2>${esc(s.title)}</h2></summary>` +
        body +
        `</details>` +
        `</section>`
      );
    }).join("");

    document.getElementById("main").innerHTML =
      `<div class="company-head">` +
      `<span class="ticker">${stock.ticker}</span><h1>${esc(stock.company)}</h1>` +
      `<span class="head-price">${esc(priceOf(stock))}</span>` +
      deltaSpan(stock.change && stock.change.day, "head-delta") +
      `<span class="date">Informe · ${esc(reportDateOf(stock))}</span>` +
      `<div class="head-actions"><button class="btn" id="dlBtn" type="button">Descargar informe (.md)</button>` +
      `<a class="btn" target="_blank" rel="noopener" href="${requestUrl(stock.ticker, "update")}" title="Pide a Claude un informe nuevo de este activo (llega en ~15-20 min)">↻ Actualizar informe</a>` +
      `<a class="btn danger" id="rmBtn" target="_blank" rel="noopener" href="${requestUrl(stock.ticker, "eliminar")}" title="Quita este activo del dashboard (el histórico queda archivado)">🗑 Eliminar</a></div>` +
      `</div>` +
      (stock.change && stock.change.week != null
        ? `<div class="head-week"><span>Semana: ${deltaSpan(stock.change.week)}</span></div>`
        : "") +
      `<div class="tv-chart" id="tvChart"><div class="tv-fallback">Cargando gráfico en vivo…</div></div>` +
      (CHART_NOTES[stock.ticker] ? `<p class="tv-note">${esc(CHART_NOTES[stock.ticker])}</p>` : "") +
      `<div class="stats-grid">${stats}</div>` +
      riskSection(stock) +
      `<div class="hero">` +
      `<div class="gauge-wrap">${gaugeSVG(sc, 132)}<div class="gauge-num" style="margin-top:-84px">${sc}</div><div class="gauge-cap">Score / 100</div><div style="height:26px"></div></div>` +
      `<div><div class="reading">El score de <strong>${sc} (${g.grade} · ${esc(signalOf(stock, g))})</strong> es el promedio ponderado de las 5 categorías de la sección de score. ` +
      `La dimensión más débil del cuadro es <strong>${esc(weakest.name)}</strong> (${stock.scores[weakest.key].score}), el eslabón a vigilar.</div>` +
      `<span class="grade-pill grade-${g.cls}"><span class="dot"></span>Pulso ${sc} · ${esc(signalOf(stock, g))}</span>` +
      (compositeOpp(stock) != null
        ? ` <span class="grade-pill grade-${oppSignalFor(compositeOpp(stock)).cls}"><span class="dot"></span>Oportunidad ${compositeOpp(stock)} · ${esc(oppSignalFor(compositeOpp(stock)).label)}</span>`
        : "") +
      `</div>` +
      `</div>` +
      `<nav class="section-nav" aria-label="Secciones del informe">${nav}</nav>` +
      sections +
      `<details class="sources"><summary>Fuentes consultadas (${stock.sources.length})</summary><ul>` +
      stock.sources.map((x) => `<li>${esc(x)}</li>`).join("") +
      `</ul></details>` +
      `<div class="disclaimer">${DISCLAIMER}</div>`;

    mountChart(stock);

    document.querySelectorAll(".section-nav a").forEach((aEl) =>
      aEl.addEventListener("click", () => {
        const sec = document.querySelector(aEl.getAttribute("href"));
        const d = sec && sec.querySelector("details.sec-fold");
        if (d) d.open = true;
      })
    );

    const rm = document.getElementById("rmBtn");
    if (rm) rm.addEventListener("click", (ev) => {
      if (!confirm(`¿Eliminar ${stock.ticker} del dashboard?\n\nSe quitará de la cobertura, del calendario y de las alertas. Su histórico de precios queda archivado por si lo vuelves a agregar.\n\nSe abrirá GitHub para confirmar el envío.`)) ev.preventDefault();
    });

    const dl = document.getElementById("dlBtn");
    if (window.claude && window.claude.downloads) dl.addEventListener("click", () => download(stock));
    else dl.style.display = "none";

    document.querySelectorAll('.w-grid input[type="range"]').forEach((inp) =>
      inp.addEventListener("input", () => {
        state.weights[inp.dataset.k] = Number(inp.value);
        rerenderScore();
      })
    );
    const reset = document.getElementById("resetW");
    if (reset)
      reset.addEventListener("click", () => {
        state.weights = { ...DEFAULT_WEIGHTS };
        rerenderScore();
      });
  }

  function rerenderScore() {
    const openW = document.querySelector("details.weights");
    const wasOpen = openW && openW.open;
    const y = window.scrollY;
    render();
    if (wasOpen) {
      const d = document.querySelector("details.weights");
      if (d) d.open = true;
    }
    window.scrollTo({ top: y });
  }

  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._h);
    toast._h = setTimeout(() => t.classList.remove("show"), 3200);
  }

  function reportMarkdown(stock) {
    const sc = composite(stock, state.weights);
    const g = gradeFor(sc);
    const { norm } = normWeights(state.weights);
    let out = `# Informe de Equity Research — ${stock.company} (${stock.ticker})\n\n`;
    out += `**Fecha:** ${reportDateOf(stock)} · Generado por Stock Research Dashboard\n\n`;
    statsPairs(stock).forEach(([l, v]) => (out += `- **${l}:** ${v}\n`));
    if (stock.change && stock.change.day != null)
      out += `- **Variación:** día ${fmtPct(stock.change.day)}` + (stock.change.week != null ? ` · semana ${fmtPct(stock.change.week)}` : "") + `\n`;
    out += `\n---\n\n`;
    const cats = catsOf(stock);
    sectionPlan(stock).forEach((s) => {
      out += `## ${s.num}. ${s.title}\n\n`;
      if (s.key === "score") {
        out += `| Categoría | Peso | Puntaje | Aporte |\n|---|---|---|---|\n`;
        cats.forEach((c) => {
          const v = stock.scores[c.key].score;
          const w = stock.customCats ? c.weight : norm[c.key];
          out += `| ${c.name} | ${w.toFixed(0)}% | ${v} | ${(v * w / 100).toFixed(1)} |\n`;
        });
        out += `| **Score Compuesto** | **100%** | | **${sc} / 100** |\n\n`;
        out += `**Señal: ${signalOf(stock, g)}** (Grado ${g.grade} — ${sc}/100), sustentada en el desglose: ` +
          cats.map((c) => `${c.name} ${stock.scores[c.key].score}`).join(" · ") + `.\n\n`;
        cats.forEach((c) => (out += `- **${c.name} (${stock.scores[c.key].score}):** ${stock.scores[c.key].just}\n`));
        out += `\nLa señal traduce el score cuantitativo a la escala convencional de research; no es una orden de ejecución.\n\n`;
      } else {
        out += s.body + `\n\n`;
      }
    });
    out += `---\n\n**Fuentes:** ${stock.sources.join("; ")}.\n\n> ${DISCLAIMER}\n`;
    return out;
  }

  async function download(stock) {
    try {
      await window.claude.downloads.save({
        filename: `${stock.ticker}-2026-07-18.md`,
        data: reportMarkdown(stock),
      });
      toast("Informe guardado.");
    } catch (e) {
      if (e && e.code === "declined") return;
      if (e && e.code === "rate_limited") toast("Hay una descarga pendiente — intenta de nuevo en unos segundos.");
      else toast("La descarga no está disponible en esta vista.");
    }
  }

  document.getElementById("search").addEventListener("input", (e) => {
    state.query = e.target.value;
    renderRail();
  });
  document.querySelectorAll("#modeSwitch button, #tabBar button").forEach((b) =>
    b.addEventListener("click", () => {
      if (b.dataset.mode !== state.mode) applyMode(b.dataset.mode);
    })
  );

  applyMode("equity");

  // — Datos en vivo: precio, variaciones, RSI y MACD desde el scanner de TradingView —
  // (misma fuente que el pipeline diario; al abrir la app y cada 60 s mientras esté visible)
  const LIVE_MAP = {
    "AAPL":    ["NASDAQ:AAPL",   ["$", "", 2, ",", "."]],
    "MSFT":    ["NASDAQ:MSFT",   ["$", "", 2, ",", "."]],
    "NVDA":    ["NASDAQ:NVDA",   ["$", "", 2, ",", "."]],
    "GOOGL":   ["NASDAQ:GOOGL",  ["$", "", 2, ",", "."]],
    "AMZN":    ["NASDAQ:AMZN",   ["$", "", 2, ",", "."]],
    "TSLA":    ["NASDAQ:TSLA",   ["$", "", 2, ",", "."]],
    "MU":      ["NASDAQ:MU",     ["$", "", 2, ",", "."]],
    "SPCX":    ["NASDAQ:SPCX",   ["$", "", 2, ",", "."]],
    "CLSK":    ["NASDAQ:CLSK",   ["$", "", 2, ",", "."]],
    "MSTR":    ["NASDAQ:MSTR",   ["$", "", 2, ",", "."]],
    "MP":      ["NYSE:MP",       ["$", "", 2, ",", "."]],
    "HDSY":    ["TSE:6324",      ["¥", "", 0, ",", "."]],
    "CCU":     ["BCS:CCU",       ["$", " CLP", 0, ".", ","]],
    "CMPC":    ["BCS:CMPC",      ["$", " CLP", 1, ".", ","]],
    "CENCOSUD": ["BCS:CENCOSUD", ["$", " CLP", 1, ".", ","]],
    "BTC":     ["CRYPTO:BTCUSD", ["$", "", 0, ",", "."]],
    "USD/CLP": ["VANTAGE:USDCLP", ["", "", 2, ",", "."]],
    "EUR/USD": ["FX:EURUSD",     ["", "", 5, ",", "."]],
    "USD/JPY": ["FX:USDJPY",     ["", "", 3, ",", "."]],
  };
  const LIVE_COLS = ["close", "change", "change|1W", "RSI", "MACD.macd", "MACD.signal"];
  const liveState = { fails: 0, timer: null };

  function fmtPrecioLive(v, f) {
    const [pre, suf, dec, miles, decsep] = f;
    let s = v.toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec });
    s = s.replace(/,/g, "\x00").replace(/\./g, decsep).replace(/\x00/g, miles);
    return pre + s + suf;
  }
  const r2 = (v) => Math.round(v * 100) / 100;

  async function fetchLive() {
    const resp = await fetch("https://scanner.tradingview.com/global/scan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ symbols: { tickers: Object.values(LIVE_MAP).map((m) => m[0]), query: { types: [] } }, columns: LIVE_COLS }),
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    const bySym = {};
    (data.data || []).forEach((row) => {
      const q = {};
      LIVE_COLS.forEach((c, i) => (q[c] = row.d[i]));
      bySym[row.s] = q;
    });
    return bySym;
  }

  function applyLive(bySym, hh) {
    STOCKS.forEach((s) => {
      const m = LIVE_MAP[s.ticker];
      if (!m) return;
      const q = bySym[m[0]];
      if (!q || q.close == null) return;
      s.change = {
        day: q.change != null ? r2(q.change) : s.change && s.change.day,
        week: q["change|1W"] != null ? r2(q["change|1W"]) : s.change && s.change.week,
      };
      const precio = `${fmtPrecioLive(q.close, m[1])} (en vivo ${hh})`;
      if (s.statsList && s.statsList[0][0] === "Precio") s.statsList[0][1] = precio;
      else if (s.stats && s.stats.precio) s.stats.precio = precio;
      const parts = [];
      if (q.RSI != null) parts.push(`RSI ${q.RSI.toFixed(1)}`);
      if (q["MACD.macd"] != null && q["MACD.signal"] != null) {
        const sg = (v) => (v >= 0 ? "+" : "") + v.toFixed(2);
        parts.push(`MACD ${sg(q["MACD.macd"])} / señal ${sg(q["MACD.signal"])}`);
      }
      if (parts.length && s.statsList) {
        const pair = s.statsList.find((p) => p[0] === "Técnico (auto)");
        if (pair) pair[1] = parts.join(" · ") + ` (TradingView, en vivo ${hh})`;
      }
      if (s.technical) {
        const t = s.technical;
        t.price = q.close;
        if (q.change != null) t.change_1d_pct = r2(q.change);
        if (q["change|1W"] != null) t.change_1w_pct = r2(q["change|1W"]);
        if (q.RSI != null) t.rsi = Math.round(q.RSI * 10) / 10;
        if (q["MACD.macd"] != null) t.macd = q["MACD.macd"];
        if (q["MACD.signal"] != null) t.macd_signal = q["MACD.signal"];
        ["sma20", "sma50", "sma200"].forEach((k) => {
          if (t[k]) t["pct_vs_" + k] = r2((q.close / t[k] - 1) * 100);
        });
      }
    });
  }

  function refreshLiveUI() {
    if (state.mode === "tech") { renderTech(); return; }
    if (state.mode === "calendar") return;
    renderRail();
    const stock = STOCKS.find((s) => s.ticker === state.ticker);
    if (!stock) return;
    const hp = document.querySelector(".head-price");
    if (hp) hp.textContent = priceOf(stock);
    const hd = document.querySelector(".head-delta");
    if (hd && stock.change && stock.change.day != null) hd.outerHTML = deltaSpan(stock.change.day, "head-delta");
    const hw = document.querySelector(".head-week span");
    if (hw && stock.change && stock.change.week != null) hw.innerHTML = `Semana: ${deltaSpan(stock.change.week)}`;
    document.querySelectorAll(".stats-grid .stat").forEach((el) => {
      const l = el.querySelector(".l"), v = el.querySelector(".v");
      if (l && v && l.textContent === "Técnico (auto)") {
        const pair = statsPairs(stock).find((p) => p[0] === "Técnico (auto)");
        if (pair) v.textContent = pair[1];
      }
    });
  }

  function setLiveChip(ok, hh) {
    const el = document.getElementById("liveChip");
    if (!el) return;
    if (ok) {
      el.className = "live-chip on";
      el.innerHTML = `<span class="dot"></span>En vivo · ${hh}`;
    } else {
      el.className = "live-chip";
      el.textContent = "Sin conexión en vivo — datos del último cierre";
    }
  }

  async function liveTick() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    try {
      const bySym = await fetchLive();
      applyLive(bySym, hh);
      refreshLiveUI();
      liveState.fails = 0;
      setLiveChip(true, hh);
    } catch (e) {
      liveState.fails++;
      // un fallo aislado no apaga el indicador; dos seguidos sí
      if (liveState.fails >= 2) setLiveChip(false);
    }
  }

  liveTick();
  liveState.timer = setInterval(() => {
    if (!document.hidden && liveState.fails < 10) liveTick();
  }, 60000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) { liveState.fails = 0; liveTick(); }
  });

  // — Registro del service worker (app instalable / uso sin conexión) —
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
