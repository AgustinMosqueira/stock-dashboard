l": "CRYPTO:BTCUSD", "fetched_at": "2026-08-10T19:26:32-04:00"}, "risk_metrics": {"origin": "data/history/MSTR.json", "n_days": 306}}, "metricChanges": [{"ticker": "MSTR", "date": "2026-07-31", "metric": "precio_pct", "from": 97.74, "to": 89.5}], "trend": {"piso": 0, "techo": 0, "max": 7, "senales_piso": [], "senales_techo": []}, "reportDate": "4 de agosto de 2026", "change": {"day": -2.68, "week": -2.68}, "events": [{"date": "2026-08-10", "label": "Actualización semanal de tesorería BTC (8-K)", "kind": "corporate", "info": "Reporte semanal de compras/ventas de Bitcoin; la última (3-ago) mostró venta de 1.638 BTC por ~US$104,7M, holdings en 842.138 BTC (CoinDesk, 3-ago-2026)"}, {"date": "2026-08-15", "label": "Pago dividendo STRC (record date)", "kind": "corporate", "info": "Dividendo semi-mensual de STRC, tasa anualizada 12% mantenida por Strategy desde el 1-ago; STRC cotiza ~10% bajo par US$100 (Coindesk/news.bitcoin.com, 1-ago-2026)"}, {"date": "2026-11-04", "label": "Earnings Q3 2026", "kind": "earnings", "info": "Próximo reporte trimestral confirmado; en Q2 (30-jul) Strategy reportó pérdida neta de US$8,22 mil M, casi toda contable (mark-to-market no-cash de BTC) (Yahoo Finance, 30-jul-2026)"}], "sections": {"resumen": "MSTR cayó -4,56% el 3-ago tras confirmarse la venta semanal de 1.638 BTC (~US$105M), parte del nuevo 'framework de gestión de capital' desde jun-2026 que reemplazó la política de 'nunca vender'. HECHO: 842.138 BTC en tesorería a costo prom. US$75.419, muy por sobre el precio spot BTC actual (~US$63.776). mNAV en descuento (~0,68x básico), reflejando que el mercado valora MSTR bajo el valor de sus BTC. LECTURA: el motor de acumulación vía prima de acciones está debilitado.", "fundamental": "- HECHO: 842.138 BTC (costo prom. US$75.419; ~US$63,51 mil M invertidos), tras vender 1.638 BTC la semana del 2-ago bajo el nuevo Digital Credit Capital Framework (jun-2026).\n- HECHO: BTC Yield YTD cayó a 4,5% (26-jul) desde 9,6% en abril, señal de que la dilución acretiva vía ATM se frenó.\n- HECHO: Q2 2026 pérdida neta US$8,22 mil M (US$24,45/acción), casi toda por mark-to-market no-cash de BTC bajo FASB fair-value; ingresos operativos US$122,4M (+6,9% YoY).\n- HECHO: STRC mantiene dividendo anualizado 12% (máximo histórico) pero cotiza ~10% bajo par, señal de estrés en el financiamiento vía preferentes.\n- LECTURA: pausa de compras (+5 semanas sin comprar) y reserva de caja de US$3,75 mil M sugieren postura defensiva, no ofensiva.", "valuacion": "- HECHO: mNAV básico/diluido ~0,68x-0,69x (bitcoinquant.co, 3-ago); en base a enterprise value (incluyendo preferentes) ~1,03x-1,07x tras revisión metodológica de Strategy.\n- LECTURA: el descuento en mNAV básico implica que el mercado paga menos por acción MSTR que el BTC subyacente por acción, rompiendo el modelo de emisión acretiva de capital.\n- HECHO: market cap ~US$36,2-36,7 mil M vs. valor de BTC en tesorería ~US$53,2 mil M (bitcointreasuries/KuCoin, 3-ago).\n- LECTURA: para reactivar el ciclo de acumulación, MSTR necesita mNAV >1x sostenido; hoy depende de si BTC recupera o si el mercado revaloriza el negocio de preferentes/crédito digital.", "tecnico": "- HECHO: precio US$93,28, -4,56% el día, RSI 43 (neutral, sin sobreventa extrema pese al desplome).\n- HECHO: cotiza -2,9% bajo SMA20, -17,2% bajo SMA50 y -40,9% bajo SMA200; tendencia de mediano/largo plazo claramente bajista.\n- HECHO: MACD negativo (-4,26) pero por sobre la señal (-5,62), indicio de posible pérdida de momentum bajista.\n- HECHO: percentil de precio a 1 año de solo 3,4% — la acción está en el extremo inferior de su rango anual.\n- LECTURA: volumen 35% sobre promedio de 20 días en la caída sugiere capitulación, no acumulación; falta confirmación de piso.", "catalizadores": "**Catalizadores:**\n- Recuperación de BTC hacia/sobre el costo promedio de MSTR (US$75.419) reactivaría el mNAV y el ciclo de emisión acretiva.\n- Reversión a compras netas de BTC (actualmente en pausa) señalizaría confianza y podría comprimir el descuento de mNAV.\n- Resultados del nuevo framework de capital (recompras de STRC/MSTR, reducción de dividendos preferentes) si mejora percepción crediticia.\n- Resolución favorable de la consulta MSCI sobre 'non-operating companies' (pendiente tras respiro de enero 2026).\n\n**Riesgos (por materialidad):**\n- Dilución vía ATM de preferentes (STRC/STRK/STRF/STRD) y acciones comunes si mNAV sigue en descuento, licuando a accionistas existentes.\n- Nueva caída de BTC empeoraría pérdidas contables y presionaría aún más el mNAV y el servicio de dividendos preferentes.\n- Riesgo de exclusión de índices (MSCI dejó puerta abierta a revisión de 'digital asset treasuries'; podría gatillar salidas pasivas de miles de millones).\n- STRC cotizando ~10% bajo par indica fricción en el financiamiento; si persiste, limita la flexibilidad de capital.", "sentimiento": "- HECHO: percentil de precio a 1 año de 3,4% = pesimismo extremo técnico, coherente con narrativa mediática negativa ('MSTR August Slump', Motley Fool bajista).\n- HECHO: pese a ello, Barclays mantiene 'Overweight' aunque bajó precio objetivo a US$125 desde US$130 tras Q2.\n- LECTURA (contraria): en extremos de pesimismo, la operativa de tesorería sigue estable (sin ventas forzadas masivas, solo ~0,2% de holdings vendido) y el dividendo STRC se sostuvo en 12%, lo que matiza el pánico.\n- HECHO: la acción subió 4,4% el día del reporte de pérdida de US$8,22 mil M, mostrando que el mercado ya distingue pérdida contable de flujo de caja real.", "conclusion": "MSTR es un derivado apalancado de BTC en fase defensiva: pausa de compras, primera venta formal de BTC, y mNAV en descuento básico rompen temporalmente el motor de acumulación vía prima de acciones. El BTC en tesorería (842k, costo US$75.419) queda por sobre el spot (~US$63.776), y el percentil de precio de solo 3,4% marca zona de pesimismo extremo. La tesis de mediano plazo sigue atada casi 1:1 al precio de BTC; el nuevo framework de capital reduce riesgo de estrés en preferentes pero no elimina la dilución ni el riesgo de exclusión de índices."}, "scores": {"tecnica": {"score": 42, "just": "RSI neutral (43) sin sobreventa pese a caída de -4,56%; MACD por sobre señal sugiere posible cambio de carácter, pero tendencia de fondo (SMA50/200) sigue muy bajista y sin confirmación de piso."}, "fundamental": {"score": 40, "just": "BTC Yield YTD cayó de 9,6% a 4,5%; pérdida contable no-cash de US$8,22 mil M en Q2; pausa de compras y primera venta de BTC bajo nuevo framework debilitan la tesis de acumulación pura, aunque holdings (842k BTC) siguen intactos en un 99,8%."}, "sentimiento": {"score": 55, "just": "Percentil de precio 1y de 3,4% = pesimismo técnico extremo, leído en contrario como posible sobrerreacción; operativa (dividendo STRC 12% sostenido, sin ventas forzadas masivas) permanece estable, matizando el pánico mediático."}, "riesgo": {"score": 35, "just": "Riesgo real: dilución vía ATM de preferentes/comunes si mNAV sigue en descuento, riesgo latente de exclusión de índices (MSCI en revisión), y apalancamiento total a BTC. El -79,5% de max drawdown ya vivido no se penaliza de nuevo; volatilidad de 81% anualizada es alta pero esperable en este activo."}, "conviccion": {"score": 45, "just": "Asimetría mixta: mNAV básico en descuento (0,68x) puede ser oportunidad de comprar BTC 'barato' vía acciones, o trampa de valor si el descuento persiste y la dilución continúa erosionando BTC por acción. Depende críticamente de que BTC recupere sobre el costo promedio de MSTR."}}, "sources": ["CoinDesk, 03/08/2026 - Strategy sold another $105 million of bitcoin last week, repurchased $81.2 million of STRC", "Coinpaper, 03/08/2026 - MSTR Stock Falls 5% as Strategy Sells 1,637 Bitcoin, Cuts Holdings to 842,138 BTC", "Benzinga, 03/08/2026 - Strategy Sold 1,638 BTC for $105 Million: Will MSTR Now Plunge Below $90?", "Invezz, 03/08/2026 - Strategy (MSTR) stock rises as Saylor sells Bitcoin, boosts $4B USD reserve", "CoinDesk, ercibida del modelo de acumulación pura."}, "asimetria": {"score": 50, "just": "Si BTC recupera hacia/sobre el costo promedio (US$75.419), el efecto apalancado en MSTR sería significativo; pero si BTC sigue débil, la dilución y el mNAV en descuento amplifican la pérdida — asimetría condicionada casi 1:1 al precio de BTC."}, "catalizadores": {"score": 45, "just": "Catalizadores dependen de factores externos (recuperación de BTC, resolución MSCI) más que de acción corporativa propia; la pausa de compras y venta de BTC reducen catalizadores positivos autogenerados en el corto plazo."}, "contrarian": {"score": 60, "just": "Percentil de precio de solo 3,4% y sentimiento mediático muy negativo ('slump') configuran zona de pesimismo extremo; la estabilidad operativa (dividendo STRC sostenido, sin pánico de ventas) sugiere que el mercado podría estar sobrecastigando la noticia de venta de BTC."}}, "plan": {"recomendacion": "Esperar gatillo", "zona_compra": "Escalonar entre US$80-95 si BTC se estabiliza sobre US$60.000; evitar agregar si BTC rompe bajo US$55.000 (aceleraría pérdidas contables y presión sobre mNAV).", "invalidacion": "Ruptura sostenida de BTC bajo ~US$50.000 combinada con mNAV básico bajo 0,5x, o resolución adversa de MSCI que gatille exclusión de índices.", "gatillos": ["BTC recupera y se mantiene sobre US$70.000 (cerca del costo promedio de MSTR)", "Strategy retoma compras netas de BTC de forma sostenida", "mNAV básico vuelve a superar 1,0x", "Resolución definitiva y favorable de la consulta MSCI sobre 'non-operating companies'"], "horizonte": "6-18 meses", "tamano": "Posición reducida (alta volatilidad, apalancamiento a un solo activo subyacente)", "confianza": "media"}}, "perfil": "Strategy es formalmente una empresa de software de inteligencia de negocios, pero su negocio real es ser un vehículo apalancado de tesorería en bitcoin: el software factura ~$500M anuales y funciona como ancla contable, no como driver de valor. La maquinaria es emitir acciones, convertibles y preferentes perpetuas (~$15.400M vivos) para comprar bitcoin. La lógica es reflexiva y depende del mNAV: mientras la acción cotice sobre el valor de sus bitcoins por acción, emitir es acretivo y el ciclo se autoalimenta. En 2026 se invirtió — el mNAV cayó de ~3,4x a ~0,70x y la empresa pasó de comprador estructural a vendedor, liquidando posiciones para sostener su reserva en dólares sobre 840.447 BTC comprados a ~$75.385 promedio. Lo estructural: exige acceso permanente al mercado de capitales; las preferentes son una obligación de caja perpetua contra un activo que no genera flujo; y los ETFs spot erosionaron su moat original. El riesgo terminal es la espiral: descuento sobre NAV, imposibilidad de emitir, venta de bitcoin para pagar cupones."}, {"ticker": "CCU", "company": "Compañía Cervecerías Unidas S.A.", "statsList": [["Precio", "$5.585 CLP (10-ago-2026)"], ["Rango 52 sem.", "$4.947 – $6.598 CLP"], ["Listado", "Bolsa de Santiago: CCU (IPSA) · ADR NYSE: CCU US$11,25"], ["Market cap", "~CLP 1,95-2,0 billones (US$2,06B vía ADR)"], ["P/E · EV/EBITDA", "17,3x trailing / ~15x fwd · EV/EBITDA 8,7x"], ["Dividend yield", "~3,0% (div. definitivo $74,53 pagado abr-2026)"], ["Target consenso", "$5.877 CLP (+11%) — 2 buy / 4 hold / 4 sell"], ["Próx. earnings", "6-ago-2026 (2T26)"], ["Técnico (auto)", "RSI 63.2 · MACD +65.35 / señal +59.20 (TradingView, 10-ago-2026)"]], "change": {"day": 1.55, "week": 1.55}, "sections": {"resumen": "CCU llega a julio 2026 como un claro rezagado del rally chileno: mientras el IPSA encadena máximos históricos, la acción opera ~20% bajo su máximo de 52 semanas ($6.598) tras un año bajista, aunque en las últimas semanas construye una base sobre los $5.000 con el MACD recién cruzado al alza. La tesis tiene tres patas: un negocio en Chile que opera muy bien (EBITDA +13,7% en 1T26, margen 20%, viento a favor del peso fuerte), dos lastres visibles (Argentina con EBITDA −18,6% y Vinos con −50,1%) y una valuación ~20% por debajo de su promedio histórico de 10 años. El consenso es tibio (Hold/Neutral, target $5.877) pero con dispersión extrema: BICE ve +52% ($7.794) y UBS recomienda vender ($4.750). Catalizadores inmediatos: resultados 2T26 el 6-ago y las primeras señales del nuevo CEO Eduardo Ffrench-Davis, que asumió el 1-jul con foco declarado en márgenes y eficiencia.", "fundamental": "**Resultados 1T26** (reportados 6/7-may-2026):\n\n- HECHO: Ventas consolidadas CLP 819.515 millones (+0,2% a/a); EBITDA CLP 131.644 millones (+0,1%), margen estable en 16,1%; utilidad controladora CLP 53.856 millones (−6,8%, ~US$58M); UPA CLP 145,8; volúmenes consolidados +1,8% (press release 1Q26 / TipRanks / La Tercera, may-2026).\n- HECHO — **Chile, el motor**: ventas +3,9%, EBITDA +13,7% a CLP 107.357 millones, margen 20,0% (+173 pb), ayudado por la apreciación del CLP de 8,1% vs USD (menores costos dolarizados) y volúmenes +3,9% liderados por categorías no alcohólicas (press release 1Q26, may-2026).\n- HECHO — **Negocios Internacionales** (Argentina, Bolivia, Paraguay, Uruguay): ventas −6,7%, EBITDA −18,6% a CLP 28.489 millones; volúmenes −1,7% con caída de un dígito medio en cerveza en Argentina (press release 1Q26).\n- HECHO — **Vinos**: ventas −7,2%, EBITDA −50,1% a CLP 3.288 millones (margen −508 pb) por mayor costo del vino y sobreoferta global (~US$19B de inventario excedente en la industria) (press release 1Q26; DF, 12-jun-2026).\n- HECHO: TTM en USD (ADR): revenue US$3,13B (−2,2%), utilidad neta US$121,8M (−32,0%); ROE 7,3-7,9%; Deuda/Patrimonio 0,71x (StockAnalysis 20-jul-2026; Visfin jul-2026).\n\n**Propiedad y movimientos corporativos:**\n\n- HECHO: IRSA controla el 65,87% de CCU; IRSA es JV 50/50 entre Quiñenco y Heineken. Free float: 20,04% local + 14,09% ADR (ccuinvestor.com, 2026).\n- HECHO: CCU completó la compra de la participación de Nestlé en el JV de aguas por US$180 millones (DF, 12-jun-2026).\n- HECHO: Eduardo Ffrench-Davis asumió como CEO el 1-jul-2026 tras 28 años de Patricio Jottar, quien pasa al directorio; Alexandre Carreteiro (presidente de Heineken Américas) fue nombrado vicepresidente del directorio (TipRanks, jul-2026).\n- LECTURA: el negocio chileno (dos tercios del EBITDA) está en su mejor momento de márgenes en años; el problema de CCU no es operacional en su core, sino la exposición a Argentina y al ciclo global del vino. La mayor injerencia de Heineken en el directorio puede traer disciplina de márgenes o tensión con Quiñenco — sin evidencia de conflicto por ahora.", "valuacion": "- HECHO: P/E trailing 17,25x local / 16,9-18,4x ADR; forward ~15x (BTG estima 13,3x); EV/EBITDA 8,66x (Investing/Visfin/StockAnalysis, jul-2026).\n- HECHO: la acción transa **~20% por debajo de su promedio de valuación de los últimos 10 años** (DF, 12-jun-2026).\n- HECHO: dividend yield ~3,0% local (dividendo definitivo N°272 de $74,53 por acción pagado desde el 24-abr-2026) (TipRanks/Diario Estrategia, abr-2026).\n- HECHO — targets locales: consenso **$5.877 CLP (+11%)**, máx $6.600, mín $4.365; 2 buy / 4 hold / 4 sell (Investing.com, jul-2026). Casas (DF, 12-jun-2026): **BICE Sobreponderar PO $7.794 (+52%)**, **BTG Neutral PO $6.500**, **UBS Vender PO $4.750** (argumenta crecimiento de ingresos de un dígito hasta 2028).\n- HECHO: ADR consenso Hold, target US$12,46 (+10,8%, 7 analistas) (StockAnalysis, 20-jul-2026).\n- LECTURA: la valuación es el corazón de la tesis alcista — múltiplos comprimidos contra la propia historia con un IPSA que transa ~12% caro vs la suya. Pero el descuento tiene causa: el upside depende de que Argentina y Vinos se normalicen, no del negocio chileno que ya opera bien y está en el precio. La dispersión BICE/UBS (de +52% a −7%) refleja exactamente esa apuesta.", "tecnico": "- HECHO: precio $5.285 CLP, +1,28% en la sesión del lunes 20-jul y +1,63% vs 5 ruedas atrás (TradingView tiempo real, 20-jul-2026).\n- HECHO: RSI(14) diario 56,3 — neutral con sesgo alcista; MACD(12,26,9) +12,6 sobre señal −1,0 (histograma +13,6): **cruce alcista reciente** (calculado sobre 130 barras diarias de TradingView, 20-jul-2026).\n- HECHO: precio sobre la SMA20 (~$5.183, +2,0%) y SMA50 (~$5.204, +1,6%), y justo en la SMA100 (~$5.285); bajo la MM200 publicada (~$5.670) (TradingView 20-jul-2026; Visfin jul-2026).\n- HECHO: señal técnica diaria \"Strong Buy\", semanal neutral (Investing.com, jul-2026). Mínimo de 52 semanas $4.947 tocado a inicios de mayo; desde ahí, piso doble en la zona $5.000-5.050 (jun y feb).\n- LECTURA: estructura de base tras 12 meses bajistas (−16,6% en las últimas ~26 semanas). Soportes: $5.183-5.204 (SMA20/50) y $5.000-4.947; resistencias: $5.443 (máximo intradía del 20-jul), $5.670 (MM200) — su recuperación sería la confirmación de cambio de tendencia — y la zona $6.600. El cruce de MACD con RSI aún lejos de sobrecompra deja espacio al rebote, pero mientras siga bajo la MM200 es un rebote dentro de tendencia bajista, no una tendencia alcista nueva.", "catalizadores": "- HECHO: **resultados 2T26 el 6-ago-2026** (StockAnalysis, jul-2026). LECTURA: trimestre de invierno, estacionalmente débil en volúmenes; el foco estará en si Chile sostiene margen 20% y en el ritmo de deterioro/mejora argentino.\n- HECHO: **nuevo CEO** Eduardo Ffrench-Davis desde el 1-jul-2026, con prioridad declarada en márgenes y eficiencia; renovación de comités del directorio entre julio y agosto (DF 12-jun-2026; TipRanks jul-2026). LECTURA: primer plan estratégico del nuevo management es el catalizador idiosincrático más cercano.\n- HECHO: **tipo de cambio** — USD/CLP ~926 (14-jul-2026), con el CLP apreciado 8,1% vs USD en 1T26: viento a favor directo en costos dolarizados del segmento Chile (dolarhoy.net; press release 1Q26).\n- HECHO: **insumos** — aluminio LME ~US$3.160-3.200/t con inventarios −43% en el año y déficit proyectado (~930 kt según Macquarie); cebada y lúpulo europeos +12-18% de costo desembarcado en 1T26 (TradingEconomics/AgMetalMiner/Expert Market Research, jul-2026).\n- HECHO: **Argentina** — consumo masivo −3,3% acumulado en 2026, pero inflación mensual desacelerando (<2% proyectado para julio) y expectativa de recuperación gradual del consumo en 2S26 (Bloomberg Línea/Infobae, jun-2026). LECTURA: la recuperación argentina es la opción de mayor convexidad de la tesis.\n- HECHO: **macro Chile** — PIB 1T26 −0,5% a/a, Imacec de mayo −0,9% (quinto retroceso consecutivo), Banco Central recortó el crecimiento 2026 hacia ~1%, riesgo de recesión técnica (Emol/Bloomberg/XTB, mar-jul 2026). LECTURA: el 1T26 se benefició de un consumo chileno que ya no acelera — el viento de cola doméstico se está apagando.", "sentimiento": "- HECHO: consenso local Neutral con 2 buy / 4 hold / 4 sell y PO $5.877 (Investing, jul-2026); ADR Hold con target US$12,46 (StockAnalysis, 20-jul-2026). El DF tituló (12-jun-2026): \"Argentina y alta exposición a vinos y cervezas hacen dudar al mercado\".\n- HECHO: noticias de los últimos 45 días — cierre de la compra del JV de aguas a Nestlé (US$180M, jun), cambio de CEO y reordenamiento del directorio con mayor presencia de Heineken (1-jul), y entrada en vigencia de nuevas restricciones a la publicidad de alcohol en Chile el 7-jul-2026.\n- HECHO: contexto IPSA — el índice acumula ~70 máximos históricos en el año, transa ~12% más caro que su historia, con flujos extranjeros récord (US$112M vía el principal ETF en el año) y targets como el de Bci en 12.050 puntos; el optimismo se moderó en julio por el débil crecimiento (DF/Emol/Bloomberg, 2026).\n- LECTURA: el contraste es la historia — el IPSA en máximos mientras CCU está 20% bajo su peak la convierte en uno de los grandes laggards del rally chileno. Eso sostiene el argumento de valuación relativa (BICE), pero 4 de 10 analistas locales recomiendan vender: el mercado no compra la normalización de Argentina y Vinos todavía. Sin datos públicos de posicionamiento institucional o insiders para el papel local.", "conclusion": "CCU es una apuesta de valuación y reversión a la media, no de momentum: negocio core chileno en su mejor nivel de márgenes, múltiplos 20% bajo su historia, 3% de yield, y dos lastres (Argentina, Vinos) que explican el descuento y cuya normalización — no garantizada — es el upside. El técnico acompaña por primera vez en meses (cruce de MACD, sobre SMA20/50, doble piso en $5.000) pero la MM200 en $5.670 sigue arriba como techo de la tendencia. Con el consenso en Hold y el IPSA caro, el papel ofrece asimetría razonable bajo $5.300 con soporte claro en $5.000, catalizador fechado el 6-ago (2T26) y la incógnita del plan del nuevo CEO. La señal es **Hold** con sesgo constructivo: para pasar a Buy se necesita recuperar la MM200 y/o evidencia de que Argentina dejó de drenar EBITDA; para venderla, perder los $5.000 que ya defendió dos veces."}, "scores": {"tecnica": {"score": 60, "just": "Rebote con confirmación: cruce alcista de MACD, RSI 56 con espacio, precio sobre SMA20/50 y doble piso defendido en $5.000. Se descuenta porque sigue bajo la MM200 ($5.670) y 20% bajo el máximo de 52 semanas — es una base dentro de tendencia bajista, aún no una tendencia alcista."}, "fundamental": {"score": 62, "just": "Chile (dos tercios del EBITDA) con margen 20% y EBITDA +13,7%, balance sano (D/E 0,71x) y valuación 20% bajo su media histórica con 3% de yield. Los lastres pesan: Argentina −18,6% y Vinos −50,1% de EBITDA, utilidad total −6,8% y ROE mediocre (~7,5%)."}, "sentimiento": {"score": 46, "just": "Consenso tibio con 4 de 10 analistas locales en venta, laggard notorio del rally IPSA y titulares de prensa escépticos (\"hacen dudar al mercado\"). A favor: dispersión de targets con el extremo alcista (BICE +52%) bien argumentado y flujos extranjeros récord hacia la bolsa chilena que eventualmente rotan a rezagados."}, "riesgo": {"score": 50, "just": "Negocio defensivo de consumo básico con 65% del mercado cervecero chileno y controlador sólido (Quiñenco/Heineken), pero triple exposición adversa: macro chilena deteriorándose (5 Imacec negativos), Argentina sin piso confirmado, sobreoferta global de vino, más costos de aluminio y cebada al alza y nuevas restricciones publicitarias vigentes desde el 7-jul."}, "conviccion": {"score": 55, "just": "Catalizadores concretos y fechados (2T26 el 6-ago, plan del nuevo CEO, recuperación argentina en 2S26) y tesis falsable con niveles claros ($5.000 abajo, MM200 $5.670 arriba). La convicción es media porque el timing de la normalización de Argentina y Vinos es incierto y el consenso lleva meses sin comprarla."}}, "sources": ["TradingView — BCS:CCU tiempo real, 130 barras diarias; RSI/MACD/SMA calculados (20-jul-2026)", "Investing.com — cotización local, consenso 2/4/4, PO $5.877, P/E, yield (jul-2026)", "StockAnalysis.com — ADR CCU, targets, forward P/E, EV/EBITDA, earnings 6-ago (20-jul-2026)", "Visfin.cl — MM50/200, ROE, D/E (jul-2026)", "CCU Investor — Press Release 1Q26 (6-may-2026)", "TipRanks — resultados 1T26; transición CEO/directorio; dividendo abr-2026 (may-jul 2026)", "La Tercera/Pulso — utilidad 1T26 US$58M (may-2026)", "Diario Financiero — POs BICE $7.794 / BTG $6.500 / UBS $4.750; compra JV aguas Nestlé US$180M (12-jun-2026)", "ccuinvestor.com / Quiñenco — estructura de propiedad IRSA 65,87% (2026)", "Bloomberg Línea / Infobae — consumo Argentina −3,3% 2026, inflación desacelerando (jun-2026)", "Bloomberg / Emol / XTB — macro Chile: Imacec, riesgo de recesión técnica, gobierno Kast (mar-jul 2026)", "TradingEconomics / AgMetalMiner — aluminio LME, déficit proyectado (jul-2026)", "Expert Market Research / Mordor — mercado cervecero Chile: CCU ~65%, ABI ~30% (2025-2026)", "Senado.cl / La Tercera — Ley 21.363: restricciones publicidad alcohol desde 7-jul-2026", "dolarhoy.net — USD/CLP 926 (14-jul-2026)"], "events": [{"date": "2026-08-06", "label": "Resultados 2T26", "kind": "earnings", "info": "Sin consenso público disponible para el 2T26 (trimestre estacionalmente débil). Se mirará si se repite el patrón del 1T26: Chile sólido pero consumo debilitado en Argentina y un negocio del vino 'particularmente difícil' (Diario Financiero, may 2026). Claves: volúmenes por país, traspaso de precios a márgenes y el efecto del tipo de cambio argentino en resultados consolidados."}], "risk": {"volatility_30d": 21.29, "sharpe": 5.41, "sortino": 7.21, "max_drawdown_1y": -24.07, "n_days": 315, "window": 30}, "benchmark": {"ticker": "CBOE:ECH", "label": "ECH (proxy Chile/IPSA)", "relative_performance_30d": 7.54, "relative_performance_ytd": -5.63, "price_percentile_1y": 38.6, "partial": false}, "technical": {"price": 5584.7, "change_1d_pct": 1.55, "change_1w_pct": 1.55, "rsi": 63.2, "macd": 65.3545, "macd_signal": 59.2034, "sma20": 5396.895, "sma50": 5255.034, "sma200": 5650.152, "ema12": 5435.2133, "ema26": 5369.8588, "pct_vs_sma20": 3.48, "pct_vs_sma50": 6.27, "pct_vs_sma200": -1.16, "volume_today": 133241, "volume_avg20": 268546.0, "volume_ratio": 0.5, "volatility_30d": 21.29, "sharpe": 5.41, "sortino": 7.21, "max_drawdown_1y": -24.07, "price_percentile_1y": 38.6, "vs_benchmark_30d_pct": 7.54, "perf_1m_pct": 9.44, "perf_ytd_pct": -4.76}, "sourcesMeta": {"price": {"origin": "TradingView scanner", "fetched_at": "2026-08-10T19:26:32-04:00"}, "rsi_macd": {"origin": "TradingView scanner", "fetched_at": "2026-08-10T19:26:32-04:00"}, "smas_volume": {"origin": "TradingView scanner", "fetched_at": "2026-08-10T19:26:32-04:00"}, "benchmark": {"origin": "TradingView scanner", "symbol": "CBOE:ECH", "fetched_at": "2026-08-10T19:26:32-04:00"}, "risk_metrics": {"origin": "data/history/CCU.json", "n_days": 315}}, "metricChanges": [], "opportunity": {"cats": {"valuacion_hist": {"score": 62, "just": "P/E fwd ~15x y EV/EBITDA 8,7x, por debajo de su media histórica (~17-18x P/E); precio en percentil 26,5 de su rango 1 año y -18% bajo el máximo de 52 sem ($6.598). Barata vs su historia pero sin descuento extremo; dividend yield ~3,0% (Investing/MarketScreener, dashboard 31-jul)."}, "asimetria": {"score": 50, "just": "A $5.385: upside a target consenso $5.877 = +9% (MarketScreener: máx $7.470, mín $3.244); downside a soporte $4.947 (mínimo 52 sem) = -8%. Asimetría ~1:1 al precio actual, poco atractiva; el valor está en el escenario de recuperación argentina, no en el consenso."}, "calidad": {"score": 70, "just": "Líder de cerveza en Chile con Chile-segmento fuerte en 1T26: ventas +3,9% y EBITDA +13,7% con margen 20,0% (+173pb). Pero Internacional (Argentina) EBITDA -18,6% y Vinos -50,1%; EBITDA consolidado plano (CLP 131.644M, margen 16,1%). Negocio sólido con dos lastres cíclicos (StockTitan/TipRanks 1T26)."}, "catalizadores": {"score": 48, "just": "2T26 el 6-ago (dashboard): trimestre estacionalmente débil — consenso espera EPS trimestral negativo (~-32 CLP, Investing) con ingresos ~CLP 989MM; riesgo de titular malo antes que bueno. Catalizador real (estabilización de consumo argentino y vinos) sin fecha; 12-18 meses."}, "contrarian": {"score": 60, "just": "Consenso frío: 2 buy / 4 hold / 4 sell (dashboard; MarketScreener 'Neutral') pese a que Chile —el 60%+ del EBITDA— acelera con margen récord de 20%. Pesimismo notable con datos operativos del núcleo estables/mejorando, aunque no es capitulación extrema (RSI 53,8)."}}, "plan": {"recomendacion": "Esperar gatillo", "zona_compra": "$5.000–5.200 CLP (aproximación al soporte $4.947); a $5.385 no hay margen de seguridad suficiente", "invalidacion": "Cierre semanal bajo $4.900 CLP (pérdida del mínimo de 52 sem) o deterioro del margen Chile bajo 18% en 2T26", "gatillos": ["2T26 (6-ago): margen EBITDA Chile ≥19% y volúmenes Argentina dejando de caer", "Corrección post-resultados hacia $5.000–5.200 por el EPS trimestral negativo esperado", "Primer trimestre con EBITDA de Internacional creciendo en CLP"], "horizonte": "12-18 meses", "tamano": "Media posición como máximo si se da la zona; no perseguir a precio actual", "confianza": "media"}}, "trend": {"piso": 0, "techo": 0, "max": 7, "senales_piso": [], "senales_techo": []}, "perfil": "CCU es una compañía regional multicategoría de bebestibles presente en seis países: produce y distribuye cervezas propias y licenciadas (Cristal, Escudo, Heineken, Budweiser), gaseosas y aguas bajo licencia de PepsiCo, néctares, licores y vinos vía VSPT. El core está en Chile: en 2025 aportó ~64% de los ingresos y ~76% del EBITDA (margen 16,3%), mientras Negocios Internacionales —esencialmente Argentina— sumó ~27% de los ingresos pero solo ~15% del EBITDA con margen de 7,1%, y Vinos ~9%. Consolidado 2025: ingresos CLP 2,91 billones, EBITDA CLP 376.208 millones y deuda neta/EBITDA de 2,02x, apalancamiento conservador. Lo estructural es la asimetría entre un negocio chileno maduro y de márgenes defendibles y una operación argentina volátil, expuesta a devaluación y contabilidad hiperinflacionaria que amplifica la varianza del resultado sin cambiar el valor económico. Además los costos son dolarizados (malta, aluminio, PET) contra ingresos en moneda local, así que una depreciación comprime margen con dos o tres trimestres de rezago. El punto de vigilancia es competitivo: AB InBev le ha quitado participación sostenidamente apoyada en la red de los embotelladores Coca-Cola."}, {"ticker": "CMPC", "company": "Empresas CMPC S.A.", "statsList": [["Precio", "$1.035,6 CLP (10-ago-2026)"], ["Rango 52 sem.", "$1.015 – $1.599 CLP"], ["Listado", "Bolsa de Santiago: CMPC (IPSA) — grupo Matte"], ["Market cap", "CLP 2,68 billones (~US$2.900M)"], ["P/E · P/B · EV/EBITDA", "16,3x trailing / 15,3x fwd · P/B 0,28x · EV/EBITDA 7,9x"], ["Deuda neta / EBITDA", "4,1x (1T26) — rating S&P BBB- desde mar-2026"], ["Dividend yield", "~0,9% (US$0,0105/acción pagado may-2026)"], ["Target consenso", "JPM $1.100 (jul) vs agregadores $1.513-1.712 (rezagados)"], ["Próx. earnings", "6-ago-2026 (2T26)"], ["Técnico (auto)", "RSI 44.8 · MACD -8.59 / señal -6.81 (TradingView, 10-ago-2026)"]], "change": {"day": 0.54, "week": 0.54}, "sections": {"resumen": "CMPC es la gran castigada del IPSA: mientras el índice marca máximos históricos (~11.500 puntos), la papelera del grupo Matte acumula −20% en 12 meses y tocó a inicios de julio un mínimo de 4 años ($1.031), del que rebota tímidamente hacia $1.076. El castigo tiene tres causas concretas: un ciclo de celulosa deprimido (precio promedio −17% en 2025, sobreoferta global), un balance cargado (deuda neta/EBITDA 4,1x, S&P la rebajó a BBB−, a un escalón del grado especulativo) y el megaproyecto Natureza en Brasil (US$4.600M) cuyo financiamiento tiene al mercado apostando a un aumento de capital dilutivo. A favor: P/B de 0,28x — se paga 28% del valor libro —, Softys creciendo EBITDA +20%, un plan de desinversión de US$1.000-1.500M con JPMorgan, y el dato nuevo de julio: el DF reporta que mejoran las expectativas de celulosa para el 2S26, lo que explica el rebote. Es una apuesta de ciclo con balance apretado: alta convexidad si la celulosa repunta, riesgo real de dilución si no.", "fundamental": "**Resultados 1T26** (reportados 8-may-2026; cifras en USD):\n\n- HECHO: ventas US$1.817M (planas a/a, bajo el consenso de US$1.850M); EBITDA ajustado US$255M (−8,1% a/a), margen 14,1% (−1 pp); **utilidad neta US$25M, −50,2% a/a** por menores envíos de celulosa, mayor costo energético (guerra en Medio Oriente), menor valorización forestal y más gastos financieros (DF / La Tercera / Investing, 8-may-2026).\n- HECHO — por segmento: **Celulosa** ventas US$731M, golpeada por mantenciones programadas y no programadas en Guaíba (menor producción, mayor cash cost); **Softys** (tissue) ventas US$835M con EBITDA US$97M (+20% a/a) por eficiencias; **Biopackaging** US$247M con recuperación de márgenes (slides 1T26, may-2026).\n- HECHO: producción de celulosa 987 mil ton; ventas BEKP 799 mil ton (−11% a/a, menores exportaciones a China); cash cost BEKP US$262/ton, BSKP US$400/ton; capex US$185M (+24% a/a) (slides 1T26).\n- HECHO — **balance**: deuda total US$5.915M, caja US$900M, deuda neta US$5.015M → **DFN/EBITDA 4,1x** (vs 3,41x en mar-2025). Guía del call: EPS US$0,01 en 2T26 y US$0,02 en 3T26 con normalización progresiva del apalancamiento (transcript 1T26, may-2026).\n- HECHO: **S&P rebajó el rating de BBB a BBB−** el 2-mar-2026 (un escalón sobre grado especulativo) por desapalancamiento lento, celulosa −17% en 2025, competencia en tissue en Brasil/México e incertidumbre por Natureza; proyecta EBITDA 2026 de US$1.200-1.300M y ~3,0x (La Tercera, 2-mar-2026).\n\n**Proyecto Natureza (Rio Grande do Sul, Brasil):**\n\n- HECHO: inversión US$4.500-4.600M — la mayor inversión chilena en el exterior —, 2,5M ton/año de BEKP, ~US$400M ya invertidos, decisión de construcción dentro de 2026 y operación hacia 2029. Hitos: permiso federal del terminal portuario (ene-2026, acto con Lula) y licencia ambiental preliminar del terminal Rio Grande (jun-2026) (DF / Argentina Forestal / La Tercera, 2026).\n- HECHO — financiamiento: desinversión de activos forestales/inmobiliarios por US$1.000-1.500M asesorada por JPMorgan (incluye Bosques del Plata en Argentina, >94.000 ha); colocó bonos híbridos por UF 7M (~US$312M) a fines de junio con mejor spread que el debut, y prepara hasta UF 10M más; **el mercado especula con un aumento de capital** (Argentina Forestal 17-jun-2026; DF jun-2026).\n- HECHO: dividendo definitivo US$0,0105/acción pagado desde el 12-may-2026; política 2026 de payout 30%; yield ~0,9% (Diario Estrategia / StockAnalysis, 2026).\n- LECTURA: el 1T26 fue un trimestre de transición con Guaíba en mantención — lo operativo debiera mejorar en 2T/3T —, pero el problema estructural es que con EBITDA deprimido, 4,1x de leverage y US$4.600M de capex por delante, la matemática solo cierra con ventas de activos exitosas o dilución. Softys es la joya silenciosa del cuadro.", "valuacion": "- HECHO (StockAnalysis, 20-jul-2026): P/E trailing 16,3x / forward 15,3x; **P/B 0,28x**; EV/EBITDA 7,9x; EV/Ventas 1,13x; beta 0,17.\n- HECHO — targets con dispersión enorme: **JPMorgan Neutral, PO $1.100 a dic-2026** (el más fresco, citado por DF el 17-jul-2026, tras recortes previos desde $1.600); **MBI sobreponderar, PO $2.077** (recortado desde $2.417, upside >50%); agregadores: Investing $1.513 (máx $2.807 / mín $1.089), MarketScreener $1.712 (3 comprar / 2 vender), TradingView ~$1.754 (4 comprar / 8 mantener / 0 vender) — con fechas de corte no publicadas.\n- LECTURA: el P/B de 0,28x es el dato más llamativo — típico de fondo de ciclo más descuento por apalancamiento y riesgo de dilución. El EV/EBITDA ~8x NO es barato porque el EBITDA está deprimido: la acción es una apuesta a normalización de EBITDA, no a múltiplo bajo. El consenso de agregadores ($1.500-1.750) luce rezagado frente al PO de julio de JPMorgan ($1.100, prácticamente el precio actual): el sell-side fresco no ve upside sin repunte de celulosa. Los targets altos descansan en normalización + desinversión sin dilución.", "tecnico": "- HECHO: precio $1.076,5 CLP, +0,61% en la sesión del lunes 20-jul pero **−2,93% vs 5 ruedas atrás** (TradingView tiempo real, 20-jul-2026).\n- HECHO: RSI(14) diario 52,2 — neutral; MACD(12,26,9) +5,0 sobre señal +1,1 (histograma +3,8), positivo tras el rebote desde $1.031 (calculado sobre 130 barras diarias de TradingView, 20-jul-2026). Investing.com publica RSI 46,5 y señal \"venta fuerte\" por medias móviles (1 compra / 11 ventas) (jul-2026).\n- HECHO: precio sobre la SMA20 (~$1.059, +1,6%) y SMA50 (~$1.071, +0,5%), pero −5,3% bajo la SMA100 (~$1.137) y lejos de los niveles de inicio de año ($1.480): −27% en ~26 semanas (TradingView, 20-jul-2026).\n- LECTURA: tendencia de fondo claramente bajista con rebote incipiente de julio. Soportes: $1.059-1.071 (SMA20/50) y la zona crítica **$1.015-1.031** (mínimo de 52 semanas y de 4 años — perderla abriría un tramo bajista nuevo). Resistencias: $1.094-1.110 (cierres de la semana pasada y SMA100 en $1.137) y luego $1.180. Ojo: los niveles \"soporte $1.500 / resistencia $2.500\" que circulan en ideas antiguas de TradingView están obsoletos, son previos al derrumbe. El rebote es de expectativas (celulosa 2S26), no de confirmación técnica: bajo la SMA100 y con las medias largas vendedoras, sigue siendo un intento de piso, no un cambio de tendencia.", "catalizadores": "- HECHO: **resultados 2T26 el 6-ago-2026** (Investing, jul-2026). LECTURA: con Guaíba normalizada tras las mantenciones, el mercado buscará cash cost a la baja y confirmación de la guía (EPS US$0,01).\n- HECHO — **celulosa, el driver dominante**: en China la fibra corta promedia RMB 4.417/ton (10-jul-2026) con julio como temporada baja, papeleras comprando lo mínimo e inventarios altos (SunSirs); NBSK lista en EE.UU. cayó a US$1.570/t en mayo por sobreoferta (Fastmarkets, 5-jun-2026). Referencias 2026: Fitch proyecta BEKP US$625/t promedio; BTG estimaba US$575-600/t neto China (dic-2025).\n- HECHO: el DF reporta (17-jul-2026) que **mejoran las expectativas de celulosa para el 2S26**, con efecto anticipado en Arauco y CMPC — es lo que explica el rebote desde $1.031. LECTURA: es el catalizador que mueve la aguja; si la temporada alta china (sept-oct) no convalida, el rebote se deshace.\n- HECHO — **plan de desinversión**: US$1.000-1.500M en activos no estratégicos (Chile, Brasil, Argentina) con JPMorgan; decisión final de construcción de Natureza esperada dentro de 2026 (Argentina Forestal / DF, jun-2026). LECTURA: un cierre exitoso de ventas de activos sin aumento de capital sería el catalizador idiosincrático más potente; lo contrario (aumento de capital) es el mayor riesgo de corto plazo.\n- HECHO — **oferta rival**: Arauco alcanzará 5,2M ton (MAPA ~85% de utilización) y construye Sucuriú en Brasil (US$4.600M, ~70% de avance); Suzano presiona precios — es la base del Neutral de JPMorgan (DF, 17-jul-2026).\n- HECHO: USD/CLP ~926-932 en julio (dolarhoy/Wise). LECTURA: a diferencia de CCU, un peso fuerte es viento en CONTRA para CMPC (exportadora con costos en CLP e ingresos en USD).", "sentimiento": "- HECHO: recomendaciones divididas — JPMorgan Neutral PO $1.100 (jul-2026), MBI sobreponderar PO $2.077, MarketScreener 3 comprar / 2 vender, agregador TradingView 4 comprar / 8 mantener / 0 vender. Sin notas frescas de BTG/Santander/BICE/LarrainVial en las fuentes consultadas.\n- HECHO — noticias de los últimos 30 días: colocación de híbridos por ~US$312M con mejor spread (fines jun), licencia ambiental del terminal de Natureza (23-jun), JPMorgan liderando la desinversión con el mercado apostando a aumento de capital (17-jun), y la nota del DF sobre el repunte de expectativas de celulosa (17-jul).\n- HECHO — contexto: IPSA en máximos históricos (~11.500 pts), inversión extranjera en Chile en récord (US$46.987M de stock de no residentes, más del doble que 2024), bolsa ~12% más cara que su historia (DF/Emol, 2026).\n- LECTURA: sentimiento negativo-a-neutral con giro incipiente. CMPC es de las pocas grandes del IPSA en rojo a 12 meses (−20%) en un mercado eufórico — el flujo extranjero récord aún no rota hacia ella porque el riesgo de aumento de capital mantiene cautos a los institucionales. El rebote de julio es de expectativas, no de resultados: frágil pero con combustible si el 2S26 convalida, porque el posicionamiento en el papel es liviano.", "conclusion": "CMPC es la apuesta cíclica profunda del panel chileno: 0,28x valor libro, −33% desde el rango alto de 52 semanas, en mínimos de 4 años hace tres semanas, con el driver (precio de la celulosa) posiblemente girando al alza en el 2S26 según las expectativas que recoge el DF. Pero el balance no perdona: 4,1x deuda neta/EBITDA, rating a un escalón del grado especulativo y US$4.600M de Natureza por financiar hacen que la tesis dependa de que TODO salga razonablemente bien — celulosa arriba, activos vendidos a buen precio, sin dilución. La asimetría es atractiva para perfiles tolerantes al riesgo (si el ciclo gira, el recorrido a los targets de $1.500-2.000 es enorme), pero el PO fresco de JPMorgan ($1.100) dice que el sell-side no ve upside inmediato. La señal es **Caution**: especulativa de ciclo, no de calidad. Gatillos para subirla a Hold/Buy: celulosa china repuntando en la temporada alta (sept-oct), cierre de desinversiones sin aumento de capital, o 2T26 (6-ago) con cash cost mejorando. Gatillo de salida: perder los $1.015-1.031."}, "scores": {"tecnica": {"score": 45, "just": "Rebote incipiente con MACD positivo y precio sobre SMA20/50 tras defender el mínimo de 4 años en $1.031, pero la tendencia de fondo sigue bajista: −5,3% bajo la SMA100, −27% en 6 meses, y las medias largas en señal de venta (1 compra / 11 ventas según Investing). Intento de piso, no cambio de tendencia."}, "fundamental": {"score": 40, "just": "Utilidad −50% en 1T26, EBITDA deprimido por el ciclo de celulosa, leverage de 4,1x con rating BBB− a un escalón del especulativo y US$4.600M de Natureza por financiar. Lo rescatable: Softys con EBITDA +20%, P/B de 0,28x, guía de mejora secuencial y un plan de desinversión de US$1.000-1.500M en marcha."}, "sentimiento": {"score": 45, "just": "Gran rezagada del IPSA en un mercado en máximos, con el sell-side fresco (JPMorgan $1.100) sin ver upside y el mercado apostando a un aumento de capital dilutivo. El giro de expectativas de celulosa del 2S26 (DF, 17-jul) y el posicionamiento liviano dan combustible al rebote si se convalida."}, "riesgo": {"score": 30, "just": "El perfil de riesgo más alto del panel chileno: apalancamiento 4,1x, rating al borde del grado especulativo, ciclo de celulosa en sobreoferta con Arauco y Suzano agregando capacidad, riesgo de dilución por Natureza, shock de costos energéticos e incendios/Araucanía recurrentes (61 siniestros en la última temporada, mitad intencionales)."}, "conviccion": {"score": 40, "just": "Tesis falsable con niveles y fechas claras (soporte $1.015-1.031, 2T26 el 6-ago, temporada alta china sept-oct, decisión de Natureza en 2026), pero de baja probabilidad compuesta: exige simultáneamente repunte de celulosa, desinversión exitosa y no-dilución. Apta solo como posición especulativa dimensionada."}}, "sources": ["TradingView — BCS rde de investment grade). 1T26: EBITDA US$255M (margen 14,1%) estable por eficiencias, pero utilidad -33% t/t a US$25M. Productor de bajo costo del grupo Matte — activo de calidad con balance débil en fondo de ciclo (Investing/TradingView 1T26)."}, "catalizadores": {"score": 55, "just": "2T26 el 6-ago: foco en EBITDA y desapalancamiento. JPM ve celulosa presionada en 2S26 por sobreoferta, pero hay recortes de oferta reales: cierre definitivo de Canfor (softwood), atraso de OKI II de APP y revocación de permisos forestales en Indonesia (Diario Financiero, SunSirs: BHKP China ~4.417 RMB/t estable). Catalizador de precio de celulosa probable en 6-12 meses, no inmediato."}, "contrarian": {"score": 80, "just": "Pesimismo extremo: el sell de JPM la llevó a mínimos de casi 2 años (La Tercera), -24% YTD vs ECH, percentil 3,4 del rango anual, targets locales abandonados. Mientras, ventas y EBITDA se mantuvieron estables en 1T26 (TradingView). Sentimiento en capitulación con operación estable = setup contrarian clásico."}}, "plan": {"recomendacion": "Acumular en zona", "zona_compra": "$1.000–1.060 CLP (ya está en zona; primer tramo aquí, segundo tramo si testea $1.015)", "invalidacion": "Cierre semanal bajo $985 CLP, deuda neta/EBITDA >4,5x en 2T26 o pérdida del investment grade (BBB- a high yield)", "gatillos": ["2T26 (6-ago): EBITDA ≥US$250M y deuda neta estable o cayendo", "Repunte del BHKP neto China desde ~4.400 RMB/t (SunSirs/Fastmarkets) por cierres de capacidad", "Confirmación de S&P de outlook estable en BBB-"], "horizonte": "12-18 meses (jugada de ciclo de celulosa + P/B deprimido)", "tamano": "Escalonado y pequeño al inicio (1/3 de posición objetivo) por el apalancamiento 4,1x; completar solo tras 2T26 sin deterioro de deuda", "confianza": "media"}}, "trend": {"piso": 1, "techo": 0, "max": 7, "senales_piso": ["base construyéndose sobre el mínimo anual"], "senales_techo": []}, "perfil": "CMPC es un grupo forestal-industrial chileno integrado verticalmente, desde plantaciones propias de pino y eucalipto hasta celulosa de mercado, papeles y consumo masivo, con operaciones en ocho países. Se organiza en Pulp (celulosa y madera), Softys (tissue y cuidado personal) y Biopackaging. En 2025 facturó ~USD 7.480 millones con un mix de ventas de Softys 45-47%, Pulp 39-40% y Biopackaging 14%, pero la caja se concentra en Pulp, que aportó 59% del EBITDA del 4T25 con margen 21,9% frente a 12,4% de Softys. Chile pesa solo ~16% de las ventas: México y Brasil son los mayores mercados de consumo y Asia absorbe el grueso de la celulosa exportada. Estructuralmente es un negocio precio-tomador, atado al ciclo de la celulosa BHKP y a la demanda china, con Softys como contrapeso de menor margen pero flujo estable. El calce cambiario ayuda (ingresos en dólares contra costos en CLP y BRL) pero la deuda también es dolarizada: el apalancamiento subió a 3,97x EBITDA al cierre de 2025, y sobre eso pesa el proyecto Natureza en Brasil (+USD 4.500 millones), que define el perfil de riesgo de los próximos años."}, {"ticker": "CENCOSUD", "company": "Cencosud S.A.", "statsList": [["Precio", "$2.050,0 CLP (10-ago-2026)"], ["Rango 52 sem.", "$1.882 – $3.238 CLP"], ["Listado", "Bolsa de Santiago: CENCOSUD (IPSA)"], ["Market cap", "~CLP 5,3-5,4 billones"], ["P/E · P/B", "18,9-19,0x trailing · P/B 1,07x · ROE 6,9%"], ["Dividend yield", "~1,3% (dividendo $25/acción con cargo a utilidades 2025)"], ["Target consenso", "$2.886 CLP (+49%) — 2 buy / 9 hold / 1 sell (12 analistas)"], ["Próx. earnings", "6-ago-2026 (2T26; conference call 7-ago 11:00)"], ["Técnico (auto)", "RSI 55.0 · MACD -13.68 / señal -31.58 (TradingView, 10-ago-2026)"]], "change": {"day": 0, "week": 0}, "reportDate": "30 de julio de 2026", "events": [{"date": "2026-08-06", "label": "Resultados 2T26", "kind": "earnings", "info": "Publicación tras el cierre del quiet period vigente desde el 16-jul; conference call el 7-ago a las 11:00 (Cencosud IR). El 1T26 falló al consenso en EBITDA (CLP 333.388 MM vs ~351.000 MM) y utilidad (~76.000 MM vs ~95.000 MM), y el CEO habló de 'señales de recuperación alentadoras en las últimas semanas'. Claves: margen de supermercados Chile ante la guerra promocional, tracción de Argentina (share 18,1% y ventas sobre inflación en 1T26), primeras cifras de St. Marche/Makro Colombia y avance vs guidance 2026 (EBITDA US$1.815 MM)."}], "sections": {"resumen": "Cencosud llega a fines de julio 2026 como la acción más castigada del IPSA: cae ~33% en el año y ~35% en 12 meses (peor papel del índice según Emol, 10-jul-2026), operando en $1.935 a solo 3% del mínimo de 52 semanas ($1.882), mientras el IPSA sube ~4,7% en el año y ronda los 11.000 puntos. El derrumbe tiene causas concretas: un 1T26 bajo el consenso (EBITDA ajustado CLP 333.388 MM, −11,4%, vs ~351.000 MM esperados), margen EBITDA 12 meses móviles en 8,4% — el más bajo desde 2020 —, consumo débil y promocional en Chile, y dos adquisiciones (St. Marche en Brasil y Makro Colombia por ~US$158 MM) que el mercado cuestiona por concentrarse en los países de menores márgenes del grupo. El contraste es brutal con 2025, año récord (+70,4% de utilidad). El consenso está en Neutral (9 de 12 en hold) pero el target promedio de $2.886 implica +49% — el mercado ve valor, no catalizador. Cita fechada: resultados 2T26 el 6-ago-2026.", "fundamental": "**Resultados 1T26** (publicados 6/7-may-2026):\n\n- HECHO: ingresos consolidados CLP 4.041.009 MM (US$4.565 MM), +0,2% a/a; excluyendo ajuste por hiperinflación argentina y efecto tipo de cambio, −4,4% (press release 1T26 / DF, may-2026).\n- HECHO: EBITDA ajustado CLP 333.388 MM (US$377 MM), −11,4% a/a, margen 8,3%; el consenso esperaba ~CLP 351.000 MM. Margen EBITDA 12 meses móviles: 8,4%, el más bajo desde 2020 (DF, may-2026).\n- HECHO: utilidad ~CLP 76.000 MM, −30% a/a, vs ~CLP 95.000 MM esperados por el consenso (DF, 7-may-2026). El press release en USD reporta US$115 MM (−19,2%) — la diferencia entre medidas (utilidad distribuible/controladora, moneda) hace que la cifra exacta comparable sea discutible; la dirección es inequívoca: bajo expectativas.\n- HECHO — por división/país: tiendas por departamento Chile −12,6%; mejoramiento del hogar Chile −4,6% y Argentina −25,9%; EE.UU. −6,2% en CLP (aunque +2,4% en moneda local, con online +13,0%); Brasil −12,4% (efecto desinversión de Bretas en 2025). Cenco Malls fue el único segmento con crecimiento de ingresos (DF/Investing, may-2026).\n- HECHO — supermercados (~80% de los ingresos del grupo): crecimiento en Perú, Colombia y Chile; Argentina creció sobre la inflación con ganancia de participación en alimentos de 16,8% a 18,1% a/a, online +56,6% y marca propia 20,6% de penetración, pero con mayores provisiones de riesgo (press release 1T26; DF, may-2026).\n\n**Base 2025, guidance y balance:**\n\n- HECHO: 2025 cerró con utilidad CLP 398.119 MM (+70,4%) e ingresos CLP 16.595 miles de MM; EBITDA ajustado ex-hiperinflación CLP 1.509 miles de MM (−3,0%) (press release FY2025 / Businesswire, 5-feb-2026).\n- HECHO: guidance 2026 — ingresos US$18.413 MM y EBITDA ajustado US$1.815 MM; plan de inversiones ~US$600 MM (70% a crecimiento): 20 tiendas nuevas (+42.000 m², 17 supermercados, de los cuales 7 The Fresh Market en EE.UU.) y +40.000 m² de GLA en centros comerciales (Cencosud IR, ene-2026; anunciado en el Cenco Day realizado en Buenos Aires — La Nación, ene-2026).\n- HECHO: leverage ~2,3x a mar-2026; 63,5% de la deuda financiera en USD; deuda total ~CLP 5,6 billones, D/E ~0,99x, ROE 6,9% (Cencosud 1T26; Visfin, 30-jul-2026).\n- HECHO — M&A: adquisición de St. Marche (supermercados premium, Brasil; monto no revelado) y de Makro Colombia (~US$158 MM) (Emol, 10-jul-2026).\n- LECTURA: el guidance 2026 (EBITDA US$1.815 MM vs US$1.587 MM ex-hiperinflación en 2025) luce exigente tras un 1T26 con EBITDA −11,4%; cumplirlo requiere una segunda mitad muy superior. El peso exacto de Argentina en el EBITDA consolidado no es verificable con las fuentes públicas consultadas; sí es verificable que Argentina gana share y crece sobre inflación, pero con provisiones de riesgo al alza y mejoramiento del hogar −25,9%.", "valuacion": "- HECHO: P/E trailing 18,9-19,0x; P/B 1,07x; EV ~CLP 10,9 billones; dividend yield 1,25-1,30% con dividendo de $25/acción propuesto con cargo a utilidades 2025 (Visfin/TradingView, 30-jul-2026; Diario Estrategia).\n- HECHO: consenso Investing — target promedio **$2.886 CLP (+49%)**, máximo $3.520, mínimo $2.040; 2 buy / 9 hold / 1 sell, calificación Neutral (Investing.com, 30-jul-2026).\n- HECHO — casas locales: **Credicorp Capital compra, PO $3.150** (~+50%; \"tremendamente descontado\", Macarena Gutiérrez — DF, 15-may-2026); **MBI subió de neutral a sobreponderar con PO $2.700** (+24% al momento del cambio, jun-2026 — DF); **Banchile compra** (DF, jun-2026, sin PO público); BICE (Eduardo Ramírez) ve \"consistencia estratégica\" en Makro Colombia sin PO publicado; Itaú BBA (Joel Lederman) advierte que no se puede descartar que el ajuste continúe (Emol, 10-jul-2026). POs actualizados de BCI, Santander y LarrainVial: no verificables en fuentes públicas consultadas.\n- LECTURA: la paradoja es que el P/E (~19x) no luce barato pese al −33% del precio, porque la utilidad TTM también cayó; la tesis de descuento se apoya más en P/B ~1,07x, en el castigo relativo (peor acción del IPSA con el índice cerca de máximos) y en el upside de +49% del consenso. Ese upside con 9 de 12 analistas en hold es la definición de \"barata sin catalizador\": nadie quiere ponerse delante de otro trimestre débil el 6-ago.", "tecnico": "- HECHO: precio $1.926,8 CLP (cierre/últimos datos 30-jul), +0,84% intradía según Investing (15:43), −1,80% en 5 días, −9,27% en 1 mes, −33,22% YTD, −32,43% en 12 meses (TradingView web / Investing, 30-jul-2026).\n- HECHO: precio **bajo la SMA50 ($2.099, −8,2%) y muy bajo la SMA200 ($2.581, −25,3%)**; mínimo de 52 semanas $1.882 tocado en julio, a ~2,4% del precio actual (Visfin/Investing, 30-jul-2026).\n- HECHO: señal técnica agregada de TradingView: Neutral (30-jul-2026).\n- LECTURA: tendencia bajista plenamente vigente — máximos y mínimos decrecientes, precio bajo todas las medias relevantes y sin base construida: el mínimo de 52 semanas es de este mismo mes. Soporte inmediato $1.882-1.900 (piso reciente y zona psicológica); resistencias $2.040 (PO mínimo del consenso), $2.099 (SMA50) y la zona $2.580-2.600 (SMA200). A diferencia de otros rezagados del IPSA, aquí no hay señal de reversión que anticipar: comprar hoy es contra-tendencia pura, y el evento del 6-ago puede resolver el rango en cualquier dirección.", "catalizadores": "**Catalizadores:**\n\n- HECHO: **resultados 2T26 el 6-ago-2026**, conference call el 7-ago a las 11:00; quiet period vigente desde el 16-jul (Cencosud IR, jul-2026). LECTURA: es el evento binario del papel — el propio CEO habló de \"señales de recuperación alentadoras en las últimas semanas\" al presentar el 1T26 (DF, may-2026); si el 2T26 muestra estabilización de margen, el rebote desde −33% YTD puede ser violento por posicionamiento.\n- HECHO: **Argentina** gana tracción — share de alimentos 16,8%→18,1% a/a, ventas sobre inflación, online +56,6% (1T26); los supermercados argentinos celebran el primer dato positivo de consumo en dos años y medio (El Cronista, 2026). LECTURA: la normalización del consumo argentino bajo Milei es la opción de convexidad de la tesis, aunque con volatilidad cambiaria como contrapeso.\n- HECHO: **plan de inversiones 2026** de ~US$600 MM con 20 aperturas (7 The Fresh Market en EE.UU.) y +40.000 m² de GLA en malls; integración de St. Marche y Makro Colombia (Cencosud IR; Emol, jul-2026). LECTURA: la primera evidencia de que las adquisiciones suman EBITDA — y no diluyen margen — cambiaría la narrativa que hoy castiga al papel.\n- LECTURA: valuación relativa — con el IPSA cerca de 11.000 puntos y corredoras proyectando 11.500-12.000, la rotación hacia rezagados es un catalizador de flujo posible; Cencosud es el rezagado por antonomasia.\n\n**Riesgos (por materialidad):**\n\n1. HECHO/LECTURA: **consumo débil y guerra promocional en Chile** (~núcleo del EBITDA): tiendas por departamento −12,6% y mejoramiento del hogar −4,6% en 1T26, con margen EBITDA 12M en mínimo desde 2020; Chile acumula 5 meses de contracción económica y desempleo en máximo de 5 años (DF/Emol, may-jul 2026). Es el riesgo que ya está ocurriendo.\n2. HECHO/LECTURA: **ejecución del M&A en países de bajo margen** — Brasil y Colombia generan los márgenes más bajos del grupo y el mercado \"se pregunta por qué invierte en estos países\" (Emol, 10-jul-2026); guidance 2026 exigente tras un 1T26 débil.\n3. HECHO/LECTURA: **Argentina**: mayores provisiones de riesgo ya registradas en 1T26 y sensibilidad del consolidado al tipo de cambio e hiperinflación (el ajuste contable borró 5,2 pts de crecimiento de ingresos en 2025).\n4. HECHO: **deuda 63,5% en USD** con leverage ~2,3x: una depreciación del CLP encarece el servicio de deuda mientras el EBITDA cae (Cencosud 1T26).\n5. LECTURA: **técnico sin piso confirmado**: mínimo de 52 semanas tocado en julio; perder $1.882 abre un tramo bajista sin referencias cercanas.", "sentimiento": "- HECHO: consenso Neutral — 2 buy / 9 hold / 1 sell, target $2.886 (+49%) (Investing, 30-jul-2026). Titulares recientes: \"Por qué el mercado castiga a Cencosud\" (DF, 15-may), \"Acción de Cencosud se hunde 35% en un año, la más castigada del IPSA: la apuesta que inquieta al mercado\" (Emol, 10-jul), \"Acciones de Cencosud se desploman mientras el mercado duda de su plan estratégico\" (Bloomberg Línea, jul-2026).\n- HECHO: comparables — en 2026 Cencosud cae ~29-33% vs Falabella −6,9% y Ripley −10%: el castigo es idiosincrático, no sectorial (Emol, 10-jul-2026).\n- HECHO: voces constructivas — Credicorp (compra, $3.150, \"apuesta súper interesante\" aunque \"la acción puede continuar presionada un tiempo\"), MBI (upgrade a sobreponderar, $2.700), Banchile (compra); del lado cauto, Itaú BBA no descarta más ajuste (DF/Emol, may-jul 2026).\n- HECHO: contexto — el IPSA ronda los 11.000 puntos (+4,7% YTD) con récord de 11.721 el 28-ene-2026, tras un 2025 de +57%; corredoras apuestan por 11.500-12.000 (La Tercera/DF, jul-2026).\n- LECTURA: el sentimiento está deprimido pero no capitulado: 9 de 12 en hold indica analistas esperando el 2T26 para decidir, no vendedores convencidos (solo 1 sell). Ese posicionamiento — junto con targets 24-50% arriba — genera asimetría si el 6-ago sorprende al alza, y explica también por qué cada decepción se paga cara. Sin datos públicos de posicionamiento institucional ni de insiders: no verificable.", "conclusion": "Cencosud es hoy una tesis de deep value con catalizador fechado y sin confirmación técnica: la peor acción del IPSA (−33% YTD contra un índice en zona de máximos), margen EBITDA en mínimos desde 2020, un mercado que duda del plan estratégico y del M&A en Brasil/Colombia, pero un consenso cuyo target promedio implica +49% y casas locales serias (Credicorp $3.150, MBI $2.700) defendiendo el descuento. El evento que ordena todo es el 6-ago-2026 (2T26): estabilización de márgenes y tracción de Argentina validarían la compra contrarian; otro miss como el del 1T26 (EBITDA −11,4% bajo consenso) probablemente rompe el piso de $1.882. La señal operativa es **Hold / esperar el 6-ago**: para un perfil contrarian, escalar posiciones solo con evidencia de margen estabilizado o con el precio recuperando $2.040-2.100 (PO mínimo del consenso y SMA50); el stop natural es la pérdida del mínimo de 52 semanas. Comprar antes del resultado es apostar a una moneda al aire con la tendencia en contra."}, "scores": {"tecnica": {"score": 25, "just": "Tendencia bajista sin señales de giro: −33% YTD, −9,3% en el último mes, precio 8% bajo la SMA50 y 25% bajo la SMA200, con el mínimo de 52 semanas ($1.882) tocado este mismo mes de julio — no hay base construida ni divergencias verificables. Solo la cercanía del soporte y la señal agregada Neutral (no venta) evitan una nota menor."}, "fundamental": {"score": 48, "just": "Grupo diversificado en 6 países con supermercados (~80% de ingresos) defensivos, malls creciendo, share ganando en Argentina y balance manejable (2,3x, D/E ~1,0x), tras un 2025 récord (+70% utilidad). Pesa el presente: 1T26 bajo consenso en EBITDA y utilidad, margen 12M en mínimo desde 2020, guidance 2026 exigente y M&A en los países de peor margen del grupo."}, "sentimiento": {"score": 30, "just": "Peor acción del IPSA en 12 meses con titulares uniformemente negativos (DF, Emol, Bloomberg Línea) y castigo idiosincrático (Falabella −6,9% vs Cencosud −29/−33%). Matiza que solo 1 de 12 analistas recomienda vender, hay upgrades recientes (MBI) y el target consenso implica +49%: pesimismo de precios, no de estimaciones terminales."}, "riesgo": {"score": 38, "just": "Negocio ancla defensivo (supermercados) y liquidez de large cap (~CLP 5,4 billones), pero acumulación de frentes: consumo débil y guerra promocional en Chile, provisiones al alza y volatilidad cambiaria en Argentina, integración simultánea de dos adquisiciones en países de bajo margen, 63,5% de la deuda en USD y un técnico sin piso confirmado a 2,4% del mínimo anual."}, "conviccion": {"score": 40, "just": "Catalizador concreto y cercano (2T26 el 6-ago, call el 7-ago) y tesis falsable con niveles nítidos: $1.882 abajo, $2.040-2.100 arriba. La convicción direccional es baja a propósito — el resultado es binario, el 1T26 ya decepcionó y el propio management admite un entorno 'más desafiante'; la asimetría mejora materialmente solo después del dato o sobre la SMA50."}}, "sources": ["Investing.com — cotización $1.935,1 (+0,84% intradía), consenso 2/9/1, PO $2.886 (máx $3.520 / mín $2.040), rango 52 sem. (30-jul-2026)", "TradingView web (BCS:CENCOSUD) — cierre 1.926,8, −1,80% 5d, −9,27% 1m, −33,22% YTD, market cap 5,43 billones, P/E 18,9, yield 1,30%, señal Neutral, earnings 6-ago (30-jul-2026)", "Visfin.cl — precio 30-jul, SMA50 $2.099 / SMA200 $2.581, P/B 1,07, ROE 6,89%, D/E 99%, deuda total CLP 5,6 billones (30-jul-2026)", "Cencosud IR (cencosud.com/inversionistas) — calendario: resultados 2T26 el 6-ago-2026, call 7-ago 11:00, quiet period desde 16-jul-2026", "Cencosud — press release 1T26 (6/7-may-2026): ingresos CLP 4.041.009 MM / US$4.565 MM, EBITDA aj. CLP 333.388 MM / US$377 MM (−11,4%), margen 8,3%", "Diario Financiero — 'Con un entorno de consumo más desafiante...' (may-2026): miss vs consenso (utilidad ~$76.000 MM vs $95.000 MM; EBITDA vs $351.000 MM), divisiones, cita CEO Rodrigo Larraín", "Diario Financiero — 'Por qué el mercado castiga a Cencosud' (15-may-2026): −25,7% YTD entonces, margen 12M 8,4% mínimo desde 2020, Credicorp PO $3.150", "Emol — 'Acción de Cencosud se hunde 35%...' (10-jul-2026): peor del IPSA, St. Marche y Makro Colombia (~US$158 MM), comparables Falabella/Ripley, citas Itaú BBA/Credicorp/BICE/MBI", "Diario Financiero — MBI sube a sobreponderar con PO $2.700 (jun-2026); Banchile en compra", "Bloomberg Línea — 'Acciones de Cencosud se desploman mientras el mercado duda de su plan estratégico' (jul-2026)", "Cencosud / Businesswire — resultados FY2025 (5-feb-2026): utilidad CLP 398.119 MM (+70,4%), guidance 2026 US$18.413 MM ingresos / US$1.815 MM EBITDA", "Cencosud IR / La Nación — plan de inversiones 2026 ~US$600 MM, 20 aperturas (7 The Fresh Market), +40.000 m² GLA; Cenco Day en Buenos Aires (ene-2026)", "Diario Estrategia — dividendo propuesto $25/acción con cargo a utilidades 2025", "La Tercera / DF — IPSA ~11.000 puntos, +4,7% YTD, récord 11.721 (28-ene-2026), proyecciones 11.500-12.000 (jul-2026)", "Peru-Retail / La República / El Comercio — cobertura 1T26: utilidad US$115 MM (−19,2%) según press release, marca propia 18,5%, Argentina online +56,6% (may-2026)"], "risk": {"volatility_30d": 16.88, "sharpe": -1.85, "sortino": -1.65, "max_drawdown_1y": -40.62, "n_days": 306, "window": 30}, "benchmark": {"ticker": "CBOE:ECH", "label": "ECH (proxy Chile/IPSA)", "relative_performance_3
