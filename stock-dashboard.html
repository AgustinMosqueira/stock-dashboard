úsqueda— cuya monetización puede alterarse con las respuestas generativas; un coste de adquisición de tráfico de US$59.900M (20% de los ingresos publicitarios) que es a la vez foso y pasivo regulatorio; frentes antimonopolio en EE.UU. y la UE; y una integración vertical poco común (datos, Android, silicio propio y modelos propios) que abarata su coste marginal en IA a cambio de un capex que salta hacia ~US$200.000M."}, {"ticker": "AMZN", "company": "Amazon.com, Inc.", "statsList": [["Precio", "$262.07 (24-ago-2026)"], ["Rango 52 sem.", "$196.00 – $278.56"], ["Market cap", "$2.69T"], ["P/E", "29.6x trailing (fwd 25.5x)"], ["Target consenso", "$312.99 (62 analistas)"], ["Próx. earnings", "30-jul-2026 (after close)"], ["Técnico (auto)", "RSI 52.5 · MACD +3.16 / señal +4.63 (TradingView, 24-ago-2026)"]], "sections": {"resumen": "Amazon llega al earnings del 30 de julio con momentum fundamental excepcional: Q1 2026 batió en todas las líneas (revenue $181.5B +17%, AWS +28%, margen operativo récord 13.1%) y el consenso es casi unánimemente comprador (63 buy / 4 hold / 0 sell, target $312.99, ~+25% de upside). El precio, sin embargo, corrigió ~10% desde el máximo de $278.56 y el cuadro técnico es mixto. LECTURA: tesis de calidad con catalizador concreto e inminente; el riesgo de corto plazo es de ejecución en el print de Q2 y del capex de $200B.", "fundamental": "- HECHO: Q1 2026 (reportado ~29-abr-2026, CNBC/Tickeron/TIKR): revenue $181.5B, +17% a/a, vs consenso ~$177B. EPS diluido $2.78 vs $1.63 esperado, aunque inflado por $16.8B de ganancias pre-tax por la inversión en Anthropic. Margen operativo 13.1%, el más alto de la historia de la compañía según el CEO Andy Jassy.\n- HECHO: AWS creció 28% a $37.6B (vs $36.64B StreetAccount), su mayor ritmo en 15 trimestres; operating income de AWS $14.16B, +23%, muy sobre el consenso de $12.84B (CNBC, 29-abr-2026).\n- HECHO: Guidance Q2: crecimiento de ventas 16-19% ($194-199B) con ~$1B de costos adicionales por Project Leo (satélites) y plan de capex 2026 de ~$200B (TIKR, jul-2026).\n\nLECTURA: El negocio está en su mejor momento operativo en años: reaceleración de AWS por demanda de IA, publicidad récord y márgenes en máximos. El moat es triple (escala logística en e-commerce, efecto de red/switching costs en AWS, flywheel de Prime + ads) y se refuerza con la relación estratégica con Anthropic. El riesgo fundamental no es demanda sino intensidad de capital: $200B de capex exigen que AWS sostenga el ~28%.", "valuacion": "- HECHO: P/E trailing 29.58x al 14-jul-2026 (FinanceCharts); otra fuente reporta 34.66x a la misma fecha (discrepancia declarada; el trailing está además distorsionado por la ganancia contable de Anthropic). Forward P/E 25.47x al 26-jun-2026 (valueinvesting.io).\n- HECHO: Promedio histórico propio: 5 años ~46.8-57.8x y 10 años ~71.9-73.1x según FullRatio/FinanceCharts — el múltiplo actual está claramente por debajo de sus propios promedios de 3, 5 y 10 años.\n- HECHO: Vs peers (jun-jul 2026): forward P/E de GOOGL ~19.5x y AAPL ~23.3x (FinanceCharts/Public.com); AMZN cotiza con prima moderada.\n- HECHO: Consenso: target promedio $312.99, máximo $370, mínimo $207, sobre 62 analistas (stockanalysis.com/TipRanks, jul-2026); TD Cowen recortó a $340 desde $350 manteniendo Buy (8-jul-2026); Wells Fargo apunta a $312 (26-jun-2026).\n\nLECTURA: Para el crecimiento (+17% revenue, AWS +28%) y la expansión de márgenes, un forward de ~25x es razonable e históricamente barato para AMZN; la prima vs Google/Apple se justifica por mayor crecimiento. Upside implícito al target promedio: ~+25% desde $250.91.", "tecnico": "- HECHO: Precio $250.91 (16-jul-2026), ~10% bajo el máximo de 52 semanas de $278.56; rango del último mes $225.55-$251.03 (stockinvest.us, 14-jul-2026).\n- HECHO — fuentes en conflicto: AltIndex reporta SMA50 $245.9 > SMA200 $236.1 (configuración alcista), mientras Investing.com/TipRanks reportan SMA50 ~$238-254 con señal de venta y RSI entre 49.4 (neutral) y 67.4 según la fuente; el RSI se declara no verificable con precisión.\n- HECHO: Soportes citados: zona $240.4-245.2, luego $232.5 y $227.0 (cerca del mínimo de 3 meses $225.55); resistencias: $253.7 (SMA50 según ChartMill) y $263.0 (ChartMill/Barchart, jul-2026).\n\nLECTURA: Estructura de mediano plazo alcista (precio muy por encima del piso de $196 y del SMA200 en la mayoría de lecturas) pero corto plazo lateral-correctivo: el rebote desde ~$226 a fines de junio recuperó la zona de $247-251 y ahora enfrenta la resistencia $253-263. Perder $240 abriría retest de $227-232; superar $263 reanudaría la tendencia hacia $278.", "catalizadores": "**Catalizadores:**\n\n- **30-jul-2026 — resultados Q2 2026** (confirmado por aboutamazon.com). Consenso ~$196B revenue y EPS ~$1.82; TD Cowen modela $200.1B (+2% sobre consenso). Prime Day cayó en Q2 este año, un viento de cola que no existió en Q2 2025.\n- **2H 2026 — lanzamiento comercial del servicio de banda ancha Leo** — 396 satélites ya desplegados (NAI500/Technobezz, jul-2026); competencia directa a Starlink.\n- **Continuo — monetización IA:** unidad de $1B de Forward Deployed Engineers en AWS (CNBC, 30-jun-2026), AgentCore y EC2 G7 con Blackwell (AWS Summit NY, jul-2026); derivadas de la relación con Anthropic.\n\n**Riesgos (por materialidad):**\n\n- **Capex $200B en 2026:** si AWS desacelera bajo ~28%, el mercado castigará el retorno sobre ese capital (TIKR, jul-2026).\n- **Evento binario cercano:** el print del 30-jul con expectativas ya elevadas tras el rally post-Q1.\n- **Costos de Project Leo:** ~$1B adicionales en Q2 presionan el operating income guiado.\n- **Distorsión contable Anthropic:** la ganancia de $16.8B es mark-to-market y puede revertirse en trimestres futuros.\n- **Técnico:** pérdida de $240 activa retest de $227; el drawdown de 52 semanas ya fue de ~$278 a ~$226 (-19%).", "sentimiento": "- HECHO: Consenso Strong Buy: 63 buy / 4 hold / 0 sell; target promedio $312.99 ($207-$370) sobre 62 analistas (stockanalysis.com/TipRanks/MarketBeat, jul-2026). Acciones recientes: TD Cowen Buy, PT $340 (8-jul); Wells Fargo recomienda entrada, PT $312 (26-jun). Un resultado atribuye a BofA un PT de $165 (7-jul) — cifra inconsistente con el rango del consenso, se trata como no verificable.\n- HECHO — insiders: CEO Andy Jassy vendió 31,352 acciones a $275.00 el 4-may-2026 (~$8.6M) bajo plan 10b5-1 adoptado el 14-nov-2025; en 6 meses acumula 12 ventas por ~102,096 acciones (~$24.9M) y 0 compras (StockTitan/GuruFocus/MarketBeat). Entidad ligada a Bezos vendió 220,200 acciones a $275.27 el 5-may-2026 (~$60.6M). Entre mayo y julio: 11 ventas de insiders por ~$8.1M, 0 compras (stockcircle/insiderscreener).\n\nLECTURA: Tono de noticias claramente constructivo (AWS reacelerando, IA, Leo). Las ventas de insiders son programadas, pequeñas vs el market cap y consistentes con el patrón histórico de solo-ventas de Amazon; no se lee señal negativa, aunque la ausencia total de compras impide leerlas como señal positiva.", "conclusion": "La tesis funciona si el 30 de julio AWS imprime crecimiento igual o superior al 28% de Q1 y el operating income absorbe los costos de Leo — eso validaría el capex de $200B, cerraría el gap técnico hacia $263-278 y daría sustento al target de $313 con un forward de ~25x que es barato contra la propia historia de Amazon. La invalidarían: (1) AWS desacelerando por debajo de ~25-26% o guidance de Q3 débil, (2) margen operativo retrocediendo claramente desde 13.1% por Leo/capex, (3) pérdida técnica de $240 y luego $227, que rompería la estructura alcista de mediano plazo. Con 0 sells en el consenso, la barra de expectativas es alta: el mayor riesgo no es el negocio sino la asimetría de reacción ante un print apenas en línea."}, "scores": {"tecnica": {"score": 58, "just": "Estructura de mediano plazo alcista (precio $250.91 sobre el SMA200 en la mayoría de lecturas y +28% sobre el piso de 52s de $196), pero corto plazo lateral-correctivo: -10% desde $278.56, resistencia en $253-263 y f ección de corto plazo es el escenario base tras un movimiento vertical.\n- Sentimiento en \"Extreme Greed\" (77): históricamente zona de toma de utilidades, no de nuevas entradas agresivas.\n- El CLARITY Act puede volver a postergarse (ya ocurrió en agosto) por desacuerdos en el Senado.\n- Concentración de ETFs en BlackRock/Fidelity mantiene riesgo de flujo sistémico ante un evento de rescate.", "sentimiento": "- Fear & Greed saltó de zona neutral (44-53) a 77 \"Extreme Greed\" en una semana, cerca de niveles previos a correcciones (Milk Road/KuCoin, 22-23/08/2026).\n- LECTURA (contraria en extremos): euforia unánime tras un rally vertical suele anteceder pausas, no continuación lineal.\n- ETFs con 5 sesiones seguidas de entradas y +US$1.917M en la semana: institucionales persiguiendo el movimiento, no anticipándolo (TFTC, 21/08/2026).\n- BlackRock (IBIT) sigue concentrando la mayor parte de las entradas, consolidando el mercado de ETFs en pocos emisores (CoinDesk, 10/06/2026).\n- Altcoin Season Index en 33-37 (\"temporada Bitcoin\"): la rotación hacia BTC y no altcoins es típica de fases de apetito por calidad (Phemex, 22/08/2026).\n\n**Flujos de capital: ETFs, institucionales y ballenas**\n| Fecha | Flujo neto | Detalle |\n|---|---|---|\n| 17/08/2026 | +US$297,6M | Reinicio de entradas (TFTC) |\n| 18/08/2026 | +US$189,3M | Segunda sesión positiva |\n| 19/08/2026 | +US$517,2M | Mayor entrada en 3,5 meses (The Block) |\n| 20/08/2026 | +US$606,3M | Récord desde el 1-may (Yahoo Finance) |\n| 21/08/2026 | +US$307,0M | Quinta sesión consecutiva (CoinDesk) |\n| Semana 17-21/ago | +US$1.917,4M neto | Mejor semana desde la salida de mínimos anuales |\n| Agosto 2026 (acum.) | ~+US$1.500M neto | 9 de 13 sesiones con entradas (TFTC) |\n\nInstitucional: BlackRock (IBIT) lidera las compras del ETF, seguido por Fidelity y Franklin Templeton (CoinDesk, agosto). Ballenas: sin movimientos aislados >US$500M reportados en la semana del rally; el patrón dominante fue acumulación vía E n al alza de guidance FY3/26 el 24-abr-2026 por robots y equipos de semiconductores en Japón/Norteamérica (TDnet).\n- HECHO: pedidos ligados a humanoides ≈¥1.300M en 2T, proyección ¥2.500M en FY3/26, con posible duplicación/triplicación en FY3/27 por clientes de EE.UU. (Investing.com, jul-2026).\n- LECTURA: negocio automotriz débil (cliente Nissan) compensado por robótica industrial y semis; recuperación de márgenes aún no confirmada en cifras trimestrales.", "valuacion": "- HECHO: P/E TTM disperso entre 82x y 143x-571x según fuente/período, distorsionado por ganancia extraordinaria de ¥4.800M (Simply Wall St, GuruFocus, jul-2026).\n- LECTURA: fair P/E estimado ~41x vs. industria japonesa de maquinaria ~13-15x y peers ~19-34x: valuación exige ejecución perfecta del pipeline humanoide.\n- HECHO: target consenso ≈¥6.491, +5,7% vs. último cierre (MarketScreener, ago-2026).\n- HECHO: market cap ≈¥627.600M (companiesmarketcap, ago-2026), sube desde ≈¥599.000M hace pocos días junto al precio.\n- No verificable en fuentes en inglés: desglose de EV/EBITDA o guía de márgenes por segmento; revisar IR Japan / TDnet directamente.", "tecnico": "- HECHO: precio ¥6.330, +3,09% en el día, RSI 44,6 (zona neutral, sin sobreventa) (TradingView, 3-ago-2026).\n- HECHO: MACD -401,2 bajo señal -283,5, histograma aún negativo pero girando al alza (señal de piso incipiente).\n- HECHO: precio -8,5% vs SMA20 y -12,9% vs SMA50, pero +33,7% vs SMA200: corrección dentro de tendencia alcista mayor.\n- HECHO: caída de 19,3% en el último mes y -38,1% de drawdown máximo a 1 año pese a +64,4% YTD.\n- LECTURA: volumen 1,1x el promedio 20d sugiere participación normal, no pánico vendedor ni clímax comprador.", "catalizadores": "**Catalizadores:**\n- Resultados Q1 FY3/27 el 7-ago-2026: primer chequeo del guidance de recuperación de márgenes.\n- Actualización de pedidos de robots humanoides de clientes norteamericanos (posible duplicación/triplicación en FY3/27).\n- Nuevo plan de mediano plazo 2026-2030 en discusión (Simply Wall St, 2026).\n- Recuperación cíclica en equipos de semiconductores y robótica industrial en Japón.\n\n**Riesgos (por materialidad):**\n- Competencia china creciente (Beijing CTKM, Leaderdrive ~8% share global) presionando precios en reductores armónicos.\n- Debilidad persistente en clientes automotrices (Nissan) sigue lastrando un segmento histórico.\n- Valuación exige ejecución perfecta; P/E muy por sobre fair value y peers implica alto riesgo de múltiplo si decepciona el pipeline humanoide.\n- Adopción de robots humanoides a escala sigue siendo incierta en el corto plazo pese al entusiasmo actual.", "sentimiento": "- HECHO: 8 analistas recomiendan comprar, 1 vender; rating consenso 'Buy' (fuentes agregadas, ago-2026).\n- HECHO: acción saltó tras julio con comentarios optimistas sobre pedidos humanoides en la presentación de resultados.\n- LECTURA: tras el rally, la corrección de -19% en el mes sugiere toma de utilidades más que cambio de tesis; RSI neutral no confirma pánico.\n- LECTURA (contrarian): entusiasmo mediático alto sobre humanoides puede estar ya reflejado en el precio; vigilar si earnings decepciona expectativas ya elevadas.\n- No verificable en fuentes en inglés: ratings específicos de casas japonesas (Nomura, Daiwa, SMBC Nikko); revisar IR Japan/Bloomberg Japan directamente.", "conclusion": "HDSY combina una tesis de crecimiento real (contenido crítico en robots humanoides, recuperación de márgenes FY3/27) con una valuación que ya descuenta mucho optimismo (P/E muy sobre fair value) y competencia china emergente. Técnicamente en fase de corrección sana dentro de tendencia alcista de largo plazo (+33,7% vs SMA200). El 7-ago es el catalizador clave de corto plazo: confirmar o decepcionar el guidance de recuperación."}, "scores": {"tecnica": {"score": 52, "just": "MACD girando al alza (piso incipiente) y RSI neutral tras corrección de -19% mensual, pero aún bajo SMA20/50; no hay sobreextensión ni pánico, señal mixta que premia el 5) y márgenes muy comprimidos por el ciclo de semiconductores y una capacidad instalada sobre la demanda actual: apalancamiento operativo extremo, que colapsa en la baja y se multiplica en la alta. Es líder global con ~50% de cuota, con un moat de proceso (tolerancias, metalurgia, know-how) reforzado por lo lento que es rehomologar un componente crítico. La opcionalidad es el humanoide, donde reductor y actuador pueden ser 30-60% del costo de cada articulación. El riesgo central es dónde se fabricará ese humanoide: los productores chinos pasaron de ~15% del mercado en 2022 a ~38% en 2024 presionando precios, así que el peligro no es perder volumen sino quedar acorralado en el nicho premium."}, {"ticker": "CLSK", "company": "CleanSpark, Inc.", "statsList": [["Precio", "$11.93 (24-ago-2026)"], ["Rango 52 sem.", "US$8,00 - US$23,61"], ["Market cap", "~US$3,20 mil M (268,4M acciones diluidas promedio, 10-Q 30-jun-2026 filed 6-ago-2026, precio 24-ago-2026)"], ["Hashrate", "~50 EH/s pico / 38,6 EH/s promedio (update jul-2026, publicado 5-ago-2026)"], ["BTC en tesorería", "13.931 BTC al 31-jul-2026 (produjo 586 BTC, vendió 579 BTC en julio)"], ["Próx. earnings", "~16-dic-2026 (estimado, Q4 FY2026, no confirmado oficialmente)"], ["Técnico (auto)", "RSI 44.2 · MACD -0.57 / señal -0.59 (TradingView, 24-ago-2026)"]], "technical": {"price": 11.93, "change_1d_pct": -0.42, "change_1w_pct": -0.42, "rsi": 44.2, "macd": -0.5693, "macd_signal": -0.5853, "sma20": 12.6185, "sma50": 13.9156, "sma200": 12.5998, "ema12": 12.2364, "ema26": 12.8057, "pct_vs_sma20": -5.46, "pct_vs_sma50": -14.27, "pct_vs_sma200": -5.32, "volume_today": 18606625, "volume_avg20": 20228833.0, "volume_ratio": 0.92, "volatility_30d": 103.11, "sharpe": -0.36, "sortino": -0.43, "max_drawdown_1y": -64.74, "price_percentile_1y": 25.2, "vs_benchmark_30d_pct": -45.77, "perf_1m_pct": -22.63, "perf_ytd_pct": 14.77}, "risk": {"volatility_30d": 103.11, "sharpe": -0.36, "sortino": -0.43, "max_drawdown_1y": -64.74, "n_days":  $11,93 (-0,42% día/semana), aplanado desde el earnings del 6-ago-2026. HECHO: Q3 FY2026 trajo revenue de $138,0M y pérdida GAAP de $0,89/acción (vs consenso -$0,33), golpeada por un cargo de $133M en mark-to-market de BTC, aunque el negocio normalizado (ex-BTC) ya es rentable. HECHO: tesorería de 13.931 BTC (31-jul) y el lease de $6,6 mil M/20 años en Sandersville (175MW, primera entrega 4T2027) ya está equity-funded y generó upgrades de Cantor ($26), Macquarie ($20) y Clear Street ($22). LECTURA: el mercado sigue sin convalidar el re-rating pese al consenso ~$23,8, con short interest aún alto (29,8%) pero en baja desde 44% de febrero.", "fundamental": "- HECHO: Q3 FY2026 (cerrado 30-jun, reportado 6-ago-2026): revenue $138,0M (vs consenso $139,4M), pérdida GAAP -$0,89/acción, pérdida neta $239,8M por cargo de $133M en mark-to-market de BTC; EBITDA normalizado ex-BTC positivo ~$20M (Investing.com, 6-ago-2026).\n- HECHO: tesorería BTC subió a 13.931 (31-jul-2026) tras producir 586 BTC en julio y vender 579 (spot + call exercises); liquidez total $917M al 30-jun (CryptoBriefing/StockTitan, 5-ago-2026).\n- HECHO: lease de Sandersville a 20 años ya totalmente equity-funded, con NOI anual promedio ~$330M; LOI de exclusividad sobre 885MW adicionales en Texas (Sealy 285MW, Brazoria 600MW) (Blockspace/Benzinga, ago-2026).\n- HECHO: deuda principal estable en $1.812M (convertibles 2030 $650M / 2032 $1.150M cero-cupón), covenant-compliant, sin gatillo de conversión anticipada al 30-jun (StockTitan 10-Q, 6-ago-2026).\n- HECHO: acciones diluidas promedio 268,4M en Q3 (10-Q 30-jun-2026, filed 6-ago-2026), +4,6% vs. las 256,6M del trimestre anterior — dilución continúa pero a ritmo menor.", "valuacion": "- Market cap ~$3,20 mil M (268,4M acciones × $11,93), en percentil 25,2% de su rango 52 semanas ($8,00-$23,61).\n- Consenso de 13 analistas (S&P Global): 'Strong Buy', target promedio $23,81 (rango $21-$27), ~100% de upside implícito vs. spot.\n- HECHO: tras earnings, Cantor Fitzgerald subió a $26 (overweight), Macquarie a $20 (outperform), Chardan reiteró $20; Clear Street reiteró Buy $22 el 18-ago (Investing.com/Benzinga, ago-2026).\n- LECTURA: la brecha entre spot y targets sigue amplia pese a los upgrades post-deal, señal de que el mercado exige prueba de ejecución (primer data hall recién 4T2027) antes de convalidar el re-rating.\n- vs. Bitcoin, CLSK rinde -45,7% en 30 días pese al lease HPC, reflejando descuento por ejecución/dilución más que por el ciclo cripto.", "tecnico": "- RSI 44,2 (neutral), MACD -0,57 bajo señal -0,59: momentum bajista de corto plazo pero brecha estrechándose.\n- Precio -5,5% bajo SMA20 (12,62), -14,3% bajo SMA50 (13,92) y -5,3% bajo SMA200 (12,60): estructura débil en todos los plazos, aunque cerca de tocar la SMA200.\n- Volumen hoy 18,6M vs. promedio 20d 20,2M (ratio 0,92): sin presión vendedora extraordinaria.\n- Volatilidad 30d 103% y drawdown máximo 1 año -64,7% ya materializado; percentil de precio 25,2% del rango anual.\n- Trend model mantiene 2 señales de piso (divergencia RSI alcista, MACD girando al alza) y 0 de techo: sesgo constructivo de mediano plazo pese a la debilidad de corto.", "catalizadores": "**Catalizadores:**\n- Operational update de agosto 2026 (BTC holdings/producción), estimado primera semana de septiembre (el de julio salió el 5-ago).\n- Avance del LOI de exclusividad en Texas (Sealy 285MW, Brazoria 600MW) hacia contrato definitivo.\n- Progreso constructivo hacia el primer data hall de Sandersville (entrega 4T2027) y eventuales anuncios de nuevos tenants HPC.\n- Earnings Q4 FY2026, fecha estimada 16-dic-2026 (no confirmada oficialmente); cerrará el año fiscal con guidance de capex 2027.\n\n**Riesgos (por materialidad):**\n- Ejecución del pivote HPC: los ingresos contratados no comienzan hasta 4T2027; cualquier retraso golpearía la tesis de re-rating.\n- Dilución continua vía ATM/conversión de notas: acciones diluidas +4,6% trimestre a trimestre.\n- Deuda convertible $1.812M (vencimientos 2030/2032), sensible a la valorización de BTC como colateral implícito del negocio.\n- Volatilidad de BTC impacta directamente el P&L vía mark-to-market ($133M de cargo en Q3); una nueva caída de BTC presionaría resultados y sentimiento.", "sentimiento": "- Consenso sell-side sigue en 'Strong Buy' con oleada de upgrades post-earnings (Cantor, Macquarie, Chardan, Clear Street) entre el 8 y el 18-ago-2026.\n- Short interest cayó a 29,8% del float (23-ago-2026) desde 44,4% en feb-2026, pero sigue entre los más shorteados del Nasdaq — combustible potencial de squeeze.\n- Insiders (CEO Schultz y otros ejecutivos) vendieron montos menores el 13-14-ago bajo planes 10b5-1 preestablecidos: venta rutinaria y programada, no señal de alarma.\n- LECTURA: la persistente brecha entre spot ($11,93) y consenso ($23,81) pese a mejoras operativas y de balance sugiere pesimismo desconectado de fundamentales, leído en contrario como oportunidad si se sostiene la ejecución.", "conclusion": "CLSK atraviesa una transición real desde minería pura hacia infraestructura HPC/IA, con el lease de Sandersville ya funded y validado por upgrades sell-side, pero el mercado exige pruebas de ejecución antes de cerrar la brecha a los $23,8 de consenso — la primera entrega recién en 4T2027. El Q3 mostró pérdida GAAP ancha por mark-to-market de BTC, aunque el negocio normalizado ya es rentable. Con precio en percentil 25% de su rango, dilución moderándose y short interest en baja, la asimetría luce atractiva a mediano plazo, pero exige paciencia y tamaño acotado dado el binomio BTC + ejecución de capex."}, "scores": {"tecnica": {"score": 58, "just": "MACD bajista pero acortando distancia a la señal, RSI neutral sin sobreventa, volumen sin presión vendedora extra y trend model sostiene 2 señales de piso sin señales de techo: cambio de carácter incipiente pese a la debilidad frente a las medias."}, "fundamental": {"score": 60, "just": "Q3 FY2026 con revenue en línea pero pérdida GAAP ancha por mark-to-market de BTC; el negocio normalizado ex-BTC ya es rentable, la deuda está estable y la dilución trimestral se moderó, pero el lease HPC aún no genera caja (primera entrega 4T2027)."}, "sentimiento": {"score": 68, "just": "Consenso 'Strong Buy' con múltiples upgrades post-earnings (Cantor, Macquarie, Clear Street) y short interest todavía extremo (29,8%) pero en baja desde 44%: mezcla de convicción sell-side y posicionamiento bajista que favorece lectura contraria."}, "riesgo": {"score": 47, "just": "Riesgo estructural moderado: deuda convertible estable y dilución desacelerando reducen el riesgo de pérdida permanente, pero la ejecución del pivote HPC no genera ingresos hasta 2027 y el P&L sigue expuesto al mark-to-market de BTC (no se vuelve a castigar el drawdown ya vivido)."}, "conviccion": {"score": 62, "just": "Asimetría relevante con precio en percentil 25% de su rango vs. consenso ~100% por encima del spot, pero el próximo catalizador duro (earnings Q4 FY2026) recién en diciembre estimado, lo que exige paciencia antes de subir la convicción."}}, "sources": ["Investing.com, 06/08/2026 - CleanSpark Q3 FY2026: revenue $138,0M, EPS -$0,89 (vs. consenso -$0,33), pérdida neta $239,8M por mark-to-market de BTC de $133M, EBITDA normalizado ex-BTC ~+$20M", "PRNewswire/StockTitan, 05/08/2026 - CleanSpark July 2026 Operational Update: 13.931 BTC al 31-jul, hashrate 50 EH/s pico / 38,6 EH/s promedio, 230.507 mineros", "Blockspace/Benzinga/StockTwits, 05-12/08/2026 - Lease triple-net a 20 años en Sandersville por $6,6 mil M (hasta $11,6 mil M con extensiones), 175MW, NOI anual ~$330M, primera entrega 4T2027; LOI de exclusividad sobre 885MW en Texas", "StockTitan (10-Q 30-jun-2026), 06/08/2026 - Deuda principal $1.811,6M (convertibles 2030 $650M / 2032 $1.150M cero-cupón), covenant-compliant", "GuruFocus/TradingView, ago-2026 - Acciones diluidas promedio 268,4M (10-Q Q3 FY2026, trimestre terminado 30-jun-2026)", "Investing.com/Benzinga, 08 y 18/08/2026 - Price targets po lo", "zona_compra": "US$10,50 - US$12,50, escalonado cerca de la zona de piso técnico y del percentil bajo del rango anual", "invalidacion": "Cierre semanal sostenido bajo US$8,00 (mínimo de 52 semanas) o cancelación/renegociación material del lease de Sandersville", "gatillos": ["Operational update de agosto 2026 confirmando tesorería/producción estable o creciente", "Avance del LOI de Texas (Sealy/Brazoria) hacia contrato definitivo", "Progreso visible de construcción en Sandersville hacia la entrega de 4T2027"], "horizonte": "6-18 meses", "tamano": "Posición moderada (3-5% de portafolio cripto-equities) dado el riesgo de ejecución y la volatilidad extrema", "confianza": "media"}}, "perfil": "CleanSpark es un operador de centros de datos que monetiza electricidad: compra energía barata en Georgia, Tennessee, Wyoming y Texas, opera infraestructura y máquinas propias —sin hosting de terceros— y convierte kilovatios en bitcoin. Facturó $766,3M en FY2025 (+102%), superó los 50 EH/s y retiene una tesorería de ~13.900 BTC. El modelo está mutando: la compresión post-halving hundió los ingresos trimestrales ~25% a/a, y firmó un arriendo triple neto a 20 años por 175 MW con una tecnológica de grado de inversión (~$6.600M contratados, margen casi íntegro). Ahí está la tesis: el activo escaso no son las máquinas sino su cartera de 1,45 GW de energía contratada e interconexiones, justo lo que demanda la IA. Como minero es tomador de precio doblemente cíclico, con dilución permanente y el halving de 2028 recortando el subsidio a la mitad; la variable crítica es el financiamiento, que ata la reconversión a HPC al costo de capital y al precio del bitcoin que sirve de colateral."}, {"ticker": "MSTR", "company": "Strategy (MicroStrategy Incorporated)", "statsList": [["Precio", "$122.63 (24-ago-2026)"], ["Rango 52 sem.", "US$81,81 - US$414,36 (Investing.com, 3-ago-2026); percentil de precio a 1 año: 3,4%"], ["Market cap", "~US$36,2-36,7 mil M (Investing.com/bitcoinquant.co, 3-ago-2 ta US$8,22 mil M (US$24,45/acción), casi toda por mark-to-market no-cash de BTC bajo FASB fair-value; ingresos operativos US$122,4M (+6,9% YoY).\n- HECHO: STRC mantiene dividendo anualizado 12% (máximo histórico) pero cotiza ~10% bajo par, señal de estrés en el financiamiento vía preferentes.\n- LECTURA: pausa de compras (+5 semanas sin comprar) y reserva de caja de US$3,75 mil M sugieren postura defensiva, no ofensiva.", "valuacion": "- HECHO: mNAV básico/diluido ~0,68x-0,69x (bitcoinquant.co, 3-ago); en base a enterprise value (incluyendo preferentes) ~1,03x-1,07x tras revisión metodológica de Strategy.\n- LECTURA: el descuento en mNAV básico implica que el mercado paga menos por acción MSTR que el BTC subyacente por acción, rompiendo el modelo de emisión acretiva de capital.\n- HECHO: market cap ~US$36,2-36,7 mil M vs. valor de BTC en tesorería ~US$53,2 mil M (bitcointreasuries/KuCoin, 3-ago).\n- LECTURA: para reactivar el ciclo de acumulación, MSTR necesita mNAV >1x sostenido; hoy depende de si BTC recupera o si el mercado revaloriza el negocio de preferentes/crédito digital.", "tecnico": "- HECHO: precio US$93,28, -4,56% el día, RSI 43 (neutral, sin sobreventa extrema pese al desplome).\n- HECHO: cotiza -2,9% bajo SMA20, -17,2% bajo SMA50 y -40,9% bajo SMA200; tendencia de mediano/largo plazo claramente bajista.\n- HECHO: MACD negativo (-4,26) pero por sobre la señal (-5,62), indicio de posible pérdida de momentum bajista.\n- HECHO: percentil de precio a 1 año de solo 3,4% — la acción está en el extremo inferior de su rango anual.\n- LECTURA: volumen 35% sobre promedio de 20 días en la caída sugiere capitulación, no acumulación; falta confirmación de piso.", "catalizadores": "**Catalizadores:**\n- Recuperación de BTC hacia/sobre el costo promedio de MSTR (US$75.419) reactivaría el mNAV y el ciclo de emisión acretiva.\n- Reversión a compras netas de BTC (actualmente en pausa) señalizaría confianza y podría comprimir el descuento de mNAV.\n- Resultados del nuevo intain 12% dividend for STRC", "news.bitcoin.com, sin fecha exacta (agosto 2026) - Strategy Holds STRC Dividend at 12% as Stock Stays Below Par", "The Motley Fool, 03/08/2026 - Michael Saylor's Strategy Just Boosted Its Cash Reserve to $3.75 Billion", "The Motley Fool, 01/08/2026 - Michael Saylor Has Paused Strategy's Regular Bitcoin Buys", "Yahoo Finance, 30/07/2026 - Strategy lost $8.22 billion in Q2, but stock rose 4.4% anyway", "Coinspeaker, 30/07/2026 - Strategy Q2 2026: $8.6B Loss Driven by Bitcoin Accounting", "CoinDesk, 27/06/2026 - Strategy's valuation has fallen below the value of its bitcoin holdings", "CoinDesk, 29/06/2026 - Strategy announces $2 billion buybacks, bitcoin monetization plan and new capital framework", "bitcoinquant.co / KuCoin News, 03/08/2026 - MSTR Stock mNAV Framework Retains 1.0x Accretion Threshold", "Investing.com, 03/08/2026 - MicroStrategy Stock Price Today (market cap, rango 52 semanas)", "Bitcoin World, sin fecha exacta (enero 2026) - MSCI MicroStrategy Controversy: Will Index Exclusion Crash MSTR and Bitcoin in 2026?", "24/7 Wall St., 15/12/2025 - Strategy (MSTR) Survives Nasdaq 100 Reshuffle", "X (@saylor), 27/04/2026 - BTC Yield 9,6% YTD 2026, 818.334 BTC a ~US$75.537 promedio", "CryptoTimes, 04/08/2026 - Strategy Stock Price Prediction: Can MSTR Escape Its August Slump?", "CoinGecko, 04/08/2026 - Bitcoin (BTC) Price Today (~US$63.776)"], "opportunity": {"cats": {"valuacion_hist": {"score": 55, "just": "mNAV básico ~0,68x-0,69x es descuento poco común históricamente; percentil de precio a 1 año de 3,4% marca el punto más barato del rango anual, aunque en base EV (~1,03x-1,07x) el descuento es más moderado."}, "calidad": {"score": 45, "just": "842.138 BTC casi intactos (venta fue <0,2% de holdings) y flujo operativo de software estable (+6,9% ingresos), pero la pérdida contable de US$8,22 mil M y el giro hacia venta de BTC bajo el nuevo framework reducen la calidad percibida del modelo de acumulación pura."}, "asimetria": {"score": 50, "just": "Si BTC recupera hacia/sobre el costo promedio (US$75.419), el efecto apalancado en MSTR sería significativo; pero si BTC sigue débil, la dilución y el mNAV en descuento amplifican la pérdida — asimetría condicionada casi 1:1 al precio de BTC."}, "catalizadores": {"score": 45, "just": "Catalizadores dependen de factores externos (recuperación de BTC, resolución MSCI) más que de acción corporativa propia; la pausa de compras y venta de BTC reducen catalizadores positivos autogenerados en el corto plazo."}, "contrarian": {"score": 60, "just": "Percentil de precio de solo 3,4% y sentimiento mediático muy negativo ('slump') configuran zona de pesimismo extremo; la estabilidad operativa (dividendo STRC sostenido, sin pánico de ventas) sugiere que el mercado podría estar sobrecastigando la noticia de venta de BTC."}}, "plan": {"recomendacion": "Esperar gatillo", "zona_compra": "Escalonar entre US$80-95 si BTC se estabiliza sobre US$60.000; evitar agregar si BTC rompe bajo US$55.000 (aceleraría pérdidas contables y presión sobre mNAV).", "invalidacion": "Ruptura sostenida de BTC bajo ~US$50.000 combinada con mNAV básico bajo 0,5x, o resolución adversa de MSCI que gatille exclusión de índices.", "gatillos": ["BTC recupera y se mantiene sobre US$70.000 (cerca del costo promedio de MSTR)", "Strategy retoma compras netas de BTC de forma sostenida", "mNAV básico vuelve a superar 1,0x", "Resolución definitiva y favorable de la consulta MSCI sobre 'non-operating companies'"], "horizonte": "6-18 meses", "tamano": "Posición reducida (alta volatilidad, apalancamiento a un solo activo subyacente)", "confianza": "media"}}, "perfil": "Strategy es formalmente una empresa de software de inteligencia de negocios, pero su negocio real es ser un vehículo apalancado de tesorería en bitcoin: el software factura ~$500M anuales y funciona como ancla contable, no como driver de valor. La maquinaria es emitir acciones, convertibles y preferentes perpetuas (~$15.400M vivos) para comprar bitcoin. La lógica es reflexiva y depende del mNAV: mientras la acción cotice sobre el valor de sus bitcoins por acción, emitir es acretivo y el ciclo se autoalimenta. En 2026 se invirtió — el mNAV cayó de ~3,4x a ~0,70x y la empresa pasó de comprador estructural a vendedor, liquidando posiciones para sostener su reserva en dólares sobre 840.447 BTC comprados a ~$75.385 promedio. Lo estructural: exige acceso permanente al mercado de capitales; las preferentes son una obligación de caja perpetua contra un activo que no genera flujo; y los ETFs spot erosionaron su moat original. El riesgo terminal es la espiral: descuento sobre NAV, imposibilidad de emitir, venta de bitcoin para pagar cupones."}, {"ticker": "CCU", "company": "Compañía Cervecerías Unidas S.A.", "statsList": [["Precio", "$5.834 CLP (24-ago-2026)"], ["Rango 52 sem.", "$4.947 – $6.598 CLP"], ["Listado", "Bolsa de Santiago: CCU (IPSA) · ADR NYSE: CCU US$11,25"], ["Market cap", "~CLP 1,95-2,0 billones (US$2,06B vía ADR)"], ["P/E · EV/EBITDA", "17,3x trailing / ~15x fwd · EV/EBITDA 8,7x"], ["Dividend yield", "~3,0% (div. definitivo $74,53 pagado abr-2026)"], ["Target consenso", "$5.877 CLP (+11%) — 2 buy / 4 hold / 4 sell"], ["Próx. earnings", "6-ago-2026 (2T26)"], ["Técnico (auto)", "RSI 70.6 · MACD +78.03 / señal +49.90 (TradingView, 24-ago-2026)"]], "change": {"day": 2.53, "week": 2.53}, "sections": {"resumen": "CCU llega a julio 2026 como un claro rezagado del rally chileno: mientras el IPSA encadena máximos históricos, la acción opera ~20% bajo su máximo de 52 semanas ($6.598) tras un año bajista, aunque en las últimas semanas construye una base sobre los $5.000 con el MACD recién cruzado al alza. La tesis tiene tres patas: un negocio en Chile que opera muy bien (EBITDA +13,7% en 1T26, margen 20%, viento a favor del peso fuerte), dos lastres visibles (Argentina con EBITDA −18,6% y Vinos con −50,1%) y una valuación ~20% por debajo de su promedio histórico de 10 años. El consenso es tibio (Hold/Neutral, target $5.877) pero con dispersión extrema: BICE ve +52% ($7.794) y UBS recomienda vender ($4.750). Catalizadores inmediatos: resultados 2T26 el 6-ago y las primeras señales del nuevo CEO Eduardo Ffrench-Davis, que asumió el 1-jul con foco declarado en márgenes y eficiencia.", "fundamental": "**Resultados 1T26** (reportados 6/7-may-2026):\n\n- HECHO: Ventas consolidadas CLP 819.515 millones (+0,2% a/a); EBITDA CLP 131.644 millones (+0,1%), margen estable en 16,1%; utilidad controladora CLP 53.856 millones (−6,8%, ~US$58M); UPA CLP 145,8; volúmenes consolidados +1,8% (press release 1Q26 / TipRanks / La Tercera, may-2026).\n- HECHO — **Chile, el motor**: ventas +3,9%, EBITDA +13,7% a CLP 107.357 millones, margen 20,0% (+173 pb), ayudado por la apreciación del CLP de 8,1% vs USD (menores costos dolarizados) y volúmenes +3,9% liderados por categorías no alcohólicas (press release 1Q26, may-2026).\n- HECHO — **Negocios Internacionales** (Argentina, Bolivia, Paraguay, Uruguay): ventas −6,7%, EBITDA −18,6% a CLP 28.489 millones; volúmenes −1,7% con caída de un dígito medio en cerveza en Argentina (press release 1Q26).\n- HECHO — **Vinos**: ventas −7,2%, EBITDA −50,1% a CLP 3.288 millones (margen −508 pb) por mayor costo del vino y sobreoferta global (~US$19B de inventario excedente en la industria) (press release 1Q26; DF, 12-jun-2026).\n- HECHO: TTM en USD (ADR): revenue US$3,13B (−2,2%), utilidad neta US$121,8M (−32,0%); ROE 7,3-7,9%; Deuda/Patrimonio 0,71x (StockAnalysis 20-jul-2026; Visfin jul-2026).\n\n**Propiedad y movimientos corporativos:**\n\n- HECHO: IRSA controla el 65,87% de CCU; IRSA es JV 50/50 entre Quiñenco y Heineken. Free float: 20,04% local + 14,09% ADR (ccuinvestor.com, 2026).\n- HECHO: CCU completó la compra de la participación de Nestlé en el JV de aguas por US$180 millones (DF, 12-jun-2026).\n- HECHO: Eduardo Ffrench-Davis asumió como CEO el 1-jul-2026 tras 28 años de Patricio Jottar, quien pasa al directorio; Alexandre Carreteiro (presidente de Heineken Américas) fue nombrado vicepresidente del directorio (TipRanks, jul-2026).\n- LECTURA: el negocio chileno (dos tercios del EBITDA) está en su mejor momento de márgenes en años; el problema de CCU no es operacional en su core, sino la exposición a Argentina y al ciclo global del vino. La mayor injerencia de Heineken en el directorio puede traer disciplina de márgenes o tensión con Quiñenco — sin evidencia de conflicto por ahora.", "valuacion": "- HECHO: P/E trailing 17,25x local / 16,9-18,4x ADR; forward ~15x (BTG estima 13,3x); EV/EBITDA 8,66x (Investing/Visfin/StockAnalysis, jul-2026).\n- HECHO: la acción transa **~20% por debajo de su promedio de valuación de los últimos 10 años** (DF, 12-jun-2026).\n- HECHO: dividend yield ~3,0% local (dividendo definitivo N°272 de $74,53 por acción pagado desde el 24-abr-2026) (TipRanks/Diario Estrategia, abr-2026).\n- HECHO — targets locales: consenso **$5.877 CLP (+11%)**, máx $6.600, mín $4.365; 2 buy / 4 hold / 4 sell (Investing.com, jul-2026). Casas (DF, 12-jun-2026): **BICE Sobreponderar PO $7.794 (+52%)**, **BTG Neutral PO $6.500**, **UBS Vender PO $4.750** (argumenta crecimiento de ingresos de un dígito hasta 2028).\n- HECHO: ADR consenso Hold, target US$12,46 (+10,8%, 7 analistas) (StockAnalysis, 20-jul-2026).\n- LECTURA: la valuación es el corazón de la tesis alcista — múltiplos comprimidos contra la propia historia con un IPSA que transa ~12% caro vs la suya. Pero el descuento tiene causa: el upside depende de que Argentina y Vinos se normalicen, no del negocio chileno que ya opera bien y está en el precio. La dispersión BICE/UBS (de +52% a −7%) refleja exactamente esa apuesta.", "tecnico": "- HECHO: precio $5.285 CLP, +1,28% en la sesión del lunes 20-jul y +1,63% vs 5 ruedas atrás (TradingView tiempo real, 20-jul-2026).\n- HECHO: RSI(14) diario 56,3 — neutral con sesgo alcista; MACD(12,26,9) +12,6 sobre señal −1,0 (histograma +13,6): **cruce alcista reciente** (calculado sobre 130 barras diarias de TradingView, 20-jul-2026).\n- HECHO: precio sobre la SMA20 (~$5.183, +2,0%) y SMA50 (~$5.204, +1,6%), y justo en la SMA100 (~$5.285); bajo la MM200 publicada (~$5.670) (TradingView 20-jul-2026; Visfin jul-2026).\n- HECHO: señal técnica diaria \"Strong Buy\", semanal neutral (Investing.com, jul-2026). Mínimo de 52 semanas $4.947 tocado a inicios de mayo; desde ahí, piso doble en la zona $5.000-5.050 (jun y feb).\n- LECTURA: estructura de base tras 12 meses bajistas (−16,6% en las últimas ~26 semanas). Soportes: $5.183-5.204 (SMA20/50) y $5.000-4.947; resistencias: $5.443 (máximo intradía del 20-jul), $5.670 (MM200) — su recuperación sería la confirmación de cambio de tendencia — y la zona $6.600. El cruce de MACD con RSI aún lejos de sobrecompra deja espacio al rebote, pero mientras siga bajo la MM200 es un rebote dentro de tendencia bajista, no una tendencia alcista nueva.", "catalizadores": "- HECHO: **resultados 2T26 el 6-ago-2026** (StockAnalysis, jul-2026). LECTURA: trimestre de invierno, estacionalmente débil en volúmenes; el foco estará en si Chile sostiene margen 20% y en el ritmo de deterioro/mejora argentino.\n- HECHO: **nuevo CEO** Eduardo Ffrench-Davis desde el 1-jul-2026, con prioridad declarada en márgenes y eficiencia; renovación de comités del directorio entre julio y agosto (DF 12-jun-2026; TipRanks jul-2026). LECTURA: primer plan estratégico del nuevo management es el catalizador idiosincrático más cercano.\n- HECHO: **tipo de cambio** — USD/CLP ~926 (14-jul-2026), con el CLP apreciado 8,1% vs USD en 1T26: viento a favor directo en costos dolarizados del segmento Chile (dolarhoy.net; press release 1Q26).\n- HECHO: **insumos** — aluminio LME ~US$3.160-3.200/t con inventarios −43% en el año y déficit proyectado (~930 kt según Macquarie); cebada y lúpulo europeos +12-18% de costo desembarcado en 1T26 (TradingEconomics/AgMetalMiner/Expert Market Research, jul-2026).\n- HECHO: **Argentina** — consumo masivo −3,3% acumulado en 2026, pero inflación mensual desacelerando (<2% proyectado para julio) y expectativa de recuperación gradual del consumo en 2S26 (Bloomberg Línea/Infobae, jun-2026). LECTURA: la recuperación argentina es la opción de mayor convexidad de la tesis.\n- HECHO: **macro Chile** — PIB 1T26 −0,5% a/a, Imacec de mayo −0,9% (quinto retroceso consecutivo), Banco Central recortó el crecimiento 2026 hacia ~1%, riesgo de recesión técnica (Emol/Bloomberg/XTB, mar-jul 2026). LECTURA: el 1T26 se benefició de un consumo chileno que ya no acelera — el viento de cola doméstico se está apagando.", "sentimiento": "- HECHO: consenso local Neutral con 2 buy / 4 hold / 4 sell y PO $5.877 (Investing, jul-2026); ADR Hold con target US$12,46 (StockAnalysis, 20-jul-2026). El DF tituló (12-jun-2026): \"Argentina y alta exposición a vinos y cervezas hacen dudar al mercado\".\n- HECHO: noticias de los últimos 45 días — cierre de la compra del JV de aguas a Nestlé (US$180M, jun), cambio de CEO y reordenamiento del directorio con mayor presencia de Heineken (1-jul), y entrada en vigencia de nuevas restricciones a la publicidad de alcohol en Chile el 7-jul-2026.\n- HECHO: contexto IPSA — el índice acumula ~70 máximos históricos en el año, transa ~12% más caro que su historia, con flujos extranjeros récord (US$112M vía el principal ETF en el año) y targets como el de Bci en 12.050 puntos; el optimismo se moderó en julio por el débil crecimiento (DF/Emol/Bloomberg, 2026).\n- LECTURA: el contraste es la historia — el IPSA en máximos mientras CCU está 20% bajo su peak la convierte en uno de los grandes laggards del rally chileno. Eso sostiene el argumento de valuación relativa (BICE), pero 4 de 10 analistas locales recomiendan vender: el mercado no compra la normalización de Argentina y Vinos todavía. Sin datos públicos de posicionamiento institucional o insiders para el papel local.", "conclusion": "CCU es una apuesta de valuación y reversión a la media, no de momentum: negocio core chileno en su mejor nivel de márgenes, múltiplos 20% bajo su historia, 3% de yield, y dos lastres (Argentina, Vinos) que explican el descuento y cuya normalización — no garantizada — es el upside. El técnico acompaña por primera vez en meses (cruce de MACD, sobre SMA20/50, doble piso en $5.000) pero la MM200 en $5.670 sigue arriba como techo de la tendencia. Con el consenso en Hold y el IPSA caro, el papel ofrece asimetría razonable bajo $5.300 con soporte claro en $5.000, catalizador fechado el 6-ago (2T26) y la incógnita del plan del nuevo CEO. La señal es **Hold** con sesgo constructivo: para pasar a Buy se necesita recuperar la MM200 y/o evidencia de que Argentina dejó de drenar EBITDA; para venderla, perder los $5.000 que ya defendió dos veces."}, "scores": {"tecnica": {"score": 60, "just": "Rebote con confirmación: cruce alcista de MACD, RSI 56 con espacio, precio sobre SMA20/50 y doble piso defendido en $5.000. Se descuenta porque sigue bajo la MM200 ($5.670) y 20% bajo el máximo de 52 semanas — es una base dentro de tendencia bajista, aún no una tendencia alcista."}, "fundamental": {"score": 62, "just": "Chile (dos tercios del EBITDA) con margen 20% y EBITDA +13,7%, balance sano (D/E 0,71x) y valuación 20% bajo su media histórica con 3% de yield. Los lastres pesan: Argentina −18,6% y Vinos −50,1% de EBITDA, utilidad total −6,8% y ROE mediocre (~7,5%)."}, "sentimiento": {"score": 46, "just": "Consenso tibio con 4 de 10 analistas locales en venta, laggard notorio del rally IPSA y titulares de prensa escépticos (\"hacen dudar al mercado\"). A favor: dispersión de targets con el extremo alcista (BICE +52%) bien argumentado y flujos extranjeros récord hacia la bolsa chilena que eventualmente rotan a rezagados."}, "riesgo": {"score": 50, "just": "Negocio defensivo de consumo básico con 65% del mercado cervecero chileno y controlador sólido (Quiñenco/Heineken), pero triple exposición adversa: macro chilena deteriorándose (5 Imacec negativos), Argentina sin piso confirmado, sobreoferta global de vino, más costos de aluminio y cebada al alza y nuevas restricciones publicitarias vigentes desde el 7-jul."}, "conviccion": {"score": 55, "just": "Catalizadores concretos y fechados (2T26 el 6-ago, plan del nuevo CEO, recuperación argentina en 2S26) y tesis falsable con niveles claros ($5.000 abajo, MM200 $5.670 arriba). La convicción es media porque el timing de la normalización de Argentina y Vinos es incierto y el consenso lleva meses sin comprarla."}}, "sources": ["TradingView — BCS:CCU tiempo real, 130 barras diarias; RSI/MACD/SMA calculados (20-jul-2026)", "Investing.com — cotización local, consenso 2/4/4, PO $5.877, P/E, yield (jul-2026)", "StockAnalysis.com — ADR CCU, targets, forward P/E, EV/EBITDA, earnings 6-ago (20-jul-2026)", "Visfin.cl — MM50/200, ROE, D/E (jul-2026)", "CCU Investor — Press Release 1Q26 (6-may-2026)", "TipRanks — resultados 1T26; transición CEO/directorio; dividendo abr-2026 (may-jul 2026)", "La Tercera/Pulso — utilidad 1T26 US$58M (may-2026)", "Diario Financiero — POs BICE $7.794 / BTG $6.500 / UBS $4.750; compra JV aguas Nestlé US$180M (12-jun-2026)", "ccuinvestor.com / Quiñenco — estructura de propiedad IRSA 65,87% (2026)", "Bloomberg Línea / Infobae — consumo Argentina −3,3% 2026, inflación desacelerando (jun-2026)", "Bloomberg / Emol / XTB — macro Chile: Imacec, riesgo de recesión técnica, gobierno Kast (mar-jul 2026)", "TradingEconomics / AgMetalMiner — aluminio LME, déficit proyectado (jul-2026)", "Expert Market Research / Mordor — mercado cervecero Chile: CCU ~65%, ABI ~30% (2025-2026)", "Senado.cl / La Tercera — Ley 21.363: restricciones publicidad alcohol desde 7-jul-2026", "dolarhoy.net — USD/CLP 926 (14-jul-2026)"], "events": [{"date": "2026-08-06", "label": "Resultados 2T26", "kind": "earnings", "info": "Sin consenso público disponible para el 2T26 (trimestre estacionalmente débil). Se mirará si se repite el patrón del 1T26: Chile sólido pero consumo debilitado en Argentina y un negocio del vino 'particularmente difícil' (Diario Financiero, may (mínimo 52 sem) = -8%. Asimetría ~1:1 al precio actual, poco atractiva; el valor está en el escenario de recuperación argentina, no en el consenso."}, "calidad": {"score": 70, "just": "Líder de cerveza en Chile con Chile-segmento fuerte en 1T26: ventas +3,9% y EBITDA +13,7% con margen 20,0% (+173pb). Pero Internacional (Argentina) EBITDA -18,6% y Vinos -50,1%; EBITDA consolidado plano (CLP 131.644M, margen 16,1%). Negocio sólido con dos lastres cíclicos (StockTitan/TipRanks 1T26)."}, "catalizadores": {"score": 48, "just": "2T26 el 6-ago (dashboard): trimestre estacionalmente débil — consenso espera EPS trimestral negativo (~-32 CLP, Investing) con ingresos ~CLP 989MM; riesgo de titular malo antes que bueno. Catalizador real (estabilización de consumo argentino y vinos) sin fecha; 12-18 meses."}, "contrarian": {"score": 60, "just": "Consenso frío: 2 buy / 4 hold / 4 sell (dashboard; MarketScreener 'Neutral') pese a que Chile —el 60%+ del EBITDA— acelera con margen récord de 20%. Pesimismo notable con datos operativos del núcleo estables/mejorando, aunque no es capitulación extrema (RSI 53,8)."}}, "plan": {"recomendacion": "Esperar gatillo", "zona_compra": "$5.000–5.200 CLP (aproximación al soporte $4.947); a $5.385 no hay margen de seguridad suficiente", "invalidacion": "Cierre semanal bajo $4.900 CLP (pérdida del mínimo de 52 sem) o deterioro del margen Chile bajo 18% en 2T26", "gatillos": ["2T26 (6-ago): margen EBITDA Chile ≥19% y volúmenes Argentina dejando de caer", "Corrección post-resultados hacia $5.000–5.200 por el EPS trimestral negativo esperado", "Primer trimestre con EBITDA de Internacional creciendo en CLP"], "horizonte": "12-18 meses", "tamano": "Media posición como máximo si se da la zona; no perseguir a precio actual", "confianza": "media"}}, "trend": {"piso": 0, "techo": 1, "max": 7, "senales_piso": [], "senales_techo": ["divergencia RSI bajista"]}, "perfil": "CCU es una compañía regional multicategoría de bebestibles presente en seis países: produce y distribuye cervezas propias y licenciadas (Cristal, Escudo, Heineken, Budweiser), gaseosas y aguas bajo licencia de PepsiCo, néctares, licores y vinos vía VSPT. El core está en Chile: en 2025 aportó ~64% de los ingresos y ~76% del EBITDA (margen 16,3%), mientras Negocios Internacionales —esencialmente Argentina— sumó ~27% de los ingresos pero solo ~15% del EBITDA con margen de 7,1%, y Vinos ~9%. Consolidado 2025: ingresos CLP 2,91 billones, EBITDA CLP 376.208 millones y deuda neta/EBITDA de 2,02x, apalancamiento conservador. Lo estructural es la asimetría entre un negocio chileno maduro y de márgenes defendibles y una operación argentina volátil, expuesta a devaluación y contabilidad hiperinflacionaria que amplifica la varianza del resultado sin cambiar el valor económico. Además los costos son dolarizados (malta, aluminio, PET) contra ingresos en moneda local, así que una depreciación comprime margen con dos o tres trimestres de rezago. El punto de vigilancia es competitivo: AB InBev le ha quitado participación sostenidamente apoyada en la red de los embotelladores Coca-Cola."}, {"ticker": "CMPC", "company": "Empresas CMPC S.A.", "statsList": [["Precio", "$1.028,0 CLP (24-ago-2026)"], ["Rango 52 sem.", "$1.015 – $1.599 CLP"], ["Listado", "Bolsa de Santiago: CMPC (IPSA) — grupo Matte"], ["Market cap", "CLP 2,68 billones (~US$2.900M)"], ["P/E · P/B · EV/EBITDA", "16,3x trailing / 15,3x fwd · P/B 0,28x · EV/EBITDA 7,9x"], ["Deuda neta / EBITDA", "4,1x (1T26) — rating S&P BBB- desde mar-2026"], ["Dividend yield", "~0,9% (US$0,0105/acción pagado may-2026)"], ["Target consenso", "JPM $1.100 (jul) vs agregadores $1.513-1.712 (rezagados)"], ["Próx. earnings", "6-ago-2026 (2T26)"], ["Técnico (auto)", "RSI 48.0 · MACD -9.83 / señal -10.00 (TradingView, 24-ago-2026)"]], "change": {"day": 1.68, "week": 1.68}, "sections": {"resumen": "CMPC es la gran castigada del IPSA: mientras el índice marca máximos históricos (~11.500 puntos), la papelera del grupo Matte acumula −20% en 12 meses y tocó a inicios de julio un mínimo de 4 años ($1.031), del que rebota tímidamente hacia $1.076. El castigo tiene tres causas concretas: un ciclo de celulosa deprimido (precio promedio −17% en 2025, sobreoferta global), un balance cargado (deuda neta/EBITDA 4,1x, S&P la rebajó a BBB−, a un escalón del grado especulativo) y el megaproyecto Natureza en Brasil (US$4.600M) cuyo financiamiento tiene al mercado apostando a un aumento de capital dilutivo. A favor: P/B de 0,28x — se paga 28% del valor libro —, Softys creciendo EBITDA +20%, un plan de desinversión de US$1.000-1.500M con JPMorgan, y el dato nuevo de julio: el DF reporta que mejoran las expectativas de celulosa para el 2S26, lo que explica el rebote. Es una apuesta de ciclo con balance apretado: alta convexidad si la celulosa repunta, riesgo real de dilución si no.", "fundamental": "**Resultados 1T26** (reportados 8-may-2026; cifras en USD):\n\n- HECHO: ventas US$1.817M (planas a/a, bajo el consenso de US$1.850M); EBITDA ajustado US$255M (−8,1% a/a), margen 14,1% (−1 pp); **utilidad neta US$25M, −50,2% a/a** por menores envíos de celulosa, mayor costo energético (guerra en Medio Oriente), menor valorización forestal y más gastos financieros (DF / La Tercera / Investing, 8-may-2026).\n- HECHO — por segmento: **Celulosa** ventas US$731M, golpeada por mantenciones programadas y no programadas en Guaíba (menor producción, mayor cash cost); **Softys** (tissue) ventas US$835M con EBITDA US$97M (+20% a/a) por eficiencias; **Biopackaging** US$247M con recuperación de márgenes (slides 1T26, may-2026).\n- HECHO: producción de celulosa 987 mil ton; ventas BEKP 799 mil ton (−11% a/a, menores exportaciones a China); cash cost BEKP US$262/ton, BSKP US$400/ton; capex US$185M (+24% a/a) (slides 1T26).\n- HECHO — **balance**: deuda total US$5.915M, caja US$900M, deuda neta US$5.015M → **DFN/EBITDA 4,1x** (vs 3,41x en mar-2025). Guía del call: EPS US$0,01 en 2T26 y US$0,02 en 3T26 con normalización progresiva del apalancamiento (transcript 1T26, may-2026).\n- HECHO: **S&P rebajó el rating de BBB a BBB−** el 2-mar-2026 (un escalón sobre grado especulativo) por desapalancamiento lento, celulosa −17% en 2025, competencia en tissue en Brasil/México e incertidumbre por Natureza; proyecta EBITDA 2026 de US$1.200-1.300M y ~3,0x (La Tercera, 2-mar-2026).\n\n**Proyecto Natureza (Rio Grande do Sul, Brasil):**\n\n- HECHO: inversión US$4.500-4.600M — la mayor inversión chilena en el exterior —, 2,5M ton/año de BEKP, ~US$400M ya invertidos, decisión de construcción dentro de 2026 y operación hacia 2029. Hitos: permiso federal del terminal portuario (ene-2026, acto con Lula) y licencia ambiental preliminar del terminal Rio Grande (jun-2026) (DF / Argentina Forestal / La Tercera, 2026).\n- HECHO — financiamiento: desinversión de activos forestales/inmobiliarios por US$1.000-1.500M asesorada por JPMorgan (incluye Bosques del Plata en Argentina, >94.000 ha); colocó bonos híbridos por UF 7M (~US$312M) a fines de junio con mejor spread que el debut, y prepara hasta UF 10M más; **el mercado especula con un aumento de capital** (Argentina Forestal 17-jun-2026; DF jun-2026).\n- HECHO: dividendo definitivo US$0,0105/acción pagado desde el 12-may-2026; política 2026 de payout 30%; yield ~0,9% (Diario Estrategia / StockAnalysis, 2026).\n- LECTURA: el 1T26 fue un trimestre de transición con Guaíba en mantención — lo operativo debiera mejorar en 2T/3T —, pero el problema estructural es que con EBITDA deprimido, 4,1x de leverage y US$4.600M de capex por delante, la matemática solo cierra con ventas de activos exitosas o dilución. Softys es la joya silenciosa del cuadro.", "valuacion": "- HECHO (StockAnalysis, 20-jul-2026): P/E trailing 16,3x / forward 15,3x; **P/B 0,28x**; EV/EBITDA 7,9x; EV/Ventas 1,13x; beta 0,17.\n- HECHO — targets con dispersión enorme: **JPMorgan Neutral, PO $1.100 a dic-2026** (el más fresco, citado por DF el 17-jul-2026, tras recortes previos desde $1.600); **MBI sobreponderar, PO $2.077** (recortado desde $2.417, upside >50%); agregadores: Investing $1.513 (máx $2.807 / mín $1.089), MarketScreener $1.712 (3 comprar / 2 vender), TradingView ~$1.754 (4 comprar / 8 mantener / 0 vender) — con fechas de corte no publicadas.\n- LECTURA: el P/B de 0,28x es el dato más llamativo — típico de fondo de ciclo más descuento por apalancamiento y riesgo de dilución. El EV/EBITDA ~8x NO es barato porque el EBITDA está deprimido: la acción es una apuesta a normalización de EBITDA, no a múltiplo bajo. El consenso de agregadores ($1.500-1.750) luce rezagado frente al PO de julio de JPMorgan ($1.100, prácticamente el precio actual): el sell-side fresco no ve upside sin repunte de celulosa. Los targets altos descansan en normalización + desinversión sin dilución.", "tecnico": "- HECHO: precio $1.076,5 CLP, +0,61% en la sesión del lunes 20-jul pero **−2,93% vs 5 ruedas atrás** (TradingView tiempo real, 20-jul-2026).\n- HECHO: RSI(14) diario 52,2 — neutral; MACD(12,26,9) +5,0 sobre señal +1,1 (histograma +3,8), positivo tras el rebote desde $1.031 (calculado sobre 130 barras diarias de TradingView, 20-jul-2026). Investing.com publica RSI 46,5 y señal \"venta fuerte\" por medias móviles (1 compra / 11 ventas) (jul-2026).\n- HECHO: precio sobre la SMA20 (~$1.059, +1,6%) y SMA50 (~$1.071, +0,5%), pero −5,3% bajo la SMA100 (~$1.137) y lejos de los niveles de inicio de año ($1.480): −27% en ~26 semanas (TradingView, 20-jul-2026).\n- LECTURA: tendencia de fondo claramente bajista con rebote incipiente de julio. Soportes: $1.059-1.071 (SMA20/50) y la zona crítica **$1.015-1.031** (mínimo de 52 semanas y de 4 años — perderla abriría un tramo bajista nuevo). Resistencias: $1.094-1.110 (cierres de la semana pasada y SMA100 en $1.137) y luego $1.180. Ojo: los niveles \"soporte $1.500 / resistencia $2.500\" que circulan en ideas antiguas de TradingView están obsoletos, son previos al derrumbe. El rebote es de expectativas (celulosa 2S26), no de confirmación técnica: bajo la SMA100 y con las medias largas vendedoras, sigue siendo un intento de piso, no un cambio de tendencia.", "catalizadores": "- HECHO: **resultados 2T26 el 6-ago-2026** (Investing, jul-2026). LECTURA: con Guaíba normalizada tras las mantenciones, el mercado buscará cash cost a la baja y confirmación de la guía (EPS US$0,01).\n- HECHO — **celulosa, el driver dominante**: en China la fibra corta promedia RMB 4.417/ton (10-jul-2026) con julio como temporada baja, papeleras comprando lo mínimo e inventarios altos (SunSirs); NBSK lista en EE.UU. cayó a US$1.570/t en mayo por sobreoferta (Fastmarkets, 5-jun-2026). Referencias 2026: Fitch proyecta BEKP US$625/t promedio; BTG estimaba US$575-600/t neto China (dic-2025).\n- HECHO: el DF reporta (17-jul-2026) que **mejoran las expectativas de celulosa para el 2S26**, con efecto anticipado en Arauco y CMPC — es lo que explica el rebote desde $1.031. LECTURA: es el catalizador que mueve la aguja; si la temporada alta china (sept-oct) no convalida, el rebote se deshace.\n- HECHO — **plan de desinversión**: US$1.000-1.500M en activos no estratégicos (Chile, Brasil, Argentina) con JPMorgan; decisión final de construcción de Natureza esperada dentro de 2026 (Argentina Forestal / DF, jun-2026). LECTURA: un cierre exitoso de ventas de activos sin aumento de capital sería el catalizador idiosincrático más potente; lo contrario (aumento de capital) es el mayor riesgo de corto plazo.\n- HECHO — **oferta rival**: Arauco alcanzará 5,2M ton (MAPA ~85% de utilización) y construye Sucuriú en Brasil (US$4.600M, ~70% de avance); Suzano presiona precios — es la base del Neutral de JPMorgan (DF, 17-jul-2026).\n- HECHO: USD/CLP ~926-932 en julio (dolarhoy/Wise). LECTURA: a diferencia de CCU, un peso fuerte es viento en CONTRA para CMPC (exportadora con costos en CLP e ingresos en USD).", "sentimiento": "- HECHO: recomendaciones divididas — JPMorgan Neutral PO $1.100 (jul-2026), MBI sobreponderar PO $2.077, MarketScreener 3 comprar / 2 vender, agregador TradingView 4 comprar / 8 mantener / 0 vender. Sin notas frescas de BTG/Santander/BICE/LarrainVial en las fuentes consultadas.\n- HECHO — noticias de los últimos 30 días: colocación de híbridos por ~US$312M con mejor spread (fines jun), licencia ambiental del terminal de Natureza (23-jun), JPMorgan liderando la desinversión con el mercado apostando a aumento de capital (17-jun), y la nota del DF sobre el repunte de expectativas de celulosa (17-jul).\n- HECHO — contexto: IPSA en máximos históricos (~11.500 pts), inversión extranjera en Chile en récord (US$46.987M de stock de no residentes, más del doble que 2024), bolsa ~12% más cara que su historia (DF/Emol, 2026).\n- LECTURA: sentimiento negativo-a-neutral con giro incipiente. CMPC es de las pocas grandes del IPSA en rojo a 12 meses (−20%) en un mercado eufórico — el flujo extranjero récord aún no rota hacia ella porque el riesgo de aumento de capital mantiene cautos a los institucionales. El rebote de julio es de expectativas, no de resultados: frágil pero con combustible si el 2S26 convalida, porque el posicionamiento en el papel es liviano.", "conclusion": "CMPC es la apuesta cíclica profunda del panel chileno: 0,28x valor libro, −33% desde el rango alto de 52 semanas, en mínimos de 4 años hace tres semanas, con el driver (precio de la celulosa) posiblemente girando al alza en el 2S26 según las expectativas que recoge el DF. Pero el balance no perdona: 4,1x deuda neta/EBITDA, rating a un escalón del grado especulativo y US$4.600M de Natureza por financiar hacen que la tesis dependa de que TODO salga razonablemente bien — celulosa arriba, activos vendidos a buen precio, sin dilución. La asimetría es atractiva para perfiles tolerantes al riesgo (si el ciclo gira, el recorrido a los targets de $1.500-2.000 es enorme), pero el PO fresco de JPMorgan ($1.100) dice que el sell-side no ve upside inmediato. La señal es **Caution**: especulativa de ciclo, no de calidad. Gatillos para subirla a Hold/Buy: celulosa china repuntando en la temporada alta (sept-oct), cierre de desinversiones sin aumento de capital, o 2T26 (6-ago) con cash cost mejorando. Gatillo de salida: perder los $1.015-1.031."}, "scores": {"tecnica": {"score": 45, "just": "Rebote incipiente con MACD positivo y precio sobre SMA20/50 tras defender el mínimo de 4 años en $1.031, pero la tendencia de fondo sigue bajista: −5,3% bajo la SMA100, −27% en 6 meses, y las medias largas en señal de venta (1 compra / 11 ventas según Investing). Intento de piso, no cambio de tendencia."}, "fundamental": {"score": 40, "just": "Utilidad −50% en 1T26, EBITDA deprimido por el ciclo de celulosa, leverage de 4,1x con rating BBB− a un escalón del especulativo y US$4.600M de Natureza por financiar. Lo rescatable: Softys con EBITDA +20%, P/B de 0,28x, guía de mejora secuencial y un plan de desinversión de US$1.000-1.500M en marcha."}, "sentimiento": {"score": 45, "just": "Gran rezagada del IPSA en un mercado en máximos, con el sell-side fresco (JPMorgan $1.100) sin ver upside y el mercado apostando a un aumento de capital dilutivo. El giro de expectativas de celulosa del 2S26 (DF, 17-jul) y el posicionamiento liviano dan combustible al rebote si se convalida."}, "riesgo": {"score": 30, "just": "El perfil de riesgo más alto del panel chileno: apalancamiento 4,1x, rating al borde del grado especulativo, ciclo de celulosa en sobreoferta con Arauco y Suzano agregando capacidad, riesgo de dilución por Natureza, shock de costos energéticos e incendios/Araucanía recurrentes (61 siniestros en la última temporada, mitad intencionales)."}, "conviccion": {"score": 40, "just": "Tesis falsable con niveles y fechas claras (soporte $1.015-1.031, 2T26 el 6-ago, temporada alta china sept-oct, decisión de Natureza en 2026), pero de baja probabilidad compuesta: exige simultáneamente repunte de celulosa, desinversión exitosa y no-dilución. Apta solo como posición especulativa dimensionada."}}, "sources": ["TradingView — BCS:CMPC tiempo real, 130 barras diarias; RSI/MACD/SMA calculados (20-jul-2026)", "Diario Financiero — repunte de expectativas de celulosa 2S26; PO JPMorgan $1.100 (17-jul-2026)", "Diario Financiero / La Tercera — resultados 1T26: utilidad −50% (8-may-2026)", "Investing.com — slides y transcript 1T26; earnings 6-ago; technicals (may-jul 2026)", "La Tercera/Pulso — S&P rebaja a BBB− (2-mar-2026)", "StockAnalysis.com — P/B 0,28x, EV/EBITDA 7,9x, market cap (snapshot 20-jul-2026)", "Argentina Forestal — plan Natureza, desinversión con JPMorgan, licencia terminal portuario (may-jun 2026)", "Diario Financiero — bonos híbridos UF 7M (~US$312M) y preparación de UF 10M (jun-2026)", "Diario Financiero — MBI recorta PO a $2.077, mantiene sobreponderar (2026)", "SunSirs — pulpa fibra corta China RMB 4.417/t, temporada baja (10-14-jul-2026)", "Fastmarkets — NBSK EE.UU. US$1.570/t lista, sobreoferta (5-jun-2026)", "Diario Estrategia — dividendo definitivo US$0,0105 pagado 12-may-2026", "Yahoo Finance — rango 52 semanas CMPC.SN (jul-2026)", "MarketScreener — consenso $1.712, 3 comprar / 2 vender (jul-2026)", "Diario Financiero / Emol — IPSA en máximos, inversión extranjera récord US$46.987M (2026)", "BioBioChile — incendios en predios CMPC, 84 brigadas temporada 2025-26 (dic-2025 / ene-2026)"], "events": [{"date": "2026-08-06", "label": "Resultados 2T26 (foco: cash cost con Guaíba normalizada)", "kind": "earnings", "info": "Guía/consenso apunta a EPS ~$0.01 para el 2T26, tras un 1T débil: revenue $1.8B (bajo el forecast de $1.85B), EBITDA $255M con margen 14.1% y utilidad cayendo 33% t/t (Investing.com, 2026). El foco está en el precio de la celulosa, la recuperación de volúmenes en pulp y biopackaging, y la disciplina de costos. La acción se mueve principalmente con la señal de precios de celulosa hacia el 2S26."}], "risk": {"volatility_30d": 22.55, "sharpe": -0.87, "sortino": -0.83, "max_drawdown_1y": -35.69, "n_days": 319, "window": 30}, "benchmark": {"ticker": "CBOE:ECH", "label": "ECH (proxy Chile/IPSA)", "relative_performance_30d": -12.87, "relative_performance_ytd": -31.62, "price_percentile_1y": 7.0, "partial": false}, "technical": {"price": 1028, "change_1d_pct": 1.68, "change_1w_pct": 1.68, "rsi": 48.0, "macd": -9.8259, "macd_signal": -10.0044, "sma20": 1028.55, "sma50": 1046.496, "sma200": 1209.944, "ema12": 1023.5718, "ema26": 1033.3977, "pct_vs_sma20": -0.05, "pct_vs_sma50": -1.77, "pct_vs_sma200": -15.04, "volume_today": 1931467, "volume_avg20": 2639829.0, "volume_ratio": 0.73, "volatility_30d": 22.55, "sharpe": -0.87, "sortino": -0.83, "max_drawdown_1y": -35.69, "price_percentile_1y": 7.0, "vs_benchmark_30d_pct": -12.87, "perf_1m_pct": -3.02, "perf_ytd_pct": -27.3}, "sourcesMeta": {"price": {"origin": "TradingView scanner", "fetched_at": "2026-08-24T16:58:58-04:00"}, "rsi_macd": {"origin": "TradingView scanner", "fetched_at": "2026-08-24T16:58:58-04:00"}, "smas_volume": {"origin": "TradingView scanner", "fetched_at": "2026-08-24T16:58:58-04:00"}, "benchmark": {"origin": "TradingView scanner", "symbol": "CBOE:ECH", "fetched_at": "2026-08-24T16:58:58-04:00"}, "risk_metrics": {"origin": "data/history/CMPC.json", "n_days": 319}}, "metricChanges": [], "opportunity": {"cats": {"valuacion_hist": {"score": 85, "just": "P/B 0,28x — mínimo histórico virtual para CMPC (históricamente 0,5-0,8x); precio en percentil 3,4 de 1 año, -16% vs SMA200 y -35% desde el máximo de 52 sem ($1.599). EV/EBITDA 7,9x con EBITDA de fondo de ciclo. Muy barata contra su propia historia (dashboard 31-jul; JPM/Diario Financiero)."}, "asimetria": {"score": 70, "just": "A $1.035: downside a soporte $1.015 (mínimo 52 sem) = -2%; upside al target conservador de JPM $1.100 = +6% y a targets de agregadores rezagados $1.513-1.712 = +46-65% si la celulosa normaliza. Ratio muy favorable AL PRECIO ACTUAL; el riesgo es que la deuda rompa el soporte, no la valoración."}, "calidad": {"score": 45, "just": "Balance estresado: deuda neta/EBITDA 4,1x y S&P recortó a BBB- en mar-2026 (borde de investment grade). 1T26: EBITDA US$255M (margen 14,1%) estable por eficiencias, pero utilidad -33% t/t a US$25M. Productor de bajo costo del grupo Matte — activo de calidad con balance débil en fondo de ciclo (Investing/TradingView 1T26)."}, "catalizadores": {"score": 55, "just": "2T26 el 6-ago: foco en EBITDA y desapalancamiento. JPM ve celulosa presionada en 2S26 por sobreoferta, pero hay recortes de oferta reales: cierre definitivo de Canfor (softwood), atraso de OKI II de APP y revocación de permisos forestales en Indonesia (Diario Financiero, SunSirs: BHKP China ~4.417 RMB/t estable). Catalizador de precio de celulosa probable en 6-12 meses, no inmediato."}, "contrarian": {"score": 80, "just": "Pesimismo extremo: el sell de JPM la llevó a mínimos de casi 2 años (La Tercera), -24% YTD vs ECH, percentil 3,4 del rango anual, targets locales abandonados. Mientras, ventas y EBITDA se mantuvieron estables en 1T26 (TradingView). Sentimiento en capitulación con operación estable = setup contrarian clásico."}}, "plan": {"recomendacion": "Acumular en zona", "zona_compra": "$1.000–1.060 CLP (ya está en zona; primer tramo aquí, segundo tramo si testea $1.015)", "invalidacion": "Cierre semanal bajo $985 CLP, deuda neta/EBITDA >4,5x en 2T26 o pérdida del investment grade (BBB- a high yield)", "gatillos": ["2T26 (6-ago): EBITDA ≥US$250M y deuda neta estable o cayendo", "Repunte del BHKP neto China desde ~4.400 RMB/t (SunSirs/Fastmarkets) por cierres de capacidad", "Confirmación de S&P de outlook estable en BBB-"], "horizonte": "12-18 meses (jugada de ciclo de celulosa + P/B deprimido)", "tamano": "Escalonado y pequeño al inicio (1/3 de posición objetivo) por el apalancamiento 4,1x; completar solo tras 2T26 sin deterioro de deuda", "confianza": "media"}}, "trend": {"piso": 1, "techo": 0, "max": 7, "senales_piso": ["base construyéndose sobre el mínimo anual"], "senales_techo": []}, "perfil": "CMPC es un grupo forestal-industrial chileno integrado verticalmente, desde plantaciones propias de pino y eucalipto hasta celulosa de mercado, papeles y consumo masivo, con operaciones en ocho países. Se organiza en Pulp (celulosa y madera), Softys (tissue y cuidado personal) y Biopackaging. En 2025 facturó ~USD 7.480 millones con un mix de ventas de Softys 45-47%, Pulp 39-40% y Biopackaging 14%, pero la caja se concentra en Pulp, que aportó 59% del EBITDA del 4T25 con margen 21,9% frente a 12,4% de Softys. Chile pesa solo ~16% de las ventas: México y Brasil son los mayores mercados de consumo y Asia absorbe el grueso de la celulosa exportada. Estructuralmente es un negocio precio-tomador, atado al ciclo de la celulosa BHKP y a la demanda china, con Softys como contrapeso de menor margen pero flujo estable. El calce cambiario ayuda (ingresos en dólares contra costos en CLP y BRL) pero la deuda también es dolarizada: el apalancamiento subió a 3,97x EBITDA al cierre de 2025, y sobre eso pesa el proyecto Natureza en Brasil (+USD 4.500 millones), que define el perfil de riesgo de los próximos años."}, {"ticker": "CENCOSUD", "company": "Cencosud S.A.", "statsList": [["Precio", "$2.128,0 CLP (24-ago-2026)"], ["Rango 52 sem.", "$1.882 – $3.238 CLP"], ["Listado", "Bolsa de Santiago: CENCOSUD (IPSA)"], ["Market cap", "~CLP 5,7-5,8 billones"], ["P/E · P/B", "~36-37x trailing (12,5x forward) · P/B 1,07-1,12x"], ["Dividend yield", "~1,2% (dividendo $25/acción con cargo a utilidades 2025, pagado 14-may-2026)"], ["Target consenso", "$2.743 CLP (+28,9%) — 2 buy / 10 hold / 1 sell (13 analistas)"], ["Próx. earnings", "5-nov-2026 (3T26)"], ["Técnico (auto)", "RSI 65.9 · MACD +5.33 / señal -13.41 (TradingView, 24-ago-2026)"]], "change": {"day": 3.3, "week": 3.3}, "reportDate": "24 de agosto de 2026", "events": [{"date": "2026-11-05", "label": "Resultados 3T26", "kind": "earnings", "info": "Primer trimestre completo tras el 2T26 (primera pérdida neta trimestral en años, EBITDA -12% a/a). El mercado buscará: si se cumple lo adelantado por management de un 3T26 'mejorando', si el margen de oció que los supuestos del guidance 2026 (EBITDA US$1.815 MM) fueron \"bastante distintos\" a lo ocurrido — señal de riesgo a la baja sobre esa meta pese al tono \"cautelosamente constructivo\" para el 2S26 (Investing.com, 6-ago-2026).", "valuacion": "- HECHO: P/E trailing salta a ~36-37x (forward ~12,5x) tras la pérdida del 2T26 que erosionó la utilidad TTM; P/B 1,07-1,12x; dividend yield ~1,2-1,3% (dividendo $25/acción, ya pagado 14-may-2026) (StockAnalysis/Investing.com, 24-ago-2026).\n- HECHO: consenso Neutral/Hold — 13 analistas (2 compra / 10 mantener / 1 venta), target promedio $2.743 CLP (+28,9%), a la baja desde $2.886 en jul-2026 conforme se ajustan estimaciones (StockAnalysis.com, 24-ago-2026).\n- HECHO: Credicorp Capital considera a Cencosud \"la mejor candidata\" entre las rezagadas del IPSA (junto a CMPC y Entel) para recuperarse primero, porque sus catalizadores \"dependen de variables dentro de su control\" (DF, ago-2026).\n- HECHO: BCI condiciona el re-rating a un rebote real del consumo discrecional en Chile, más recortes de tasa del BCCh, estabilidad cambiaria en Argentina y evidencia de sinergias de St. Marche/Makro (DF, ago-2026).\n- LECTURA: el P/E trailing ya no es la métrica relevante (distorsionada por la pérdida puntual); el forward ~12,5x y el P/B ~1,1x siguen sugiriendo descuento, pero la brecha de +29% del consenso es menor que la de julio (+49%): el mercado exige evidencia de margen, no solo precio bajo.", "tecnico": "- HECHO: mínimo post-resultado en $1.930 (16-ago-2026, RSI 37,6); desde ahí +10,3% en dos sesiones hasta $2.128 (24-ago), con volumen 6,2M vs promedio 20d de 2,5M (ratio 2,5x) (TradingView, 24-ago-2026).\n- HECHO: precio ya sobre la SMA20 (+6,9%) y la SMA50 (+4,0%), aunque sigue 15,4% bajo la SMA200 ($2.516); RSI 65,9 y MACD cruzando a positivo (+5,3 vs señal -13,4) (TradingView, 24-ago-2026).\n- HECHO: percentil de precio en el rango de 52 semanas: 18,1 (vs 3,5 al momento del mínimo de jul-2026); rendimiento 1 mes +8,1%, o Colombia sin condiciones adversas", "Consolidación del precio sobre la SMA200 (~$2.516) con volumen sostenido"], "horizonte": "12-18 meses", "tamano": "Reducido/inicial hasta confirmación — el rally de agosto ya usó parte del descuento y el próximo catalizador está a más de dos meses", "confianza": "media"}}, "trend": {"piso": 2, "techo": 0, "max": 7, "senales_piso": ["reconquista de SMA50", "histograma MACD girando al alza"], "senales_techo": []}, "perfil": "Cencosud es el mayor operador de retail multiformato de origen chileno, con más de 1.300 locales en seis países y cinco unidades: supermercados (Jumbo, Santa Isabel, Disco, The Fresh Market), mejoramiento del hogar (Easy), tiendas por departamento (Paris), centros comerciales y servicios financieros. El core es alimentos: los supermercados explican 70-75% de los ingresos, y por país Chile aporta 44%, Argentina 20% y Estados Unidos 12%. La rentabilidad, en cambio, está mucho más concentrada: Chile es el ancla del resultado y el negocio inmobiliario es desproporcionadamente rentable —los malls operan con márgenes EBITDA en torno a 80%— frente a supermercados (11-12%) y tiendas por departamento, de un dígito bajo. En 2025 los ingresos fueron ~CLP 16,6 billones con utilidad +70,4%, y leverage neto de ~3,5x tras comprar Makro Argentina y el resto de The Fresh Market. Lo estructural: exposición a Argentina (donde la contabilidad hiperinflacionaria distorsiona las cifras), traslación cambiaria que reduce contablemente el aporte externo cuando el peso chileno se fortalece, y una estructura de costos rígida que hace al margen muy sensible a pequeños cambios en las ventas comparables."}, {"ticker": "ASML", "company": "ASML Holding N.V.", "statsList": [["Precio", "$1,740.13 (24-ago-2026)"], ["Rango 52 sem.", "$710,45 – $1.999,96"], ["Market cap", "~US$675.500M (stockanalysis.com, jul-2026)"], ["P/E", "~55,7x trailing / ~31,5x forward (stockanalysis.com, jul-2026)"], ["Target consenso", "~US$2.117 promedio (rango US$883-  de cliente; evitar sobreexposición hasta confirmación en earnings", "confianza": "media"}}, "perfil": "Oracle es una empresa de software empresarial que, cada vez más, también vende infraestructura en la nube: bases de datos, aplicaciones de gestión empresarial (ERP, RRHH, cadena de suministro) y, desde su expansión hacia Oracle Cloud Infrastructure (OCI), capacidad de cómputo con GPUs para IA, vendida a grandes empresas, gobiernos y a los principales laboratorios de IA del mundo. El core histórico son las licencias y suscripciones de bases de datos y aplicaciones (Fusion, NetSuite), de altísimo margen y alta recurrencia por lo costoso que es migrar sistemas críticos ya instalados. El motor de crecimiento reciente es OCI, que factura contratos plurianuales de infraestructura de IA por cientos de miles de millones de dólares con clientes como OpenAI, pero con márgenes brutos sensiblemente menores que el software tradicional. Esto cambia el perfil de riesgo: de una máquina de flujo de caja estable a un negocio intensivo en capital, financiado crecientemente con deuda, cuya rentabilidad futura depende de la escala y de que sus clientes de IA cumplan sus compromisos de pago.", "risk": {"volatility_30d": null, "sharpe": null, "sortino": null, "max_drawdown_1y": null, "n_days": 4, "window": 30}, "benchmark": {"ticker": "SP:SPX", "label": "S&P 500", "relative_performance_30d": 12.99, "relative_performance_ytd": -39.13, "price_percentile_1y": 12.1, "partial": false}, "technical": {"price": 142.45, "change_1d_pct": -2.74, "change_1w_pct": -2.74, "rsi": 49.0, "macd": 0.9589, "macd_signal": 0.4773, "sma20": 141.9195, "sma50": 144.5928, "sma200": 172.546, "ema12": 144.3271, "ema26": 143.3682, "pct_vs_sma20": 0.37, "pct_vs_sma50": -1.48, "pct_vs_sma200": -17.44, "volume_today": 13913395, "volume_avg20": 31816784.0, "volume_ratio": 0.44, "volatility_30d": null, "sharpe": null, "sortino": null, "max_drawdown_1y": null, "price_percentile_1y": 12.1, "vs_benchmark_30d_pct": 12.99, "
