<title>Stock Research — Dashboard de Equity Research</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d0d0d">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stocks">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #f3f3f0;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --hairline: #e1e0d9;
    --border: rgba(11, 11, 11, 0.10);
    --accent: #2a78d6;
    --accent-soft: rgba(42, 120, 214, 0.12);
    --track: #e7e6e0;
    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --good-tint: rgba(12, 163, 12, 0.13);
    --warning-tint: rgba(250, 178, 25, 0.16);
    --serious-tint: rgba(236, 131, 90, 0.16);
    --critical-tint: rgba(208, 59, 59, 0.13);
    --hecho-bg: rgba(42, 120, 214, 0.10);
    --hecho-ink: #1c5cab;
    --lectura-bg: rgba(74, 58, 167, 0.10);
    --lectura-ink: #4a3aa7;
    --up: #006300;
    --down: #d03b3b;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --surface-2: #222220;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --hairline: #2c2c2a;
      --border: rgba(255, 255, 255, 0.10);
      --accent: #3987e5;
      --accent-soft: rgba(57, 135, 229, 0.18);
      --track: #2c2c2a;
      --good-tint: rgba(12, 163, 12, 0.18);
      --warning-tint: rgba(250, 178, 25, 0.15);
      --serious-tint: rgba(236, 131, 90, 0.15);
      --critical-tint: rgba(208, 59, 59, 0.18);
      --hecho-bg: rgba(57, 135, 229, 0.16);
      --hecho-ink: #86b6ef;
      --lectura-bg: rgba(144, 133, 233, 0.16);
      --lectura-ink: #9085e9;
      --up: #2ebd5f;
      --down: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #222220;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-soft: rgba(57, 135, 229, 0.18);
    --track: #2c2c2a;
    --good-tint: rgba(12, 163, 12, 0.18);
    --warning-tint: rgba(250, 178, 25, 0.15);
    --serious-tint: rgba(236, 131, 90, 0.15);
    --critical-tint: rgba(208, 59, 59, 0.18);
    --hecho-bg: rgba(57, 135, 229, 0.16);
    --hecho-ink: #86b6ef;
    --lectura-bg: rgba(144, 133, 233, 0.16);
    --lectura-ink: #9085e9;
    --up: #2ebd5f;
    --down: #e66767;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #f3f3f0;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --hairline: #e1e0d9;
    --border: rgba(11, 11, 11, 0.10);
    --accent: #2a78d6;
    --accent-soft: rgba(42, 120, 214, 0.12);
    --track: #e7e6e0;
    --good-tint: rgba(12, 163, 12, 0.13);
    --warning-tint: rgba(250, 178, 25, 0.16);
    --serious-tint: rgba(236, 131, 90, 0.16);
    --critical-tint: rgba(208, 59, 59, 0.13);
    --hecho-bg: rgba(42, 120, 214, 0.10);
    --hecho-ink: #1c5cab;
    --lectura-bg: rgba(74, 58, 167, 0.10);
    --lectura-ink: #4a3aa7;
    --up: #006300;
    --down: #d03b3b;
  }

  html { background: var(--page); }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; }
  :is(a, button, input, summary):focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }

  .topbar {
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
    padding: 18px 24px 14px;
    border-bottom: 1px solid var(--hairline);
  }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
  .brand .tick { color: var(--accent); font-family: var(--mono); font-weight: 600; }
  .topbar .meta { color: var(--muted); font-size: 12.5px; }
  .topbar .spacer { flex: 1; }
  .edu-chip {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-2);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
  }

  .layout {
    display: grid;
    grid-template-columns: 288px minmax(0, 1fr);
    gap: 0;
    min-height: calc(100vh - 60px);
  }
  .rail {
    border-right: 1px solid var(--hairline);
    padding: 18px 14px 24px;
  }
  .rail-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 8px 10px;
  }
  .search {
    width: 100%;
    margin: 0 0 12px;
    padding: 8px 11px;
    font: inherit;
    font-size: 13.5px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 8px;
  }
  .search::placeholder { color: var(--muted); }
  .no-match {
    background: var(--surface);
    border: 1px dashed var(--hairline);
    border-radius: 9px;
    padding: 12px 13px;
    font-size: 12.5px;
    color: var(--ink-2);
    line-height: 1.5;
  }
  .no-match .q { font-family: var(--mono); font-weight: 700; color: var(--ink); }
  .ask-btn {
    display: block; text-align: center; text-decoration: none;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 13px;
    border-radius: 9px; padding: 10px 12px; margin: 10px 0 6px;
  }
  .ask-btn:hover { filter: brightness(1.08); }
  .ask-note { font-size: 11px; color: var(--muted); }
  .head-actions a.btn { text-decoration: none; display: inline-flex; align-items: center; }
  .btn.danger { color: var(--down); border-color: var(--critical-tint); }
  .btn.danger:hover { border-color: var(--down); background: var(--critical-tint); }
  .no-match p { margin: 0 0 8px; }
  .no-match p:last-child { margin: 0; }
  .stock-list { display: flex; flex-direction: column; gap: 6px; }
  .stock-card {
    display: grid;
    grid-template-columns: 1fr auto;
    column-gap: 10px;
    row-gap: 1px;
    align-items: center;
    width: 100%;
    text-align: left;
    background: none;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 9px 10px;
    cursor: pointer;
  }
  .stock-card:hover { background: var(--surface-2); }
  .stock-card.active {
    background: var(--surface);
    border-color: var(--border);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  }
  .stock-card .t { font-family: var(--mono); font-weight: 700; font-size: 14px; }
  .stock-card .n {
    grid-column: 1;
    color: var(--muted);
    font-size: 11.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stock-card .p { grid-column: 1; color: var(--ink-2); font-size: 12px; font-family: var(--mono); }
  .stock-card .pw { grid-column: 1; font-size: 10.5px; color: var(--muted); }
  .delta { font-family: var(--mono); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .delta.up { color: var(--up); }
  .delta.down { color: var(--down); }
  .delta.flat { color: var(--muted); }
  .head-delta { font-size: 19px; }
  .head-price {
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    color: var(--ink);
    white-space: nowrap;
  }
  .head-week { margin-top: 4px; font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .head-week .delta { font-size: 12.5px; }
  .score-chip {
    grid-column: 2;
    grid-row: 1 / span 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 46px;
    border-radius: 8px;
    padding: 5px 7px;
    line-height: 1.15;
  }
  .score-chip .v { font-family: var(--mono); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
  .score-chip .g { font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; }
  .rail-note { color: var(--muted); font-size: 11.5px; padding: 16px 8px 0; line-height: 1.5; }

  .main { padding: 26px 32px 56px; max-width: 980px; }

  .company-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .company-head h1 { margin: 0; font-size: 26px; letter-spacing: -0.015em; }
  .company-head .ticker {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 6px;
    padding: 2px 8px;
  }
  .company-head .date { color: var(--muted); font-size: 12.5px; }
  .head-actions { margin-left: auto; display: flex; gap: 8px; }
  .btn {
    border: 1px solid var(--hairline);
    background: var(--surface);
    border-radius: 7px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink-2);
  }
  .btn:hover { background: var(--surface-2); color: var(--ink); }
  .mode-switch {
    display: inline-flex;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 2px;
    background: var(--surface);
    gap: 2px;
  }
  .mode-switch button {
    border: none;
    background: none;
    border-radius: 999px;
    padding: 4px 14px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-2);
    cursor: pointer;
    white-space: nowrap;
  }
  .mode-switch button:hover { color: var(--ink); }
  .mode-switch button.active {
    background: var(--accent);
    color: #ffffff;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 8px;
    margin: 18px 0 22px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 9px;
    padding: 10px 12px;
    min-width: 0;
  }
  .stat .l {
    font-size: 10.5px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
    white-space: nowrap;
  }
  .stat .v { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--ink); overflow-wrap: break-word; }

  .hero {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 22px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    padding: 18px 22px;
    margin-bottom: 26px;
  }
  .hero .reading { color: var(--ink-2); font-size: 14px; max-width: 62ch; }
  .hero .reading strong { color: var(--ink); }
  .grade-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border-radius: 999px;
    padding: 3px 12px 3px 8px;
    font-weight: 700;
    font-size: 13px;
    margin-top: 8px;
  }
  .grade-pill .dot { width: 9px; height: 9px; border-radius: 50%; }
  .gauge-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .gauge-num {
    font-family: var(--mono);
    font-size: 34px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .gauge-cap { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

  .grade-good { background: var(--good-tint); }
  .grade-good .dot { background: var(--good); }
  .grade-warning { background: var(--warning-tint); }
  .grade-warning .dot { background: var(--warning); }
  .grade-serious { background: var(--serious-tint); }
  .grade-serious .dot { background: var(--serious); }
  .grade-critical { background: var(--critical-tint); }
  .grade-critical .dot { background: var(--critical); }

  .section-nav {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 10px 0;
    margin: 0 0 8px;
    background: var(--page);
    border-bottom: 1px solid var(--hairline);
    scrollbar-width: none;
  }
  .section-nav::-webkit-scrollbar { display: none; }
  .section-nav a {
    flex: 0 0 auto;
    text-decoration: none;
    color: var(--ink-2);
    font-size: 12.5px;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 4px 11px;
    white-space: nowrap;
    background: var(--surface);
  }
  .section-nav a:hover { color: var(--ink); background: var(--surface-2); }
  .section-nav a .k { font-family: var(--mono); color: var(--muted); margin-right: 4px; }

  .report-section { padding: 22px 0 6px; border-bottom: 1px solid var(--hairline); scroll-margin-top: 54px; }
  .report-section:last-of-type { border-bottom: none; }
  .sec-eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .report-section h2 { margin: 2px 0 12px; font-size: 19px; letter-spacing: -0.01em; }
  .prose { max-width: 74ch; color: var(--ink-2); }
  .prose p { margin: 0 0 12px; }
  .prose ul { margin: 0 0 12px; padding-left: 20px; }
  .prose li { margin-bottom: 7px; }
  .prose strong { color: var(--ink); }
  .badge {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.05em;
    border-radius: 4px;
    padding: 1px 6px;
    margin-right: 4px;
    vertical-align: 0.08em;
  }
  .badge.hecho { background: var(--hecho-bg); color: var(--hecho-ink); }
  .badge.lectura { background: var(--lectura-bg); color: var(--lectura-ink); }
  .prose .md-h { font-weight: 700; color: var(--ink); margin: 16px 0 8px; }
  .md-table { overflow-x: auto; margin: 0 0 12px; }
  .md-table table { border-collapse: collapse; font-size: 12.5px; min-width: 340px; }
  .md-table th, .md-table td { padding: 5px 10px; text-align: left; border-bottom: 1px solid var(--hairline); }
  .md-table th {
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .md-table td { font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .signal-close { margin: 12px 0 0; color: var(--ink-2); font-size: 13.5px; max-width: 78ch; }
  .signal-close strong { color: var(--ink); }

  .score-detail { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 18px 20px; }
  .cat-row { display: grid; grid-template-columns: 190px minmax(0, 1fr) 88px; gap: 12px; align-items: center; padding: 7px 0; }
  .cat-row .name { font-size: 13px; font-weight: 600; }
  .cat-row .w { color: var(--muted); font-size: 11.5px; font-family: var(--mono); margin-left: 6px; font-weight: 400; }
  .bar { position: relative; height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--accent); }
  .cat-row .val {
    font-family: var(--mono);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    text-align: right;
    color: var(--ink-2);
  }
  .cat-row .val b { color: var(--ink); font-size: 13.5px; }
  .cat-just { margin: 2px 0 10px; padding: 0 0 8px; border-bottom: 1px dashed var(--hairline); color: var(--ink-2); font-size: 12.5px; max-width: 78ch; }
  .cat-just:last-of-type { border-bottom: none; }
  .score-total {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
    border-top: 1px solid var(--hairline);
    margin-top: 10px;
    padding-top: 12px;
  }
  .score-total .num { font-family: var(--mono); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .score-note { color: var(--muted); font-size: 12px; margin-top: 10px; max-width: 74ch; }

  details.weights { margin-top: 14px; border-top: 1px solid var(--hairline); padding-top: 10px; }
  details.weights summary { cursor: pointer; font-size: 13px; color: var(--ink-2); user-select: none; }
  details.weights summary:hover { color: var(--ink); }
  .w-grid { display: grid; grid-template-columns: 170px minmax(0, 1fr) 52px; gap: 10px 12px; align-items: center; margin: 12px 0 6px; }
  .w-grid label { font-size: 12.5px; color: var(--ink-2); }
  .w-grid input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
  .w-grid .wv { font-family: var(--mono); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
  .w-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .w-foot .warn { color: var(--serious); font-weight: 600; }

  details.sources { margin: 20px 0 0; }
  details.sources summary { cursor: pointer; font-size: 13px; color: var(--ink-2); }
  details.sources ul { columns: 2; column-gap: 28px; padding-left: 18px; margin: 10px 0 0; font-size: 12.5px; color: var(--muted); }
  details.sources li { margin-bottom: 5px; break-inside: avoid; }

  .disclaimer {
    margin: 30px 0 0;
    border-left: 3px solid var(--hairline);
    padding: 4px 0 4px 14px;
    color: var(--muted);
    font-size: 12.5px;
    max-width: 74ch;
  }

  .toast {
    position: fixed;
    bottom: 18px;
    right: 18px;
    background: var(--surface);
    color: var(--ink-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 9px 14px;
    font-size: 13px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: none; }

  @media (prefers-reduced-motion: reduce) {
    .toast { transition: none; }
    html { scroll-behavior: auto; }
  }
  html { scroll-behavior: smooth; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .rail { border-right: none; border-bottom: 1px solid var(--hairline); padding-bottom: 12px; }
    .stock-list { flex-direction: row; overflow-x: auto; padding-bottom: 6px; }
    .stock-card { min-width: 168px; }
    .rail-note { display: none; }
    .main { padding: 20px 16px 48px; }
    .hero { grid-template-columns: 1fr; }
    .cat-row { grid-template-columns: 1fr; gap: 5px; }
    .cat-row .val { text-align: left; }
    details.sources ul { columns: 1; }
  }

  /* — Calendario — */
  .layout.cal-mode { grid-template-columns: minmax(0, 1fr); }
  .layout.cal-mode .rail { display: none; }
  .cal-wrap { max-width: 880px; margin: 0 auto; padding: 30px 22px 60px; }
  .cal-head h1 { font-size: 24px; margin: 0 0 6px; }
  .cal-head .sub { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  .cal-month {
    margin: 30px 0 4px;
    font-size: 11.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink-2);
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 7px;
  }
  .cal-day { display: grid; grid-template-columns: 66px minmax(0, 1fr); gap: 16px; padding: 13px 0; border-bottom: 1px solid var(--hairline); }
  .cal-day:last-child { border-bottom: none; }
  .cal-date { text-align: center; padding-top: 2px; }
  .cal-date .dnum { font-family: var(--mono); font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.05; }

go 52 sem.","$4.947 – $6.598 CLP"],["Listado","Bolsa de Santiago: CCU (IPSA) · ADR NYSE: CCU US$11,25"],["Market cap","~CLP 1,95-2,0 billones (US$2,06B vía ADR)"],["P/E · EV/EBITDA","17,3x trailing / ~15x fwd · EV/EBITDA 8,7x"],["Dividend yield","~3,0% (div. definitivo $74,53 pagado abr-2026)"],["Target consenso","$5.877 CLP (+11%) — 2 buy / 4 hold / 4 sell"],["Próx. earnings","6-ago-2026 (2T26)"],["Técnico (auto)","RSI 54.4 · MACD +45.01 / señal +59.59 (TradingView, 7-sep-2026)"]],"change":{"day":0.74,"week":0.74},"sections":{"resumen":"CCU llega a julio 2026 como un claro rezagado del rally chileno: mientras el IPSA encadena máximos históricos, la acción opera ~20% bajo su máximo de 52 semanas ($6.598) tras un año bajista, aunque en las últimas semanas construye una base sobre los $5.000 con el MACD recién cruzado al alza. La tesis tiene tres patas: un negocio en Chile que opera muy bien (EBITDA +13,7% en 1T26, margen 20%, viento a favor del peso fuerte), dos lastres visibles (Argentina con EBITDA −18,6% y Vinos con −50,1%) y una valuación ~20% por debajo de su promedio histórico de 10 años. El consenso es tibio (Hold/Neutral, target $5.877) pero con dispersión extrema: BICE ve +52% ($7.794) y UBS recomienda vender ($4.750). Catalizadores inmediatos: resultados 2T26 el 6-ago y las primeras señales del nuevo CEO Eduardo Ffrench-Davis, que asumió el 1-jul con foco declarado en márgenes y eficiencia.","fundamental":"**Resultados 1T26** (reportados 6/7-may-2026):\n\n- HECHO: Ventas consolidadas CLP 819.515 millones (+0,2% a/a); EBITDA CLP 131.644 millones (+0,1%), margen estable en 16,1%; utilidad controladora CLP 53.856 millones (−6,8%, ~US$58M); UPA CLP 145,8; volúmenes consolidados +1,8% (press release 1Q26 / TipRanks / La Tercera, may-2026).\n- HECHO — **Chile, el motor**: ventas +3,9%, EBITDA +13,7% a CLP 107.357 millones, margen 20,0% (+173 pb), ayudado por la apreciación del CLP de 8,1% vs USD (menores costos dolarizados) y volúmenes +3,9% liderados por categorías no alcohólicas (press release 1Q26, may-2026).\n- HECHO — **Negocios Internacionales** (Argentina, Bolivia, Paraguay, Uruguay): ventas −6,7%, EBITDA −18,6% a CLP 28.489 millones; volúmenes −1,7% con caída de un dígito medio en cerveza en Argentina (press release 1Q26).\n- HECHO — **Vinos**: ventas −7,2%, EBITDA −50,1% a CLP 3.288 millones (margen −508 pb) por mayor costo del vino y sobreoferta global (~US$19B de inventario excedente en la industria) (press release 1Q26; DF, 12-jun-2026).\n- HECHO: TTM en USD (ADR): revenue US$3,13B (−2,2%), utilidad neta US$121,8M (−32,0%); ROE 7,3-7,9%; Deuda/Patrimonio 0,71x (StockAnalysis 20-jul-2026; Visfin jul-2026).\n\n**Propiedad y movimientos corporativos:**\n\n- HECHO: IRSA controla el 65,87% de CCU; IRSA es JV 50/50 entre Quiñenco y Heineken. Free float: 20,04% local + 14,09% ADR (ccuinvestor.com, 2026).\n- HECHO: CCU completó la compra de la participación de Nestlé en el JV de aguas por US$180 millones (DF, 12-jun-2026).\n- HECHO: Eduardo Ffrench-Davis asumió como CEO el 1-jul-2026 tras 28 años de Patricio Jottar, quien pasa al directorio; Alexandre Carreteiro (presidente de Heineken Américas) fue nombrado vicepresidente del directorio (TipRanks, jul-2026).\n- LECTURA: el negocio chileno (dos tercios del EBITDA) está en su mejor momento de márgenes en años; el problema de CCU no es operacional en su core, sino la exposición a Argentina y al ciclo global del vino. La mayor injerencia de Heineken en el directorio puede traer disciplina de márgenes o tensión con Quiñenco — sin evidencia de conflicto por ahora.","valuacion":"- HECHO: P/E trailing 17,25x local / 16,9-18,4x ADR; forward ~15x (BTG estima 13,3x); EV/EBITDA 8,66x (Investing/Visfin/StockAnalysis, jul-2026).\n- HECHO: la acción transa **~20% por debajo de su promedio de valuación de los últimos 10 años** (DF, 12-jun-2026).\n- HECHO: dividend yield ~3,0% local (dividendo definitivo N°272 de $74,53 por acción pagado desde el 24-abr-2026) (TipRanks/Diario Estrategia, abr-2026).\n- HECHO — targets locales: consenso **$5.877 CLP (+11%)**, máx $6.600, mín $4.365; 2 buy / 4 hold / 4 sell (Investing.com, jul-2026). Casas (DF, 12-jun-2026): **BICE Sobreponderar PO $7.794 (+52%)**, **BTG Neutral PO $6.500**, **UBS Vender PO $4.750** (argumenta crecimiento de ingresos de un dígito hasta 2028).\n- HECHO: ADR consenso Hold, target US$12,46 (+10,8%, 7 analistas) (StockAnalysis, 20-jul-2026).\n- LECTURA: la valuación es el corazón de la tesis alcista — múltiplos comprimidos contra la propia historia con un IPSA que transa ~12% caro vs la suya. Pero el descuento tiene causa: el upside depende de que Argentina y Vinos se normalicen, no del negocio chileno que ya opera bien y está en el precio. La dispersión BICE/UBS (de +52% a −7%) refleja exactamente esa apuesta.","tecnico":"- HECHO: precio $5.285 CLP, +1,28% en la sesión del lunes 20-jul y +1,63% vs 5 ruedas atrás (TradingView tiempo real, 20-jul-2026).\n- HECHO: RSI(14) diario 56,3 — neutral con sesgo alcista; MACD(12,26,9) +12,6 sobre señal −1,0 (histograma +13,6): **cruce alcista reciente** (calculado sobre 130 barras diarias de TradingView, 20-jul-2026).\n- HECHO: precio sobre la SMA20 (~$5.183, +2,0%) y SMA50 (~$5.204, +1,6%), y justo en la SMA100 (~$5.285); bajo la MM200 publicada (~$5.670) (TradingView 20-jul-2026; Visfin jul-2026).\n- HECHO: señal técnica diaria \"Strong Buy\", semanal neutral (Investing.com, jul-2026). Mínimo de 52 semanas $4.947 tocado a inicios de mayo; desde ahí, piso doble en la zona $5.000-5.050 (jun y feb).\n- LECTURA: estructura de base tras 12 meses bajistas (−16,6% en las últimas ~26 semanas). Soportes: $5.183-5.204 (SMA20/50) y $5.000-4.947; resistencias: $5.443 (máximo intradía del 20-jul), $5.670 (MM200) — su recuperación sería la confirmación de cambio de tendencia — y la zona $6.600. El cruce de MACD con RSI aún lejos de sobrecompra deja espacio al rebote, pero mientras siga bajo la MM200 es un rebote dentro de tendencia bajista, no una tendencia alcista nueva.","catalizadores":"- HECHO: **resultados 2T26 el 6-ago-2026** (StockAnalysis, jul-2026). LECTURA: trimestre de invierno, estacionalmente débil en volúmenes; el foco estará en si Chile sostiene margen 20% y en el ritmo de deterioro/mejora argentino.\n- HECHO: **nuevo CEO** Eduardo Ffrench-Davis desde el 1-jul-2026, con prioridad declarada en márgenes y eficiencia; renovación de comités del directorio entre julio y agosto (DF 12-jun-2026; TipRanks jul-2026). LECTURA: primer plan estratégico del nuevo management es el catalizador idiosincrático más cercano.\n- HECHO: **tipo de cambio** — USD/CLP ~926 (14-jul-2026), con el CLP apreciado 8,1% vs USD en 1T26: viento a favor directo en costos dolarizados del segmento Chile (dolarhoy.net; press release 1Q26).\n- HECHO: **insumos** — aluminio LME ~US$3.160-3.200/t con inventarios −43% en el año y déficit proyectado (~930 kt según Macquarie); cebada y lúpulo europeos +12-18% de costo desembarcado en 1T26 (TradingEconomics/AgMetalMiner/Expert Market Research, jul-2026).\n- HECHO: **Argentina** — consumo masivo −3,3% acumulado en 2026, pero inflación mensual desacelerando (<2% proyectado para julio) y expectativa de recuperación gradual del consumo en 2S26 (Bloomberg Línea/Infobae, jun-2026). LECTURA: la recuperación argentina es la opción de mayor convexidad de la tesis.\n- HECHO: **macro Chile** — PIB 1T26 −0,5% a/a, Imacec de mayo −0,9% (quinto retroceso consecutivo), Banco Central recortó el crecimiento 2026 hacia ~1%, riesgo de recesión técnica (Emol/Bloomberg/XTB, mar-jul 2026). LECTURA: el 1T26 se benefició de un consumo chileno que ya no acelera — el viento de cola doméstico se está apagando.","sentimiento":"- HECHO: consenso local Neutral con 2 buy / 4 hold / 4 sell y PO $5.877 (Investing, jul-2026); ADR Hold con target US$12,46 (StockAnalysis, 20-jul-2026). El DF tituló (12-jun-2026): \"Argentina y alta exposición a vinos y cervezas hacen dudar al mercado\".\n- HECHO: noticias de los últimos 45 días — cierre de la compra del JV de aguas a Nestlé (US$180M, jun), cambio de CEO y reordenamiento del directorio con mayor presencia de Heineken (1-jul), y entrada en vigencia de nuevas restricciones a la publicidad de alcohol en Chile el 7-jul-2026.\n- HECHO: contexto IPSA — el índice acumula ~70 máximos históricos en el año, transa ~12% más caro que su historia, con flujos extranjeros récord (US$112M vía el principal ETF en el año) y targets como el de Bci en 12.050 puntos; el optimismo se moderó en julio por el débil crecimiento (DF/Emol/Bloomberg, 2026).\n- LECTURA: el contraste es la historia — el IPSA en máximos mientras CCU está 20% bajo su peak la convierte en uno de los grandes laggards del rally chileno. Eso sostiene el argumento de valuación relativa (BICE), pero 4 de 10 analistas locales recomiendan vender: el mercado no compra la normalización de Argentina y Vinos todavía. Sin datos públicos de posicionamiento institucional o insiders para el papel local.","conclusion":"CCU es una apuesta de valuación y reversión a la media, no de momentum: negocio core chileno en su mejor nivel de márgenes, múltiplos 20% bajo su historia, 3% de yield, y dos lastres (Argentina, Vinos) que explican el descuento y cuya normalización — no garantizada — es el upside. El técnico acompaña por primera vez en meses (cruce de MACD, sobre SMA20/50, doble piso en $5.000) pero la MM200 en $5.670 sigue arriba como techo de la tendencia. Con el consenso en Hold y el IPSA caro, el papel ofrece asimetría razonable bajo $5.300 con soporte claro en $5.000, catalizador fechado el 6-ago (2T26) y la incógnita del plan del nuevo CEO. La señal es **Hold** con sesgo constructivo: para pasar a Buy se necesita recuperar la MM200 y/o evidencia de que Argentina dejó de drenar EBITDA; para venderla, perder los $5.000 que ya defendió dos veces."},"scores":{"tecnica":{"score":60,"just":"Rebote con confirmación: cruce alcista de MACD, RSI 56 con espacio, precio sobre SMA20/50 y doble piso defendido en $5.000. Se descuenta porque sigue bajo la MM200 ($5.670) y 20% bajo el máximo de 52 semanas — es una base dentro de tendencia bajista, aún no una tendencia alcista."},"fundamental":{"score":62,"just":"Chile (dos tercios del EBITDA) con margen 20% y EBITDA +13,7%, balance sano (D/E 0,71x) y valuación 20% bajo su media histórica con 3% de yield. Los lastres pesan: Argentina −18,6% y Vinos −50,1% de EBITDA, utilidad total −6,8% y ROE mediocre (~7,5%)."},"sentimiento":{"score":46,"just":"Consenso tibio con 4 de 10 analistas locales en venta, laggard notorio del rally IPSA y titulares de prensa escépticos (\"hacen dudar al mercado\"). A favor: dispersión de targets con el extremo alcista (BICE +52%) bien argumentado y flujos extranjeros récord hacia la bolsa chilena que eventualmente rotan a rezagados."},"riesgo":{"score":50,"just":"Negocio defensivo de consumo básico con 65% del mercado cervecero chileno y controlador sólido (Quiñenco/Heineken), pero triple exposición adversa: macro chilena deteriorándose (5 Imacec negativos), Argentina sin piso confirmado, sobreoferta global de vino, más costos de aluminio y cebada al alza y nuevas restricciones publicitarias vigentes desde el 7-jul."},"conviccion":{"score":55,"just":"Catalizadores concretos y fechados (2T26 el 6-ago, plan del nuevo CEO, recuperación argentina en 2S26) y tesis falsable con niveles claros ($5.000 abajo, MM200 $5.670 arriba). La convicción es media porque el timing de la normalización de Argentina y Vinos es incierto y el consenso lleva meses sin comprarla."}},"sources":["TradingView — BCS:CCU tiempo real, 130 barras diarias; RSI/MACD/SMA calculados (20-jul-2026)","Investing.com — cotización local, consenso 2/4/4, PO $5.877, P/E, yield (jul-2026)","StockAnalysis.com — ADR CCU, targets, forward P/E, EV/EBITDA, earnings 6-ago (20-jul-2026)","Visfin.cl — MM50/200, ROE, D/E (jul-2026)","CCU Investor — Press Release 1Q26 (6-may-2026)","TipRanks — resultados 1T26; transición CEO/directorio; dividendo abr-2026 (may-jul 2026)","La Tercera/Pulso — utilidad 1T26 US$58M (may-2026)","Diario Financiero — POs BICE $7.794 / BTG $6.500 / UBS $4.750; compra JV aguas Nestlé US$180M (12-jun-2026)","ccuinvestor.com / Quiñenco — estructura de propiedad IRSA 65,87% (2026)","Bloomberg Línea / Infobae — consumo Argentina −3,3% 2026, inflación desacelerando (jun-2026)","Bloomberg / Emol / XTB — macro Chile: Imacec, riesgo de recesión técnica, gobierno Kast (mar-jul 2026)","TradingEconomics / AgMetalMiner — aluminio LME, déficit proyectado (jul-2026)","Expert Market Research / Mordor — mercado cervecero Chile: CCU ~65%, ABI ~30% (2025-2026)","Senado.cl / La Tercera — Ley 21.363: restricciones publicidad alcohol desde 7-jul-2026","dolarhoy.net — USD/CLP 926 (14-jul-2026)"],"events":[{"date":"2026-08-06","label":"Resultados 2T26","kind":"earnings","info":"Sin consenso público disponible para el 2T26 (trimestre estacionalmente débil). Se mirará si se repite el patrón del 1T26: Chile sólido pero consumo debilitado en Argentina y un negocio del vino 'particularmente difícil' (Diario Financiero, may 2026). Claves: volúmenes por país, traspaso de precios a márgenes y el efecto del tipo de cambio argentino en resultados consolidados."}],"risk":{"volatility_30d":31.32,"sharpe":3.8,"sortino":3.85,"max_drawdown_1y":-24.07,"n_days":322,"window":30},"benchmark":{"ticker":"CBOE:ECH","label":"ECH (proxy Chile/IPSA)","relative_performance_30d":5.47,"relative_performance_ytd":-5.31,"price_percentile_1y":39.5,"partial":false},"technical":{"price":5599,"change_1d_pct":0.74,"change_1w_pct":0.74,"rsi":54.4,"macd":45.012,"macd_signal":59.5897,"sma20":5549.375,"sma50":5410.316,"sma200":5605.863,"ema12":5571.4301,"ema26":5526.418,"pct_vs_sma20":0.89,"pct_vs_sma50":3.49,"pct_vs_sma200":-0.12,"volume_today":44206,"volume_avg20":245576.0,"volume_ratio":0.18,"volatility_30d":31.32,"sharpe":3.8,"sortino":3.85,"max_drawdown_1y":-24.07,"price_percentile_1y":39.5,"vs_benchmark_30d_pct":5.47,"perf_1m_pct":3.66,"perf_ytd_pct":-4.52 20%. Pesimismo notable con datos operativos del núcleo estables/mejorando, aunque no es capitulación extrema (RSI 53,8)."}},"plan":{"recomendacion":"Esperar gatillo","zona_compra":"$5.000–5.200 CLP (aproximación al soporte $4.947); a $5.385 no hay margen de seguridad suficiente","invalidacion":"Cierre semanal bajo $4.900 CLP (pérdida del mínimo de 52 sem) o deterioro del margen Chile bajo 18% en 2T26","gatillos":["2T26 (6-ago): margen EBITDA Chile ≥19% y volúmenes Argentina dejando de caer","Corrección post-resultados hacia $5.000–5.200 por el EPS trimestral negativo esperado","Primer trimestre con EBITDA de Internacional creciendo en CLP"],"horizonte":"12-18 meses","tamano":"Media posición como máximo si se da la zona; no perseguir a precio actual","confianza":"media"}},"trend":{"piso":0,"techo":2,"max":7,"senales_piso":[],"senales_techo":["divergencia RSI bajista","histograma MACD girando a la baja"]},"perfil":"CCU es una compañía regional multicategoría de bebestibles presente en seis países: produce y distribuye cervezas propias y licenciadas (Cristal, Escudo, Heineken, Budweiser), gaseosas y aguas bajo licencia de PepsiCo, néctares, licores y vinos vía VSPT. El core está en Chile: en 2025 aportó ~64% de los ingresos y ~76% del EBITDA (margen 16,3%), mientras Negocios Internacionales —esencialmente Argentina— sumó ~27% de los ingresos pero solo ~15% del EBITDA con margen de 7,1%, y Vinos ~9%. Consolidado 2025: ingresos CLP 2,91 billones, EBITDA CLP 376.208 millones y deuda neta/EBITDA de 2,02x, apalancamiento conservador. Lo estructural es la asimetría entre un negocio chileno maduro y de márgenes defendibles y una operación argentina volátil, expuesta a devaluación y contabilidad hiperinflacionaria que amplifica la varianza del resultado sin cambiar el valor económico. Además los costos son dolarizados (malta, aluminio, PET) contra ingresos en moneda local, así que una depreciación comprime margen con dos o tres trimestres de rezago. El punto de vigilancia es competitivo: AB InBev le ha quitado participación sostenidamente apoyada en la red de los embotelladores Coca-Cola."},{"ticker":"EUR/USD","company":"Euro / Dólar","baseCurrency":"EUR","statsList":[["Precio","1.16271 (7-sep-2026)"],["Rango 80 días","1.133 – 1.182"],["Tasas BCE / Fed","2,25% / 3,50–3,75%"],["COT EUR (14-jul)","-12,605 netos (corto)"],["DXY","100.76 (17-jul-2026)"],["Próximo evento","BCE 23-jul · FOMC 28-29-jul"],["Técnico (auto)","RSI 57.1 · MACD +0.00 / señal +0.00 (TradingView, 7-sep-2026)"]],"change":{"day":0.04,"week":0.12},"customSections":[{"title":"Resumen ejecutivo","nav":"Resumen","body":"EUR/USD cerró la semana en **1.14382**, dentro de un rango contenido tras una caída de ~4% desde los máximos de abril (~1.182) y un rebote desde los mínimos de junio (~1.133). El cuadro es de **equilibrio inestable con sesgo de cautela**:\n\n- **HECHO:** El diferencial de tasas sigue siendo claramente favorable al USD (Fed Funds 3.50–3.75% vs. tasa de depósito BCE 2.25%), aunque el BCE **subió** 25 pb en junio mientras la Fed está en pausa — el diferencial se está cerrando en el margen a favor del EUR.\n- **HECHO:** La semana entrante es de alto riesgo de evento: **reunión del BCE el jueves 23-jul** (mercado descuenta ~95% de mantención) y **FOMC el 28-29-jul** (~87–89% de mantención).\n- **HECHO:** Los especuladores están **netos cortos en EUR** (-12,605 contratos, COT al 14-jul-2026), aunque recortando cortos.\n- **LECTURA:** Los riesgos de cola (guerra en Medio Oriente y shock energético asimétrico contra Europa, reapertura de la disputa arancelaria EEUU-UE, crisis política/energética en Francia) recaen desproporcionadamente sobre el EUR.\n\n**Señal resultante: Caution (Grado C — 46/100).** Sin ventaja clara para comprar EUR; el par sigue siendo un rango 1.133–1.155 dominado por bancos centrales y geopolítica.\n\n---"},{"title":"Diferencial de tasas y política monetaria","nav":"Tasas","body":"**BCE (HECHO):**\n- Tasa de depósito vigente: **2.25%**, tras una **subida de 25 pb decidida en la reunión de junio (17-jun-2026)** en respuesta a la presión inflacionaria derivada del shock energético (ECB / Trading Economics, jul-2026).\n- Próxima reunión: **jueves 23-jul-2026** (decisión 13:45 CET, conferencia de Lagarde 14:30 CET) — es decir, **sí hay reunión la semana del 20-jul**. Es reunión sin proyecciones de staff.\n- Expectativas de mercado: **~95.3% de mantención en 2.25%**, con una cola alcista de ~3.4% para +25 pb (rateprobability.com / ecb-watch, consultado 19-jul-2026).\n- Tono de Lagarde: **hawkish**. El 2-jul defendió la subida de junio citando proyecciones de inflación en torno al 3% para 2026 y la necesidad de mantenerse vigilante (ECB Forum Sintra, jul-2026).\n\n**Fed (HECHO):**\n- Rango objetivo vigente: **3.50%–3.75%**; en junio el FOMC mantuvo y señaló que la inflación sigue elevada respecto de la meta del 2% (core PCE ~2.9%).\n- FOMC 28-29-jul-2026: **~89% de probabilidad de mantención** según CME FedWatch (~86.7% según fuentes alternativas al 18-jul-2026). Consenso: tasas sin cambios al menos hasta el otoño boreal, condicionado a progreso en inflación.\n- Tono del presidente de la Fed, Kevin Warsh (Sintra, 1-jul-2026): sin señales para julio, pero \"los precios están demasiado altos\" — sesgo restrictivo.\n\n**Divergencia (LECTURA):** El **nivel** del diferencial (~125–150 pb en tasas de política; 2 años: UST 4.16% vs. Schatz ~2.6–2.8%) favorece al USD y sostiene el carry en contra del EUR. Pero la **dirección** favorece marginalmente al EUR: el BCE está subiendo (y conserva cola hawkish) mientras la Fed está estática. Riesgo señalado por estrategas: que el mercado retire el tightening del BCE antes que el de la Fed, limitando el alza del EUR (VT Markets, jul-2026).\n\n---"},{"title":"Balanza de pagos y flujos","nav":"Balanza","body":"**Cuenta corriente (HECHO):**\n- Superávit de la eurozona de **€25 mil millones en mayo-2026** (+€8 mm m/m): bienes +€16 mm, servicios +€14 mm, renta primaria +€12 mm, renta secundaria -€18 mm (BCE, 17-jul-2026).\n- Acumulado 12 meses a mayo-2026: **€272 mm (1.7% del PIB)**, frente a €318 mm (2.0% del PIB) un año antes — **superávit en contracción**, principalmente por menor superávit de bienes (de €350 mm a €286 mm) (BCE, 17-jul-2026).\n- Proyección del staff del Eurosistema (jun-2026): caída adicional a **~1.3% del PIB en 2026** por mayores precios de importación de energía a raíz de la guerra en Medio Oriente (ECB Economic Bulletin, 2026).\n\n**Flujos de portafolio 2026 (HECHO/LECTURA):**\n- HECHO: La rotación hacia Europa de comienzos de año **se revirtió a mitad de 2026**: la porción de flujos de ETFs de renta variable de EEUU hacia fondos centrados en EEUU subió todos los meses del año, alcanzando ~85% en junio (iShares H1-2026). En Europa, los flujos hacia productos centrados en EEUU se **cuadruplicaron** interanual (Morningstar, 2026). En money markets, USD fue la clasificación más comprada (+€15.98 mm) mientras los fondos EUR registraron salidas (-€5.06 mm) (Lipper/LSEG, may-2026).\n- LECTURA: El colchón estructural de cuenta corriente sigue siendo un soporte de fondo para el EUR, pero se erosiona por energía, y los flujos de portafolio han vuelto a favorecer activos en USD por el atractivo relativo de las tasas americanas. Neto: **levemente negativo para el EUR**.\n\n---"},{"title":"Posicionamiento","nav":"Posicionamiento","body":"**HECHO — CFTC COT, Euro FX (CME), datos al martes 14-jul-2026, publicado 17-jul-2026 (Tradingster/CFTC):**\n- No comerciales (especuladores): largos 230,307 / cortos 242,912 → **neto -12,605 contratos (corto)**.\n- Variación semanal: +6,877 largos, +3,255 cortos → **neto +3,622 hacia largo** (los cortos se están recortando).\n- Interés abierto: 799,495 contratos — mercado profundo y líquido.\n- Tendencia de meses: el neto largo de ~+21,000 contratos de marzo-2026 (percentil 15 del rango de 52 semanas, mínimo de 1 año) se ha degradado hasta territorio **neto corto** (AhaSignals/Investing.com, 2026).\n\n**LECTURA:** Posicionamiento levemente bajista en EUR pero **cercano a plano y mejorando** — no hay extremo de posicionamiento que genere señal contraria potente en ninguna dirección. Un BCE hawkish el 23-jul podría forzar cobertura de cortos (riesgo alcista táctico); la señal estructural es neutral-negativa.\n\n---"},{"title":"Análisis técnico","nav":"Técnico","body":"**HECHO — TradingView (17-jul-2026):**\n- Precio: **1.14382**.\n- RSI(14) diario: **47.2** — neutral.\n- MACD(12,26): **-0.0025** vs. señal **-0.0036**; histograma **+0.0011** — momentum bajista moderándose.\n- Medias: precio **sobre SMA20 (1.1414)** pero **bajo SMA50 (1.1530)**.\n- Ventana 80 días: caída desde máximos ~**1.182** (abril) hasta mínimos ~**1.133** (junio); rebote reciente a ~1.148 y cierre 1.1438.\n\n**LECTURA:**\n- La estructura de mediano plazo sigue siendo **correctiva/bajista** (máximos y mínimos decrecientes desde abril; precio bajo SMA50), pero el rebote desde 1.133 con histograma MACD al alza y recuperación de la SMA20 sugiere que la caída **perdió fuerza**.\n- Soportes: 1.1414 (SMA20), luego 1.133 (mínimo de junio — pivote clave). Resistencias: 1.148 (techo del rebote), 1.1530 (SMA50), luego zona 1.16.\n- Un cierre diario sobre la SMA50 (~1.153) convertiría el rebote en cambio de tendencia; la pérdida de 1.133 reactivaría el tramo bajista hacia 1.12. Con RSI en 47 y precio entre medias, el veredicto técnico es **neutral** (par ni alcista ni bajista con convicción).\n\n---"},{"title":"Intervención y riesgo de banco central","nav":"Intervención","body":"**HECHO/LECTURA:** El riesgo de intervención cambiaria **directa** en EUR/USD es históricamente bajo (última intervención coordinada relevante: 2000/2011); ni el BCE ni el Tesoro de EEUU han señalado nada en 2026 a los niveles actuales. El riesgo relevante es **de cola**:\n\n1. **Energía / Medio Oriente (HECHO):** Tras los ataques de Israel-EEUU contra Irán (28-feb-2026) y la disrupción del Estrecho de Ormuz (~1/5 del suministro global de GNL afectado), el gas europeo opera en ~€46/MWh; los escenarios de crisis prolongada de la Comisión Europea/JRC contemplan petróleo hasta ~USD 180/bbl y gas ~€80/MWh en 4T-2026 (JRC, may-2026; Bloomberg, 9-jul-2026). **LECTURA:** shock asimétricamente negativo para el EUR (Europa importadora neta; EEUU exportador de energía).\n2. **Aranceles EEUU-UE (HECHO):** El acuerdo provisional del 20-may-2026 (arancel máximo ~15% a productos UE) coexiste con amenazas de Trump de tarifas \"mucho más altas\" si no se ratifica, reabriendo la guerra comercial (ING, Euronews, 2026). **LECTURA:** riesgo bajista para crecimiento europeo y EUR.\n3. **Política europea (HECHO):** Crisis política y presupuestaria en Francia, con hoja de ruta energética bloqueada y reactores nucleares parados por olas de calor (Energynews/MNI, 2026). **LECTURA:** prima de riesgo político latente en activos EUR.\n\n**Balance:** riesgo de intervención bajo, pero **riesgo de cola elevado y sesgado en contra del EUR**.\n\n---"},{"title":"Correlaciones macro","nav":"Correlaciones","body":"- **DXY (HECHO):** 100.76 al 17-jul-2026, prácticamente plano en la sesión (Trading Economics/FXStreet). Con EUR ~58% del índice, la correlación inversa DXY–EUR/USD **se mantiene plenamente operativa**: el estancamiento del DXY sobre 100 es el espejo del rango 1.13–1.15 del par.\n- **Diferencial de bonos (HECHO):** UST 10a **4.55%** vs. Bund 10a **3.14%** → spread ~**141 pb** a favor de EEUU (17-jul-2026). En 2 años: UST **4.16%** (16-jul) vs. Schatz **~2.6–2.8%** (máximo desde jul-2024) → ~140–155 pb.\n- **LECTURA:** El spread 10a se ha comprimido desde niveles de 2024–25 (>180 pb) por la subida de los Bunds (BCE hawkish + fiscal alemán), coherente con un EUR/USD que dejó de caer. La correlación negativa entre spread UST–Bund y EUR/USD **se mantiene**; para que el par supere 1.155 de forma sostenida se requeriría compresión adicional del diferencial (BCE subiendo o Fed girando dovish), que hoy no está descontada para julio.\n\n---"},{"title":"Conclusión","nav":"Conclusión","body":"EUR/USD en 1.14382 es un par **en rango, sin ventaja direccional clara**: el carry y los riesgos de cola favorecen al USD; la dirección de la política monetaria (BCE subiendo, Fed en pausa) y un posicionamiento corto en corrección dan soporte táctico al EUR. La semana del 20-jul (BCE 23-jul) y el FOMC del 28-29-jul definirán el próximo tramo.\n\n**Qué validaría una tesis alcista en EUR (Buy EUR):** sorpresa hawkish del BCE el 23-jul y/o giro dovish de la Fed el 29-jul; cierre diario sobre la SMA50 (~1.1530) con compresión del spread UST–Bund bajo ~130 pb; distensión en Medio Oriente (gas < €40/MWh) y ratificación limpia del acuerdo arancelario; COT cruzando a neto largo.\n\n**Qué la invalidaría (riesgo bajista):** pérdida del mínimo de junio (1.133), que abriría 1.12; escalada en Ormuz con petróleo hacia $150–180/bbl y gas hacia €80/MWh, o ruptura arancelaria EEUU-UE; Fed re-hawkish con BCE forzado a pausar; agravamiento de la crisis política francesa con ampliación de spreads OAT–Bund.\n\n> *Este informe es una herramienta de investigación educativa generada con IA. No constituye asesoría de inversión ni recomendación de compra/venta. Verifique todos los datos de forma independiente antes de tomar decisiones financieras.*"}],"scoreIndex":8,"customCats":[{"key":"tasas","name":"Diferencial de Tasas y Política Monetaria","weight":30},{"key":"macro","name":"Fundamentales Macro","weight":20},{"key":"tecnico","name":"Técnico","weight":20},{"key":"posicionamiento","name":"Posicionamiento y Sentimiento","weight":15},{"key":"intervencion","name":"Riesgo de Intervención / Cola","weight":15}],"scores":{"tasas":{"score":48,"just":"El nivel del diferencial (~125–150 pb en política y en 2 años) sigue pagando por estar en USD, pero la dirección (BCE subió en junio con cola hawkish para el 23-jul; Fed estática) cierra la brecha en el margen. Neutral con leve sesgo negativo por el carry."},"macro":{"score":45,"j )."},{"date":"2026-10-21","label":"Earnings Q3 2026 (fecha estimada)","kind":"earnings","info":"Prueba clave de estabilización: margen operativo (1,4% en Q2) y FCF (-$1,1B en Q2 por capex +142%). EPS esperado ~$0,42. Otras fuentes sitúan la fecha el 28-oct (TipRanks/MarketScreener, ago-2026)."}],"sections":{"resumen":"TSLA reportó el 22-jul un Q2 con ingresos récord de $28,2B (+26%) pero EPS ajustado de $0,33 vs $0,51 esperado: el margen operativo colapsó a 1,4% (desde 4,1%) y el FCF fue -$1,1B por capex +142% en IA y robótica. La acción tocó un mínimo de 52 semanas de $297,82 y cotiza $321,55 (-21,6% bajo SMA200, percentil anual 12), con rebote semanal de +3,3% tras el teaser de Musk de un «Robotaxi unveil» el 8-ago. HECHO: robotaxi se expandió de Austin a Dallas, Houston, Miami, Orlando y Tampa, con permisos en Nevada (5.000 unidades) y Arizona. LECTURA: el auto core se deteriora más rápido de lo que el robotaxi monetiza.","fundamental":"- HECHO: Q2 2026 revenue $28,24B (+26% YoY, beat) pero EPS ajustado $0,33 vs $0,51 esperado; operating income $398M (-57% YoY) y margen operativo 1,4% vs 4,1% (tradingkey/Electrek, 22-jul-2026).\n- HECHO: FCF -$1,1B (vs +$1,44B en Q1 2026) por capex +141,8% destinado a IA, robótica y Cybercab; margen bruto GAAP 16,8%.\n- HECHO: robotaxi operativo en 6 áreas metropolitanas de EE.UU.; permiso solicitado para 5.000 unidades en Nevada, aprobación en Arizona y Cybercab en producción en Texas (Teslarati/webpronews, jul-2026).\n- HECHO: el lenguaje de «producción en masa 2026» desapareció del deck para tres productos y el crecimiento de millas pagas de robotaxi se aplanó (XenoSpectrum, jul-2026).\n- LECTURA: la tesis es hoy casi 100% opcionalidad (robotaxi/Optimus) mientras el negocio que genera caja se comprime por precios y pérdida de créditos regulatorios.","valuacion":"- HECHO: P/E ~250x trailing / ~140x forward a $321,55 (calculado sobre EPS TTM ~$1,28; stockanalysis, ago-2026); market cap ~US$1,09T.\n- HECHO: target consenso ~$410-425 con rating Hold; rango de targets $25-600, la mayor dispersión del mercado (fxopen/24-7 Wall St, jul/ago-2026).\n- HECHO: Dan Ives (Wedbush) mantiene $600 anclado en FSD, redes robotaxi y Optimus; el caso bajista valúa el auto core a múltiplo de automotriz tradicional.\n- LECTURA: 250x con margen operativo de 1,4% no se sostiene con los fundamentales actuales — el precio es una apuesta a que robotaxi escale antes de que la compresión del core agote la paciencia del mercado.","tecnico":"- Precio $321,55: -16,5% bajo SMA50 y -21,6% bajo SMA200; percentil 1Y de 12, cerca del piso del rango anual ($297,82-$498,83).\n- RSI 37,5: débil pero sin sobreventa extrema; hoy -1,8% dentro de un rebote semanal de +3,3%.\n- Relativo 30d vs benchmark: -22%, el peor del universo cubierto.\n- Volatilidad 30d ~70: colas anchas en ambas direcciones ante el evento del 8-ago.\n- LECTURA: sin cambio de carácter — el rebote es de evento (teaser 8/8), no de acumulación; la zona $297-300 es el nivel que define todo.","catalizadores":"**Catalizadores:**\n- Unveil Robotaxi el 8-ago anunciado por Musk — potencial mover violento de la acción en cualquier dirección.\n- Expansión robotaxi hacia ~12 estados: permisos de Nevada (5.000 unidades) y Arizona en curso.\n- Rollout de FSD V14.3.x en flota AI4 y publicación de datos de millas pagas.\n- Earnings Q3 (~21-oct): prueba de estabilización de margen operativo y retorno a FCF positivo.\n\n**Riesgos (por materialidad):**\n- Valuación ~250x extremadamente vulnerable a cualquier decepción del 8-ago o retraso de robotaxi.\n- Quema de caja: capex +142% con margen operativo de 1,4% — segunda lectura consecutiva débil forzaría repricing adicional.\n- Investigación NHTSA sobre FSD escalando (documento interno «Radar Saves Us» incorporado al expediente; Electrek, 21-jul-2026) — riesgo regulatorio directo sobre la tesis robotaxi.\n- Deterioro del auto core: presión de precios, créditos regulatorios cayendo y crecimiento de millas pagas aplanándose.","sentimiento":"- HECHO: consenso Hold con target ~$410; la acción cae ~31% YTD contra un mercado positivo — pesimismo dominante (fxopen/24-7 Wall St, ago-2026).\n- HECHO: mínimo de 52 semanas ($297,82) tocado a fines de julio; percentil anual de precio en 12 (Investing.com, ago-2026).\n- HECHO: el teaser del unveil 8/8 disparó el rebote de la semana — el nombre sigue moviéndose por narrativa más que por números.\n- LECTURA contrarian: el pesimismo es elevado pero está fundamentado en deterioro real de márgenes; no es el pánico irracional que se compra en contrario, es un repricing merecido con opcionalidad todavía viva.","conclusion":"Tesla está en máxima tensión entre narrativa y números: margen operativo de 1,4%, FCF negativo y una investigación federal sobre FSD, contra una expansión robotaxi real y un evento el 8-ago capaz de mover la acción con violencia en cualquier dirección. A ~250x, el riesgo de pérdida permanente es alto si la opcionalidad se retrasa. El percentil 12 y el pesimismo de consenso dan algo de ventaja contrarian, pero sin cambio de carácter técnico ni piso fundamental confirmado solo cabe posición especulativa pequeña. Gatillo honesto: millas pagas reacelerando más margen operativo >3% en Q3."},"scores":{"tecnica":{"score":36,"just":"Estructura bajista intacta (-21,6% vs SMA200, percentil 12) sin cambio de carácter: el rebote semanal es de evento (teaser 8/8), no de acumulación, y el RSI 37,5 no llegó a sobreventa extrema que marque capitulación."},"fundamental":{"score":30,"just":"Revenue récord (+26%) no compensa margen operativo de 1,4%, EPS -35% vs consenso y FCF de -$1,1B; la desaparición del lenguaje de producción en masa 2026 y las millas pagas aplanándose debilitan también la tesis de opcionalidad."},"sentimiento":{"score":48,"just":"Pesimismo elevado (Hold, -31% YTD, mínimos de 52 sem) da algo de ventaja contrarian, pero está justificado por deterioro fundamental real — no es el extremo de miedo irracional que se compra en contrario."},"riesgo":{"score":25,"just":"Riesgo de pérdida permanente alto: ~250x earnings con márgenes colapsando, quema de caja creciente y riesgo regulatorio (NHTSA) directo sobre la única tesis que sostiene la valuación."},"conviccion":{"score":34,"just":"La tesis depende de que robotaxi/Optimus moneticen antes de que el core se agote; dispersión de targets $25-600 refleja que nadie —tampoco nosotros— tiene visibilidad real; el 8-ago puede cambiar el cuadro en ambas direcciones."}},"sources":["tradingkey.com, 22/07/2026 - Tesla Q2 2026: capex +142% YoY, FCF turns negative, margen operativo 1,4%","Electrek, 22/07/2026 - Tesla (TSLA) Q2 2026 financial results: record revenue, big profit miss","evwire.com, jul-2026 - Tesla Q2 2026 earnings deck recap: record $28.2B revenue, Robotaxi and Semi push","XenoSpectrum, jul-2026 - '2026 Mass Production' language vanishes for three products; robotaxi paid-mile growth flattens","InsiderFinance, jul-2026 - Tesla Q2 2026 Results Show Revenue Beat, Cash Burn","Investing.com, ago-2026 - Tesla stock hits 52-week low at $297.82","24/7 Wall St, 03/08/2026 - Tesla Price Prediction: Could the Stock Rally 30% From Here?","24/7 Wall St, 27/07/2026 - Tesla Continues Its 2026 Crash. This Prominent Analyst Believes It'll Rise 85% in 12 Months (Ives $600)","fxopen, ago-2026 - Tesla consensus target ~$410, rating Hold; targets $25-600","Electrek, 21/07/2026 - NHTSA targets Tesla's 'Radar Saves Us' document in FSD crash probe","TradingView News, ago-2026 - Tesla stock jumps after Musk teases robotaxi unveiling on August 8","Teslarati/webpronews, jul-2026 - Robotaxi expansion: Nevada 5,000-unit permit filing, Arizona approval, five new cities","stockanalysis.com/companiesmarketcap, ago-2026 - TSLA statistics: P/E trailing/forward, market cap","TipRanks, ago-2026 - Próximo earnings TSLA estimado 21-oct-2026 (EPS est. $0,42)"],"opportunity":{"cats":{"valuacion_hist":{"score":15,"just":"~250x trailing con margen operativo de 1,4% y FCF negativo: la valuación de e: los créditos regulatorios son ingreso de margen casi puro y equivalen al 46% del beneficio operativo de 2025; excluyéndolos, el margen bruto automotriz cae a 15,4%. En paralelo, energía crece con 29,8% de margen bruto, por encima del automóvil. Lo estructural: es un fabricante de autos, con la ciclicidad e intensidad de capital del sector, expuesto a la expiración de subsidios y a la competencia en precio de los chinos (BYD ya lo superó en volumen); su valor incremental depende de opciones aún no monetizadas —robotaxi y robótica— que absorben US$6.400M de I+D, y de un gobierno corporativo inusualmente dependiente de una sola persona."},{"ticker":"MP","company":"MP Materials Corp.","statsList":[["Precio","$54.53 (7-sep-2026)"],["Rango 52 sem.","$37,81 – $100,25"],["Market cap","~US$8.530M (178,05M acciones × $47,91; stockanalysis.com, 5-ago-2026)"],["P/E","n/a — pérdidas TTM (EPS -$0,34); forward P/E ~99x, P/S TTM ~20x sobre revenue $416M (stockanalysis.com, ago-2026)"],["Target consenso","~US$77,5-79,5 promedio, 18 analistas en compra / 0 venta, Strong Buy (CNN Markets / Investing.com, jul-ago 2026) — implica ~+62% desde $47,91"],["Próx. earnings","6-ago-2026 (Q2 2026, mañana): consenso ingresos ~US$95,7M y EPS ajustado ~$0,01 (MarketBeat, ago-2026)"],["Técnico (auto)","RSI 50.5 · MACD +1.02 / señal +1.63 (TradingView, 7-sep-2026)"]],"reportDate":"5 de agosto de 2026","change":{"day":1.39,"week":-2.85},"events":[{"date":"2026-08-06","label":"Earnings Q2 2026","kind":"earnings","info":"Consenso: ingresos ~US$95,7M (vs $57,4M a/a) y EPS ajustado ~$0,01 (MarketBeat, ago-2026). Foco: volúmenes y costo unitario de NdPr, ramp del segmento Magnetics (Independence, Fort Worth), avance de construcción del 10X, comisionado de separación de tierras raras pesadas en Mountain Pass, y cualquier cuantificación del impacto de la blacklist china del 22-jun en equipos/insumos. Evento binario tras +25,7% de rebote semanal pre-reporte."}],"sections":{"resumen":"MP cerró el 5-ago en $47,91 (+0,93% día, +25,75% en 5 ruedas), rebotando en V desde $38,10 (29-jul), pegado al mínimo 52-sem de $37,81, y aún -52% bajo el máximo de $100,25. HECHO: reporta Q2 2026 mañana 6-ago. La tesis estructural sigue intacta: única cadena mina-imán integrada de EE.UU., piso DoD de $110/kg para NdPr por 10 años, offtake 100% del futuro 10X y acuerdo Apple de $500M vigente. La caída feb-jul respondió a la blacklist china (22-jun), insider selling y desinfle del premium 2025. LECTURA: capitulación de julio (RSI<30) más piso contractual del DoD acotaban el downside; el rebote pre-earnings ya consumió parte de esa asimetría.","fundamental":"- HECHO: Q1 2026 (6-may): revenue $90,6M (+49% a/a), EBITDA ajustado $36,6M, utilidad neta ajustada $6,7M; producción récord de NdPr 917 t (+63%) y ventas 1.006 t (+117%) (MP IR, may-2026).\n- HECHO: acuerdo DoD (jul-2025) vigente: piso de $110/kg para NdPr por 10 años vía contract-for-difference, préstamo de $150M para separación de pesadas, y compromiso de compra del 100% de los imanes del 10X (10.000 t/año NdFeB, comisionado 2028); $1.000M de financiamiento comprometido por JPMorgan/Goldman (MP IR / FAS).\n- HECHO: acuerdo Apple $500M (jul-2025) vigente: imanes de tierras raras 100% recicladas desde Independence (Fort Worth), envíos desde 2027.\n- HECHO: Magnetics (Independence) en Q1 2026: revenue $21,1M (+306% a/a) y EBITDA de segmento $9,6M; 10X con groundbreaking realizado y comisionado de separación de pesadas por iniciarse en Mountain Pass (MP IR, may-2026).\n- HECHO: MOFCOM incluyó a MP en su lista de control (22-jun-2026), vetando exportaciones chinas de ítems dual-use hacia la empresa. LECTURA: no afecta ventas (MP dejó de vender concentrado a China en 2025) pero puede encarecer equipos/insumos; alcance completo no verificable.","valuacion":"- HECHO: sin P/E trailing (pérdidas TTM, EPS -$0,34); forward P/E ~99x y P/S TTM ~20x (stockanalysis.com, ago-2026) — el precio descuenta la ejecución 2027-28, no las utilidades actual almente y vende hardware de consumo de gama alta —iPhone, Mac, iPad, Watch, AirPods— y luego monetiza esa base instalada de más de 2.500 millones de dispositivos con software y servicios: App Store, iCloud, publicidad, pagos y el acuerdo de búsqueda por defecto con Google. El iPhone sigue siendo el eje: US$209.600M, ≈50% de los US$416.200M de ingresos del FY2025, seguido de Servicios con 26%. Pero el dinero real está en Servicios: con margen bruto de 75,4% frente al 36,8% de Productos, aportan ≈42% del beneficio bruto con un cuarto de las ventas. Lo estructural: dependencia de un solo producto —un ciclo débil de iPhone arrastra también a Servicios, que se monetizan sobre esa misma base—; las rentas de plataforma más rentables (comisión del App Store y el pago de Google, ~US$20.000M anuales) están bajo ataque regulatorio simultáneo en EE.UU. y la UE; y una cadena de suministro concentrada en Asia con TSMC y Foxconn como puntos únicos de fallo. El foso es el ecosistema y los costes de cambio, reforzado por el silicio propio."}, {"ticker": "MSFT", "company": "Microsoft Corporation", "statsList": [["Precio", "$499.70 (7-sep-2026)"], ["Rango 52 sem.", "$349.20 – $555.45"], ["Market cap", "$2.93T"], ["P/E", "23.4–24.4x (fwd ~19.5x)"], ["Target consenso", "$558.77 (56 analistas)"], ["Próx. earnings", "29-jul-2026 (Q4 FY26)"], ["Técnico (auto)", "RSI 59.4 · MACD +15.26 / señal +17.64 (TradingView, 7-sep-2026)"]], "sections": {"resumen": "MSFT vive una desconexión inusual: los fundamentales aceleran (revenue +18%, Azure +40%, EPS +23% en Q3 FY26) mientras la acción cae ~29% desde el máximo de 52 semanas ($555.45) por el shock del guidance de capex de ~$190B para 2026 y la caída del FCF. Con P/E de ~23-24x vs su promedio de 10 años de ~32x y consenso Strong Buy con target promedio $558 (+42%), la tesis es de calidad a precio de descuento, condicionada a que el capex demuestre retorno. El catalizador inmediato son los resultados Q4 FY26 del 29 de julio de 2026.", "fundamental": "**Últimos resultados (Q3 FY26, cerrado 31-mar-2026, reportado 29-abr-2026):**\n\n- HECHO: Revenue $82.9B, +18% a/a, vs consenso $81.39B; EPS diluido GAAP $4.27, +23% a/a, vs consenso $4.06 — beat en ambas líneas (CNBC, Yahoo Finance, 29-abr-2026).\n- HECHO: Ingreso operativo $38.4B, +20% a/a — margen operativo ~46% (Microsoft IR, 29-abr-2026); ingreso neto $31.78B vs $25.82B el año anterior (CNBC).\n- HECHO: Azure creció +40% a/a, sobre el rango guiado de 37-38%; negocio de IA con run-rate anual de $37B, +123% a/a; Copilot superó 20M de asientos (Alphastreet, abr-2026).\n- HECHO: Guidance Q4 FY26: Azure +39-40% cc; capex calendario 2026 de ~$190B, ~$35B sobre el consenso de Visible Alpha, +61% a/a (Alphastreet/TIKR, abr-2026).\n- HECHO: FCF cayó a $15.8B desde $20.3B un año antes, contra ingreso neto de $31.8B (Investing.com, 2026).\n\nLECTURA: El negocio operativo está en su mejor momento en años (reaceleración de Azure, monetización de IA tangible, márgenes intactos), pero el mercado exige prueba de retorno sobre el capex: la brecha entre utilidad neta ($31.8B) y FCF ($15.8B) es el núcleo del debate. La tesis alcista depende de que el FCF se recupere con fuerza desde FY27.", "valuacion": "- HECHO: P/E trailing ~23.4x (FinanceCharts, 17-jul-2026) / 24.4x (Macrotrends, 15-jul-2026); P/E forward ~19.5x.\n- HECHO vs. histórico propio: promedio 5 años ~32.2x, 10 años ~32.0x, pico jun-2024 38.5x, mínimo 5 años 26.5x (jun-2022) — MSFT cotiza hoy **debajo de su mínimo de 5 años previo** (FullRatio/Macrotrends, jul-2026).\n- HECHO vs. peers (jul-2026): AAPL ~35.0x, AMZN ~29.6x, GOOGL ~26.8x trailing; forward: MSFT ~19.5x vs GOOGL ~21.9x y AMZN ~27.8x — la más barata del grupo en ambas métricas (FinanceCharts/GuruFocus, 12-17-jul-2026).\n- HECHO: Price targets: promedio $558.77 (56 analistas, S&P Global); rango $400 – $870; otras muestras $557.96 (MarketBeat) y $589-592 sobre ~97 analistas (24/7 Wall St, 17-jul-2026). Upside implícito ~42-46%.\n\nLECTURA: La valuación relativa más atractiva de MSFT en al menos una década, contra su historia y contra peers. El descuento no es gratis: capitaliza el riesgo capex/FCF. Si el capex normaliza, hay doble palanca (crecimiento de EPS + re-rating); si no, el múltiplo bajo puede persistir.", "tecnico": "- HECHO: Precio ~$383-394 (fuentes difieren por día de corte, 17-18-jul-2026); **bajo** la media de 50 días ($401.88) y **bajo** la de 200 días ($438.98) — ambas en señal de venta (MarketBeat, jul-2026).\n- HECHO: RSI(14) ~53.5, zona neutral (TipRanks/AltIndex, jul-2026). Resumen de medias móviles MA5-MA200: 4 compra / 8 venta (Investing.com, jul-2026).\n- HECHO: Rebote de ~12% en el último mes dentro de una corrección mayor; +4% el 1-jul-2026 (acuerdo IA con Haleon, rotación hacia software) (ChartMill, jul-2026).\n- HECHO: Soportes: $368.57 y zona $349 (piso de 52 semanas); resistencias: $400-413, luego $427-440 (zona MM200) y $485 (Financhill/Barchart, jul-2026).\n\nLECTURA: Estructura de mediano plazo bajista (precio bajo ambas medias clave, MM200 descendente), con rebote de corto plazo aún no confirmado: recuperar y sostener $400-413 sería la primera señal constructiva; el cambio de tendencia real exige superar la MM200 (~$440). Mientras, es un intento de piso dentro de un downtrend, no una tendencia alcista.", "catalizadores": "**Catalizadores:**\n\n- **29-jul-2026 — Resultados Q4 FY26 + guidance FY27:** el evento clave; Azure guiado a +39-40% cc y primer test de la trayectoria de FCF.\n- **31-ago-2026 — Vesting del PSA de Nadella** (venta programada 10b5-1 del 80% de acciones netas) — evento conocido, puede generar ruido de titulares (SEC/StockTitan).\n- **2H 2026 — Copilot Cowork GA mundial** y SKUs Microsoft 365 Business con Copilot GA desde 1-jul-2026.\n- **Trimestres FY27 — Inflexión esperada del FCF** a medida que el capex 2026 (~$190B) entra en producción — la variable que valida o refuta la tesis.\n\n**Riesgos (por materialidad):**\n\n- **Capex sin retorno:** $190B en 2026 (+61% a/a) ya comprimió el FCF a $15.8B; si el retorno no aparece en FY27, el de-rating continúa.\n- **Concentración/diversificación de OpenAI:** acuerdo de $50B de OpenAI con AWS; alta concentración del backlog (~45% citado) — el negocio incremental futuro puede migrar.\n- **Desaceleración de Azure:** cualquier trimestre bajo el 39-40% guiado golpearía la única pata que sostiene la narrativa.\n- **Macro/rotación sectorial:** la acción ya demostró en 2026 que puede caer 30%+ con fundamentales intactos.\n- **Regulatorio/competencia cloud-IA:** presión de AWS y Google Cloud; riesgo antitrust no cuantificado en lo encontrado (no verificable en detalle).", "sentimiento": "- HECHO: Consenso Strong Buy: 34 buy / 1 hold / 1 sell (TipRanks vía Public.com) y Strong Buy en 56 analistas de S&P Global con target $558.77; sobre ~97 analistas, target promedio $589-592 (24/7 Wall St, 17-jul-2026).\n- HECHO: Acciones recientes: Argus target $510 (10-jul-2026); Morgan Stanley subió target de $625 a $650 y lo llamó top pick; Bernstein subió a $641 citando Azure. Último downgrade relevante: Stifel recortó de $540 a $392 (5-feb-2026) (Benzinga/MarketBeat).\n- HECHO: Insiders 2026: ~$51M vendidos en 34 ventas vs 1 compra abierta; Judson Althoff vendió 15,500 acciones a ~$461 (1-jun-2026); Nadella adoptó plan 10b5-1 (8-mar-2026); el director John Stanton **compró** 5,000 acciones (~$1.99M a $397.35) el 18-feb-2026 (StockTitan/MarketBeat).\n- HECHO: Tono de noticias 30-60 días constructivo — encuesta Jefferies con Azure como cloud primario del 55% de CIOs de EE.UU. vs 28% AWS; GA de Copilot Cowork; +4% el 1-jul por acuerdo con Haleon.\n\nLECTURA: Sentimiento de analistas claramente alcista y mejorando, en contraste con la acción del precio: el mercado (que vendió) y el sell-side (que compra) están en lados opuestos. Las ventas de insiders son mayormente programadas (10b5-1) y hay una compra abierta de un director cerca del precio actual, lo que resta señal negativa. El riesgo es que el consenso esté anclado a targets pre-corrección.", "conclusion": "La tesis funciona si el 29 de julio Microsoft entrega Azure en o sobre el 39-40% guiado y, sobre todo, si el guidance FY27 muestra capex desacelerando como porcentaje de ventas y un camino creíble de recuperación del FCF: con P/E forward ~19.5x, el más bajo del grupo de mega-caps y muy por debajo de su media histórica de ~32x, la combinación de beat + disciplina de capital podría disparar un re-rating hacia la zona de targets ($510-650). La tesis se invalida si: (a) Azure desacelera bajo lo guiado, (b) el capex vuelve a subir sin mejora de FCF (otro trimestre con FCF < $20B sería mala señal), o (c) OpenAI profundiza su migración a AWS erosionando el backlog. Técnicamente, perder $368.57 reabriría el camino al piso de 52 semanas ($349); recuperar $440 (MM200) confirmaría el giro. Es una apuesta de calidad a descuento con fecha de veredicto concreta, no un momentum trade."}, "scores": {"tecnica": {"score": 35, "just": "Precio bajo la MM50 ($401.88) y MM200 ($438.98), ambas en venta, y ~29% bajo el máximo de 52s: tendencia de fondo bajista. El rebote de +12% en un mes y RSI neutral (53.5) evitan un puntaje menor, pero no hay confirmación de giro sobre $400-413."}, "fundamental": {"score": 78, "just": "Crecimiento y márgenes excelentes: revenue +18%, EPS +23%, Azure +40%, margen operativo ~46%, y valuación inusualmente razonable (P/E 23-24x vs 32x histórico). Descuento por la caída del FCF a $15.8B ante capex de $190B: la calidad es alta pero la conversión a caja está transitoriamente rota."}, "sentimiento": {"score": 68, "just": "Consenso Strong Buy (34/1/1), targets $510-650 con upgrades recientes de Morgan Stanley y Bernstein, y noticias constructivas. Se descuenta porque el precio cayó ~30% en 2026 (el mercado votó en contra), insiders son vendedores netos en monto y el último downgrade (Stifel, feb-2026) apuntó justo al riesgo capex."}, "riesgo": {"score": 60, "just": "Mega-cap de $2.93T con liquidez máxima y n  energía 13% y servicios 13%. Ahí está el punto crítico del core: los créditos regulatorios son ingreso de margen casi puro y equivalen al 46% del beneficio operativo de 2025; excluyéndolos, el margen bruto automotriz cae a 15,4%. En paralelo, energía crece con 29,8% de margen bruto, por encima del automóvil. Lo estructural: es un fabricante de autos, con la ciclicidad e intensidad de capital del sector, expuesto a la expiración de subsidios y a la competencia en precio de los chinos (BYD ya lo superó en volumen); su valor incremental depende de opciones aún no monetizadas —robotaxi y robótica— que absorben US$6.400M de I+D, y de un gobierno corporativo inusualmente dependiente de una sola persona."}, {"ticker": "MU", "company": "Micron Technology, Inc.", "statsList": [["Precio", "$1,016.59 (7-sep-2026)"], ["Rango 52 sem.", "$128,40 – $1.255,00 (Investing.com, 7-sep-2026)"], ["Market cap", "~US$1,13 billones (companiesmarketcap.com, sep-2026)"], ["P/E", "22,9x trailing / ~7,1x forward (stockanalysis.com, sep-2026)"], ["Target consenso", "~US$1.513 promedio, 44 compras / 4 mantener, Strong Buy (S&P Global/Investing.com, sep-2026)"], ["Próx. earnings", "29-sep-2026 (Q4 FY26), guidance revenue $50,0B ±1,0B, margen bruto no-GAAP ~86%, EPS no-GAAP $31,00 ±1,00"], ["Técnico (auto)", "RSI 60.1 · MACD +14.06 / señal +8.19 (TradingView, 7-sep-2026)"]], "technical": {"price": 1016.59, "change_1d_pct": 6.1, "change_1w_pct": 8.98, "rsi": 60.1, "macd": 14.0618, "macd_signal": 8.1912, "sma20": 943.3038, "sma50": 938.2795, "sma200": 606.4795, "ema12": 954.315, "ema26": 940.2532, "pct_vs_sma20": 7.77, "pct_vs_sma50": 8.35, "pct_vs_sma200": 67.62, "volume_today": 35248718, "volume_avg20": 36638532.0, "volume_ratio": 0.96, "volatility_30d": 103.26, "sharpe": 0.75, "sortino": 0.96, "max_drawdown_1y": -39.1, "price_percentile_1y": 78.8, "vs_benchmark_30d_pct": 15.51, "perf_1m_pct": 14.83, "perf_ytd_pct": 244.46}, "risk": {"volatility_30d": 103.26, "sharpe": 0.75, "sortino": 0.96, "max_
