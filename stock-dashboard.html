-ago, call el 7-ago) + normalización del consumo argentino + posible rotación del IPSA hacia rezagados con corredoras proyectando 11.500-12.000."}, "contrarian": {"score": 72, "just": "Titulares uniformemente negativos, castigo idiosincrático (Falabella -6.9% vs Cencosud -33%) y 9 de 12 analistas en hold esperando para decidir: pesimismo de precios sin capitulación de estimaciones terminales — perfil contrario clásico."}}, "plan": {"recomendacion": "Acumular en zona", "zona_compra": "$1.900–1.960 CLP (solo tramo parcial antes del 6-ago; completar tras el resultado)", "invalidacion": "Cierre bajo $1.880 (mínimo de 52 semanas), o un 2T26 con EBITDA nuevamente >5% bajo consenso", "gatillos": ["2T26 (6-ago) con margen EBITDA estabilizado vs 1T26", "Reconquista de $2.040-2.100 (PO mínimo del consenso y SMA50)", "Evidencia de que St. Marche/Makro Colombia suman EBITDA sin diluir margen"], "horizonte": "12-18 meses", "tamano": "Moderado; escalar el resto solo post-resultado o sobre la SMA50", "confianza": "media"}}, "trend": {"piso": 1, "techo": 0, "max": 7, "senales_piso": ["histograma MACD girando al alza"], "senales_techo": []}, "perfil": "Cencosud es el mayor operador de retail multiformato de origen chileno, con más de 1.300 locales en seis países y cinco unidades: supermercados (Jumbo, Santa Isabel, Disco, The Fresh Market), mejoramiento del hogar (Easy), tiendas por departamento (Paris), centros comerciales y servicios financieros. El core es alimentos: los supermercados explican 70-75% de los ingresos, y por país Chile aporta 44%, Argentina 20% y Estados Unidos 12%. La rentabilidad, en cambio, está mucho más concentrada: Chile es el ancla del resultado y el negocio inmobiliario es desproporcionadamente rentable —los malls operan con márgenes EBITDA en torno a 80%— frente a supermercados (11-12%) y tiendas por departamento, de un dígito bajo. En 2025 los ingresos fueron ~CLP 16,6 billones con utilidad +70,4%, y leverage neto de ~3,5x tras comprar Makro Argentina y el resto de The Fresh Market. Lo estructural: exposición a Argentina (donde la contabilidad hiperinflacionaria distorsiona las cifras), traslación cambiaria que reduce contablemente el aporte externo cuando el peso chileno se fortalece, y una estructura de costos rígida que hace al margen muy sensible a pequeños cambios en las ventas comparables."}, {"ticker": "USD/CLP", "company": "Dólar / Peso chileno", "baseCurrency": "USD", "statsList": [["Precio", "915.70 (10-ago-2026)"], ["Rango 120 días", "850,90 - 980,88; reciente: 919 - 949 (jul-2026)"], ["TPM Chile / Fed", "4,50% BCCh (mantenida, minuta 05-ago) vs 3,50%-3,75% Fed (mantenida 29-jul, votación dividida 9-3)"], ["Cobre", "US$6,60/lb (Trading Economics, 04-ago-2026, +1,29% día)"], ["Posicionamiento", "Forwards no residentes: ~US$15.000M netos cortos en CLP (fin jul-2026, BCCh/SIID vía Diario Financiero) — máximo desde 4T2020"], ["Próximo evento", "Vencimiento Programa de Reservas BCCh, 07-ago-2026"], ["Técnico (auto)", "RSI 44.4 · MACD -1.47 / señal +1.83 (TradingView, 10-ago-2026)"]], "technical": {"price": 915.7, "change_1d_pct": 0.36, "change_1w_pct": 0.36, "rsi": 44.4, "macd": -1.4744, "macd_signal": 1.8279, "sma20": 927.872, "sma50": 916.8434, "sma200": 908.8983, "ema12": 921.1649, "ema26": 922.6393, "pct_vs_sma20": -1.31, "pct_vs_sma50": -0.12, "pct_vs_sma200": 0.75, "volume_today": 2561, "volume_avg20": 2852.0, "volume_ratio": 0.9, "volatility_30d": 10.41, "sharpe": -0.52, "sortino": -0.55, "max_drawdown_1y": -12.64, "price_percentile_1y": 51.4, "vs_benchmark_30d_pct": 0.14, "perf_1m_pct": -0.96, "perf_ytd_pct": 2.11}, "risk": {"volatility_30d": 10.41, "sharpe": -0.52, "sortino": -0.55, "max_drawdown_1y": -12.64, "n_days": 307, "window": 30}, "benchmark": {"ticker": "TVC:DXY", "label": "DXY", "relative_performance_30d": 0.14, "relative_performance_ytd": 0.52, "price_percentile_1y": 51.4, "partial": false}, "sourcesMeta": {"price": {"origin": "TradingView scanner", "fetched_at": "2026-08-10T19:26:32-04:00"}, "rsi_macd": {"origin": "TradingView scanner", "fetched_at": "2026-08-10T19:26:32-04:00"}, "smas_volume": {"origin": "TradingView scanner", "fetched_at": "2026-08-10T19:26:32-04:00"}, "benchmark": {"origin": "TradingView scanner", "symbol": "TVC:DXY", "fetched_at": "2026-08-10T19:26:32-04:00"}, "risk_metrics": {"origin": "data/history/FX-USDCLP.json", "n_days": 307}}, "metricChanges": [], "trend": {"piso": 1, "techo": 0, "max": 7, "senales_piso": ["base construyéndose sobre el mínimo anual"], "senales_techo": []}, "change": {"day": 0.36, "week": 0.36}, "reportDate": "4 de agosto de 2026", "events": [{"date": "2026-08-05", "label": "Publicación Minuta RPM del Banco Central de Chile", "kind": "macro", "time": "08:30", "info": "Detalle de argumentos tras mantener la TPM en 4,5%; clave para calibrar el balance de riesgos hacia la RPM de septiembre (BCCh, calendario oficial, consultado 04-ago-2026)."}, {"date": "2026-08-07", "label": "Vencimiento del Programa de Reposición y Ampliación de Reservas Internacionales del BCCh", "kind": "macro", "info": "Cierra la ventana de compras de hasta US$25M diarios vigente desde el 09-feb-2026 (periodo 09-feb al 07-ago-2026). HECHO: la revisión es semestral y el BCCh aún no confirma renovación ni monto; LECTURA: de renovarse con compras menores, reduciría algo de demanda estructural de USD (BCCh, documento del programa, consultado 04-ago-2026)."}, {"date": "2026-09-08", "label": "RPM del Banco Central de Chile (decisión de TPM)", "kind": "macro", "time": "18:00", "info": "Próxima Reunión de Política Monetaria; se perfila mantención en 4,5% (BCCh, calendario RPM 2026, consultado 04-ago-2026)."}, {"date": "2026-09-16", "label": "Reunión del FOMC (decisión de tasas)", "kind": "macro", "info": "Siguiente decisión de la Fed tras mantener el rango en 3,50%-3,75% el 29-jul-2026 con votación dividida 9-3 (tres presidentes regionales disidentes a favor de subir); mercado atento a señales de recorte hacia fin de año tras IPC de julio y agosto (Federal Reserve, comunicado 29-jul-2026; CNBC, consultado 04-ago-2026)."}], "customSections": [{"title": "Resumen ejecutivo", "nav": "Resumen", "body": "HECHO: USD/CLP cierra en 927,31 el 03-ago-2026 (TradingView/Vantage), +0,56% diario pero -1,83% semanal. Cotiza sobre SMA50 (+1,4%) y SMA200 (+1,9%), levemente bajo SMA20 (-0,4%); RSI neutro en 50,6 y percentil de precio 60,1% del último año — zona media, sin extremos. LECTURA: el par se mueve entre un diferencial de tasas favorable al carry en CLP (TPM 4,5% vs Fed 3,50-3,75%) y un cobre fuerte (US$6,60/lb, +1,29% en el día) que presiona a la baja al dólar, contrarrestado por un posicionamiento extranjero muy cargado en corto contra el peso (~US$15.000M) que limita el potencial de apreciación adicional del CLP en el corto plazo."}, {"title": "Diferencial de tasas y política monetaria", "nav": "Tasas", "body": "HECHO: BCCh mantuvo la TPM en 4,5% en su última RPM; la minuta se publica el 05-ago-2026 y la próxima RPM es el 08-sep-2026 (BCCh, consultado 04-ago-2026). La Fed mantuvo su rango en 3,50%-3,75% el 29-jul-2026, con votación dividida 9-3 (tres presidentes regionales —Hammack, Kashkari, Logan— disintieron a favor de subir tasas), y la próxima reunión FOMC es el 15-16 sep-2026 (Federal Reserve, CNBC, 29-jul-2026). LECTURA: el diferencial nominal (~100pb a favor de Chile) sostiene algo de carry en CLP, pero el tono hawkish de la disidencia Fed reduce la probabilidad de recortes rápidos en EEUU, limitando la debilidad del dólar global."}, {"title": "Balanza de pagos y flujos", "nav": "Balanza", "body": "HECHO: el cobre —principal ítem de exportación chilena— cotiza en US$6,60/lb (Trading Economics, 04-ago-2026, +1,29% en el día), tras subir desde US$5,99/lb el 31-jul-2026 en medio de ajustes de oferta y demanda de centros de datos IA. LECTURA: un cobre sobre US$6,5/lb sostiene términos de intercambio favorables para Chile y presiona estructuralmente a la apreciación del CLP, aunque la desaceleración manufacturera china (mínimo de 4 meses en julio) es un riesgo bajista para la demanda física. No se dispone de cifra verificable de balanza comercial de julio-2026 al momento de este informe; se declara no verificable."}, {"title": "Posicionamiento", "nav": "Posicionamiento", "body": "No aplica COT tradicional para este par (sin futuros regulados equivalentes con reporte CFTC). Proxy: forwards de no residentes del BCCh muestran una posición neta corta en CLP (larga en USD) de ~US$15.000M a fines de julio-2026, tras escalar +US$4.500M en la semana, el nivel más alto desde el 4T-2020 (Diario Financiero, BCCh/SIID, consultado 04-ago-2026). Concentrada en plazos de 96 a 370 días. LECTURA: un posicionamiento tan cargado en contra del peso es una señal de reversión potencial — extremos de este tipo históricamente preceden correcciones cuando el catalizador (diferencial de tasas o cobre) se revierte."}, {"title": "Análisis técnico", "nav": "Técnico", "body": "RSI en 50,6 (zona neutra, sin sobrecompra ni sobreventa). MACD (4,84) por debajo de su señal (6,72), indicando pérdida de momentum alcista de corto plazo. Precio 0,4% bajo SMA20 pero 1,4% y 1,9% sobre SMA50 y SMA200 respectivamente — estructura de mediano plazo aún alcista para el dólar. Volumen 25% bajo el promedio de 20 días, señal de baja convicción reciente. Percentil de precio del último año en 60,1%, zona media-alta sin extremos. Volatilidad 30d de 9,46%, Sharpe 0,53 y drawdown máximo 1 año de -12,64%."}, {"title": "Intervención y riesgo de banco central", "nav": "Intervención", "body": "El Programa de Reposición y Ampliación de Reservas Internacionales del BCCh (compras de hasta US$25M diarios, vigente desde 09-feb-2026) vence el 07-ago-2026; su revisión es semestral y a la fecha de este informe no hay confirmación oficial de renovación ni de su monto (BCCh, consultado 04-ago-2026). El BCCh ha insistido en que este programa NO constituye intervención cambiaria discrecional, sino reposición estructural de reservas. LECTURA: de no renovarse o reducirse el monto diario, se retira un comprador estructural de USD, sesgo levemente bajista para el par; la sensibilidad histórica estimada por bancos es acotada (~$10 sobre el tipo de cambio)."}, {"title": "Correlaciones macro", "nav": "Correlaciones", "body": "El benchmark DXY se ubica en ~99,97 (04-ago-2026), cerca de mínimos de 7 semanas, con el USD/CLP mostrando un desempeño relativo de +1,0% a 30 días y +1,8% en lo que va del año respecto al índice dólar — el peso se ha comportado algo más débil que lo que sugeriría solo el DXY, coherente con el fuerte posicionamiento corto en CLP. La correlación con el cobre sigue siendo negativa (cobre sube, CLP tiende a apreciarse), aunque en las últimas semanas esa relación se ha visto parcialmente neutralizada por el posicionamiento de forwards no residentes."}, {"title": "Conclusión", "nav": "Conclusión", "body": "El USD/CLP opera en un rango técnico neutro (927-931), sostenido por un diferencial de tasas moderado a favor de Chile pero contrarrestado por un cobre fuerte (US$6,60/lb) y un posicionamiento extranjero extremo en corto CLP que actúa como resorte de reversión. El evento más relevante de la semana es el vencimiento del programa de reservas BCCh el 07-ago, cuya renovación (o no) definirá el sesgo de flujo estructural de corto plazo. Sesgo neutral-lateral en el rango 920-940 hasta la minuta RPM (05-ago) y definición del programa de reservas (07-ago)."}], "scoreIndex": 8, "customCats": [{"key": "tasas", "name": "Diferencial de Tasas y Política Monetaria", "weight": 30}, {"key": "macro", "name": "Fundamentales Macro", "weight": 20}, {"key": "tecnico", "name": "Técnico", "weight": 20}, {"key": "posicionamiento", "name": "Posicionamiento y Sentimiento", "weight": 15}, {"key": "intervencion", "name": "Riesgo de Intervención / Cola", "weight": 15}], "scores": {"tasas": {"score": 58, "just": "Diferencial nominal ~100pb favorece carry en CLP, pero disidencia hawkish en la Fed (9-3) reduce probabilidad de recortes rápidos en EEUU, sosteniendo algo el USD."}, "macro": {"score": 35, "just": "Cobre en US$6,60/lb y términos de intercambio favorables para Chile son negativos para USD en este par; desaceleración manufacturera china es el principal riesgo al alza para el dólar."}, "tecnico": {"score": 55, "just": "RSI neutro (50,6), MACD perdiendo momentum bajo su señal, precio sobre SMA50/SMA200 pero bajo SMA20 — estructura mixta sin sesgo claro de corto plazo."}, "posicionamiento": {"score": 62, "just": "Posicionamiento no-residente muy cargado en corto CLP (~US$15.000M, máximo desde 2020) es contrarian: favorece al USD en el margen pero eleva riesgo de reversión violenta si se revierte."}, "intervencion": {"score": 48, "just": "Programa de reservas BCCh vence 07-ago sin confirmación de renovación; par en rango medio (percentil 60%) sin cercanía a niveles históricos de intervención discrecional del BCCh."}}, "sources": ["Banco Central de Chile, calendario RPM 2026, https://www.bcentral.cl - consultado 04/08/2026", "Diario Estrategia, 'B. Central mantiene la TPM en 4,5%', https://www.diarioestrategia.cl - 2026", "Federal Reserve, comunicado FOMC, https://www.federalreserve.gov/newsevents/pressreleases/monetary20260729a.htm - 29/07/2026", "CNBC, 'Fed meeting recap: July 2026', https://www.cnbc.com/2026/07/29/fed-meeting-today-live-updates.html - 29/07/2026", "Trading Economics, precio del cobre, https://tradingeconomics.com/commodity/copper - 04/08/2026", "Diario Financiero, 'Extranjeros apuestan US$15.000 millones contra el peso chileno', https://www.df.cl/mercados/bolsa-monedas - jul-2026", "Banco Central de Chile, Programa de Reposición y Ampliación de Reservas Internacionales, https://www.bcentral.cl/documents/d/banco-central/programa-de-acumulacion-de-reservas-internacionales-periodo-entre-el-9-de-febrero-y-el-7-de-agosto-de-2026-pdf - consultado 04/08/2026", "Trading Economics, US Dollar Index (DXY), https://tradingeconomics.com/dxy:cur - 04/08/2026", "Wise, historial USD/CLP, https://wise.com/us/currency-converter/clp-to-usd-rate/history - consultado 04/08/2026"], "opportunity": {"cats": {"valuacion_hist": {"score": 60, "just": "Percentil de precio 60,1% del último año; ni barato ni caro en términos históricos de USD/CLP, rango 850-981 en 120 días muestra amplitud considerable."}, "calidad": {"score": 55, "just": "Régimen macro USD mixto: Fed en pausa hawkish (9-3 dividida) sostiene el dólar globalmente, pero DXY cerca de mínimos de 7 semanas (~99,97) sugiere debilidad relativa incipiente."}, "asimetria": {"score": 60, "just": "Posicionamiento extremo corto en CLP (US$15.000M) genera asimetría: si se revierte, el CLP podría apreciarse rápido (USD/CLP baja); si persiste, el USD tiene poco upside adicional."}, "catalizadores": {"score": 55, "just": "Minuta RPM (05-ago) y definición del programa de reservas BCCh (07-ago) son catalizadores de corto plazo; FOMC de septiembre define el rumbo de mediano plazo del USD global."}, "contrarian": {"score": 65, "just": "El consenso está muy cargado en contra del peso (forwards no residentes en máximos desde 2020); posición contraria (largo CLP / corto USD) tiene mejor payoff asimétrico si el cobre se mantiene fuerte."}}, "plan": {"recomendacion": "Esperar gatillo", "zona_compra": "Acumular exposición larga USD/CLP solo sobre 940-945 (rompimiento de SMA20/techo reciente) o esperar confirmación de fin/reducción del programa de reservas BCCh.", "invalidacion": "Cierre bajo 915 (SMA50) con cobre sosteniéndose sobre US$6,50/lb invalidaría sesgo alcista del par.", "gatillos": ["Confirmación de no renovación (o renovación reducida) del programa de reservas BCCh el 07-ago-2026", "Minuta RPM del 05-ago con tono más dovish/hawkish de lo esperado", "Corrección abrupta del cobre bajo US$6,20/lb", "Señales de recorte de tasas Fed en la reunión de septiembre"], "horizonte": "6-18 meses", "tamano": "Posición táctica acotada (2-4% del libro FX) dado el posicionamiento extremo y la proximidad de eventos binarios (RPM, programa reservas).", "confianza": "media"}}, "perfil": "El par expresa cuántos pesos chilenos se entregan por un dólar: comprarlo es comprar dólares y vender pesos, así que un alza es depreciación del CLP. Su nivel responde a tres fuerzas: el diferencial entre la TPM del Banco Central de Chile y la tasa de la Fed, los términos de intercambio y el ciclo global del dólar. El canal dominante es el cobre: representa cerca de la mitad de las exportaciones chilenas y Chile aporta un cuarto de la producción mundial, por lo que la correlación del par con el metal es negativa y habitualmente entre -0,6 y -0,8 — el peso opera como proxy líquido del cobre y del ciclo chino. Los actores que mueven el mercado son el BCCh (flotación libre desde 1999, pero con intervenciones explícitas de USD 20.000 y 25.000 millones en 2019 y 2022), las AFP con sus cambios de cobertura cambiaria, los exportadores mineros y la banca offshore vía NDF. Qué considerar siempre: es de las monedas emergentes más volátiles (10-15% anualizado), el riesgo de intervención es real y asimétrico —suele gatillarse por volatilidad excesiva, no por un nivel—, y la liquidez local se concentra entre las 9:00 y 13:30 de Chile."}, {"ticker": "EUR/USD", "company": "Euro / Dólar", "baseCurrency": "EUR", "statsList": [["Precio", "1.15426 (10-ago-2026)"], ["Rango 80 días", "1.133 – 1.182"], ["Tasas BCE / Fed", "2,25% / 3,50–3,75%"], ["COT EUR (14-jul)", "-12,605 netos (corto)"], ["DXY", "100.76 (17-jul-2026)"], ["Próximo evento", "BCE 23-jul · FOMC 28-29-jul"], ["Técnico (auto)", "RSI 60.1 · MACD +0.00 / señal +0.00 (TradingView, 10-ago-2026)"]], "change": {"day": 0.0, "week": -0.1}, "customSections": [{"title": "Resumen ejecutivo", "nav": "Resumen", "body": "EUR/USD cerró la semana en **1.14382**, dentro de un rango contenido tras una caída de ~4% desde los máximos de abril (~1.182) y un rebote desde los mínimos de junio (~1.133). El cuadro es de **equilibrio inestable con sesgo de cautela**:\n\n- **HECHO:** El diferencial de tasas sigue siendo claramente favorable al USD (Fed Funds 3.50–3.75% vs. tasa de depósito BCE 2.25%), aunque el BCE **subió** 25 pb en junio mientras la Fed está en pausa — el diferencial se está cerrando en el margen a favor del EUR.\n- **HECHO:** La semana entrante es de alto riesgo de evento: **reunión del BCE el jueves 23-jul** (mercado descuenta ~95% de mantención) y **FOMC el 28-29-jul** (~87–89% de mantención).\n- **HECHO:** Los especuladores están **netos cortos en EUR** (-12,605 contratos, COT al 14-jul-2026), aunque recortando cortos.\n- **LECTURA:** Los riesgos de cola (guerra en Medio Oriente y shock energético asimétrico contra Europa, reapertura de la disputa arancelaria EEUU-UE, crisis política/energética en Francia) recaen desproporcionadamente sobre el EUR.\n\n**Señal resultante: Caution (Grado C — 46/100).** Sin ventaja clara para comprar EUR; el par sigue siendo un rango 1.133–1.155 dominado por bancos centrales y geopolítica.\n\n---"}, {"title": "Diferencial de tasas y política monetaria", "nav": "Tasas", "body": "**BCE (HECHO):**\n- Tasa de depósito vigente: **2.25%**, tras una **subida de 25 pb decidida en la reunión de junio (17-jun-2026)** en respuesta a la presión inflacionaria derivada del shock energético (ECB / Trading Economics, jul-2026).\n- Próxima reunión: **jueves 23-jul-2026** (decisión 13:45 CET, conferencia de Lagarde 14:30 CET) — es decir, **sí hay reunión la semana del 20-jul**. Es reunión sin proyecciones de staff.\n- Expectativas de mercado: **~95.3% de mantención en 2.25%**, con una cola alcista de ~3.4% para +25 pb (rateprobability.com / ecb-watch, consultado 19-jul-2026).\n- Tono de Lagarde: **hawkish**. El 2-jul defendió la subida de junio citando proyecciones de inflación en torno al 3% para 2026 y la necesidad de mantenerse vigilante (ECB Forum Sintra, jul-2026).\n\n**Fed (HECHO):**\n- Rango objetivo vigente: **3.50%–3.75%**; en junio el FOMC mantuvo y señaló que la inflación sigue elevada respecto de la meta del 2% (core PCE ~2.9%).\n- FOMC 28-29-jul-2026: **~89% de probabilidad de mantención** según CME FedWatch (~86.7% según fuentes alternativas al 18-jul-2026). Consenso: tasas sin cambios al menos hasta el otoño boreal, condicionado a progreso en inflación.\n- Tono del presidente de la Fed, Kevin Warsh (Sintra, 1-jul-2026): sin señales para julio, pero \"los precios están demasiado altos\" — sesgo restrictivo.\n\n**Divergencia (LECTURA):** El **nivel** del diferencial (~125–150 pb en tasas de política; 2 años: UST 4.16% vs. Schatz ~2.6–2.8%) favorece al USD y sostiene el carry en contra del EUR. Pero la **dirección** favorece marginalmente al EUR: el BCE está subiendo (y conserva cola hawkish) mientras la Fed está estática. Riesgo señalado por estrategas: que el mercado retire el tightening del BCE antes que el de la Fed, limitando el alza del EUR (VT Markets, jul-2026).\n\n---"}, {"title": "Balanza de pagos y flujos", "nav": "Balanza", "body": "**Cuenta corriente (HECHO):**\n- Superávit de la eurozona de **€25 mil millones en mayo-2026** (+€8 mm m/m): bienes +€16 mm, servicios +€14 mm, renta primaria +€12 mm, renta secundaria -€18 mm (BCE, 17-jul-2026).\n- Acumulado 12 meses a mayo-2026: **€272 mm (1.7% del PIB)**, frente a €318 mm (2.0% del PIB) un año antes — **superávit en contracción**, principalmente por menor superávit de bienes (de €350 mm a €286 mm) (BCE, 17-jul-2026).\n- Proyección del staff del Eurosistema (jun-2026): caída adicional a **~1.3% del PIB en 2026** por mayores precios de importación de energía a raíz de la guerra en Medio Oriente (ECB Economic Bulletin, 2026).\n\n**Flujos de portafolio 2026 (HECHO/LECTURA):**\n- HECHO: La rotación hacia Europa de comienzos de año **se revirtió a mitad de 2026**: la porción de flujos de ETFs de renta variable de EEUU hacia fondos centrados en EEUU subió todos los meses del año, alcanzando ~85% en junio (iShares H1-2026). En Europa, los flujos hacia productos centrados en EEUU se **cuadruplicaron** interanual (Morningstar, 2026). En money markets, USD fue la clasificación más comprada (+€15.98 mm) mientras los fondos EUR registraron salidas (-€5.06 mm) (Lipper/LSEG, may-2026).\n- LECTURA: El colchón estructural de cuenta corriente sigue siendo un soporte de fondo para el EUR, pero se erosiona por energía, y los flujos de portafolio han vuelto a favorecer activos en USD por el atractivo relativo de las tasas americanas. Neto: **levemente negativo para el EUR**.\n\n---"}, {"title": "Posicionamiento", "nav": "Posicionamiento", "body": "**HECHO — CFTC COT, Euro FX (CME), datos al martes 14-jul-2026, publicado 17-jul-2026 (Tradingster/CFTC):**\n- No comerciales (especuladores): largos 230,307 / cortos 242,912 → **neto -12,605 contratos (corto)**.\n- Variación semanal: +6,877 largos, +3,255 cortos → **neto +3,622 hacia largo** (los cortos se están recortando).\n- Interés abierto: 799,495 contratos — mercado profundo y líquido.\n- Tendencia de meses: el neto largo de ~+21,000 contratos de marzo-2026 (percentil 15 del rango de 52 semanas, mínimo de 1 año) se ha degradado hasta territorio **neto corto** (AhaSignals/Investing.com, 2026).\n\n**LECTURA:** Posicionamiento levemente bajista en EUR pero **cercano a plano y mejorando** — no hay extremo de posicionamiento que genere señal contraria potente en ninguna dirección. Un BCE hawkish el 23-jul podría forzar cobertura de cortos (riesgo alcista táctico); la señal estructural es neutral-negativa.\n\n---"}, {"title": "Análisis técnico", "nav": "Técnico", "body": "**HECHO — TradingView (17-jul-2026):**\n- Precio: **1.14382**.\n- RSI(14) diario: **47.2** — neutral.\n- MACD(12,26): **-0.0025** vs. señal **-0.0036**; histograma **+0.0011** — momentum bajista moderándose.\n- Medias: precio **sobre SMA20 (1.1414)** pero **bajo SMA50 (1.1530)**.\n- Ventana 80 días: caída desde máximos ~**1.182** (abril) hasta mínimos ~**1.133** (junio); rebote reciente a ~1.148 y cierre 1.1438.\n\n**LECTURA:**\n- La estructura de mediano plazo sigue siendo **correctiva/bajista** (máximos y mínimos decrecientes desde abril; precio bajo SMA50), pero el rebote desde 1.133 con histograma MACD al alza y recuperación de la SMA20 sugiere que la caída **perdió fuerza**.\n- Soportes: 1.1414 (SMA20), luego 1.133 (mínimo de junio — pivote clave). Resistencias: 1.148 (techo del rebote), 1.1530 (SMA50), luego zona 1.16.\n- Un cierre diario sobre la SMA50 (~1.153) convertiría el rebote en cambio de tendencia; la pérdida de 1.133 reactivaría el tramo bajista hacia 1.12. Con RSI en 47 y precio entre medias, el veredicto técnico es **neutral** (par ni alcista ni bajista con convicción).\n\n---"}, {"title": "Intervención y riesgo de banco central", "nav": "Intervención", "body": "**HECHO/LECTURA:** El riesgo de intervención cambiaria **directa** en EUR/USD es históricamente bajo (última intervención coordinada relevante: 2000/2011); ni el BCE ni el Tesoro de EEUU han señalado nada en 2026 a los niveles actuales. El riesgo relevante es **de cola**:\n\n1. **Energía / Medio Oriente (HECHO):** Tras los ataques de Israel-EEUU contra Irán (28-feb-2026) y la disrupción del Estrecho de Ormuz (~1/5 del suministro global de GNL afectado), el gas europeo opera en ~€46/MWh; los escenarios de crisis prolongada de la Comisión Europea/JRC contemplan petróleo hasta ~USD 180/bbl y gas ~€80/MWh en 4T-2026 (JRC, may-2026; Bloomberg, 9-jul-2026). **LECTURA:** shock asimétricamente negativo para el EUR (Europa importadora neta; EEUU exportador de energía).\n2. **Aranceles EEUU-UE (HECHO):** El acuerdo provisional del 20-may-2026 (arancel máximo ~15% a productos UE) coexiste con amenazas de Trump de tarifas \"mucho más altas\" si no se ratifica, reabriendo la guerra comercial (ING, Euronews, 2026). **LECTURA:** riesgo bajista para crecimiento europeo y EUR.\n3. **Política europea (HECHO):** Crisis política y presupuestaria en Francia, con hoja de ruta energética bloqueada y reactores nucleares parados por olas de calor (Energynews/MNI, 2026). **LECTURA:** prima de riesgo político latente en activos EUR.\n\n**Balance:** riesgo de intervención bajo, pero **riesgo de cola elevado y sesgado en contra del EUR**.\n\n---"}, {"title": "Correlaciones macro", "nav": "Correlaciones", "body": "- **DXY (HECHO):** 100.76 al 17-jul-2026, prácticamente plano en la sesión (Trading Economics/FXStreet). Con EUR ~58% del índice, la correlación inversa DXY–EUR/USD **se mantiene plenamente operativa**: el estancamiento del DXY sobre 100 es el espejo del rango 1.13–1.15 del par.\n- **Diferencial de bonos (HECHO):** UST 10a **4.55%** vs. Bund 10a **3.14%** → spread ~**141 pb** a favor de EEUU (17-jul-2026). En 2 años: UST **4.16%** (16-jul) vs. Schatz **~2.6–2.8%** (máximo desde jul-2024) → ~140–155 pb.\n- **LECTURA:** El spread 10a se ha comprimido desde niveles de 2024–25 (>180 pb) por la subida de los Bunds (BCE hawkish + fiscal alemán), coherente con un EUR/USD que dejó de caer. La correlación negativa entre spread UST–Bund y EUR/USD **se mantiene**; para que el par supere 1.155 de forma sostenida se requeriría compresión adicional del diferencial (BCE subiendo o Fed girando dovish), que hoy no está descontada para julio.\n\n---"}, {"title": "Conclusión", "nav": "Conclusión", "body": "EUR/USD en 1.14382 es un par **en rango, sin ventaja direccional clara**: el carry y los riesgos de cola favorecen al USD; la dirección de la política monetaria (BCE subiendo, Fed en pausa) y un posicionamiento corto en corrección dan soporte táctico al EUR. La semana del 20-jul (BCE 23-jul) y el FOMC del 28-29-jul definirán el próximo tramo.\n\n**Qué validaría una tesis alcista en EUR (Buy EUR):** sorpresa hawkish del BCE el 23-jul y/o giro dovish de la Fed el 29-jul; cierre diario sobre la SMA50 (~1.1530) con compresión del spread UST–Bund bajo ~130 pb; distensión en Medio Oriente (gas < €40/MWh) y ratificación limpia del acuerdo arancelario; COT cruzando a neto largo.\n\n**Qué la invalidaría (riesgo bajista):** pérdida del mínimo de junio (1.  entre la Fed y el BCE —el spread de bonos a 2 años entre EE.UU. y Alemania es el determinante de más alta frecuencia— y del diferencial de tasas reales largas. El segundo pilar es la balanza externa: la eurozona sostiene un superávit de cuenta corriente estructural que genera demanda de euros, pero sistemáticamente compensada por la salida de capital europeo hacia activos estadounidenses, de modo que el par lo define la cuenta financiera más que la comercial. Pesan también el estatus de reserva (el dólar concentra ~58% de las reservas globales y el euro ~20%) y las decisiones de cobertura de fondos de pensiones y aseguradoras europeas. Qué considerar siempre: volatilidad baja para estándares FX (6-9%), con los movimientos concentrados en fechas de política monetaria e inflación; el riesgo de intervención directa es marginal (la última coordinada fue en 2000) y la liquidez máxima está en la superposición Londres-Nueva York."}, {"ticker": "USD/JPY", "company": "Dólar / Yen japonés", "baseCurrency": "USD", "statsList": [["Precio", "159.273 (10-ago-2026)"], ["Rango 80 días", "¥156.11 (mínimo, 3-ago-2026) a ¥163.99 (máximo pre-intervención, 28-jul-2026)"], ["Tasas Fed / BoJ", "Fed 3.50%-3.75% (hold, voto 9-3, 29-jul-2026, bajo el nuevo chair Kevin Warsh) / BoJ 1.00% (hold, voto 8-1, 31-jul-2026, tono hawkish)"], ["COT JPY (fecha de corte)", "Neto especulativo -163.4K contratos (semana cerrada 28-jul-2026, dato pre-squeeze; reporte publicado 31-jul-2026, CFTC)"], ["Riesgo intervención", "Muy alto — intervención coordinada MoF-Tesoro EE.UU. (primera desde 1998) el 31-jul y 1-ago-2026; jawboning activo de Katayama y Bessent (2-3-ago-2026); nuevo umbral ~155-160"], ["Próximo evento", "IPC Japón (jul-2026) — 21-ago-2026"], ["Técnico (auto)", "RSI 42.9 · MACD -0.93 / señal -0.62 (TradingView, 10-ago-2026)"]], "technical": {"price": 159.273, "change_1d_pct": -0.02, "change_1w_pct": 0.96, "rsi": 42.9, "macd": -0.9264, "macd_signal": -0.6193, "sma20": 160.934, "sma50": 161.1462, orial MoF — oct-2022 ¥6.35T (~$42.8B); abr-may-2026 ¥11.7T (~$72.5B) acumulado; 31-jul-2026 ¥8.45T (~$52.8B), posible récord diario histórico; 1-ago-2026 ¥5.33T adicionales. Umbral no oficial evolucionó de ~145-152 (2022) a ~155-160 (2024) a ~155 como nuevo nivel de soporte/prueba (2026, Bloomberg 4-ago). LECTURA: con jawboning activo de Katayama/Bessent, cualquier repunte hacia ¥160-162 probablemente gatille nueva intervención, limitando estructuralmente el upside del USD/JPY en el horizonte de meses."}, {"title": "Correlaciones macro", "nav": "Correlaciones", "body": "HECHO: vs_benchmark_30d -1.55% (USD/JPY underperform vs DXY), DXY en mínimo de 7 semanas (~99.8). Spread UST10Y-JGB10Y ~186pb. LECTURA: el par se mueve en tándem con debilidad amplia del dólar (no solo yen fuerte) y con el estrechamiento del diferencial de bonos; ambas correlaciones apuntan en la misma dirección bajista para USD/JPY, reforzándose mutuamente en el corto plazo."}, {"title": "Conclusión", "nav": "Conclusión", "body": "El USD/JPY quedó estructuralmente dañado tras la intervención coordinada más agresiva desde 1998, con jawboning activo que limita rebotes sobre ¥160-162. El RSI de sobreventa (22.7) y el positioning corto extremo (-163.4K) sugieren rebote técnico probable de corto plazo, pero el diferencial de tasas comprimiéndose (BoJ hawkish, posible alza sep/oct) y el riesgo de nueva intervención capan el upside de mediano plazo. Vigilar IPC Japón (21-ago) y COT (7-ago) como catalizadores inmediatos."}], "scoreIndex": 8, "customCats": [{"key": "tasas", "name": "Diferencial de Tasas y Política Monetaria", "weight": 30}, {"key": "macro", "name": "Fundamentales Macro", "weight": 20}, {"key": "tecnico", "name": "Técnico", "weight": 20}, {"key": "posicionamiento", "name": "Posicionamiento y Sentimiento", "weight": 15}, {"key": "intervencion", "name": "Riesgo de Intervención / Cola", "weight": 15}], "scores": {"tasas": {"score": 48, "just": "Diferencial ~250-275pb aún favorece USD, pero BoJ hawkish (voto 8-1, posible alza sep/oct) comprime el spread mientras Fed está en pausa prolongada bajo Warsh; sesgo direccional se debilita para USD."}, "macro": {"score": 45, "just": "Fed dividida internamente (3 disidentes pro-alza) por inflación persistente en EE.UU.; Japón con inflación acercándose/superando el 2% según Ueda. Fundamentales mixtos, sin ventaja clara para USD."}, "tecnico": {"score": 35, "just": "RSI 22.7 en sobreventa extrema, MACD negativo bajo señal, precio bajo SMA20/50 aunque casi en línea con SMA200. Momentum de corto plazo muy negativo para USD/JPY pese a probable rebote técnico."}, "posicionamiento": {"score": 40, "just": "Cortos en yen en extremo histórico (-163.4K, dato pre-squeeze) ya se estarían cubriendo forzosamente; en contrario, esto es bajista adicional para USD/JPY en el margen antes de estabilizarse."}, "intervencion": {"score": 15, "just": "Intervención coordinada MoF-Tesoro EE.UU. sin precedentes desde 1998, jawboning activo de Katayama y Bessent, nuevo umbral ~155-160; upside adicional del USD muy limitado por riesgo de nueva intervención."}}, "sources": ["Bloomberg, 31/07/2026 - Japan's BOJ Data Suggests Record ¥8.45 Trillion Intervention", "Bloomberg, 03/08/2026 - After Historic Intervention, 155 Emerges as Yen's Next Big Test", "CNBC, 31/07/2026 - Bank of Japan holds rates at 1%, hawkish tone on inflation outlook", "CNBC, 29/07/2026 - Fed holds rates 9-3, Warsh faces first major dissent as Chair", "CNBC, 02/08/2026 - Katayama and Bessent say won't hesitate on further joint intervention", "Federal Reserve (federalreserve.gov), 29/07/2026 - FOMC statement and press conference (Chair Kevin Warsh)", "Ministerio de Finanzas de Japón (mof.go.jp), 2026 - Confirmación de intervención cambiaria coordinada", "CFTC Commitments of Traders, 31/07/2026 - JPY futures, corte 28-jul-2026, neto especulativo -163.4K contratos", "TradingEconomics, 03-04/08/2026 - US 10Y Treasury yield (~4.70%), Japan 10Y JGB yield (~2.84%), DXY (~99.8)", "TradingView scanner, 03/08/2026 - Precio, RSI, MACD, SMAs, volumen USD/JPY", "Statistics Bureau of Japan / TradingEconomics - calendario IPC nacional, próxima publicación 21-ago-2026", "KED Global / AP, 30-31/07/2026 - Corea del Sur participa en venta coordinada de dólares junto a Japón"], "opportunity": {"cats": {"valuacion_hist": {"score": 55, "just": "Precio en percentil 61.4% de su rango 1Y, ni barato ni caro; la intervención resetea el rango pero no deja al par en extremos históricos de valuación."}, "calidad": {"score": 60, "just": "USD respaldado por economía resiliente y Fed con sesgo dividido hacia el alza; contrapesado por riesgo político (jawboning) que introduce ruido no-fundamental al par."}, "asimetria": {"score": 30, "just": "Asimetría desfavorable para USD: el techo está limitado por riesgo de intervención (~160-162), mientras el piso es más abierto si BoJ sube tasas en sep/oct; riesgo/retorno sesgado a la baja del par."}, "catalizadores": {"score": 45, "just": "COT 7-ago, IPC Japón 21-ago y reuniones FOMC/BoJ en sep-2026 son catalizadores claros pero de resultado incierto; el hawkish tilt del BoJ es el más relevante y apunta contra el USD."}, "contrarian": {"score": 50, "just": "El positioning corto extremo en yen ya se está corrigiendo vía squeeze; jugar largo USD/JPY ahora sería ir con el consenso post-shock, no contra él, restando atractivo contrarian."}}, "plan": {"recomendacion": "Mantener / Observar", "zona_compra": "USD/JPY 152-155 (zona de mayor probabilidad de defensa activa vía intervención, mejor relación riesgo/retorno para posiciones largas de USD)", "invalidacion": "Ruptura sostenida bajo ¥150 con nueva intervención fallida o quiebre claro de SMA200 (157.93) al alza sin reversión", "gatillos": ["Resultado del COT del 7-ago-2026 (velocidad de cobertura de cortos)", "IPC Japón 21-ago-2026 (confirma o modera expectativa de alza del BoJ)", "Reuniones FOMC y BoJ de sep-2026 (definen si el diferencial se comprime)"], "horizonte": "6-18 meses", "tamano": "Posición reducida y escalonada, dado el riesgo binario de intervención adicional del MoF", "confianza": "media"}}, "perfil": "El par indica cuántos yenes se entregan por un dólar: comprarlo es comprar dólares financiándose en yenes, y por eso es el más ligado al carry trade global. Su determinante estructural es el diferencial de tasas —su correlación con el spread entre el Treasury y el JGB a 10 años es muy alta— porque el yen ha operado por décadas como la moneda de financiamiento por excelencia; cualquier convergencia de ese diferencial, por normalización del BoJ o recortes de la Fed, aprecia el yen de forma no lineal. El segundo pilar es que Japón es el mayor acreedor neto del mundo: eso genera salida permanente de capital hacia activos extranjeros y repatriación abrupta en episodios de aversión al riesgo, la raíz de su comportamiento de refugio. Los actores clave son el BoJ (tasas) y sobre todo el Ministerio de Finanzas, que decide las intervenciones: hubo operaciones por ~¥9 billones en 2022 y ~¥15 billones en 2024. Qué considerar siempre: volatilidad de 8-12% pero con colas gruesas, porque el desarme de carry es reflexivo y puede apreciar el yen varios puntos en horas; la intervención se activa por velocidad más que por nivel, precedida de una escalada verbal reconocible del MoF."}]</script>
<script>
  "use strict";

  const _byTicker = {};
  _staticData.forEach((s) => (_byTicker[s.ticker] = s));
  _dynData.forEach((s) => (_byTicker[s.ticker] = s));
  const STOCKS = ORDER.filter((t) => _byTicker[t]).map((t) => _byTicker[t])
    .concat(Object.values(_byTicker).filter((s) => !ORDER.includes(s.ticker)));
  const REPORT_DATE = "18 de julio de 2026"; // fallback para activos sin reportDate propio
  const reportDateOf = (s) => s.reportDate || REPORT_DATE;
  const DEFAULT_WEIGHTS = { tecnica: 25, fundamental: 25, sentimiento: 20, riesgo: 15, conviccion: 15 };
  const CATS = [
    { key: "tecnica", name: "Fortaleza Técnica" },

  const OPP_CATS = [

  function compositeOpp(stock) {
    const o = stock.opportunity;
    if (!o || !o.cats) return null;
    let sum = 0, w = 0;
    OPP_CATS.forEach((c) => {
      const v = o.cats[c.key] && o.cats[c.key].score;
      if (v != null) { sum += v * c.weight; w += c.weight; }
    });
    return w ? Math.round(sum / w) : null;
  }
  function oppSignalFor(score) {
    return OPP_SIGNALS.find((s) => score >= s.min) || OPP_SIGNALS[OPP_SIGNALS.length - 1];
  }

  const SECTIONS = [
    { num: 1, key: "resumen", title: "Resumen ejecutivo", nav: "Resumen" },
    { num: 2, key: "fundamental", title: "Análisis fundamental", nav: "Fundamental" },
    { num: 3, key: "valuacion", title: "Valuación", nav: "Valuación" },
    { num: 4, key: "tecnico", title: "Análisis técnico", nav: "Técnico" },
    { num: 5, key: "catalizadores", title: "Catalizadores y riesgos", nav: "Catalizadores" },
    { num: 6, key: "sentimiento", title: "Sentimiento", nav: "Sentimiento" },

  ];
  const STAT_LABELS = {
    precio: "Precio",
    rango52s: "Rango 52 sem.",
    marketCap: "Market cap",
    pe: "P/E",
    targetConsenso: "Target consenso",
    proximoEarnings: "Próx. earnings",
  };
  const DISCLAIMER =
    "Este informe es una herramienta de investigación educativa generada con IA. No constituye " +
    "asesoría de inversión ni recomendación de compra/venta. Verifique todos los datos de forma " +
    "independiente antes de tomar decisiones financieras.";

  const DATA_DATE = "10-ago-2026";
  const MODES = {
    equity: {
      title: "Stock Research — Dashboard de Equity Research",
      brand: "Stock Research",
      meta: "Equity research + score compuesto · investigado vía web search el " + DATA_DATE,
      note:
        "El score 0–100 pondera 5 categorías (técnica 25% · fundamental 25% · sentimiento 20% · " +
        "riesgo 15% · convicción 15%). Es una lectura cuantitativa, no una recomendación. " +
        "Los pesos son ajustables en la sección de score.",
      filter: (s) => !s.ticker.includes("/"),
    },
    fx: {
      title: "Stock Research — Dashboard FX Research",
      brand: "FX Research",
      meta: "Research de divisas + score compuesto FX · investigado vía web search el " + DATA_DATE,
      note:
        "El score FX 0–100 pondera 5 categorías (tasas 30% · macro 20% · técnico 20% · " +
        "posicionamiento 15% · riesgo de intervención 15%). La señal explicita ambos lados del par " +
        "(p. ej. 'Compra USD / Venta CLP'): score alto favorece a la divisa base, score bajo a la contraparte. " +
        "Es una lectura cuantitativa, no una recomendación.",
      filter: (s) => s.ticker.includes("/"),
    },
    calendar: {
      title: "Stock Research — Calendario de eventos",
      brand: "Calendario",
      meta: "Fechas clave de resultados y eventos macro · investigado vía web search el " + DATA_DATE,
      note:
        "El calendario agrega automáticamente las fechas relevantes (resultados, bancos centrales, " +
        "eventos corporativos) de todos los activos cubiertos, tanto de equity como de FX.",
      filter: () => true,
    },
    tech: {
      title: "Stock Research — Panel Técnico",
      brand: "Panel Técnico",
      meta: "Estado técnico de toda la cobertura · TradingView (scanner) · " + DATA_DATE,

        "Datos 100% mecánicos calculados a diario desde TradingView, separados de la " +
        "interpretación cualitativa de los informes.",
      filter: () => true,
    },
  };
  const NOTE_UPD =
    "<br><br><strong>Actualización:</strong> los datos fueron investigados vía web search el " + DATA_DATE +
    " y son estáticos. Para refrescarlos o agregar un activo, pídeselo a Claude en la conversación " +
    "del proyecto — la página se actualiza en esta misma URL.";

  const state = { mode: "equity", ticker: STOCKS[0].ticker, weights: { ...DEFAULT_WEIGHTS }, query: "", techSort: { key: "ticker", dir: 1 }, calFilter: null };

  function modeAssets() {
    return STOCKS.filter(MODES[state.mode].filter);
  }
  function applyMode(mode) {
    state.mode = mode;
    const m = MODES[mode];
    document.title = m.title;
    document.getElementById("brandName").textContent = m.brand;
    document.getElementById("metaLine").textContent = m.meta;
    document.getElementById("railNote").innerHTML = m.note + NOTE_UPD;
    document.querySelectorAll("#modeSwitch button, #tabBar button").forEach((b) => {
      const on = b.dataset.mode === mode;
      b.classList.toggle("active", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
    });
    document.querySelector(".layout").classList.toggle("cal-mode", mode === "calendar" || mode === "tech");
    const assets = modeAssets();
    if (mode !== "calendar" && mode !== "tech" && !assets.some((s) => s.ticker === state.ticker)) state.ticker = assets[0].ticker;
    state.query = "";
    document.getElementById("search").value = "";
    render();
    window.scrollTo({ top: 0 });
  }

  function statsPairs(s) {
    return s.statsList || Object.keys(STAT_LABELS).map((k) => [STAT_LABELS[k], s.stats[k]]);
  }
  function priceOf(s) {
    const raw = statsPairs(s)[0][1];
    return (raw.match(/^[$¥€]?[\d.,]+/) || [raw])[0];
  }
  function catsOf(s) {
    return s.customCats || CATS.map((c) => ({ key: c.key, name: c.name, weight: DEFAULT_WEIGHTS[c.key] }));
  }
  function signalOf(s, g) {
    if (!s.baseCurrency) return g.signal;
    const parts = s.ticker.split("/");
    const base = s.baseCurrency;
    const quote = parts[0] === base ? parts[1] : parts[0];
    if (g.min >= 85) return `Compra fuerte ${base} / Venta ${quote}`;
    if (g.min >= 70) return `Compra ${base} / Venta ${quote}`;
    if (g.min >= 55) return `Neutral ${base}/${quote} — sin sesgo direccional`;
    if (g.min >= 25) return `Caution — sesgo Venta ${base} / Compra ${quote}`;
    return `Venta ${base} / Compra ${quote}`;
  }
  const REPO_URL = "https://github.com/AgustinMosqueira/stock-dashboard";
  function requestUrl(ticker, tipo) {
    const t = String(ticker).toUpperCase();
    let body, title;
    if (tipo === "alta") {
      title = "informe: " + t;
      body = `Solicito el informe de ${t}.\n\nSi el ticker es ambiguo, indica aquí el símbolo exacto de TradingView (ej. NASDAQ:${t}).\n\nEnviado desde el dashboard.`;
    } else if (tipo === "eliminar") {
      title = "eliminar: " + t;
      body = `Solicito ELIMINAR ${t} del dashboard.\n\nSu histórico de precios queda archivado por si se vuelve a agregar más adelante.\n\nEnviado desde el dashboard.`;
    } else {
      title = "informe: " + t;
      body = `Solicito ACTUALIZAR el informe de ${t}.\n\nEnviado desde el dashboard.`;
    }
    return `${REPO_URL}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
  }
  function matches(s, q) {
    return s.ticker.toLowerCase().includes(q) || s.company.toLowerCase().includes(q);
  }
  function fmtPct(v) {
    if (v === null || v === undefined) return null;
    const sign = v > 0 ? "+" : v < 0 ? "−" : "";
    return sign + Math.abs(v).toFixed(2).replace(".", ",") + " %";
  }
  function deltaSpan(v, extraCls) {
    const f = fmtPct(v);
    if (f === null) return "";
    const dir = v > 0 ? "up" : v < 0 ? "down" : "flat";
    return `<span class="delta ${dir}${extraCls ? " " + extraCls : ""}">${f}</span>`;
  }

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function inline(s) {
    return s
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\bHECHO(?=\s*:|\b)/g, '<span class="badge hecho">HECHO</span>')
      .replace(/\bLECTURA(?=\s*:|\b)/g, '<span class="badge lectura">LECTURA</span>');
  }
  function md(text) {
    const blocks = esc(text).split(/\n\s*\n/);
    return blocks
      .map((b) => {
        const lines = b.split("\n").map((l) => l.trim()).filter(Boolean);
        if (!lines.length) return "";
        if (lines.every((l) => /^[-•] /.test(l))) {
          return "<ul>" + lines.map((l) => "<li>" + inline(l.slice(2)) + "</li>").join("") + "</ul>";
        }
        if (lines.length >= 2 && lines.every((l) => l.startsWith("|"))) {
          const cells = (l) => l.replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
          const head = cells(lines[0]);
          const rows = lines.slice(1).filter((l) => !/^\|[\s\-:|]+\|$/.test(l)).map(cells);
          return (
            '<div class="md-table"><table><thead><tr>' + head.map((c) => `<th>${c}</th>`).join("") +
            "</tr></thead><tbody>" +
            rows.map((r) => "<tr>" + r.map((c) => `<td>${c}</td>`).join("") + "</tr>").join("") +
            "</tbody></table></div>"
          );
        }
        if (lines.length === 1 && /^#{2,4} /.test(lines[0])) {

        return "<p>" + inline(lines.join(" ")) + "</p>";

  function normWeights(w) {
    const sum = CATS.reduce((a, c) => a + w[c.key], 0);
    if (sum === 0) return { norm: { ...DEFAULT_WEIGHTS }, sum: 0 };
    const norm = {};
    CATS.forEach((c) => (norm[c.key] = (w[c.key] / sum) * 100));
    return { norm, sum };
  }
  function composite(stock, weights) {
    if (stock.customCats) {
      return Math.round(stock.customCats.reduce((a, c) => a + stock.scores[c.key].score * c.weight / 100, 0));
    }
    const { norm } = normWeights(weights);
    return Math.round(CATS.reduce((a, c) => a + stock.scores[c.key].score * norm[c.key] / 100, 0));
  }
  function gradeFor(score) {
    return GRADES.find((g) => score >= g.min);
  }

  function gaugeSVG(score, size) {
    const r = size / 2 - 7;
    const cx = size / 2, cy = size / 2;
    const start = 135, sweepMax = 270;
    const sweep = sweepMax * score / 100;
    const arc = (a0, a1, color, wd) => {
      const p = (a) => {
        const rad = (a - 90) * Math.PI / 180;
        return `${(cx + r * Math.cos(rad)).toFixed(2)} ${(cy + r * Math.sin(rad)).toFixed(2)}`;
      };
      const large = a1 - a0 > 180 ? 1 : 0;
      return `<path d="M ${p(a0)} A ${r} ${r} 0 ${large} 1 ${p(a1)}" fill="none" stroke="${color}" stroke-width="${wd}" stroke-linecap="round"/>`;
    };
    let marks = "";
    for (let v = 0; v <= 100; v += 25) {
      const a = (start + sweepMax * v / 100 - 90) * Math.PI / 180;
      const r1 = r - 8, r2 = r - 12;
      marks += `<line x1="${(cx + r1 * Math.cos(a)).toFixed(1)}" y1="${(cy + r1 * Math.sin(a)).toFixed(1)}" x2="${(cx + r2 * Math.cos(a)).toFixed(1)}" y2="${(cy + r2 * Math.sin(a)).toFixed(1)}" stroke="var(--hairline)" stroke-width="1.5"/>`;
    }
    return (
      `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Score compuesto ${score} de 100">` +
      arc(start, start + sweepMax, "var(--track)", 9) +
      (score > 0 ? arc(start, start + Math.max(sweep, 3), "var(--accent)", 9) : "") +
      marks +
      `</svg>`
    );
  }

  const MONTHS_ES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const MONTH_ABBR = { ene: 0, feb: 1, mar: 2, abr: 3, may: 4, jun: 5, jul: 6, ago: 7, sep: 8, sept: 8, set: 8, oct: 9, nov: 10, dic: 11 };
  const WEEKDAYS_ES = ["dom","lun","mar","mié","jue","vie","sáb"];

  function busDaysUntil(d, today0) {
    let n = 0;
    const cur = new Date(today0);
    while (cur < d && n < 30) {
      cur.setDate(cur.getDate() + 1);
      const wd = cur.getDay();
      if (wd !== 0 && wd !== 6) n++;
    }
    return n;
  }
  function parseISODate(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function parseSpanishDate(txt) {
    const m = /(\d{1,2})[-\s]*(ene|feb|mar|abr|may|jun|jul|ago|sept|sep|set|oct|nov|dic)[a-z]*\.?[-\s]*(\d{4})/i.exec(txt || "");
    if (!m) return null;
    const mo = MONTH_ABBR[m[2].toLowerCase()];
    return mo == null ? null : new Date(+m[3], mo, +m[1]);
  }
  function assetEvents(s) {
    const out = (s.events || [])
      .map((e) => ({ ...e, d: parseISODate(e.date) || parseSpanishDate(e.date) }))
      .filter((e) => e.d && e.label);
    if (!out.some((e) => (e.kind || "") === "earnings")) {
      const pair = statsPairs(s).find(([l]) => /earnings|evento/i.test(l));
      const d = pair && parseSpanishDate(pair[1]);
      if (d) out.push({ d: d, label: (/earnings/i.test(pair[0]) ? "Resultados — " : "") + pair[1], kind: /earnings/i.test(pair[0]) ? "earnings" : "macro" });
    }
    return out.map((e) => ({ ...e, ticker: s.ticker, isFx: s.ticker.includes("/") }));
  }
  // Agrupación de eventos macro compartidos (FOMC, BCE, IPC…): un mismo evento que
  // afecta a varios activos aparece una sola vez con la lista de afectados.
  const MACRO_KEYS = ["fomc", "fed", "bce", "ecb", "boj", "banco central", "bcch", "tpm",
    "ipc", "cpi", "pce", "payroll", "nfp", "ipom", "halving", "opep", "opec", "jackson hole"];
  function normLabel(l) {
    return (l || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim();
  }
  function eventKey(e) {
    if (e.econ) return null;  // los datos del calendario económico no se agrupan entre sí
    if ((e.kind || "macro") !== "macro") return null;  // earnings/corporate nunca se agrupan
    const n = normLabel(e.label);
    for (const k of MACRO_KEYS) if (n.includes(k)) return "k:" + k;
    return "l:" + n;
  }
  function mergeDay(dayEvts) {
    const groups = new Map();
    let uid = 0;
    dayEvts.forEach((e) => {
      const key = eventKey(e) || "u:" + uid++;
      if (!groups.has(key)) {
        groups.set(key, { ...e, tickers: [e.ticker] });
      } else {
        const g = groups.get(key);
        if (!g.tickers.includes(e.ticker)) g.tickers.push(e.ticker);
        if (e.label.length < g.label.length) g.label = e.label;  // se queda la etiqueta más limpia
        if (!g.time && e.time) g.time = e.time;
        if ((e.info || "").length > (g.info || "").length) g.info = e.info;

    });
    return Array.from(groups.values());
  }

  const ECON_INVERTED = ["jobless claims", "unemployment rate"];
  function econResultInfo(e) {
    if (e.actual == null) return null;

    if (ref == null) return null;
    const u = e.unit || "";
    const fmtv = (v) => `${v}${u}`;
    const refName = e.forecast != null ? "lo esperado" : "el dato previo";
    const n = normLabel(e.label);
    const esRateDecision = n.includes("interest rate decision") || n.includes("fomc");
    const diff = e.actual - ref;

    if (e.country === "CL") {
      if (diff === 0) {
        return esRateDecision
          ? `TPM en ${fmtv(e.actual)}, sin sorpresa vs ${refName}. El impacto en el peso y en USD/CLP dependerá del tono del comunicado del BCCh (sesgo futuro de tasas).`
          : `Salió ${fmtv(e.actual)}, en línea con ${refName}: impacto acotado en el peso chileno y USD/CLP; el mercado pasa al siguiente catalizador.`;
      }
      const fuerte = ECON_INVERTED.some((k) => n.includes(k)) ? diff < 0 : diff > 0;
      return fuerte
        ? `Salió ${fmtv(e.actual)} vs ${fmtv(ref)} ${refName}: dato FUERTE para la economía chilena. Apoya al peso (presión BAJISTA para USD/CLP) y respalda que el BCCh mantenga la TPM alta por más tiempo.`
