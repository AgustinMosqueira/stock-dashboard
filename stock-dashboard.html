0 (ago-2026); consenso ~$1.513. LECTURA: el nombre volvió a zona de sobreextensión (percentil 78,8, +67,6% sobre SMA200) de cara a un earnings binario el 29-sep, con riesgo asimétrico de 'vender el hecho' si el margen no supera el pico ya guiado.", "fundamental": "- HECHO: guidance Q4 FY26 confirma revenue $50B±1B y margen bruto no-GAAP ~86%, EPS no-GAAP $31±1 (Micron IR, jun-2026, sin cambios a sep-2026).\n- HECHO: 16 Strategic Customer Agreements con ~US$100.000M de RPO acumulado y US$22.000M en depósitos, con floor pricing que management dice superaría picos de ciclos pasados (S&P Global/Fool, jul-2026).\n- HECHO: Micron planea duplicar capacidad HBM a ~100.000 wafers/mes a fin de 2026, con HBM4 de 12 capas subiendo de 20-30% a 50% del mix (Yonhap/TradingKey, 4-sep-2026).\n- LECTURA: en HBM4 para Nvidia Vera Rubin, Micron queda con participación de un solo dígito frente a ~70% de SK Hynix, mostrando que el liderazgo es en DRAM/NAND agregado, no en HBM de punta.\n- HECHO: CEO Sanjay Mehrotra vendió 40.000 acciones (~US$38,76M) el 21-ago-2026 a precios $959-990, bajo plan 10b5-1 de ene-2026 (SEC Form 4/Investing.com, ago-2026); tras la venta retiene ~264.503 acciones directas + 607.075 vía GRATs.", "valuacion": "- HECHO: P/E trailing 22,9x vs forward ~7,1x (stockanalysis.com, sep-2026): el mercado sigue descontando expansión fuerte de utilidades hacia FY27.\n- HECHO: target consenso ~US$1.513 (44 compras/4 mantener) implica ~49% de upside desde $1.016,59 (S&P Global, sep-2026).\n- HECHO: New Street (Ferragu) subió a Buy con target $1.250 en agosto citando mercado de memoria estructuralmente ajustado con capacidad 2027 ya comprometida (TheStreet, ago-2026).\n- LECTURA: forward P/E de un dígito bajo sugiere que o el mercado no cree del todo en el guidance a 12+ meses, o está anticipando que el ciclo actual es más estructural (SCAs) que cíclico.", "tecnico": "- Precio $1.016,59 muy por sobre SMA20 (+7,8%) y SMA50 (+8,4%), y +67,6% sobre SMA200: tendencia de largo plazo fuertemente alcista, sin señales de ruptura.\n- RSI 60,1 (zona neutral-alta, no sobrecomprado extremo) con MACD +14,06 sobre señal +8,19: momentum positivo confirmado, sin divergencia bajista visible.\n- Percentil de precio 1Y en 78,8: el nombre está en la parte alta de su rango anual, lejos de zona de pánico pero también lejos de piso — sobreextensión moderada, no vertical (RSI <75).\n- Volumen ratio 0,94 (ligeramente bajo el promedio 20d) pese al rally: la suba no viene acompañada de volumen explosivo, matiz de cautela sobre la fuerza del movimiento.\n- Sharpe 0,93 / Sortino 1,19 a 30d y max drawdown 1Y de -39,1% confirman perfil de retorno/riesgo positivo reciente pero con historial de caídas violentas intacto.", "catalizadores": "**Catalizadores:**\n- Earnings Q4 FY26 el 29-sep-2026: confirmación o superación de guidance $50B/86%/EPS $31 es el catalizador binario más cercano.\n- Expansión de capacidad HBM4 (12 capas) de 20-30% a 50% del mix hacia fin de 2026, con HBM4E en camino para 2027 (Yonhap/TradingKey, sep-2026).\n- Contratos SCA con floor pricing (~US$100.000M RPO) que blindarían márgenes incluso si el ciclo spot se enfría.\n- Escasez de memoria descrita como la más severa en 15 años, con IDC/Counterpoint viendo el punto de inflexión recién en 2027 (SK Hynix/tech-insider, ago-2026).\n\n**Riesgos (por materialidad):**\n- CXMT (China) mantiene paridad de precios con Samsung/SK Hynix pese a desventaja de costos ~30%+ por DUV; recibió acceso prioritario a nuevas máquinas DUV domésticas (wccftech/Digitimes, ago-2026), reduciendo brecha estructural en el tiempo.\n- Apple probando activamente chips CXMT para Mac/iPhone/iPad pese a presión bipartidista del Senado de EE.UU. (macdailynews/techtimes, ago-2026) — riesgo de precedente si se aprueba uso comercial.\n- Historial de drawdowns severos (73%, 55%, 51%, 43%, 36% en ciclos previos) y beta ~2,1-2,3: el mismo motor de rally puede revertirse con la misma violencia.\n- Participación de Micron en HBM4 de punta (Vera Rubin) es de un solo dígito vs ~70% de SK Hynix, limitando el upside relativo en el segmento de mayor margen.", "sentimiento": "- HECHO: consenso Strong Buy con 44 compras / 4 mantener y ningún analista en venta (S&P Global, sep-2026); New Street upgradeó a Buy con target $1.250 en agosto citando mercado estructuralmente ajustado (TheStreet, ago-2026).\n- HECHO: venta de insider del CEO por US$38,76M (21-ago-2026) bajo plan 10b5-1 preestablecido — mecánica, no señal discrecional de desconfianza, pero recurrente (venta similar de US$28,99M en jul-2026).\n- LECTURA: rally de +256% YTD y target consenso con ~49% de upside adicional reflejan euforia generalizada sin voces bajistas fuertes; leído en contrario, la ausencia total de escépticos es una señal de precaución de corto plazo, no de deterioro fundamental.\n- HECHO: el propio management reconoció 'moderación en el ritmo de subas de precio' para Q4, matizando el tono eufórico del consenso sell-side.", "conclusion": "MU combina un superciclo de memoria con contratos plurianuales que blindan piso de márgenes (SCAs ~US$100.000M RPO) y una valuación forward que sigue barata (P/E ~7,1x) frente a un consenso Strong Buy con ~49% de upside. Pero el precio ya recuperó y superó máximos previos (percentil 78,8, +67,6% sobre SMA200) de cara a un earnings binario el 29-sep, con euforia de sentimiento sin contrapeso bajista relevante. Riesgos reales (CXMT ganando terreno, participación baja en HBM4 de punta, historial de drawdowns >40%) no invalidan la tesis pero justifican no perseguir el nombre en máximos. Confianza media."}, "scores": {"tecnica": {"score": 58, "just": "RSI 60,1 y MACD positivo confirman momentum sin sobreextensión vertical (percentil 78,8, lejos de >95; RSI <75), pero volumen ratio 0,94 bajo el rally resta convicción al movimiento reciente. Tendencia de largo plazo intacta (+67,6% sobre SMA200)."}, "fundamental": {"score": 70, "just": "Guidance Q4 FY26 confirmado sin cambios, SCAs blindan floor pricing por ~US$100.000M RPO, capacidad HBM4 duplicándose. Yellow flags: participación de un solo dígito en HBM4 de punta (Vera Rubin) y moderación explícita de ritmo de subas de precio."}, "sentimiento": {"score": 50, "just": "Consenso unánime Strong Buy (44 compras, 0 ventas) y upgrades recientes reflejan euforia sin contrapeso bajista tras +256% YTD — leído en contrario, extremo de optimismo unánime resta puntos pese a datos operativos sólidos."}, "riesgo": {"score": 42, "just": "Volatilidad estructural (beta ~2,1-2,3, drawdowns históricos de 36-73%) es propia del nombre, no necesariamente pérdida permanente; pero competencia china ganando acceso a litografía DUV doméstica y dependencia de un ciclo de precios son riesgos de mediano plazo reales."}, "conviccion": {"score": 58, "just": "Asimetría moderada al precio actual: target consenso implica ~49% upside con tesis estructural (SCAs) intacta, pero el precio ya en percentil 78,8 y catalizador binario del 29-sep limitan el margen de seguridad de entrada inmediata."}}, "sources": ["Investing.com, 07/09/2026 - Micron Stock Price Today | NASDAQ: MU Live", "24/7 Wall St., 07/09/2026 - Micron Has Skyrocketed 256% in 2026. What Would It Take to Get MU Stock Up to $1,250?", "TheStreet/Yahoo Finance, agosto 2026 - 5-star analyst sets jaw-dropping Micron stock price target for 2026 (New Street, Ferragu, target $1.250)", "companiesmarketcap.com, septiembre 2026 - Micron Technology Market Capitalization (~US$1,127B)", "stockanalysis.com, septiembre 2026 - Micron Technology (MU) Statistics & Valuation (P/E 22,9x trailing / 7,1x forward)", "TradingKey/Yonhap News Agency, 04/09/2026 - Micron Plans to Double Monthly HBM Capacity to 100,000 Wafers", "TrendForce, 09/01/2026 - NVIDIA Fuels HBM4 Race: 12-Layer Ramps, 16-Layer Push by SK hynix, Samsung, and Micron", "Next Waves Insight, 2026 - HBM4 Ramp: Why Three Suppliers Still Add Up to a Duopoly for Nvidia (Micron single-digit share Vera Rubin)", "Astute Group, 2026 - Apple asked CXMT for a discount on DRAM — and got Samsung's price instead", "Digitimes, 06/08/2026 - Apple's CXMT play reportedly backfires on DUV limits, giving Samsung and SK Hynix more DRAM leverage", "wccftech, agosto 2026 - CXMT On The Priority List For A Spate Of China's New Homegrown DUV Machines", "macdailynews, 10/08/2026 - Apple tests China's CXMT memory chips for Macs, iPhones, and iPads", "techtimes, 10/08/2026 - Senate Demands Cook Reject Chinese Chips Apple Already Couldn't Afford", "MarketScreener/SEC Form 4, 21/08/2026 - Micron Technology CEO Sanjay Mehrotra sells $38.7 million in MU shares", "Investing.com, 24/07/2026 - Micron Technology CEO Sanjay Mehrotra sells $28.99 million in stock", "The Motley Fool, 02/09/2026 - Micron Guided a Single Quarter to $50 Billion. The Stock Sits 24% Below Its High.", "The Motley Fool, 09/07/2026 - Micron's Data Center Gross Margin Hit 87% Last Quarter", "247wallst.com, 03/08/2026 - Micron's 85% Gross Margin Tops Meta, Microsoft, and Google", "Trefis, 25/08/2026 - Can You Stomach The Plunge In Micron Stock? (drawdowns históricos 73%/55%/51%/43%/36%, beta ~2,3)", "The Motley Fool, 29/07/2026 - Micron Stock Has Gained Roughly 190% in 2026. History Says Its Next 30%+ Drawdown Could Come at Any Time."], "opportunity": {"cats": {"valuacion_hist": {"score": 48, "just": "Forward P/E ~7,1x sigue bajo para el crecimiento esperado, pero trailing 22,9x y precio en percentil 78,8 de su propio rango 1Y muestran que ya no está barato vs su propia historia reciente tras el rally de +256% YTD."}, "calidad": {"score": 73, "just": "SCAs con ~US$100.000M RPO y floor pricing, único memory maker relevante en EE.UU., margen bruto guiado ~86%; contrapeso: participación de un solo dígito en HBM4 de punta frente a SK Hynix."}, "asimetria": {"score": 55, "just": "Target consenso ~49% upside, pero precio ya extendido (+67,6% sobre SMA200, percentil 78,8) reduce el margen de seguridad de entrada inmediata; downside acotado por tendencia de largo plazo pero volatilidad amplifica ambas colas."}, "catalizadores": {"score": 62, "just": "Earnings 29-sep-2026 es catalizador claro y muy cercano; ramp de capacidad HBM4 a 50% del mix hacia fin de año y resolución del caso Apple-CXMT son catalizadores adicionales en las próximas semanas."}, "contrarian": {"score": 38, "just": "Consenso unánime Strong Buy sin ventas y +256% YTD reflejan euforia sin contrapeso bajista relevante — señal contraria de cautela de corto plazo, no de compra agresiva en este punto del ciclo de sentimiento."}}, "plan": {"recomendacion": "Esperar gatillo", "zona_compra": "US$880-960 (retroceso hacia SMA20/50) o confirmación de guidance en earnings 29-sep antes de sumar en máximos", "invalidacion": "Ruptura sostenida bajo SMA200 (~US$606 ajustada al alza con el tiempo) o recorte de guidance de margen/revenue en el earnings del 29-sep", "gatillos": ["Confirmación o superación de guidance en earnings Q4 FY26 (29-sep-2026)", "Evidencia de que el ritmo de subas de precio no se modera más de lo ya guiado", "Retroceso técnico saludable hacia SMA20/50 con RSI descomprimiendo desde 60"], "horizonte": "6-18 meses", "tamano": "Posición moderada dada volatilidad extrema (beta ~2,1-2,3, drawdowns históricos >40%); evitar sobreconcentración y perseguir el precio en máximos", "confianza": "media"}}, "perfil": "Micron fabrica memoria semiconductora —DRAM y NAND— y la vende a fabricantes de servidores y aceleradores de IA, smartphones, PCs, automoción e industria; es el único productor estadounidense de DRAM a escala y uno de los tres que dominan el mercado con Samsung y SK Hynix (~90% del DRAM mundial). Es un negocio de commodity con costes fijos enormes: el precio, no el volumen, determina el resultado, con apalancamiento operativo extremo en ambas direcciones. DRAM es el core absoluto (76% de los ingresos) y dentro de DRAM la HBM —la memoria que se vende apilada junto a los aceleradores de IA— cambió el perfil del negocio: nube y centro de datos ya pesan más que móvil y automoción juntos. La magnitud del ciclo se ve en las cifras: de US$37.400M anuales con 40% de margen bruto en FY2025 a US$41.500M en un solo trimestre con 84,6% de margen bruto en el 3T FY2026, con 16 acuerdos plurianuales que comprometen ~US$100.000M de ingreso mínimo hasta 2030. Pero la simetría opera igual a la baja: en FY2023 facturó US$15.500M con margen bruto de -9% y perdió US$5.800M. El foso no es tecnológico sino de escala y disciplina de una industria de tres actores."}, {"ticker": "MP", "company": "MP Materials Corp.", "statsList": [["Precio", "$54.53 (7-sep-2026)"], ["Rango 52 sem.", "$37,81 – $100,25"], ["Market cap", "~US$8.530M (178,05M acciones × $47,91; stockanalysis.com, 5-ago-2026)"], ["P/E", "n/a — pérdidas TTM (EPS -$0,34); forward P/E ~99x, P/S TTM ~20x sobre revenue $416M (stockanalysis.com, ago-2026)"], ["Target consenso", "~US$77,5-79,5 promedio, 18 analistas en compra / 0 venta, Strong Buy (CNN Markets / Investing.com, jul-ago 2026) — implica ~+62% desde $47,91"], ["Próx. earnings", "6-ago-2026 (Q2 2026, mañana): consenso ingresos ~US$95,7M y EPS ajustado ~$0,01 (MarketBeat, ago-2026)"], ["Técnico (auto)", "RSI 50.5 · MACD +1.02 / señal +1.63 (TradingView, 7-sep-2026)"]], "reportDate": "5 de agosto de 2026", "change": {"day": 1.39, "week": -2.85}, "events": [{"date": "2026-08-06", "label": "Earnings Q2 2026", "kind": "earnings", "info": "Consenso: ingresos ~US$95,7M (vs $57,4M a/a) y EPS ajustado ~$0,01 (MarketBeat, ago-2026). Foco: volúmenes y costo unitario de NdPr, ramp del segmento Magnetics (Independence, Fort Worth), avance de construcción del 10X, comisionado de separación de tierras raras pesadas en Mountain Pass, y cualquier cuantificación del impacto de la blacklist china del 22-jun en equipos/insumos. Evento binario tras +25,7% de rebote semanal pre-reporte."}], "sections": {"resumen": "MP cerró el 5-ago en $47,91 (+0,93% día, +25,75% en 5 ruedas), rebotando en V desde $38,10 (29-jul), pegado al mínimo 52-sem de $37,81, y aún -52% bajo el máximo de $100,25. HECHO: reporta Q2 2026 mañana 6-ago. La tesis estructural sigue intacta: única cadena mina-imán integrada de EE.UU., piso DoD de $110/kg para NdPr por 10 años, offtake 100% del futuro 10X y acuerdo Apple de $500M vigente. La caída feb-jul respondió a la blacklist china (22-jun), insider selling y desinfle del premium 2025. LECTURA: capitulación de julio (RSI<30) más piso contractual del DoD acotaban el downside; el rebote pre-earnings ya consumió parte de esa asimetría.", "fundamental": "- HECHO: Q1 2026 (6-may): revenue $90,6M (+49% a/a), EBITDA ajustado $36,6M, utilidad neta ajustada $6,7M; producción récord de NdPr 917 t (+63%) y ventas 1.006 t (+117%) (MP IR, may-2026).\n- HECHO: acuerdo DoD (jul-2025) vigente: piso de $110/kg para NdPr por 10 años vía contract-for-difference, préstamo de $150M para separación de pesadas, y compromiso de compra del 100% de los imanes del 10X (10.000 t/año NdFeB, comisionado 2028); $1.000M de financiamiento comprometido por JPMorgan/Goldman (MP IR / FAS).\n- HECHO: acuerdo Apple $500M (jul-2025) vigente: imanes de tierras raras 100% recicladas desde Independence (Fort Worth), envíos desde 2027.\n- HECHO: Magnetics (Independence) en Q1 2026: revenue $21,1M (+306% a/a) y EBITDA de segmento $9,6M; 10X con groundbreaking realizado y comisionado de separación de pesadas por iniciarse en Mountain Pass (MP IR, may-2026).\n- HECHO: MOFCOM incluyó a MP en su lista de control (22-jun-2026), vetando exportaciones chinas de ítems dual-use hacia la empresa. LECTURA: no afecta ventas (MP dejó de vender concentrado a China en 2025) pero puede encarecer equipos/insumos; alcance completo no verificable.", "valuacion": "- HECHO: sin P/E trailing (pérdidas TTM, EPS -$0,34); forward P/E ~99x y P/S TTM ~20x (stockanalysis.com, ago-2026) — el precio descuenta la ejecución 2027-28, no las utilidades actuales.\n- HECHO: target consenso ~$77,5-79,5, Strong Buy, 18 compras / 0 ventas (CNN / Investing.com, jul-ago 2026): ~+62% de upside implícito.\n- HECHO: NdPr óxido en ¥747-767/kg (~US$112-115/kg) a fines de jul-2026, sobre el piso DoD de $110; aleación NdPr ~US$133/kg al 1-jul, máximo 2026 (Mainrich / Rare Earth Exchanges, jul-2026). LECTURA: con spot > piso, el CFD del DoD pasa de subsidio a opción gratuita.\n- HECHO: InvestingPro había marcado sobrevaluación en los máximos y 'acertó' la caída de ~50% (Investing.com, jul-2026). LECTURA: tras el -52% desde el pico, la acción está barata vs su rango 12m pero cara vs fundamentales corrientes; el valor real depende de la capacidad de imanes ya contratada.\n- LECTURA: dilución potencial (warrants/preferentes del DoD, ~178M acciones hoy) modera el upside por acción; no cuantificada aquí — no verificable sin el 10-Q más reciente.", "tecnico": "- Piso en $38,10 (29-jul), prácticamente el mínimo 52-sem ($37,81), seguido de reversión en V: +25,75% en 5 ruedas con velas de +9,3%, +6,0% y +8,3% — evidencia de cambio de carácter tras la bajista feb-jul.\n- RSI pasó de sobreventa extrema (<30 el 22-jul, metalschannel) a zona neutral-alta: la estructura de mínimos decrecientes se rompió al recuperar $43-44.\n- Precio aún -52% bajo el máximo 52-sem; resistencias en ~$49-52 (zona perdida en jun tras la blacklist) y luego ~$57,5.\n- Beta 1,92 (stockanalysis.com): amplifica ambos lados; el rebote actual llega justo antes de un evento binario (earnings 6-ago), con gap risk elevado.\n- Volumen de la semana de rebote: no verificable al cierre del 5-ago; la amplitud de las velas sugiere participación institucional, no solo short covering.", "catalizadores": "**Catalizadores:**\n- Earnings Q2 2026 mañana (6-ago): consenso $95,7M / EPS aj. $0,01; confirmación de EBITDA ajustado positivo y ramp de Magnetics sería validación clave de la tesis.\n- Comisionado de separación de tierras raras pesadas en Mountain Pass (2S26): primera capacidad de pesadas a escala en EE.UU., financiada con $150M del DoD.\n- Inicio de envíos de imanes reciclados a Apple (2027) y avance del 10X (10.000 t/año, 2028) con $1.000M de JPMorgan/Goldman comprometidos.\n- Escalada de controles chinos (blacklist a MP el 22-jun; extensión a 14 firmas de la UE el 24-jul) sostiene el premium ex-China de NdPr sobre el piso de $110/kg.\n\n**Riesgos (por materialidad):**\n- Ejecución del salto de escala en imanes (Independence ~1.000 t → 10X 10.000 t hacia 2028): retrasos o sobrecostos romperían la tesis que justifica el múltiplo.\n- Valuación exigente (forward P/E ~99x, P/S ~20x): sin margen de error si NdPr recae bajo $110 y el negocio queda dependiendo del CFD estatal.\n- Blacklist china sobre ítems dual-use puede encarecer capex/opex de las expansiones; magnitud no verificable.\n- Insider selling elevado (>1,2M acciones vendidas por ejecutivos incl. CEO/CFO en el último trimestre; tickeron, jul-2026) y dilución potencial por instrumentos del DoD.", "sentimiento": "- HECHO: consenso sell-side unánime en Strong Buy (18 compras, 0 ventas), target ~$77,5 (CNN / stockanalysis, ago-2026) — sin capitulación de analistas pese al -52% desde el pico.\n- HECHO: RSI entró en sobreventa (<30) el 22-jul (metalschannel) tras la ola de ventas por la blacklist china y el insider selling: extremo de miedo clásico.\n- LECTURA contrarian: el punto de máximo pesimismo fue fines de julio; el rebote de +25,7% ya consumió parte de esa ventana. Con el sell-side 100% comprador, el contrarian puro hoy es neutral, no alcista.\n- LECTURA: prensa dividida — notas de 'fair value acertó la caída de 50%' conviven con 'mejor acción de reshoring' — dispersión narrativa típica de un stock-historia dependiente de política industrial.", "conclusion": "MP es la apuesta estructural de EE.UU. en tierras raras: piso DoD de $110/kg por 10 años, offtake del 100% del 10X, Apple $500M y Q1 2026 ya con EBITDA ajustado positivo — el downside de flujo está contractualmente acotado y el upside depende de ejecutar imanes 2027-28. Pero el punto de entrada táctico óptimo fue la capitulación de julio ($38-42); tras +25,75% en una semana y un earnings binario mañana, comprar hoy es pagar el rebote. Plan: esperar el reporte del 6-ago y acumular en retrocesos hacia $42-45 con la tesis confirmada. Invalidación: cierre sostenido bajo $37,8 o daño al acuerdo DoD."}, "scores": {"tecnica": {"score": 60, "just": "Cambio de carácter genuino: reversión en V desde el soporte 52-sem con RSI saliendo de sobreventa (<30 el 22-jul) y ruptura de la secuencia de mínimos decrecientes. Se descuenta puntaje por extensión de corto plazo (+25,75% en 5 ruedas) justo antes de un evento binario — no se premia la dirección, se premia la evidencia, y parte de ella ya está pagada."}, "fundamental": {"score": 66, "just": "Q1 2026 con inflexión real (EBITDA aj. $36,6M, utilidad neta aj. positiva, NdPr récord) y contratos únicos en el mundo occidental (piso DoD $110/kg, offtake 10X, Apple). Falta: pérdidas GAAP (EPS TTM -$0,34) y toda la tesis de imanes a escala está por ejecutarse hasta 2028."}, "sentimiento": {"score": 55, "just": "El extremo contrarian comprable fue fines de julio (RSI<30, capitulación por blacklist). Hoy el sentimiento ya rebotó y el sell-side está unánimemente comprador (18/18 Buy) — consenso bullish total resta valor contrarian; posición neutral, ni euforia ni pánico."}, "riesgo": {"score": 52, "just": "El riesgo de pérdida permanente está mitigado por el CFD del DoD ($110/kg por 10 años) y el respaldo estatal — el drawdown de -52% ya ocurrido no se castiga. Riesgos reales remanentes: ejecución del 10X, dependencia de política industrial (cambio de administración/prioridades), blacklist china sobre insumos y valuación sin margen de error."}, "conviccion": {"score": 60, "just": "Tesis estructural clara con downside contractualmente acotado y +62% de upside a consenso, pero timing subóptimo (rebote de +25,7% pre-earnings) y dependencia de ejecución multianual moderan la convicción a esta fecha y precio."}}, "sources": ["stockanalysis.com, 05/08/2026 - MP Materials (MP) Statistics, Price el": "Lockup: tramo escalonado adicional (~7% del float, fecha estimada)", "kind": "corporate", "info": "LECTURA: siguiente tramo del calendario escalonado de liberaciones (ritmo ~cada 2-4 semanas) según agregadores; no confirmado oficialmente por la compañía (stockalarm.io/purepowerpicks.com, ago-2026)."}, {"date": "2026-11-05", "label": "Earnings Q3 2026 (fecha estimada)", "kind": "earnings", "info": "Fecha no confirmada oficialmente; estimados de terceros apuntan a ~5-nov-2026 (antes se manejaba 3-nov). El mercado buscará confirmar el run-rate anualizado de US$100 mil millones guiado para fin de 2026, la continuidad de Starlink (12M suscriptores, meta 20M a fin de año) y del segmento AI/xAI. Un tramo de lockup adicional (~28% del float) está ligado a esta fecha (WallStreetHorizon/agregadores, ago-sep/2026)."}], "sections": {"resumen": "SPCX cotiza en US$147,95 (5-sep-2026), consolidando la recuperación post-earnings de agosto. HECHO: el short interest se desplomó de ~34% pre-earnings a niveles residuales (~0,1% trailing, fintel, principios sep-2026), y los analistas siguen subiendo targets (Oppenheimer a US$280, 02-sep). LECTURA: el próximo test de oferta es inmediato -lockup del 9-sep habilita hasta 319M de acciones- y Starship Flight 14, retrasado a NET 15-sep, sigue pendiente de volar tras completar el static fire de 33 motores el 28-ago. El foco pasa de validar el negocio a sostener el guidance y absorber oferta sin corrección.", "fundamental": "- HECHO: revenue 2T26 de US$7,8 mil millones, +92% interanual, sobre consenso ~US$6,8-6,9 mil millones; pérdida neta US$541 MM (-US$0,09/acción) (Bloomberg/Fortune/CNBC, 04/08/2026).\n- HECHO: Starlink alcanzó 12M suscriptores (+1,7M en el trimestre) y segmento Connectivity generó US$4,29 mil millones (+66% YoY); meta de 20M suscriptores a fin de 2026 (CNN Business/company guidance, ago-2026).\n- HECHO: Space Force otorgó US$1,6 mil millones para 18 misiones Falcon 9 hasta 2027; contratos Pentágono 2026 superan US$8 mil millones (SpaceNews/Defense Post, fines jul-2026).\n- LECTURA: riesgo regulatorio/reputacional activo en xAI-Memphis: 69 turbinas de gas sin permiso operando hasta el retiro completo en jul-2027, con demandas de NAACP/SELC (TechCrunch, 31/07/2026).\n- LECTURA: guidance de run-rate de US$100 mil millones para fin de 2026 exige sostener el ritmo Starlink+AI; aún sin utilidad GAAP.", "valuacion": "- HECHO: precio US$147,95 (5-sep-2026) vs target consenso US$222,32 (35 analistas, rango US$117-450), +~50% de upside implícito.\n- HECHO: Oppenheimer subió PT a US$280 (02-sep-2026); Argus mantiene Compra con PT US$160.\n- HECHO: rango desde IPO US$104,83-225,64; precio actual en la mitad inferior-media del rango (percentil 1y ~35,7 según técnico calculado).\n- LECTURA: P/E no aplica (pérdida GAAP); P/S sigue exigente pero se relaja en relativo tras el beat de revenue de 2T26.\n- LECTURA: dispersión de targets sigue amplia (US$117-450), reflejo de incertidumbre sobre cómo valorar el negocio combinado espacio+AI, aún sin historial de reporting largo.", "tecnico": "- HECHO: RSI 58,5 y MACD +2,74/señal +1,33 (TradingView, 5-sep-2026): zona neutral-alcista, sin sobrecompra extrema.\n- HECHO: precio +4,97% sobre SMA20 y +8,8% sobre SMA50, con percentil de precio a 1 año de solo 35,7% pese al rally reciente (technical, 5-sep-2026).\n- LECTURA: volumen del día (49,1M) muy por debajo del promedio 20d (87,4M, ratio 0,56), señal de consolidación de baja participación antes del evento de lockup del 9-sep.\n- LECTURA: volatilidad 30d extrema (96,8% anualizada) y drawdown máximo 1y de -46,35% confirman que sigue siendo un activo de alto riesgo binario, no un piso técnico consolidado.\n- LECTURA: el cambio de carácter (recuperación desde sobreventa, absorción de lockups sin fricción) sigue vigente, pero ya no hay el mismo argumento de 'barato' que a mediados de agosto.", "catalizadores": "**Catalizadores:**\n- Absorción del lockup del 9-sep (hasta 319M acciones) sin presión vendedora sostenida, replicando el patrón del 6-ago (The Motley Fool, 05/09/2026).\n- Starship Flight 14, retrasado a NET 15-sep-2026, con intento de \"ship catch\"; static fire de 33 motores ya completado (Tesla Oracle, 02/09/2026).\n- Upgrades de analistas en curso: Oppenheimer eleva PT a US$280 (02-sep); consenso mayoritariamente Compra.\n- Confirmación de fecha y resultado del earnings Q3 2026 (~5-nov estimado), con tramo de lockup ligado a ese evento.\n\n**Riesgos (por materialidad):**\n- Riesgo regulatorio/legal activo en xAI-Memphis (turbinas sin permiso, demandas NAACP/SELC, retiro completo no antes de jul-2027) (TechCrunch, 31/07/2026).\n- Tramos de lockup escalonados hasta dic-2026 (9-sep, ~24-sep, tramo ligado a Q3, final 8-dic) podrían presionar oferta si cambia el sentimiento.\n- Starship Flight 14 es de alto riesgo técnico; un fallo o nuevo retraso golpearía la narrativa de reducción de costos de lanzamiento.\n- Competencia de Amazon Leo (ex-Kuiper, ~365 satélites) y disputa regulatoria FCC sobre espectro direct-to-device (rechazo abr-2026); riesgo de dilución por ventas de insiders en cada ventana.", "sentimiento": "- HECHO: short interest colapsó de ~34% pre-earnings a niveles residuales (~0,1% trailing net short, fintel/shortinteresttracker, principios sep-2026), confirmando cierre masivo de cortos.\n- HECHO: consenso de analistas mayoritariamente Compra, PT promedio US$222,32 (35 analistas); Oppenheimer y Argus con alzas recientes de target.\n- LECTURA: Motley Fool (01-sep-2026) advierte 3 vientos en contra de septiembre: estacionalidad débil, mayor probabilidad de suba de tasas (~57% al 28-ago) y más insiders habilitados para vender.\n- LECTURA: el sentimiento ya pasó de pesimismo extremo pre-earnings a optimismo moderado; la señal contraria se agotó en gran parte, aunque persiste flujo comprador de fondos indexados compensando ventas de insiders (Motley Fool, 05/09/2026).", "conclusion": "SPCX consolida en US$147,95 tras su recuperación post-earnings, con short interest prácticamente extinto y analistas subiendo targets (Oppenheimer US$280). El corto plazo trae dos pruebas inmediatas: el lockup del 9-sep (hasta 319M acciones) y el reprogramado Starship Flight 14 (NET 15-sep, tras retrasarse desde 28-ago). El guidance de US$100 mil millones de run-rate y el riesgo regulatorio de xAI-Memphis son los focos de mediano plazo. Con el precio ya recuperando gran parte del terreno perdido y sin el mismo margen de seguridad que en agosto, conviene esperar confirmación de estos catalizadores antes de sumar posición. Confianza: media, por la corta historia de cotización y datos aún parcialmente no oficiales (fechas de earnings y lockups estimadas)."}, "scores": {"tecnica": {"score": 55, "just": "RSI 58,5 y MACD positivo sin sobrecompra extrema; precio sobre SMA20/50 pero con volumen bajo el promedio (ratio 0,56) y percentil 1y de solo 35,7% pese al rally, señal de consolidación más que de sobreextensión. No amerita nota alta por la volatilidad extrema (96,8% anualizada) y la falta de historial (SMA200 no disponible)."}, "fundamental": {"score": 62, "just": "El primer reporte público validó el modelo (revenue +92% YoY, pérdida reduciéndose, guidance de US$100 mil millones) y los contratos gubernamentales siguen creciendo. Persisten pérdida GAAP, capex elevado y un riesgo regulatorio/legal activo en xAI-Memphis no resuelto hasta jul-2027."}, "sentimiento": {"score": 52, "just": "Short interest colapsado a niveles residuales y consenso de analistas Comprar con targets al alza (Oppenheimer US$280) ya reflejan optimismo moderado, no extremo. La señal contraria de agosto se agotó; persisten advertencias de estacionalidad y presión de insiders para septiembre."}, "riesgo": {"score": 38, "just": "Doble evento de oferta en los próximos días (lockup 9-sep + tramos hasta dic-2026) y drawdown 1y de -46,35% con volatilidad 96,8% anualizada. El riesgo regulatorio de xAI-Memphis (turbinas sin permiso, demandas) es un riesgo de pérdida permanente no descontado del todo, sin margen de seguridad de valuación tras el rally."}, "conviccion": {"score": 45, "just": "Tesis parcialmente validada (earnings, contratos, Starlink), pero la asimetría se redujo tras el rally: upside a consenso ~50% vs un downside con soporte poco probado (activo de <3 meses) y dos catalizadores binarios inminentes (lockup 9-sep, Starship 15-sep) que pueden mover el precio en cualquier dirección."}}, "sources": ["Yahoo Finance / Investing.com, 07/09/2026 - Cotización SPCX $147.95, rango diario y 52 semanas", "The Motley Fool, 01/09/2026 - The SpaceX Stock Price Faces 3 Big Challenges in September", "The Motley Fool, 31/08/2026 - Circle Your Calendars: Sept. 9 lockup expiration (up to 319M shares)", "The Motley Fool, 05/09/2026 - What Move Will SpaceX Stock Make After Sept. 9? / Insiders Selling, Index Funds Buying", "Tesla Oracle, 02/09/2026 - Starship Flight 14 delayed to NET Sept. 15; Booster 21 33-engine static fire Aug. 28", "fintel.io / shortinteresttracker.com, principios sep-2026 - SPCX short interest ~0.1% trailing net short", "CNBC, 12/08/2026 - SPCX short interest falls from ~34-40% to ~11% of float", "Oppenheimer (vía MarketBeat/Yahoo Finance), 02/09/2026 - Price target raised to $280", "S&P Global / consenso de analistas, consultado 07/09/2026 - PT promedio $222.32, 35 analistas, rango $117-450", "SpaceNews / The Defense Post, fines jul-2026 - Space Force awards $1.6B for 18 Falcon 9 missions", "TechCrunch, 31/07/2026 - xAI Memphis unpermitted gas turbines, removal timeline to July 2027", "stockalarm.io / purepowerpicks.com, ago-2026 - SpaceX SPCX lock-up expiration schedule"], "opportunity": {"cats": {"valuacion_hist": {"score": 38, "just": "Tras el rally desde el mínimo post-earnings, el precio ya recuperó buena parte del terreno perdido (percentil 1y 35,7%); el margen de entrada relativo es menor que a mediados de agosto, sin historial suficiente para comparar contra promedios propios de largo plazo."}, "calidad": {"score": 68, "just": "Negocio validado por su primer reporte público (Starlink +92% YoY, contratos gubernamentales crecientes, moat de costo/cadencia), pero con riesgo regulatorio activo en xAI-Memphis y sin historial de rentabilidad GAAP."}, "asimetria": {"score": 50, "just": "Upside a consenso ~50% (US$147,95→US$222) vs downside a mínimo desde IPO (US$104,83, -29%); asimetría moderada pero con dos catalizadores binarios inminentes (lockup 9-sep, Starship 15-sep) que pueden mover el precio en cualquier dirección antes de definir tendencia."}, "catalizadores": {"score": 60, "just": "Ruta fechada clara en las próximas semanas: lockup 9-sep, Starship Flight 14 NET 15-sep, earnings Q3 estimado 5-nov con tramo de lockup asociado; mayor densidad de catalizadores que hace un mes, aunque con fechas aún no 100% oficiales."}, "contrarian": {"score": 35, "just": "El short interest ya colapsó a niveles residuales y los analistas suben targets en cadena (Oppenheimer, Argus); se agotó la señal contraria que existía pre-earnings, acercándose a optimismo consensuado."}}, "plan": {"recomendacion": "Esperar gatillo", "zona_compra": "US$115-130 en caso de retroceso hacia soporte post-lockup de agosto; evitar perseguir el precio actual antes de ver cómo se absorbe el lockup del 9-sep.", "invalidacion": "Cierre semanal bajo US$104,83 (mínimo desde IPO) o fallo/retraso severo de Starship Flight 14 combinado con guidance de Q3 muy por debajo del run-rate de US$100 mil millones.", "gatillos": ["Absorción del lockup del 9-sep sin repunte de short interest ni caída sostenida de precio", "Resultado real de Starship Flight 14 (NET 15-sep, sujeto a FAA)", "Confirmación de fecha y resultados del earnings Q3 2026 (~5-nov estimado)"], "horizonte": "6-18 meses", "tamano": "Posición pequeña-media, escalonada en retrocesos; alta volatilidad (96,8% anualizada) exige dimensionamiento conservador incluso para inversores con alta tolerancia al riesgo.", "confianza": "media"}}, "perfil": "SpaceX diseña y opera vehículos de lanzamiento (Falcon 9 y Starship), cápsulas Dragon, la constelación de banda ancha Starlink y la línea gubernamental Starshield; desde feb-2026 consolida además xAI. El dinero no viene del cohete sino del ancho de banda: sobre ingresos de ~$15-16 mil millones en 2025, Starlink aportó ~$11,8 mil millones con más de 10 millones de clientes en 160 mercados, mientras los lanzamientos (~82% del mercado comercial global) son la infraestructura de costo que hace viable desplegar la constelación. El segundo pilar es gubernamental: más de $22 mil millones acumulados con NASA, DoD y Space Force. Lo estructural: el moat es de costo y cadencia (reutilización más integración vertical), pero exige capex perpetuo — los satélites duran ~5 años, así que Starlink es una fábrica de reposición cuyo margen depende de que Starship abarate el kilo en órbita. Riesgos: espectro y licencias, dependencia de un cliente soberano y de su fundador, competencia de Kuiper y China, y la quema de caja de xAI."}, {"ticker": "BTC", "company": "Bitcoin", "statsList": [["Precio", "$79,209 (7-sep-2026)"], ["Rango 52 sem.", "US$57.748 – US$126.198"], ["Market cap", "~US$1,59 billones; dominancia BTC ~57,7% (CoinGecko/CoinMarketCap, 07/09/2026)"], ["Dominancia BTC", "~57,7-59,2% según fuente, estable en zona alta del año (CoinGecko/TV-Hub, 07/09/2026)"], ["Flujos ETF spot", "Semana 1-5/sep: +US$986,9M netos (tras -US$236,5M el 1-sep); IBIT lidera (SoSoValue/CoinDesk, 05/09/2026)"], ["Próximo evento", "Reunión del FOMC (decisión de tasas) — 16-sep-2026"], ["Técnico (auto)", "RSI 63.0 · MACD +2907.06 / señal +3253.97 (TradingView, 7-sep-2026)"]], "technical": {"price": 79209.22, "change_1d_pct": 0.13, "change_1w_pct": -1.42, "rsi": 63.0, "macd": 2907.0602, "macd_signal": 3253.9691, "sma20": 78465.2205, "sma50": 69969.3924, "sma200": 69872.4904, "ema12": 78627.7462, "ema26": 75720.686, "pct_vs_sma20": 0.95, "pct_vs_sma50": 13.21, "pct_vs_sma200": 13.36, "volume_today": null, "volume_avg20": null, OMC (decisión de tasas)", "kind": "macro", "time": "15:00", "info": "Anuncio de tasas 2:00pm ET + dot plot. El discurso hawkish de Warsh en Jackson Hole (28-ago) elevó la probabilidad de una SUBIDA de 25pb a ~57-60% (CME FedWatch) desde ~35% días antes, revirtiendo las apuestas previas de recorte; alta incertidumbre de mercado (CNBC/Forbes, 28-31/08/2026)."}], "sections": {"resumen": "BTC cotiza en US$79.176 (7-sep-2026, Yahoo Finance/Coinbase), consolidando tras el rally de agosto (+24-25%, mejor mes desde nov-2024) que lo llevó a superar US$81.000 el 25-ago por una intervención del Tesoro en bonos y liquidaciones forzadas de cortos. HECHO: el discurso hawkish de Kevin Warsh en Jackson Hole (28-ago) disparó las apuestas de una SUBIDA de tasas en septiembre a ~57-60% (CME FedWatch, CNBC 28-31/08/2026), provocando una caída desde US$81.455 hasta US$76.845 antes de estabilizarse. Los ETFs spot sumaron +US$986,9M netos en la semana 1-5/sep pese a un outflow inicial. LECTURA: el mercado pasó de euforia (Fear & Greed 73 el 2-sep) a Greed moderado (60 el 7-sep), reflejando cautela ante un FOMC con desenlace binario.", "fundamental": "- Market cap ~US$1,59 billones, dominancia BTC ~57,7-59,2%, en el tramo alto del año pese al repunte de altcoins puntual (CoinGecko/TV-Hub, 07/09/2026).\n- ETFs spot: semana 1-5/sep sumó +US$986,9M netos (tras -US$236,5M el 1-sep, +US$101,1M el 2-sep, +US$730,9M el 3-sep), parte de un acumulado de US$3,8Bn en 3 semanas, récord de 2026 (SoSoValue/KuCoin, 05/09/2026).\n- MVRV ~1,1, en zona considerada barata históricamente (cerca de niveles de 2015/2019/2022 si el precio retrocede a ~US$50.000) (CryptoQuant/KuCoin, ago-2026).\n- Hashrate ~1.001 EH/s (4-sep) con dificultad ~127,45T; ajuste a la baja estimado tras una caída de -10% en agosto, la segunda mayor de 2026 (CoinWarz/Yahoo Finance, 04-06/09/2026).\n- MicroStrategy (Strategy) reanudó compras tras 10 semanas de pausa: +4.603 BTC (~US$370M), holdings totales 845.050 BTC a costo promedio US$75.412 (Yahoo Finance, 01/09/2026).", "valuacion": "- Precio en percentil 32,4% del rango de 12 meses (dato ya calculado): recuperó terreno vs el piso de agosto pero lejos de niveles \"baratos\" extremos.\n- +3,5-15,2% sobre SMA20/50/200 (dato ya calculado): estructura de tendencia alcista intacta tras la reconquista de agosto.\n- Rango 52 semanas US$57.748-126.198: precio actual a ~63% desde el piso y ~37% bajo el techo del ciclo (Investing.com, 07/09/2026).\n- YTD -8,73% (dato ya calculado), mejorando fuerte desde el -28% de hace dos semanas pero aún en terreno negativo en el año.\n- Standard Chartered mantiene proyección de ~US$100.000 a fin de año; LECTURA: alcista de consenso, pero condicionado a que el FOMC no sorprenda con una subida.", "tecnico": "- RSI 67,1 en zona alta pero no extrema (dato ya calculado, TradingView 5-sep): se enfrió desde el 79-82 de sobrecompra de fines de agosto, señal sana de digestión del rally.\n- MACD +3.231 aún por sobre su señal (+3.398 cruzándose a la baja): momentum perdiendo fuerza tras el pico, coherente con la corrección de -6% desde el máximo de US$81.455.\n- Precio +14,6% sobre SMA200 y +15,2% sobre SMA50 (dato ya calculado): la reconquista de tendencia de agosto se mantiene pese al retroceso de la semana del FOMC hawkish.\n- Volatilidad 30d en 65,1% (dato ya calculado), elevada pero coherente con el rango de movimiento post-rally, no con pánico.\n- Percentil de precio 32,4% vs benchmark cripto total con desempeño relativo +0,96% a 30d (dato ya calculado): el rally sigue siendo levemente superior al mercado cripto general, no un caso aislado de debilidad relativa.", "catalizadores": "**Catalizadores:**\n- FOMC 16-sep: de confirmarse un recorte (escenario base previo a Jackson Hole) sería catalizador alcista; de subir tasas, sería el mayor riesgo bajista del trimestre.\n- Voto de cloture del CLARITY Act en el Senado (15-sep): de avanzar pese a la baja probabilidad (~10% según Galaxy Research), reduciría incertidumbre regulatoria.\n- Flujos ETF en racha de 3 semanas (+US$3,8Bn), con IBIT liderando; de sostenerse, refuerza la demanda institucional estructural.\n- MicroStrategy reanudando compras tras pausa de 10 semanas: señal de que el mayor comprador corporativo ve valor en el nivel actual.\n\n**Riesgos (por materialidad):**\n- Discurso hawkish de Warsh elevó a ~57-60% la probabilidad de SUBIDA de tasas en septiembre: shock potencial no descontado por el mercado hace dos semanas (CNBC, 28-31/08/2026).\n- El CLARITY Act puede volver a postergarse; persisten desacuerdos sobre ética y stablecoins entre demócratas y republicanos.\n- Reservas en exchanges reportadas al alza (~467.000 BTC movidos hacia exchanges, dato no verificado): posible presión de venta latente.\n- Concentración de ETFs en BlackRock/Fidelity (IBIT+FBTC ~85% del flujo) mantiene riesgo sistémico ante un evento de rescate o pánico regulatorio.", "sentimiento": "- Fear & Greed bajó de 73 (2-sep) a 60 (7-sep), moderando la \"Extreme Greed\" de fines de agosto sin caer a zona de miedo (Milk Road/CryptoRank, 02-07/09/2026).\n- LECTURA (contraria en extremos): el enfriamiento desde 73 hacia 60 sugiere toma de utilidades parcial, no pánico; zona media, sigue la evidencia técnica antes que el sentimiento puro.\n- ETFs con +US$986,9M en la semana pese a un outflow inicial de -US$236,5M el 1-sep: institucionales comprando la corrección, no vendiendo (HedgeCo/CoinDesk, 01-05/09/2026).\n- Ballena Satoshi-era movió 600 BTC (~US$47,8M) el 5-sep tras 15+ años dormidos; sin señal clara de venta inminente, más bien reactivación de wallets antiguas (Bitcoin.com, 05/09/2026).\n- MicroStrategy retomando compras (+4.603 BTC) tras pausa de 10 semanas es una señal institucional constructiva, contrastando con la cautela de corto plazo del mercado.\n\n**Flujos de capital: ETFs, institucionales y ballenas**\n| Fecha | Flujo neto | Detalle |\n|---|---|---|\n| 01/09/2026 | -US$236,5M | IBIT -201,2M, FBTC -43,7M, BITB +8,4M (peor día desde 31-jul) ( stimado US$0,50 (tasa anualizada 12% vigente desde jul-2026) (marketchameleon.com, 7-sep-2026)."}, {"date": "2026-09-30", "label": "Cierre de consulta pública MSCI sobre exclusión de índices", "kind": "corporate", "info": "MSCI recibe comentarios hasta el 30-sep sobre su propuesta de excluir 'non-operating companies' (incluye a Strategy) de sus índices; resultado esperado el 16-oct-2026. JPMorgan estima salidas pasivas de US$2,8 mil M (solo MSCI) a US$8,8 mil M si se extiende a Nasdaq 100/Russell (Benzinga, CoinDesk, ago-sep-2026)."}, {"date": "2026-11-04", "label": "Earnings Q3 2026", "kind": "earnings", "info": "Próximo reporte trimestral confirmado; en Q2 (30-jul) Strategy reportó pérdida neta de US$8,22 mil M, casi toda contable (mark-to-market no-cash de BTC) (Yahoo Finance, 30-jul-2026)."}], "sections": {"resumen": "MSTR subió +12,17% en la semana, siguiendo el rebote de BTC desde ~US$64k hacia ~US$79-80k. HECHO: Strategy retomó compras de BTC el 31-ago (+4.603 BTC) tras 10 semanas de pausa, holdings en 845.050 BTC a costo prom. US$75.412 — ahora el spot de BTC volvió a superar el costo promedio. mNAV recuperó a ~1,12x premium (desde 0,68x descuento en agosto), reactivando el motor de emisión acretiva. LECTURA: el riesgo de exclusión de índices MSCI (consulta hasta 30-sep, resolución 16-oct) sigue siendo el principal overhang no resuelto pese a la mejora de precio.", "fundamental": "- HECHO: 845.050 BTC a costo prom. US$75.412 (~US$63,7 mil M); reanudó compras netas el 31-ago tras la pausa más larga del año (The Block, 31-ago-2026).\n- HECHO: BTC Yield YTD cayó a 4,5% en Q2 (30-jul) desde 12,6% en mayo, reflejando el frenazo de emisión acretiva durante el período de descuento de mNAV.\n- HECHO: STRC mantiene dividendo anualizado 12%, próximo ex-dividend 15-sep-2026 (marketchameleon.com).\n- HECHO: Q2 2026 pérdida neta US$8,22 mil M, casi toda por mark-to-market no-cash de BTC bajo fair-value FASB; negocio de software estable.\n- LECTURA: el retorno a compras es señal de confianza operativa ahora que mNAV volvió a premium, revirtiendo la fase defensiva de julio-agosto.", "valuacion": "- HECHO: mNAV ~1,12x, dentro de rango 1y de 0,95x-1,43x (mnav.com, 7-sep-2026); ya no cotiza bajo el valor de sus BTC como en agosto.\n- HECHO: market cap ~US$54,8-56,7 mil M vs. valor de holdings BTC ~US$66-68 mil M a spot ~US$79-80k.\n- LECTURA: el mNAV en premium moderado reabre la ventana de emisión acretiva (ATM de comunes/preferentes) sin la fricción de vender BTC para financiarse.\n- HECHO: consenso analista con price target promedio ~US$225-252 (S&P Global/TipRanks vía stockanalysis.com, sep-2026), muy por sobre el precio spot US$142,55.", "tecnico": "- HECHO: precio US$142,80, RSI 66,2 (zona alta pero no sobrecomprada extrema), MACD +9,91 por sobre señal +7,20, momentum alcista confirmado (technical, 5-sep-2026).\n- HECHO: +23,6% sobre SMA20, +38% sobre SMA50, +2,7% sobre SMA200 — reconquista de todas las medias móviles tras el mínimo de agosto.\n- HECHO: percentil de precio a 1 año de 21,5% (desde 3,4% en agosto), mejora sustancial pero aún en el tercio inferior del rango anual.\n- HECHO: performance a 30 días +21,5% vs. BTC, superando al benchmark.\n- LECTURA: el rally es fuerte y de carácter (reconquista de SMA200), pero RSI 66 más MACD extendido sugiere vigilar sobrecompra si sigue acelerando sin pausa.", "catalizadores": "**Catalizadores:**\n- Continuidad del rebote de BTC sobre US$80k reforzaría el mNAV premium y permitiría reactivar emisión acretiva a mayor escala.\n- Resolución de la consulta MSCI (comentarios hasta 30-sep, decisión 16-oct) — un resultado favorable eliminaría el principal overhang de flujos pasivos.\n- Reversión sostenida a compras semanales de BTC (recién reiniciadas el 31-ago) señalizaría normalización del ciclo de acumulación.\n- Earnings Q3 (4-nov) mostrará si el BTC Yield se recupera tras el mínimo de 4,5% de Q2.\n\n**Riesgos (por materialidad):**\n- Exclusión de índices MSCI (y potencialmente Nasdaq 100/Russell) gatillaría salidas pasivas estimadas en US$2,8-8,8 mil M (JPMorgan vía Benzinga/CoinDesk).\n- Reversión de BTC por debajo del costo promedio (US$75.412) volvería a poner el mNAV en descuento y frenaría la emisión.\n- Dilución continua vía ATM de preferentes (STRC/STRK/STRF/STRD) y comunes si el mercado exige mayor prima por riesgo.\n- Alta correlación 1:1 con BTC implica que cualquier corrección cripto amplifica pérdidas contables y presión de valuación en MSTR.", "sentimiento": "- HECHO: consenso analista 'Strong Buy' (14 compra, 1 mantener, 0 venta), price target promedio ~US$225-252, +58% a +77% sobre spot (S&P Global/TipRanks, sep-2026).\n- HECHO: retorno a compras de BTC generó titulares positivos ('We're Back' — Saylor en X, 31-ago) tras semanas de narrativa negativa por la pausa y venta de agosto.\n- LECTURA: el consenso extremadamente alcista de analistas, tras meses de pesimismo en agosto, reduce el margen de sorpresa positiva — vigilar si se vuelve señal contraria si el rally se sobrecalienta.\n- HECHO: acción +12,2% semanal, superando ampliamente el benchmark BTC en el mes (+21,5% relativo a 30 días).", "conclusion": "MSTR retomó su rol de derivado apalancado alcista de BTC: rebote de BTC hacia US$80k revirtió el mNAV a premium (~1,12x) y reactivó las compras de tesorería tras la pausa de agosto. La tesis sigue atada casi 1:1 al precio de BTC, con el riesgo de exclusión de índices MSCI (resolución 16-oct) como el principal catalizador binario pendiente. El técnico muestra momentum genuino (reconquista de todas las SMAs) aunque RSI 66 exige vigilar sobrecompra. Confianza media-alta: datos de treasury y mNAV verificables, pero el desenlace MSCI y la sostenibilidad del rally de BTC son inciertos."}, "scores": {"tecnica": {"score": 62, "just": "MACD y reconquista de SMA20/50/200 confirman cambio de carácter genuino tras el mínimo de agosto (percentil pasó de 3,4% a 21,5%); RSI 66,2 aún no está en zona de sobrecompra extrema (>75), pero el rally acumula +45,8% en el mes, exigiendo cautela ante extensión vertical."}, "fundamental": {"score": 55, "just": "Retorno a compras netas de BTC (845.050 BTC) y mNAV vuelto a premium (1,12x) revierten la fase defensiva de julio-agosto; BTC Yield YTD sigue bajo (4,5% en Q2) vs. picos de 12-13% de mayo, aún sin confirmar recuperación en Q3."}, "sentimiento": {"score": 45, "just": "Consenso analista unánimemente alcista (Strong Buy, targets 60-77% sobre spot) tras meses de pesimismo en agosto — leído en contrario, el optimismo generalizado actual deja menos margen de sorpresa positiva y más riesgo de decepción si BTC o MSCI generan mal desenlace."}, "riesgo": {"score": 40, "just": "Riesgo de exclusión de índices MSCI activo (decisión 16-oct, hasta US$8,8 mil M de flujos pasivos en juego) y dependencia binaria de BTC persisten; el mNAV en premium moderado reduce el riesgo de dilución forzada visto en agosto, mejorando el balance frente al trimestre anterior."}, "conviccion": {"score": 50, "just": "Asimetría mejoró vs. agosto (BTC ya sobre el costo promedio de MSTR, mNAV en premium) pero el precio ya capturó gran parte del rebote (+45,8% mensual); la tesis de mediano plazo depende de que MSCI no excluya a Strategy y de que BTC sostenga niveles sobre US$75-80k."}}, "sources": ["The Block, 31/08/2026 - 'We're back': Strategy buys another 4,603 bitcoin for $369.7 million as holdings hit 845,050 BTC", "The Motley Fool, 03/09/2026 - Strategy Buys $370M in Bitcoin After 2-Month Pause, Boosting Total Holdings to 845,050 Coins", "The Block, 17/08/2026 - Strategy sells $334 million in MSTR shares, makes no bitcoin purchases or sales as USD reserve hits $4.8 billion", "CoinDesk, 10/08/2026 - Strategy sells 1,690 bitcoin, raises $653 million from MSTR shares", "mNAV.com, 07/09/2026 - Strategy (MSTR) mNAV 1.12x — Live Premium to Bitcoin NAV", "CNBC, 07/09/2026 - MSTR real-time stock quote", "Robinhood / Yahoo Finance, 07/09/2026 - Strategy Inc. market cap", "Yahoo Finance, 07/09/2026 - Bitcoin and ethereum prices today, Monday, September 7, 2026", "Benzinga, 01/09/2026 - Strategy Slams MSCI Rule as a 'Pretext' to Exclude Bitcoin Companies", "CoinDesk, 14/08/2026 - Bitcoin holding firms Strategy and Metaplanet face stock-index exclusion under MSCI's new proposal", "CryptoTimes, 01/09/2026 - Michael Saylor's Strategy Challenges MSCI Over Proposed Index Exclusion Rules", "marketchameleon.com, 07/09/2026 - STRC Dividend Information (next ex-div 15-sep-2026)", "Coinpaper, 30/07/2026 - Michael Saylor's Strategy Reports 2026 BTC Yield of 3.7%-4.5% Amid Q2 Loss", "stockanalysis.com, 07/09/2026 - Strategy (MSTR) Stock Forecast & Analyst Price Targets", "Yahoo Finance, 30/07/2026 - Strategy lost $8.22 billion in Q2, but stock rose 4.4% anyway"], "opportunity": {"cats": {"valuacion_hist": {"score": 45, "just": "mNAV ~1,12x está dentro de su rango normal (0,95x-1,43x en 1 año), ya no en el extremo barato de agosto (0,68x); percentil de precio 1y de 21,5% indica que aún no es caro vs. su propio historial reciente, pero el descuento profundo ya se cerró."}, "calidad": {"score": 55, "just": "845.050 BTC intactos y en crecimiento (retorno a compras), negocio de software estable como ancla contable; persiste la dependencia estructural de acceso a mercados de capital y la obligación perpetua de servicio de preferentes."}, "asimetria": {"score": 55, "just": "Con BTC ya sobre el costo promedio de MSTR (US$75.412) el apalancamiento opera a favor; pero tras +45,8% mensual gran parte del re-rating ya ocurrió, y una resolución adversa de MSCI o caída de BTC revertiría rápido la ganancia — asimetría moderada, no extrema en ningún sentido."}, "catalizadores": {"score": 60, "just": "Ruta fechada clara: resolución MSCI el 16-oct-2026, earnings Q3 el 4-nov-2026, y actualizaciones semanales de tesorería que confirmarán si las compras se sostienen — calendario con catalizadores concretos en 6-18 meses."}, "contrarian": {"score": 35, "just": "El sentimiento pasó de pesimismo extrem lúmenes consolidados +1,8% (press release 1Q26 / TipRanks / La Tercera, may-2026).\n- HECHO — **Chile, el motor**: ventas +3,9%, EBITDA +13,7% a CLP 107.357 millones, margen 20,0% (+173 pb), ayudado por la apreciación del CLP de 8,1% vs USD (menores costos dolarizados) y volúmenes +3,9% liderados por categorías no alcohólicas (press release 1Q26, may-2026).\n- HECHO — **Negocios Internacionales** (Argentina, Bolivia, Paraguay, Uruguay): ventas −6,7%, EBITDA −18,6% a CLP 28.489 millones; volúmenes −1,7% con caída de un dígito medio en cerveza en Argentina (press release 1Q26).\n- HECHO — **Vinos**: ventas −7,2%, EBITDA −50,1% a CLP 3.288 millones (margen −508 pb) por mayor costo del vino y sobreoferta global (~US$19B de inventario excedente en la industria) (press release 1Q26; DF, 12-jun-2026).\n- HECHO: TTM en USD (ADR): revenue US$3,13B (−2,2%), utilidad neta US$121,8M (−32,0%); ROE 7,3-7,9%; Deuda/Patrimonio 0,71x (StockAnalysis 20-jul-2026; Visfin jul-2026).\n\n**Propiedad y movimientos corporativos:**\n\n- HECHO: IRSA controla el 65,87% de CCU; IRSA es JV 50/50 entre Quiñenco y Heineken. Free float: 20,04% local + 14,09% ADR (ccuinvestor.com, 2026).\n- HECHO: CCU completó la compra de la participación de Nestlé en el JV de aguas por US$180 millones (DF, 12-jun-2026).\n- HECHO: Eduardo Ffrench-Davis asumió como CEO el 1-jul-2026 tras 28 años de Patricio Jottar, quien pasa al directorio; Alexandre Carreteiro (presidente de Heineken Américas) fue nombrado vicepresidente del directorio (TipRanks, jul-2026).\n- LECTURA: el negocio chileno (dos tercios del EBITDA) está en su mejor momento de márgenes en años; el problema de CCU no es operacional en su core, sino la exposición a Argentina y al ciclo global del vino. La mayor injerencia de Heineken en el directorio puede traer disciplina de márgenes o tensión con Quiñenco — sin evidencia de conflicto por ahora.", "valuacion": "- HECHO: P/E trailing 17,25x local / 16,9-18,4x ADR; forward ~15x (BTG estima 13,3x); EV/EBITDA 8,66x (Investing/Visfin/StockAnalysis, jul-2026).\n- HECHO: la acción transa **~20% por debajo de su promedio de valuación de los últimos 10 años** (DF, 12-jun-2026).\n- HECHO: dividend yield ~3,0% local (dividendo definitivo N°272 de $74,53 por acción pagado desde el 24-abr-2026) (TipRanks/Diario Estrategia, abr-2026).\n- HECHO — targets locales: consenso **$5.877 CLP (+11%)**, máx $6.600, mín $4.365; 2 buy / 4 hold / 4 sell (Investing.com, jul-2026). Casas (DF, 12-jun-2026): **BICE Sobreponderar PO $7.794 (+52%)**, **BTG Neutral PO $6.500**, **UBS Vender PO $4.750** (argumenta crecimiento de ingresos de un dígito hasta 2028).\n- HECHO: ADR consenso Hold, target US$12,46 (+10,8%, 7 analistas) (StockAnalysis, 20-jul-2026).\n- LECTURA: la valuación es el corazón de la tesis alcista — múltiplos comprimidos contra la propia historia con un IPSA que transa ~12% caro vs la suya. Pero el descuento tiene causa: el upside depende de que Argentina y Vinos se normalicen, no del negocio chileno que ya opera bien y está en el precio. La dispersión BICE/UBS (de +52% a −7%) refleja exactamente esa apuesta.", "tecnico": "- HECHO: precio $5.285 CLP, +1,28% en la sesión del lunes 20-jul y +1,63% vs 5 ruedas atrás (TradingView tiempo real, 20-jul-2026).\n- HECHO: RSI(14) diario 56,3 — neutral con sesgo alcista; MACD(12,26,9) +12,6 sobre señal −1,0 (histograma +13,6): **cruce alcista reciente** (calculado sobre 130 barras diarias de TradingView, 20-jul-2026).\n- HECHO: precio sobre la SMA20 (~$5.183, +2,0%) y SMA50 (~$5.204, +1,6%), y justo en la SMA100 (~$5.285); bajo la MM200 publicada (~$5.670) (TradingView 20-jul-2026; Visfin jul-2026).\n- HECHO: señal técnica diaria \"Strong Buy\", semanal neutral (Investing.com, jul-2026). Mínimo de 52 semanas $4.947 tocado a inicios de mayo; desde ahí, piso doble en la zona $5.000-5.050 (jun y feb).\n- LECTURA: estructura de base tras 12 meses bajistas (−16,6% en las últimas ~26 semanas). Soportes: $5.183-5.204 (SMA20/50) y $5.000-4.947; resistencias: $5.443 (máximo intradía del 20-jul), $5.670 (MM200) — su recuperación sería la confirmación de cambio de tendencia — y la zona $6.600. El cruce de MACD con RSI aún lejos de sobrecompra deja espacio al rebote, pero mientras siga bajo la MM200 es un rebote dentro de tendencia bajista, no una tendencia alcista nueva.", "catalizadores": "- HECHO: **resultados 2T26 el 6-ago-2026** (StockAnalysis, jul-2026). LECTURA: trimestre de invierno, estacionalmente débil en volúmenes; el foco estará en si Chile sostiene margen 20% y en el ritmo de deterioro/mejora argentino.\n- HECHO: **nuevo CEO** Eduardo Ffrench-Davis desde el 1-jul-2026, con prioridad declarada en márgenes y eficiencia; renovación de comités del directorio entre julio y agosto (DF 12-jun-2026; TipRanks jul-2026). LECTURA: primer plan estratégico del nuevo management es el catalizador idiosincrático más cercano.\n- HECHO: **tipo de cambio** — USD/CLP ~926 (14-jul-2026), con el CLP apreciado 8,1% vs USD en 1T26: viento a favor directo en costos dolarizados del segmento Chile (dolarhoy.net; press release 1Q26).\n- HECHO: **insumos** — aluminio LME ~US$3.160-3.200/t con inventarios −43% en el año y déficit proyectado (~930 kt según Macquarie); cebada y lúpulo europeos +12-18% de costo desembarcado en 1T26 (TradingEconomics/AgMetalMiner/Expert Market Research, jul-2026).\n- HECHO: **Argentina** — consumo masivo −3,3% acumulado en 2026, pero inflación mensual desacelerando (<2% proyectado para julio) y expectativa de recuperación gradual del consumo en 2S26 (Bloomberg Línea/Infobae, jun-2026). LECTURA: la recuperación argentina es la opción de mayor convexidad de la tesis.\n- HECHO: **macro Chile** — PIB 1T26 −0,5% a/a, Imacec de mayo −0,9% (quinto retroceso consecutivo), Banco Central recortó el crecimiento 2026 hacia ~1%, riesgo de recesión técnica (Emol/Bloomberg/XTB, mar-jul 2026). LECTURA: el 1T26 se benefició de un consumo chileno que ya no acelera — el viento de cola doméstico se está apagando.", "sentimiento": "- HECHO: consenso local Neutral con 2 buy / 4 hold / 4 sell y PO $5.877 (Investing, jul-2026); ADR Hold con target US$12,46 (StockAnalysis, 20-jul-2026). El DF tituló (12-jun-2026): \"Argentina y alta exposición a vinos y cervezas hacen dudar al mercado\".\n- HECHO: noticias de los últimos 45 días — cierre de la compra del JV de aguas a Nestlé (US$180M, jun), cambio de CEO y reordenamiento del directorio con mayor presencia de Heineken (1-jul), y entrada en vigencia de nuevas restricciones a la publicidad de alcohol en Chile el 7-jul-2026.\n- HECHO: contexto IPSA — el índice acumula ~70 máximos históricos en el año, transa ~12% más caro que su historia, con flujos extranjeros récord (US$112M vía el principal ETF en el año) y targets como el de Bci en 12.050 puntos; el optimismo se moderó en julio por el débil crecimiento (DF/Emol/Bloomberg, 2026).\n- LECTURA: el contraste es la historia — el IPSA en máximos mientras CCU está 20% bajo su peak la convierte en uno de los grandes laggards del rally chileno. Eso sostiene el argumento de valuación relativa (BICE), pero 4 de 10 analistas locales recomiendan vender: el mercado no compra la normalización de Argentina y Vinos todavía. Sin datos públicos de posicionamiento institucional o insiders para el papel local.", "conclusion": "CCU es una apuesta de valuación y reversión a la media, no de momentum: negocio core chileno en su mejor nivel de márgenes, múltiplos 20% bajo su historia, 3% de yield, y dos lastres (Argentina, Vinos) que explican el descuento y cuya normalización — no garantizada — es el upside. El técnico acompaña por primera vez en meses (cruce de MACD, sobre SMA20/50, doble piso en $5.000) pero la MM200 en $5.670 sigue arriba como techo de la tendencia. Con el consenso en Hold y el IPSA caro, el papel ofrece asimetría razonable bajo $5.300 con soporte claro en $5.000, catalizador fechado el 6-ago (2T26) y la incógnita del plan del nuevo CEO. La señal es **Hold** con sesgo constructivo: para pasar a Buy se necesita recuperar la MM200 y/o evidencia de que Argentina dejó de drenar EBITDA; para venderla, perder los $5.000 que ya defendió dos veces."}, "scores": {"tecnica": {"score": 60, "just": "Rebote con confirmación: cruce alcista de MACD, RSI 56 con espacio, precio sobre SMA20/50 y doble piso defendido en $5.000. Se descuenta porque sigue bajo la MM200 ($5.670) y 20% bajo el máximo de 52 semanas — es una base dentro de tendencia bajista, aún no una tendencia alcista."}, "fundamental": {"score": 62, "just": "Chile (dos tercios del EBITDA) con margen 20% y EBITDA +13,7%, balance sano (D/E 0,71x) y valuación 20% bajo su media histórica con 3% de yield. Los lastres pesan: Argentina −18,6% y Vinos −50,1% de EBITDA, utilidad total −6,8% y ROE mediocre (~7,5%)."}, "sentimiento": {"score": 46, "just": "Consenso tibio con 4 de 10 analistas locales en venta, laggard notorio del rally IPSA y titulares de prensa escépticos (\"hacen dudar al mercado\"). A favor: dispersión de targets con el extremo alcista (BICE +52%) bien argumentado y flujos extranjeros récord hacia la bolsa chilena que eventualmente rotan a rezagados."}, "riesgo": {"score": 50, "just": "Negocio defensivo de consumo básico con 65% del mercado cervecero chileno y controlador sólido (Quiñenco/Heineken), pero triple exposición adversa: macro chilena deteriorándose (5 Imacec negativos), Argentina sin piso confirmado, sobreoferta global de vino, más costos de aluminio y cebada al alza y nuevas restricciones publicitarias vigentes desde el 7-jul."}, "conviccion": {"score": 55, "just": "Catalizadores concretos y fechados (2T26 el 6-ago, plan del nuevo CEO, recuperación argentina en 2S26) y tesis falsable con niveles claros ($5.000 abajo, MM200 $5.670 arriba). La convicción es media porque el timing de la normalización de Argentina y Vinos es incierto y el consenso lleva meses sin comprarla."}}, "sources": ["TradingView — BCS:CCU tiempo real, 130 barras diarias; RSI/MACD/SMA calculados (20-jul-2026)", "Inves ce -5,55pp vs S&P 500 en 30d, pero +40,2pp YTD (+52,9%).\n- Activo nuevo: volatilidad/Sharpe/Sortino aún \"Acumulando datos\".", "catalizadores": "**Catalizadores:**\n- Earnings Q3 FY26 el 14-oct-2026: confirmar guidance €11,0-12,0B/margen 55-57%.\n- Ramp High-NA EUV (Intel, Samsung) con +30% de capacidad EUV/DUV para 2027.\n- Ciclo HBM/DRAM acelerando: memoria ya supera a lógica en pedidos.\n- Guidance 2027 ya elevado en julio, espacio a nuevas alzas si sostiene el ritmo IA.\n\n**Riesgos (por materialidad):**\n- MATCH Act (EE.UU.) buscaría extender restricciones de exportación también a equipos DUV.\n- China cae a ~20% de ventas 2026 (vs 33% en 2025), podría seguir bajando.\n- Shanghai Aishengna (ligada a SMEE) ya fabrica DUV de inmersión, aún ~4 generaciones atrás.\n- Valuación exigente (forward ~31,5x, GF Value -45,5%) deja poco margen ante desaceleración del capex IA.", "sentimiento": "- HECHO: la acción cayó -18% en julio pese a superar Q2 y elevar guidance -por temor al chip propio de Anthropic (-7,4% el 1-jul) y luego por avance DUV chino (-5,8% el 27-jul) (Motley Fool, 04-ago-2026).\n- HECHO: consenso unánime Strong Buy (44 analistas), target ~22% sobre precio actual (S&P Global, jul-2026).\n- LECTURA: la brecha entre pánico por titulares lejanos y fundamentales que mejoran sugiere sobrerreacción de corto plazo.\n- HECHO: 22 gurús premium (GuruFocus) con flujo neto positivo: 14 sumaron vs 10 recortaron.\n- LECTURA: consenso ya muy optimista, sin disidencia, limita el componente contrarian puro.", "conclusion": "ASML combina un cuasi-monopolio en litografía EUV con un ciclo de memoria/IA que recién acelera (memoria ya supera a lógica en pedidos) y guidance elevado dos veces en 2026 más un 2027 mejorado. La corrección de julio (-18%) respondió a titulares de competencia lejana más que a deterioro real: RSI neutral y percentil 79 muestran consolidación sana. El riesgo genuino es regulatorio (MATCH Act) y de valuación (forward ~31,5x, GF Value -45,5%), no de tes ", "fetched_at": "2026-09-07T21:37:58-03:00"}, "benchmark": {"origin": "TradingView scanner", "symbol": "SP:SPX", "fetched_at": "2026-09-07T21:37:58-03:00"}, "risk_metrics": {"origin": "data/history/ASML.json", "n_days": 8}}, "metricChanges": [], "perfil": "ASML diseña, fabrica y da servicio a los sistemas de litografía que imprimen los patrones de los circuitos sobre obleas de silicio, y los vende a un puñado de fabricantes de chips: TSMC, Samsung, Intel, Micron, SK Hynix y SMIC, junto con metrología y software de litografía computacional. Es el único proveedor mundial de EUV, incluida la generación High-NA. En 2025 facturó 32.700 millones de euros con margen bruto de 52,8% y utilidad neta de 9.600 millones (FY2025); unos 24.500 millones vinieron de venta de sistemas, de los cuales EUV fue 48% (11.600 millones, 48 unidades), y 8.200 millones de Installed Base Management, servicio y upgrades que crecieron 26% y estabilizan el ciclo. China aportó 33% de las ventas anuales. Siempre debe vigilarse la concentración extrema de clientes, la ciclicidad del capex de semiconductores mitigada por un backlog de 38.800 millones, la dependencia de proveedores únicos como Zeiss y Cymer, y el régimen de licencias de exportación holandés y estadounidense."}, {"ticker": "TTWO", "company": "Take-Two Interactive Software, Inc.", "statsList": [["Precio", "$214.69 (7-sep-2026)"], ["Rango 52 sem.", "$187,63 – $265,94"], ["Market cap", "~US$47.330M (stockanalysis.com, 10-ago-2026)"], ["P/E", "N/A trailing (pérdida GAAP) / ~34,5x forward (stockanalysis.com, 10-ago-2026)"], ["Target consenso", "~US$284-291 promedio (rango US$170-368), 27-29 analistas, Strong Buy (Investing.com/stockanalysis.com, 10-ago-2026)"], ["Próx. earnings", "11-nov-2026 (Q2 FY27), previo al lanzamiento de GTA VI (19-nov-2026)"], ["Técnico (auto)", "RSI 31.3 · MACD -6.56 / señal -3.83 (TradingView, 7-sep-2026)"]], "reportDate": "10 de agosto de 2026", "change": {"day": 0.26, "week": -8.79}, "events": [{"date": "2026-11 io 20d: la caída ocurre sin confirmación de pánico vendedor masivo.", "catalizadores": "**Catalizadores:**\n- Earnings Q1 FY27 (~10-sep-2026): confirmación de guidance cloud +58%/+64% y del margen OCI.\n- Rampa de ~1GW de capacidad de datacenter en Q1 FY27 y ~3GW adicionales en el año.\n- Activación formal del contrato OpenAI (US$300.000M/5 años) desde 2027.\n- Partnership con Google Cloud y Gemini AI en Oracle Fusion/NetSuite (ago-2026), que ya impulsó un rally de +13% en 5 ruedas.\n\n**Riesgos (por materialidad):**\n- Downgrade de crédito S&P a BBB- (9-jul-2026); CDS a 5 años en récord histórico.\n- ~50-54% del RPO depende de un solo cliente (OpenAI), con capacidad de pago incierta (IPO postergado a 2027).\n- Márgenes brutos de ~16% en contratos cloud IA; FCF FY26 negativo ~-$24.000M.\n- Compromisos de leasing de datacenters por ~$248.000-261.000M a 15-20 años, fijos pese a la demanda futura.", "sentimiento": "- HECHO: consenso analista sigue en Buy (mayoría de 44 analistas), con downgrades (Piper Sandler, Melius) y upgrades (DA Davidson) simultáneos en jul-2026 (tipranks.com).\n- HECHO: demanda class-action en curso por presunto engaño sobre el retorno de la inversión en IA; lead plaintiff designado 27-abr-2026 (investmentnews.com).\n- LECTURA: prensa la describe como \"poster child\" del miedo a burbuja de IA, cobertura negativa en jun-jul-2026 girando a optimismo técnico en la primera semana de ago-2026 (Yahoo Finance/TradingKey).\n- HECHO: sin ventas directas recientes de Larry Ellison; su exposición es vía acciones pignoradas, no ventas (The Motley Fool, 29-jul-2026).", "conclusion": "Oracle combina un backlog de IA sin precedentes ($638.000M de RPO, +363% i.a.) con un deterioro real de calidad crediticia (downgrade a BBB-, CDS en récord) y márgenes de nube IA bajos (~16%), financiados con deuda creciente. La caída de hoy (-3,24%) ocurre con volumen bajo y sin catalizador nuevo, mientras el técnico (RSI neutral, MACD girando, percentil 13,7%) sugiere capitula  y percentil de precio 67,8% del último año, zona media-alta sin extremos. LECTURA: el evento dominante a 1 día vista es la RPM del BCCh de mañana 08-sep (mantención esperada en 4,5%), seguida por el FOMC del 16-sep donde el mercado ahora pricea probabilidad relevante de ALZA (no recorte) tras payrolls de agosto muy fuertes — un giro hawkish en EEUU que sostiene al USD globalmente pese a un cobre firme (~US$6,6/lb) que favorece estructuralmente al peso."}, {"title": "Diferencial de tasas y política monetaria", "nav": "Tasas", "body": "HECHO: el Grupo de Política Monetaria recomendó el 07-sep-2026 mantener la TPM en 4,5%; la RPM decide mañana 08-sep, con consenso de mercado en mantención y primer recorte no esperado antes de ~11 meses, a 4,25% (La Tercera/Chócale, 07-sep-2026). HECHO: la Fed mantiene 3,50%-3,75% desde jul-2026, pero tras el dato de payrolls de agosto (+162k vs +53k esperado, desempleo 4,1%, CNBC 04-sep-2026) y comentarios hawkish del chair Kevin Warsh, el mercado asigna ~55-59% de probabilidad a un ALZA de 25pb en el FOMC del 16-sep (CNBC, 31-ago y 04-sep-2026). LECTURA: el diferencial nominal (~75-100pb a favor de Chile) se estrecha en términos de expectativas si la Fed sube, lo que es un giro hawkish relevante que sostiene al USD frente al informe previo (que asumía sesgo a recortes Fed)."}, {"title": "Balanza de pagos y flujos", "nav": "Balanza", "body": "HECHO: el cobre cotiza en US$6,55-6,60/lb (Trading Economics, 07-sep-2026) / US$6,74/lb en LME (BioBioChile, 07-sep-2026), tras tocar máximo histórico de US$6,86/lb el 06-ago-2026. HECHO: el superávit comercial de Chile en agosto fue de US$1.453-1.688M (+8,8% interanual según Infobae), pero las exportaciones de cobre CAYERON 3,2% y su valor bajó a US$4.625M (vs US$4.779M en ago-2025), reflejando menor volumen pese a precio alto (Rumbo Minero/Infobae, 07-sep-2026). LECTURA: el estrechamiento relativo del superávit y la caída de volumen exportado de cobre matizan el soporte cambiario del precio del metal — términos de intercambio siguen favorables pero con menos impulso de flujo físico que hace un mes."}, {"title": "Posicionamiento", "nav": "Posicionamiento", "body": "No aplica COT tradicional para este par (sin futuros regulados con reporte CFTC). Proxy: forwards de no residentes alcanzaron un pico récord de ~US$20.000M netos cortos en CLP a inicios de jul-2026 (máximo desde fin-2020, duplicando los ~US$10.000M de feb-2026); posteriormente hubo episodios de normalización parcial (compras de ~US$1.400M en tres días) y también un error de un informante que el BCCh debió corregir (Diario Financiero, jul-ago-2026). HECHO adicional: la banca residente pasó de neta corta USD (-US$2.400M, fin-2025) a neta larga USD +US$4.300M (10-ago-2026), sumando ~US$7.000M de giro en 7 meses (Outsider/Diario Financiero, ago-2026). LECTURA: el posicionamiento agregado (no residentes + banca local) sigue sesgado en contra del peso, aunque con más ruido y correcciones que en jul-2026; extremos de este tipo mantienen riesgo de reversión si el catalizador (RPM o cobre) sorprende dovish para el USD."}, {"title": "Análisis técnico", "nav": "Técnico", "body": "RSI 57,4 (TradingView, 5-sep-2026), zona neutra-alta sin sobrecompra. MACD (+3,43) sobre su señal (+1,48), momentum alcista de corto plazo intacto. Precio 1,0% sobre SMA20, 0,7% sobre SMA50 y 2,8% sobre SMA200 — estructura alcista en los tres plazos, a diferencia del mes anterior cuando estaba bajo la SMA20. Volumen 15% bajo el promedio de 20 días (ratio 0,85), convicción moderada. Percentil de precio del último año en 67,8% (subió fuerte desde 49,3% a inicios de sep, ver metricChanges), zona media-alta. Volatilidad 30d 12,75%, Sharpe -0,04 (retorno ajustado a riesgo plano en la ventana), drawdown máximo 1 año -12,64%. LECTURA: el salto reciente del RSI (de 43 a 65 en pocos días) y del percentil de precio (de 49% a 70%) muestra un cambio de carácter hacia sesgo alcista, coherente con el giro hawkish de la Fed; sin señales aún de sobreextensión (RSI <75)."}, {"title": "Intervención y riesgo de banco central", "nav": "Intervención", "body": "El Programa de Reposición y Ampliación de Reservas (compras hasta US$25M diarios, feb-ago 2026) venció el 07-ago-2026 sin renovación explícita bajo el mismo formato; en su lugar, el BCCh renovó en agosto-2026 una Línea de Crédito Flexible con el FMI por US$11.800M (monto menor a la anterior), como parte de la estrategia de recomponer gradualmente reservas propias — a la fecha se han acumulado US$5.805M bajo el programa (BCCh/El Periodista, ago-2026). El BCCh reitera que esto NO es intervención cambiaria discrecional. LECTURA: el retiro del comprador estructural diario de USD (programa de reservas) es un sesgo levemente bajista marginal para el par, parcialmente compensado por la menor Línea FMI, que reduce la necesidad de reservas propias adicionales en el margen."}, {"title": "Correlaciones macro", "nav": "Correlaciones", "body": "El DXY rebotó a ~99,3 (07-sep-2026) desde un mínimo de 2 semanas, impulsado por los payrolls de agosto muy sobre lo esperado que fortalecieron expectativas de política monetaria más restrictiva en EEUU (Trading Economics, 07-sep-2026). El USD/CLP muestra un desempeño relativo de +3,06% a 30 días y +2,91% YTD respecto al DXY (benchmark del dashboard) — el peso se ha comportado más débil que lo que sugeriría solo el dólar global, coherente con el posicionamiento corto estructural en CLP. La correlación negativa con el cobre (históricamente -0,6 a -0,8) sigue vigente pero atenuada: el cobre fuerte no ha logrado apreciar al peso en la magnitud esperada, señal de que el diferencial de tasas y el posicionamiento dominan en el margen."}, {"title": "Conclusión", "nav": "Conclusión", "body": "El USD/CLP opera en 931,25, con estructura técnica ahora alcista en los tres plazos (sobre SMA20/50/200) y RSI en zona neutra-alta. El catalizador inmediato es la RPM del BCCh de mañana 08-sep (mantención esperada en 4,5%), seguido por el FOMC del 16-sep, donde el mercado ha girado a pricear probabilidad relevante de ALZA de tasas Fed —no recorte— tras payrolls de agosto muy fuertes, lo que sostiene al USD globalmente pese al cobre firme (~US$6,6/lb). Posicionamiento corto en CLP sigue elevado (con matices de normalización parcial), manteniendo riesgo de reversión. Sesgo neutral con inclinación alcista táctica hasta conocer la RPM y el tono del FOMC."}], "scoreIndex": 8, "customCats": [{"key": "tasas", "name": "Diferencial de Tasas y Política Monetaria", "weight": 30}, {"key": "macro", "name": "Fundamentales Macro", "weight": 20}, {"key": "tecnico", "name": "Técnico", "weight": 20}, {"key": "posicionamiento", "name": "Posicionamiento y Sentimiento", "weight": 15}, {"key": "intervencion", "name": "Riesgo de Intervención / Cola", "weight": 15}], "scores": {"tasas": {"score": 62, "just": "Giro hawkish relevante en la Fed (mercado asigna ~55-59% a un alza en sep-2026, no a un recorte) tras payrolls fuertes de agosto sostiene al USD; BCCh mantendría en 4,5% mañana, sin cambios en el diferencial base (Fed más restrictiva = positivo para USD en este par)."}, "macro": {"score": 42, "just": "Cobre firme (~US$6,6/lb) sigue siendo negativo para el USD en este par, pero exportaciones de cobre cayeron 3,2% en agosto y el superávit comercial se estrechó, matizando el soporte estructural al CLP frente al informe anterior."}, "tecnico": {"score": 63, "just": "Estructura alcista consolidada: precio sobre SMA20/50/200, MACD sobre señal, RSI 57,4 sin sobrecompra; salto reciente de percentil (49%→68%) y RSI (43→65) confirma cambio de carácter hacia el USD, aún sin sobreextensión."}, "posicionamiento": {"score": 58, "just": "Posicionamiento no residente sigue neto corto en CLP aunque con episodios de normalización parcial desde el pico de ~US$20.000M de jul-2026; banca residente giró a neta larga USD (+US$4.300M, ago-2026), sumando presión, pero el extremo ya parcialmente conocido reduce el efecto marginal contrarian."}, "interven
