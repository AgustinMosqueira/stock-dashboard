dos Q4 FY26 del 29 de julio de 2026.", "fundamental": "**Últimos resultados (Q3 FY26, cerrado 31-mar-2026, reportado 29-abr-2026):**\n\n- HECHO: Revenue $82.9B, +18% a/a, vs consenso $81.39B; EPS diluido GAAP $4.27, +23% a/a, vs consenso $4.06 — beat en ambas líneas (CNBC, Yahoo Finance, 29-abr-2026).\n- HECHO: Ingreso operativo $38.4B, +20% a/a — margen operativo ~46% (Microsoft IR, 29-abr-2026); ingreso neto $31.78B vs $25.82B el año anterior (CNBC).\n- HECHO: Azure creció +40% a/a, sobre el rango guiado de 37-38%; negocio de IA con run-rate anual de $37B, +123% a/a; Copilot superó 20M de asientos (Alphastreet, abr-2026).\n- HECHO: Guidance Q4 FY26: Azure +39-40% cc; capex calendario 2026 de ~$190B, ~$35B sobre el consenso de Visible Alpha, +61% a/a (Alphastreet/TIKR, abr-2026).\n- HECHO: FCF cayó a $15.8B desde $20.3B un año antes, contra ingreso neto de $31.8B (Investing.com, 2026).\n\nLECTURA: El negocio operativo está en su mejor momento en años (reaceleración de Azure, monetización de IA tangible, márgenes intactos), pero el mercado exige prueba de retorno sobre el capex: la brecha entre utilidad neta ($31.8B) y FCF ($15.8B) es el núcleo del debate. La tesis alcista depende de que el FCF se recupere con fuerza desde FY27.", "valuacion": "- HECHO: P/E trailing ~23.4x (FinanceCharts, 17-jul-2026) / 24.4x (Macrotrends, 15-jul-2026); P/E forward ~19.5x.\n- HECHO vs. histórico propio: promedio 5 años ~32.2x, 10 años ~32.0x, pico jun-2024 38.5x, mínimo 5 años 26.5x (jun-2022) — MSFT cotiza hoy **debajo de su mínimo de 5 años previo** (FullRatio/Macrotrends, jul-2026).\n- HECHO vs. peers (jul-2026): AAPL ~35.0x, AMZN ~29.6x, GOOGL ~26.8x trailing; forward: MSFT ~19.5x vs GOOGL ~21.9x y AMZN ~27.8x — la más barata del grupo en ambas métricas (FinanceCharts/GuruFocus, 12-17-jul-2026).\n- HECHO: Price targets: promedio $558.77 (56 analistas, S&P Global); rango $400 – $870; otras muestras $557.96 (MarketBeat) y $589-592 sobre ~97 analistas (24/7 Wall St, 17-jul-2026). Upside implícito ~42-46%.\n\nLECTURA: La valuación relativa más atractiva de MSFT en al menos una década, contra su historia y contra peers. El descuento no es gratis: capitaliza el riesgo capex/FCF. Si el capex normaliza, hay doble palanca (crecimiento de EPS + re-rating); si no, el múltiplo bajo puede persistir.", "tecnico": "- HECHO: Precio ~$383-394 (fuentes difieren por día de corte, 17-18-jul-2026); **bajo** la media de 50 días ($401.88) y **bajo** la de 200 días ($438.98) — ambas en señal de venta (MarketBeat, jul-2026).\n- HECHO: RSI(14) ~53.5, zona neutral (TipRanks/AltIndex, jul-2026). Resumen de medias móviles MA5-MA200: 4 compra / 8 venta (Investing.com, jul-2026).\n- HECHO: Rebote de ~12% en el último mes dentro de una corrección mayor; +4% el 1-jul-2026 (acuerdo IA con Haleon, rotación hacia software) (ChartMill, jul-2026).\n- HECHO: Soportes: $368.57 y zona $349 (piso de 52 semanas); resistencias: $400-413, luego $427-440 (zona MM200) y $485 (Financhill/Barchart, jul-2026).\n\nLECTURA: Estructura de mediano plazo bajista (precio bajo ambas medias clave, MM200 descendente), con rebote de corto plazo aún no confirmado: recuperar y sostener $400-413 sería la primera señal constructiva; el cambio de tendencia real exige superar la MM200 (~$440). Mientras, es un intento de piso dentro de un downtrend, no una tendencia alcista.", "catalizadores": "**Catalizadores:**\n\n- **29-jul-2026 — Resultados Q4 FY26 + guidance FY27:** el evento clave; Azure guiado a +39-40% cc y primer test de la trayectoria de FCF.\n- **31-ago-2026 — Vesting del PSA de Nadella** (venta programada 10b5-1 del 80% de acciones netas) — evento conocido, puede generar ruido de titulares (SEC/StockTitan).\n- **2H 2026 — Copilot Cowork GA mundial** y SKUs Microsoft 365 Business con Copilot GA desde 1-jul-2026.\n- **Trimestres FY27 — Inflexión esperada del FCF** a medida que el capex 2026 (~$190B) entra en producción — la variable que valida o refuta la tesis.\n\n**Riesgos (por materialidad):**\n\n- **Capex sin retorno:** $190B en 2026 (+61% a/a) ya comprimió el FCF a $15.8B; si el retorno no aparece en FY27, el de-rating continúa.\n- **Concentración/diversificación de OpenAI:** acuerdo de $50B de OpenAI con AWS; alta concentración del backlog (~45% citado) — el negocio incremental futuro puede migrar.\n- **Desaceleración de Azure:** cualquier trimestre bajo el 39-40% guiado golpearía la única pata que sostiene la narrativa.\n- **Macro/rotación sectorial:** la acción ya demostró en 2026 que puede caer 30%+ con fundamentales intactos.\n- **Regulatorio/competencia cloud-IA:** presión de AWS y Google Cloud; riesgo antitrust no cuantificado en lo encontrado (no verificable en detalle).", "sentimiento": "- HECHO: Consenso Strong Buy: 34 buy / 1 hold / 1 sell (TipRanks vía Public.com) y Strong Buy en 56 analistas de S&P Global con target $558.77; sobre ~97 analistas, target promedio $589-592 (24/7 Wall St, 17-jul-2026).\n- HECHO: Acciones recientes: Argus target $510 (10-jul-2026); Morgan Stanley subió target de $625 a $650 y lo llamó top pick; Bernstein subió a $641 citando Azure. Último downgrade relevante: Stifel recortó de $540 a $392 (5-feb-2026) (Benzinga/MarketBeat).\n- HECHO: Insiders 2026: ~$51M vendidos en 34 ventas vs 1 compra abierta; Judson Althoff vendió 15,500 acciones a ~$461 (1-jun-2026); Nadella adoptó plan 10b5-1 (8-mar-2026); el director John Stanton **compró** 5,000 acciones (~$1.99M a $397.35) el 18-feb-2026 (StockTitan/MarketBeat).\n- HECHO: Tono de noticias 30-60 días constructivo — encuesta Jefferies con Azure como cloud primario del 55% de CIOs de EE.UU. vs 28% AWS; GA de Copilot Cowork; +4% el 1-jul por acuerdo con Haleon.\n\nLECTURA: Sentimiento de analistas claramente alcista y mejorando, en contraste con la acción del precio: el mercado (que vendió) y el sell-side (que compra) están en lados opuestos. Las ventas de insiders son mayormente programadas (10b5-1) y hay una compra abierta de un director cerca del precio actual, lo que ado operativo (margen 40,7%) mientras Cloud aporta US$13.900M y Other Bets pierde US$7.500M. Lo permanente: dependencia de un único motor —el anuncio de búsqueda— cuya monetización puede alterarse con las respuestas generativas; un coste de adquisición de tráfico de US$59.900M (20% de los ingresos publicitarios) que es a la vez foso y pasivo regulatorio; frentes antimonopolio en EE.UU. y la UE; y una integración vertical poco común (datos, Android, silicio propio y modelos propios) que abarata su coste marginal en IA a cambio de un capex que salta hacia ~US$200.000M."}, {"ticker": "AMZN", "company": "Amazon.com, Inc.", "statsList": [["Precio", "$248.42 (15-sep-2026)"], ["Rango 52 sem.", "$196.00 – $278.56"], ["Market cap", "$2.69T"], ["P/E", "29.6x trailing (fwd 25.5x)"], ["Target consenso", "$312.99 (62 analistas)"], ["Próx. earnings", "30-jul-2026 (after close)"], ["Técnico (auto)", "RSI 41.4 · MACD -1.62 / señal -0.32 (TradingView, 15-sep-2026)"]], "sections": {"resumen": "Amazon llega al earnings del 30 de julio con momentum fundamental excepcional: Q1 2026 batió en todas las líneas (revenue $181.5B +17%, AWS +28%, margen operativo récord 13.1%) y el consenso es casi unánimemente comprador (63 buy / 4 hold / 0 sell, target $312.99, ~+25% de upside). El precio, sin embargo, corrigió ~10% desde el máximo de $278.56 y el cuadro técnico es mixto. LECTURA: tesis de calidad con catalizador concreto e inminente; el riesgo de corto plazo es de ejecución en el print de Q2 y del capex de $200B.", "fundamental": "- HECHO: Q1 2026 (reportado ~29-abr-2026, CNBC/Tickeron/TIKR): revenue $181.5B, +17% a/a, vs consenso ~$177B. EPS diluido $2.78 vs $1.63 esperado, aunque inflado por $16.8B de ganancias pre-tax por la inversión en Anthropic. Margen operativo 13.1%, el más alto de la historia de la compañía según el CEO Andy Jassy.\n- HECHO: AWS creció 28% a $37.6B (vs $36.64B StreetAccount), su mayor ritmo en 15 trimestres; operating income de AWS $14.16B, +23%, muy sobre el consenso de $12.84B (CNBC, 29-abr-2026).\n- HECHO: Guidance Q2: crecimiento de ventas 16-19% ($194-199B) con ~$1B de costos adicionales por Project Leo (satélites) y plan de capex 2026 de ~$200B (TIKR, jul-2026).\n\nLECTURA: El negocio está en su mejor momento operativo en años: reaceleración de AWS por demanda de IA, publicidad récord y márgenes en máximos. El moat es triple (escala logística en e-commerce, efecto de red/switching costs en AWS, flywheel de Prime + ads) y se refuerza con la relación estratégica con Anthropic. El riesgo fundamental no es demanda sino intensidad de capital: $200B de capex exigen que AWS sostenga el ~28%.", "valuacion": "- HECHO: P/E trailing 29.58x al 14-jul-2026 (FinanceCharts); otra fuente reporta 34.66x a la misma fecha (discrepancia declarada; el trailing está además distorsionado por la ganancia contable de Anthropic). Forward P/E 25.47x al 26-jun-2026 (valueinvesting.io).\n- HECHO: Promedio histórico propio: 5 años ~46.8-57.8x y 10 años ~71.9-73.1x según FullRatio/FinanceCharts — el múltiplo actual está claramente por debajo de sus propios promedios de 3, 5 y 10 años.\n- HECHO: Vs peers (jun-jul 2026): forward P/E de GOOGL ~19.5x y AAPL ~23.3x (FinanceCharts/Public.com); AMZN cotiza con prima moderada.\n- HECHO: Consenso: target promedio $312.99, máximo $370, mínimo $207, sobre 62 analistas (stockanalysis.com/TipRanks, jul-2026); TD Cowen recortó a $340 desde $350 manteniendo Buy (8-jul-2026); Wells Fargo apunta a $312 (26-jun-2026).\n\nLECTURA: Para el crecimiento (+17% revenue, AWS +28%) y la expansión de márgenes, un forward de ~25x es razonable e históricamente barato para AMZN; la prima vs Google/Apple se justifica por mayor crecimiento. Upside implícito al target promedio: ~+25% desde $250.91.", "tecnico": "- HECHO: Precio $250.91 (16-jul-2026), ~10% bajo el máximo de 52 semanas de $278.56; rango del último mes $225.55-$251.03 (stockinvest.us, 14-jul-2026).\n- HECHO — fuentes en conflicto: AltIndex reporta SMA50 $245.9 > SMA200 $236.1 (configuración alcista), mientras Investing.com/TipRanks reportan SMA50 ~$238-254 con señal de venta y RSI entre 49.4 (neutral) y 67.4 según la fuente; el RSI se declara no verificable con precisión.\n- HECHO: Soportes citados: zona $240.4-245.2, luego $232.5 y $227.0 (cerca del mínimo de 3 meses $225.55); resistencias: $253.7 (SMA50 según ChartMill) y $263.0 (ChartMill/Barchart, jul-2026).\n\nLECTURA: Estructura de mediano plazo alcista (precio muy por encima del piso de $196 y del SMA200 en la mayoría de lecturas) pero corto plazo lateral-correctivo: el rebote desde ~$226 a fines de junio recuperó la zona de $247-251 y ahora enfrenta la resistencia $253-263. Perder $240 abriría retest de $227-232; superar $263 reanudaría la tendencia hacia $278.", "catalizadores": "**Catalizadores:**\n\n- **30-jul-2026 — resultados Q2 2026** (confirmado por aboutamazon.com). Consenso ~$196B revenue y EPS ~$1.82; TD Cowen modela $200.1B (+2% sobre consenso). Prime Day cayó en Q2 este año, un viento de cola que no existió en Q2 2025.\n- **2H 2026 — lanzamiento comercial del servicio de banda ancha Leo** — 396 satélites ya desplegados (NAI500/Technobezz, jul-2026); competencia directa a Starlink.\n- **Continuo — monetización IA:** unidad de $1B de Forward Deployed Engineers en AWS (CNBC, 30-jun-2026), AgentCore y EC2 G7 con Blackwell (AWS Summit NY, jul-2026); derivadas de la relación con Anthropic.\n\n**Riesgos (por materialidad):**\n\n- **Capex $200B en 2026:** si AWS desacelera bajo ~28%, el mercado castigará el retorno sobre ese capital (TIKR, jul-2026).\n- **Evento binario cercano:** el print del 30-jul con expectativas ya elevadas tras el rally post-Q1.\n- **Costos de Project Leo:** ~$1B adicionales en Q2 presionan el operating income guiado.\n- **Distorsión contable Anthropic:** la ganancia de $16.8B es mark-to-market y puede revertirse en trimestres futuros.\n- **Técnico:** pérdida de $240 activa retest de $227; el drawdown de 52 semanas ya fue de ~$278 a ~$226 (-19%).", "sentimiento": "- HECHO: Consenso Strong Buy: 63 buy / 4 hold / 0 sell; target promedio $312.99 ($207-$370) sobre 62 analistas (stockanalysis.com/TipRanks/MarketBeat, jul-2026). Acciones recientes: TD Cowen Buy, PT $340 (8-jul); Wells Fargo recomienda entrada, PT $312 (26-jun). Un resultado atribuye a BofA un PT de $165 (7-jul) — cifra inconsistente con el rango del consenso, se trata como no verificable.\n- HECHO — insiders: CEO Andy Jassy vendió 31,352 acciones a $275.00 el 4-may-2026 (~$8.6M) bajo plan 10b5-1 adoptado el 14-nov-2025; en 6 meses acumula 12 ventas por ~102,096 acciones (~$24.9M) y 0 compras (StockTitan/GuruFocus/MarketBeat). Entidad ligada a Bezos vendió 220,200 acciones a $275.27 el 5-may-2026 (~$60.6M). Entre mayo y julio: 11 ventas de insiders por ~$8.1M, 0 compras (stockcircle/insiderscreener).\n\nLECTURA: Tono de noticias claramente constructivo (AWS reacelerando, IA, Leo). Las ventas de insiders son programadas, pequeñas vs el market cap y consistentes con el patrón histórico de solo-ventas de Amazon; no se lee señal negativa, aunque la ausencia total de compras impide leerlas como señal positiva.", "conclusion": "La tesis funciona si el 30 de julio AWS imprime crecimiento igual o superior al 28% de Q1 y el operating income absorbe los costos de Leo — eso validaría el capex de $200B, cerraría el gap técnico hacia $263-278 y daría sustento al target de $313 con un forward de ~25x que es barato contra la propia historia de Amazon. La invalidarían: (1) AWS desacelerando por debajo de ~25-26% o guidance de Q3 débil, (2) margen operativo retrocediendo claramente desde 13.1% por Leo/capex, (3) pérdida técnica de $240 y luego $227, que rompería la estructura alcista de mediano plazo. Con 0 sells en el consenso, la barra de expectativas es alta: el mayor riesgo no es el negocio sino la asimetría de reacción ante un print apenas en línea."}, "scores": {"tecnica": {"score": 58, "just": "Estructura de mediano plazo alcista (precio $250.91 sobre el SMA200 en la mayoría de lecturas y +28% sobre el piso de 52s de $196), pero corto plazo lateral-correctivo: -10% desde $278.56, resistencia en $253-263 y fuentes técnicas en conflicto (golden cross según AltIndex vs señal de venta según Investing.com). RSI 49-67 no concluyente."}, "fundamental": {"score": 88, "just": "Q1 2026 récord: revenue +17% ($181.5B), AWS +28% (mejor ritmo en 15 trimestres), margen operativo 13.1% máximo histórico, moat triple (logística, AWS, Prime/ads). Valuación razonable: forward ~25.5x, muy por debajo de sus promedios de 5a (~47-58x) y 10a (~72x). Descuento solo por la intensidad de capital ($200B capex)."}, "sentimiento": {"score": 78, "just": "Consenso Strong Buy 63/4/0 con target $312.99 (+25% upside) y flujo de notas constructivo en jun-jul (TD Cowen $340, Wells Fargo $312). Ventas de insiders (Jassy ~$25M en 6 meses, entidad Bezos $60.6M) son vía 10b5-1 y rutinarias, pero 0 compras; resta un poco por expectativas ya muy cargadas."}, "riesgo": {"score": 65, "just": "Mega-cap de $2.69T con liquidez máxima y beta moderada, lo que acota el riesgo estructural; pero hay evento binario a 12 días (earnings 30-jul), drawdown reciente de -19% ($278 a $226) y exposición a un ciclo de capex de $200B más ~$1B de costos Leo en Q2. Riesgo acotado pero no bajo en el corto plazo."}, "conviccion": {"score": 82, "just": "Catalizadores concretos y fechados: earnings 30-jul-2026 con Prime Day en Q2, lanzamiento de Leo en 2H 2026 (396 satélites ya en órbita), pipeline de IA (FDE $1B, AgentCore). Tesis falsable con umbral claro: AWS >=28% valida, <26% invalida. Asimetría favorable con forward P/E bajo vs historia propia."}}, "sources": ["stockanalysis.com / TradingEconomics — precio, rango 52s, market cap (16-jul-2026)", "CNBC — AWS earnings Q1 2026 (29-abr-2026)", "Tickeron / TIKR — recap Q1 2026 y guidance (abr-may-2026)", "stockanalysis.com / TipRanks / MarketBeat — consenso y price targets (jul-2026)", "aboutamazon.com — fecha earnings Q2 (30-jul-2026)" Date": "14 de septiembre de 2026", "events": [{"date": "2026-09-16", "label": "Reunión del FOMC (decisión de tasas)", "kind": "macro", "info": "HECHO: anuncio miércoles 16-sep 2:00pm ET, tras reunión 15-16 sep. LECTURA: CME FedWatch mostraba ~85% de probabilidad de ALZA de 25pb (a 3,75%-4,00%), no de recorte — inusual, presionado por inflación core más caliente, petróleo Brent >US$100 y yields a 10 años cerca de 5% (fuentes: Forbes 31-ago, tradingkey 14-sep-2026). Un hike sorprendería negativamente a semis de alto beta como MU justo antes de su earnings."}, {"date": "2026-09-30", "label": "Earnings Q4 FY2026", "kind": "earnings", "time": "conference call 2:30pm hora Montaña (~4:30pm ET)", "info": "HECHO: confirmado por Micron IR (comunicado 26-ago-2026) para 30-sep-2026. Guidance oficial desde 24-jun-2026: revenue ~$50B, margen bruto no-GAAP ~86%. LECTURA: consenso de mercado espera revenue ~$50,4B y EPS no-GAAP ~$31,14 (cifra de consenso, no guidance textual de Micron). HBM3E/HBM4 reportado como fully booked hasta 2027-2028 con US$22.000M en acuerdos estratégicos (US$18.000M en depósitos de caja) — dato a confirmar en el reporte."}], "sections": {"resumen": "MU cotiza en ~$975 (cerró en $977 el 11-sep), tras un sell-off sectorial de semis (-5% el 10-sep, -6% el 14-sep) por temores de 'burbuja de IA' y un contexto macro más duro (petróleo >US$100, yields ~5%). Sigue +230% YTD por el superciclo de memoria. HECHO: earnings Q4 FY26 confirmado 30-sep; guidance revenue ~US$50B, margen bruto ~86%. HECHO: CXMT superó 10% de share global de DRAM; Apple testea sus chips pero CXMT está full booked hasta 2027 y rechazó la oferta de Apple. LECTURA: FOMC del 16-sep con ~85% de probabilidad de ALZA (no recorte) es un riesgo macro poco habitual. Consenso unánime Strong Buy, ventas recurrentes de insider, litigio Netlist/ITC y el short de Michael Burry piden cautela.", "fundamental": "- HECHO: guidance vigente desde 24-jun-2026 —revenue ~US$50B, margen bruto no-GAAP ~86%— reafirmado sin revisiones a la baja conocidas (Micron IR).\n- HECHO: HBM3E/HBM4 reportado como 'fully booked' hasta 2027 (demanda hasta 2028); ~US$22.000M en acuerdos estratégicos plurianuales, incl. US$18.000M en depósitos de caja (prensa especializada, ago-2026).\n- LECTURA: TrendForce moderó su proyección de precio DRAM PC de 4T26 a +3%-8% QoQ (desde +15%-20% en 3T26), pero DRAM de servidor sigue fuerte en +13%-18% — señal de que el ciclo aún no revierte pero pierde aceleración.\n- HECHO: Netlist presentó demanda ante la ITC el 12-ago-2026 contra Micron (además de Supermicro, HPE, Lenovo) por 4 patentes de DDR5 RDIMM/MRDIMM, buscando orden de exclusión de importación; caso paralelo en corte federal de California. MU cayó ~4% en reacción (18-ago-2026).\n- HECHO: CXMT (China) alcanzó 10% de share global de DRAM en 2T26 (vs 4% un año antes); capacidad 'fully booked' hasta 2027 al 95% de utilización, limitando cuánto puede desviar a Apple pese al testing reportado.", "valuacion": "- HECHO: market cap ~US$1,10-1,13 billones con ~1.130M acciones en circulación (sep-2026).\n- LECTURA: P/E trailing ~22,9x, forward ~7,1-10,7x según agregador y base de EPS —la brecha refleja el salto abrupto de utilidades del ciclo HBM, no error de dato.\n- HECHO: rango 52 semanas US$154,65-US$1.255,00; cotiza ~22% bajo su máximo histórico tras el pullback reciente.\n- HECHO: target consenso de 45 analistas ~US$1.295-1.513 (Strong Buy: 45 buy/0 sell/4 hold), implicando ~35-55% de upside; dispersión extrema entre el piso (~US$361) y el techo (~US$2.200) delata desacuerdo real sobre sostenibilidad de márgenes.\n- LECTURA: Michael Burry inició un short en MU el 2-jul-2026 a US$1.051,87, calificándolo 'destructor de capital' por ROIC mediano ~4% histórico y FCF negativo en ~48% de los trimestres pasados; amplió la posición el 24-jul a US$933,86.", "tecnico": "- HECHO: RSI 53 (neutro) y MACD +18,44 sobre señal +14,55, aún en terreno alcista pero el histograma gira a la baja según 'trend' del propio dashboard.\n- HECHO: precio +1,3% sobre SMA20, +5,0% sobre SMA50 y +56,8% sobre SMA200 — extensión aún muy elevada pese al retroceso semanal de -4,07%.\n- HECHO: volumen del día (21,7M) muy por debajo del promedio de 20 días (33,5M, ratio 0,65x), señal de baja convicción tanto en el rebote como en la caída reciente.\n- LECTURA: soporte técnico en ~US$900 sostenido en el test del 14-sep según prensa especializada; pérdida de ese nivel abriría paso a un retest de SMA50 (~$929, ya cerca) o más abajo.\n- HECHO: volatilidad 30d ~102%, Sharpe -0,11 y Sortino -0,14 en la ventana reciente —retornos ajustados por riesgo negativos pese al +230% YTD, reflejo de lo violento del drawdown de -39% en 12 meses.", "catalizadores": "**Catalizadores:**\n- Earnings Q4 FY26 el 30-sep-2026: validación de guidance de margen bruto ~86% y de si el pricing DRAM/HBM sigue firme.\n- FOMC 16-sep-2026: mercado pricing ~85% de probabilidad de ALZA de tasas (no recorte), riesgo macro para todo el sector semis de alto beta.\n- Ramp de HBM4/HBM4E para Nvidia Vera Rubin: Micron ya calificado y en producción junto a Samsung/SK Hynix (confirmado por Jensen Huang, jun-2026), pero sigue siendo el jugador más chico de los tres.\n- Resolución o avance del caso ITC de Netlist (demanda de 12-ago-2026): un fallo de exclusión de importación sería negativo material, aunque procesos ITC toman típicamente ~1 año.\n\n**Riesgos (por materialidad):**\n- Competencia estructural china: CXMT ya en 10% de DRAM global, capacidad fully booked hasta 2027; riesgo de erosión de pricing power de mediano plazo.\n- Litigio Netlist/ITC en curso, buscando orden de exclusión de importación de productos DDR5 de Micron.\n- Ciclo de commodity: reversión de márgenes ya ocurrió en FY2023 (margen bruto -9%); apalancamiento operativo extremo funciona en ambas direcciones.\n- Ventas recurrentes de insider del CEO (~US$38-39M en ago-2026) y short de Michael Burry en medio de consenso unánime Strong Buy.", "sentimiento": "- HECHO: consenso 45 analistas 100% buy/strong buy (0 sell), target promedio ~US$1.295-1.513 — unanimidad que históricamente antecede correcciones cuando el precio ya se estiró.\n- HECHO: CEO Sanjay Mehrotra vendió ~40.000 acciones en ago-2026 (~US$38-39M) bajo plan 10b5-1, tras ventas similares en may-2026 (~US$21,5M) y jul-2026 (~US$37,3M) — patrón recurrente, aunque preprogramado.\n- HECHO: Michael Burry (Scion) reveló y luego amplió un short en MU durante jul-2026, parte de una canasta bajista en semis (NVDA, AMAT, SOXX).\n- LECTURA: el sell-off del 10 y 14-sep por comentarios de ejecutivos de IA sobre un ciclo más lento sugiere que el mercado empieza a cuestionar, aunque sea parcialmente, la narrativa de demanda infinita de HBM.\n- HECHO: beta elevado (~2,1 histórico) amplifica tanto el rally como las caídas — MU lidera al alza y a la baja los movimientos del sector memoria.", "conclusion": "MU sigue siendo la apuesta pura al superciclo de memoria IA, con guidance intacto y HBM4 calificado para Nvidia, pero cotiza con consenso unánime (posible señal contraria), litigio Netlist activo, competencia china acelerando y un CEO vendiendo recurrentemente. El sell-off de sep-2026 y un FOMC que podría subir tasas el 16-sep añaden presión de corto plazo antes del binario real: earnings del 30-sep. Confianza media: la tesis fundamental (HBM, márgenes ~86%) es sólida y falsable pronto, pero la asimetría de riesgo (beta 2,1, drawdowns históricos >30%, litigio, CXMT) exige posición acotada, no de convicción máxima."}, "scores": {"tecnica": {"score": 54, "just": "RSI neutro (53) tras pullback de -4% semanal que no rompió SMA20/SMA50, pero volumen bajo (0,65x) en el rebote sugiere baja convicción; histograma MACD ya gira a la baja según trend interno. Extensión aún de +57% sobre SMA200 deja poco margen de error."}, "fundamental": {"score": 67, "just": "Guidance de margen ~86% sostenido, HBM4 calificado y demanda fully booked hasta 2027-28 son sólidos, pero litigio Netlist/ITC (ago-2026) y ser el jugador más chico de los tres en HBM4 restan puntos."}, "sentimiento": {"score": 30, "just": "Leído en contrario: 45/45 analistas en buy/strong buy sin ningún sell es unanimidad extrema; sumado a ventas recurrentes de insider (CEO, ~US$39M en ago-2026) y el short público de Michael Burry, hay señales de complacencia que históricamente preceden correcciones."}, "riesgo": {"score": 36, "just": "Beta ~2,1, volatilidad 30d ~102%, drawdown de -39% en 12 meses y Sharpe/Sortino negativos pese al +230% YTD. CXMT ya en 10% de DRAM global y litigio Netlist buscando orden de exclusión de importación son riesgos estructurales, no solo cíclicos."}, "conviccion": {"score": 51, "just": "Asimetría moderada: la tesis (HBM4 + márgenes ~86%) es falsable en 15 días con el earnings del 30-sep, pero el FOMC del 16-sep y el sell-off reciente añaden ruido macro de corto plazo que puede distorsionar la señal."}}, "sources": ["Micron Investor Relations/GlobeNewswire/StockTitan", "stockanalysis.com", "TipRanks", "TradingKey", "FX Leaders", "Forbes/CME FedWatch", "Yahoo Finance/Fortune/CNBC", "Seoul Economic Daily (CXMT)", "wccftech/AppleInsider (Apple-CXMT)", "SEC Form 4 (Mehrotra)/secform4.com/stocktitan", "TrendForce", "PRNewswire/TradingView News (Netlist ITC)", "GuruFocus/Seeking Alpha (Michael Burry)", "The Motley Fool", "TradingView scanner (técnico)"], "opportunity": {"cats": {"valuacion_hist": {"score": 40, "just": "Forward P/E de un dígito bajo luce barato solo si el margen bruto ~86% persiste; percentil de precio 74,6% en el rango de 1 año y trailing ~22,9x muestran que ya no es una entrada de ciclo temprano."}, "calidad": {"score": 64, "just": "HBM4 calificado por Nvidia y demanda fully booked hasta 2027-2028 con acuerdos plurianuales de US$22.000M sostienen la calidad del negocio, aunque Micron sigue siendo el jugador más chico de los tres en HBM4 y enfrenta litigio activo de Netlist."}, "asimetria": {"score": 42, "just": "Con +230% YTD ya consumado y precio +57% sobre SMA200, la asimetría favorece esperar el earnings del 30-sep y el resultado del FOMC del 16-sep como gatillo antes de sumar exposición."}, "catalizadores": {"score": 60, "just": "Earnings Q4 FY26 (30-sep) es catalizador binario con guidance concreto (revenue ~$50B, margen ~86%); FOMC 16-sep y ramp de HBM4 son catalizadores secundarios de corto plazo."}, "contrarian": {"score": 26, "just": "Consenso unánime Strong Buy (45 buy/0 sell), ventas recurrentes de insider del CEO y el short público de Michael Burry configuran una mezcla de euforia de consenso con riesgo idiosincrático no del todo descontado — leído en contra, resta puntos a la tesis de oportunidad fresca."}}, "plan": {"recomendacion": "Mantener / Observar", "zona_compra": "$850-930", "invalidacion": "Margen bruto cae bajo ~80% en earnings o resolución adversa en el caso ITC de Netlist (orden de exclusión)", "gatillos": ["Earnings 30-sep-2026 con margen bruto sostenido ~86%", "Resultado del FOMC 16-sep-2026 (hike vs hold)", "Avance del caso ITC Netlist"], "horizonte": "6-18 meses", "tamano": "Posición reducida (3-5%)", "confianza": "media"}}, "perfil": "Micron fabrica memoria semiconductora —DRAM y NAND— y la vende a fabricantes de servidores y aceleradores de IA, smartphones, PCs, automoción e industria; es el único productor estadounidense de DRAM a escala y uno de los tres que dominan el mercado con Samsung y SK Hynix, oligopolio que en 2026 cayó por primera vez en más de una década por debajo del 90% combinado del DRAM mundial ante el avance de CXMT. Es un negocio de commodity con costes fijos enormes: el precio, no el volumen, determina el resultado, con apalancamiento operativo extremo en ambas direcciones. DRAM es el core absoluto y dentro de DRAM la HBM —la memoria que se vende apilada junto a los aceleradores de IA— cambió el perfil del negocio: nube y centro de datos ya pesan más que móvil y automoción juntos. La magnitud del ciclo se ve en las cifras: de un negocio con márgenes deprimidos en FY2025 a US$41.500M en un solo trimestre con 84,9% de margen bruto GAAP en el 3T FY2026, con acuerdos plurianuales que comprometen ingreso mínimo hasta 2030. Pero la simetría opera igual a la baja: en FY2023 facturó US$15.500M con margen bruto de -9% y perdió US$5.800M. El foso no es tecnológico sino de escala y disciplina de una industria de tres actores, hoy desafiada por un cuarto entrante chino subsidiado por el estado."}, {"ticker": "MP", "company": "MP Materials Corp.", "statsList": [["Precio", "$49.17 (15-sep-2026)"], ["Rango 52 sem.", "$37,81 – $100,25"], ["Market cap", "~US$8.530M (178,05M acciones × $47,91; stockanalysis.com, 5-ago-2026)"], ["P/E", "n/a — pérdidas TTM (EPS -$0,34); forward P/E ~99x, P/S TTM ~20x sobre revenue $416M (stockanalysis.com, ago-2026)"], ["Target consenso", "~US$77,5-79,5 promedio, 18 analistas en compra / 0 venta, Strong Buy (CNN Markets / Investing.com, jul-ago 2026) — implica ~+62% desde $47,91"], ["Próx. earnings", "6-ago-2026 (Q2 2026, mañana): consenso ingresos ~US$95,7M y EPS ajustado ~$0,01 (MarketBeat, ago-2026)"], ["Técnico (auto)", "RSI 39.1 · MACD -0.54 / señal +0.46 (TradingView, 15-sep-2026)"]], "reportDate": "5 de agosto de 2026", "change": {"day": -2.98, "week": -2.65}, "events": [{"date": "2026-08-06", "label": "Earnings Q2 2026", "kind": "earnings", "info": "Consenso: ingresos ~US$95,7M (vs $57,4M a/a) y EPS ajustado ~$0,01 (MarketBeat, ago-2026). Foco: volúmenes y costo unitario de NdPr, ramp del segmento Magnetics (Independence, Fort Worth), avance de construcción del 10X, comisionado de separación de tierras raras pesadas en Mountain Pass, y cualquier cuantificación del impacto de la blacklist china del 22-jun en equipos/insumos. Evento binario tras +25,7% de rebote semanal pre-reporte."}], "sections": {"resumen": "MP cerró el 5-ago en $47,91 (+0,93% día, +25,75% en 5 ruedas), rebotando en V desde $38,10 (29-jul), pegado al mínimo 52-sem de $37,81, y aún -52% bajo el máximo de $100,25. HECHO: reporta Q2 2026 mañana 6-ago. La tesis estructural sigue intacta: única cadena mina-imán integrada de EE.UU., piso DoD de $110/kg para NdPr por 10 años, offtake 100% del futuro 10X y acuerdo Apple de $500M vigente. La caída feb-jul respondió a la blacklist china (22-jun), insider selling y desinfle del premium 2025. LECTURA: capitulación de julio (RSI<30) más piso contractual del DoD acotaban el downside; el rebote pre-earnings ya consumió parte de esa asimetría.", "fundamental": "- HECHO: Q1 2026 (6-may): revenue $90,6M (+49% a/a), EBITDA ajustado $36,6M, utilidad neta ajustada $6,7M; producción récord de NdPr 917 t (+63%) y ventas 1.006 t (+117%) (MP IR, may-2026).\n- HECHO: acuerdo DoD (jul-2025) vigente: piso de $110/kg para NdPr por 10 años vía contract-for-difference, préstamo de $150M para separación de pesadas, y compromiso de compra del 100% de los imanes del 10X (10.000 t/año NdFeB, comisionado 2028); $1.000M de financiamiento comprometido por JPMorgan/Goldman (MP IR / FAS).\n- HECHO: acuerdo Apple $500M (jul-2025) vigente: imanes de tierras raras 100% recicladas desde Independence (Fort Worth), envíos desde 2027.\n- HECHO: Magnetics (Independence) en Q1 2026: revenue $21,1M (+306% a/a) y EBITDA de segmento $9,6M; 10X con groundbreaking realizado y comisionado de separación de pesadas por iniciarse en Mountain Pass (MP IR, may-2026).\n- HECHO: MOFCOM incluyó a MP en su lista de control (22-jun-2026), vetando exportaciones chinas de ítems dual-use hacia la empresa. LECTURA: no afecta ventas (MP dejó de vender concentrado a China en 2025) pero puede encarecer equipos/insumos; alcance completo no verificable.", "valuacion": "- HECHO: sin P/E trailing (pérdidas TTM, EPS -$0,34); forward P/E ~99x y P/S TTM ~20x (stockanalysis.com, ago-2026) — el precio descuenta la ejecución 2027-28, no las utilidades actuales.\n- HECHO: target consenso ~$77,5-79,5, Strong Buy, 18 compras / 0 ventas (CNN / Investing.com, jul-ago 2026): ~+62% de upside implícito.\n- HECHO: NdPr óxido en ¥747-767/kg (~US$112-115/kg) a fines de jul-2026, sobre el piso DoD de $110; aleación NdPr ~US$133/kg al 1-jul, máximo 2026 (Mainrich / Rare Earth Exchanges, jul-2026). LECTURA: con spot > piso, el CFD del DoD pasa de subsidio a opción gratuita.\n- HECHO: InvestingPro había marcado sobrevaluación en los máximos y 'acertó' la caída de ~50% (Investing.com, jul-2026). LECTURA: tras el -52% desde el pico, la acción está barata vs su rango 12m pero cara vs fundamentales corrientes; el valor real depende de la capacidad de imanes ya contratada.\n- LECTURA: dilución potencial (warrants/preferentes del DoD, ~178M acciones hoy) modera el upside por acción; no cuantificada aquí — no verificable sin el 10-Q más reciente.", "tecnico": "- Piso en $38,10 (29-jul), prácticamente el mínimo 52-sem ($37,81), seguido de reversión en V: +25,75% en 5 ruedas con velas de +9,3%, +6,0% y +8,3% — evidencia de cambio de carácter tras la bajista feb-jul.\n- RSI pasó de sobreventa extrema (<30 el 22-jul, metalschannel) a zona neutral-alta: la estructura de mínimos decrecientes se rompió al recuperar $43-44.\n- Precio aún -52% bajo el máximo 52-sem; resistencias en ~$49-52 (zona perdida en jun tras la blacklist) y luego ~$57,5.\n- Beta 1,92 (stockanalysis.com): amplifica ambos lados; el rebote actual llega justo antes de un evento binario (earnings 6-ago), con gap risk elevado.\n- Volumen de la semana de rebote: no verificable al cierre del 5-ago; la amplitud de las velas sugiere participación institucional, no solo short covering.", "catalizadores": "**Catalizadores:**\n- Earnings Q2 2026 mañana (6-ago): consenso $95,7M / EPS aj. $0,01; confirmación de EBITDA ajustado positivo y ramp de Magnetics sería validación clave de la tesis.\n- Comisionado de separación de tierras raras pesadas en Mountain Pass (2S26): primera capacidad de pesadas a escala en EE.UU., financiada con $150M del DoD.\n- Inicio de envíos de imanes reciclados a Apple (2027) y avance del 10X (10.000 t/año, 2028) con $1.000M de JPMorgan/Goldman comprometidos.\n- Escalada de controles chinos (blacklist a MP el 22-jun; extensión a 14 firmas de la UE el 24-jul) sostiene el premium ex-China de NdPr sobre el piso de $110/kg.\n\n**Riesgos (por materialidad):**\n- Ejecución del salto de escala en imanes (Independence ~1.000 t → 10X 10.000 t hacia 2028): retrasos o sobrecostos romperían la tesis que justifica el múltiplo.\n- Valuación exigente (forward P/E ~99x, P/S ~20x): sin margen de error si NdPr recae bajo $110 y el negocio queda dependiendo del CFD estatal.\n- Blacklist china sobre ítems dual-use puede encarecer capex/opex de las expansiones; magnitud no verificable.\n- Insider selling elevado (>1,2M acciones vendidas por ejecutivos incl. CEO/CFO en el último trimestre; tickeron, jul-2026) y dilución potencial por instrumentos del DoD.", "sentimiento": "- HECHO: consenso sell-side unánime en Strong Buy (18 compras, 0 ventas), target ~$77,5 (CNN / stockanalysis, ago-2026) — sin capitulación de analistas pese al -52% desde el pico.\n- HECHO: RSI entró en sobreventa (<30) el 22-jul (metalschannel) tras la ola de ventas por la blacklist china y el insider selling: extremo de miedo clásico.\n- LECTURA contrarian: el punto de máximo pesimismo fue fines de julio; el rebote de +25,7% ya consumió parte de esa ventana. Con el sell-side 100% comprador, el contrarian puro hoy es neutral, no alcista.\n- LECTURA: prensa dividida — notas de 'fair value acertó la caída de 50%' conviven con 'mejor acción de reshoring' — dispersión narrativa típica de un stock-historia dependiente de política industrial.", "conclusion": "MP es la apuesta estructural de EE.UU. en tierras raras: piso DoD de $110/kg por 10 años, offtake del 100% del 10X, Apple $500M y Q1 2026 ya con EBITDA ajustado positivo — el downside de flujo está contractualmente acotado y el upside depende de ejecutar imanes 2027-28. Pero el punto de entrada táctico óptimo fue la capitulación de julio ($38-42); tras +25,75% en una semana y un earnings binario mañana, comprar hoy es pagar el rebote. Plan: esperar el reporte del 6-ago y acumular en retrocesos hacia $42-45 con la tesis confirmada. Invalidación: cierre sostenido bajo $37,8 o daño al acuerdo DoD."}, "scores": {"tecnica": {"score": 60, "just": "Cambio de carácter genuino: reversión en V desde el soporte 52-sem con RSI saliendo de sobreventa (<30 el 22-jul) y ruptura de la secuencia de mínimos decrecientes. Se descuenta puntaje por extensión de corto plazo (+25,75% en 5 ruedas) justo antes de un evento binario — no se premia la dirección, se premia la evidencia, y parte de ella ya está pagada."}, "fundamental": {"score": 66, "just": "Q1 2026 con inflexión real (EBITDA aj. $36,6M, utilidad neta aj. positiva, NdPr récord) y contratos únicos en el mundo occidental (piso DoD $110/kg, offtake 10X, Apple). Falta: pérdidas GAAP (EPS TTM -$0,34) y toda la tesis de imanes a escala está por ejecutarse hasta 2028."}, "sentimiento": {"score": 55, "just": "El extremo contrarian comprable fue fines de julio (RSI<30, capitulación por blacklist). Hoy el sentimiento ya rebotó y el sell-side está unánimemente comprador (18/18 Buy) — consenso bullish total resta valor contrarian; posición neutral, ni euforia ni pánico."}, "riesgo": {"score": 52, "just": "El riesgo de pérdida permanente está mitigado por el CFD del DoD ($110/kg por 10 años) y el respaldo estatal — el drawdown de -52% ya ocurrido no se castiga. Riesgos reales remanentes: ejecución del 10X, dependencia de política industrial (cambio de administración/prioridades), blacklist china sobre insumos y valuación sin margen de error."}, "conviccion": {"score": 60, "just": "Tesis estructural clara con downside contractualmente acotado y +62% de upside a consenso, pero timing subóptimo (rebote de +25,7% pre-earnings) y dependencia de ejecución multianual moderan la convicción a esta fecha y precio."}}, "sources": ["stockanalysis.com, 05/08/2026 - MP Materials (MP) Statistics, Price History (cierres 27-jul a 5-ago, beta 1,92, forward P/E)", "MP Ma de ~328,4M acciones vence el 24-sep; siguen tramos en oct. y el cierre final el 8-dic (purepowerpicks.com/stockalarm, sep-2026)."}, {"date": "2026-11-03", "label": "Earnings Q3 2026 (fecha estimada, no confirmada)", "kind": "earnings", "info": "Estimado no confirmado oficialmente (Wall Street Horizon); tras Q2 (revenue $7,8 mil M, +92% YoY, EPS -$0,09 vs -$0,26 esperado), el mercado buscará continuidad en Starlink (12M suscriptores), avance del segmento AI/xAI (+247% YoY) y quema de capex (Wall Street Horizon/CNBC, sep-2026)."}, {"date": "2026-12-08", "label": "Vencimiento final del lockup estándar de 180 días", "kind": "corporate", "info": "LECTURA: cierre del calendario escalonado de liberaciones post-IPO (180 días desde el 11-jun); libera el remanente de acciones de empleados/inversores tempranos (no incluye a Musk, con ~6,4 mil M de acciones bloqueadas hasta jun-2027) (purepowerpicks.com, sep-2026)."}], "sections": {"resumen": "SPCX cotiza en US$151,21 (+2,04% día, +2,2% semana), lejos aún del máximo IPO de US$225,64 pero recuperando terreno tras el piso de US$104,83 (jun-2026). El Q2 2026 (revenue US$7,8 mil M, +92% YoY, EPS -US$0,09 vs -US$0,26 esperado) sorprendió positivamente, impulsado por Connectivity (Starlink) y el nuevo segmento AI (+247% YoY, xAI). El mercado navega dos fuerzas opuestas: catalizadores operativos (Starship Flight 14, entrada a wireless, espectro EchoStar) contra presión técnica de oferta por el calendario de lockups escalonado hasta dic-2026. Consenso de 36 analistas sigue en \"Buy\" con targets US$220-232 (HECHO: S&P Global/TipRanks, sep-2026).", "fundamental": "- Revenue Q2 2026 US$7,8 mil M (+92% YoY), superó consenso de US$6,9 mil M por casi US$1.000 M; EBITDA ajustado US$3,5 mil M (+191% YoY) (HECHO: Fortune/CNBC, 04-ago-2026).\n- Pérdida neta GAAP de US$541 M (-US$0,09/acción), mejora de US$467 M vs -US$1.008 M del año previo; consenso esperaba -US$0,26/acción (HECHO: SEC 8-K/Fool, ago-2026).\n- Connectivity (Starlink) US$4,3 mil M (+66% YoY), único segmento con utilidad operativa (US$1,66 mil M); Space US$962 M (+29% YoY); AI US$2,6 mil M (+247% YoY) por contratos de cómputo en la nube (HECHO, ago-2026).\n- Starlink alcanzó 12M suscriptores (vs 6M año previo), meta declarada de 20M; capex de IA fue US$15,83 mil M en el trimestre, evidenciando la intensidad de capital de la integración con xAI (HECHO, ago-2026).\n- LECTURA: el negocio muestra apalancamiento operativo real (EBITDA creciendo más rápido que revenue), pero el capex de IA es el nuevo factor que puede diluir el margen consolidado si xAI no monetiza al ritmo esperado.", "valuacion": "- P/E no aplicable por pérdida GAAP; con EV/Sales aproximado sobre ~US$31 mil M de revenue anualizado (4x Q2), el múltiplo ronda ~65x ventas, propio de una tesis de crecimiento/opcionalidad, no de flujo de caja actual (LECTURA).\n- Consenso de precio objetivo US$220-232 (36 analistas, S&P Global/TipRanks) implica upside de ~45-53% desde US$151,21, pero el rango de targets (US$117-450) refleja alta incertidumbre de modelo (HECHO, sep-2026).\n- Wells Fargo bajó su target de US$215 a US$212 pero mantuvo \"Overweight\", validando la tesis de wireless de bajo capex (HECHO: MarketBeat, 08-sep-2026); Pivotal Research subió a \"Strong Buy\" con target US$220 (HECHO: Benzinga, 08-sep-2026).\n- Market cap ~US$2,06 billones (trillion) vs US$1,77 billones al IPO (+16,6%) (HECHO: stockanalysis.com/tradingeconomics, 14-sep-2026).\n- LECTURA: la valuación exige ejecución impecable de Starship y Starlink/wireless simultáneamente; cualquier decepción de guidance en Q3 puede comprimir el múltiplo con fuerza dado el nivel de expectativas.", "tecnico": "- Precio US$151,21 opera sobre SMA20 (US$142,99, +5,75%) y SMA50 (US$135,07, +11,95%), configuración de tendencia de corto/mediano plazo positiva (HECHO: dato técnico dado).\n- RSI 59,1 y MACD (+3,75) sobre señal (+2,66) en territorio alcista pero sin sobrecompra extrema; espacio técnico para continuar sin agotamiento inmediato (LECTURA).\n- Volumen de hoy (79,3M) por debajo del promedio de 20 días (93,6M, ratio 0,85x), sugiriendo que el rebote reciente no viene acompañado de un salto de participación — carácter moderado, no eufórico (LECTURA).\n- Volatilidad anualizada 30d de 95,48% y drawdown máximo de -46,35% en 1 año confirman que el activo sigue siendo de alto riesgo idiosincrático pese al rally (HECHO: dato técnico dado).\n- Percentil de precio 1 año en 38,4% y rendimiento YTD de solo +0,81% muestran que, pese al +11,97% del último mes, el activo aún no recupera su rango alto histórico — hay recorrido técnico si los catalizadores confirman (LECTURA).", "catalizadores": "**Catalizadores:**\n- Starship Flight 14 (NET 22-sep-2026): primer perfil orbital genuino con 20 satélites Starlink V3 reales; éxito valida la tesis de abaratamiento de lanzamiento que sostiene el moat de Starlink (HECHO: NewSpaceEconomy, 13-sep-2026).\n- Entrada a wireless/spectrum: FCC aprobó absorción de 65 MHz de espectro de EchoStar; Wells Fargo y Pivotal ven a SPCX como disruptor de bajo capex frente a T-Mobile/AT&T/Verizon (HECHO: 247wallst/Investing.com, sep-2026).\n- Earnings Q3 2026 (~03-nov, no confirmado): primer chequeo post-lockups masivos; el mercado buscará continuidad del run-rate de Starlink (meta 20M suscriptores) y visibilidad de retorno del capex de IA (HECHO: Wall Street Horizon).\n\n**Riesgos (por materialidad):**\n- calendario de lockups sep-dic 2026 (24-sep ~328M acciones; cierre final 8-dic): presión de oferta recurrente ya se tradujo en caídas puntuales (-3,9% el 9-sep) (HECHO: Benzinga/MarketBeat, sep-2026).\n- competencia de Amazon Leo (ex-Kuiper): aún en despliegue (212 satélites a feb-2026, +US$1 mil M capex 2026) pero ya presiona el poder de fijación de precios de Starlink en contratos empresariales 2026-2027 (HECHO/LECTURA, futurumgroup.com).\n- dependencia binaria de Musk/xAI: el fundador concentra ~6,4 mil M de acciones (bloqueadas hasta jun-2027) y la integración de xAI añade quema de caja de IA (US$15,83 mil M en capex de IA solo en Q2) sin visibilidad de retorno claro (HECHO, ago-2026).\n- regulatorio/FAA: aunque el flight 14 avanza, la FAA aún evalúa trayectorias de reingreso sobre zonas pobladas; cualquier retraso adicional o incidente en vuelo golpearía la narrativa de cadencia (LECTURA basada en HECHO de aprobaciones parciales, teslarati).", "sentimiento": "- Consenso de 36 analistas en \"Buy\", 29 compra vs 2 venta, target promedio US$220-232 (HECHO: S&P Global/TipRanks, sep-2026) — sentimiento sell-side ampliamente positivo.\n- Movimientos recientes mixtos: Wells Fargo recorta target a US$212 pero mantiene Overweight; Pivotal sube a Strong Buy US$220; Argus había subido a Buy con target US$160 en ago-2026 (HECHO, sep-2026).\n- Acción cayó -3,9% el 9-sep coincidiendo con el release de lockup Day-91 y el ajuste de Wells Fargo, evidencia de sensibilidad a oferta de acciones más que a fundamentales (HECHO: MarketBeat, 09-sep-2026).\n- Short interest elevado según fuentes especializadas, pero el free float sigue extremadamente reducido (~17% tras el unlock del 10-sep sobre ~13,4 mil M de acciones), lo que crea condiciones de posible short squeeze si la venta de insiders es menor a la esperada (LECTURA sobre HECHO de estructura de float).\n- LECTURA CONTRARIAN: el consenso de analistas es unánimemente alcista (29 Buy vs 2 Sell) mientras la acción sigue con base de comparación volátil — el optimismo extremo sell-side, combinado con lockups pendientes, sugiere cautela táctica de corto plazo pese a la tesis estructural positiva.", "conclusion": "SPCX combina fundamentales que mejoran con fuerza (revenue +92%, pérdida por acción menor a lo esperado, EBITDA acelerando) con una oferta de acciones aún inestable por los lockups escalonados hasta dic-2026. El catalizador inmediato es Starship Flight 14 (NET 22-sep, ya retrasado una vez), seguido por el lockup del 24-sep y earnings Q3 (~3-nov). El consenso es alcista (target ~US$220-232) pero l .com - SPCX quote (14-sep-2026)", "MarketBeat - Wells Fargo cuts SPCX price target to $212 (08-sep-2026)", "Benzinga - SpaceX wireless disruption, Pivotal Strong Buy (08-sep-2026)", "247wallst.com - Wells Fargo SpaceX wireless analysis (10-sep-2026)", "Investing.com - SpaceX telecom push AT&T Verizon T-Mobile (sep-2026)", "futurumgroup.com - SpaceX IPO trillion-dollar bet, Kuiper competition", "MarketBeat - SPCX Short Interest (sep-2026)", "Wall Street Horizon - SpaceX Earnings Calendar"], "perfil": "SpaceX diseña y opera vehículos de lanzamiento (Falcon 9 y Starship), cápsulas Dragon, la constelación de banda ancha Starlink y la línea gubernamental Starshield; desde feb-2026 consolida además xAI. El dinero no viene del cohete sino del ancho de banda: sobre ingresos de ~$15-16 mil millones en 2025, Starlink aportó ~$11,8 mil millones con más de 10 millones de clientes en 160 mercados, mientras los lanzamientos (~82% del mercado comercial global) son la infraestructura de costo que hace viable desplegar la constelación. El segundo pilar es gubernamental: más de $22 mil millones acumulados con NASA, DoD y Space Force. Lo estructural: el moat es de costo y cadencia (reutilización más integración vertical), pero exige capex perpetuo — los satélites duran ~5 años, así que Starlink es una fábrica de reposición cuyo margen depende de que Starship abarate el kilo en órbita. Riesgos: espectro y licencias, dependencia de un cliente soberano y de su fundador, competencia de Kuiper y China, y la quema de caja de xAI."}, {"ticker": "BTC", "company": "Bitcoin", "statsList": [["Precio", "$75,737 (15-sep-2026)"], ["Rango 52 sem.", "US$57.747 – US$126.198 (Investing.com/CoinGecko, 14-sep-2026)"], ["Market cap", "~US$1,55 billones (CoinGecko, 14-sep-2026)"], ["Dominancia BTC", "~57-59% según fuente, en retroceso desde el pico de ciclo ~65-66%; altcoin season index ~34-40/100 (CoinGecko/TradingView/CoinMarketCap, 14-sep-2026)"], ["Flujos ETF spot", "Semana 8-11 sep: -US$463M netos (AR : 63022.98, "to": 77246.82}, {"ticker": "BTC", "date": "2026-08-23", "metric": "rsi", "from": 43.16, "to": 78.71}], "trend": {"piso": 0, "techo": 1, "max": 7, "senales_piso": [], "senales_techo": ["histograma MACD girando a la baja"]}, "change": {"day": 0.16, "week": -1.42}, "reportDate": "14 de septiembre de 2026", "events": [{"date": "2026-09-15", "label": "Voto de cloture (procedimental) del CLARITY Act en el Senado", "kind": "macro", "time": "14:15", "info": "Requiere 60 votos para habilitar debate; no es la votación final. Republicanos tienen 53 escaños y necesitan ~7-10 votos demócratas; defecciones de Rand Paul y Josh Hawley complican el conteo. La Casa Blanca acordó nuevo lenguaje de ética horas antes para sumar apoyo demócrata (CNBC/Bitget Academy, 13-14/09/2026). Resultado aún no conocido al cierre de esta investigación."}, {"date": "2026-09-16", "label": "Reunión del FOMC (decisión de tasas)", "kind": "macro", "time": "15:00", "info": "CAMBIO relevante: CME FedWatch ahora asigna ~93% de probabilidad a un ALZA de 25pb (no a mantener), tras CPI de agosto más caliente de lo esperado (core +0,3% m/m) y presión sobre el presidente Warsh, quien en Jackson Hole alertó que 54% de los componentes del PCE suben >3% interanual (CNBC/Bloomberg, 11-13/09/2026). Sería la primera subida desde 2023; un alza hawkish es negativo para activos de riesgo como BTC."}, {"date": "2026-10-18", "label": "Cierre de comentarios públicos de la SEC sobre 'Regulation Crypto Assets'", "kind": "macro", "info": "Propuesta publicada en el Registro Federal el 21-ago-2026 que crearía una vía de oferta a medida para ciertos contratos de inversión en cripto; podría destrabar clasificación regulatoria definitiva (SEC.gov, ago-2026)."}], "sections": {"resumen": "BTC cotiza en US$77.283 (11-sep), -3,81% semanal, dentro de un rango 52 semanas de US$57.747-US$126.198. El mercado enfrenta dos catalizadores inminentes: el voto de cloture del CLARITY Act (15-sep) y un FOMC (16-sep) que giró hawkish -93% de probabilidad de ALZA de tasas según CME FedWatch, no de pausa, tras CPI/PPI calientes (CNBC, 11-13/09/2026). Los ETFs spot acumulan -US$463M en la semana del 8-11 sep, revirtiendo el impulso de +US$987M de la semana previa. MVRV cerca de 1,1 sugiere valuación on-chain moderada, no eufórica (CryptoQuant, ago-2026). Sentimiento neutral-codicia leve (Fear&Greed 52-57).", "fundamental": "- Emisión fija: próximo halving ~abril-2028 reduce subsidio de 3,125 a 1,5625 BTC/bloque; ciclo actual ~50% completado (CoinWarz/The Block, sep-2026). HECHO.\n- Hashrate en recuperación (~1.001 EH/s a inicios de sep) pero 320+ días bajo el ATH de oct-2025, con mineros redirigiendo capacidad eléctrica a IA (CryptoTimes, 03-09-2026). HECHO.\n- MVRV ~1,1, cerca de zonas de piso histórico (2015/2019/2022); no confirma sobrevaluación (CryptoQuant, ago-2026; KuCoin, 2026). LECTURA.\n- Demanda estructural vía ETFs (~1,3M BTC, ~6% de la oferta) y tesorerías corporativas: Metaplanet 43.000 BTC, Strive supera 25.000 BTC (Bitcoin Treasuries/Yahoo Finance, ago-sep 2026). HECHO.\n- Presupuesto de seguridad casi íntegramente dependiente del subsidio de bloque; comisiones marginales — riesgo estructural de largo plazo sin resolver. LECTURA.", "valuacion": "- Precio -38,7% desde el ATH de ~US$126.198 (oct-2025); percentil 1 año en 28,5% (bajo dentro de su propio rango). HECHO/dado.\n- MVRV ~1,1 sugiere valuación on-chain no estirada, en zona históricamente asociada a bottoms de ciclo, aunque sin confirmación de piso definitivo. LECTURA.\n- Dominancia BTC ~57-59%, en retroceso desde el pico de ciclo ~65-66%, indicando algo de rotación hacia altcoins pero sin altseason confirmado (index ~34-40/100) (CoinMarketCap, 12-09-2026). HECHO.\n- Sharpe 5,09 y Sortino 11,96 (dado) muestran retorno ajustado a riesgo aún atractivo pese a volatilidad 30d de 65,5%. Dado.\n- Drawdown máximo 1 año de -39,58% recuerda que la valuación 'barata' convive con riesgo de continuación bajista si el macro se endurece. LECTURA.", "tecnico": "- RSI 55,1 en zona neutral, sin sobrecompra ni sobreventa (dado); consistente con otras lecturas independientes de RSI ~55-58 (OneUp Trader, 14-09-2026). HECHO.\n- MACD (+1.814) aún por debajo de su señal (+2.573), con histograma girando a la baja según 'trend' — señal de pérdida de momentum de corto plazo. Dado/LECTURA.\n- Precio +8,99% sobre SMA50 y +10,26% sobre SMA200, estructura de mediano plazo aún alcista pese a la corrección semanal. Dado.\n- Soporte técnico inmediato ~US$76.600-77.165; resistencia ~US$79.190-79.920, con extensión hacia US$82.000 si se rompe (múltiples fuentes técnicas, 14-09-2026). LECTURA.\n- Sin señales de piso activas (trend.senales_piso vacío); único gatillo técnico de carácter es el debilitamiento del MACD, no una reversión confirmada. Dado.", "catalizadores": "**Catalizadores:**\n- FOMC 16-sep: riesgo de sorpresa hawkish: 93% de probabilidad de alza de 25pb según CME FedWatch (vs. expectativa previa de pausa); un alza confirmada endurece condiciones de liquidez global y es negativo de corto plazo para BTC (CNBC, 11-13/09/2026).\n- CLARITY Act: cloture 15-sep: Necesita 60 votos; conteo ajustado con defecciones republicanas. Aprobar el cloture no es aprobación final pero destraba debate; fracasar lo mata para 2026 (Bitget Academy/CNBC, 13-14/09/2026).\n- Reversión de flujos ETF: 4 días consecutivos de salidas (8-11 sep, -US$463M); una reversión a flujos positivos sería la señal de confirmación de demanda institucional más inmediata.\n- Regulation Crypto Assets (SEC): Ventana de comentarios cierra 18-oct-2026; podría definir marco regulatorio de mediano plazo para activos cripto en EE.UU. (SEC.gov, ago-2026).\n\n**Riesgos (por materialidad):**\n- Presupuesto de seguridad de la red depende casi enteramente del subsidio de bloque, no de comisiones — riesgo estructural de largo plazo.\n- Concentración de la oferta en ETFs y pocos exchanges amplifica la reflexividad negativa ante salidas masivas, como la racha de 4 días de flujos negativos (8-11 sep).\n- Hashrate aún 320+ días bajo su ATH con mineros redirigiendo capacidad a IA, presión estructural sobre la economía de la minería.\n- FOMC hawkish (93% probabilidad de alza según CME FedWatch) endurecería condiciones de liquidez global, negativo de corto plazo para activos de riesgo.", "sentimiento": "- Fear & Greed Index en 52-57 (neutral a codicia leve), bajando levemente día a día — no hay extremo que dispare lectura contraria fuerte (Bloomingbit/Milk Road, 14-09-2026). HECHO.\n- Altcoin Season Index ~34-40/100: BTC mantiene fuerza relativa, capital no rota agresivamente a altcoins (CoinMarketCap, 12-09-2026). HECHO.\n- Narrativa de mercado dominada por macro (Fed hawkish) y regulación (CLARITY Act) más que por flujos idiosincráticos de BTC. LECTURA.\n- Balance de ballenas BTC estable desde febrero-2026; ritmo de acumulación institucional moderándose tras fuerte expansión en 2025 (BGeometrics, 2026). LECTURA.\n- Sentimiento técnico de corto plazo descrito como 'estabilización creíble, no reversión alcista confirmada' por análisis compuestos (OneUp Trader, 14-09-2026). LECTURA.\n\n**Flujos de capital: ETFs, institucionales y ballenas**\n\n| Fecha | Flujo neto | Detalle |\n|---|---|---|\n| 08-sep-2026 | -US$46,6M | Outflow leve, inicio de racha negativa (Farside/CoinDesk) |\n| 09-sep-2026 | -US$120,2M | Cuarto día de sangrado en fondos BTC (Coinpaprika) |\n| 10-sep-2026 | -US$282,7M | Peor día de la semana; ARK y Grayscale lideran salidas (FXStreet) |\n| 11-sep-2026 | -US$13,2M | Salida marginal, posible estabilización (Bitget/CoinDesk) |\n\nTotal semana 8-11 sep: -US$463M netos, con ARK 21Shares (-US$234,2M), Grayscale GBTC (-US$129,1M), IBIT de BlackRock (-US$52,5M) y FBTC de Fidelity (-US$50,7M) como mayores contribuyentes (FXStreet/HedgeCo, 14-09-2026). HECHO. Contrasta con semana previa (31-ago a 4-sep) de +US$987M, con IBIT solo aportando +US$691,5M (Bitget News, sep-2026). HECHO. En paralelo, balances de ballenas on-chain se mantienen estables desde febrero-2026 (sin nueva acumulación neta fuerte) mientras direcciones 'whale' tocan máximos de 2026 en conteo, sugiriendo dispersión más que concentración creciente (KuCoin/BGeometrics, 2026). LECTURA. Tesorerías corporativas siguen sumando: Metaplanet (43.000 BTC) y Strive (>25.000 BTC) ampliaron posiciones en agosto-septiembre (Bitcoin Treasuries/Yahoo Finance, 2026). HECHO.", "conclusion": "BTC transita una semana bisagra: FOMC hawkish (93% de probabilidad de alza, no pausa) y voto de cloture del CLARITY Act, ambos con desenlace desconocido al momento de este informe. La estructura de mediano plazo (SMA50/200) sigue alcista y MVRV (~1,1) no muestra sobrevaluación, pero los flujos ETF revirtieron a negativo cuatro días seguidos y el momentum técnico (MACD) se debilita. La asimetría favorece paciencia: comprar fuerza confirmada post-FOMC/CLARITY antes que anticipar. Confianza: media -datos de flujos y técnicos sólidos, pero desenlaces regulatorio y de tasas inciertos a la fecha de cierre de esta investigación (14-09-2026)."}, "scores": {"tecnica": {"score": 54, "just": "RSI neutral y estructura sobre SMA50/200 se mantienen, pero el MACD pierde carácter (histograma girando a la baja) sin confirmar reversión de tendencia. Sin señales de piso activas."}, "fundamental": {"score": 62, "just": "Red segura y con demanda estructural creciente (ETFs, tesorerías), pero presupuesto de seguridad dependiente casi 100% del subsidio y hashrate aún 320+ días bajo su ATH."}, "sentimiento": {"score": 46, "just": "Fear&Greed neutral (52-57) sin extremos que den señal contraria clara; flujos ETF revirtieron a negativo 4 días seguidos, un deterioro de corto plazo que pesa más que el nivel de sentimiento."}, "riesgo": {"score": 45, "just": "Volatilidad 30d de 65,5% es alta pero típica del activo; el riesgo material de esta semana es exógeno -FOMC hawkish y resultado binario del CLARITY Act- más que de pérdida permanente de tesis."}, "conviccion": {"score": 55, "just": "Tesis de mediano plazo (adopción institucional + emisión decreciente) intacta y falsable: se invalida con ruptura sostenida de SMA200 (~US$70.000) con volumen. Corto plazo: esperar catalizadores binarios."}}, "sources": ["CoinGecko", "alternative.me", "Farside Investors/SoSoValue", "CME FedWatch", "CryptoQuant", "CNBC", "Bloomberg", "The Block", "CoinDesk", "Bitget Academy", "SEC.gov", "Bitcoin Treasuries", "BGeometrics"], "opportunity": {"cats": {"valuacion_hist": {"score": 62, "just": "MVRV ~1,1 cerca de zonas de piso histórico y percentil 1 año de 28,5% sugieren valuación on-chain moderada dentro de su propio rango de ciclo."}, "calidad": {"score": 68, "just": "Red con seguridad económica robusta y demanda institucional estructural (ETFs ~6% de oferta, tesorerías corporativas), aunque presupuesto de seguridad depende casi enteramente del subsidio de bloque."}, "asimetria": {"score": 55, "just": "Upside a ATH (~US$126.198) implica +63% desde el precio actual; downside a soporte SMA200 (~US$70.000) implica -9%. Asimetría favorable pero condicionada a catalizadores macro/regulatorios inminentes."}, "catalizadores": {"score": 50, "just": "Dos eventos binarios en 48-72 horas (FOMC hawkish, cloture CLARITY Act) sin resultado conocido; ruta fechada pero de desenlace incierto en ambas direcciones."}, "contrarian": {"score": 45, "just": "Fear&Greed en zona neutral (52-57), sin extremo de pánico ni euforia que dé señal contraria fuerte; el mercado está indeciso, no capitulado."}}, "plan": {"recomendacion": "Esperar gatillo", "zona_compra": "US$68.000 - US$75.000", "invalidacion": "Ruptura sostenida bajo SMA200 (~US$70.000) con volumen", "gatillos": ["FOMC sin alza o alza ya descontada sin extensión hawkish adicional", "Aprobación de cloture del CLARITY Act", "Reversión de las salidas ETF a flujos netos positivos"], "horizonte": "6-18 meses", "tamano": "Posición moderada", "confianza": "media"}}, "perfil": "Bitcoin no es una empresa sino una red de liquidación entre pares con libro contable público, emisión fijada por software y un techo terminal de 21 millones de unidades. Su seguridad es económica: los mineros gastan electricidad para producir prueba de trabajo y compiten por un subsidio hoy de 3,125 BTC por bloque, que se recorta a la mitad hacia marzo de 2028. El presupuesto de seguridad (~$45 millones diarios) proviene casi íntegramente de ese subsidio: las comisiones colapsaron a una fracción marginal, lo que deja abierta la pregunta de si podrán reemplazarlo. Del lado de la demanda el mercado dejó de ser minorista: los ETFs spot concentran ~1,3 millones de BTC (~6% de la oferta), más tesorerías corporativas y mandatos institucionales. Lo estructural: es un activo de altísima duración y beta a la liquidez global que en shocks se comporta como riesgo y no como oro; la tenencia está concentrada en pocos vehículos y exchanges, generando reflexividad entre flujos y precio; y la regulación sigue siendo el principal vector exógeno."}, {"ticker": "HDSY", "company": "Harmonic Drive Systems Inc.", "statsList": [["Precio", "¥5,880 (15-sep-2026)"], ["Rango 52 sem.", "¥2.420 – ¥9.150 (Investing.com/TradingView, 12-sep-2026; LECTURA: coincide con rango previo, variación mínima de ¥4 en el piso probablemente por redondeo de fuente)"], ["Listado", "Bolsa de Tokio: 6324"], ["Market cap", "≈¥548.100 millones (~US$3,5-3,6 mil millones a ¥154/USD; Investing.com/TipRanks, 12-sep-2026; HECHO: cifra baja levemente vs ¥557.600M del 11-sep, coherente con caída de precio intradía)"], ["P/E", "≈91x TTM (Kabutan-style, no verificado directamente el 14-sep por bloqueo 403 de Kabutan) · LECTURA: fuente secundaria (companiesmarketcap) reporta P/E TTM de 571x, cifra muy discordante — probablemente denominador de beneficio neto TTM distinto o desactualizado; GAP DE COBERTURA declarado, no se pudo reconciliar con fuente primaria"], ["Target consenso", "≈¥8.396 (TipRanks, 7 analistas, Moderate Buy: 5 Buy/2 Hold, 11-12-sep-2026, rango ¥5.800-¥11.000); Marke  "label": "Cierre esperado de ampliación de capacidad en EE.UU. (~33% adicional)", "kind": "corporate", "info": "LECTURA (confianza baja, fuente secundaria hdinresearch.com no verificada de forma independiente): posible ampliación de ~33% de capacidad de manufactura en EE.UU. para diciembre 2026, ligada a demanda de humanoides. GAP DE COBERTURA: no confirmado en TDnet ni en IR oficial; fuentes secundarias entregaron datos contradictorios sobre la ubicación exacta de la planta (Peoria/Carolina del Norte vs. Beverly, Massachusetts), por lo que este evento se incluye con baja confianza y debe verificarse contra un comunicado oficial antes de su fecha."}], "sections": {"resumen": "HDSY (Harmonic Drive Systems, TSE:6324) cotiza en ¥5.790, tras corrección del -10,7% mensual pero +50,4% YTD, en rango técnico neutro (RSI 46, bajo SMA50 pero sobre SMA200). El guidance FY3/27 (7-ago-2026) proyecta ventas +25%, operativo +231% y neto +273% i.a., impulsado por pedidos de humanoides (~¥1.300M en Q2, meta ¥2.500M FY3/26) aunque el 'cliente norteamericano' sigue sin nombre confirmado. Consenso de analistas divergente (TipRanks ¥8.396 vs MarketScreener ¥7.731) reflejando desacuerdo real sobre sostenibilidad del re-rating. Riesgo estructural: competencia china (Leaderdrive + HDSI >63% del mercado global) presiona precios 40-60% por debajo en el segmento medio.", "fundamental": "- Guidance FY3/27 (7-ago-2026, oficial): ventas ¥74.500M (+25,1%), oper. ¥8.500M (+231%), neto ¥6.000M (+273% i.a.) — recuperación en V tras ciclo de semiconductores deprimido.\n- Q1 FY3/27 (7-ago-2026, TDnet): ventas ¥16.700M (+24% i.a.), margen operativo 11%, pedidos +55,7% i.a. a ¥24.128M — fuerte momentum de order intake.\n- Dividendo FY3/27 confirmado: ¥20/acción anual (¥10 interino + ¥10 final), sin cambio i.a., payout objetivo ~35% del beneficio neto (IR oficial hds.co.jp).\n- P/E TTM ~91x según agregador principal, pero otra fuente reporta 571x — GAP DE COBERTURA: discrepancia no reconciliada, probablemente por base de beneficio TTM distinta; tratar con cautela.\n- Pedidos de humanoides: ~¥1.300M en Q2, meta ¥2.500M FY3/26, management guía a duplicar/triplicar en FY3/27 (LECTURA: sin desglose por cliente).", "valuacion": "- Market cap ≈¥548-558 mil millones (~US$3,5-3,7 mil millones), con P/E TTM elevado (~91x, con fuerte disparidad entre fuentes) que ya descuenta gran parte de la recuperación de utilidades.\n- P/B ≈6,7x (dato previo no re-verificado el 14-sep por bloqueo de acceso a Kabutan) refleja prima de calidad/moat, no de balance.\n- Consenso de precio objetivo diverge marcadamente: TipRanks ¥8.396 (+45% upside) vs MarketScreener ¥7.731 (+33%), con rango extremo ¥3.300-¥11.000 — el mercado no tiene un ancla de valuación estable.\n- El re-rating YTD (+50%) ya asume ejecución fuerte en humanoides; cualquier decepción en el Q2 o el guidance revertiría múltiplos rápidamente dado el apalancamiento operativo.\n- Downgrade de Tokai Tokyo Securities a Neutral (¥4.170, 4-mar-2026) muestra que no todo el sell-side comparte el optimismo del consenso agregado.", "tecnico": "- Precio ¥5.790, apenas sobre SMA20 (¥5.779) pero -11% bajo SMA50 (¥6.509) y +12% sobre SMA200 (¥5.170) — estructura mixta, posible base en construcción tras corrección de agosto.\n- RSI 46,1 y MACD (-180,9) bajo señal (-243,5) pero acercándose — histograma mejorando, consistente con las 3 señales de piso activas (divergencia RSI alcista, MACD girando, volumen vendedor secándose).\n- Volumen 89% sobre el promedio de 20 días (2,22M vs 1,17M) sugiere interés renovado, aunque el día -3,18% reciente indica que la volatilidad de rango (vol. 30d ~99%) sigue siendo extrema.\n- Máximo drawdown de 1 año -40%, Sharpe -0,94 y Sortino -0,82: el perfil de riesgo/retorno de corto plazo sigue siendo pobre pese al rally YTD.\n- Persisten señales de piso sin señales de techo (0 de 7) — cuadro técnico consistente con acumulación, no con clímax de venta ni de compra.", "sentimiento": "- Consenso sell-side mayoritariamente constructivo (7-10 analistas, Buy/Moderate Buy) pero con dispersión inusual de targets (¥3.300-¥11.000), señal de incertidumbre genuina, no solo de rezago de cobertura.\n- Medios especializados en robótica (Finimize, Pandaily, humanoid.guide) mantienen narrativa alcista sobre HDSY como 'proxy' de humanoides, lo que puede sesgar el sentimiento minorista sin corroboración de pedidos concretos por cliente.\n- Comentario de Macquarie (citado en Investing.com) nota tono 'notablemente más positivo' de management vs. hace 3 meses — mejora de sentimiento institucional relativo.\n- Cobertura en inglés sobre la empresa es escasa y de calidad desigual (fuentes secundarias con datos contradictorios sobre ubicación de plantas) — el sentimiento agregado en inglés está sobre-representado por narrativa de humanoides vs. fundamentos verificables.\n- Ausencia de identificación del cliente norteamericano mantiene una prima de especulación que podría revertirse abruptamente si el nombre se revela y decepciona (o se confirma positivamente).", "catalizadores": "**Catalizadores:**\n- Confirmación de fecha e identidad del 'cliente norteamericano' de humanoides — el catalizador de mayor impacto potencial, aún pendiente (gap de cobertura activo).\n- Reporte Q2 FY3/27 (~5-12 nov-2026, fecha no confirmada oficialmente) — validará si el guidance elevado del 7-ago se sostiene.\n- Fecha ex-dividendo estimada 29-sep-2026 (¥10/acción interino) — evento corporativo menor pero confirma sostenibilidad del payout pese al alza de utilidades.\n- Progreso de expansión de capacidad en EE.UU. (hasta +33%, fecha estimada dic-2026, baja confianza) — de confirmarse oficialmente, señalaría compromiso de largo plazo con clientes norteamericanos.\n\n**Riesgos (por materialidad):**\n- Dependencia de cliente único/concentrado: la tesis de re-rating descansa en pedidos de humanoides de EE.UU. no identificados por nombre — riesgo de materialidad alta si el pipeline no se traduce en volumen.\n- Competencia estructural china: Leaderdrive + HDSI concentran >63% del mercado global, pero reductores chinos cotizan 40-60% del precio japonés — riesgo de compresión de márgenes en el segmento medio, no solo de volumen (ver perfil).\n- Apalancamiento operativo extremo: la recuperación de +231% en beneficio operativo funciona igual de violento a la baja si el ciclo de semiconductores o pedidos de humanoides decepcionan.\n- Riesgo de calendario/comunicación: fecha de Q2 FY3/27 no confirmada oficialmente (TDnet) genera incertidumbre de timing para el catalizador más cercano.", "conclusion": "HDSY combina un catalizador estructural real (humanoides) con máxima incertidumbre de ejecución: guidance FY3/27 robusto y confirmado oficialmente, pero el cliente ancla sigue sin nombre y la competencia china erosiona el segmento medio. Técnicamente, las 3 señales de piso activas sugieren que la corrección de agosto-septiembre podría estar agotándose, pero la volatilidad extrema (99% anualizada) y el consenso de targets muy disperso (¥3.300-¥11.000) reflejan que el mercado no tiene ancla de valuación. Confianza media: postura de esperar el Q2 FY3/27 y/o la identificación del cliente antes de aumentar exposición."}, "scores": {"tecnica": {"score": 56, "just": "Las 3 señales de piso (divergencia RSI, MACD girando, volumen vendedor secándose) persisten y el precio recuperó la SMA20, pero sigue bajo SMA50 y la volatilidad extrema impide confirmar cambio de carácter genuino."}, "fundamental": {"score": 66, "just": "Guidance oficial FY3/27 con crecimiento explosivo (oper. +231%) confirmado por TDnet real (7-ago), pero P/E ya elevado y discrepancias de datos entre fuentes bajan algo de confianza en la calidad de la valuación reportada."}, "sentimiento": {"score": 53, "just": "Consenso sell-side constructivo pero con dispersión inusual de targets; narrativa mediática en inglés sobregira sobre humanoides sin corroboración de cliente, lo que exige leer el sentimiento con escepticismo."}, "riesgo": {"score" des", "Reporte Q2 FY3/27 (confirmación de fecha y cifras)", "Confirmación oficial de expansión de capacidad en EE.UU."], "horizonte": "6-18 meses", "tamano": "Posición moderada (3-5%)", "confianza": "media"}}, "perfil": "Harmonic Drive Systems fabrica reductores de precisión de onda de deformación, el componente que convierte el giro rápido de un motor en el par alto y sin juego que necesita una articulación robótica, además de servoactuadores y mecatrónica. Vende a integradores y OEMs de robótica industrial, semiconductores, máquina-herramienta, aeroespacial y médica, con ventas de ~¥55.700M (ejercicio a marzo de 2025) y márgenes muy comprimidos por el ciclo de semiconductores y una capacidad instalada sobre la demanda actual: apalancamiento operativo extremo, que colapsa en la baja y se multiplica en la alta. Es líder global con ~50% de cuota, con un moat de proceso (tolerancias, metalurgia, know-how) reforzado por lo lento que es rehomologar un componente crítico. La opcionalidad es el humanoide, donde reductor y actuador pueden ser 30-60% del costo de cada articulación. El riesgo central es dónde se fabricará ese humanoide: los productores chinos pasaron de ~15% del mercado en 2022 a ~38% en 2024 presionando precios, así que el peligro no es perder volumen sino quedar acorralado en el nicho premium."}, {"ticker": "CLSK", "company": "CleanSpark, Inc.", "statsList": [["Precio", "$12.62 (15-sep-2026)"], ["Rango 52 sem.", "US$8,01 - US$23,61 (Investing.com/Nasdaq, 11-sep-2026)"], ["Market cap", "~US$3,51 mil M (~256,8M acciones en circulación, precio 11-sep-2026; Nasdaq/StockAnalysis)"], ["Hashrate", "50 EH/s pico (201.269 mineros, eficiencia 16,07 J/TH) — update agosto 2026, publicado 8-sep-2026 (PRNewswire/StockTitan)"], ["BTC en tesorería", "13.703 BTC al 31-ago-2026 (produjo 593 BTC, vendió 821 BTC vía spot/opciones/basis trade; YTD 4.903 BTC) — PRNewswire, 8-sep-2026"], ["Próx. earnings", "16-dic-2026, Q4 FY2026 (TipRanks/consenso de calendario, sep-2026; sin c
