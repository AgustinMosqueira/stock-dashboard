ales_piso": [], "senales_techo": ["pérdida de SMA20"]}, "change": {"day": -4.9, "week": -7.68}, "reportDate": "14 de septiembre de 2026", "events": [{"date": "2026-10-06", "label": "Actualización operacional de septiembre 2026", "kind": "corporate", "info": "HECHO: patrón mensual constante (marzo, junio, julio, agosto publicados a inicios del mes siguiente); update de agosto salió el 8-sep-2026 (PRNewswire/StockTitan). LECTURA: fecha exacta de octubre proyectada por el mismo patrón, sin confirmación oficial."}, {"date": "2026-10-15", "label": "Resolución esperada del proceso ERCOT/PUCT para Sealy-Brazoria (610 MW)", "kind": "corporate", "info": "LECTURA: tras la audiencia PUCT del 20-ago-2026 y las clasificaciones condicionales ERCOT (585 MW batch zero baseload + 300 MW studied load) reportadas 8-sep-2026, KBW (Stephen Glagola) señaló que el proceso y calendario post-audiencia siguen inciertos; no hay fecha fija confirmada, se usa ventana estimada de un mes."}, {"date": "2026-11-01", "label": "Actualización sobre lease de Cotty Two (350 MW, sureste de Texas)", "kind": "corporate", "info": "HECHO: en H.C. Wainwright Conference (14-sep-2026) CleanSpark confirmó LOI firmada y negociación de lease para Cotty Two, con diseño y preparación para construir los primeros 100 MW (Investing.com transcript, 14-sep-2026). LECTURA: fecha de firma definitiva no anunciada; se estima ventana de siguiente hito hacia fines de octubre/inicios de noviembre."}, {"date": "2026-12-16", "label": "Earnings Q4 FY2026 (cierre fiscal 30-sep-2026)", "kind": "earnings", "info": "HECHO: fecha reportada por TipRanks (sep-2026) como próximo reporte. LECTURA: sin confirmación oficial de la compañía aún. Foco: guía de capex 2027 para Sandersville (entrega Q4 2027) y avance de LOI/lease de Cotty Two (350 MW) en Texas."}], "sections": {"resumen": "CLSK cerró en US$13,67 el 11-sep-2026 (+6,8% día, +7,72% semana), recuperando terreno tras meses de compresión. La tesis sigue siendo el pivote a HPC/IA: el lease de Sandersville (US$6.600M a 20 años, firmado jul-2026) ya es hecho consumado, y en la conferencia H.C. Wainwright de hoy (14-sep) la compañía confirmó una nueva LOI para un campus de 350 MW en Texas (Cotty Two), sumándose a los 885 MW de exclusividad texana. El cuello de botella es regulatorio: ERCOT/PUCT aún no resuelve la clasificación definitiva de 610 MW en Sealy-Brazoria. Operativamente, agosto trajo 593 BTC producidos, 13.703 BTC en tesorería y 50 EH/s. Confianza: media.", "fundamental": "- HECHO: Ingresos Q3 FY2026 (trimestre a jun-2026, reportado 6-ago-2026) cayeron 30,5% a/a a US$138M vs US$198,6M, debajo del consenso de US$155,9M (StockTitan, Investing.com).\n- HECHO: Pérdida neta Q3 de US$239,8M (US$0,89/acción) vs utilidad de US$257,4M el año previo; muy por debajo del consenso de -US$0,33/acción (Investing.com, 6-ago-2026).\n- HECHO: Lease Sandersville a 20 años con tenant de grado de inversión, US$6.600M contratados (hasta US$11.600M con extensiones), ~US$330M NOI anual promedio, entregas desde Q4 2027 (PRNewswire, 14-jul-2026).\n- HECHO: Emisión de US$1,15 mil M en notas convertibles cupón 0% a 2032, precio de conversión ~US$19,16 (premio 27,5%); recompró 30,6M acciones (~10,9% del float) por ~US$460M (Morningstar/PRNewswire, nov-2025).\n- LECTURA: KBW (Stephen Glagola) estima que el mercado solo reconoce ~16% (97 MW netos) de los 610 MW Sealy/Brazoria en el precio de la acción, dejando upside condicional a resolución regulatoria (Blockspace, sep-2026).", "valuacion": "- HECHO: Market cap ~US$3,51 mil M con 256,8M acciones en circulación (11-sep-2026).\n- HECHO: Consenso de 13 analistas (S&P Global/TipRanks vía WallStreetZen) da 'Strong Buy' con precio objetivo promedio ~US$23,70-23,81, rango US$21-27 — implica upside >70% desde el precio actual.\n- HECHO: KBW mantiene Outperform con PT US$16 tras el lease de Sandersville, más conservador que el consenso amplio (Blockspace, ago-2026).\n- LECTURA: la brecha entre precio y targets sugiere que el mercado sigue valuando a CLSK principalmente como minero, no como plataforma HPC/IA emergente; el re-rating depende de ejecución, no de anuncios.\n- HECHO: acción cotiza 36,3 percentil de su rango de 1 año (technical dado), lejos de máximos de 52 semanas (US$23,61).", "tecnico": "- HECHO (dado): RSI 56,3 y MACD +0,03 sobre señal -0,22 — histograma girando al alza, zona neutral-alcista sin sobrecompra.\n- HECHO (dado): precio 10,9% sobre SMA20, 5,75% sobre SMA50 y 8,58% sobre SMA200 — estructura alcista de corto/mediano plazo confirmada.\n- HECHO (dado): +6,8% día y +7,72% semana con volumen 17% sobre el promedio de 20 días — impulso con participación, no un rebote técnico vacío.\n- HECHO (dado): trend score señala 1 'piso' activo (giro de histograma MACD) y cero señales de techo — sesgo de continuación de corto plazo.\n- LECTURA: volatilidad de 104,9% anualizada y máximo drawdown de 1 año de -64,7% recuerdan que el activo sigue siendo altamente especulativo pese a la mejora técnica.", "sentimiento": "- HECHO: insiders vendieron US$1,9M en los últimos 12 meses sin compras registradas; CTO/COO Taylor Monnig vendió US$393.652 en dos transacciones de septiembre 2026 (Nasdaq insider activity, SEC Form 4).\n- HECHO: consenso de analistas 'Strong Buy' con targets muy por sobre el precio spot — sentimiento sell-side marcadamente optimista.\n- LECTURA: la ausencia total de compras internas frente al optimismo de analistas es una divergencia a vigilar, aunque es patrón común en mineras post-dilución por convertibles.\n- HECHO: cobertura de prensa especializada (Blockspace, StockTitan, Cerbat Gem) ha girado hacia narrativa 'de minero a operador de datacenters de IA' tras Sandersville y Cotty Two.\n- LECTURA: sentimiento minorista/técnico de corto plazo positivo (compras sostenidas en dips de US$11-12), consistente con el patrón de 'piso' técnico.", "catalizadores": "**Catalizadores:**\n- Resolución ERCOT/PUCT sobre clasificación definitiva de 610 MW en Sealy-Brazoria — destraba (o retrasa aún más) el valor de la exclusividad texana (LECTURA, sin fecha firme).\n- Conversión de la LOI de Cotty Two (350 MW) en lease firmado — replicaría el patrón de re-rating que generó Sandersville en julio (HECHO: LOI confirmada 14-sep-2026).\n- Actualización operacional de septiembre 2026 (~inicios de octubre) — próximo dato duro de producción/tesorería BTC (LECTURA, fecha estimada).\n- Earnings Q4 FY2026 el 16-dic-2026 — primera guía de capex 2027 post-convertibles y post-Sandersville (LECTURA, fecha no confirmada oficialmente).\n\n**Riesgos (por materialidad):**\n- Riesgo de reversión: nuevo hearing o rechazo regulatorio en Texas que enfríe el 84% del valor de exclusividad aún no reconocido por el mercado (LECTURA, KBW).\n- Riesgo de dilución adicional si CLSK necesita más capital para financiar la construcción de Cotty Two antes de asegurar tenant (LECTURA, inferido de patrón de financiamiento previo).\n- Movimiento del precio de BTC: colateral de ~3.951 BTC empeñados en derivados amplifica sensibilidad a caídas del bitcoin (HECHO, dato dado en objeto original).", "conclusion": "CLSK mejora de carácter técnico (rally +8% diario/+20% semanal desacoplado de BTC) sobre una tesis HPC/IA que ya suma dos LOI de exclusividad texana (885MW + Cotty Two 350MW), pero el negocio minero base sigue débil (ingresos -30,5% a/a, pérdida de US$239,8M en Q3 FY2026) y el cuello de botella regulatorio ERCOT/PUCT sigue sin resolución. Confianza media: la tesis es falsable con la resolución regulatoria y la conversión de LOI en contratos firmes; el riesgo de dilución se activa si el precio supera US$19,16 (conversión de convertibles)."}, "scores": {"tecnica": {"score": 64, "just": "Cambio de carácter claro: MACD girando al alza, precio sobre las tres SMAs con volumen por sobre el promedio. Sube 2 puntos vs. reporte previo por confirmación de continuidad del piso técnico, aunque volatilidad extrema limita el techo del score."}, "fundamental": {"score": 42, "just": "Q3 FY2026 fue un miss duro (ingresos -30,5% a/a, pérdida de US$0,89/acción vs. -US$0,33 esperado). Baja levemente vs. objeto previo porque el miss de agosto confirma que la compresión post-halving sigue pesando más que los anuncios de HPC en el P&L actual."}, "sentimiento": {"score": 46, "just": "Divergencia entre consenso sell-side 'Strong Buy' (targets +70%) e insiders que solo venden sin comprar. Contrarian: el optimismo de analistas ya está muy cargado, por lo que el margen de sorpresa positiva es menor que el de sorpresa negativa regulatoria."}, "riesgo": {"score": 38, "just": "Distingue volatilidad (104,9% anualizada, propia de un minero de BTC apalancado) de riesgo de pérdida permanente: dilución estructural por convertibles sobre US$19,16 y dependencia crítica de ejecución regulatoria en Texas, que no es reversible con solo tiempo."}, "conviccion": {"score": 58, "just": "Asimetría real si Sealy-Brazoria se resuelve favorablemente (mercado reconoce solo 16% del valor, según KBW) y si Cotty Two convierte en lease firme; tesis falsable: se invalida con cierre sostenido bajo SMA200 o cancelación/rechazo regulatorio de la LOI texana."}}, "sources": ["PRNewswire/StockTitan (updates operacionales)", "Investing.com (transcripts H.C. Wainwright, earnings Q3)", "Blockspace Media (análisis KBW, Sandersville)", "SEC EDGAR (Form 4, Form 8-K)", "TipRanks / WallStreetZen / StockAnalysis (consenso analistas)", "Nasdaq (insider activity)", "TradingView (técnico)", "Cerbat Gem / Yahoo Finance"], "opportunity": {"cats": {"valuacion_hist": {"score": 58, "just": "Precio en percentil 36% de su rango de 52 semanas, muy por debajo de los targets promedio de analistas (~US$23,70) y de la valoración sum-of-the-parts de KBW, que reconoce solo ~16% del valor de Sealy-Brazoria en el precio actual."}, "calidad": {"score": 42, "just": "Balance con tesorería BTC relevante y contratos HPC de grado de inversión (Sandersville, Cotty Two), pero ingresos del negocio minero base cayeron 30,5% a/a en Q3 FY2026 con pérdida neta de US$239,8M."}, "asimetria": {"score": 70, "just": "Dos LOI de exclusividad texana (885MW + 350MW Cotty Two) frente a un market cap de ~US$3,51 mil M ofrecen asimetría real si la resolución regulatoria ERCOT/PUCT es favorable."}, "catalizadores": {"score": 62, "just": "Calendario cercano y concreto: resolución ERCOT/PUCT (~oct), conversión de la LOI Cotty Two en lease firmado, actualización operacional de octubre y earnings Q4 FY2026 (16-dic)."}, "contrarian": {"score": 46, "just": "Consenso de analistas ya optimista (Strong Buy, objetivos +70%) limita la señal contraria pura, aunque la ausencia total de compras de insiders frente al optimismo sell-side amerita cautela."}}, "plan": {"recomendacion": "Esperar gatillo", "zona_compra": "US$11-15", "invalidacion": "Cierre sostenido bajo SMA200 (~US$12,59) o rechazo/cancelación regulatoria de la exclusividad texana (Sealy-Brazoria o Cotty Two)", "gatillos": ["Resolución positiva de ERCOT/PUCT sobre los 610 MW de Sealy-Brazoria", "Conversión de la LOI de Cotty Two en lease firmado", "Update operacional de octubre con tesorería BTC estable o creciente"], "horizonte": "6-18 meses", "tamano": "Posición pequeña-moderada", "confianza": "media"}}, "perfil": "CleanSpark es un operador de centros de datos que monetiza electricidad: compra energía barata en Georgia, Tennessee, Wyoming y Texas, opera infraestructura y máquinas propias —sin hosting de terceros— y convierte kilovatios en bitcoin. Facturó $766,3M en FY2025 (+102%), superó los 50 EH/s y retiene una tesorería de ~13.700 BTC. El modelo está mutando: la compresión post-halving hundió los ingresos trimestrales ~30% a/a, y firmó un arriendo triple neto a 20 años por 175 MW con una tecnológica de grado de inversión (~$6.600M contratados, margen casi íntegro), además de una LOI de exclusividad sobre su portafolio texano de hasta 885 MW, ahora ampliada con una segunda LOI para un campus de 350 MW (Cotty Two). Ahí está la tesis: el activo escaso no son las máquinas sino su cartera de energía contratada e interconexiones, justo lo que demanda la IA. Como minero es tomador de precio doblemente cíclico, con dilución permanente (incluida la potencial por convertibles sobre US$19,16) y el halving de 2028 recortando el subsidio a la mitad; la variable crítica es el financiamiento, que ata la reconversión a HPC al costo de capital y al precio del bitcoin que sirve de colateral."}, {"ticker": "MSTR", "company": "Strategy (MicroStrategy Incorporated)", "statsList": [["Precio", "$129.60 (15-sep-2026)"], ["Rango 52 sem.", "US$81,81 (26-jun-2026) - US$365,21 (6-oct-2025); percentil de precio a 1 año: 17,3% (technical, 11-sep-2026)"], ["Market cap", "~US$51,1-51,9 mil M; el 11-sep-2026 Strategy superó a Block Inc en capitalización bursátil (cryptotimes.io, macrotrends, 10-11-sep-2026)"], ["BTC en tesorería", "845.050 BTC, costo agregado US$63,73 mil M, costo prom. US$75.412/BTC; 8-K del 14-sep confirma CERO compras/ventas en la semana 8-13 sep (segunda semana consecutiva sin actividad de BTC), tras compra de 4.603 BTC (~US$370M) el 31-ago que rompió pausa de 10 semanas (SEC 8-K 14-sep-2026, The Block, 24/7 Wall St.)"], ["mNAV", "~0,78x básico / ~0,79x diluido (descuento) / ~1,06x sobre EV, al 31-ago-2026 con BTC ~US$80.000 (bitcointreasuries.net); con BTC bajando a ~US$77.000 el 11-14 sep el descuento básico se mantiene o profundiza levemente"], ["Próx. earnings", "Q3 2026: 4-nov-2026 después del cierre (TipRanks, Investing.com, WallStreetZen; sin confirmación oficial primaria de Strategy a la fecha de este informe)"], ["Técnico (auto)", "RSI 54.7 · MACD +7.53 / señal +8.09 (TradingView, 15-sep-2026)"]], "technical": {"price": 129.6, "change_1d_pct": -5.36, "change_1w_pct": -1.05, "rsi": 54.7, "macd": 7.5332, "macd_signal": 8.0885, "sma20": 126.4845, "sma50": 108.2706, "sma200": 137.6018, "ema12": 130.4557, "ema26": 122.9225, "pct_vs_sma20": 2.46, "pct_vs_sma50": 19.7, "pct_vs_sma200": -5.82, "volume_today": 23136179, "volume_avg20": 19881194.0, "volume_ratio": 1.16, "volatility_30d": 103.74, "sharpe": 14.66, "sortino": 23.07, "max_drawdown_1y": -77.12, "price_percentile_1y": 16.9, "vs_benchmark_30d_pct": 15.92, "perf_1m_pct": 36.46, "perf_ytd_pct": -16.17}, "risk": {"volatility_30d": 103.74, "sharpe": 14.66, "sortino": 23.07, "max_drawdown_1y": -77.12, "n_days": 319, "window": 30}, "benchmark": {"ticker": "CRYPTO:BTCUSD", "label": "Bitcoin", "relative_performance_30d": 15.92, "relative_performance_ytd": -2.67, "price_percentile_1y": 16.9, "partial": false}, "sourcesMeta": {"price": {"origin": "TradingView scanner", "fetched_at": "2026-09-15T21:43:47-03:00"}, "rsi_macd": {"origin": "TradingView scanner", "fetched_at": "2026-09-15T21:43:47-03:00"}, "smas_volume": {"origin": "TradingView scanner", "fetched_at": "2026-09-15T21:43:47-03:00"}, "benchmark": {"origin": "TradingView scanner", "symbol": "CRYPTO:BTCUSD", "fetched_at": "2026-09-15T21:43:47-03:00"}, "risk_metrics": {"origin": "data/history/MSTR.json", "n_days": 319}}, "metricChanges": [{"ticker": "MSTR", "date": "2026-09-05", "metric": "precio_pct", "from": 123.19, "to": 142.8}, {"ticker": "MSTR", "date": "2026-08-23", "metric": "precio_pct", "from": 93.04, "to": 119.25}, {"ticker": "MSTR", "date": "2026-08-23", "metric": "rsi", "from": 43.27, "to": 66.07}, {"ticker": "MSTR", "date": "2026-07-31", "metric": "precio_pct", "from": 97.74, "to": 89.5}], "trend": {"piso": 0, "techo": 1, "max": 7, "senales_piso": [], "senales_techo": ["histograma MACD girando a la baja"]}, "change": {"day": -5.36, "week": -1.05}, "reportDate": "14 de septiembre de 2026", "events": [{"date": "2026-09-21", "label": "Próxima actualización semanal de tesorería BTC (8-K, típicamente lunes)", "kind": "corporate", "info": "Tras dos semanas consecutivas sin compras de BTC (8-K del 14-sep: 0 BTC, tesorería sin cambios en 845.050) y con foco en buybacks de STRC, el mercado vigila si Strategy retoma compras de BTC o mantiene la pausa mientras BTC ronda US$77.000 (SEC EDGAR, The Block, 14-sep-2026)."}, {"date": "2026-09-30", "label": "Cierre de consulta pública MSCI sobre elegibilidad de 'non-operating companies'", "kind": "corporate", "info": "Nueva consulta de MSCI (lanzada ago-2026, distinta de la de 2025 ya resuelta sin exclusión en feb-2026) propone un filtro de activos operativos <50% + 5 ratios financieros; aplicado hoy, excluiría a Strategy, Metaplanet y Yellow Cake del MSCI ACWI IMI. Saylor y Phong Le enviaron carta calificándola de 'discriminatoria' (The Block, Decrypt, Coindesk, 1-14 sep-2026)."}, {"date": "2026-10-16", "label": "Anuncio de resultados de la consulta MSCI", "kind": "corporate", "info": "MSCI espera anunciar resultados en torno al 16-oct; de aprobarse, la implementación sería en la revisión de índices del 11-nov-2026, con ventas pasivas forzadas sobre el free float de Strategy (~US$24 mil M) (MSCI index consultations, spotedcrypto.com, sep-2026)."}, {"date": "2026-11-04", "label": "Earnings Q3 2026", "kind": "earnings", "info": "Fecha estimada por TipRanks/Investing.com (after-close), pendiente de confirmación oficial de Strategy. El mercado buscará BTC Yield actualizado (5,0% en Q2 tras 3,2% en Q1; 4,5% YTD a jun-2026) y guía sobre ritmo de buybacks de preferentes vs. compras de BTC."}], "sections": {"resumen": "Strategy sigue en modo defensivo: el 8-K del 14-sep confirma cero compras de BTC por segunda semana consecutiva (845.050 BTC sin cambios), mientras destina US$139,3M a recomprar STRC con descuento. El mNAV básico (~0,78x) sigue en descuento, revirtiendo el régimen premium 2024-2025 que sostenía la emisión acretiva. BTC ronda US$77.000, cerca del promedio de compra de Strategy (US$75.412), dejando la posición con margen escaso. La nueva consulta MSCI sobre 'non-operating companies' (cierre 30-sep, resultado ~16-oct, implementación 11-nov) es el catalizador binario más cercano. Consenso Wall Street sigue Strong Buy con targets elevados, en tensión con el precio deprimido.", "fundamental": "- Tesorería: 845.050 BTC a costo promedio US$75.412 (~US$63,73 mil M invertidos); 0 BTC comprados en las semanas del 31-ago-6-sep y 7-13-sep (SEC 8-K, 8 y 14-sep-2026).\n- mNAV básico ~0,78x / diluido ~0,79x / EV ~1,06x al 31-ago-2026 — la acción cotiza bajo el valor de sus bitcoins por acción, cerrando la ventana de emisión acretiva de ATM.\n- BTC Yield: 3,2% en Q1 2026, 5,0% en Q2 2026 (4,5% YTD a jun); management espera mejorar con precios de BTC más altos, pero el objetivo de 1 millón de BTC para fin de 2026 luce fuera de alcance al ritmo actual.\n- Preferentes vivas (~US$15 mil M): STRC ~US$97,97 (yield var. ~12%), STRK ~US$72,26 (yield ~11%), STRF ~US$95,78, STRD ~US$66 (yield ~15%) al 11-sep-2026 — todas bajo par, evidenciando estrés de financiamiento.\n- Programa de recompra de STRC duplicado a US$2.000M (de US$1.000M) a inicios de sep; ya se ejecutaron ~US$176M (semana 7-sep) y US$139M (semana 13-sep), financiados con caja USD, priorizando esto sobre nuevas compras de BTC.", "valuacion": "- mNAV básico ~0,78x es el dato central: la acción vale menos que su BTC subyacente por acción, lo opuesto al régimen 2024-2025 (premium de hasta 3,4x).\n- Market cap ~US$51,1-51,9 mil M vs. valor de mercado de sus 845.050 BTC (~US$65 mil M a US$77.000/BTC) — el descuento es real y no solo un artefacto de EV vs. equity.\n- Consenso analistas Strong Buy con targets muy dispersos: promedio ~US$224,6 (S&P Global/16 analistas) hasta medianas de US$345 en pools más reducidos — refleja modelos anclados a supuestos alcistas de BTC, no al mNAV actual.\n- Percentil de precio a 1 año de solo 17,3% pese al rally reciente (+34,8% en 1 mes) — la acción sigue muy lejos de sus máximos de 52 semanas (US$365,21, oct-2025).\n- El descuento sobre NAV, si persiste, es autolimitante: cualquier emisión de equity a estos niveles diluye a los holders existentes en términos de BTC por acción.", "tecnico": "- RSI 57,0 y MACD +8,24 vs. señal +8,23 (cruce casi neutro, con histograma girando a la baja) — impulso alcista perdiendo fuerza tras el rally de agosto-septiembre.\n- Precio (US$130,97) por debajo de la SMA200 (US$138,03, -5,1%) pero muy por encima de SMA50 (US$106,97, +22,4%) — estructura de recuperación de corto plazo dentro de una tendencia de más largo plazo aún débil.\n- Volatilidad anualizada 30d de 102% y drawdown máximo a 1 año de -77% ilustran el perfil extremo típico del apalancamiento implícito sobre BTC.\n- Volumen en línea con el promedio de 20 días (ratio 1,02) — sin señal de acumulación o distribución anómala esta semana.\n- Caída semanal de -8,28% pese al +1,87% diario muestra el patrón de whipsaw característico de MSTR en septiembre, sin catalizador idiosincrático claro más allá de BTC.", "sentimiento": "- Consenso sell-side Strong Buy con targets promedio 57% sobre el precio actual — sentimiento institucional aún muy optimista pese al deterioro del mNAV.\n- Saylor publicó 'We're Back' en X el 31-ago al retomar compras tras 10 semanas de pausa, señal de gestión de narrativa hacia la base retail/cripto.\n- Cobertura de prensa cripto (The Block, Decrypt, Cointelegraph) enmarca la pausa de compras y los buybacks de STRC como 'disciplina de capital', mientras medios más escépticos (24/7 Wall St.) resaltan que la última compra de BTC ya está en pérdida.\n- Narrativa de 'death spiral' circula en foros y redes desde el mNAV <1x, pero fuentes especializadas (KuCoin, NEU Blockchain) la consideran prematura dado el perfil de deuda convertible sin covenants de margin call.\n- Divergencia sentimiento-precio marcada: consenso alcista de analistas vs. precio en percentil 17% de su rango anual — configuración clásica de sentimiento contrario.", "catalizadores": "**Catalizadores:**\n- Estabilización/repunte de BTC sobre US$80.000: reabriría la ventana de mNAV premium y permitiría retomar compras acretivas de BTC.\n- Resultado favorable de la consulta MSCI (retiro de la propuesta, ~16-oct): eliminaría el riesgo de ventas pasivas forzadas sobre el free float.\n- Reporte de BTC Yield Q3 en mejora sobre el 5,0% de Q2, mostrando que la maquinaria de creación de valor por acción sigue funcionando pese al mNAV bajo.\n- Reanudación de compras semanales de BTC en el 8-K del 21-sep, señal de que el management ve valor en acumular a estos niveles.\n\n**Riesgos (por materialidad):**\n- Exclusión confirmada de índices MSCI (anuncio ~16-oct, implementación 11-nov): forzaría ventas pasivas y presionaría aún más el mNAV.\n- BTC perdiendo el soporte de US$75.000-76.000: llevaría el valor de la tesorería bajo el costo promedio de adquisición, deteriorando percepción de solvencia.\n- Persistencia del mNAV bajo 1x por trimestres: cerraría permanentemente el acceso a capital barato vía ATM, forzando más ventas de BTC para servir preferentes.\n- Preferentes (STRK, STRF, STRD) cotizando con yields de 11-15% sugieren que el mercado de crédito ya está descontando estrés de refinanciamiento.", "conclusion": "MSTR es hoy un derivado apalancado de BTC en fase defensiva: dos semanas sin compras de BTC, foco en recomprar preferentes baratas, mNAV en descuento persistente. La tesis alcista de consenso (Strong Buy, targets ~+57%) choca con un precio en el percentil 17% de su rango anual y riesgos estructurales concretos (MSCI, servicio de preferentes, cierre de la ventana de emisión acretiva). No hay tesis sin vista de BTC: si BTC se estabiliza sobre US$78.000-80.000 y MSCI no excluye, el descuento de mNAV es oportunidad; si BTC cae bajo US$73.000-74.000 o MSCI excluye, el círculo vicioso se retroalimenta. Confianza: media, condicionada casi enteramente a variables exógenas (BTC, decisión MSCI)."}, "scores": {"tecnica": {"score": 48, "just": "RSI neutro (57) y MACD casi plano con histograma girando a la baja tras un rally de +34,8% en 1 mes; precio aún bajo SMA200 (-5,1%). Cambio de carácter incompleto: recuperación de corto plazo sin confirmación de tendencia mayor."}, "fundamental": {"score": 40, "just": "mNAV en descuento (~0,78x) cierra la máquina de emisión acretiva; dos semanas sin compras de BTC y prioridad en buybacks de preferentes muestran gestión táctica, no crecimiento. BTC Yield Q2 de 5,0% es el único dato claramente positivo."}, "sentimiento": {"score": 58, "just": "Divergencia contrarian marcada: consenso Strong Buy con targets muy por sobre el precio actual, mientras la acción cotiza en el percentil 17% de su rango anual — configuración típica de sentimiento excesivamente optimista en un activo deprimido, lo que puntúa alto en la lógica contraria."}, "riesgo": {"score": 28, "just": "Riesgo elevado por materialidad, no solo volatilidad: mNAV bajo 1x, ~US$15 mil M en preferentes perpetuas servidas con ventas de BTC, y riesgo binario MSCI con resultado en 4-8 semanas. Volatilidad 30d de 102% y drawdown -77% a 1 año agravan el perfil."}, "conviccion": {"score": 44, "just": "Asimetría real pero atada 100% a BTC: si BTC sube y MSCI no excluye, el descuento de mNAV se cierra rápido; si BTC cae o MSCI excluye, el riesgo de espiral se activa. Tesis falsable con catalizadores fechados (30-sep, 16-oct, 11-nov) pero sin margen de seguridad claro al precio actual."}}, "sources": ["SEC EDGAR (CIK 0001050446) — 8-K 14-sep-2026", "The Block", "24/7 Wall St.", "Fortune", "bitcointreasuries.net", "stockanalysis.com", "cryptotimes.io", "Decrypt", "Coindesk", "MSCI Index Consultations", "TipRanks", "S&P Global Market Intelligence (vía stockanalysis.com forecast)", "GuruFocus/Yahoo Finance (Q2 2026 earnings call)", "TradingView scanner"], "opportunity": {"cats": {"valuacion_hist": {"score": 58, "just": "mNAV básico ~0,78x está en descuento, cerca de mínimos históricos (0,68x en agosto), revirtiendo el régimen premium 2024-2025 que llegó a 3,4x."}, "calidad": {"score": 32, "just": "Tesorería de 845.050 BTC intacta pero sin compras en dos semanas consecutivas; ~US$15 mil M en preferentes perpetuas exigen acceso continuo a mercados de capital mientras el mNAV está en descuento."}, "asimetria": {"score": 62, "just": "Upside si BTC recupera US$80.000+ y el mNAV se normaliza hacia 1x; downside parcialmente acotado porque el descuento actual ya refleja buena parte del pesimismo reciente."}, "catalizadores": {"score": 52, "just": "Consulta MSCI (cierre 30-sep, resultado ~16-oct) y earnings Q3 (~4-nov) son catalizadores binarios con fecha concreta pero de resultado incierto en ambas direcciones."}, "contrarian": {"score": 60, "just": "mNAV en descuento combinado con consenso de analistas fuertemente alcista (targets ~57% sobre el precio) sugiere pesimismo de precio no del todo alineado con la tesorería subyacente."}}, "plan": {"recomendacion": "Esperar gatillo", "zona_compra": "US$115-128 si BTC se estabiliza sobre US$76.000-78.000 y se confirma reanudación de compras de BTC en el 8-K del 21-sep", "invalidacion": "Pérdida de soporte BTC bajo US$73.000-74.000, o exclusión MSCI confirmada (~16-oct) con implementación en revisión del 11-nov", "gatillos": ["Reanudación de compras semanales de BTC en 8-K del 21-sep", "Resultado de consulta MSCI (~16-oct)", "BTC Yield Q3 mostrando mejora sobre 5,0% de Q2", "mNAV básico recuperando >1x de forma sostenida"], "horizonte": "6-18 meses", "tamano": "Posición pequeña-moderada", "confianza": "media"}}, "perfil": "Strategy es formalmente una empresa de software de inteligencia de negocios, pero su negocio real es ser un vehículo apalancado de tesorería en bitcoin: el software factura ~$500M anuales y funciona como ancla contable, no como driver de valor. La maquinaria es emitir acciones, convertibles y preferentes perpetuas (~$15.000M vivos) para comprar bitcoin. La lógica es reflexiva y depende del mNAV: mientras la acción cotice sobre el valor de sus bitcoins por acción, emitir es acretivo y el ciclo se autoalimenta. En 2026 se invirtió — el mNAV cayó de ~3,4x a niveles de descuento (0,68x-0,78x) y la empresa pasó de comprador estructural a gestor táctico, priorizando recompra de preferentes sobre nuevas compras de BTC mientras mantiene 845.050 BTC comprados a ~$75.412 promedio. Lo estructural: exige acceso permanente al mercado de capitales; las preferentes son una obligación de caja perpetua contra un activo que no genera flujo; y los ETFs spot erosionaron su moat original. El riesgo terminal es la espiral: descuento sobre NAV, imposibilidad de emitir acretivamente, venta de bitcoin para pagar cupones."}, {"ticker": "CCU", "company": "Compañía Cervecerías Unidas S.A.", "statsList": [["Precio", "$5.373 CLP (15-sep-2026)"], ["Rango 52 sem.", "$4.947 – $6.598 CLP"], ["Listado", "Bolsa de Santiago: CCU (IPSA) · ADR NYSE: CCU US$11,25"], ["Market cap", "~CLP 1,95-2,0 billones (US$2,06B vía ADR)"], ["P/E · EV/EBITDA", "17,3x trailing / ~15x fwd · EV/EBITDA 8,7x"], ["Dividend yield", "~3,0% (div. definitivo $74,53 pagado abr-2026)"], ["Target consenso", "$5.877 CLP (+11%) — 2 buy / 4 hold / 4 sell"], ["Próx. earnings", "6-ago-2026 (2T26)"], ["Técnico (auto)", "RSI 41.3 · MACD +2.04 / señal +32.50 (TradingView, 15-sep-2026)"]], "change": {"day": -1.86, "week": -1.95}, "sections": {"resumen": "CCU llega a julio 2026 como un claro rezagado del rally chileno: mientras el IPSA encadena máximos históricos, la acción opera ~20% bajo su máximo de 52 semanas ($6.598) tras un año bajista, aunque en las últimas semanas construye una base sobre los $5.000 con el MACD recién cruzado al alza. La tesis tiene tres patas: un negocio en Chile que opera muy bien (EBITDA +13,7% en 1T26, margen 20%, viento a favor del peso fuerte), dos lastres visibles (Argentina con EBITDA −18,6% y Vinos con −50,1%) y una valuación ~20% por debajo de su promedio histórico de 10 años. El consenso es tibio (Hold/Neutral, target $5.877) pero con dispersión extrema: BICE ve +52% ($7.794) y UBS recomienda vender ($4.750). Catalizadores inmediatos: resultados 2T26 el 6-ago y las primeras señales del nuevo CEO Eduardo Ffrench-Davis, que asumió el 1-jul con foco declarado en márgenes y eficiencia.", "fundamental": "**Resultados 1T26** (reportados 6/7-may-2026):\n\n- HECHO: Ventas consolidadas CLP 819.515 millones (+0,2% a/a); EBITDA CLP 131.644 millones (+0,1%), margen estable en 16,1%; utilidad controladora CLP 53.856 millones (−6,8%, ~US$58M); UPA CLP 145,8; volúmenes consolidados +1,8% (press release 1Q26 / TipRanks / La Tercera, may-2026).\n- HECHO — **Chile, el motor**: ventas +3,9%, EBITDA +13,7% a CLP 107.357 millones, margen 20,0% (+173 pb), ayudado por la apreciación del CLP de 8,1% vs USD (menores costos dolarizados) y volúmenes +3,9% liderados por categorías no alcohólicas (press release 1Q26, may-2026).\n- HECHO — **Negocios Internacionales** (Argentina, Bolivia, Paraguay, Uruguay): ventas −6,7%, EBITDA −18,6% a CLP 28.489 millones; volúmenes −1,7% con caída de un dígito medio en cerveza en Argentina (press release 1Q26).\n- HECHO — **Vinos**: ventas −7,2%, EBITDA −50,1% a CLP 3.288 millones (margen −508 pb) por mayor costo del vino y sobreoferta global (~US$19B de inventario excedente en la industria) (press release 1Q26; DF, 12-jun-2026).\n- HECHO: TTM en USD (ADR): revenue US$3,13B (−2,2%), utilidad neta US$121,8M (−32,0%); ROE 7,3-7,9%; Deuda/Patrimonio 0,71x (StockAnalysis 20-jul-2026; Visfin jul-2026).\n\n**Propiedad y movimientos corporativos:**\n\n- HECHO: IRSA controla el 65,87% de CCU; IRSA es JV 50/50 entre Quiñenco y Heineken. Free float: 20,04% local + 14,09% ADR (ccuinvestor.com, 2026).\n- HECHO: CCU completó la compra de la participación de Nestlé en el JV de aguas por US$180 millones (DF, 12-jun-2026).\n- HECHO: Eduardo Ffrench-Davis asumió como CEO el 1-jul-2026 tras 28 años de Patricio Jottar, quien pasa al directorio; Alexandre Carreteiro (presidente de Heineken Américas) fue nombrado vicepresidente del directorio (TipRanks, jul-2026).\n- LECTURA: el negocio chileno (dos tercios del EBITDA) está en su mejor momento de márgenes en años; el problema de CCU no es operacional en su core, sino la exposición a Argentina y al ciclo global del vino. La mayor injerencia de Heineken en el directorio puede traer disciplina de márgenes o tensión con Quiñenco — sin evidencia de conflicto por ahora.", "valuacion": "- HECHO: P/E trailing 17,25x local / 16,9-18,4x ADR; forward ~15x (BTG estima 13,3x); EV/EBITDA 8,66x (Investing/Visfin/StockAnalysis, jul-2026).\n- HECHO: la acción transa **~20% por debajo de su promedio de valuación de los últimos 10 años** (DF, 12-jun-2026).\n- HECHO: dividend yield ~3,0% local (dividendo definitivo N°272 de $74,53 por acción pagado desde el 24-abr-2026) (TipRanks/Diario Estrategia, abr-2026).\n- HECHO — targets locales: consenso **$5.877 CLP (+11%)**, máx $6.600, mín $4.365; 2 buy / 4 hold / 4 sell (Investing.com, jul-2026). Casas (DF, 12-jun-2026): **BICE Sobreponderar PO $7.794 (+52%)**, **BTG Neutral PO $6.500**, **UBS Vender PO $4.750** (argumenta crecimiento de ingresos de un dígito hasta 2028).\n- HECHO: ADR consenso Hold, target US$12,46 (+10,8%, 7 analistas) (StockAnalysis, 20-jul-2026).\n- LECTURA: la valuación es el corazón de la tesis alcista — múltiplos comprimidos contra la propia historia con un IPSA que transa ~12% caro vs la suya. Pero el descuento tiene causa: el upside depende de que Argentina y Vinos se normalicen, no del negocio chileno que ya opera bien y está en el precio. La dispersión BICE/UBS (de +52% a −7%) refleja exactamente esa apuesta.", "tecnico": "- HECHO: precio $5.285 CLP, +1,28% en la sesión del lunes 20-jul y +1,63% vs 5 ruedas atrás (TradingView tiempo real, 20-jul-2026).\n- HECHO: RSI(14) diario 56,3 — neutral con sesgo alcista; MACD(12,26,9) +12,6 sobre señal −1,0 (histograma +13,6): **cruce alcista reciente** (calculado sobre 130 barras diarias de TradingView, 20-jul-2026).\n- HECHO: precio sobre la SMA20 (~$5.183, +2,0%) y SMA50 (~$5.204, +1,6%), y justo en la SMA100 (~$5.285); bajo la MM200 publicada (~$5.670) (TradingView 20-jul-2026; Visfin jul-2026).\n- HECHO: señal técnica diaria \"Strong Buy\", semanal neutral (Investing.com, jul-2026). Mínimo de 52 semanas $4.947 tocado a inicios de mayo; desde ahí, piso doble en la zona $5.000-5.050 (jun y feb).\n- LECTURA: estructura de base tras 12 meses bajistas (−16,6% en las últimas ~26 semanas). Soportes: $5.183-5.204 (SMA20/50) y $5.000-4.947; resistencias: $5.443 (máximo intradía del 20-jul), $5.670 (MM200) — su recuperación sería la confirmación de cambio de tendencia — y la zona $6.600. El cruce de MACD con RSI aún lejos de sobrecompra deja espacio al rebote, pero mientras siga bajo la MM200 es un rebote dentro de tendencia bajista, no una tendencia alcista nueva.", "catalizadores": "- HECHO: **resultados 2T26 el 6-ago-2026** (StockAnalysis, jul-2026). LECTURA: trimestre de invierno, estacionalmente débil en volúmenes; el foco estará en si Chile sostiene margen 20% y en el ritmo de deterioro/mejora argentino.\n- HECHO: **nuevo CEO** Eduardo Ffrench-Davis desde el 1-jul-2026, con prioridad declarada en márgenes y eficiencia; renovación de comités del directorio entre julio y agosto (DF 12-jun-2026; TipRanks jul-2026). LECTURA: primer plan estratégico del nuevo management es el catalizador idiosincrático más cercano.\n- HECHO: **tipo de cambio** — USD/CLP ~926 (14-jul-2026), con el CLP apreciado 8,1% vs USD en 1T26: viento a favor directo en costos dolarizados del segmento Chile (dolarhoy.net; press release 1Q26).\n- HECHO: **insumos** — aluminio LME ~US$3.160-3.200/t con inventarios −43% en el año y déficit proyectado (~930 kt según Macquarie); cebada y lúpulo europeos +12-18% de costo desembarcado en 1T26 (TradingEconomics/AgMetalMiner/Expert Market Research, jul-2026).\n- HECHO: **Argentina** — consumo masivo −3,3% acumulado en 2026, pero inflación mensual desacelerando (<2% proyectado para julio) y expectativa de recuperación gradual del consumo en 2S26 (Bloomberg Línea/Infobae, jun-2026). LECTURA: la recuperación argentina es la opción de mayor convexidad de la tesis.\n- HECHO: **macro Chile** — PIB 1T26 −0,5% a/a, Imacec de mayo −0,9% (quinto retroceso consecutivo), Banco Central recortó el crecimiento 2026 hacia ~1%, riesgo de recesión técnica (Emol/Bloomberg/XTB, mar-jul 2026). LECTURA: el 1T26 se benefició de un consumo chileno que ya no acelera — el viento de cola doméstico se está apagando.", "sentimiento": "- HECHO: consenso local Neutral con 2 buy / 4 hold / 4 sell y PO $5.877 (Investing, jul-2026); ADR Hold con target US$12,46 (StockAnalysis, 20-jul-2026). El DF tituló (12-jun-2026): \"Argentina y alta exposición a vinos y cervezas hacen dudar al mercado\".\n- HECHO: noticias de los últimos 45 días — cierre de la compra del JV de aguas a Nestlé (US$180M, jun), cambio de CEO y reordenamiento del directorio con mayor presencia de Heineken (1-jul), y entrada en vigencia de nuevas restricciones a la publicidad de alcohol en Chile el 7-jul-2026.\n- HECHO: contexto IPSA — el índice acumula ~70 máximos históricos en el año, transa ~12% más caro que su historia, con flujos extranjeros récord (US$112M vía el principal ETF en el año) y targets como el de Bci en 12.050 puntos; el optimismo se moderó en julio por el débil crecimiento (DF/Emol/Bloomberg, 2026).\n- LECTURA: el contraste es la historia — el IPSA en máximos mientras CCU está 20% bajo su peak la convierte en uno de los grandes laggards del rally chileno. Eso sostiene el argumento de valuación relativa (BICE), pero 4 de 10 analistas locales recomiendan vender: el mercado no compra la normalización de Argentina y Vinos todavía. Sin datos públicos de posicionamiento institucional o insiders para el papel local.", "conclusion": "CCU es una apuesta de valuación y reversión a la media, no de momentum: negocio core chileno en su mejor nivel de márgenes, múltiplos 20% bajo su historia, 3% de yield, y dos lastres (Argentina, Vinos) que explican el descuento y cuya normalización — no garantizada — es el upside. El técnico acompaña por primera vez en meses (cruce de MACD, sobre SMA20/50, doble piso en $5.000) pero la MM200 en $5.670 sigue arriba como techo de la tendencia. Con el consenso en Hold y el IPSA caro, el papel ofrece asimetría razonable bajo $5.300 con soporte claro en $5.000, catalizador fechado el 6-ago (2T26) y la incógnita del plan del nuevo CEO. La señal es **Hold** con sesgo constructivo: para pasar a Buy se necesita recuperar la MM200 y/o evidencia de que Argentina dejó de drenar EBITDA; para venderla, perder los $5.000 que ya defendió dos veces."}, "scores": {"tecnica": {"score": 60, "just": "Rebote con confirmación: cruce alcista de MACD, RSI 56 con espacio, precio sobre SMA20/50 y doble piso defendido en $5.000. Se descuenta porque sigue bajo la MM200 ($5.670) y 20% bajo el máximo de 52 semanas — es una base dentro de tendencia bajista, aún no una tendencia alcista."}, "fundamental": {"score": 62, "just": "Chile (dos tercios del EBITDA) con margen 20% y EBITDA +13,7%, balance sano (D/E 0,71x) y valuación 20% bajo su media histórica con 3% de yield. Los lastres pesan: Argentina −18,6% y Vinos −50,1% de EBITDA, utilidad total −6,8% y ROE mediocre (~7,5%)."}, "sentimiento": {"score": 46, "just": "Consenso tibio con 4 de 10 analistas locales en venta, laggard notorio del rally IPSA y titulares de prensa escépticos (\"hacen dudar al mercado\"). A favor: dispersión de targets con el extremo alcista (BICE +52%) bien argumentado y flujos extranjeros récord hacia la bolsa chilena que eventualmente rotan a rezagados."}, "riesgo": {"score": 50, "just": "Negocio defensivo de consumo básico con 65% del mercado cervecero chileno y controlador sólido (Quiñenco/Heineken), pero triple exposición adversa: macro chilena deteriorándose (5 Imacec negativos), Argentina sin piso confirmado, sobreoferta global de vino, más costos de aluminio y cebada al alza y nuevas restricciones publicitarias vigentes desde el 7-jul."}, "conviccion": {"score": 55, "just": "Catalizadores concretos y fechados (2T26 el 6-ago, plan del nuevo CEO, recuperación argentina en 2S26) y tesis falsable con niveles claros ($5.000 abajo, MM200 $5.670 arriba). La convicción es media porque el timing de la normalización de Argentina y Vinos es incierto y el consenso lleva meses sin comprarla."}}, "sources": ["TradingView — BCS:CCU tiempo real, 130 barras diarias; RSI/MACD/SMA calculados (20-jul-2026)", "Investing.com — cotización local, consenso 2/4/4, PO $5.877, P/E, yield (jul-2026)", "StockAnalysis.com — ADR CCU, targets, forward P/E, EV/EBITDA, earnings 6-ago (20-jul-2026)", "Visfin.cl — MM50/200, ROE, D/E (jul-2026)", "CCU Investor — Press Release 1Q26 (6-may-2026)", "TipRanks — resultados 1T26; transición CEO/directorio; dividendo abr-2026 (may-jul 2026)", "La Tercera/Pulso — utilidad 1T26 US$58M (may-2026)", "Diario Financiero — POs BICE $7.794 / BTG $6.500 / UBS $4.750; compra JV aguas Nestlé US$180M (12-jun-2026)", "ccuinvestor.com / Quiñenco — estructura de propiedad IRSA 65,87% (2026)", "Bloomberg Línea / Infobae — consumo Argentina −3,3% 2026, inflación desacelerando (jun-2026)", "Bloomberg / Emol / XTB — macro Chile: Imacec, riesgo de recesión técnica, gobierno Kast (mar-jul 2026)", "TradingEconomics / AgMetalMiner — aluminio LME, déficit proyectado (jul-2026)", "Expert Market Research / Mordor — mercado cervecero Chile: CCU ~65%, ABI ~30% (2025-2026)", "Senado.cl / La Tercera — Ley 21.363: restricciones publicidad alcohol desde 7-jul-2026", "dolarhoy.net — USD/CLP 926 (14-jul-2026)"], "events": [{"date": "2026-08-06", "label": "Resultados 2T26", "kind": "earnings", "info": "Sin consenso público disponible para el 2T26 (trimestre estacionalmente débil). Se mirará si se repite el patrón del 1T26: Chile sólido pero consumo debilitado en Argentina y un negocio del vino 'particularmente difícil' (Diario Financiero, may 2026). Claves: volúmenes por país, traspaso de precios a márgenes y el efecto del tipo de cambio argentino en resultados consolidados."}], "risk": {"volatility_30d": 31.98, "sharpe": 0.42, "sortino": 0.45, "max_drawdown_1y": -24.07, "n_days": 328, "window": 30}, "benchmark": {"ticker": "CBOE:ECH", "label": "ECH (proxy Chile/IPSA)", "relative_per ambiarias y carga financiera. El apalancamiento subió a 4,17x deuda neta/EBITDA, muy sobre el rango objetivo 2,5x-3,5x, tras el downgrade de S&P a BBB- en feb-2026 (al borde del grado especulativo). El proyecto Natureza en Brasil (US$4.500-4.600M) avanza en permisos portuarios pero enfrenta litigio ambiental por consulta indígena. Consenso polarizado: JPM Neutral/cauteloso, Itaú BBA underweight ($1.030), MBI sobreponderar (+50% potencial, $2.077).", "fundamental": "- HECHO: EBITDA 2T26 US$270M (margen 14,1%, +6% t/t); Pulp EBITDA US$180M (margen 23,4%) por BHKP a US$600/t (+7% t/t); Softys EBITDA US$101M (+24% a/a) (DF, GuruFocus, Investing.com, ago-2026).\n- HECHO: utilidad neta 2T26 cayó a US$9M; utilidad semestral se desplomó 74% a US$33M pese a ingresos estables, por FX y gasto financiero (La Tercera, DF, ago-2026).\n- HECHO: deuda neta/EBITDA en 4,17x (2T26), sube desde 3,97x (2025) y muy sobre rango objetivo 2,5x-3,5x (reporte corporativo, ago-2026).\n- HECHO: S&P bajó rating de BBB a BBB- el 11-feb-2026; posteriormente afirmó BBB- pero con outlook bajo presión por desapalancamiento lento (S&P Global Ratings, feb/ago-2026). Un notch más abajo implicaría perder investment grade.\n- LECTURA: Natureza (US$4,6bn, 2,5 Mt/año BHKP) definirá el perfil de riesgo de mediano plazo; decisión final de inversión aún pendiente, condicionada a financiamiento y permisos ambientales.", "valuacion": "- HECHO: P/B ~0,28x y EV/EBITDA ~8x sobre EBITDA de fondo de ciclo, forward P/E ~14,9x (stockanalysis.com, sep-2026); múltiplos depreciados frente a book value.\n- HECHO: market cap ~CLP 2,5-2,7 billones (~US$2.650-2.900M), cerca de mínimos de varios años (Investing.com, TradingView, sep-2026).\n- LECTURA: valuación barata en términos de libro pero justificada parcialmente por apalancamiento elevado y riesgo de rating; no es una anomalía pura de mercado.\n- HECHO: consenso de 15 estimaciones Bloomberg promedia ~CLP 1.500 de precio objetivo, con Itaú BBA en el piso (CLP 1.030) y MBI en el techo (CLP 2.077) (DF, sep-2026).\n- LECTURA: la dispersión de targets (aprox. 2x entre el más bajo y el más alto) señala alta incertidumbre sobre el ciclo de celulosa y Natureza, no solo diferencias de modelo.", "tecnico": "- HECHO (dado): precio $1.010,9, RSI 44,9 (zona neutral, sin sobreventa extrema), MACD -6,08 bajo señal -3,51 (momentum aún negativo pero convergiendo).\n- HECHO (dado): precio está -1,85% bajo SMA20, -3,11% bajo SMA50 y -14,93% bajo SMA200; tendencia de mediano plazo sigue bajista.\n- HECHO (dado): volumen hoy 1,25M vs promedio 20d de 2,30M (ratio 0,54x) — volumen vendedor secándose, consistente con señal de piso.\n- LECTURA: percentil de precio 1 año en 4,5% confirma que la acción opera cerca de su piso anual; las 2 señales de piso activas (secado de volumen, base sobre mínimo) sugieren posible agotamiento vendedor, pero sin confirmación de cambio de tendencia (no hay señales de techo ni cruce alcista de MACD).\n- LECTURA: Sharpe -2,23 y Sortino -2,16 reflejan que el retorno ajustado por riesgo del último período fue muy pobre; drawdown de -36,25% en 1 año es severo.", "sentimiento": "- HECHO: JPMorgan mantiene Neutral con PT recortado a CLP 1.400 (desde 1.600) por sobreoferta de celulosa y aporte limitado de Softys/Packaging (DF, 2026).\n- HECHO: Itaú BBA mantiene underweight con PT CLP 1.030 a fin de 2026, el más bajo de 15 estimaciones Bloomberg (DF, 2026).\n- HECHO: MBI mantiene sobreponderar con PT CLP 2.077 (recortado desde 2.417), viendo +50% de potencial y considerando que 2025 no representa la 'velocidad de crucero' de la empresa (DF, redimin.cl, 2026).\n- LECTURA: consenso polarizado — visión bajista de casas globales (JPM, Itaú) centrada en oferta de celulosa y apalancamiento, frente a visión local constructiva (MBI) centrada en mean-reversion de precios de celulosa desde niveles históricamente bajos.\n- LECTURA: la polarización en sí es una señal contraria potencial: cuando el consenso está dividido cerca de mínimos de varios años, el catalizador (celulosa o rating) puede resolver la tesis en cualquier dirección con fuerza.", "catalizadores": "**Catalizadores:**\n- Reporte 3T26 (5-nov-2026): clave ver si el desapalancamiento revierte desde 4,17x y si el margen Pulp se sostiene sobre 20%.\n- Decisión final de inversión de Natureza: pendiente, condicionada a Licença Prévia ambiental y estructura de financiamiento de ~25.000M reales.\n- Posible acción adicional de rating (S&P/Fitch/Moody's) si el apalancamiento no cede — riesgo binario sobre el investment grade.\n- Evolución del precio BHKP en China: tras repuntar a ~US$600/t en 2T26, JPM espera presión bajista en 2S26 por sobreoferta.\n\n**Riesgos (por materialidad):**\n- Pérdida de investment grade: apalancamiento en 4,17x muy sobre el rango objetivo; un downgrade adicional a especulativo dispararía covenants y encarecería refinanciamiento.\n- Sobreoferta de celulosa global (Suzano Cerrado, UPM Paso de los Toros a full capacity, Arauco Sucuriú) presionando precios BHKP en 2S26.\n- Litigio ambiental/social de Natureza en Brasil (MPF, consulta indígena) puede retrasar aún más el proyecto o encarecerlo.\n- Exposición cambiaria: ingresos en USD pero deuda también dolarizada junto a costos en CLP/BRL — volatilidad FX afecta directamente la utilidad neta (ya se vio en 2T26).", "conclusion": "CMPC transita un punto de inflexión: operativamente mejora (EBITDA y precio de celulosa al alza en 2T26) pero financieramente se deteriora (apalancamiento en máximos, rating al borde del grado especulativo). El técnico muestra agotamiento vendedor sin confirmar reversión. El consenso está genuinamente dividido entre riesgo de rating/oferta (JPM, Itaú BBA) y mean-reversion de celulosa (MBI). Natureza es la variable que define el largo plazo, con avances de permisos pero litigio activo. Confianza media-baja: la tesis es asimétrica pero depende de catalizadores binarios (rating, 3T26, Natureza) fuera del control de CMPC. Postura: esperar confirmación antes de aumentar exposición."}, "scores": {"tecnica": {"score": 54, "just": "RSI neutral y volumen vendedor secándose sostienen las 2 señales de piso, pero MACD sigue negativo y precio bajo las 3 SMAs — cambio de carácter incipiente, no confirmado."}, "fundamental": {"score": 38, "just": "Mejora operativa en Pulp/Softys es real, pero apalancamiento en 4,17x y utilidad neta colapsada (-74% semestral) pesan más; rating al borde de perder investment grade."}, "sentimiento": {"score": 55, "just": "Consenso polarizado en un extremo de valuación (percentil 4,5% en 1 año) — configuración clásica de contrarian, aunque sin catalizador claro de corto plazo que fuerce convergencia."}, "riesgo": {"score": 30, "just": "Volatilidad 30d de 20,6% es moderada, pero el riesgo de pérdida permanente por downgrade a grado especulativo es alto y binario — distinto de simple ruido de precio."}, "conviccion": {"score": 42, "just": "Asimetría atractiva desde mínimos anuales, pero tesis depende de catalizadores externos (celulosa, rating, Natureza) verificables en 3T26 y acciones de agencias — falsable pero de resolución incierta en el tiempo."}}, "sources": ["S&P Global Ratings", "Diario Financiero", "La Tercera", "Investing.com/GuruFocus", "The Clinic", "Brasil de Fato / MPF Brasil", "MarketScreener/findata.cl", "stockanalysis.com", "TradingView", "redimin.cl"], "opportunity": {"cats": {"valuacion_hist": {"score": 66, "just": "P/B ~0,28x y percentil de precio 1 año de solo 4,5% marcan valorización históricamente muy comprimida, aunque parcialmente justificada por el riesgo de rating y la caída de utilidad neta."}, "calidad": {"score": 45, "just": "Negocio integrado y diversificado geográficamente con recuperación operativa en Pulp/Softys, pero apalancamiento en 4,17x deuda neta/EBITDA (sobre el rango objetivo) y rating al borde de perder investment grade limitan la calidad."}, "asimetria": {"score": 52, "just": "Downside parcialmente acotado por la valorización ya deprimida, pero el upside depende de la resolución binaria de rating crediticio y de la decisión final de inversión de Natureza, sin fecha firme."}, "catalizadores": {"score": 44, "just": "Reporte 3T26 (5-nov, confirmado) y el litigio/permisos ambientales de Natureza son catalizadores identificables, pero sin certeza de resultado favorable ni fecha firme para el FID del proyecto."}, "contrarian": {"score": 56, "just": "Consenso polarizado (JPM/Itaú BBA cautelosos vs. MBI sobreponderar con +50% de potencial) mientras la celulosa muestra recuperación secuencial — contrarian moderado, no extremo, dado que persiste el riesgo de rating."}}, "plan": {"recomendacion": "Esperar gatillo", "zona_compra": "Bajo $950-1.000 CLP", "invalidacion": "Downgrade a grado especulativo o quiebre del mínimo anual (~$988)", "gatillos": ["Reporte 3T26 (5-nov-2026)", "Decisión final de inversión / avance regulatorio de Natureza", "Acción de rating S&P/Fitch/Moody's"], "horizonte": "6-18 meses", "tamano": "posición pequeña-inicial", "confianza": "media-baja (datos de celulosa post-2T26 no confirmados con fecha exacta; ver limitación declarada)"}}, "perfil": "CMPC es un grupo forestal-industrial chileno integrado verticalmente, desde plantaciones propias de pino y eucalipto hasta celulosa de mercado, papeles y consumo masivo, con operaciones en ocho países. Se organiza en Pulp (celulosa y madera), Softys (tissue y cuidado personal) y Biopackaging. En 2025 facturó ~USD 7.480 millones con un mix de ventas de Softys 45-47%, Pulp 39-40% y Biopackaging 14%, pero la caja se concentra en Pulp, que aportó la mayoría del EBITDA con márgenes muy superiores a los de Softys. Chile pesa solo ~16% de las ventas: México y Brasil son los mayores mercados de consumo y Asia absorbe el grueso de la celulosa exportada. Estructuralmente es un negocio precio-tomador, atado al ciclo de la celulosa BHKP y a la demanda china, con Softys como contrapeso de menor margen pero flujo estable. El calce cambiario ayuda (ingresos en dólares contra costos e ct": 8.78, "perf_ytd_pct": -26.33}, "risk": {"volatility_30d": 34.61, "sharpe": 1.89, "sortino": 1.91, "max_drawdown_1y": -40.62, "n_days": 319, "window": 30}, "benchmark": {"ticker": "CBOE:ECH", "label": "ECH (proxy Chile/IPSA)", "relative_performance_30d": 11.35, "relative_performance_ytd": -22.9, "price_percentile_1y": 18.4, "partial": false}, "sourcesMeta": {"price": {"origin": "TradingView scanner", "fetched_at": "2026-09-15T21:43:47-03:00"}, "rsi_macd": {"origin": "TradingView scanner", "fetched_at": "2026-09-15T21:43:47-03:00"}, "smas_volume": {"origin": "TradingView scanner", "fetched_at": "2026-09-15T21:43:47-03:00"}, "benchmark": {"origin": "TradingView scanner", "symbol": "CBOE:ECH", "fetched_at": "2026-09-15T21:43:47-03:00"}, "risk_metrics": {"origin": "data/history/CENCOSUD.json", "n_days": 319}}, "metricChanges": [{"ticker": "CENCOSUD", "date": "2026-08-23", "metric": "rsi", "from": 37.55, "to": 58.56}], "trend": {"piso": 0, "techo": 0, "max": 7, "senales_piso": [], "senales_techo": []}, "change": {"day": 2.45, "week": 4.54}, "reportDate": "14 de septiembre de 2026", "events": [{"date": "2026-11-03", "label": "Earnings 3T26 (fecha estimada, no confirmada por IR)", "kind": "earnings", "info": "Sin calendario IR oficial que confirme la fecha; se estima por patrón histórico (1T26: 7-may, 2T26: 6-ago, 3T25 fue 4-nov-2025). El mercado buscará si el margen de supermercados Chile sostiene el registro de 10,5% (27° trimestre consecutivo en doble dígito) y si hay señales de mejora en 2S26 tal como guio el CFO tras un 2T26 débil."}, {"date": "2026-12-01", "label": "Resolución SIC Colombia sobre adquisición de Makro (fecha aproximada)", "kind": "corporate", "info": "La Superintendencia de Industria y Comercio de Colombia inició análisis formal el 24-jul-2026 tras solicitud de preevaluación; el proceso se ha extendido más de lo esperado por cambios normativos del gobierno Petro (Infobae, 2-ago-2026). Sin fecha de resolución confirmada."}, {"date": "2026-12-15", "label": "Aprobación CADE (Brasil) para compra de St. Marche (fecha aproximada)", "kind": "corporate", "info": "El cierre de la adquisición de St. Marche (32 tiendas premium en São Paulo, ventas ~US$216MM LTM mar-2026) está sujeto a aprobación del CADE; no se encontró confirmación de cierre a sep-2026 (LECTURA: cobertura de prensa jun-2026)."}, {"date": "2026-12-31", "label": "Meta de ~40 locales Don Salva (hard discount) (fecha aproximada)", "kind": "corporate", "info": "Lanzado en Chile en may-2026; a inicios de agosto operaban 4-5 locales de los ~40 proyectados para fin de año. Formato clave de respuesta a la guerra promocional y a la irrupción de Tottus (HECHO: Chócale/Forbes Chile, ago-2026)."}], "sections": {"resumen": "Cencosud cotiza en $2.039,5 CLP, recuperando técnicamente (RSI 51, sobre SMA20/50 pero -17% bajo SMA200) tras un 2026 marcado por guerra promocional en Chile y flaqueza operativa. El 2T26 decepcionó: EBITDA ajustado consolidado -12,3% a CLP 329.000M y pérdida neta de CLP 36.455M, aunque Chile sostuvo margen de supermercados en 10,5% (27° trimestre en doble dígito) y Argentina mostró fuerte mejora en moneda local (EBITDA +39,1% local) pese a que su peso en el EBITDA consolidado cayó a ~11,6%. El leverage neto subió a 3,6x, sobre el objetivo de 3,0x. Consenso Neutral, con BICE retirando la acción de su cartera recomendada en agosto pero MBI manteniendo Sobreponderar. Confianza: media.", "fundamental": "- Ingresos 2T26 CLP 4.094.746M; EBITDA ajustado CLP 329.000M (margen 8,0%, -12,3% interanual) vs CLP 375.000M en 2T25 (HECHO: Investing.com/mercado.com.ar, ago-2026).\n- Chile: margen EBITDA supermercados 10,5%, 27° trimestre consecutivo en doble dígito pese a intensidad promocional y costos logísticos al alza (HECHO: press release/Investing.com 2T26, 7-ago-2026).\n- Argentina: EBITDA supermercados +105,7% en moneda local con expansión de 201pb de margen (a 5,5% consolidado); peso en EBITDA consolidado cayó de 28,1% (hace 2 años) a ~11,6% por devaluación contable, no por deterioro del negocio (HECHO/LECTURA combinada, ago-2026).\n- Leverage neto subió a 3,6x (desde 3,4x en 1T26 y 3,2x a dic-2025), por sobre el objetivo de largo plazo de 3,0x; cobertura EBITDA/gastos financieros bajó a 3,6x desde 3,8x (HECHO: Investing.com/company filings, 2026).\n- Guidance FY2026 (emitido ene-2026): ingresos consolidados US$18.413MM y EBITDA ajustado US$1.815MM (+15% vs 2025); tras el 2T26 débil, el CFO no revisó formalmente la cifra pero reconoció que el trimestre estuvo bajo lo esperado y proyectó mejora en 2S26 (HECHO: guidance PDF ene-2026; LECTURA: comentarios CFO call 2T26, ago-2026 — no hay confirmación de revisión formal a la baja).", "valuacion": "- P/E trailing ~35,5x distorsionado por caída de utilidad neta y cargos no operacionales/hiperinflacionarios; P/E forward ~12,3x sugiere expectativa de normalización de utilidades en 2027 (LECTURA: stockanalysis.com, sep-2026).\n- Market cap ~CLP 5,54-5,59 billones (~US$5,8-6,0MM), cerca del piso del rango 52 semanas ($1.882) tras caída YTD de -29,5% (HECHO: technical dado).\n- Target consenso implica upside de 12%-35% según fuente consultada, reflejando alta dispersión de expectativas entre analistas (HECHO: Investing.com/stockanalysis.com/TradingView, sep-2026).\n- MBI mantiene Sobreponderar con TP $2.700 (23-jun-2026), asumiendo normalización inflacionaria en Argentina y proyectando ingresos ~US$19.200MM en 2026 (HECHO: Diario Financiero, 23-jun-2026).\n- Señal de cautela: BICE Inversiones sacó a Cencosud de su cartera recomendada en el rebalanceo de agosto 2026 pese a rating previo de Sobreponderar con TP $3.772 (HECHO: Diario Financiero, ago-2026).", "tecnico": "- Precio $2.039,5 apenas sobre SMA20 ($2.036) y SMA50 ($2.016), pero -17% bajo SMA200 ($2.458): estructura de recuperación de corto plazo dentro de tendencia bajista mayor.\n- RSI 51,4 en zona neutra tras salto reciente desde 37,55 (23-ago) a 58,56, evidenciando cambio de carácter con entrada de compradores.\n- MACD +3,95 bajo su señal (+4,77): histograma aún negativo, matiza el optimismo de corto plazo pese a la mejora del RSI.\n- Volumen muy débil (ratio 0,41x vs promedio 20d), lo que resta convicción al rebote y es consistente con la señal de 'techo' (histograma MACD girando a la baja) identificada en trend.\n- Percentil de precio 1 año en 11,6%: la acción sigue cerca de mínimos anuales pese al rebote táctico; máximo drawdown 1 año de -40,6%.", "sentimiento": "- Consenso Neutral/Hold (7 de 11-13 analistas en mantener), reflejando escepticismo tras dos trimestres flojos (1T26 y 2T26) por debajo de expectativas.\n- Divergencia relevante: BICE retira la acción de su cartera top (ago-2026) mientras MBI ratifica Sobreponderar (jun-2026) citando normalización esperada en Argentina — el mercado está dividido sobre el punto de inflexión.\n- El desempeño de Argentina en moneda local (EBITDA +39-105% según segmento) contrasta con el pesimismo dominante centrado en la lectura consolidada en pesos chilenos, lo que podría ser una señal contraria si el ARS se estabiliza.\n- Presión mediática sobre la 'competencia agresiva' en Chile (declaración del CEO) y la irrupción de Tottus (+8,2% ingresos 2T26 vs +0,4% Cencosud) mantienen el sentimiento cauto en el corto plazo.\n- Técnicamente el mercado ya validó parcialmente el piso de fines de agosto (RSI subió de 37,6 a 58,6), aunque sin confirmación de volumen.", "catalizadores": "**Catalizadores:**\n- Reporte 3T26 (~3-nov-2026 estimado): validar si el margen Chile se sostiene ≥10% y si el guidance EBITDA se ratifica o ajusta formalmente.\n- Resolución regulatoria SIC Colombia sobre Makro (proceso iniciado 24-jul-2026, sin fecha de cierre) — destrabaría sinergias del negocio mayorista.\n- Aprobación CADE Brasil para St. Marche, que sumaría ~US$216MM en ventas premium y avanzaría la estrategia de escalamiento en São Paulo.\n- Ejecución de Don Salva: de 4-5 locales en ago-2026 a meta de ~40 a fin de año — señal temprana de si el hard discount compensa la presión de márgenes en supermercados tradicionales.\n\n**Riesgos (por materialidad):**\n- Guerra promocional en Chile con Tottus ganando participación agresivamente (+8,2% ingresos vs +0,4% Cencosud en 2T26); riesgo de erosión estructural del margen de 10,5% si la intensidad no cede.\n- Apalancamiento: leverage neto 3,6x, sobre el objetivo de 3,0x, tras adquisiciones (Makro Argentina/Colombia, The Fresh Market, St. Marche); sensibilidad a tasas y a indexación UF.\n- Argentina: aunque el negocio mejora en moneda local, persiste riesgo de traslación cambiaria y de contabilidad hiperinflacionaria (NIC 29) que puede seguir deprimiendo cifras consolidadas en CLP y generar volatilidad en utilidad neta.\n- Ejecución de integraciones simultáneas (Makro Colombia, Makro/Basualdo Argentina, St. Marche, The Fresh Market) eleva riesgo operacional y de foco gerencial en un entorno de consumo débil.", "conclusion": "Cencosud transita un punto de inflexión ambiguo: fundamentos mixtos (Chile resiliente en margen, Argentina mejorando en moneda local, pero EBITDA consolidado y utilidad cayendo) conviven con un técnico que empezó a cambiar de carácter (RSI recuperándose) aunque sin confirmación de volumen. El apalancamiento post-adquisiciones (3,6x) y la guerra promocional en Chile son los riesgos más materiales; el guidance EBITDA US$1.815MM no ha sido revisado formalmente pese al 2T26 débil, lo que deja la tesis del management aún por validar en 3T26. Consenso Neutral con dispersión alta entre casas de análisis. Confianza: media."}, "scores": {"tecnica": {"score": 54, "just": "RSI saltó de 37,6 a 58,6 en tres semanas, señal de cambio de carácter válida, pero MACD histograma aún negativo y volumen 0,41x del promedio restan convicción al rebote. Precio aún -17% bajo SMA200."}, "fundamental": {"score": 42, "just": "EBITDA consolidado -12,3% en 2T26 y pérdida neta reflejan deterioro real, no solo contable. El ancla (margen Chile 10,5%) se sostiene, pero Tottus gana participación y el leverage 3,6x limita flexibilidad."}, "sentimiento": {"score": 60, "just": "Consenso Neutral con sesgo de pesimismo de corto plazo (BICE retiró la acción de su cartera); en contrario, la mejora de Argentina en moneda local no está siendo premiada, lo que abre asimetría si el mercado revalúa esa pata del negocio."}, "riesgo": {"score": 55, "just": "Volatilidad 30d alta (33,9%) y drawdown -40,6% reflejan riesgo de precio, pero el riesgo de pérdida permanente es más acotado: Chile mantiene margen positivo estable y Argentina mejora operativamente; el apalancamiento por adquisiciones es el punto a vigilar."}, "conviccion": {"score": 50, "just": "Tesis falsable: si Chile sostiene margen ≥10% y el 3T26 confirma mejora en 2S26 como guio el CFO, hay asimetría atractiva desde niveles cercanos a mínimos de 52 semanas; si el margen Chile cae bajo 9% o el leverage sigue subiendo, la tesis se invalida."}}, "sources": ["Cencosud S.A. Press Release 2Q2026 (7-ago-2026)", "Investing.com (Q2 2026 slides, transcripts, consensus estimates)", "Diario Financiero (df.cl) — varias notas ago-jun 2026", "stockanalysis.com", "La Tercera", "Infobae Colombia", "mercado.com.ar", "Chócale/Forbes Chile", "TradingView", "CMF Chile"], "opportunity": {"cats": {"valuacion_hist": {"score": 65, "just": "Precio en percentil 11,6% de su rango de 1 año y P/E forward ~12,3x, muy por debajo de niveles históricos, tras una caída YTD de -29,5%."}, "calidad": {"score": 48, "just": "Margen de supermercados Chile resiliente en 10,5% (27° trimestre consecutivo en doble dígito) y mejora operativa de Argentina en moneda local, pero EBITDA consolidado cayendo y apalancamiento por adquisiciones en 3,6x sobre el objetivo de 3,0x."}, "asimetria": {"score": 58, "just": "Upside de consenso de 12%-35% frente a downside limitado si el margen Chile no se deteriora más; el menor peso de Argentina en el EBITDA consolidado (~11,6%) reduce la cola de riesgo cambiario."}, "catalizadores": {"score": 48, "just": "Reporte 3T26 (~3-nov, estimado) y resoluciones regulatorias de Makro Colombia/St. Marche Brasil son catalizadores concretos pero sin fecha oficial confirmada ni certeza de resultado."}, "contrarian": {"score": 60, "just": "Sentimiento negativo pero extendido (BICE retiró la acción de su cartera) mientras Argentina mejora en moneda local — lectura en contra sugiere que el pesimismo está mayormente incorporado, aunque sin catalizador inmediato que fuerce la revalorización."}}, "plan": {"recomendacion": "Esperar gatillo", "zona_compra": "CLP 1.900-2.050", "invalidacion": "Quiebre sostenido bajo CLP 1.882 con margen Chile cayendo bajo 9% o leverage superando 3,8x", "gatillos": ["Confirmación/ratificación formal del guidance EBITDA en 3T26", "Resolución regulatoria SIC Colombia (Makro) y CADE Brasil (St. Marche)", "Reporte 3T26 (~3-nov-2026) mostrando mejora 2S26 anunciada por el CFO"], "horizonte": "6-18 meses", "tamano": "posición reducida (3-5%)", "confianza": "media"}}, "perfil": "Cencosud es el mayor operador de retail multiformato de origen chileno, con más de 1.300 locales en seis países y cinco unidades: supermercados (Jumbo, Santa Isabel, Disco, The Fresh Market), mejoramiento del hogar (Easy), tiendas por departamento (Paris), centros comerciales y servicios financieros. El core es alimentos: los supermercados explican 70-75% de los ingresos, y por país Chile aporta 44%, Argentina 20% y Estados Unidos 12%. La rentabilidad, en cambio, está mucho más concentrada: Chile es el ancla del resultado y el negocio inmobiliario es desproporcionadamente rentable —los malls operan con márgenes EBITDA en torno a 80%— frente a supermercados (11-12%) y tiendas por departamento, de un dígito bajo. En 2025 los ingresos fueron ~CLP 16,6 billones con utilidad +70,4%, y leverage neto de ~3,5x tras comprar Makro Argentina y el resto de The Fresh Market. Lo estructural: exposición a Argentina (donde la contabilidad hiperinflacionaria distorsiona las cifras, aunque su peso relativo en el EBI rédito genuino de fondo."}}, "plan": {"recomendacion": "Esperar gatillo", "zona_compra": "US$130-150 (cerca de SMA20 con RSI neutral; evitar antes de confirmación técnica de piso)", "invalidacion": "Ruptura sostenida bajo US$114,50 (mínimo 52 sem.) o nuevo downgrade crediticio / evidencia de incumplimiento de pago de un cliente grande de IA", "gatillos": ["Confirmación de guidance cloud +58%/+64% en earnings Q1 FY27 (~10-sep-2026)", "Estabilización o mejora del rating crediticio tras la seguidilla de downgrades", "RSI sosteniéndose sobre 55-60 con MACD cruzando a terreno positivo"], "horizonte": "6-18 meses", "tamano": "Posición reducida dada la incertidumbre crediticia y de concentración de cliente; evitar sobreexposición hasta confirmación en earnings", "confianza": "media"}}, "perfil": "Oracle es una empresa de software empresarial que, cada vez más, también vende infraestructura en la nube: bases de datos, aplicaciones de gestión empresarial (ERP, RRHH, cadena de suministro) y, desde su expansión hacia Oracle Cloud Infrastructure (OCI), capacidad de cómputo con GPUs para IA, vendida a grandes empresas, gobiernos y a los principales laboratorios de IA del mundo. El core histórico son las licencias y suscripciones de bases de datos y aplicaciones (Fusion, NetSuite), de altísimo margen y alta recurrencia por lo costoso que es migrar sistemas críticos ya instalados. El motor de crecimiento reciente es OCI, que factura contratos plurianuales de infraestructura de IA por cientos de miles de millones de dólares con clientes como OpenAI, pero con márgenes brutos sensiblemente menores que el software tradicional. Esto cambia el perfil de riesgo: de una máquina de flujo de caja estable a un negocio intensivo en capital, financiado crecientemente con deuda, cuya rentabilidad futura depende de la escala y de que sus clientes de IA cumplan sus compromisos de pago.", "risk": {"volatility_30d": null, "sharpe": null, "sortino": null, "max_drawdown_1y": null, "n_days": 13, "wind anco Central de Chile; minuta se publica el 16-sep a las 8:30) vs 3,50%-3,75% Fed (HECHO: FOMC decide el 16-sep-2026; LECTURA: CME FedWatch asigna ~65,9% de probabilidad a un alza de 25pb —a 3,75%-4,00%— y 34,1% a mantener, tras el discurso hawkish de Kevin Warsh en Jackson Hole y el CPI de agosto en 3,4% a/a con sorpresa al alza por gasolina, BLS 11-sep-2026)"], ["Cobre", "HECHO: US$6,35-6,37/lb spot LME / contrato 3 meses US$14.018-14.035/ton, -1,4/-1,6% en la jornada, cuarta caída diaria consecutiva (~-4,7% a -5% acumulado) por aumento de inventarios LME y fortaleza del dólar ante expectativas de alza Fed (La Tercera, GBM Media, Redimin, XTB, 14-sep-2026) — dato de HOY, sin desactualización; retrocede desde récord histórico de ~US$14.617/ton (~US$6,68/lb) tocado a inicios de septiembre por demanda de IA/centros de datos y menor oferta chilena (Rumbo Minero, 09-sep-2026)"], ["Posicionamiento", "Sin actualización pública de BCCh/SIID para agosto/septiembre; último dato confirmado (julio-2026) muestra posición NDF neta vendedora de no residentes en CLP de hasta US$17.000-20.297M, la mayor desde fines de 2020 (Diario Financiero/Diario Estrategia/BCCh, jul-2026); LECTURA: extranjeros habrían comenzado a normalizar parcialmente esa posición corta con compras puntuales de peso a inicios de agosto (Diario Financiero, ago-2026), pero sin dato duro post-julio"], ["Próximo evento", "Reunión del FOMC (decisión de tasas) y Minuta RPM BCCh, ambas el 16-sep-2026 (en 2 días)"], ["Técnico (auto)", "RSI 68.4 · MACD +6.91 / señal +4.01 (TradingView, 15-sep-2026)"]], "technical": {"price": 953.2, "change_1d_pct": -0.27, "change_1w_pct": 1.01, "rsi": 68.4, "macd": 6.9092, "macd_signal": 4.0091, "sma20": 929.7265, "sma50": 927.1986, "sma200": 905.8922, "ema12": 937.9085, "ema26": 930.9993, "pct_vs_sma20": 2.52, "pct_vs_sma50": 2.8, "pct_vs_sma200": 5.22, "volume_today": 2373, "volume_avg20": 2341.0, "volume_ratio": 1.01, "volatility_30d": 13.42, "sharpe": 1.9, "sortino": 2.58, "max_dr
