 "El cierre de la adquisición de St. Marche (32 tiendas premium en São Paulo, ventas ~US$216MM LTM mar-2026) sigue condicionado a la conversión y homologación del proceso de recuperación judicial del vendedor y a la aprobación del CADE; no se encontró confirmación de avance o cierre a sep-2026 (Capital Aberto/NeoFeed, jun-2026; sin actualización verificada en sep-2026)."}, {"date": "2026-12-31", "label": "Meta de ~40 locales Don Salva (hard discount) (fecha aproximada)", "kind": "corporate", "info": "Lanzado en Chile en may-2026; a inicios de sep-2026 la cadena alcanzó 11 locales en la Región Metropolitana (vs 4-5 en ago-2026), acelerando el ritmo de apertura pero aún lejos de la meta de ~40 a fin de año. Formato clave de respuesta a la guerra promocional y a la irrupción de Tottus (HECHO: Diario Financiero, sep-2026)."}], "sections": {"resumen": "Cencosud cotiza en $2.132 CLP, con técnico en recuperación (RSI 61,5, sobre SMA20/50 pero -13% bajo SMA200) tras un 2026 marcado por guerra promocional en Chile. El 2T26 decepcionó: EBITDA ajustado consolidado -12,3% a CLP 329.000M y pérdida neta reportada, aunque Chile sostuvo margen de supermercados en 10,5% (27° trimestre en doble dígito, guiado a mantenerse en 2S26) y Argentina ganó 50pb de participación de mercado con EBITDA +39,1% en moneda local ex-extraordinarios. Tottus (Falabella) lidera la guerra de precios con +8,2% en ingresos 2T26 vs +0,4% de Cencosud. Las adquisiciones de St. Marche (Brasil, CADE) y Makro Colombia (SIC) siguen sin resolución regulatoria confirmada. Guidance FY2026 (EBITDA US$1.815MM) no ha sido revisado formalmente. Consenso Neutral/Hold. Confianza: media.", "fundamental": "- Ingresos 2T26 CLP 4.094.746M; EBITDA ajustado CLP 329.000M (margen 8,0%, -12,3% interanual) vs CLP 375.000M en 2T25; pérdida neta reportada en el trimestre (HECHO: Investing.com/mercado.com.ar/Peru Retail, ago-2026).\n- Chile: margen EBITDA supermercados 10,5%, 27° trimestre consecutivo en doble dígito; management guio a sostener márgenes de doble dígito en 2S26 pese a intensidad promocional (HECHO: press release 2T26, 7-ago-2026).\n- Argentina: ganó ~50pb de participación de mercado en supermercados en 2T26 y EBITDA ajustado +39,1% en moneda local ex-extraordinarios (programa de productividad y mayor riesgo del negocio financiero); mayores provisiones por riesgo del negocio financiero y mayor impuesto diferido por ajuste hiperinflacionario (NIC 29) restaron US$84,2MM a la utilidad del semestre (HECHO: Forbes Argentina/Investing.com/Cronista, ago-2026).\n- Utilidad atribuible del semestre cayó 79,6% a US$43,4MM, explicada mayormente por el ajuste por economía hiperinflacionaria de Argentina, no por deterioro operativo (HECHO: Investing.com, ago-2026).\n- Guidance FY2026 (emitido ene-2026, Cenco Day Buenos Aires): ingresos consolidados US$18.413MM y EBITDA ajustado US$1.815MM (+15% vs 2025), con márgenes de doble dígito en Chile, Perú y EE.UU.; tras el 2T26 débil no hay revisión formal, pero el CFO proyectó mejora en 2S26 (HECHO: guidance ene-2026; LECTURA: sin confirmación de ajuste a sep-2026).\n- Leverage neto en 3,6x (desde 3,4x en 1T26 y 3,2x a dic-2025), sobre el objetivo de largo plazo de 3,0x; compañía extendió plazo promedio de deuda de 5,5 a 7,3 años y refinanció vencimientos 2027 (HECHO: press release 2T26/Investing.com, ago-2026).", "valuacion": "- P/E muestra dispersión relevante entre proveedores: trailing ~21x-35,5x (distorsionado por caída de utilidad y cargos hiperinflacionarios) y forward ~12,3x-15,3x, sugiriendo expectativa de normalización de utilidades hacia 2027 (LECTURA: stockanalysis.com, sep-2026).\n- Market cap ~CLP 5,54-5,86 billones (~US$5,8-6,1MM); precio en percentil ~18% de su rango de 52 semanas tras caída YTD de -26,3% (HECHO: technical dado).\n- Target consenso implica upside relevante pero disperso: stockanalysis.com marca ~$2.990 CLP (+40,6%) y otro proveedor ~$2.734 CLP, con recomendación Hold/Neutral (2-3 compra, mayoría mantener, 1 venta) (HECHO: stockanalysis.com/Investing.com, sep-2026).\n- MBI mantiene Sobreponderar con TP $2.700 (23-jun-2026), asumiendo normalización inflacionaria en Argentina (HECHO: Diario Financiero, 23-jun-2026).\n- Señal de cautela: BICE Inversiones sacó a Cencosud de su cartera recomendada en el rebalanceo de agosto 2026 pese a rating previo de Sobreponderar con TP $3.772 (HECHO: Diario Financiero, ago-2026).", "tecnico": "- Precio $2.132 sobre SMA20 ($2.052) y SMA50 ($2.017), pero -13% bajo SMA200 ($2.451): estructura de recuperación de corto plazo dentro de tendencia bajista mayor, mejorando vs mediciones previas.\n- RSI 61,5 en zona alcista moderada, consolidando el cambio de carácter iniciado a fines de agosto (saltó de 37,55 a 58,56 el 23-ago).\n- MACD +14,17 sobre su señal (+7,08): histograma positivo y ampliándose, señal de momentum de corto plazo más convincente que en la lectura anterior.\n- Volumen 2,37x el promedio de 20 días, confirmando con fuerza el movimiento reciente (a diferencia del rebote de baja convicción observado semanas atrás).\n- Percentil de precio 1 año en 18,4%: la acción sigue cerca de mínimos anuales pese al repunte técnico; máximo drawdown 1 año de -40,6%.", "sentimiento": "- Consenso Neutral/Hold con dispersión de precios objetivo entre proveedores (~$2.734 a ~$2.990 CLP), reflejando falta de convicción direccional tras dos trimestres flojos (1T26 y 2T26).\n- Divergencia relevante: BICE retiró la acción de su cartera top (ago-2026) mientras MBI ratifica Sobreponderar (jun-2026) citando normalización esperada en Argentina — el mercado sigue dividido sobre el punto de inflexión.\n- La ganancia de participación de mercado en Argentina (+50pb en 2T26) y la mejora operativa en moneda local contrastan con el pesimismo dominante centrado en la lectura consolidada en pesos chilenos y el efecto hiperinflacionario, lo que puede ser una señal contraria si el ARS se estabiliza.\n- Presión mediática persistente sobre la guerra de precios en Chile, con Tottus corriendo con ventaja según cobertura de prensa (The Clinic, 19-ago-2026), mantiene el sentimiento cauto de corto plazo.\n- El mercado ya validó el piso técnico de fines de agosto con confirmación de volumen (2,37x promedio), reforzando la lectura de cambio de carácter técnico más allá de lo especulativo.", "catalizadores": "**Catalizadores:**\n- Reporte 3T26 (~3-nov-2026 estimado): validar si el margen Chile sostiene ≥10% y si Argentina consolida la ganancia de share (+50pb en 2T26).\n- Resolución regulatoria SIC Colombia sobre Makro (proceso iniciado 24-jul-2026, sin fecha de cierre) — destrabaría sinergias del negocio mayorista.\n- Aprobación CADE Brasil para St. Marche, condicionada también a la homologación judicial del vendedor — sumaría ~US$216MM en ventas premium en São Paulo.\n- Ejecución de Don Salva: de 4-5 locales en ago-2026 a 11 en sep-2026, camino a la meta de ~40 a fin de año — señal temprana de si el hard discount compensa la presión de márgenes en supermercados tradicionales.\n\n**Riesgos (por materialidad):**\n- Guerra promocional en Chile con Tottus ganando participación agresivamente (+8,2% ingresos vs +0,4% Cencosud en 2T26); riesgo de erosión estructural del margen de 10,5% si la intensidad no cede.\n- Apalancamiento: leverage neto 3,6x, sobre el objetivo de 3,0x, tras adquisiciones simultáneas (Makro Argentina/Colombia, The Fresh Market, St. Marche); sensibilidad a tasas y a indexación UF.\n- Argentina: pese a la ganancia de share y mejora en moneda local, persisten mayores provisiones por riesgo del negocio financiero y contabilidad hiperinflacionaria (NIC 29) que restaron US$84,2MM a la utilidad del semestre, con volatilidad cambiaria como riesgo latente.\n- Ejecución de integraciones simultáneas (Makro Colombia, Makro/Basualdo Argentina, St. Marche, The Fresh Market) sin resolución regulatoria en dos de ellas (CADE, SIC) eleva riesgo operacional y de foco gerencial en un entorno de consumo débil.", "conclusion": "Cencosud transita un punto de inflexión ambiguo: fundamentos mixtos (Chile resiliente en margen, Argentina ganando participación y mejorando en moneda local, pero EBITDA consolidado y utilidad cayendo por efectos hiperinflacionarios y mayores provisiones) conviven con un técnico que confirmó cambio de carácter con volumen (RSI 61,5, MACD positivo ampliándose). El apalancamiento post-adquisiciones (3,6x) y la guerra promocional en Chile liderada por Tottus son los riesgos más materiales; las aprobaciones regulatorias de St. Marche (CADE) y Makro Colombia (SIC) siguen sin fecha de resolución confirmada. El guidance EBITDA US$1.815MM no ha sido revisado formalmente, dejando la tesis del management por validar en 3T26. Consenso Neutral con dispersión alta entre casas de análisis. Confianza: media."}, "scores": {"tecnica": {"score": 62, "just": "RSI 61,5 y MACD +14,17 sobre señal +7,08 con volumen 2,37x el promedio confirman cambio de carácter con convicción real, no solo un rebote especulativo. Aun así, precio sigue -13% bajo SMA200."}, "fundamental": {"score": 44, "just": "EBITDA consolidado -12,3% en 2T26 y utilidad semestral -79,6% reflejan deterioro real, aunque explicado en gran parte por efectos hiperinflacionarios no operacionales. El ancla (margen Chile 10,5%) se sostiene y Argentina gana share, pero el leverage 3,6x limita flexibilidad."}, "sentimiento": {"score": 58, "just": "Consenso Neutral con sesgo de pesimismo de corto plazo (BICE retiró la acción de su cartera); en contrario, la ganancia de participación en Argentina y la mejora en moneda local no están siendo premiadas, lo que abre asimetría si el mercado revalúa esa pata del negocio."}, "riesgo": {"score": 56, "just": "Volatilidad 30d alta (34,6%) y drawdown -40,6% reflejan riesgo de precio, pero el riesgo de pérdida permanente es más acotado: Chile mantiene margen positivo estable y Argentina gana share; el apalancamiento por adquisiciones y las aprobaciones regulatorias pendientes (CADE, SIC) son los puntos a vigilar."}, "con cartera) mientras Argentina gana share y mejora en moneda local — lectura en contra sugiere que el pesimismo está mayormente incorporado, reforzada ahora por confirmación técnica de piso con volumen."}}, "plan": {"recomendacion": "Esperar gatillo", "zona_compra": "CLP 1.950-2.150", "invalidacion": "Quiebre sostenido bajo CLP 1.882 con margen Chile cayendo bajo 9% o leverage superando 3,8x", "gatillos": ["Confirmación/ratificación formal del guidance EBITDA en 3T26", "Resolución regulatoria SIC Colombia (Makro) y CADE Brasil (St. Marche)", "Reporte 3T26 (~3-nov-2026) mostrando consolidación de ganancia de share en Argentina y mejora 2S26 en Chile"], "horizonte": "6-18 meses", "tamano": "posición reducida (3-5%)", "confianza": "media"}}, "perfil": "Cencosud es el mayor operador de retail multiformato de origen chileno, con más de 1.300 locales en seis países y cinco unidades: supermercados (Jumbo, Santa Isabel, Disco, The Fresh Market), mejoramiento del hogar (Easy), tiendas por departamento (Paris), centros comerciales y servicios financieros. El core es alimentos: los supermercados explican 70-75% de los ingresos, y por país Chile aporta 44%, Argentina 20% y Estados Unidos 12%. La rentabilidad, en cambio, está mucho más concentrada: Chile es el ancla del resultado y el negocio inmobiliario es desproporcionadamente rentable —los malls operan con márgenes EBITDA en torno a 80%— frente a supermercados (11-12%) y tiendas por departamento, de un dígito bajo. En 2025 los ingresos fueron ~CLP 16,6 billones con utilidad +70,4%, y leverage neto de ~3,5x tras comprar Makro Argentina y el resto de The Fresh Market. Lo estructural: exposición a Argentina (donde la contabilidad hiperinflacionaria distorsiona las cifras, aunque su peso relativo en el EBITDA consolidado ha caído a ~11,6%), traslación cambiaria que reduce contablemente el aporte externo cuando el peso chileno se fortalece, y una estructura de costos rígida que hace al margen muy sensible a pequeños cambios en las ventas comparables."}, {"ticker": "ASML", "company": "ASML Holding N.V.", "statsList": [["Precio", "$1,629.67 (17-sep-2026)"], ["Rango 52 sem.", "$710,45 – $1.999,96"], ["Market cap", "~US$675.500M (stockanalysis.com, jul-2026)"], ["P/E", "~55,7x trailing / ~31,5x forward (stockanalysis.com, jul-2026)"], ["Target consenso", "~US$2.117 promedio (rango US$883-2.851), 44 analistas, Strong Buy (S&P Global vía WallStreetZen, jul-2026)"], ["Próx. earnings", "14-oct-2026 (Q3 FY26), guidance vigente: ventas netas €11,0-12,0B, margen bruto 55-57%"], ["Técnico (auto)", "RSI 42.9 · MACD -33.16 / señal -22.19 (TradingView, 17-sep-2026)"]], "reportDate": "10 de agosto de 2026", "change": {"day": 1.71, "week": -4.04}, "events": [{"date": "2026-10-14", "label": "Earnings Q3 FY2026", "kind": "earnings", "info": "Guidance vigente: ventas netas €11,0-12,0B, margen bruto 55-57% (ASML IR, guidance del Q2 call, 15-jul-2026). El mercado mirará si el ritmo de pedidos de memoria/HBM se sostiene y si hay nuevas señales sobre el impacto de controles de exportación (MATCH Act) en el negocio con China."}], "sections": {"resumen": "ASML cae -0,43% hoy y -2,8% en 30 días, tras un julio volátil (-18% mensual) por temores de disrupción -chip propio de Anthropic, avance DUV chino- pese a que el Q2 FY26 batió expectativas (ventas €9,33B, +21% a/a) y la empresa volvió a subir su guidance 2026 (€43-45B) y adelantó 2027 (+30% de capacidad EUV/DUV). HECHO: los pedidos de memoria superaron por primera vez a los de lógica (~56% del backlog). LECTURA: la corrección luce más a ruido de titulares que a cambio de tesis -RSI neutral (51,3) y percentil de precio en 79 muestran consolidación sana.", "fundamental": "- HECHO: Q2 FY26 ventas €9,33B (+21,2% a/a), margen bruto 54,0%, EPS €7,59 vs €5,90 antes; superó guidance (SEC 6-K, 15-jul-2026).\n- HECHO: guidance FY26 elevado a €43-45B, margen 54-56%; Q3 guiado en €11,0-12,0B, margen 55-57% (ASML IR, 15-jul-2026).\n- HECHO: por primera vez, pedidos de memoria (HBM o de ~16% en contratos cloud IA, el FCF negativo (-$24.000M FY26) y la deuda creciente (downgrade S&P a BBB-) son deterioros reales de calidad del negocio, no solo percepción de mercado."}, "sentimiento": {"score": 58, "just": "Pesimismo intenso (CDS en récord, downgrade de crédito, demanda de accionistas, apodo \"poster child\" de burbuja IA) coexiste con guidance de crecimiento intacto y contratos plurianuales firmados — leído en contrario hay oportunidad, aunque el pesimismo también refleja riesgos de crédito reales."}, "riesgo": {"score": 30, "just": "Apalancamiento en aumento (deuda ~$130.000-167.000M, leasing $248.000-261.000M a 15-20 años), downgrade de crédito a BBB- y concentración de ~50-54% del RPO en un solo cliente (OpenAI) son riesgos de pérdida permanente reales, no solo volatilidad de precio."}, "conviccion": {"score": 55, "just": "Target consenso implica ~69% de upside desde el precio actual, pero la dispersión de targets ($110-400) refleja desacuerdo genuino sobre si el apalancamiento es sostenible; el catalizador binario de earnings de sept-2026 define la tesis."}}, "sources": ["stockanalysis.com, 11/08/2026 - Oracle (ORCL) Stock Price, Valuation & Forecast", "TradingKey, 11/08/2026 - Market Movers: ORCL down 3.69% on Aug 11", "CNBC, 10/06/2026 - Oracle Q4 FY2026 earnings report", "Oracle Investor Relations, 10/06/2026 - Oracle Announces Record Q4 and FY2026 Results", "MLQ News, 09/07/2026 - S&P downgrades Oracle to BBB-, one notch above junk, citing OpenAI concentration risk", "Seeking Alpha, 24/07/2026 - Oracle's default risk hits record high, tops 2008 financial crisis peak", "DataCenterDynamics, jul-ago/2026 - Internal documents show Oracle's average profit margin for AI cloud deals was 16%", "The Motley Fool, 02/07/2026 - This AI infrastructure company has a $638 billion backlog", "Yahoo Finance (Bank of America), jul/2026 - OpenAI shortfall puts Oracle AI backlog concentration in focus", "The Motley Fool, 29/07/2026 - Larry Ellison owns 40.6  52 sem.) o nuevo downgrade crediticio / evidencia de incumplimiento de pago de un cliente grande de IA", "gatillos": ["Confirmación de guidance cloud +58%/+64% en earnings Q1 FY27 (~10-sep-2026)", "Estabilización o mejora del rating crediticio tras la seguidilla de downgrades", "RSI sosteniéndose sobre 55-60 con MACD cruzando a terreno positivo"], "horizonte": "6-18 meses", "tamano": "Posición reducida dada la incertidumbre crediticia y de concentración de cliente; evitar sobreexposición hasta confirmación en earnings", "confianza": "media"}}, "perfil": "Oracle es una empresa de software empresarial que, cada vez más, también vende infraestructura en la nube: bases de datos, aplicaciones de gestión empresarial (ERP, RRHH, cadena de suministro) y, desde su expansión hacia Oracle Cloud Infrastructure (OCI), capacidad de cómputo con GPUs para IA, vendida a grandes empresas, gobiernos y a los principales laboratorios de IA del mundo. El core histórico son las licencias y suscripciones de bases de datos y aplicaciones (Fusion, NetSuite), de altísimo margen y alta recurrencia por lo costoso que es migrar sistemas críticos ya instalados. El motor de crecimiento reciente es OCI, que factura contratos plurianuales de infraestructura de IA por cientos de miles de millones de dólares con clientes como OpenAI, pero con márgenes brutos sensiblemente menores que el software tradicional. Esto cambia el perfil de riesgo: de una máquina de flujo de caja estable a un negocio intensivo en capital, financiado crecientemente con deuda, cuya rentabilidad futura depende de la escala y de que sus clientes de IA cumplan sus compromisos de pago.", "risk": {"volatility_30d": null, "sharpe": null, "sortino": null, "max_drawdown_1y": null, "n_days": 15, "window": 30}, "benchmark": {"ticker": "SP:SPX", "label": "S&P 500", "relative_performance_30d": 5.93, "relative_performance_ytd": -34.78, "price_percentile_1y": 16.8, "partial": false}, "technical": {"price": 150.59, "change_1d_pct": 5.19, "ch  en el 2T-2027 y expectativas a 2 años ancladas, Banco Central de Chile) vs 3,75%-4,00% Fed (HECHO: el FOMC decidió el 16-sep-2026 subir la tasa 25pb, de 3,50%-3,75% a 3,75%-4,00%, por voto unánime 12-0 —primera alza desde julio de 2023—, tras el CPI subyacente de agosto por sobre lo esperado y el tono hawkish del chair Kevin Warsh; el dot plot mostró a 16 de 18 miembros proyectando al menos un alza adicional este año, mediana 4,1% para fines de 2026, Federal Reserve/Emol/CNN, 16-sep-2026). Próxima RPM BCCh: 26-27 octubre 2026. Próximo FOMC: 27-28 octubre 2026 (decisión 28-oct)"], ["Cobre", "HECHO: contrato 3 meses LME en US$14.005-14.035/ton (~US$6,35/lb), -1,4/-1,6% en la jornada del 16-sep-2026, tocando un mínimo intradía de US$13.958/ton —el más bajo desde el 20-ago-2026— por un alza de inventarios LME (+9.600 ton, de las cuales 4.550 ton en almacenes de Italia), señal de relajamiento de la estrechez de oferta de corto plazo (CNN Chile/Rumbo Minero, 16-sep-2026). Dato de HOY, sin desactualización; el cobre retrocede así por quinta sesión desde el récord histórico de ~US$14.779/ton (~US$6,74/lb en COMEX) tocado a inicios de septiembre por demanda de IA/centros de datos"], ["Posicionamiento", "Sin actualización pública de BCCh/SIID para agosto/septiembre 2026 (búsqueda dirigida no arrojó publicación posterior a julio) — sigue siendo el último dato confirmado: posición NDF neta vendedora de no residentes en CLP de hasta US$17.000-20.297M en julio-2026, la mayor desde fines de 2020 (Diario Financiero/Diario Estrategia/BCCh, jul-2026). LECTURA: comentario de VT Markets (16-sep-2026) señala que los operadores de derivados están posicionándose para una pausa prolongada del BCCh, con la curva swap aplanándose y estrategias de opciones USD/CLP de rango acotado — consistente con un mercado que ya no espera movimientos abruptos de tasas locales, aunque sin cifra dura de posicionamiento posterior a julio"], ["Próximo evento", "RPM del Banco Central de Chile: 26-27 de octubre de 2026 (en ~41 días); FOMC: 27-28 de octubre de 2026, decisión el 28-oct (en ~42 días)"], ["Técnico (auto)", "RSI 70.9 · MACD +8.49 / señal +5.48 (TradingView, 17-sep-2026)"]], "technical": {"price": 958.46, "change_1d_pct": 0.59, "change_1w_pct": 1.56, "rsi": 70.9, "macd": 8.488, "macd_signal": 5.4784, "sma20": 933.096, "sma50": 928.3262, "sma200": 906.1029, "ema12": 943.0207, "ema26": 934.5327, "pct_vs_sma20": 2.72, "pct_vs_sma50": 3.25, "pct_vs_sma200": 5.78, "volume_today": 2430, "volume_avg20": 2404.0, "volume_ratio": 1.01, "volatility_30d": 13.18, "sharpe": 1.76, "sortino": 2.35, "max_drawdown_1y": -12.62, "price_percentile_1y": 93.4, "vs_benchmark_30d_pct": 3.98, "perf_1m_pct": 4.56, "perf_ytd_pct": 6.88}, "risk": {"volatility_30d": 13.18, "sharpe": 1.76, "sortino": 2.35, "max_drawdown_1y": -12.62, "n_days": 322, "window": 30}, "benchmark": {"ticker": "TVC:DXY", "label": "DXY", "relative_performance_30d": 3.98, "relative_performance_ytd": 4.83, "price_percentile_1y": 93.4, "partial": false}, "sourcesMeta": {"price": {"origin": "TradingView scanner", "fetched_at": "2026-09-17T21:43:28-03:00"}, "rsi_macd": {"origin": "TradingView scanner", "fetched_at": "2026-09-17T21:43:28-03:00"}, "smas_volume": {"origin": "TradingView scanner", "fetched_at": "2026-09-17T21:43:28-03:00"}, "benchmark": {"origin": "TradingView scanner", "symbol": "TVC:DXY", "fetched_at": "2026-09-17T21:43:28-03:00"}, "risk_metrics": {"origin": "data/history/FX-USDCLP.json", "n_days": 322}}, "metricChanges": [{"ticker": "USD/CLP", "date": "2026-09-02", "metric": "percentil_1y", "from": 49.3, "to": 70.2}, {"ticker": "USD/CLP", "date": "2026-09-02", "metric": "rsi", "from": 43.47, "to": 64.78}], "trend": {"piso": 0, "techo": 1, "max": 7, "senales_piso": [], "senales_techo": ["techo plano bajo el máximo anual"]}, "change": {"day": 0.59, "week": 1.56}, "reportDate": "16 de septiembre de 2026", "events": [{"date": "2026-10-26", "label": "Reunión de Política Monetaria (RPM) del Banco Central de Chile", "kind": "macro", "info": "Reunión los días 26-27 de octubre de 2026 (Banco Central de Chile). HECHO: la RPM de septiembre (08-sep) mantuvo la TPM en 4,50% por unanimidad y la minuta (16-sep) más el IPoM de septiembre confirmaron que la inflación converge a 3% en el 2T-2027; LECTURA: tras el alza de la Fed del 16-sep, el mercado de swaps ya descuenta una pausa prolongada del BCCh (VT Markets, 16-sep-2026), por lo que se espera que la TPM se mantenga en 4,50% salvo sorpresa en el IPC de septiembre/octubre."}, {"date": "2026-10-28", "label": "Reunión del FOMC (decisión de tasas)", "kind": "macro", "info": "Reunión los días 27-28 de octubre de 2026, decisión y conferencia de prensa el 28-oct a las 14:00 hora de EE.UU. (Federal Reserve). HECHO: tras el alza de 25pb del 16-sep-2026 (a 3,75%-4,00%, voto unánime 12-0), el dot plot de la Fed mostró a 16 de 18 miembros proyectando al menos un alza adicional antes de fin de 2026 (mediana 4,10%), por lo que el mercado ya empieza a poner probabilidad a un segundo movimiento en esta reunión de octubre; de confirmarse, estrecharía aún más el diferencial de tasas con Chile y presionaría al alza al USD/CLP."}], "customSections": [{"title": "Resumen ejecutivo", "nav": "Resumen", "body": "USD/CLP cotiza en 953,20 (15-sep-2026, feed canónico Vantage). HECHO: el 16-sep-2026 la Fed subió su tasa 25pb a 3,75%-4,00% (voto unánime 12-0, primera alza desde jul-2023), lo que impulsó al dólar globalmente (DXY superó 100 tras el anuncio) y en Chile, donde el par tocó un máximo intradía de $961,60 antes de cerrar con caída neta diaria ($951,49-960,65 según fuente) en una sesión volátil. La minuta BCCh (16-sep, 8:30) e IPoM de septiembre confirmaron la mantención de la TPM en 4,50% con inflación convergiendo a 3% en el 2T-2027. El cobre retrocedió por quinta sesión (-1,6% a US$14.005/ton, mínimo desde 20-ago) por alza de inventarios LME. Sesgo: alcista de mediano plazo para el USD (diferencial de tasas se estrecha, dot plot hawkish, cobre corrigiendo), pero con RSI ya en 68,4 y percentil de precio 1y en 88,8 — poco margen técnico sin una pausa."}, {"title": "Diferencial de tasas y política monetaria", "nav": "Tasas", "body": "HECHO: BCCh mantuvo la TPM en 4,50% el 08-sep-2026 por decisión unánime; la minuta (16-sep, 8:30) señaló que la dinámica inflacionaria evoluciona según lo previsto, con convergencia a 3% en el 2T-2027 y expectativas a 2 años ancladas (Banco Central de Chile). HECHO: la Fed subió 25pb a 3,75%-4,00% el 16-sep-2026 por voto unánime 12-0 —primera alza desde jul-2023—, con el chair Kevin Warsh calificando la inflación de 'demasiado alta por demasiado tiempo'; el dot plot proyecta mediana de 4,10% para fin de 2026 (16 de 18 miembros ven al menos otra alza), y Bank of America espera hasta 75pb adicionales en 2026 (Federal Reserve/Emol/CNN, 16-sep-2026). LECTURA: el diferencial nominal a favor de Chile se comprimió de ~75-100pb a ~50-75pb tras esta alza, y podría seguir estrechándose si la Fed sube de nuevo en octubre mientras el BCCh se mantiene en pausa (mercado de swaps ya lo descuenta, VT Markets, 16-sep-2026) — negativo estructural para el peso."}, {"title": "Balanza de pagos y flujos", "nav": "Balanza", "body": "HECHO: el cobre —cerca de la mitad de las exportaciones chilenas— cotiza en el contrato 3 meses LME en US$14.005-14.035/ton (~US$6,35/lb), -1,4/-1,6% en la jornada del 16-sep-2026, tocando un mínimo intradía de US$13.958/ton (el más bajo desde el 20-ago-2026) por un alza de inventarios LME de +9.600 toneladas (CNN Chile/Rumbo Minero, 16-sep-2026). Dato de HOY, sin advertencia de desactualización. Es la quinta sesión de corrección desde el récord histórico de ~US$14.779/ton (COMEX ~US$6,74/lb) de inicios de septiembre, impulsado por demanda de IA/centros de datos. LECTURA: el IPoM de septiembre (BCCh) destacó apreciación del peso en meses previos pero también el impacto del conflicto en Medio Oriente sobre el petróleo (US$79 Brent-WTI promedio 2026-2028); junto al PIB del 2T-2026 (+1,6% a/a, débil) y desempleo de 8,7% (VT Markets, 16-sep-2026), el cuadro externo se debilita justo cuando el diferencial de tasas también juega en contra del peso."}, {"title": "Posicionamiento", "nav": "Posicionamiento", "body": "No aplica COT (no existe futuro CFTC líquido para CLP); se usa como proxy el informe de derivados/forwards de no residentes del BCCh (SIID). HECHO: no se encontró publicación oficial más reciente que julio-2026 en la búsqueda dirigida de hoy; el último dato duro sigue siendo la posición NDF neta vendedora de no residentes contra el peso de hasta US$17.000-20.297M en julio-2026, la mayor desde fines de 2020 (Diario Financiero/Diario Estrategia, jul-2026) — laguna de datos relevante que persiste. LECTURA: un comentario de mercado (VT Markets, 16-sep-2026) señala que los operadores de swaps y opciones sobre el peso ya se posicionan para una pausa prolongada del BCCh, con estrategias de rango acotado en USD/CLP, lo que sugiere que el extremo corto en no residentes podría haberse moderado, pero sin cifra oficial que lo confirme. Un corto extremo en no residentes sigue siendo, en sí, una señal contraria: deja espacio para una reversión violenta del CLP ante cualquier sorpresa dovish de la Fed."}, {"title": "Análisis técnico", "nav": "Técnico", "body": "Con los datos dados (TradingView, 15-sep-2026): precio 953,20, RSI 68,4 (zona alta, acercándose a sobrecompra sin cruzarla), MACD +6,91 sobre señal +4,01 (momentum alcista fuerte e intacto), precio 2,52%/2,80%/5,22% sobre SMA20/50/200 respectivamente. El 'trend' marca techo plano bajo el máximo anual (sin señales de piso), consistente con un par que ronda máximos de 120 días (rango 850,90-980,88) sin quiebre de tendencia. Volumen en línea con el promedio de 20 días (ratio 1,01), sin señal de agotamiento ni de convicción extra. Percentil de precio 1y en 88,8 —el dólar ya está caro frente a su propio historial reciente—, tras el salto abrupto desde 49,3 a 70,2 el 02-sep-2026 (metricChanges); la sesión volátil del FOMC (16-sep) probablemente empujó el RSI aún más cerca de zona de sobrecompra técnica clásica (>70)."}, {"title": "Intervención y riesgo de banco central", "nav": "Intervención", "body": "El BCCh flota el CLP libremente desde 1999, pero ha intervenido explícitamente en episodios de volatilidad excesiva (USD 20.000M en 2019, USD 25.000M/programa de liquidez en dólares en jul-2022) y ha usado forwards tácticos en operaciones de renovación puntuales durante 2026. HECHO: la búsqueda dirigida de hoy (16-sep-2026) no encontró ningún anuncio ni cambio de postura sobre intervención cambiaria activa por parte del BCCh; el IPoM de septiembre no menciona medidas excepcionales en curso. LECTURA: el nivel actual (951-962 intradía) sigue por debajo de los máximos históricos de 2022 (~1.050) que gatillaron intervenciones previas, por lo que el riesgo de intervención sigue siendo bajo-medio; sin embargo, la combinación de un segundo trimestre consecutivo de alzas de tasas Fed (sep, con probable octubre) y una TPM local en pausa podría acelerar la depreciación y acercar el par a niveles que ameriten vigilancia del Consejo del BCCh hacia fin de año."}, {"title": "Correlaciones macro", "nav": "Correlaciones", "body": "HECHO: el DXY cotizaba en ~99,6-99,7 antes del FOMC y superó el nivel de 100 unos 30 minutos después del anuncio de alza de tasas del 16-sep-2026 (FXStreet/varias fuentes), su nivel más fuerte en varias semanas. LECTURA: la correlación USD/CLP-cobre es negativa y fuerte (históricamente entre -0,6 y -0,8; XTB estima que el cobre explica 65-70% de los movimientos del par), por lo que la caída del cobre de las últimas cinco sesiones explica una parte relevante de la fortaleza del dólar en Chile. La correlación con el DXY es positiva y se reforzó hoy: el mismo evento (alza Fed) fortaleció al dólar tanto a nivel global (DXY sobre 100) como bilateral (USD/CLP con máximo intradía de $961,60), generando un movimiento direccional coherente y sin señales de divergencia entre ambos indicadores."}, {"title": "Conclusión", "nav": "Conclusión", "body": "Confianza: media. El catalizador binario del FOMC ya se resolvió (alza de 25pb, unánime, dot plot hawkish) confirmando el sesgo de depreciación del CLP de corto plazo, reforzado por un cobre que corrige por quinta sesión desde su récord histórico. El diferencial de tasas se estrecha y el mercado ya asigna probabilidad a una segunda alza Fed en octubre, mientras el BCCh se encamina a una pausa prolongada (próxima RPM 26-27 oct). Contrapesos: el posicionamiento corto extremo de no residentes (dato de julio, aún sin actualizar) deja espacio para una reversión si el escenario Fed se modera, y el RSI (68,4) más el percentil de precio 1y (88,8) limitan el recorrido técnico sin una consolidación previa. Recomendación: seguir el par de cerca hacia la RPM/FOMC de octubre; la principal laguna de información sigue siendo la falta de dato SIID posterior a julio."}], "scoreIndex": 8, "customCats": [{"key": "tasas", "name": "Diferencial de Tasas y Política Monetaria", "weight": 30}, {"key": "macro", "name": "Fundamentales Macro", "weight": 20}, {"key": "tecnico", "name": "Técnico", "weight": 20}, {"key": "posicionamiento", "name": "Posicionamiento y Sentimiento", "weight": 15}, {"key": "intervencion", "name": "Riesgo de Intervención / Cola", "weight": 15}], "scores": {"tasas": {"score": 74, "just": "La Fed ya subió 25pb (16-sep, unánime) a 3,75%-4,00%, estrechando el diferencial con la TPM chilena estable en 4,50%, y el dot plot hawkish (mediana 4,10% para fin de 2026) sugiere una segunda alza en octubre mientras el BCCh se encamina a pausa — favorable para el USD, con riesgo de que el mercado ya lo tenga descontado."}, "macro": {"score": 40, "just": "Cobre corrigiendo por quinta sesión (-1,6% hoy, mínimo desde 20-ago) desde récord histórico resta soporte al CLP; PIB 2T-2026 débil (+1,6% a/a) y desempleo en 8,7% agravan el cuadro local — negativo para el peso, aunque el nivel del cobre sigue siendo alto en términos históricos, lo que modera la nota."}, "tecnico": {"score": 58, "just": "Momentum alcista fuerte (MACD +6,91 sobre señal, precio sobre las 3 SMAs) pero RSI en 68,4 y percentil de precio 1y en 88,8 ya reflejan una posición cara/sobrecomprada — se castiga levemente por escaso margen técnico sin pausa."}, "posicionamiento": {"score": 42, "just": "Corto extremo de no residentes en CLP (dato de julio, sin actualización agosto/septiembre pese a búsqueda dirigida hoy) es una señal contraria clásica: deja espacio a una reversión violenta si la Fed modera su tono en próximas reuniones; comentario de mercado sugiere cierta normalización pero sin cifra dura."}, "intervencion": {"score": 55, "just": "Nivel actual (951-962 intradía) lejos de máximos históricos de 2022 que gatillaron intervención; sin anuncio ni cambio de postura del BCCh detectado hoy; riesgo bajo-medio pero creciente si se acumulan alzas Fed y el par acelera hacia fin de año."}}, "sources": ["Banco Central de Chile", "Federal Reserve", "U.S. Bureau of Labor Statistics", "La Tercera", "Diario Financiero", "Diario Estrategia", "FXStreet", "XTB", "Redimin", "GBM Media", "CME FedWatch", "Rumbo Minero", "CNN Chile", "BioBioChile", "Infobae", "Emol", "VT Markets", "TradingView scanner"], "opportunity": {"cats": {"valuacion_hist": {"score": 65, "just": "Percentil de precio 1y en 88,8 (par caro/USD fuerte históricamente); sin embargo el cobre sigue en niveles altos en términos históricos pese a la corrección reciente, sugiriendo que parte de la fuerza del USD ya está justificada por el diferencial de tasas post-FOMC más que sobrevaluada."}, "calidad": {"score": 55, "just": "Régimen macro de EE.UU. se fortalece relativamente: Fed ya subió tasas y el dot plot anticipa otra alza, mientras Chile muestra PIB débil (+1,6% a/a) y desempleo alto (8,7%) — calidad de la tesis larga en USD mejoró levemente tras el FOMC del 16-sep."}, "asimetria": {"score": 55, "just": "El evento binario (FOMC) ya se resolvió a favor del USD, reduciendo la asimetría de muy corto plazo; el posicionamiento corto extremo en CLP (dato de julio) sigue siendo el principal riesgo de reversión si la Fed modera el tono en adelante."}, "catalizadores": {"score": 65, "just": "Próximos catalizadores confirmados y fechados: RPM BCCh (26-27 oct) y FOMC (27-28 oct), con dot plot ya señalando probabilidad de una segunda alza Fed antes de fin de año."}, "contrarian": {"score": 42, "just": "El consenso ya está posicionado para tasas Fed más altas y CLP débil tras el FOMC; el contrarian trade (mantener USD ante sorpresa aún más hawkish) tiene menos recorrido que antes del anuncio del 16-sep."}}, "plan": {"recomendacion": "Esperar gatillo", "zona_compra": "925-935 (USD) si hay pullback tras la sesión volátil del FOMC; 960-970 si se confirma continuidad alcista y se busca sumar en fuerza", "invalidacion": "Cierre sostenido bajo 906 (SMA200) para la tesis larga en USD, o reversión violenta bajo 920 en las próximas semanas", "gatillos": ["RPM BCCh 26-27 octubre (confirmación de pausa o sorpresa)", "FOMC 27-28 octubre (segunda alza vs pausa)", "Actualización de posicionamiento forwards no residentes (SIID, pendiente desde julio)", "Evolución del cobre tras la corrección de 5 sesiones"], "horizonte": "1-6 meses (táctico) / 6-18 meses (estructural)", "tamano": "Posición táctica pequeña, aumentar solo con confirmación de segunda alza Fed en octubre", "confianza": "media"}}, "perfil": "El par expresa cuántos pesos chilenos se entregan por un dólar: comprarlo es comprar dólares y vender pesos, así que un alza es depreciación del CLP. Su nivel responde a tres fuerzas: el diferencial entre la TPM del Banco Central de Chile y la tasa de la Fed, los términos de intercambio y el ciclo global del dólar. El canal dominante es el cobre: representa cerca de la mitad de las exportaciones chilenas y Chile aporta un cuarto de la producción mundial, por lo que la correlación del par con el metal es negativa y habitualmente entre -0,6 y -0,8 — el peso opera como proxy líquido del cobre y del ciclo chino. Los actores que mueven el mercado son el BCCh (flotación libre desde 1999, pero con intervenciones explícitas de USD 20.000 y 25.000 millones en 2019 y 2022), las AFP con sus cambios de cobertura cambiaria, los exportadores mineros y la banca offshore vía NDF. Qué considerar siempre: es de las monedas emergentes más volátiles (10-15% anualizado), el riesgo de intervención es real y asimétrico —suele gatillarse por volatilidad excesiva, no por un nivel—, y la liquidez local se concentra entre las 9:00 y 13:30 de Chile."}, {"ticker": "EUR/USD", "company": "Euro / Dólar", "baseCurrency": "EUR", "statsList": [["Precio", "1.14781 (17-sep-2026)"], ["Rango 80 días", "1.133 – 1.182"], ["Tasas BCE / Fed", "2,25% / 3,50–3,75%"], ["COT EUR (14-jul)", "-12,605 netos (corto)"], ["DXY", "100.76 (17-jul-2026)"], ["Próximo evento", "BCE 23-jul · FOMC 28-29-jul"], ["Técnico (auto)", "RSI 35.4 · MACD -0.00 / señal +0.00 (TradingView, 17-sep-2026)"]], "change": {"day": 0.02, "week": -1.03}, "customSections": [{"title": "Resumen ejecutivo", "nav": "Resumen", "body": "EUR/USD cerró la semana en **1.14382**, dentro de un rango contenido tras una caída de ~4% desde los máximos de abril (~1.182) y un rebote desde los mínimos de junio (~1.133). El cuadro es de **equilibrio inestable con sesgo de cautela**:\n\n- **HECHO:** El diferencial de tasas sigue siendo claramente favorable al USD (Fed Funds 3.50–3.75% vs. tasa de depósito BCE 2.25%), aunque el BCE **subió** 25 pb en junio mientras la Fed está en pausa — el diferencial se está cerrando en el margen a favor del EUR.\n- **HECHO:** La semana entrante es de alto riesgo de evento: **reunión del BCE el jueves 23-jul** (mercado descuenta ~95% de mantención) y **FOMC el 28-29-jul** (~87–89% de mantención).\n- **HECHO:** Los especuladores están **netos cortos en EUR** (-12,605 contratos, COT al 14-jul-2026), aunque recortando cortos.\n- **LECTURA:** Los riesgos de cola (guerra en Medio Oriente y shock energético asimétrico contra Europa, reapertura de la disputa arancelaria EEUU-UE, crisis política/energética en Francia) recaen desproporcionadamente sobre el EUR.\n\n**Señal resultante: Caution (Grado C — 46/100).** Sin ventaja clara para comprar EUR; el par sigue siendo un rango 1.133–1.155 dominado por bancos centrales y geopolítica.\n\n---"}, {"title": "Diferencial de tasas y política monetaria", "nav": "Tasas", "body": "**BCE (HECHO):**\n- Tasa de depósito vigente: **2.25%**, tras una **subida de 25 pb decidida en la reunión de junio (17-jun-2026)** en respuesta a la presión inflacionaria derivada del shock energético (ECB / Trading Economics, jul-2026).\n- Próxima reunión: **jueves 23-jul-2026** (decisión 13:45 CET, conferencia de Lagarde 14:30 CET) — es decir, **sí hay reunión la semana del 20-jul**. Es reunión sin proyecciones de staff.\n- Expectativas de mercado: **~95.3% de mantención en 2.25%**, con una cola alcista de ~3.4% para +25 pb (rateprobability.com / ecb-watch, consultado 19-jul-2026).\n- Tono de Lagarde: **hawkish**. El 2-jul defendió la subida de junio citando proyecciones de inflación en torno al 3% para 2026 y la necesidad de mantenerse vigilante (ECB Forum Sintra, jul-2026).\n\n**Fed (HECHO):**\n- Rango objetivo vigente: **3.50%–3.75%**; en junio el FOMC mantuvo y señaló que la inflación sigue elevada respecto de la meta del 2% (core PCE ~2.9%).\n- FOMC 28-29-jul-2026: **~89% de probabilidad de mantención** según CME FedWatch (~86.7% según fuentes alternativas al 18-jul-2026). Consenso: tasas sin cambios al menos hasta el otoño boreal, condicionado a progreso en inflación.\n- Tono del presidente de la Fed, Kevin Warsh (Sintra, 1-jul-2026): sin señales para julio, pero \"los precios están demasiado altos\" — sesgo restrictivo.\n\n**Divergencia (LECTURA):** El **nivel** del diferencial (~125–150 pb en tasas de política; 2 años: UST 4.16% vs. Schatz ~2.6–2.8%) favorece al USD y sostiene el carry en contra del EUR. Pero la **dirección** favorece marginalmente al EUR: el BCE está subiendo (y conserva cola hawkish) mientras la Fed está estática. Riesgo señalado por estrategas: que el mercado retire el tightening del BCE antes que el de la Fed, limitando el alza del EUR (VT Markets, jul-2026).\n\n---"}, {"title": "Balanza de pagos y flujos", "nav": "Balanza", "body": "**Cuenta corriente (HECHO):**\n- Superávit de la eurozona de **€25 mil millones en mayo-2026** (+€8 mm m/m): bienes +€16 mm, servicios +€14 mm, renta primaria +€12 mm, renta secundaria -€18 mm (BCE, 17-jul-2026).\n- Acumulado 12 meses a mayo-2026: **€272 mm (1.7% del PIB)**, frente a €318 mm (2.0% del PIB) un año antes — **superávit en contracción**, principalmente por menor superávit de bienes (de €350 mm a €286 mm) (BCE, 17-jul-2026).\n- Proyección del staff del Eurosistema (jun-2026): caída adicional a **~1.3% del PIB en 2026** por mayores precios de importación de energía a raíz de la guerra en Medio Oriente (ECB Economic Bulletin, 2026).\n\n**Flujos de portafolio 2026 (HECHO/LECTURA):**\n- HECHO: La rotación hacia Europa de comienzos de año **se revirtió a mitad de 2026**: la porción de flujos de ETFs de renta variable de EEUU hacia fondos centrados en EEUU subió todos los meses del año, alcanzando ~85% en junio (iShares H1-2026). En Europa, los flujos hacia productos centrados en EEUU se **cuadruplicaron** interanual (Morningstar, 2026). En money markets, USD fue la clasificación más comprada (+€15.98 mm) mientras los fondos EUR registraron salidas (-€5.06 mm) (Lipper/LSEG, may-2026).\n- LECTURA: El colchón estructural de cuenta corriente sigue siendo un soporte de fondo para el EUR, pero se erosiona por energía, y los flujos de portafolio han vuelto a favorecer activos en USD por el atractivo relativo de las tasas americanas. Neto: **levemente negativo para el EUR**.\n\n---"}, {"title": "Posicionamiento", "nav": "Posicionamiento", "body": "**HECHO — CFTC COT, Euro FX (CME), datos al martes 14-jul-2026, publicado 17-jul-2026 (Tradingster/CFTC):**\n- No comerciales (especuladores): largos 230,307 / cortos 242,912 → **neto -12,605 contratos (corto)**.\n- Variación semanal: +6,877 largos, +3,255 cortos → **neto +3,622 hacia largo** (los cortos se están recortando).\n- Interés abierto: 799,495 contratos — mercado profundo y líquido.\n- Tendencia de meses: el neto largo de ~+21,000 contratos de marzo-2026 (percentil 15 del rango de 52 semanas, mínimo de 1 año) se ha degradado hasta territorio **neto corto** (AhaSignals/Investing.com, 2026).\n\n**LECTURA:** Posicionamiento levemente bajista en EUR pero **cercano a plano y mejorando** — no hay extremo de posicionamiento que genere señal contraria potente en ninguna dirección. Un BCE hawkish el 23-jul podría forzar cobertura de cortos (riesgo alcista táctico); la señal estructural es neutral-negativa.\n\n---"}, {"title": "Análisis técnico", "nav": "Técnico", "body": "**HECHO — TradingView (17-jul-2026):**\n- Precio: **1.14382**.\n- RSI(14) diario: **47.2** — neutral.\n- MACD(12,26): **-0.0025** vs. señal **-0.0036**; histograma **+0.0011** — momentum bajista moderándose.\n- Medias: precio **sobre SMA20 (1.1414)** pero **bajo SMA50 (1.1530)**.\n- Ventana 80 días: caída desde máximos ~**1.182** (abril) hasta mínimos ~**1.133** (junio); rebote reciente a ~1.148 y cierre 1.1438.\n\n**LECTURA:**\n- La estructura de mediano plazo sigue siendo **correctiva/bajista** (máximos y mínimos decrecientes desde abril; precio bajo SMA50), pero el rebote desde 1.133 con histograma MACD al alza y recuperación de la SMA20 sugiere que la caída **perdió fuerza**.\n- Soportes: 1.1414 (SMA20), luego 1.133 (mínimo de junio — pivote clave). Resistencias: 1.148 (techo del rebote), 1.1530 (SMA50), luego zona 1.16.\n- Un cierre diario sobre la SMA50 (~1.153) convertiría el rebote en cambio de tendencia; la pérdida de 1.133 reactivaría el tramo bajista hacia 1.12. Con RSI en 47 y precio entre medias, el veredicto técnico es **neutral** (par ni alcista ni bajista con convicción).\n\n---"}, {"title": "Intervención y riesgo de banco central", "nav": "Intervención", "body": "**HECHO/LECTURA:** El riesgo de intervención cambiaria **directa** en EUR/USD es históricamente bajo (última intervención coordinada relevante: 2000/2011); ni el BCE ni el Tesoro de EEUU han señalado nada en 2026 a los niveles actuales. El riesgo relevante es **de cola**:\n\n1. **Energía / Medio Oriente (HECHO):** Tras los ataques de Israel-EEUU contra Irán (28-feb-2026) y la disrupción del Estrecho de Ormuz (~1/5 del suministro global de GNL afectado), el gas europeo opera en ~€46/MWh; los escenarios de crisis prolongada de la Comisión Europea/JRC contemplan petróleo hasta ~USD 180/bbl y gas ~€80/MWh en 4T-2026 (JRC, may-2026; Bloomberg, 9-jul-2026). **LECTURA:** shock asimétricamente negativo para el EUR (Europa importadora neta; EEUU exportador de energía).\n2. **Aranceles EEUU-UE (HECHO):** El acuerdo provisional del 20-may-2026 (arancel máximo ~15% a productos UE) coexiste con amenazas de Trump de tarifas \"mucho más altas\" si no se ratifica, reabriendo la guerra comercial (ING, Euronews, 2026). **LECTURA:** riesgo bajista para crecimiento europeo y EUR.\n3. **Política europea (HECHO):** Crisis política y presupuestaria en Francia, con hoja de ruta energética bloqueada y reactores nucleares parados por olas de calor (Energynews/MNI, 2026). **LECTURA:** prima de riesgo político latente en activos EUR.\n\n**Balance:** riesgo de intervención bajo, pero **riesgo de cola elevado y sesgado en contra del EUR**.\n\n---"}, {"title": "Correlaciones macro", "nav": "Correlaciones", "body": "- **DXY (HECHO):** 100.76 al 17-jul-2026, prácticamente plano en la sesión (Trading Economics/FXStreet). Con EUR ~58% del índice, la correlación inversa DXY–EUR/USD **se mantiene plenamente operativa**: el estancamiento del DXY sobre 100 es el espejo del rango 1.13–1.15 del par.\n- **Diferencial de bonos (HECHO):** UST 10a **4.55%** vs. Bund 10a **3.14%** → s históricos de valuación."}, "calidad": {"score": 60, "just": "USD respaldado por economía resiliente y Fed con sesgo dividido hacia el alza; contrapesado por riesgo político (jawboning) que introduce ruido no-fundamental al par."}, "asimetria": {"score": 30, "just": "Asimetría desfavorable para USD: el techo está limitado por riesgo de intervención (~160-162), mientras el piso es más abierto si BoJ sube tasas en sep/oct; riesgo/retorno sesgado a la baja del par."}, "catalizadores": {"score": 45, "just": "COT 7-ago, IPC Japón 21-ago y reuniones FOMC/BoJ en sep-2026 son catalizadores claros pero de resultado incierto; el hawkish tilt del BoJ es el más relevante y apunta contra el USD."}, "contrarian": {"score": 50, "just": "El positioning corto extremo en yen ya se está corrigiendo vía squeeze; jugar largo USD/JPY ahora sería ir con el consenso post-shock, no contra él, restando atractivo contrarian."}}, "plan": {"recomendacion": "Mantener / Observar", "zona_compra": "USD/JPY 152-155 (zona de mayor probabilidad de defensa activa vía intervención, mejor relación riesgo/retorno para posiciones largas de USD)", "invalidacion": "Ruptura sostenida bajo ¥150 con nueva intervención fallida o quiebre claro de SMA200 (157.93) al alza sin reversión", "gatillos": ["Resultado del COT del 7-ago-2026 (velocidad de cobertura de cortos)", "IPC Japón 21-ago-2026 (confirma o modera expectativa de alza del BoJ)", "Reuniones FOMC y BoJ de sep-2026 (definen si el diferencial se comprime)"], "horizonte": "6-18 meses", "tamano": "Posición reducida y escalonada, dado el riesgo binario de intervención adicional del MoF", "confianza": "media"}}, "perfil": "El par indica cuántos yenes se entregan por un dólar: comprarlo es comprar dólares financiándose en yenes, y por eso es el más ligado al carry trade global. Su determinante estructural es el diferencial de tasas —su correlación con el spread entre el Treasury y el JGB a 10 años es muy alta— porque el yen ha operado por décadas como la mone <script>
  "use strict";
  const ORDER = ["AAPL","MSFT","NVDA","GOOGL","AMZN","TSLA","MU","MP","SPCX","BTC","HDSY","CLSK","MSTR","CCU","CMPC","CENCOSUD","ASML","TTWO","ORCL","USD/CLP","EUR/USD","USD/JPY"];
  const _staticData = JSON.parse(document.getElementById("static-data").textContent);
  const _dynData = JSON.parse(document.getElementById("stock-data").textContent);
  const _byTicker = {};
  _staticData.forEach((s) => (_byTicker[s.ticker] = s));
  _dynData.forEach((s) => (_byTicker[s.ticker] = s));
  const STOCKS = ORDER.filter((t) => _byTicker[t]).map((t) => _byTicker[t])
    .concat(Object.values(_byTicker).filter((s) => !ORDER.includes(s.ticker)));
  const REPORT_DATE = "18 de julio de 2026"; // fallback para activos sin reportDate propio
  const reportDateOf = (s) => s.reportDate || REPORT_DATE;
  const DEFAULT_WEIGHTS = { tecnica: 25, fundamental: 25, sentimiento: 20, riesgo: 15, conviccion: 15 };
  const CATS = [
    { key: "tecnica", name: "Fortaleza Técnica" },
    { key: "fundamental", name: "Calidad Fundamental" },
    { key: "sentimiento", name: "Sentimiento y Momentum" },
    { key: "riesgo", name: "Perfil de Riesgo" },
    { key: "conviccion", name: "Convicción de Tesis" },
  ];
  const GRADES = [
    { min: 85, grade: "A+", signal: "Strong Buy", cls: "good" },
    { min: 70, grade: "A", signal: "Buy", cls: "good" },
    { min: 55, grade: "B", signal: "Hold", cls: "warning" },
    { min: 40, grade: "C", signal: "Caution", cls: "serious" },
    { min: 25, grade: "D", signal: "Caution", cls: "critical" },
    { min: 0, grade: "F", signal: "Avoid", cls: "critical" },
  ];
  const OPP_CATS = [
    { key: "valuacion_hist", name: "Valuación vs su historia", weight: 25 },
    { key: "asimetria", name: "Asimetría al precio actual", weight: 25 },
    { key: "calidad", name: "Calidad del negocio", weight: 20 },
    { key: "catalizadores", name: "Ruta de catalizadores", weight: 15 },
    { key: "contrarian", name: "Señal contraria", weight: 15 },
  ];
  const OPP_SIGNALS = [
    { min: 80, label: "Comprar escalonado", cls: "good" },
    { min: 65, label: "Acumular en zona", cls: "good" },
    { min: 50, label: "Esperar gatillo", cls: "warning" },
    { min: 35, label: "Mantener / Observar", cls: "serious" },
    { min: 0, label: "Reducir / Evitar", cls: "critical" },
  ];
  function compositeOpp(stock) {
    const o = stock.opportunity;
    if (!o || !o.cats) return null;
    let sum = 0, w = 0;
    OPP_CATS.forEach((c) => {
      const v = o.cats[c.key] && o.cats[c.key].score;
      if (v != null) { sum += v * c.weight; w += c.weight; }
    });
    return w ? Math.round(sum / w) : null;
  }
  function oppSignalFor(score) {
    return OPP_SIGNALS.find((s) => score >= s.min) || OPP_SIGNALS[OPP_SIGNALS.length - 1];
  }

  const SECTIONS = [
    { num: 1, key: "resumen", title: "Resumen ejecutivo", nav: "Resumen" },
    { num: 2, key: "fundamental", title: "Análisis fundamental", nav: "Fundamental" },
    { num: 3, key: "valuacion", title: "Valuación", nav: "Valuación" },
    { num: 4, key: "tecnico", title: "Análisis técnico", nav: "Técnico" },
    { num: 5, key: "catalizadores", title: "Catalizadores y riesgos", nav: "Catalizadores" },
    { num: 6, key: "sentimiento", title: "Sentimiento", nav: "Sentimiento" },
    { num: 7, key: "score", title: "Score Compuesto", nav: "Score" },
    { num: 8, key: "conclusion", title: "Conclusión", nav: "Conclusión" },
  ];
  const STAT_LABELS = {

    marketCap: "Market cap",
    pe: "P/E",
    targetConsenso: "Target consenso",
    proximoEarnings: "Próx. earnings",
  };
  const DISCLAIMER =
    "Este informe es una herramienta de investigación educativa generada con IA. No constituye " +
    "asesoría de inversión ni recomendación de compra/venta. Verifique todos los datos de forma " +
    "independiente antes de tomar decisiones financieras.";

  const DATA_DATE = "17-sep-2026";
  const MODES = {
    equity: {
      title: "Stock Research — Dashboard de Equity Research",
      brand: "Stock Research",
      meta: "Equity research + score compuesto · investigado vía web search el " + DATA_DATE,
      note:
        "El score 0–100 pondera 5 categorías (técnica 25% · fundamental 25% · sentimiento 20% · " +
        "riesgo 15% · convicción 15%). Es una lectura cuantitativa, no una recomendación. " +
        "Los pesos son ajustables en la sección de score.",
      filter: (s) => !s.ticker.includes("/"),
    },
    fx: {
      title: "Stock Research — Dashboard FX Research",
      brand: "FX Research",
      meta: "Research de divisas + score compuesto FX · investigado vía web search el " + DATA_DATE,
      note:
        "El score FX 0–100 pondera 5 categorías (tasas 30% · macro 20% · técnico 20% · " +
        "posicionamiento 15% · riesgo de intervención 15%). La señal explicita ambos lados del par " +
        "(p. ej. 'Compra USD / Venta CLP'): score alto favorece a la divisa base, score bajo a la contraparte. " +
        "Es una lectura cuantitativa, no una recomendación.",
      filter: (s) => s.ticker.includes("/"),
    },
    calendar: {
      title: "Stock Research — Calendario de eventos",
      brand: "Calendario",
      meta: "Fechas clave de resultados y eventos macro · investigado vía web search el " + DATA_DATE,
      note:

    },
    tech: {
      title: "Stock Research — Panel Técnico",

      meta: "Estado técnico de toda la cobertura · TradingView (scanner) · " + DATA_DATE,

        "Datos 100% mecánicos calculados a diario desde TradingView, separados de la " +
        "interpretación cualitativa de los informes.",
      filter: () => true,
    },
  };
  const NOTE_UPD =
    "<br><br><strong>Actualización:</strong> los datos fueron investigados vía web search el " + DATA_DATE +
    " y son estáticos. Para refrescarlos o agregar un activo, pídeselo a Claude en la conversación " +
    "del proyecto — la página se actualiza en esta misma URL.";

  const state = { mode: "equity", ticker: STOCKS[0].ticker, weights: { ...DEFAULT_WEIGHTS }, query: "", techSort: { key: "ticker", dir: 1 }, calFilter: null };

  function modeAssets() {
    return STOCKS.filter(MODES[state.mode].filter);
  }
  function applyMode(mode) {
    state.mode = mode;
    const m = MODES[mode];
    document.title = m.title;
    document.getElementById("brandName").textContent = m.brand;
    document.getElementById("metaLine").textContent = m.meta;
    document.getElementById("railNote").innerHTML = m.note + NOTE_UPD;
    document.querySelectorAll("#modeSwitch button, #tabBar button").forEach((b) => {
      const on = b.dataset.mode === mode;
      b.classList.toggle("active", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
    });
    document.querySelector(".layout").classList.toggle("cal-mode", mode === "calendar" || mode === "tech");
    const assets = modeAssets();
    if (mode !== "calendar" && mode !== "tech" && !assets.some((s) => s.ticker === state.ticker)) state.ticker = assets[0].ticker;
    state.query = "";
    document.getElementById("search").value = "";
    render();
    window.scrollTo({ top: 0 });
  }

  function statsPairs(s) {
    return s.statsList || Object.keys(STAT_LABELS).map((k) => [STAT_LABELS[k], s.stats[k]]);
  }
  function priceOf(s) {
    const raw = statsPairs(s)[0][1];
    return (raw.match(/^[$¥€]?[\d.,]+/) || [raw])[0];
  }
  function catsOf(s) {
    return s.customCats || CATS.map((c) => ({ key: c.key, name: c.name, weight: DEFAULT_WEIGHTS[c.key] }));
  }
  function signalOf(s, g) {
    if (!s.baseCurrency) return g.signal;
    const parts = s.ticker.split("/");
    const base = s.baseCurrency;
    const quote = parts[0] === base ? parts[1] : parts[0];
    if (g.min >= 85) return `Compra fuerte ${base} / Venta ${quote}`;
    if (g.min >= 70) return `Compra ${base} / Venta ${quote}`;
    if (g.min >= 55) return `Neutral ${base}/${quote} — sin sesgo direccional`;
    if (g.min >= 25) return `Caution — sesgo Venta ${base} / Compra ${quote}`;
    return `Venta ${base} / Compra ${quote}`;
  }
  const REPO_URL = "https://github.com/AgustinMosqueira/stock-dashboard";
  function requestUrl(ticker, tipo) {
    const t = String(ticker).toUpperCase();
    let body, title;
    if (tipo === "alta") {
      title = "informe: " + t;
      body = `Solicito el informe de ${t}.\n\nSi el ticker es ambiguo, indica aquí el símbolo exacto de TradingView (ej. NASDAQ:${t}).\n\nEnviado desde el dashboard.`;
    } else if (tipo === "eliminar") {
      title = "eliminar: " + t;
      body = `Solicito ELIMINAR ${t} del dashboard.\n\nSu histórico de precios queda archivado por si se vuelve a agregar más adelante.\n\nEnviado desde el dashboard.`;
    } else {
      title = "informe: " + t;
      body = `Solicito ACTUALIZAR el informe de ${t}.\n\nEnviado desde el dashboard.`;
    }
    return `${REPO_URL}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
  }
  function matches(s, q) {
    return s.ticker.toLowerCase().includes(q) || s.company.toLowerCase().includes(q);
  }
  function fmtPct(v) {
    if (v === null || v === undefined) return null;
    const sign = v > 0 ? "+" : v < 0 ? "−" : "";
    return sign + Math.abs(v).toFixed(2).replace(".", ",") + " %";
  }
  function deltaSpan(v, extraCls) {
    const f = fmtPct(v);
    if (f === null) return "";
    const dir = v > 0 ? "up" : v < 0 ? "down" : "flat";
    return `<span class="delta ${dir}${extraCls ? " " + extraCls : ""}">${f}</span>`;
  }

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function inline(s) {
    return s
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\bHECHO(?=\s*:|\b)/g, '<span class="badge hecho">HECHO</span>')
      .replace(/\bLECTURA(?=\s*:|\b)/g, '<span class="badge lectura">LECTURA</span>');
  }
  function md(text) {
    const blocks = esc(text).split(/\n\s*\n/);
    return blocks
      .map((b) => {
        const lines = b.split("\n").map((l) => l.trim()).filter(Boolean);
        if (!lines.length) return "";
        if (lines.every((l) => /^[-•] /.test(l))) {
          return "<ul>" + lines.map((l) => "<li>" + inline(l.slice(2)) + "</li>").join("") + "</ul>";
        }
        if (lines.length >= 2 && lines.every((l) => l.startsWith("|"))) {
          const cells = (l) => l.replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
          const head = cells(lines[0]);
          const rows = lines.slice(1).filter((l) => !/^\|[\s\-:|]+\|$/.test(l)).map(cells);
          return (
            '<div class="md-table"><table><thead><tr>' + head.map((c) => `<th>${c}</th>`).join("") +
            "</tr></thead><tbody>" +
            rows.map((r) => "<tr>" + r.map((c) => `<td>${c}</td>`).join("") + "</tr>").join("") +
            "</tbody></table></div>"
          );
        }
        if (lines.length === 1 && /^#{2,4} /.test(lines[0])) {
          return '<p class="md-h">' + inline(lines[0].replace(/^#{2,4} /, "")) + "</p>";
        }
        return "<p>" + inline(lines.join(" ")) + "</p>";
      })
      .join("");
  }

  function normWeights(w) {
    const sum = CATS.reduce((a, c) => a + w[c.key], 0);
    if (sum === 0) return { norm: { ...DEFAULT_WEIGHTS }, sum: 0 };
    const norm = {};
    CATS.forEach((c) => (norm[c.key] = (w[c.key] / sum) * 100));
    return { norm, sum };
  }
  function composite(stock, weights) {
    if (stock.customCats) {
      return Math.round(stock.customCats.reduce((a, c) => a + stock.scores[c.key].score * c.weight / 100, 0));
    }
    const { norm } = normWeights(weights);
    return Math.round(CATS.reduce((a, c) => a + stock.scores[c.key].score * norm[c.key] / 100, 0));
  }
  function gradeFor(score) {
    return GRADES.find((g) => score >= g.min);
  }

  function gaugeSVG(score, size) {
    const r = size / 2 - 7;
    const cx = size / 2, cy = size / 2;
    const start = 135, sweepMax = 270;
    const sweep = sweepMax * score / 100;
    const arc = (a0, a1, color, wd) => {
      const p = (a) => {
        const rad = (a - 90) * Math.PI / 180;
        return `${(cx + r * Math.cos(rad)).toFixed(2)} ${(cy + r * Math.sin(rad)).toFixed(2)}`;
      };
      const large = a1 - a0 > 180 ? 1 : 0;
      return `<path d="M ${p(a0)} A ${r} ${r} 0 ${large} 1 ${p(a1)}" fill="none" stroke="${color}" stroke-width="${wd}" stroke-linecap="round"/>`;
    };
    let marks = "";
    for (let v = 0; v <= 100; v += 25) {
      const a = (start + sweepMax * v / 100 - 90) * Math.PI / 180;
      const r1 = r - 8, r2 = r - 12;
      marks += `<line x1="${(cx + r1 * Math.cos(a)).toFixed(1)}" y1="${(cy + r1 * Math.sin(a)).toFixed(1)}" x2="${(cx + r2 * Math.cos(a)).toFixed(1)}" y2="${(cy + r2 * Math.sin(a)).toFixed(1)}" stroke="var(--hairline)" stroke-width="1.5"/>`;
    }
    return (
      `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Score compuesto ${score} de 100">` +
      arc(start, start + sweepMax, "var(--track)", 9) +
      (score > 0 ? arc(start, start + Math.max(sweep, 3), "var(--accent)", 9) : "") +
      marks +
      `</svg>`
    );
  }

  function renderRail() {
    const assets = modeAssets();

        `<div class="val"><b>${v}</b> · ${(v * w / 100).toFixed(1)}</div>` +

      `<div class="score-detail">` +

      `<p class="signal-close"><strong>Señal: ${esc(sig)}</strong> (Grado ${g.grade} — ${sc}/100)` +

  function sectionPlan(stock) {
    if (!stock.customSections) {
      return SECTIONS.map((s) => ({
        num: s.num, key: s.key, title: s.title, nav: s.nav,
        body: s.key === "score" ? null : stock.sections[s.key],
      }));
    }
    const plan = [];
    let num = 1;
    stock.customSections.forEach((cs) => {
      if (num === stock.scoreIndex) {
        plan.push({ num: num, key: "score", title: "Score Compuesto FX", nav: "Score", body: null });
        num++;
      }
      plan.push({ num: num, key: "cs" + num, title: cs.title, nav: cs.nav || cs.title, body: cs.body });
      num++;
    });
    if (num === stock.scoreIndex) plan.push({ num: num, key: "score", title: "Score Compuesto FX", nav: "Score", body: null });
    return plan;
  }
  function withOpportunity(stock, plan) {
    if (!stock.opportunity || compositeOpp(stock) == null) return plan;
    const i = plan.findIndex((s) => s.key === "score");
    plan.splice(i + 1, 0, { key: "opportunity", title: "Oportunidad y plan de acción (6-18 meses)", nav: "Oportunidad", body: null });
    plan.forEach((s, idx) => (s.num = idx + 1));
    return plan;
  }

  // — Calendario de eventos —
  const MONTHS_ES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const MONTH_ABBR = { ene: 0, feb: 1, mar: 2, abr: 3, may: 4, jun: 5, jul: 6, ago: 7, sep: 8, sept: 8, set: 8, oct: 9, nov: 10, dic: 11 };
  const WEEKDAYS_ES = ["dom","lun","mar","mié","jue","vie","sáb"];
  const KIND_LABELS = { earnings: "Resultados", macro: "Macro", corporate: "Corporativo" };

  function busDaysUntil(d, today0) {
    let n = 0;
    const cur = new Date(today0);
    while (cur < d && n < 30) {
      cur.setDate(cur.getDate() + 1);
      const wd = cur.getDay();
      if (wd !== 0 && wd !== 6) n++;
    }
    return n;
  }
  function parseISODate(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function parseSpanishDate(txt) {
    const m = /(\d{1,2})[-\s]*(ene|feb|mar|abr|may|jun|jul|ago|sept|sep|set|oct|nov|dic)[a-z]*\.?[-\s]*(\d{4})/i.exec(txt || "");
    if (!m) return null;
    const mo = MONTH_ABBR[m[2].toLowerCase()];
    return mo == null ? null : new Date(+m[3], mo, +m[1]);
  }
  function assetEvents(s) {
    const out = (s.events || [])
      .map((e) => ({ ...e, d: parseISODate(e.date) || parseSpanishDate(e.date) }))
      .filter((e) => e.d && e.label);
    if (!out.some((e) => (e.kind || "") === "earnings")) {
      const pair = statsPairs(s).find(([l]) => /earnings|evento/i.test(l));
      const d = pair && parseSpanishDate(pair[1]);
      if (d) out.push({ d: d, label: (/earnings/i.test(pair[0]) ? "Resultados — " : "") + pair[1], kind: /earnings/i.test(pair[0]) ? "earnings" : "macro" });
    }
    return out.map((e) => ({ ...e, ticker: s.ticker, isFx: s.ticker.includes("/") }));
  }
  // Agrupación de eventos macro compartidos (FOMC, BCE, IPC…): un mismo evento que
  // afecta a varios activos aparece una sola vez con la lista de afectados.
  const MACRO_KEYS = ["fomc", "fed", "bce", "ecb", "boj", "banco central", "bcch", "tpm",
    "ipc", "cpi", "pce", "payroll", "nfp", "ipom", "halving", "opep", "opec", "jackson hole"];
  function normLabel(l) {
    return (l || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim();
  }
  function eventKey(e) {
    if (e.econ) return null;  // los datos del calendario económico no se agrupan entre sí
    if ((e.kind || "macro") !== "macro") return null;  // earnings/corporate nunca se agrupan
    const n = normLabel(e.label);
    for (const k of MACRO_KEYS) if (n.includes(k)) return "k:" + k;
    return "l:" + n;
  }
  function mergeDay(dayEvts) {
    const groups = new Map();
    let uid = 0;
    dayEvts.forEach((e) => {
      const key = eventKey(e) || "u:" + uid++;
      if (!groups.has(key)) {
        groups.set(key, { ...e, tickers: [e.ticker] });
      } else {
        const g = groups.get(key);
        if (!g.tickers.includes(e.ticker)) g.tickers.push(e.ticker);
        if (e.label.length < g.label.length) g.label = e.label;  // se queda la etiqueta más limpia
        if (!g.time && e.time) g.time = e.time;
        if ((e.info || "").length > (g.info || "").length) g.info = e.info;
      }
    });
    return Array.from(groups.values());
  }

  // indicadores donde un número MÁS ALTO significa economía MÁS DÉBIL
  const ECON_INVERTED = ["jobless claims", "unemployment rate"];
  function econResultInfo(e) {
    if (e.actual == null) return null;
    const ref = e.forecast != null ? e.forecast : e.previous;
    if (ref == null) return null;
    const u = e.unit || "";
    const fmtv = (v) => `${v}${u}`;
    const refName = e.forecast != null ? "lo esperado" : "el dato previo";
    const n = normLabel(e.label);
    const esRateDecision = n.includes("interest rate decision") || n.includes("fomc");
    const diff = e.actual - ref;

    if (e.country === "CL") {
      if (diff === 0) {
        return esRateDecision
          ? `TPM en ${fmtv(e.actual)}, sin sorpresa vs ${refName}. El impacto en el peso y en USD/CLP dependerá del tono del comunicado del BCCh (sesgo futuro de tasas).`
          : `Salió ${fmtv(e.actual)}, en línea con ${refName}: impacto acotado en el peso chileno y USD/CLP; el mercado pasa al siguiente catalizador.`;
      }
      const fuerte = ECON_INVERTED.some((k) => n.includes(k)) ? diff < 0 : diff > 0;
      return fuerte
        ? `Salió ${fmtv(e.actual)} vs ${fmtv(ref)} ${refName}: dato FUERTE para la economía chilena. Apoya al peso (presión BAJISTA para USD/CLP) y respalda que el BCCh mantenga la TPM alta por más tiempo.`
        : `Salió ${fmtv(e.actual)} vs ${fmtv(ref)} ${refName}: dato DÉBIL para la economía chilena. Debilita al peso (presión ALCISTA para USD/CLP) y abre espacio a recortes de TPM del BCCh.`;
