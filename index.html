p. LECTURA: inflación core más caliente y petróleo Brent >US$100 llevaron a mercados a asignar probabilidad no trivial a un ALZA de tasas en vez de un recorte (Forbes/CME FedWatch, ago-sep-2026). Un desenlace hawkish presionaría a semis de alto beta como MU justo antes de su earnings del 30-sep."}, {"date": "2026-09-30", "label": "Earnings Q4 FY2026", "kind": "earnings", "time": "conference call 2:30pm hora Montaña (~4:30pm ET)", "info": "HECHO: confirmado por Micron IR (comunicado 26-ago-2026, GlobeNewswire/StockTitan) para 30-sep-2026. Guidance oficial de Micron desde el 24-jun-2026: revenue $50.000M ±$1.000M, margen bruto no-GAAP ~86%, EPS no-GAAP $31,00 ±$1,00 — cifras que ya en su momento superaron el consenso previo por ~$6.500M en revenue y ~$5,57 en EPS. Foco del mercado: si el ritmo de pricing DRAM/HBM se sostiene tras el sell-off de sep-2026 por miedo a 'burbuja de IA', y actualización sobre capacidad HBM4 'fully booked' hasta 2027-2028."}], "sections": {"resumen": "MU cotiza en $927,60 (15-sep), ~26% bajo su máximo histórico de $1.255 tras un sell-off sectorial de semis (-5,25% el 14-sep) por temores de 'burbuja de IA' tras comentarios de ejecutivos tech pidiendo frenar el ritmo, más un contexto macro duro (petróleo >US$100, FOMC 16-sep con riesgo de alza). Sigue +214% YTD. HECHO: earnings Q4 FY26 confirmado 30-sep; guidance oficial revenue $50.000M±$1.000M, margen bruto ~86%, EPS no-GAAP $31,00±$1,00. HECHO: CXMT llegó a 10% de share global de DRAM (oligopolio Samsung/SK Hynix/Micron cayó bajo 90% por primera vez), pero su desventaja de costo por litografía DUV (~30% más cara) frenó su intento de vender a Apple. HECHO: Micron calificada para HBM4 de Nvidia Vera Rubin junto a Samsung/SK Hynix, aunque con la menor asignación de volumen (~24% vs ~43% SK Hynix). HECHO: Federal Circuit falló a favor de Micron el 2-sep-2026 anulando 5 patentes de Netlist, aunque la demanda ITC de ago-2026 y el caso de California siguen activos. Consenso unánime Strong Buy y ventas recurrentes del CEO piden cautela.", "fundamental": "- HECHO: guidance oficial Q4 FY26 (24-jun-2026): revenue $50.000M±$1.000M, margen bruto no-GAAP ~86%, EPS no-GAAP $31,00±$1,00; sin revisiones a la baja conocidas desde entonces (Micron IR).\n- HECHO: Micron completó acuerdos de precio y volumen para toda su oferta de HBM de calendario 2026, incluyendo HBM4; reportado 'fully booked' con ~US$22.000M en acuerdos estratégicos plurianuales (16 contratos take-or-pay no cancelables a ~5 años con pisos de precio, según Susquehanna, jun-2026).\n- HECHO: en HBM4 para Nvidia Vera Rubin, Micron fue calificada junto a Samsung y SK Hynix (Jensen Huang, jun-2026), pero con la menor asignación estimada de volumen (~24% vs SK Hynix ~43% y Samsung ~33%, estimaciones de cadena de suministro).\n- LECTURA: TrendForce reportó DRAM convencional +13-18% QoQ y NAND +10-15% QoQ para 3T26, moderando desde alzas históricas de +90% QoQ en LPDDR5x a inicios de 2026 — el ciclo sigue fuerte pero pierde aceleración marginal, no revierte.\n- HECHO: el propio CFO de Micron reconoció en la llamada de 2T FY26 que los márgenes del nivel actual 'simplemente no son sostenibles' en el largo plazo, aun cuando el guidance de 3T y 4T FY26 siguió expandiéndose (74,4%→~81%→~86%).\n- HECHO: Federal Circuit confirmó el 2-sep-2026 la cancelación de 5 patentes de Netlist usadas contra Micron (victoria parcial para MU), pero esto no afecta el veredicto de US$445M de 2024 ni la nueva demanda ITC de Netlist (12-ago-2026, buscando orden de exclusión de importación de DDR5 RDIMM/MRDIMM) ni el caso paralelo en corte federal de California; queda además una apelación pendiente con audiencia oral el 9-sep-2026.", "valuacion": "- HECHO: market cap ~US$1,10-1,13 billones con ~1.130M acciones en circulación (sep-2026).\n- LECTURA: P/E trailing ~22,9x, forward ~7,1-10,7x según agregador y base de EPS —la brecha refleja el salto abrupto de utilidades del ciclo HBM, no error de dato.\n- HECHO: rango 52 semanas US$154,65-US$1.255,00; cotiza ~26% bajo su máximo histórico tras el pullback de sep-2026.\n- HECHO: target consenso de 45-49 analistas ~US$1.295-1.513 (Strong Buy: 45 buy/0 sell/4 hold), implicando ~40-63% de upside; dispersión extrema entre el piso (~US$361) y el techo (~US$2.200, Susquehanna) delata desacuerdo real sobre sostenibilidad de márgenes.\n- LECTURA: Michael Burry (Scion) inició un short en MU en jul-2026 calificándolo 'destructor de capital' por ROIC mediano históricamente bajo y FCF negativo en buena parte de los trimestres pasados; posición ampliada durante jul-2026, contexto que sigue vigente sin actualización posterior verificada.", "tecnico": "- HECHO: RSI 46,9 (neutro-bajo) y MACD +9,18 bajo su señal +13,26 (TradingView, 15-sep-2026) — histograma en terreno negativo, señal de pérdida de momentum de corto plazo.\n- HECHO: precio -2,99% bajo SMA20, apenas +0,13% sobre SMA50 y +47,45% sobre SMA200 — la extensión de mediano plazo sigue siendo muy elevada pese al retroceso semanal de -4,89%.\n- HECHO: volumen del día (20,4M) por debajo del promedio de 20 días (29,4M, ratio 0,70x), señal de baja convicción tanto en el rebote como en la caída reciente.\n- HECHO: soporte técnico en ~US$900 sostenido en el test del 14-sep según prensa especializada (FX Leaders); pérdida de ese nivel abriría paso a un retest más profundo.\n- HECHO: volatilidad 30d ~98,65%, Sharpe 1,04 y Sortino 1,38 —retornos ajustados por riesgo aún positivos en la ventana medida pese al drawdown de -39% en 12 meses, reflejo de lo violento pero también rentable del ciclo.", "catalizadores": "**Catalizadores:**\n- Earnings Q4 FY26 el 30-sep-2026: validación del guidance oficial (revenue $50.000M±$1.000M, margen bruto ~86%, EPS $31,00±$1,00) y de si el pricing DRAM/HBM sigue firme.\n- FOMC 16-sep-2026: riesgo macro de corto plazo para todo el sector semis de alto beta, con mercados considerando incluso la posibilidad de un alza en vez de recorte.\n- Ramp de HBM4/HBM4E para Nvidia Vera Rubin: Micron ya calificada y en producción junto a Samsung/SK Hynix (confirmado por Jensen Huang, jun-2026), aunque con la menor asignación de volumen de las tres.\n- Fallo del Federal Circuit del 2-sep-2026 (favorable a Micron, anula 5 patentes de Netlist) reduce parcialmente el riesgo legal, pero la demanda ITC de ago-2026 sigue en curso y podría derivar en orden de exclusión de importación.\n\n**Riesgos (por materialidad):**\n- Competencia estructural china: CXMT ya en 10% de DRAM global, oligopolio Samsung/SK Hynix/Micron cayó bajo 90% por primera vez en más de una década; aunque su desventaja de costo (DUV, ~30% más caro) frenó ventas a Apple por ahora.\n- Litigio Netlist/ITC en curso (demanda 12-ago-2026) buscando orden de exclusión de importación de productos DDR5 de Micron, pese al fallo favorable parcial del 2-sep.\n- Ciclo de commodity: el propio CFO de Micron reconoció que los márgenes actuales (~86%) 'no son sostenibles' en el largo plazo; reversión de márgenes ya ocurrió en FY2023 (margen bruto -9%).\n- Ventas recurrentes de insider del CEO (~US$39M el 21-ago-2026, tras ventas similares en may y jul-2026) en medio de consenso unánime Strong Buy y sell-off por miedo a burbuja de IA.", "sentimiento": "- HECHO: consenso de 45-49 analistas con 45 buy/0 sell/4 hold, target promedio ~US$1.295-1.513 — unanimidad que históricamente antecede correcciones cuando el precio ya se estiró.\n- HECHO: CEO Sanjay Mehrotra vendió ~40.000 acciones el 21-ago-2026 (~US$39M) bajo plan 10b5-1, tras ventas similares en may-2026 (~US$21,5M) y jul-2026 (~US$37,3M) — patrón recurrente, aunque preprogramado; no se identificaron filings nuevos de sep-2026 al momento de esta actualización.\n- HECHO: Michael Burry (Scion) reveló y amplió un short en MU durante jul-2026, parte de una canasta bajista en semis (NVDA, AMAT, SOXX); sin actualización posterior verificada.\n- HECHO: el sell-off del 10 y 14-sep-2026 fue gatillado por comentarios de ejecutivos tech pidiendo frenar el ritmo de desarrollo de IA, sumado a un índice de 'burbuja de IA' que cayó a mínimo de 4 meses a inicios de sep — señal de que el mercado empieza a cuestionar, aunque sea parcialmente, la narrativa de demanda infinita de HBM.\n- LECTURA: beta históricamente citada ~2,1 en el dashboard, aunque fuentes recientes (AlphaQuery) calculan beta hasta ~3,0 — en cualquier caso, MU amplifica fuertemente tanto el rally como las caídas del sector memoria, con drawdowns históricos de -73% (2014-16), -55% (2018), -43% (2020), -51% (2021) y -36% (2024) cada vez que el mercado se sobre-entusiasma con su crecimiento de largo plazo.", "conclusion": "MU sigue siendo la apuesta pura al superciclo de memoria IA, con guidance oficial intacto (margen ~86%, EPS $31 para Q4 FY26) y HBM4 calificado para Nvidia, pero cotiza con consenso unánime (posible señal contraria), litigio Netlist aún abierto pese a un fallo favorable parcial, competencia china acelerando y un CEO vendiendo recurrentemente. El sell-off de sep-2026 por miedo a 'burbuja de IA' y un FOMC con riesgo de alza el 16-sep añaden presión de corto plazo antes del binario real: earnings del 30-sep. Confianza media: la tesis fundamental (HBM, acuerdos plurianuales) es sólida y falsable en dos semanas, pero el propio CFO admite que los márgenes actuales no son sostenibles a muy largo plazo, y el historial de drawdowns >30-70% exige posición acotada, no de convicción máxima."}, "scores": {"tecnica": {"score": 52, "just": "RSI neutro-bajo (46,9) tras pullback de -4,89% semanal que ya perforó la SMA20 aunque se mantiene apenas sobre SMA50; MACD por debajo de su señal con histograma negativo. Extensión aún de +47% sobre SMA200 deja poco margen de error pese al enfriamiento de momentum."}, "fundamental": {"score": 66, "just": "Guidance oficial de margen ~86% y EPS $31 para Q4 FY26 sostenido, HBM4 calificado y 16 acuerdos take-or-pay plurianuales son sólidos, pero Micron tiene la menor asignación de volumen HBM4 de las tres (~24% vs 43% SK Hynix) y el propio CFO ad n entre agregadores reflejan alta incertidumbre de modelo (HECHO, sep-2026).\n- Wells Fargo mantiene \"Overweight\" con target US$212 (fecha exacta no confirmada en fuente primaria); Pivotal Research inició cobertura con \"Buy\"/Strong Buy y target US$220 el 08-sep-2026 (HECHO: CNBC, 08-sep-2026).\n- Market cap ~US$1,95-2,06 billones (trillion) según distintas fuentes (companiesmarketcap.com/stockanalysis.com) vs US$1,77 billones al IPO (HECHO, sep-2026).\n- LECTURA: la valuación exige ejecución impecable de Starship y Starlink/wireless simultáneamente; la reacción negativa al capex de Q2 sugiere que el mercado ya empieza a exigir visibilidad de retorno, no solo crecimiento de revenue.", "tecnico": "- Precio US$143,49 está prácticamente en línea con SMA20 (US$143,26, +0,16%) pero por sobre SMA50 (US$134,46, +6,72%), señal de consolidación de corto plazo tras el rally previo (HECHO: dato técnico dado).\n- RSI 51,3 (zona neutral) y MACD (+3,15) sobre señal (+2,92) — momentum aún positivo pero perdiendo fuerza; nota: agregadores externos (Barchart, ~11-sep) muestran RSI/MACD más débiles (45,7 / señal de venta), lo que sugiere que el deterioro técnico se aceleró en los últimos días (LECTURA sobre datos parcialmente discrepantes).\n- Volumen de hoy (72,7M) muy por debajo del promedio de 20 días (93,9M, ratio 0,77x): la caída del -3,15% ocurre con volumen liviano, no es una capitulación con convicción vendedora fuerte (LECTURA, cambio de carácter incipiente favorable).\n- Volatilidad anualizada 30d de 93,94% y drawdown máximo de -46,35% en 1 año confirman que el activo sigue siendo de alto riesgo idiosincrático (HECHO: dato técnico dado).\n- Percentil de precio 1 año en 32% y rendimiento YTD de -4,34% muestran que, pese al rally post-IPO, el activo cotiza en la mitad inferior de su rango — hay recorrido si los catalizadores confirman, pero la corrección reciente (-5,11% semana) resta margen de maniobra de corto plazo (LECTURA).", "catalizadores": "**Catalizadores:**\n- Starship Flight 14 (NET 22-sep-2026, confirmado por FAA): primer perfil orbital Block 3 con carga comercial real (Starlink V3); éxito valida la tesis de abaratamiento de lanzamiento que sostiene el moat de Starlink (HECHO: NASASpaceFlight/FAA, 15-sep-2026).\n- Entrada a wireless/spectrum: FCC aprobó (12-may-2026) la incorporación de ~65 MHz de espectro de EchoStar (~US$17 mil M); transferencia completa esperada ~nov-2027, pero el mercado ya empieza a valorar la opcionalidad de disrupción de bajo capex frente a T-Mobile/AT&T/Verizon (HECHO: SpaceNews/orden FCC, 2026).\n- Contratos gubernamentales robustos: Space Force (~US$4,16 mil M + US$2,29 mil M) y ~US$1,6 mil M en 18 lanzamientos militares en 2026, más NASA sumando 6 misiones Commercial Crew adicionales tras problemas de Starliner/Boeing (HECHO: CNBC/Payload Space, 2026).\n- Earnings Q3 2026 (~03-nov, no confirmado): primer chequeo post-lockups masivos; el mercado buscará visibilidad de retorno del capex de IA/Starship tras la sorpresa negativa de capex en Q2 (HECHO/LECTURA, sep-2026).\n\n**Riesgos (por materialidad):**\n- Calendario de lockups sep-dic 2026 (24-sep ~328M acciones; cierre final 8-dic): presión de oferta recurrente ya se tradujo en caídas puntuales (~-3,9% el 9-sep) (HECHO: sep-2026).\n- Capex de IA/Starship por sobre lo esperado (US$18,4 mil M en Q2 vs ~US$13 mil M esperados) sin visibilidad clara de retorno de la integración xAI, generando ya una reacción negativa del mercado (HECHO: ago-2026).\n- Competencia de Amazon Leo (ex-Kuiper): más de 373 satélites en órbita a sep-2026, aún sin servicio comercial lanzado, pero presionando expectativas de precios en contratos empresariales futuros (HECHO/LECTURA, sep-2026).\n- Dependencia binaria de Musk/xAI: el fundador mantiene una porción relevante de acciones bloqueadas hasta jun-2027; la integración con xAI añade quema de caja de IA sin retorno probado (HECHO/LECTURA, 2026).", "sentimiento": "- Consenso de analistas se mantiene mayoritariamente \"Buy\"/\"Moderate Buy\", con targets promedio dispersos entre US$220-232 según el agregador consultado (HECHO: TipRanks/MarketBeat/S&P Global, sep-2026) — sentimiento sell-side sigue positivo.\n- Pivotal Research inició cobertura el 08-sep-2026 con Buy y target US$220; Wells Fargo mantiene Overweight con target US$212 — ambos validan la tesis estructural pese a moderar expectativas de corto plazo (HECHO: CNBC, sep-2026).\n- Acción cayó ~3,9% el 9-sep coincidiendo con el release de lockup Day-91, y el precio retrocedió otro -3,15% el 15-sep, evidencia de sensibilidad a oferta de acciones y a la digestión del capex de Q2 más que a un deterioro de fundamentales (HECHO: sep-2026).\n- Short interest: dato con discrepancia entre fuentes (~184M-220M acciones según agregador, sep-2026); free float aún reducido por lockups pendientes, lo que puede amplificar movimientos en ambas direcciones (LECTURA sobre datos no verificados cruzadamente).\n- LECTURA CONTRARIAN: el consenso sell-side sigue mayoritariamente alcista mientras el precio corrige (-5,11% semana) y el capex de IA genera dudas — el optimismo estructural persiste pero el mercado está empezando a exigir evidencia de retorno, sugiriendo cautela táctica de corto plazo pese a la tesis de largo plazo intacta.", "conclusion": "SPCX combina fundamentales que siguen mejorando (revenue +92%, pérdida por acción menor a lo esperado) con un capex de IA/Starship que ya generó la primera señal de fricción con el mercado, sumado a una oferta de acciones inestable por lockups hasta dic-2026. El catalizador inmediato es Starship Flight 14 (confirmado NET 22-sep por la FAA), seguido por el lockup del 24-sep y earnings Q3 (~3-nov, no confirmado). El consenso sigue alcista (target ~US$220-232) pero la corrección reciente (-5,11% semana) y la volatilidad (94% anualizada) exigen prudencia táctica. Confianza: media — la tesis estructural (Starlink + wireless + Starship) es sólida, pero el ruido de oferta y capex de corto plazo puede dominar el precio antes que los fundamentales."}, "scores": {"tecnica": {"score": 52, "just": "Precio en línea con SMA20 y sobre SMA50, pero RSI/MACD perdiendo fuerza y volumen liviano en la caída reciente (0,77x) — hay un indicio de secado de volumen vendedor (señal levemente positiva de cambio de carácter), pero aún sin confirmación de piso; nota moderada."}, "fundamental": {"score": 60, "just": "Revenue +92% YoY y pérdida por acción muy por debajo del consenso muestran apalancamiento operativo real en Starlink; sin embargo el capex de IA/Starship sorprendió al alza sin visibilidad de retorno, moderando la nota vs el trimestre previo."}, "sentimiento": {"score": 47, "just": "Consenso sell-side sigue mayoritariamente alcista, señal contraria de cautela; el mercado ya reaccionó dos veces a la baja en dos semanas (lockup 9-sep, corrección 15-sep) pese al buen tono de analistas, indicando fragilidad de corto plazo."}, "riesgo": {"score": 38, "just": "La volatilidad (94% anualizada) es alta, pero el riesgo real de pérdida permanente está en la dilución recurrente por lockups hasta dic-2026 y en el capex de IA creciendo más rápido que la visibilidad de retorno; dependencia binaria de Musk/xAI se mantiene sin resolver."}, "conviccion": {"score": 53, "just": "Asimetría razonable dado el gap a targets de consenso (+53-62%), pero la tesis no es falsable hasta ver el resultado de Starship Flight 14 (22-sep, ya confirmado por FAA) y la digestión de capex en Q3; conviccion media."}}, "opportunity": {"cats": {"valuacion_hist": {"score": 44, "just": "El precio corrigió a percentil 32% de su rango de 1 año (vs 38% hace una semana), levemente más barato en términos relativos, pero el múltiplo sobre ventas (~65-85x según fuente) sigue exigiendo ejecución perfecta; ni claramente barato ni caro vs su propia historia corta."}, "calidad": {"score": 63, "just": "Moat de costo/cadencia real (Falcon 9 reutilizable, ~82% del mercado comercial), Starlink rentable a nivel operativo con 12M suscriptores s demócratas y 4 republicanos -Collins, Hawley, Moran, Tillis- votaron en contra por lenguaje de ética, no por el marco SEC/CFTC), el senador Tillis presentó una moción para reconsiderar el proyecto; sin fecha confirmada aún (CoinDesk/NPR/CryptoTimes, 15-16/09/2026)."}], "sections": {"resumen": "BTC cotiza en US$75.619 (16-sep), -2,5% en 24h, tras una semana bisagra con dos catalizadores ya resueltos y ambos negativos: la Fed subió tasas 25pb a 3,75-4% (primera alza desde 2023, cuando el mercado esperaba pausa) y el CLARITY Act falló el cloture en el Senado (49-50, faltaron 11 votos). Los ETFs spot sufrieron su peor día desde junio (-US$450,4M el 15-sep) coincidiendo con el fracaso legislativo. MVRV ~1,1 sigue en zona históricamente asociada a pisos de ciclo (CryptoQuant). Fear & Greed en 48 (neutral), sin extremos claros (CFGI/Milk Road, 16-09-2026).", "fundamental": "- Emisión fija: próximo halving ~abril-2028 reduce subsidio de 3,125 a 1,5625 BTC/bloque; ciclo actual ~50% completado (CoinWarz/The Block, sep-2026). HECHO.\n- Hashrate ~906-934 EH/s, con difficulty en recuperación tras las mayores caídas interanuales de la historia de la red (-11% feb, -10% jun-2026) por economía minera débil y competencia de IA/HPC por electricidad (Blockspace/CryptoPotato, sep-2026). HECHO.\n- MVRV ~1,1, cerca de zonas de piso histórico (2015/2019/2022); no confirma sobrevaluación (CryptoQuant/KuCoin, sep-2026). LECTURA.\n- Demanda estructural vía ETFs (~1,3M BTC) y tesorerías corporativas: Strategy (ex-MicroStrategy) 717.131 BTC (~3,4% de la oferta), Metaplanet 43.000 BTC (Bitcoin Treasuries/coinlaw.io, ago-sep 2026). HECHO.\n- Presupuesto de seguridad casi íntegramente dependiente del subsidio de bloque; comisiones marginales — riesgo estructural de largo plazo sin resolver. LECTURA.", "valuacion": "- Precio -40% desde el ATH de ~US$126.198 (oct-2025); percentil 1 año en 26,3% (bajo dentro de su propio rango). Dado.\n- MVRV ~1,1 sugiere valuación on-chain no estirada, en zona históricamente asociada a bottoms de ciclo, aunque sin confirmación de piso definitivo; una caída a la zona baja de US$50.000 acercaría el MVRV a 1,0 (KuCoin/CryptoQuant, sep-2026). LECTURA.\n- Dominancia BTC ~57-60%, en retroceso desde el pico de ciclo ~65-66%, sin altseason confirmado (CoinGecko/CoinMarketCap, sep-2026). HECHO.\n- Sharpe 3,36 y Sortino 7,29 (dado) muestran retorno ajustado a riesgo aún atractivo pese a volatilidad 30d de 66,2%. Dado.\n- Drawdown máximo 1 año de -39,58% recuerda que la valuación 'barata' convive con riesgo de continuación bajista si el macro se endurece, como ocurrió esta semana. LECTURA.", "tecnico": "- RSI 48,7 en zona neutral, sin sobrecompra ni sobreventa (dado). HECHO.\n- MACD (+992,67) por debajo de su señal (+1.804,11), con histograma girando a la baja según 'trend' — señal de pérdida de momentum de corto plazo, agravada por la reacción negativa a Fed/CLARITY. Dado/LECTURA.\n- Precio +5,35% sobre SMA50 y +7,76% sobre SMA200, estructura de mediano plazo aún alcista pese a la corrección. Dado.\n- Precio -2,99% bajo SMA20, reflejando el deterioro de corto plazo tras el doble shock de esta semana. Dado.\n- Sin señales de piso activas (trend.senales_piso vacío); único gatillo técnico de carácter es el debilitamiento del MACD, no una reversión confirmada. Dado.", "catalizadores": "**Catalizadores:**\n- Próxima reunión FOMC 28-oct: tras el alza sorpresa de 25pb (a 3,75-4%), el mercado seguirá el tono de Powell y el dot plot dividido para 2027 (8 ven otra alza, 6 mantener, 4 recortes) (Federal Reserve/CNBC, 16-09-2026).\n- Moción de reconsideración del CLARITY Act (Tillis): sin fecha confirmada; el fracaso fue por lenguaje de ética, no por el marco SEC/CFTC, dejando puerta abierta a un nuevo intento (CoinDesk/NPR, 15-09-2026).\n- Regulation Crypto Assets (SEC): ventana de comentarios cierra 18-oct-2026; podría definir marco regulatorio de mediano plazo para activos cripto en EE.UU. (SEC.gov, ago-2026).\n- Reversión de flujos ETF: tras ana; ARK y Grayscale lideran salidas (FXStreet) |\n| 11-sep-2026 | -US$13,2M | Salida marginal, cuarto día consecutivo de outflows (Bitget/CoinDesk) |\n| 12-sep-2026 | -US$13,3M | Cuarto/quinto día de sangrado, salida leve (fuentes de mercado, sep-2026) |\n| 14-sep-2026 | +US$159,9M | Rebote puntual de inflows antes del FOMC/CLARITY (cryptonomist, 16-09-2026) |\n| 15-sep-2026 | -US$450,4M | Peor día desde el 24-jun; FBTC -US$214,8M, IBIT -US$161,7M, GBTC -US$44,1M, ARKB -US$17,4M, coincide con fracaso del CLARITY Act (CryptoDaily/HedgeCo, 15-16/09/2026) |\n\nBTC y ETH combinados perdieron ~US$592M en ETFs el 15-sep, la mayor salida conjunta reciente, en simultáneo con el fracaso del CLARITY Act en el Senado (BeInCrypto/HedgeCo, 16-09-2026). HECHO. En paralelo, direcciones ballena (1.000+ BTC) acumularon +122.000 BTC en las cuatro semanas previas a fines de agosto, y el conteo de direcciones ballena tocó máximos de 2026 (~20.229), mientras las reservas en exchanges siguen en mínimos estructurales (~8,3% de la oferta) (CryptoQuant/KuCoin/BGeometrics, ago-sep 2026). LECTURA/HECHO mixto -acumulación on-chain de mediano plazo contrasta con el nerviosismo de ETFs de esta semana. Tesorerías corporativas continúan activas: Strategy con 717.131 BTC y Metaplanet con 43.000 BTC (Bitcoin Treasuries/coinlaw.io, ago-sep 2026). HECHO.", "conclusion": "La semana bisagra se resolvió en negativo para BTC en ambos frentes: la Fed subió tasas 25pb (sorpresa hawkish, no la pausa esperada meses atrás) y el CLARITY Act fracasó en el Senado por votos de ética, no por el fondo regulatorio. Los ETFs registraron su peor salida diaria desde junio, aunque la acumulación on-chain de ballenas y la caída de reservas en exchanges sugieren que el capital de largo plazo no está capitulando. La estructura de mediano plazo (sobre SMA50/200) resiste y el MVRV (~1,1) no muestra sobrevaluación, pero el momentum técnico se debilitó. Confianza: media -el desenlace de los catalizadores ya es conocido y negativo, pero sin daño estructural confirmado en flujos de mediano plazo (16-09-2026)."}, "scores": {"tecnica": {"score": 50, "just": "RSI neutral y estructura sobre SMA50/200 se mantienen, pero el MACD pierde carácter (histograma girando a la baja) y el precio cayó bajo su SMA20 tras el doble shock Fed/CLARITY. Sin señales de piso activas."}, "fundamental": {"score": 60, "just": "Red segura y con demanda estructural creciente (ETFs, tesorerías corporativas con Strategy y Metaplanet sumando), pero presupuesto de seguridad dependiente casi 100% del subsidio y hashrate atravesando las mayores caídas interanuales de su historia."}, "sentimiento": {"score": 52, "just": "Fear&Greed neutral (48) sin extremos, pero la reacción negativa del mercado a Fed y CLARITY (peor salida ETF desde junio) contrasta con acumulación on-chain de ballenas de +122.000 BTC en 4 semanas -divergencia que favorece lectura algo contraria."}, "riesgo": {"score": 48, "just": "Volatilidad 30d de 66,2% es alta pero típica del activo; el riesgo material de esta semana -Fed hawkish confirmada y fracaso legislativo confirmado- ya se materializó sin evidencia de daño estructural a la tesis de adopción de largo plazo."}, "conviccion": {"score": 54, "just": "Tesis de mediano plazo (adopción institucional + emisión decreciente) intacta y falsable: se invalida con ruptura sostenida de SMA200 (~US$70.000) con volumen. Los catalizadores binarios ya se resolvieron negativamente sin quiebre estructural."}}, "sources": ["CoinGecko", "CoinMarketCap", "CFGI.io/Milk Road", "Farside Investors/HedgeCo/CryptoDaily", "CME FedWatch", "CryptoQuant/KuCoin", "CNBC", "Federal Reserve", "The Block", "CoinDesk", "NPR", "CryptoTimes", "Bitget Academy", "SEC.gov", "Bitcoin Treasuries/coinlaw.io", "BGeometrics", "Blockspace/CryptoPotato"], "opportunity": {"cats": {"valuacion_hist": {"score": 62, "just": "MVRV ~1,1 cerca de zonas de piso histórico (2015/2019/2022) y percentil 1 año de 26,3% sugieren valuación on-chain moderada dentro nta en Japón para 2026 (J.P. Morgan/Goldman Sachs, ago-2026).", "fundamental": "- Guidance FY3/27 (7-ago-2026, oficial/TDnet): ventas ¥74.500M (+25,1%), oper. ¥8.500M (+231%), neto ¥6.000M (+273% i.a.) — recuperación en V tras ciclo de semiconductores deprimido.\n- Q1 FY3/27 (7-ago-2026, TDnet): ventas ¥16.700M (+23,6% i.a.), oper. ¥1.800M (vs ¥100M año previo), pedidos +55,7% i.a. a ¥24.128M, impulsados por automatización global, pedidos de robots quirúrgicos en Norteamérica y demanda de equipos de semiconductores avanzados ligados a IA generativa.\n- Ampliación de capacidad en EE.UU. (Massachusetts, +50%, objetivo jun-jul 2026): confirmada por prensa japonesa especializada (Nikkan Kogyo, 20-feb-2026) tras filtración que movió la acción; SIN comunicado TDnet formal localizado que confirme cierre/operación plena — GAP DE COBERTURA declarado.\n- Dividendo FY3/27 confirmado: ¥20/acción anual (¥10 interino ex-div 29-sep-2026, pago 7-dic-2026 + ¥10 final), sin cambio i.a., payout objetivo ~35% del beneficio neto.\n- P/E TTM ~91x según agregador principal, pero otra fuente reporta 571x — GAP DE COBERTURA: discrepancia no reconciliada; tratar con cautela.", "valuacion": "- Market cap ≈¥548 mil millones (~US$3,5-3,6 mil millones), con P/E TTM elevado (~91x, con fuerte disparidad entre fuentes) que ya descuenta gran parte de la recuperación de utilidades.\n- Consenso de precio objetivo diverge marcadamente entre agregadores: Investing.com ¥7.731 (7-10 analistas, Buy, rango ¥3.300-¥11.000) vs TipRanks con muestras más chicas y ventanas de 3 meses que arrojan cifras muy distintas (¥4.076-8.396) — el mercado no tiene un ancla de valuación estable.\n- Giro extremo de Jefferies: de Underperform ¥2.600 (16-dic-2025) a Buy ¥10.000 en 2026 (fecha exacta no reconciliada entre fuentes) — un salto de ~4x en el target de un mismo analista en menos de un año, señal de reescritura completa de tesis más que de ajuste incremental.\n- El re-rating YTD (+52,7%) ya asume ejecución fuerte en robots de IA/humanoides; cualquier decepción en el Q2 o el guidance revertiría múltiplos rápidamente dado el apalancamiento operativo.\n- Tokai Tokyo Securities mantuvo Hold el 18-ago-2026 (post-guidance), mostrando que no todo el sell-side comparte el optimismo de Jefferies/consenso agregado.", "tecnico": "- Precio ¥5.880, sobre SMA20 (¥5.750, +2,3%) pero -7,3% bajo SMA50 (¥6.343) y +12,7% sobre SMA200 (¥5.218) — estructura mixta, base en construcción tras corrección de agosto-septiembre.\n- RSI 48,0 y MACD (-132,95) bajo señal (-196,31) pero con histograma mejorando — consistente con las 3 señales de piso activas (divergencia RSI alcista, MACD girando, volumen vendedor secándose).\n- Volumen del día muy bajo (79.300 vs promedio de 20 días de 1.085.600, ratio 0,07x) tras el pico de volumen del 11-sep (2,22M, +137% vs día previo) ligado a la reacción post-Q1 — el mercado ya digirió el catalizador reciente.\n- Máximo drawdown de 1 año -40,2%, Sharpe -0,64 y Sortino -0,57: el perfil de riesgo/retorno de corto plazo sigue siendo pobre pese al rally YTD.\n- Persisten señales de piso sin señales de techo (0 de 7) — cuadro técnico consistente con acumulación, no con clímax de venta ni de compra.", "sentimiento": "- Consenso sell-side mayoritariamente constructivo pero con dispersión inusual de targets (¥3.300-¥11.000 según agregador), señal de incertidumbre genuina, no solo de rezago de cobertura.\n- Giro dramático de Jefferies (Underperform ¥2.600 en dic-2025 a Buy ¥10.000 en 2026) es el caso más extremo de revisión sell-side observado, mientras Tokai Tokyo se mantiene cauteloso (Hold, 18-ago-2026) — el sell-side está dividido, no unánime.\n- Medios especializados en robótica (Pandaily, 36Kr Japan, humanoid.guide) mantienen narrativa alcista sobre HDSY como 'proxy' de humanoides, lo que puede sesgar el sentimiento minorista sin corroboración de pedidos concretos por cliente.\n- Cobertura en inglés sobre la empresa sigue siendo escasa: la confirmación de la ampliación de capacidad en EE.UU. proviene solo de prensa japonesa (Nikkan Kogyo) sin traducción oficial ni comunicado TDnet en inglés localizado — GAP DE COBERTURA explícito.\n- Ausencia de identificación del cliente norteamericano mantiene una prima de especulación que podría revertirse abruptamente si el nombre se revela y decepciona (o se confirma positivamente).", "catalizadores": "**Catalizadores:**\n- Confirmación de fecha e identidad del 'cliente norteamericano' de humanoides — el catalizador de mayor impacto potencial, aún pendiente (gap de cobertura activo).\n- Reporte Q2 FY3/27 (~5-nov a mediados-nov-2026, fecha no confirmada oficialmente) — validará si el guidance elevado del 7-ago se sostiene y si los pedidos de IA/humanoides siguen acelerando.\n- Fecha ex-dividendo confirmada 29-sep-2026 (¥10/acción interino, pago 7-dic-2026) — evento corporativo menor pero confirma sostenibilidad del payout pese al alza de utilidades.\n- Maduración de la ampliación de capacidad en EE.UU. (Massachusetts, +50%, objetivo jun-jul 2026 según Nikkan Kogyo) — de confirmarse en TDnet/IR oficial, señalaría compromiso de largo plazo con clientes norteamericanos.\n\n**Riesgos (por materialidad):**\n- Dependencia de cliente único/concentrado: la tesis de re-rating descansa en pedidos de humanoides de EE.UU. no identificados por nombre — riesgo de materialidad alta si el pipeline no se traduce en volumen.\n- Competencia estructural china acelerando: Leaderdrive tiene 80-90% del mercado chino de reductores para humanoides (Goldman Sachs, ago-2026) y 30-40% del mercado chino total (J.P. Morgan), y ya prueba canales de venta en Japón para 2026 y con clientes como FANUC (~1,5 años de pruebas) — riesgo de erosión del moat geográfico de HDS, no solo de precio.\n- Apalancamiento operativo extremo: la recuperación de +231% en beneficio operativo funciona igual de violento a la baja si el ciclo de semiconductores o pedidos de humanoides decepcionan.\n- Riesgo de calendario/comunicación: fecha de Q2 FY3/27 no confirmada oficialmente (TDnet) y ampliación de capacidad en EE.UU. sin comunicado oficial localizado generan incertidumbre de timing para los catalizadores más cercanos.", "conclusion": "HDSY combina un catalizador estructural real (robots de IA/humanoides, capacidad en EE.UU. ampliándose 50%) con máxima incertidumbre de ejecución: guidance FY3/27 robusto y confirmado oficialmente, pero el cliente ancla sigue sin nombre y Leaderdrive escala agresivamente en China y ya apunta a Japón. Técnicamente, las 3 señales de piso activas sugieren que la corrección de agosto-septiembre podría estar agotándose, pero la volatilidad extrema (95% anualizada) y el consenso de targets muy disperso (¥3.300-¥11.000, con Jefferies pasando de ¥2.600 a ¥10.000 en menos de un año) reflejan que el mercado no tiene ancla de valuación. Confianza media: postura de esperar el Q2 FY3/27 y/o la identificación del cliente antes de aumentar exposición."}, "scores": {"tecnica": {"score": 56, "just": "Las 3 señales de piso (divergencia RSI, MACD girando, volumen vendedor secándose) persisten y el precio recuperó la SMA20, pero sigue bajo SMA50 y la volatilidad extrema impide confirmar cambio de carácter genuino."}, "fundamental": {"score": 66, "just": "Guidance oficial FY3/27 con crecimiento explosivo (oper. +231%) confirmado por TDnet real (7-ago) y ampliación de capacidad en EE.UU. reportada por prensa japonesa primaria, pero P/E ya elevado y discrepancias de datos entre fuentes bajan algo de confianza en la calidad de la valuación reportada."}, "sentimiento": {"score": 52, "just": "Consenso sell-side constructivo pero dividido (giro extremo de Jefferies a Buy vs Hold cauteloso de Tokai Tokyo); narrativa mediática en inglés sobregira sobre humanoides sin corroboración de cliente, lo que exige leer el sentimiento con escepticismo."}, "riesgo": {"score": 36, "just": "Volatilidad extrema es coyuntural, pero dependencia de cliente no identificado y avance agresivo de Leaderdrive (80-90% del merca plegándose tras el pico de mediados de septiembre y en línea con la caída de BTC a ~US$76.000. La tesis sigue siendo el pivote a HPC/IA: el lease de Sandersville (US$6.600M a 20 años, jul-2026) es hecho consumado, y CleanSpark reafirmó en H.C. Wainwright (14-sep) su exclusividad sobre 885 MW en Texas, ahora con clasificación condicional de ERCOT (585 MW baseload + 300 MW studied load). El cuello de botella es la auditoría estatal de datacenters ordenada por el Gobernador Abbott, que frena ~1.800 proyectos en Texas; CleanSpark figura entre los comprometidos a cumplir sus estándares. Operativamente, agosto trajo 593 BTC producidos, 13.703 BTC en tesorería y 50 EH/s. Confianza: media.", "fundamental": "- HECHO: Ingresos Q3 FY2026 (trimestre a jun-2026, reportado 6-ago-2026) cayeron 30,5% a/a a US$138M vs US$198,6M, debajo del consenso de US$155,9M (Nasdaq/PRNewswire, 6-ago-2026).\n- HECHO: Pérdida neta GAAP de US$240M (US$0,89/acción) vs consenso de -US$0,33/acción; mejoró vs pérdida de US$378M en Q2 FY2026, pero fue un miss duro (Investing.com, 6-ago-2026).\n- HECHO: Margen bruto bajó a 38% desde 40% el trimestre previo, con ingresos +1% secuencial (StockTitan, ago-2026).\n- HECHO: Lease Sandersville a 20 años con tenant de grado de inversión, US$6.600M contratados (hasta US$11.600M con extensiones), ~US$330M NOI anual promedio, entregas desde Q4 2027 (PRNewswire, 14-jul-2026).\n- HECHO: ERCOT clasificó condicionalmente 885 MW del portafolio texano (585 MW baseload + 300 MW studied load); clasificación no habilita energización y queda sujeta a auditoría de verificación (Yahoo Finance/SEC 8-K, sep-2026).", "valuacion": "- HECHO: Market cap ~US$3,24 mil M con ~256,6M acciones en circulación (15-sep-2026).\n- HECHO: Consenso de 13 analistas (S&P Global vía WallStreetZen/TipRanks) da 'Strong Buy' unánime (13 Buy, 0 Hold, 0 Sell), precio objetivo promedio ~US$20-23,8, con Chardan en US$30 y Needham en US$23 (sep-2026).\n- HECHO: KBW (Keefe Bruyette) más conservador con Outperform y PT US$16 tras el lease de Sandersville (Blockspace, ago-2026).\n- LECTURA: la brecha entre precio (US$12,62) y targets (+60-90%) sugiere que el mercado sigue valuando a CLSK principalmente como minero, no como plataforma HPC/IA emergente; el re-rating depende de resolución regulatoria y ejecución, no de anuncios adicionales.\n- HECHO (dado): acción en percentil 29,6% de su rango de 1 año, lejos de máximos de 52 semanas (US$23,61) y solo levemente sobre mínimos (US$8,00).", "tecnico": "- HECHO (dado): RSI 49,4 y MACD +0,05 sobre señal -0,12 — zona neutral, sin sobrecompra ni sobreventa clara tras el retroceso reciente.\n- HECHO (dado): precio 1,84% sobre SMA20 pero -2,33% bajo SMA50, apenas 0,14% sobre SMA200 — estructura de corto plazo débil, prácticamente pegado a la media de largo plazo.\n- HECHO (dado): -4,9% día y -7,68% semana con volumen 15% bajo el promedio de 20 días — caída sin pánico vendedor extremo, más bien digestión del rally previo.\n- HECHO (dado): trend score señala 1 señal de 'techo' (pérdida de SMA20) y cero señales de piso — sesgo de corto plazo cauteloso, aunque sin ruptura de tendencia mayor.\n- LECTURA: volatilidad de 101,6% anualizada y máximo drawdown de 1 año de -64,7% confirman que el activo sigue siendo altamente especulativo; el retroceso actual luce más correlacionado con la caída de BTC (~-9% vs. benchmark en 30 días) que con deterioro idiosincrático.", "sentimiento": "- HECHO: CTO/COO Taylor Monnig vendió US$393.652 en acciones (4-8 sep-2026) vía plan 10b5-1 adoptado en mayo-2026, más disposiciones por US$1,55M para cubrir retención de impuestos por vesting de RSU (SEC Form 4, sep-2026).\n- HECHO: consenso de analistas 'Strong Buy' unánime (13/13) con targets 60-90% sobre el precio spot — sentimiento sell-side marcadamente optimista.\n- LECTURA: la venta de insider bajo plan predeterminado (10b5-1) es menos alarmante que una venta discrecional, pero la ausencia de compras internas frente al optimismo sell-side sigue siendo una divergencia a vigilar.\n- HECHO: cobertura de prensa especializada (Blockspace, panel H.C. Wainwright con MARA, Core Scientific, Bitdeer) confirma narrativa sectorial de 'mineros pivotando a infraestructura de IA', con foco en cuellos de botella de energía y regulación (Investing.com, 14-sep-2026).\n- LECTURA: la caída de BTC a ~US$76.000 (desde highs) resta viento de cola al sentimiento de corto plazo del sector minero en su conjunto.", "catalizadores": "**Catalizadores:**\n- Resolución de la auditoría PUCT/ERCOT (directiva Abbott) sobre los 885 MW en Texas — CleanSpark ya figura como comprometida a cumplir estándares, lo que reduce riesgo de exclusión total (HECHO, gov.texas.gov, ago-2026).\n- Actualización operacional de septiembre 2026 (~8-oct estimado) — próximo dato duro de producción/tesorería BTC (LECTURA, fecha estimada por patrón).\n- Avance de construcción en Sandersville para el tenant de grado de inversión, primer hito de entrega Q4 2027 (HECHO, dado en updates mensuales).\n- Earnings Q4 FY2026 el 16-dic-2026 — primera guía de capex 2027 post-Sandersville y post-miss de Q3 (LECTURA, fecha no confirmada oficialmente).\n\n**Riesgos (por materialidad):**\n- Riesgo de reversión regulatoria: la auditoría de ~1.800 proyectos en Texas podría extenderse o imponer condiciones que retrasen la monetización de los 885 MW (HECHO, Utility Dive/Texas Tribune, ago-2026).\n- Correlación directa con BTC: la caída del bitcoin a ~US$76.000 (desde niveles más altos) comprime ingresos de minería y el valor de la tesorería de 13.703 BTC, amplificando cualquier drawdown de la acción (HECHO, CoinDesk, 16-sep-2026).\n- Riesgo de dilución adicional si CLSK necesita más capital para financiar la construcción de sus campos texanos antes de asegurar tenant definitivo (LECTURA, inferido de patrón de financiamiento previo vía convertibles).\n- Negocio minero base sigue débil: ingresos -30,5% a/a y compresión de márgenes en Q3 FY2026 mientras la transición a HPC aún no genera flujo de caja (HECHO).", "conclusion": "CLSK retrocede a zona neutral técnica (RSI 49, pegado a SMA200) tras un rally que se desinfló junto con BTC, sobre una tesis HPC/IA que ya tiene a Sandersville como hecho consumado y 885 MW en Texas con clasificación condicional de ERCOT, aunque sujeta a la auditoría estatal ordenada por Abbott. El negocio minero base sigue débil (ingresos -30,5% a/a, pérdida de US$240M en Q3 FY2026) y la acción amplifica cualquier movimiento de BTC, que cayó a ~US$76.000. Confianza media: la tesis es falsable con la resolución de la auditoría texana y la conversión de la exclusividad en contratos firmes de tenant; el riesgo principal es doble (regulatorio + correlación BTC), no solo de ejecución."}, "scores": {"tecnica": {"score": 50, "just": "Zona neutral: RSI 49,4, MACD apenas positivo pero cruzando señal, precio prácticamente pegado a SMA200 tras perder SMA50. Sin evidencia clara de cambio de carácter en ningún sentido; baja vs. reporte previo porque el impulso alcista de días atrás se disipó con la caída de BTC."}, "fundamental": {"score": 42, "just": "Q3 FY2026 fue un miss duro (ingresos -30,5% a/a, pérdida de US$0,89/acción vs. -US$0,33 esperado) con margen bruto comprimiéndose a 38%. Se mantiene igual que el reporte previo: la compresión post-halving sigue pesando más que los anuncios de HPC en el P&L actual."}, "sentimiento": {"score": 47, "just": "Divergencia entre consenso sell-side 'Strong Buy' unánime (targets +60-90%) e insider (Monnig) vendiendo bajo plan 10b5-1 sin compras registradas. Contrarian leve: el optimismo de analistas ya está muy cargado, por lo que el margen de sorpresa positiva es menor que el de sorpresa negativa regulatoria o de BTC."}, "riesgo": {"score": 36, "just": "Distingue volatilidad (101,6% anualizada, propia de un minero de BTC apalancado) de riesgo de pérdida permanente: dependencia crítica de la auditoría regulatoria en Texas y correlación directa con el precio de BTC (caída a ~US$76.000), que no son reversib a auditoría PUCT/ERCOT sobre los 885 MW, y earnings Q4 FY2026 (16-dic) con primera guía de capex 2027."}, "contrarian": {"score": 48, "just": "Consenso de analistas ya muy optimista (Strong Buy unánime, objetivos +60-90%) limita la señal contraria pura; la venta de insider bajo plan 10b5-1 y la caída de BTC generan cautela adicional sin ser pánico extremo."}}, "plan": {"recomendacion": "Esperar gatillo", "zona_compra": "US$10-13", "invalidacion": "Cierre sostenido bajo SMA200 (~US$12,60) o resolución regulatoria adversa (exclusión/rechazo de los 885 MW texanos en la auditoría de Abbott)", "gatillos": ["Resolución favorable de la auditoría PUCT/ERCOT sobre los 885 MW en Sealy-Brazoria", "Update operacional de octubre con tesorería BTC estable o creciente pese a la caída del precio de BTC", "Estabilización o rebote del precio de BTC por sobre US$80.000"], "horizonte": "6-18 meses", "tamano": "Posición pequeña-moderada (alta beta a BTC, dimensionar como apuesta apalancada, no como proxy directo de bitcoin)", "confianza": "media"}}, "perfil": "CleanSpark es un operador de centros de datos que monetiza electricidad: compra energía barata en Georgia, Tennessee, Wyoming y Texas, opera infraestructura y máquinas propias —sin hosting de terceros— y convierte kilovatios en bitcoin. Facturó $766,3M en FY2025 (+102%), superó los 50 EH/s y retiene una tesorería de ~13.700 BTC. El modelo está mutando: la compresión post-halving hundió los ingresos trimestrales ~30% a/a, y firmó un arriendo triple neto a 20 años por 175 MW con una tecnológica de grado de inversión (~$6.600M contratados, margen casi íntegro), además de una LOI de exclusividad sobre su portafolio texano de hasta 885 MW. Ahí está la tesis: el activo escaso no son las máquinas sino su cartera de energía contratada e interconexiones, justo lo que demanda la IA. Como minero es tomador de precio doblemente cíclico, con dilución permanente (incluida la potencial por convertibles sobre US$19,16) y el halving de 2028 recortando el subsidio a la mitad; la variable crítica es el financiamiento, que ata la reconversión a HPC al costo de capital y al precio del bitcoin que sirve de colateral."}, {"ticker": "MSTR", "company": "Strategy (MicroStrategy Incorporated)", "statsList": [["Precio", "$132.25 (17-sep-2026)"], ["Rango 52 sem.", "US$81,81 (26-jun-2026) - US$365,21 (6-oct-2025); percentil de precio a 1 año: 17,3% (technical, 11-sep-2026)"], ["Market cap", "~US$51,1-51,9 mil M; el 11-sep-2026 Strategy superó a Block Inc en capitalización bursátil, 217ma mayor empresa de EE.UU. (cryptotimes.io, KuCoin, 10-11-sep-2026)"], ["BTC en tesorería", "845.050 BTC, costo agregado US$63,73 mil M, costo prom. US$75.412/BTC; sin 8-K nuevo desde el 14-sep (0 BTC comprados/vendidos, segunda semana consecutiva sin actividad de BTC); próximo 8-K semanal esperado ~21-sep (SEC 8-K 14-sep-2026, The Block, bitcointreasuries.net)"], ["mNAV", "~0,78x básico (descuento) / ~1,04-1,13x bajo la definición 'enterprise' que Strategy adoptó el 23-jul-2026 (share price / BTC neto por acción, no comparable con cifras previas); con BTC ~US$76.000 (15-sep) el descuento básico se mantiene (bitcointreasuries.net, mnav.com, Strategy dashboard)"], ["Próx. earnings", "Q3 2026: ~4-nov-2026 después del cierre (TipRanks, Investing.com, WallStreetZen; sin confirmación oficial primaria de Strategy a la fecha de este informe)"], ["Técnico (auto)", "RSI 56.0 · MACD +6.34 / señal +7.51 (TradingView, 17-sep-2026)"]], "technical": {"price": 132.25, "change_1d_pct": 4.81, "change_1w_pct": 0.98, "rsi": 56.0, "macd": 6.3383, "macd_signal": 7.5058, "sma20": 129.5675, "sma50": 109.6146, "sma200": 137.1299, "ema12": 130.1751, "ema26": 123.8369, "pct_vs_sma20": 2.07, "pct_vs_sma50": 20.65, "pct_vs_sma200": -3.56, "volume_today": 18591656, "volume_avg20": 20975111.0, "volume_ratio": 0.89, "volatility_30d": 104.73, "sharpe": 12.12, "sortino": 19.68, "max_drawdown_1y": -77.12, "price_percentile_1y": 17.8, "vs_benchmark_30d_pct": 20.0, "perf_1m_p ", "kind": "corporate", "info": "Consulta de MSCI (lanzada ago-2026, distinta de la de 2025 ya resuelta sin exclusión en feb-2026) propone un filtro de activos operativos <50% + 5 ratios financieros; aplicado hoy, excluiría a Strategy, Metaplanet y Yellow Cake del MSCI ACWI IMI (~US$24 mil M de free float en juego). Saylor y Phong Le respondieron formalmente calificándola de 'pretexto' sin base en US GAAP/IFRS (Coindesk, Benzinga, strategy.com/msci, ago-sep-2026)."}, {"date": "2026-10-16", "label": "Anuncio de resultados de la consulta MSCI", "kind": "corporate", "info": "MSCI espera anunciar resultados a mediados de octubre (~16-oct); de aprobarse, la implementación sería en la revisión de índices de noviembre-2026, con ventas pasivas forzadas sobre el free float de Strategy. Sin cambios de calendario detectados en la última semana (MSCI index consultations, Coindesk, cryptoslate.com, sep-2026)."}, {"date": "2026-11-04", "label": "Earnings Q3 2026", "kind": "earnings", "info": "Fecha estimada por TipRanks/Investing.com (after-close), pendiente de confirmación oficial de Strategy. El mercado buscará BTC Yield actualizado (5,0% en Q2 tras 3,2% en Q1; 4,5% YTD a jun-2026) y guía sobre ritmo de buybacks de preferentes vs. compras de BTC."}], "sections": {"resumen": "Strategy sigue en modo defensivo: sin 8-K nuevo desde el 14-sep, que confirmó cero compras de BTC por segunda semana consecutiva (845.050 BTC sin cambios) y US$139,3M destinados a recomprar STRC con descuento. El mNAV básico (~0,78x) sigue en descuento, aunque la propia Strategy reporta ~1,04-1,13x bajo su definición 'enterprise' redefinida en julio (no comparable con cifras previas). BTC ronda US$76.000, cerca del promedio de compra de Strategy (US$75.412), dejando la posición con margen escaso. La consulta MSCI sobre 'non-operating companies' (cierre 30-sep, resultado ~16-oct) sigue siendo el catalizador binario más cercano. Consenso Wall Street sigue Strong Buy con targets elevados (~US$226), en tensión con el precio deprimido.", "fundamental": "- Tesorería: 845.050 BTC a costo promedio US$75.412 (~US$63,73 mil M invertidos); 0 BTC comprados en las semanas del 31-ago-6-sep y 7-13-sep, sin 8-K posterior al 14-sep (SEC 8-K, 8 y 14-sep-2026).\n- mNAV: ~0,78x básico (descuento) según trackers independientes vs. ~1,04-1,13x bajo la métrica 'enterprise' que Strategy redefinió el 23-jul-2026 (precio/BTC neto por acción) — la doble métrica dificulta comparar con el régimen premium 2024-2025.\n- BTC Yield: 3,2% en Q1 2026, 5,0% en Q2 2026 (4,5% YTD a jun); management espera mejorar con precios de BTC más altos, pero el objetivo de 1 millón de BTC para fin de 2026 luce fuera de alcance al ritmo actual (implicaría ~155.000 BTC adicionales en ~3,5 meses sin compras recientes).\n- Preferentes vivas (~US$15 mil M): STRC, STRK, STRF y STRD cotizando bajo par a inicios de sep-2026, evidenciando estrés de financiamiento; solo STRC recibió buybacks en sep (US$176M semana 7-sep, US$139M semana 13-sep), financiados con el nuevo pool 'USD Cash' (parte del Digital Credit Capital Framework anunciado 24-ago).\n- Programa de recompra de preferentes duplicado a US$2.000M (de US$1.000M) a inicios de sep; ~US$1,05 mil M restante de autorización, priorizando esto sobre nuevas compras de BTC.", "valuacion": "- mNAV básico ~0,78x es el dato central de trackers independientes: la acción vale menos que su BTC subyacente por acción bajo esa métrica, lo opuesto al régimen 2024-2025 (premium de hasta 3,4x); la propia Strategy reporta ~1,04-1,13x tras redefinir la métrica en julio, generando confusión sobre cuál es el nivel 'real'.\n- Market cap ~US$51,1-51,9 mil M vs. valor de mercado de sus 845.050 BTC (~US$64 mil M a US$76.000/BTC) — el descuento bajo la métrica básica es consistente y no solo un artefacto de EV vs. equity.\n- Consenso analistas Strong Buy con target promedio ~US$226 (S&P Global/16-18 analistas, 13 buy/strong buy, 2 hold, 2 sell) — upside promedio +57% refleja modelos anclados a supuestos alcistas de BTC, no al mNAV actual.\n- Percentil de precio a 1 año de solo 17,3% pese al rally reciente (+36,5% en 1 mes) — la acción sigue muy lejos de sus máximos de 52 semanas (US$365,21, oct-2025).\n- El descuento sobre NAV básico, si persiste, es autolimitante: cualquier emisión de equity a estos niveles diluye a los holders existentes en términos de BTC por acción.", "tecnico": "- RSI 54,7 y MACD +7,53 vs. señal +8,09 (histograma girando a la baja) — impulso alcista perdiendo fuerza tras el rally de agosto-septiembre.\n- Precio (US$129,60) por debajo de la SMA200 (US$137,60, -5,8%) pero muy por encima de SMA50 (US$108,27, +19,7%) — estructura de recuperación de corto plazo dentro de una tendencia de más largo plazo aún débil.\n- Volatilidad anualizada 30d de 103,7% y drawdown máximo a 1 año de -77,1% ilustran el perfil extremo típico del apalancamiento implícito sobre BTC.\n- Volumen ligeramente sobre el promedio de 20 días (ratio 1,16) tras la caída diaria de -5,36% del 15-sep, sin señal clara de acumulación o distribución.\n- Caída semanal de -1,05% con retroceso diario marcado muestra el patrón de whipsaw característico de MSTR, sin catalizador idiosincrático claro más allá de BTC bajando hacia US$76.000.", "sentimiento": "- Consenso sell-side Strong Buy con targets promedio ~57% sobre el precio actual — sentimiento institucional aún muy optimista pese al deterioro del mNAV básico.\n- Saylor sigue defendiendo la disciplina de capital de STRC en redes tras el rally de compras de fines de agosto, señal de gestión de narrativa hacia la base retail/cripto.\n- Cobertura de prensa cripto (The Block, Coindesk, cryptotimes.io) enmarca la pausa de compras y los buybacks de STRC como 'disciplina de capital', mientras medios más escépticos (24/7 Wall St.) resaltan que la última compra de BTC ya está cerca de pérdida con BTC en US$76.000.\n- Narrativa de 'death spiral' persiste en foros desde el mNAV básico <1x, pero fuentes especializadas la consideran prematura dado el perfil de deuda convertible sin covenants de margin call.\n- Divergencia sentimiento-precio marcada: consenso alcista de analistas vs. precio en percentil 17% de su rango anual — configuración clásica de sentimiento contrario.", "catalizadores": "**Catalizadores:**\n- Estabilización/repunte de BTC sobre US$80.000: reabriría la ventana de mNAV premium y permitiría retomar compras acretivas de BTC.\n- Resultado favorable de la consulta MSCI (retiro de la propuesta, ~16-oct): eliminaría el riesgo de ventas pasivas forzadas sobre el free float.\n- Reporte de BTC Yield Q3 en mejora sobre el 5,0% de Q2, mostrando que la maquinaria de creación de valor por acción sigue funcionando pese al mNAV básico bajo.\n- Reanudación de compras semanales de BTC en el 8-K del 21-sep, señal de que el management ve valor en acumular a estos niveles.\n\n**Riesgos (por materialidad):**\n- Exclusión confirmada de índices MSCI (anuncio ~16-oct, implementación en revisión de noviembre): forzaría ventas pasivas y presionaría aún más el mNAV.\n- BTC perdiendo el soporte de US$75.000-76.000 (ya rondando ese nivel el 15-16-sep): llevaría el valor de la tesorería bajo el costo promedio de adquisición, deteriorando percepción de solvencia.\n- Persistencia del mNAV básico bajo 1x por trimestres: cerraría permanentemente el acceso a capital barato vía ATM, forzando más ventas de BTC para servir preferentes.\n- Preferentes (STRK, STRF, STRD, STRC) cotizando bajo par sugieren que el mercado de crédito ya está descontando estrés de refinanciamiento.", "conclusion": "MSTR es hoy un derivado apalancado de BTC en fase defensiva: sin compras de BTC desde hace dos semanas, foco en recomprar preferentes baratas, mNAV básico en descuento persistente (aunque Strategy reporta una métrica 'enterprise' distinta cerca de 1x). La tesis alcista de consenso (Strong Buy, targets ~+57%) choca con un precio en el percentil 17% de su rango anual y riesgos estructurales concretos (MSCI, servicio de preferentes, cierre de la ventana de emisión acretiva). No hay tesis sin vista de BTC: si BTC se estabiliza sobre US$78.000-80.000 y MSCI no excluye, el descuento de mNAV es oportunidad; si BTC cae bajo US$73.000-74.000 (ya cerca, en US$76.000) o MSCI excluye, el círculo vicioso se retroalimenta. Confianza: media, condicionada casi enteramente a variables exógenas (BTC, decisión MSCI)."}, "scores": {"tecnica": {"score": 47, "just": "RSI neutro (54,7) y MACD con histograma girando a la baja tras un rally de +36,5% en 1 mes; precio aún bajo SMA200 (-5,8%) y caída fuerte del 15-sep (-5,36% diario). Cambio de carácter incompleto: recuperación de corto plazo sin confirmación de tendencia mayor."}, "fundamental": {"score": 40, "just": "mNAV básico en descuento (~0,78x) cierra la máquina de emisión acretiva; dos semanas sin compras de BTC y prioridad en buybacks de preferentes muestran gestión táctica, no crecimiento. BTC Yield Q2 de 5,0% es el único dato claramente positivo, pero la métrica 'enterprise' propia introduce ruido sobre el nivel real de descuento."}, "sentimiento": {"score": 58, "just": "Divergencia contrarian marcada: consenso Strong Buy con targets muy por sobre el precio actual (~57% upside), mientras la acción cotiza en el percentil 17% de su rango anual — configuración típica de sentimiento excesivamente optimista en un activo deprimido, lo que puntúa alto en la lógica contraria."}, "riesgo": {"score": 27, "just": "Riesgo elevado por materialidad, no solo volatilidad: mNAV básico bajo 1x, ~US$15 mil M en preferentes perpetuas servidas con ventas de BTC o caja limitada, BTC rozando el costo promedio de adquisición (US$76.000 vs US$75.412) y riesgo binario MSCI con resultado en 4 semanas. Volatilidad 30d de 104% y drawdown -77% a 1 año agravan el perfil."}, "conviccion": {"score": 43, "just": "Asimetría real pero atada 100% a BTC: si BTC sube y MSCI no excluye, el descuento de mNAV básico se cierra rápido; si BTC cae bajo el costo promedio o MSCI excluye, el riesgo de espiral se activa. Tesis falsable con catalizadores fechados (30-sep, 16-oct, 11-nov) pero con margen de seguridad cada vez más estrecho al precio actual."}}, "sources": ["SEC EDGAR (CIK 0001050446) — 8-K 14-sep-2026", "The Block", "24/7 Wall St.", "Fortune", "bitcointreasuries.net", "mnav.com", "stockanalysis.com", "cryptotimes.io", "Coindesk", "Benzinga", "crowdfundinsider.com", "strategy.com/msci", "MSCI Index Consultations", "TipRanks", "S&P Global Market Intelligence (vía stockanalysis.com forecast)", "GuruFocus/Yahoo Finance (Q2 2026 earnings call)", "TradingView scanner"], "opportunity": {"cats": {"valuacion_hist": {"score": 57, "just": "mNAV básico ~0,78x está en descuento, cerca de mínimos históricos (0,68x en agosto), revirtiendo el régimen premium 2024-2025 que llegó a 3,4x; la métrica 'enterprise' propia de Strategy (~1,04-1,13x) matiza pero no elimina la señal de descuento de mercado."}, "calidad": {"score": 31, "just": "Tesorería de 845.050 BTC intacta pero sin compras hace dos semanas y BTC rozando el costo promedio (US$76.000 vs US$75.412); ~US$15 mil M en preferentes perpetuas exigen acceso continuo a mercados de capital mientras el mNAV básico está en descuento."}, "asimetria": {"score": 60, "just": "Upside si BTC recupera US$80.000+ y el mNAV se normaliza hacia 1x; downside menos acotado que antes porque BTC ya está cerca del costo promedio de adquisición, reduciendo el colchón de la tesorería."}, "catalizadores": {"score": 52, "just": "Consulta MSCI (cierre 30-sep, resultado ~16-oct) y earnings Q3 (~4-nov) son catalizadores binarios con fecha concreta pero de resultado incierto en ambas direcciones; el 8-K del 21-sep es el gatillo más inmediato."}, "contrarian": {"score": 59, "just": "mNAV básico en descuento combinado con consenso de analistas fuertemente alcista (targets ~57% sobre el precio) sugiere pesimismo de precio no del todo alineado con la tesorería subyacente, aunque el margen de seguridad se redujo con BTC acercándose al costo promedio."}}, "plan": {"recomendacion": "Esperar gatillo", "zona_compra": "US$115-128 si BTC se estabiliza sobre US$76.000-78.000 y se confirma reanudación de compras de BTC en un próximo 8-K semanal", "invalidacion": "Pérdida de soporte BTC bajo US$73.000-74.000 (bajo el costo promedio de Strategy), o exclusión MSCI confirmada (~16-oct) con implementación en revisión de noviembre", "gatillos": ["Reanudación de compras semanales de BTC en el próximo 8-K (~21-sep)", "Resultado de consulta MSCI (~16-oct)", "BTC Yield Q3 mostrando mejora sobre 5,0% de Q2", "mNAV básico recuperando >1x de forma sostenida"], "horizonte": "6-18 meses", "tamano": "Posición pequeña-moderada", "confianza": "media"}}, "perfil": "Strategy es formalmente una empresa de software de inteligencia de negocios, pero su negocio real es ser un vehículo apalancado de tesorería en bitcoin: el software factura ~$500M anuales y funciona como ancla contable, no como driver de valor. La maquinaria es emitir acciones, convertibles y preferentes perpetuas (~$15.000M vivos) para comprar bitcoin. La lógica es reflexiva y depende del mNAV: mientras la acción cotice sobre el valor de sus bitcoins por acción, emitir es acretivo y el ciclo se autoalimenta. En 2026 se invirtió — el mNAV cayó de ~3,4x a niveles de descuento (0,68x-0,78x) y la empresa pasó de comprador estructural a gestor táctico, priorizando recompra de preferentes sobre nuevas compras de BTC mientras mantiene 845.050 BTC comprados a ~$75.412 promedio. Lo estructural: exige acceso permanente al mercado de capitales; las preferentes son una obligación de caja perpetua contra un activo que no genera flujo; y los ETFs spot erosionaron su moat original. El riesgo terminal es la espiral: descuento sobre NAV, imposibilidad de emitir acretivamente, venta de bitcoin para pagar cupones."}, {"ticker": "CCU", "company": "Compañía Cervecerías Unidas S.A.", "statsList": [["Precio", "$5.330 CLP (17-sep-2026)"], ["Rango 52 sem.", "$4.947 – $6.598 CLP"], ["Listado", "Bolsa lease 1Q26, may-2026).\n- HECHO — **Negocios Internacionales** (Argentina, Bolivia, Paraguay, Uruguay): ventas −6,7%, EBITDA −18,6% a CLP 28.489 millones; volúmenes −1,7% con caída de un dígito medio en cerveza en Argentina (press release 1Q26).\n- HECHO — **Vinos**: ventas −7,2%, EBITDA −50,1% a CLP 3.288 millones (margen −508 pb) por mayor costo del vino y sobreoferta global (~US$19B de inventario excedente en la industria) (press release 1Q26; DF, 12-jun-2026).\n- HECHO: TTM en USD (ADR): revenue US$3,13B (−2,2%), utilidad neta US$121,8M (−32,0%); ROE 7,3-7,9%; Deuda/Patrimonio 0,71x (StockAnalysis 20-jul-2026; Visfin jul-2026).\n\n**Propiedad y movimientos corporativos:**\n\n- HECHO: IRSA controla el 65,87% de CCU; IRSA es JV 50/50 entre Quiñenco y Heineken. Free float: 20,04% local + 14,09% ADR (ccuinvestor.com, 2026).\n- HECHO: CCU completó la compra de la participación de Nestlé en el JV de aguas por US$180 millones (DF, 12-jun-2026).\n- HECHO: Eduardo Ffrench-Davis asumió como CEO el 1-jul-2026 tras 28 años de Patricio Jottar, quien pasa al directorio; Alexandre Carreteiro (presidente de Heineken Américas) fue nombrado vicepresidente del directorio (TipRanks, jul-2026).\n- LECTURA: el negocio chileno (dos tercios del EBITDA) está en su mejor momento de márgenes en años; el problema de CCU no es operacional en su core, sino la exposición a Argentina y al ciclo global del vino. La mayor injerencia de Heineken en el directorio puede traer disciplina de márgenes o tensión con Quiñenco — sin evidencia de conflicto por ahora.", "valuacion": "- HECHO: P/E trailing 17,25x local / 16,9-18,4x ADR; forward ~15x (BTG estima 13,3x); EV/EBITDA 8,66x (Investing/Visfin/StockAnalysis, jul-2026).\n- HECHO: la acción transa **~20% por debajo de su promedio de valuación de los últimos 10 años** (DF, 12-jun-2026).\n- HECHO: dividend yield ~3,0% local (dividendo definitivo N°272 de $74,53 por acción pagado desde el 24-abr-2026) (TipRanks/Diario Estrategia, abr-2026).\n- HECHO — targets locales: consenso **$5.877 CLP (+11%)**, máx $6.600, mín $4.365; 2 buy / 4 hold / 4 sell (Investing.com, jul-2026). Casas (DF, 12-jun-2026): **BICE Sobreponderar PO $7.794 (+52%)**, **BTG Neutral PO $6.500**, **UBS Vender PO $4.750** (argumenta crecimiento de ingresos de un dígito hasta 2028).\n- HECHO: ADR consenso Hold, target US$12,46 (+10,8%, 7 analistas) (StockAnalysis, 20-jul-2026).\n- LECTURA: la valuación es el corazón de la tesis alcista — múltiplos comprimidos contra la propia historia con un IPSA que transa ~12% caro vs la suya. Pero el descuento tiene causa: el upside depende de que Argentina y Vinos se normalicen, no del negocio chileno que ya opera bien y está en el precio. La dispersión BICE/UBS (de +52% a −7%) refleja exactamente esa apuesta.", "tecnico": "- HECHO: precio $5.285 CLP, +1,28% en la sesión del lunes 20-jul y +1,63% vs 5 ruedas atrás (TradingView tiempo real, 20-jul-2026).\n- HECHO: RSI(14) diario 56,3 — neutral con sesgo alcista; MACD(12,26,9) +12,6 sobre señal −1,0 (histograma +13,6): **cruce alcista reciente** (calculado sobre 130 barras diarias de TradingView, 20-jul-2026).\n- HECHO: precio sobre la SMA20 (~$5.183, +2,0%) y SMA50 (~$5.204, +1,6%), y justo en la SMA100 (~$5.285); bajo la MM200 publicada (~$5.670) (TradingView 20-jul-2026; Visfin jul-2026).\n- HECHO: señal técnica diaria \"Strong Buy\", semanal neutral (Investing.com, jul-2026). Mínimo de 52 semanas $4.947 tocado a inicios de mayo; desde ahí, piso doble en la zona $5.000-5.050 (jun y feb).\n- LECTURA: estructura de base tras 12 meses bajistas (−16,6% en las últimas ~26 semanas). Soportes: $5.183-5.204 (SMA20/50) y $5.000-4.947; resistencias: $5.443 (máximo intradía del 20-jul), $5.670 (MM200) — su recuperación sería la confirmación de cambio de tendencia — y la zona $6.600. El cruce de MACD con RSI aún lejos de sobrecompra deja espacio al rebote, pero mientras siga bajo la MM200 es un rebote dentro de tendencia bajista, no una tendencia alcista nueva.", "catalizadores": "- HECHO: **resultados 2T26 el 6-ago-2026** (StockAnalysis, jul-2026). LECTURA: trimestre de invierno, estacionalmente débil en volúmenes; el foco estará en si Chile sostiene margen 20% y en el ritmo de deterioro/mejora argentino.\n- HECHO: **nuevo CEO** Eduardo Ffrench-Davis desde el 1-jul-2026, con prioridad declarada en márgenes y eficiencia; renovación de comités del directorio entre julio y agosto (DF 12-jun-2026; TipRanks jul-2026). LECTURA: primer plan estratégico del nuevo management es el catalizador idiosincrático más cercano.\n- HECHO: **tipo de cambio** — USD/CLP ~926 (14-jul-2026), con el CLP apreciado 8,1% vs USD en 1T26: viento a favor directo en costos dolarizados del segmento Chile (dolarhoy.net; press release 1Q26).\n- HECHO: **insumos** — aluminio LME ~US$3.160-3.200/t con inventarios −43% en el año y déficit proyectado (~930 kt según Macquarie); cebada y lúpulo europeos +12-18% de costo desembarcado en 1T26 (TradingEconomics/AgMetalMiner/Expert Market Research, jul-2026).\n- HECHO: **Argentina** — consumo masivo −3,3% acumulado en 2026, pero inflación mensual desacelerando (<2% proyectado para julio) y expectativa de recuperación gradual del consumo en 2S26 (Bloomberg Línea/Infobae, jun-2026). LECTURA: la recuperación argentina es la opción de mayor convexidad de la tesis.\n- HECHO: **macro Chile** — PIB 1T26 −0,5% a/a, Imacec de mayo −0,9% (quinto retroceso consecutivo), Banco Central recortó el crecimiento 2026 hacia ~1%, riesgo de recesión técnica (Emol/Bloomberg/XTB, mar-jul 2026). LECTURA: el 1T26 se benefició de un consumo chileno que ya no acelera — el viento de cola doméstico se está apagando.", "sentimiento": "- HECHO: consenso local Neutral con 2 buy / 4 hold / 4 sell y PO $5.877 (Investing, jul-2026); ADR Hold con target US$12,46 (StockAnalysis, 20-jul-2026). El DF tituló (12-jun-2026): \"Argentina y alta exposición a vinos y cervezas hacen dudar al mercado\".\n- HECHO: noticias de los últimos 45 días — cierre de la compra del JV de aguas a Nestlé (US$180M, jun), cambio de CEO y reordenamiento del directorio con mayor presencia de Heineken (1-jul), y entrada en vigencia de nuevas restricciones a la publicidad de alcohol en Chile el 7-jul-2026.\n- HECHO: contexto IPSA — el índice acumula ~70 máximos históricos en el año, transa ~12% más caro que su historia, con flujos extranjeros récord (US$112M vía el principal ETF en el año) y targets como el de Bci en 12.050 puntos; el optimismo se moderó en julio por el débil crecimiento (DF/Emol/Bloomberg, 2026).\n- LECTURA: el contraste es la historia — el IPSA en máximos mientras CCU está 20% bajo su peak la convierte en uno de los grandes laggards del rally chileno. Eso sostiene el argumento de valuación relativa (BICE), pero 4 de 10 analistas locales recomiendan vender: el mercado no compra la normalización de Argentina y Vinos todavía. Sin datos públicos de posicionamiento institucional o insiders para el papel local.", "conclusion": "CCU es una apuesta de valuación y reversión a la media, no de momentum: negocio core chileno en su mejor nivel de márgenes, múltiplos 20% bajo su historia, 3% de yield, y dos lastres (Argentina, Vinos) que explican el descuento y cuya normalización — no garantizada — es el upside. El técnico acompaña por primera vez en meses (cruce de MACD, sobre SMA20/50, doble piso en $5.000) pero la MM200 en $5.670 sigue arriba como techo de la tendencia. Con el consenso en Hold y el IPSA caro, el papel ofrece asimetría razonable bajo $5.300 con soporte claro en $5.000, catalizador fechado el 6-ago (2T26) y la incógnita del plan del nuevo CEO. La señal es **Hold** con sesgo constructivo: para pasar a Buy se necesita recuperar la MM200 y/o evidencia de que Argentina dejó de drenar EBITDA; para venderla, perder los $5.000 que ya defendió dos veces."}, "scores": {"tecnica": {"score": 60, "just": "Rebote con confirmación: cruce alcista de MACD, RSI 56 con espacio, precio sobre SMA20/50 y doble piso defendido en $5.000. Se descuenta porque sigue bajo la MM200 ($5.670) y 20% bajo el máximo de 52 semanas — es una base dentro de tendencia bajista, aún no una tendencia alcista."}, "fundamental": {"score": 62, "just": "Chile (dos tercios del EBITDA) con margen 20% y EBITDA +13,7%, balance sano (D/E 0,71x) y valuación 20% bajo su media histórica con 3% de yield. Los lastres pesan: Argentina −18,6% y Vinos −50,1% de EBITDA, utilidad total −6,8% y ROE mediocre (~7,5%)."}, "sentimiento": {"score": 46, "just": "Consenso tibio con 4 de 10 analistas locales en venta, laggard notorio del rally IPSA y titulares de prensa escépticos (\"hacen dudar al mercado\"). A favor: dispersión de targets con el extremo alcista (BICE +52%) bien argumentado y flujos extranjeros récord hacia la bolsa chilena que eventualmente rotan a rezagados."}, "riesgo": {"score": 50, "just": "Negocio defensivo de consumo básico con 65% del mercado cervecero chileno y controlador sólido (Quiñenco/Heineken), pero triple exposición adversa: macro chilena deteriorándose (5 Imacec negativos), Argentina sin piso confirmado, sobreoferta global de vino, más costos de aluminio y cebada al alza y nuevas restricciones publicitarias vigentes desde el 7-jul."}, "conviccion": {"score": 55, "just": "Catalizadores concretos y fechados (2T26 el 6-ago, plan del nuevo CEO, recuperación argentina en 2S26) y tesis falsable con niveles claros ($5.000 abajo, MM200 $5.670 arriba). La convicción es media porque el timing de la normalización de Argentina y Vinos es incierto y el consenso lleva meses sin comprarla."}}, "sources": ["TradingView — BCS:CCU tiempo real, 130 barras diarias; RSI/MACD/SMA calculados (20-jul-2026)", "Investing.com — cotización local, consenso 2/4/4, PO $5.877, P/E, yield (jul-2026)", "StockAnalysis.com — ADR CCU, targets, forward P/E, EV/EBITDA, earnings 6-ago (20-jul-2026)", "Visfin.cl — MM50/200, ROE, D/E (jul-2026)", "CCU Investor — Press Release 1Q26 (6-may-2026)", "TipRanks — resultados 1T26; transición CEO/directorio; dividendo ab ande do Sul (14-sep-2026) para un terminal de hasta 9 Mt/año. Consenso polarizado: JPM Neutral, Itaú BBA underweight ($1.030), Credicorp underperform ($1.700), MBI sobreponderar (+50%, $2.077).", "fundamental": "- HECHO: EBITDA 2T26 US$270M (margen 14,1%, +6% t/t) y 1T26 US$255M (margen 14,1%, -8,1% a/a); Pulp impulsado por BHKP ~US$600/t, Softys +24% a/a (Investing.com, Credicorp Capital, ago-2026).\n- HECHO: deuda neta/EBITDA subió de 3,97x (2025) a 4,10x (1T26) a 4,17x (2T26), muy sobre rango objetivo 2,5x-3,5x (reporte corporativo, ago-2026). 3T26 (cierra 30-sep) aún sin dato.\n- HECHO: S&P bajó de BBB a BBB- el 11-feb-2026; a ago-2026 mantiene BBB- con outlook estable, Moody's mantiene Baa3 con outlook negativo — sin nuevo downgrade detectado hasta el 16-sep-2026 (Investing.com/S&P Global Ratings, feb/ago-2026).\n- HECHO: S&P proyecta EBITDA ajustado US$1.200-1.300M en 2026 y US$1.400-1.500M en 2027, con leverage cayendo a ~3,0x en 2026 y ~2,5x en 2027, condicionado a venta de activos por ~US$450M en 2026 (S&P Global Ratings, ago-2026).\n- LECTURA: un notch adicional de downgrade implicaría perder investment grade; el plan de desapalancamiento depende de ejecución de desinversiones, no solo de ciclo de celulosa.", "valuacion": "- HECHO: P/B ~0,28x y EV/EBITDA ~8x sobre EBITDA de fondo de ciclo, forward P/E ~14,9x (stockanalysis.com, sep-2026); múltiplos deprimidos frente a libro.\n- HECHO: acción en mínimo de 52 semanas (~$969-981 CLP), market cap ~CLP 2,45-2,74 billones (Investing.com, 11/17-sep-2026).\n- HECHO: consenso Bloomberg/Investing.com (~15 estimados) promedia PT ~CLP 1.500-1.513, rango CLP 1.030 (Itaú BBA) a CLP 2.077-2.807 (MBI/máximo) (Diario Financiero, Investing.com, sep-2026).\n- HECHO: Credicorp Capital en underperform con PT CLP 1.700 (may-2026, fecha exacta no confirmada), suma más divergencia al consenso.\n- LECTURA: valuación barata en libro pero parcialmente justificada por apalancamiento elevado y riesgo de rating; la dispersión ~2,7x entre el target más bajo y el más alto refleja incertidumbre genuina sobre ciclo de celulosa y Natureza, no solo diferencias de modelo.", "tecnico": "- HECHO (dado): precio $981,2, RSI 38,9 (zona neutral-baja, sin sobreventa extrema), MACD -10,46 bajo señal -5,61 (momentum negativo).\n- HECHO (dado): precio está -4,33% bajo SMA20, -5,75% bajo SMA50 y -17,21% bajo SMA200; tendencia de mediano plazo sigue bajista.\n- HECHO (dado): volumen hoy 3,73M vs promedio 20d de 2,38M (ratio 1,56x) — volumen elevado en la caída, señal de presión vendedora activa, no de agotamiento.\n- HECHO: percentil de precio 1 año en 0% confirma que la acción marca nuevo mínimo de 52 semanas (Investing.com, 17-sep-2026).\n- LECTURA: a diferencia de lecturas previas de agotamiento vendedor, el volumen alto en la ruptura de mínimos y el MACD ampliándose a la baja son señales de continuación bajista, no de piso; sin señales de techo ni de piso confirmadas en el trend dado (0 piso, 0 techo).", "sentimiento": "- HECHO: JPMorgan mantiene Neutral; PT recortado de US$1.600 a US$1.400 (oct-2025), con referencia a un PT posterior de US$1.100 para dic-2026 no confirmado con fecha exacta — persiste tono cauteloso por sobreoferta de celulosa (Diario Financiero, 2026).\n- HECHO: Itaú BBA mantiene underweight con PT CLP 1.030, el más bajo del consenso, citando incertidumbre sobre Natureza (Diario Financiero, 2026).\n- HECHO: Credicorp Capital en underperform con PT CLP 1.700 (may-2026 aprox.); MBI mantiene sobreponderar con PT CLP 2.077 (recortado desde 2.417), viendo +50% de potencial (Diario Financiero, redimin.cl, 2026).\n- LECTURA: consenso sigue polarizado — visión bajista de casas globales/locales grandes (JPM, Itaú, Credicorp) centrada en oferta de celulosa y apalancamiento, frente a MBI constructivo por mean-reversion.\n- LECTURA: con la acción marcando nuevo mínimo de 52 semanas (percentil 0%) mientras el consenso sigue dividido, la configuración contrarian se mantiene pero sin catalizador de corto plazo que fuerce convergencia; el mayor peso bajista (3 de 4 casas) matiza la señal contraria.", "catalizadores": "**Catalizadores:**\n- Reporte 3T26 (5-nov-2026): clave ver si el desapalancamiento revierte desde 4,17x hacia la meta de S&P (~3,0x en 2026) y si el margen Pulp se sostiene.\n- Avance de Natureza en Brasil: cesión de terreno portuario en Rio Grande do Sul (14-sep-2026) y firma de contrato del terminal (~12-sep-2026) para terminal de hasta 9 Mt/año; estructura portuaria estimada para mediados de 2029.\n- Plan de venta de activos por ~US$450M en 2026 (condición de S&P para mantener/mejorar rating) — ejecución pendiente de verificar.\n- Señales de recuperación de precio de celulosa hacia el cierre de 3T26 tras mínimos de agosto, aunque sin cifra puntual confirmada (La Tercera/DF, 2026).\n\n**Riesgos (por materialidad):**\n- Pérdida de investment grade: apalancamiento en 4,17x muy sobre el rango objetivo; Moody's ya tiene outlook negativo en Baa3, un downgrade adicional dispararía covenants y encarecería refinanciamiento.\n- Sobreoferta de celulosa persistente: pese a recortes puntuales de Metsä (Joutseno) y Suzano (-3,5% producción), la nueva capacidad de Arauco Sucuriú (2S2027) y CMPC Natureza no alivia el mercado en 2026-2027.\n- Retrasos regulatorios/sociales en Natureza: notas de prensa (6-sep-2026) sobre \"compleja ruta\" de permisos y redefinición de plazos por parte de CMPC.\n- Exposición cambiaria: ingresos en USD, deuda dolarizada, costos en CLP/BRL — volatilidad FX ya afectó la utilidad neta en 2T26.", "conclusion": "CMPC sigue en el mismo punto de inflexión: mejora operativa moderada frente a deterioro financiero persistente. El apalancamiento (4,17x) no ha mostrado reversión confirmada y el rating permanece al borde del grado especulativo (BBB- S&P estable, Baa3 Moody's negativo). El técnico empeoró: nuevo mínimo de 52 semanas con volumen alto en la caída, sin señales de piso confirmadas. Natureza avanza en permisos portuarios pero el proyecto central sigue con plazos inciertos. El consenso de analistas sigue mayoritariamente cauteloso (JPM, Itaú, Credicorp) frente a MBI aislado y optimista. Confianza media-baja: la tesis de valor depende de catalizadores binarios (3T26, acción de rating, ejecución de venta de activos) aún sin resolver. Postura: esperar confirmación de piso técnico y de desapalancamiento antes de aumentar exposición."}, "scores": {"tecnica": {"score": 40, "just": "RSI en 38,9 sin sobreventa extrema, pero MACD ampliándose a la baja y volumen 1,56x sobre promedio en la ruptura de mínimos de 52 semanas (percentil 0%) — es continuación bajista, no cambio de carácter; sin señales de piso activas."}, "fundamental": {"score": 37, "just": "Mejora operativa en Pulp/Softys es real y S&P proyecta desapalancamiento a ~3,0x en 2026, pero el apalancamiento real (4,17x) sigue subiendo y el plan depende de ventas de activos aún no ejecutadas; rating al borde de perder investment grade con Moody's ya en outlook negativo."}, "sentimiento": {"score": 50, "just": "Consenso mayoritariamente cauteloso (JPM Neutral, Itaú y Credicorp bajistas) frente a solo MBI optimista — la polarización es real pero el sesgo de opinión ya no está tan parejo; percentil de precio en 0% sostiene algo de lectura contraria, compensado por el deterioro técnico."}, "riesgo": {"score": 27, "just": "Volatilidad 30d de 20,4% es moderada, pero el riesgo de pérdida permanente por downgrade a grado especulativo es alto, binario y se agrava con Moody's en outlook negativo — el desapalancamiento depende de ejecución de desinversiones no garantizada, no de mejora orgánica confirmada."}, "conviccion": {"score": 38, "just": "Asimetría teórica desde mínimos históricos existe, pero el deterioro técnico reciente (nuevo mínimo con volumen) y la falta de confirmación de desapalancamiento reducen la calidad de la tesis; sigue siendo falsable en 3T26 y en próximas acciones de rating, pero de resolución incierta."}}, "sources": ["S&P Global Ratings", "Moo ción de desapalancamiento hacia ~3,0x", "Ejecución del plan de venta de activos (~US$450M) exigido por S&P", "Acción de rating S&P/Moody's/Fitch (Moody's ya en outlook negativo)", "Avance de Natureza: firma efectiva de contratos portuarios y FID del proyecto principal"], "horizonte": "6-18 meses", "tamano": "posición pequeña-inicial", "confianza": "media-baja (deterioro técnico reciente y apalancamiento aún sin reversión confirmada; datos de celulosa post-2T26 sin cifra puntual verificada)"}}, "perfil": "CMPC es un grupo forestal-industrial chileno integrado verticalmente, desde plantaciones propias de pino y eucalipto hasta celulosa de mercado, papeles y consumo masivo, con operaciones en ocho países. Se organiza en Pulp (celulosa y madera), Softys (tissue y cuidado personal) y Biopackaging. En 2025 facturó ~USD 7.480 millones con un mix de ventas de Softys 45-47%, Pulp 39-40% y Biopackaging 14%, pero la caja se concentra en Pulp, que aportó la mayoría del EBITDA con márgenes muy superiores a los de Softys. Chile pesa solo ~16% de las ventas: México y Brasil son los mayores mercados de consumo y Asia absorbe el grueso de la celulosa exportada. Estructuralmente es un negocio precio-tomador, atado al ciclo de la celulosa BHKP y a la demanda china, con Softys como contrapeso de menor margen pero flujo estable. El calce cambiario ayuda (ingresos en dólares contra costos en CLP y BRL) pero la deuda también es dolarizada: el apalancamiento subió a 4,17x EBITDA en 2T26, y sobre eso pesa el proyecto Natureza en Brasil (+USD 4.500-4.600 millones), que define el perfil de riesgo de los próximos años."}, {"ticker": "CENCOSUD", "company": "Cencosud S.A.", "statsList": [["Precio", "$2.090,0 CLP (17-sep-2026)"], ["Rango 52 sem.", "$1.882 – $3.238 CLP (HECHO: stockanalysis.com/Yahoo Finance, sep-2026)"], ["Market cap", "~CLP 5,54-5,86 billones (~US$5,8-6,1 MM) (HECHO: stockanalysis.com, sep-2026)"], ["P/E · P/B", "P/E trailing ~21,0x-35,5x según fuente (distorsionado por caída de
