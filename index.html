icación de la Minuta RPM del Banco Central de Chile", "kind": "macro", "info": "HECHO: minuta de la reunión del 08-sep-2026 (TPM mantenida en 4,50% por unanimidad) se publica a las 8:30 horas del 16-sep-2026 (Banco Central de Chile). El mercado buscará matices sobre el momento del primer recorte, en un contexto de actividad local débil (Imacec de julio -1,5% a/a, la mayor caída en más de 3 años, arrastrado por minería -9,3%, BCCh/Diario Financiero, 01-sep-2026)."}], "customSections": [{"title": "Resumen ejecutivo", "nav": "Resumen", "body": "USD/CLP cotiza en 943,68 (11-sep-2026, feed canónico), aunque HECHO: cotizaciones intradía más recientes (14-sep-2026, La Tercera/XTB/Redimin) muestran un cierre de 956,38, en máximos de casi 11 meses, tras una cuarta jornada consecutiva de caída del cobre (~-4,7% acumulado) y expectativas crecientes de un alza de tasas de la Fed. El par se mueve en la intersección de tres catalizadores inminentes: el FOMC del 16-sep (probabilidad ~66% de alza de 25pb), la minuta BCCh del mismo día, y un cobre que retrocede desde récords históricos. Técnicamente el par está sobrecomprado pero sin señales de reversión (RSI 64,9, MACD positivo, precio 4,2% sobre SMA200). Sesgo: alcista de corto plazo (depreciación del CLP) con riesgo binario ligado al resultado del FOMC."}, {"title": "Diferencial de tasas y política monetaria", "nav": "Tasas", "body": "HECHO: BCCh mantuvo la TPM en 4,50% el 08-sep-2026 por decisión unánime (Banco Central de Chile), en un contexto de actividad local débil (Imacec julio -1,5% a/a, mayor caída en 3 años, minería -9,3%, BCCh, 01-sep-2026). HECHO: la Fed decide el 16-sep-2026, con CME FedWatch asignando ~65,9% de probabilidad a un alza de 25pb (a 3,75%-4,00%) tras el tono hawkish de Kevin Warsh en Jackson Hole (28-ago-2026) y el CPI de agosto en 3,4% a/a (BLS, 11-sep-2026). LECTURA: un alza de la Fed comprimiría aún más el diferencial nominal favorable a Chile (hoy ~75-100pb), reduciendo el carry trade a favor del peso y presionando al par al alza; de mantenerse la Fed, el diferencial se sostiene y limita la depreciación."}, {"title": "Balanza de pagos y flujos", "nav": "Balanza", "body": "HECHO: el cobre —cerca de la mitad de las exportaciones chilenas— cotiza en US$6,35-6,37/lb (spot LME) / US$14.018-14.035/ton (contrato 3 meses), -1,4/-1,6% en la jornada del 14-sep-2026, cuarta caída diaria consecutiva (La Tercera, GBM Media, Redimin, XTB, 14-sep-2026). El dato tiene menos de 24 horas de antigüedad respecto a hoy, por lo que no aplica advertencia de desactualización. El retroceso ocurre tras tocar un récord histórico de ~US$14.617/ton a inicios de septiembre, impulsado por demanda de IA/centros de datos y menor oferta chilena e indonesia (Rumbo Minero, 09-sep-2026); la corrección actual responde a un alza de inventarios LME (+8.425 ton) y fortaleza preventiva del dólar ante el FOMC. LECTURA: el menor respaldo de términos de intercambio, sumado a un Imacec de julio débil (-1,5% a/a, minería -9,3%, BCCh 01-sep-2026), reduce el colchón fundamental del peso justo antes del evento Fed."}, {"title": "Posicionamiento", "nav": "Posicionamiento", "body": "No aplica COT (no existe futuro CFTC líquido para CLP); se usa como proxy el informe de derivados/forwards de no residentes del BCCh (SIID). HECHO: no hay publicación oficial para agosto/septiembre 2026; el último dato duro (julio-2026) mostró una posición NDF neta vendedora de no residentes contra el peso de hasta US$17.000-20.297M, la mayor desde fines de 2020 (Diario Financiero/Diario Estrategia, jul-2026). LECTURA: reportes de Diario Financiero (ago-2026) sugieren un desarme parcial de esa posición corta extrema con compras puntuales de peso a inicios de agosto, pero sin cifra oficial posterior a julio — laguna de datos relevante. Un corto extremo en no residentes es, en sí, una señal contraria: deja espacio para una reversión violenta del CLP si el FOMC decepciona expectativas de alza."}, {"title": "Análisis técnico", "nav": "Técnico", "body": "Con los datos dados (TradingView, 11-sep-2026): precio 943,68, RSI 64,9 (zona alta sin sobrecompra extrema), MACD +4,27 sobre señal +2,63 (momentum alcista intacto), precio 1,95%/1,93%/4,18% sobre SMA20/50/200 respectivamente. El 'trend' marca techo plano bajo el máximo anual (sin señales de piso), consistente con un par que ronda máximos de 120 días (rango 850,90-980,88) sin quiebre de tendencia. Volumen 14% bajo el promedio de 20 días, señal de convicción moderada. Percentil de precio 1y en 80,5 —encareciendo el dólar frente a su propio historial reciente—, tras un salto abrupto desde 49,3 a 70,2 el 02-sep-2026 (metricChanges), reflejo del re-pricing hawkish de la Fed."}, {"title": "Intervención y riesgo de banco central", "nav": "Intervención", "body": "El BCCh flota el CLP libremente desde 1999, pero ha intervenido explícitamente en episodios de volatilidad excesiva (USD 20.000M en 2019, USD 25.000M/programa de liquidez en dólares en jul-2022) y ha usado forwards tácticos más recientemente (US$629M licitados en operaciones de renovación, semana del 23-27 de marzo de 2026, El Ciudadano). HECHO: no hay programa de intervención activo anunciado a la fecha (14-sep-2026). LECTURA: el nivel actual (943-956) está por debajo de los máximos históricos de 2022 (~1.050) y del guidance implícito que gatilló intervenciones previas; el riesgo de intervención es bajo mientras el movimiento sea ordenado, pero se activaría si el par acelera con fuerza tras un FOMC hawkish sorpresivo."}, {"title": "Correlaciones macro", "nav": "Correlaciones", "body": "HECHO: el DXY cotiza en torno a 99,6, en máximos de ~2 semanas, en cuarta sesión consecutiva al alza de cara al FOMC (14-sep-2026, varias fuentes). LECTURA: la correlación USD/CLP-cobre es negativa y fuerte (históricamente entre -0,6 y -0,8; un análisis de XTB estima que el cobre explica 65-70% de los movimientos del par), por lo que la caída del cobre de los últimos 4 días explica gran parte del salto reciente del dólar en Chile. La correlación con el DXY es positiva: ambos —dólar global fuerte y cobre débil— se refuerzan mutuamente en el escenario prehinado al FOMC, generando un movimiento direccional coherente y sin señales de divergencia."}, {"title": "Conclusión", "nav": "Conclusión", "body": "Confianza: media. El par enfrenta un catalizador binario en 48 horas (FOMC + minuta BCCh, 16-sep) con sesgo de mercado hacia un alza de tasas Fed (~66% de probabilidad) que, sumado a la corrección del cobre, favorece depreciación adicional del CLP en el muy corto plazo. Sin embargo, el posicionamiento corto extremo de no residentes (dato de julio, sin actualizar) y un cobre en niveles históricamente altos limitan el recorrido alcista estructural del dólar. Recomendación: esperar el resultado del FOMC/minuta antes de tomar posición direccional; la principal laguna de información es la falta de dato SIID posterior a julio."}], "scoreIndex": 8, "customCats": [{"key": "tasas", "name": "Diferencial de Tasas y Política Monetaria", "weight": 30}, {"key": "macro", "name": "Fundamentales Macro", "weight": 20}, {"key": "tecnico", "name": "Técnico", "weight": 20}, {"key": "posicionamiento", "name": "Posicionamiento y Sentimiento", "weight": 15}, {"key": "intervencion", "name": "Riesgo de Intervención / Cola", "weight": 15}], "scores": {"tasas": {"score": 68, "just": "Probabilidad ~66% de alza Fed de 25pb el 16-sep estrecharía el diferencial con la TPM chilena estable en 4,50%, favoreciendo al USD. Riesgo: comité dividido (Waller a favor de mantener)."}, "macro": {"score": 42, "just": "Cobre corrigiendo (-4,7% en 4 sesiones) desde récord histórico resta soporte al CLP; Imacec de julio débil (-1,5% a/a, minería -9,3%) agrava el cuadro local — negativo para USD relativamente moderado porque el nivel del cobre sigue siendo alto en términos históricos."}, "tecnico": {"score": 62, "just": "Momentum alcista intacto (MACD positivo, precio sobre las 3 SMAs) sin sobrecompra extrema (RSI 64,9); volumen algo débil resta convicción al breakout."}, "posicionamiento": {"score": 40, "just": "Corto extremo de no residentes en CLP (dato de julio, sin actualización agosto/septiembre) es una señal contraria clásica: deja espacio a una reversión violenta si el FOMC no confirma el alza esperada."}, "intervencion": {"score": 58, "just": "Nivel actual (943-956) lejos de máximos históricos de 2022 que gatillaron intervención; riesgo bajo-medio pero creciente si el par acelera tras el FOMC del 16-sep."}}, "sources": ["Banco Central de Chile", "Federal Reserve", "U.S. Bureau of Labor Statistics", "La Tercera", "Diario Financiero", "Diario Estrategia", "FXStreet", "XTB", "Redimin", "GBM Media", "CME FedWatch", "Rumbo Minero", "TradingView scanner"], "opportunity": {"cats": {"valuacion_hist": {"score": 68, "just": "Percentil de precio 1y en 80,5 (par relativamente caro/USD fuerte históricamente); sin embargo el cobre sigue en niveles récord, sugiriendo que el USD podría estar sobrevalorado relativo a fundamentales de términos de intercambio."}, "calidad": {"score": 48, "just": "Fundamentales mixtos: TPM chilena estable favorece carry, pero Imacec débil y cobre corrigiendo pesan en contra del peso — calidad de la tesis (comprar USD) es moderada."}, "asimetria": {"score": 60, "just": "Evento binario en 48h (FOMC) genera asimetría de corto plazo; el posicionamiento corto extremo en CLP añade riesgo de squeeze si la Fed decepciona el alza esperada."}, "catalizadores": {"score": 72, "just": "Dos catalizadores confirmados y muy próximos (FOMC y minuta BCCh, ambos 16-sep) con probabilidades de mercado bien definidas (~66% alza Fed)."}, "contrarian": {"score": 45, "just": "El consenso ya está mayoritariamente posicionado para el alza Fed y para un CLP débil; el contrarian trade (mantener USD por sorpresa hawkish) tiene menos recorrido que hace unas semanas."}}, "plan": {"recomendacion": "Esperar gatillo", "zona_compra": "920-935 (USD) si el FOMC decepciona el alza; 955-965 si se confirma el alza y se busca sumar en el pullback", "invalidacion": "Cierre sostenido bajo 905 (SMA200) para la tesis larga en USD, o reversión violenta bajo 919 tras el FOMC", "gatillos": ["Resultado FOMC 16-sep (25pb vs pausa)", "Minuta RPM BCCh 16-sep", "Actualización de posicionamiento forwards no residentes (SIID, pendiente desde julio)", "Evolución del cobre post-corrección"], "horizonte": "1-6 meses (táctico) / 6-18 meses (estructural)", "tamano": "Posición táctica pequeña hasta conocer resultado FOMC", "confianza": "media"}}, "perfil": "El par expresa cuántos pesos chilenos se entregan por un dólar: comprarlo es comprar dólares y vender pesos, así que un alza es depreciación del CLP. Su nivel responde a tres fuerzas: el diferencial entre la TPM del Banco Central de Chile y la tasa de la Fed, los términos de intercambio y el ciclo global del dólar. El canal dominante es el cobre: representa cerca de la mitad de las exportaciones chilenas y Chile aporta un cuarto de la producción mundial, por lo que la correlación del par con el metal es negativa y habitualmente entre -0,6 y -0,8 — el peso opera como proxy líquido del cobre y del ciclo chino. Los actores que mueven el mercado son el BCCh (flotación libre desde 1999, pero con intervenciones explícitas de USD 20.000 y 25.000 millones en 2019 y 2022), las AFP con sus cambios de cobertura cambiaria, los exportadores mineros y la banca offshore vía NDF. Qué considerar siempre: es de las monedas emergentes más volátiles (10-15% anualizado), el riesgo de intervención es real y asimétrico —suele gatillarse por volatilidad excesiva, no por un nivel—, y la liquidez local se concentra entre las 9:00 y 13:30 de Chile."}, {"ticker": "EUR/USD", "company": "Euro / Dólar", "baseCurrency": "EUR", "statsList": [["Precio", "1.15356 (15-sep-2026)"], ["Rango 80 días", "1.133 – 1.182"], ["Tasas BCE / Fed", "2,25% / 3,50–3,75%"], ["COT EUR (14-jul)", "-12,605 netos (corto)"], ["DXY", "100.76 (17-jul-2026)"], ["Próximo evento", "BCE 23-jul · FOMC 28-29-jul"], ["Técnico (auto)", "RSI 40.9 · MACD +0.00 / señal +0.00 (TradingView, 15-sep-2026)"]], "change": {"day": -0.06, "week": -0.54}, "customSections": [{"title": "Resumen ejecutivo", "nav": "Resumen", "body": "EUR/USD cerró la semana en **1.14382**, dentro de un rango contenido tras una caída de ~4% desde los máximos de abril (~1.182) y un rebote desde los mínimos de junio (~1.133). El cuadro es de **equilibrio inestable con sesgo de cautela**:\n\n- **HECHO:** El diferencial de tasas sigue siendo claramente favorable al USD (Fed Funds 3.50–3.75% vs. tasa de depósito BCE 2.25%), aunque el BCE **subió** 25 pb en junio mientras la Fed está en pausa — el diferencial se está cerrando en el margen a favor del EUR.\n- **HECHO:** La semana entrante es de alto riesgo de evento: **reunión del BCE el jueves 23-jul** (mercado descuenta ~95% de mantención) y **FOMC el 28-29-jul** (~87–89% de mantención).\n- **HECHO:** Los especuladores están **netos cortos en EUR** (-12,605 contratos, COT al 14-jul-2026), aunque recortando cortos.\n- **LECTURA:** Los riesgos de cola (guerra en Medio Oriente y shock energético asimétrico contra Europa, reapertura de la disputa arancelaria EEUU-UE, crisis política/energética en Francia) recaen desproporcionadamente sobre el EUR.\n\n**Señal resultante: Caution (Grado C — 46/100).** Sin ventaja clara para comprar EUR; el par sigue siendo un rango 1.133–1.155 dominado por bancos centrales y geopolítica.\n\n---"}, {"title": "Diferencial de tasas y política monetaria", "nav": "Tasas", "body": "**BCE (HECHO):**\n- Tasa de depósito vigente: **2.25%**, tras una **subida de 25 pb decidida en la reunión de junio (17-jun-2026)** en respuesta a la presión inflacionaria derivada del shock energético (ECB / Trading Economics, jul-2026).\n- Próxima reunión: **jueves 23-jul-2026** (decisión 13:45 CET, conferencia de Lagarde 14:30 CET) — es decir, **sí hay reunión la semana del 20-jul**. Es reunión sin proyecciones de staff.\n- Expectativas de mercado: **~95.3% de mantención en 2.25%**, con una cola alcista de ~3.4% para +25 pb (rateprobability.com / ecb-watch, consultado 19-jul-2026).\n- Tono de Lagarde: **hawkish**. El 2-jul defendió la subida de junio citando proyecciones de inflación en torno al 3% para 2026 y la necesidad de mantenerse vigilante (ECB Forum Sintra, jul-2026).\n\n**Fed (HECHO):**\n- Rango objetivo vigente: **3.50%–3.75%**; en junio el FOMC mantuvo y señaló que la inflación sigue elevada respecto de la meta del 2% (core PCE ~2.9%).\n- FOMC 28-29-jul-2026: **~89% de probabilidad de mantención** según CME FedWatch (~86.7% según fuentes alternativas al 18-jul-2026). Consenso: tasas sin cambios al menos hasta el otoño boreal, condicionado a progreso en inflación.\n- Tono del presidente de la Fed, Kevin Warsh (Sintra, 1-jul-2026): sin señales para julio, pero \"los precios están demasiado altos\" — sesgo restrictivo.\n\n**Divergencia (LECTURA):** El **nivel** del diferencial (~125–150 pb en tasas de política; 2 años: UST 4.16% vs. Schatz ~2.6–2.8%) favorece al USD y sostiene el carry en contra del EUR. Pero la **dirección** favorece marginalmente al EUR: el BCE está subiendo (y conserva cola hawkish) mientras la Fed está estática. Riesgo señalado por estrategas: que el mercado retire el tightening del BCE antes que el de la Fed, limitando el alza del EUR (VT Markets, jul-2026).\n\n---"}, {"title": "Balanza de pagos y flujos", "nav": "Balanza", "body": "**Cuenta corriente (HECHO):**\n- Superávit de la eurozona de **€25 mil millones en mayo-2026** (+€8 mm m/m): bienes +€16 mm, servicios +€14 mm, renta primaria +€12 mm, renta secundaria -€18 mm (BCE, 17-jul-2026).\n- Acumulado 12 meses a mayo-2026: **€272 mm (1.7% del PIB)**, frente a €318 mm (2.0% del PIB) un año antes — **superávit en contracción**, principalmente por menor superávit de bienes (de €350 mm a €286 mm) (BCE, 17-jul-2026).\n- Proyección del staff del Eurosistema (jun-2026): caída adicional a **~1.3% del PIB en 2026** por mayores precios de importación de energía a raíz de la guerra en Medio Oriente (ECB Economic Bulletin, 2026).\n\n**Flujos de portafolio 2026 (HECHO/LECTURA):**\n- HECHO: La rotación hacia Europa de comienzos de año **se revirtió a mitad de 2026**: la porción de flujos de ETFs de renta variable de EEUU hacia fondos centrados en EEUU subió todos los meses del año, alcanzando ~85% en junio (iShares H1-2026). En Europa, los flujos hacia productos centrados en EEUU se **cuadruplicaron** interanual (Morningstar, 2026). En money markets, USD fue la clasificación más comprada (+€15.98 mm) mientras los fondos EUR registraron salidas (-€5.06 mm) (Lipper/LSEG, may-2026).\n- LECTURA: El colchón estructural de cuenta corriente sigue siendo un soporte de fondo para el EUR, pero se erosiona por energía, y los flujos de portafolio han vuelto a favorecer activos en USD por el atractivo relativo de las tasas americanas. Neto: **levemente negativo para el EUR**.\n\n---"}, {"title": "Posicionamiento", "nav": "Posicionamiento", "body": "**HECHO — CFTC COT, Euro FX (CME), datos al martes 14-jul-2026, publicado 17-jul-2026 (Tradingster/CFTC):**\n- No comerciales (especuladores): largos 230,307 / cortos 242,912 → **neto -12,605 contratos (corto)**.\n- Variación semanal: +6,877 largos, +3,255 cortos → **neto +3,622 hacia largo** (los cortos se están recortando).\n- Interés abierto: 799,495 contratos — mercado profundo y líquido.\n- Tendencia de meses: el neto largo de ~+21,000 contratos de marzo-2026 (percentil 15 del rango de 52 semanas, mínimo de 1 año) se ha degradado hasta territorio **neto corto** (AhaSignals/Investing.com, 2026).\n\n**LECTURA:** Posicionamiento levemente bajista en EUR pero **cercano a plano y mejorando** — no hay extremo de posicionamiento que genere señal contraria potente en ninguna dirección. Un BCE hawkish el 23-jul podría forzar cobertura de cortos (riesgo alcista táctico); la señal estructural es neutral-negativa.\n\n---"}, {"title": "Análisis técnico", "nav": "Técnico", "body": "**HECHO — TradingView (17-jul-2026):**\n- Precio: **1.14382**.\n- RSI(14) diario: **47.2** — neutral.\n- MACD(12,26): **-0.0025** vs. señal **-0.0036**; histograma **+0.0011** — momentum bajista moderándose.\n- Medias: precio **sobre SMA20 (1.1414)** pero **bajo SMA50 (1.1530)**.\n- Ventana 80 días: caída desde máximos ~**1.182** (abril) hasta mínimos ~**1.133** (junio); rebote reciente a ~1.148 y cierre 1.1438.\n\n**LECTURA:**\n- La estructura de mediano plazo sigue siendo **correctiva/bajista** (máximos y mínimos decrecientes desde abril; precio bajo SMA50), pero el rebote desde 1.133 con histograma MACD al alza y recuperación de la SMA20 sugiere que la caída **perdió fuerza**.\n- Soportes: 1.1414 (SMA20), luego 1.133 (mínimo de junio — pivote clave). Resistencias: 1.148 (techo del rebote), 1.1530 (SMA50), luego zona 1.16.\n- Un cierre diario sobre la SMA50 (~1.153) convertiría el rebote en cambio de tendencia; la pérdida de 1.133 reactivaría el tramo bajista hacia 1.12. Con RSI en 47 y precio entre medias, el veredicto técnico es **neutral** (par ni alcista ni bajista con convicción).\n\n---"}, {"title": "Intervención y riesgo de banco central", "nav": "Intervención", "body": "**HECHO/LECTURA:** El riesgo de intervención cambiaria **directa** en EUR/USD es históricamente bajo (última intervención coordinada relevante: 2000/2011); ni el BCE ni el Tesoro de EEUU han señalado nada en 2026 a los niveles actuales. El riesgo relevante es **de cola**:\n\n1. **Energía / Medio Oriente (HECHO):** Tras los ataques de Israel-EEUU contra Irán (28-feb-2026) y la disrupción del Estrecho de Ormuz (~1/5 del suministro global de GNL afectado), el gas europeo opera en ~€46/MWh; los escenarios de crisis prolongada de la Comisión Europea/JRC contemplan petróleo hasta ~USD 180/bbl y gas ~€80/MWh en 4T-2026 (JRC, may-2026; Bloomberg, 9-jul-2026). **LECTURA:** shock asimétricamente negativo para el EUR (Europa importadora neta; EEUU exportador de energía).\n2. **Aranceles EEUU-UE (HECHO):** El acuerdo provisional del 20-may-2026 (arancel máximo ~15% a productos UE) coexiste con amenazas de Trump de tarifas \"mucho más altas\" si no se ratifica, reabriendo la guerra comercial (ING, Euronews, 2026). **LECTURA:** riesgo bajista para crecimiento europeo y EUR.\n3. **Política europea (HECHO):** Crisis política y presupuestaria en Francia, con hoja de ruta energética bloqueada y reactores nucleares parados por olas de calor (Energynews/MNI, 2026). **LECTURA:** prima de riesgo político latente en activos EUR.\n\n**Balance:** riesgo de intervención bajo, pero **riesgo de cola elevado y sesgado en contra del EUR**.\n\n---"}, {"title": "Correlaciones macro", "nav": "Correlaciones", "body": "- **DXY (HECHO):** 100.76 al 17-jul-2026, prácticamente plano en la sesión (Trading Economics/FXStreet). Con EUR ~58% del índice, la correlación inversa DXY–EUR/USD **se mantiene plenamente operativa**: el estancamiento del DXY sobre 100 es el espejo del rango 1.13–1.15 del par.\n- **Diferencial de bonos (HECHO):** UST 10a **4.55%** vs. Bund 10a **3.14%** → spread ~**141 pb** a favor de EEUU (17-jul-2026). En 2 años: UST **4.16%** (16-jul) vs. Schatz **~2.6–2.8%** (máximo desde jul-2024) → ~140–155 pb.\n- **LECTURA:** El spread 10a se ha comprimido desde niveles de 2024–25 (>180 pb) por la subida de los Bunds (BCE hawkish + fiscal alemán), coherente con un EUR/USD que dejó de caer. La correlación negativa entre spread UST–Bund y EUR/USD **se mantiene**; para que el par supere 1.155 de forma sostenida se requeriría compresión adicional del diferencial (BCE subiendo o Fed girando dovish), que hoy no está descontada para julio.\n\n---"}, {"title": "Conclusión", "nav": "Conclusión", "body": "EUR/USD en 1.14382 es un par **en rango, sin ventaja direccional clara**: el carry y los riesgos de cola favorecen al USD; la dirección de la política monetaria (BCE subiendo, Fed en pausa) y un posicionamiento corto en corrección dan soporte táctico al EUR. La semana del 20-jul (BCE 23-jul) y el FOMC del 28-29-jul definirán el próximo tramo.\n\n**Qué validaría una tesis alcista en EUR (Buy EUR):** sorpresa hawkish del BCE el 23-jul y/o giro dovish de la Fed el 29-jul; cierre diario sobre la SMA50 (~1.1530) con compresión del spread UST–Bund bajo ~130 pb; distensión en Medio Oriente (gas < €40/MWh) y ratificación limpia del acuerdo arancelario; COT cruzando a neto largo.\n\n**Qué la invalidaría (riesgo bajista):** pérdida del mínimo de junio (1.133), que abriría 1.12; escalada en Ormuz con petróleo hacia $150–180/bbl y gas hacia €80/MWh, o ruptura arancelaria EEUU-UE; Fed re-hawkish con BCE forzado a pausar; agravamiento de la crisis política francesa con ampliación de spreads OAT–Bund.\n\n> *Este informe es una herramienta de investigación educativa generada con IA. No constituye asesoría de inversión ni recomendación de compra/venta. Verifique todos los datos de forma independiente antes de tomar decisiones financieras.*"}], "scoreIndex": 8, "customCats": [{"key": "tasas", "name": "Diferencial de Tasas y Política Monetaria", "weight": 30}, {"key": "macro", "name": "Fundamentales Macro", "weight": 20}, {"key": "tecnico", "name": "Técnico", "weight": 20}, {"key": "posicionamiento", "name": "Posicionamiento y Sentimiento", "weight": 15}, {"key": "intervencion", "name": "Riesgo de Intervención / Cola", "weight": 15}], "scores": {"tasas": {"score": 48, "just": "El nivel del diferencial (~125–150 pb en política y en 2 años) sigue pagando por estar en USD, pero la dirección (BCE subió en junio con cola hawkish para el 23-jul; Fed estática) cierra la brecha en el margen. Neutral con leve sesgo negativo por el carry."}, "macro": {"score": 45, "just": "Superávit de cuenta corriente aún sólido (€272 mm, 1.7% PIB) pero en contracción por energía, y flujos de portafolio rotando de vuelta a EEUU. El shock energético golpea más el crecimiento europeo que el americano."}, "tecnico": {"score": 50, "just": "RSI 47.2 neutral, MACD bajista moderándose, precio sobre SMA20 pero bajo SMA50 dentro de una estructura correctiva desde abril (TradingView, 17-jul). Ni alcista ni bajista con convicción: rango."}, "posicionamiento": {"score": 47, "just": "COT al 14-jul: especuladores netos cortos -12,605 contratos, aunque recortando desde el neto largo de marzo. Levemente negativo, sin extremo contrario."}, "intervencion": {"score": 40, "just": "Riesgo de intervención directa bajo, pero colas gruesas y asimétricas contra el EUR: guerra Irán/energía (escenarios de $180/bbl), reapertura arancelaria EEUU-UE y crisis política francesa."}}, "sources": ["TradingView (17-jul-2026, técnico verificado en tiempo real)", "ECB — decisiones de política monetaria (jun-2026), balanza de pagos mayo-2026 (17-jul-2026), Economic Bulletin", "rateprobability.com / ecb-watch (19-jul-2026)", "Finance Calendar — reunión BCE 23-jul-2026", "Trading Economics — tasas eurozona, DXY, Bund 10a, Schatz 2a", "CME FedWatch / centralbank.watch", "CNBC — Warsh en Sintra (1-jul-2026)", "VT Markets (jul-2026)", "iShares H1-2026", "Morningstar", "Lipper/LSEG (may-2026)", "Tradingster/CFTC — COT Euro FX (14-jul-2026)", "AhaSignals / Investing.com", "FXStreet (17-jul-2026)", "Advisor Perspectives — UST 10a (17-jul-2026)", "JRC Comisión Europea (27-may-2026)", "Bloomberg — gas europeo (9-jul-2026)", "ING THINK", "Euronews (may-2026)", "Energynews/MNI (2026)"], "events": [{"date": "2026-07-23", "label": "Reunión del BCE", "kind": "macro"}, {"date": "2026-07-29", "label": "FOMC 28-29 jul — decisión de tasas de la Fed", "kind": "macro", "info": "YA OCURRIÓ: la Fed mantuvo la tasa en 3.50%-3.75% por quinta reunión consecutiva, con voto dividido 9-3; comunicado notablemente más corto bajo el nuevo chair Kevin Warsh, quien enfatizó mirar 'la dirección de los datos' sin comprometer recortes (CNBC/Fox Business, 29-jul-2026). Tono 'higher for longer': los dots de junio ven la tasa en 3.6%-4.1% a fin de 2026. La atención pasa ahora al PCE subyacente del 30-jul como próximo catalizador."}], "risk": {"volatility_30d": 5.18, "sharpe": 1.11, "sortino": 1.25, "max_drawdown_1y": -5.66, "n_days": 329, "window": 30}, "benchmark": {"ticker": "TVC:DXY", "label": "DXY", "relative_performance_30d": -0.27, "relative_performance_ytd": -3.21, "price_percentile_1y": 27.8, "partial": false}, "technical": {"price": 1.15356, "change_1d_pct": -0.06, "change_1w_pct": -0.54, "rsi": 40.9, "macd": 0.0002, "macd_signal": 0.0017, "sma20": 1.1616, "sma50": 1.1535, "sma200": 1.163, "ema12": 1.1586, "ema26": 1.1584, "pct_vs_sma20": -0.69, "pct_vs_sma50": 0.01, "pct_vs_sma200": -0.81, "volume_today": 9876, "volume_avg20": 86407.0, "volume_ratio": 0.11, "volatility_30d": 5.18, "sharpe": 1.11, "sortino": 1.25, "max_drawdown_1y": -5.66, "price_percentile_1y": 27.8, "vs_benchmark_30d_pct": -0.27, "perf_1m_pct": -0.23, "perf_ytd_pct": -1.73}, "sourcesMeta": {"price": {"origin": "TradingView scanner", "fetched_at": "2026-09-15T21:43:47-03:00"}, "rsi_macd": {"origin": "TradingView scanner", "fetched_at": "2026-09-15T21:43:47-03:00"}, "smas_volume": {"origin": "TradingView scanner", "fetched_at": "2026-09-15T21:43:47-03:00"}, "benchmark": {"origin": "TradingView scanner", "symbol": "TVC:DXY", "fetched_at": "2026-09-15T21:43:47-03:00"}, "risk_metrics": {"origin": "data/history/FX-EURUSD.json", "n_days": 329}}, "metricChanges": [{"ticker": "EUR/USD", "date": "2026-09-02", "metric": "rsi", "from": 70.0, "to": 52.01}], "opportunity": {"cats": {"valuacion_hist": {"score": 65, "just": "1.1464 está en percentil 18,4 de su rango 1 año y -1,4% vs SMA200; ING estima fair value subiendo de 1.15 hacia 1.20 en 2026, y los targets bancarios (1.12-1.19 a 6 meses; cluster viejo 1.22-1.24 con supuestos ya superados). Levemente barato vs valor razonable, no extremo (FXTM/centralbank.watch)."}, "asimetria": {"score": 63, "just": "Al nivel actual: downside a soporte 1.133 (mínimo de 80 días) = -1,2%; upside a fair value 1.19-1.20 = +4-5%. Ratio ~3.5:1 favorable. Regla de Goldman: cada 50pb de estrecham nto mínimo por riesgo de hike Fed", "confianza": "media"}}, "trend": {"piso": 1, "techo": 2, "max": 7, "senales_piso": ["base construyéndose sobre el mínimo anual"], "senales_techo": ["histograma MACD girando a la baja", "techo plano bajo el máximo anual"]}, "perfil": "El par indica cuántos dólares cuesta un euro: comprarlo es comprar euros y vender dólares. Es el instrumento más negociado del mercado cambiario (~22% del volumen global diario) y funciona como termómetro por defecto del ciclo del dólar. Su nivel depende del diferencial de política monetaria entre la Fed y el BCE —el spread de bonos a 2 años entre EE.UU. y Alemania es el determinante de más alta frecuencia— y del diferencial de tasas reales largas. El segundo pilar es la balanza externa: la eurozona sostiene un superávit de cuenta corriente estructural que genera demanda de euros, pero sistemáticamente compensada por la salida de capital europeo hacia activos estadounidenses, de modo que el par lo define la cuenta financiera más que la comercial. Pesan también el estatus de reserva (el dólar concentra ~58% de las reservas globales y el euro ~20%) y las decisiones de cobertura de fondos de pensiones y aseguradoras europeas. Qué considerar siempre: volatilidad baja para estándares FX (6-9%), con los movimientos concentrados en fechas de política monetaria e inflación; el riesgo de intervención directa es marginal (la última coordinada fue en 2000) y la liquidez máxima está en la superposición Londres-Nueva York."}, {"ticker": "USD/JPY", "company": "Dólar / Yen japonés", "baseCurrency": "USD", "statsList": [["Precio", "155.284 (15-sep-2026)"], ["Rango 80 días", "¥156.11 (mínimo, 3-ago-2026) a ¥163.99 (máximo pre-intervención, 28-jul-2026)"], ["Tasas Fed / BoJ", "Fed 3.50%-3.75% (hold, voto 9-3, 29-jul-2026, bajo el nuevo chair Kevin Warsh) / BoJ 1.00% (hold, voto 8-1, 31-jul-2026, tono hawkish)"], ["COT JPY (fecha de corte)", "Neto especulativo -163.4K contratos (semana cerrada 28-jul-2026, dato pre-sque   const NOTE_UPD =

  const state = { mode: "equity", ticker: STOCKS[0].ticker, weights: { ...DEFAULT_WEIGHTS }, query: "", techSort: { key: "ticker", dir: 1 }, calFilter: null };

  function modeAssets() {

  function statsPairs(s) {
    return s.statsList || Object.keys(STAT_LABELS).map((k) => [STAT_LABELS[k], s.stats[k]]);
  }
  function priceOf(s) {
    const raw = statsPairs(s)[0][1];
    return (raw.match(/^[$¥€]?[\d.,]+/) || [raw])[0];
  }
  function catsOf(s) {
    return s.customCats || CATS.map((c) => ({ key: c.key, name: c.name, weight: DEFAULT_WEIGHTS[c.key] }));
  }
  function signalOf(s, g) {
    if (!s.baseCurrency) return g.signal;
    const parts = s.ticker.split("/");
    const base = s.baseCurrency;
    const quote = parts[0] === base ? parts[1] : parts[0];
    if (g.min >= 85) return `Compra fuerte ${base} / Venta ${quote}`;
    if (g.min >= 70) return `Compra ${base} / Venta ${quote}`;
    if (g.min >= 55) return `Neutral ${base}/${quote} — sin sesgo direccional`;
    if (g.min >= 25) return `Caution — sesgo Venta ${base} / Compra ${quote}`;
    return `Venta ${base} / Compra ${quote}`;
  }
  const REPO_URL = "https://github.com/AgustinMosqueira/stock-dashboard";
  function requestUrl(ticker, tipo) {
    const t = String(ticker).toUpperCase();
    let body, title;
    if (tipo === "alta") {
      title = "informe: " + t;
      body = `Solicito el informe de ${t}.\n\nSi el ticker es ambiguo, indica aquí el símbolo exacto de TradingView (ej. NASDAQ:${t}).\n\nEnviado desde el dashboard.`;
    } else if (tipo === "eliminar") {
      title = "eliminar: " + t;
      body = `Solicito ELIMINAR ${t} del dashboard.\n\nSu histórico de precios queda archivado por si se vuelve a agregar más adelante.\n\nEnviado desde el dashboard.`;
    } else {
      title = "informe: " + t;
      body = `Solicito ACTUALIZAR el informe de ${t}.\n\nEnviado desde el dashboard.`;

    return `${REPO_URL}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
  }
  function matches(s, q) {

  function fmtPct(v) {
    if (v === null || v === undefined) return null;
    const sign = v > 0 ? "+" : v < 0 ? "−" : "";
    return sign + Math.abs(v).toFixed(2).replace(".", ",") + " %";
  }
  function deltaSpan(v, extraCls) {
    const f = fmtPct(v);
    if (f === null) return "";
    const dir = v > 0 ? "up" : v < 0 ? "down" : "flat";
    return `<span class="delta ${dir}${extraCls ? " " + extraCls : ""}">${f}</span>`;
  }

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function inline(s) {
    return s
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\bHECHO(?=\s*:|\b)/g, '<span class="badge hecho">HECHO</span>')
      .replace(/\bLECTURA(?=\s*:|\b)/g, '<span class="badge lectura">LECTURA</span>');
  }
  function md(text) {
    const blocks = esc(text).split(/\n\s*\n/);
    return blocks
      .map((b) => {
        const lines = b.split("\n").map((l) => l.trim()).filter(Boolean);
        if (!lines.length) return "";
        if (lines.every((l) => /^[-•] /.test(l))) {
          return "<ul>" + lines.map((l) => "<li>" + inline(l.slice(2)) + "</li>").join("") + "</ul>";
        }
        if (lines.length >= 2 && lines.every((l) => l.startsWith("|"))) {
          const cells = (l) => l.replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
          const head = cells(lines[0]);
          const rows = lines.slice(1).filter((l) => !/^\|[\s\-:|]+\|$/.test(l)).map(cells);
          return (
            '<div class="md-table"><table><thead><tr>' + head.map((c) => `<th>${c}</th>`).join("") +
            "</tr></thead><tbody>" +
            rows.map((r) => "<tr>" + r.map((c) => `<td>${c}</td>`).join("") + "</tr>").join("") +
            "</tbody></table></div>"
          );
        }
        if (lines.length === 1 && /^#{2,4} /.test(lines[0])) {
          return '<p class="md-h">' + inline(lines[0].replace(/^#{2,4} /, "")) + "</p>";
        }
        return "<p>" + inline(lines.join(" ")) + "</p>";
      })
      .join("");
  }

  function normWeights(w) {
    const sum = CATS.reduce((a, c) => a + w[c.key], 0);
    if (sum === 0) return { norm: { ...DEFAULT_WEIGHTS }, sum: 0 };
    const norm = {};
    CATS.forEach((c) => (norm[c.key] = (w[c.key] / sum) * 100));
    return { norm, sum };
  }
  function composite(stock, weights) {
    if (stock.customCats) {
      return Math.round(stock.customCats.reduce((a, c) => a + stock.scores[c.key].score * c.weight / 100, 0));
    }
    const { norm } = normWeights(weights);
    return Math.round(CATS.reduce((a, c) => a + stock.scores[c.key].score * norm[c.key] / 100, 0));
  }
  function gradeFor(score) {
    return GRADES.find((g) => score >= g.min);
  }

  function gaugeSVG(score, size) {
    const r = size / 2 - 7;
    const cx = size / 2, cy = size / 2;
    const start = 135, sweepMax = 270;
    const sweep = sweepMax * score / 100;
    const arc = (a0, a1, color, wd) => {
      const p = (a) => {
        const rad = (a - 90) * Math.PI / 180;
        return `${(cx + r * Math.cos(rad)).toFixed(2)} ${(cy + r * Math.sin(rad)).toFixed(2)}`;
      };
      const large = a1 - a0 > 180 ? 1 : 0;
      return `<path d="M ${p(a0)} A ${r} ${r} 0 ${large} 1 ${p(a1)}" fill="none" stroke="${color}" stroke-width="${wd}" stroke-linecap="round"/>`;
    };
    let marks = "";
    for (let v = 0; v <= 100; v += 25) {
      const a = (start + sweepMax * v / 100 - 90) * Math.PI / 180;
      const r1 = r - 8, r2 = r - 12;
      marks += `<line x1="${(cx + r1 * Math.cos(a)).toFixed(1)}" y1="${(cy + r1 * Math.sin(a)).toFixed(1)}" x2="${(cx + r2 * Math.cos(a)).toFixed(1)}" y2="${(cy + r2 * Math.sin(a)).toFixed(1)}" stroke="var(--hairline)" stroke-width="1.5"/>`;
    }
    return (
      `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Score compuesto ${score} de 100">` +
      arc(start, start + sweepMax, "var(--track)", 9) +
      (score > 0 ? arc(start, start + Math.max(sweep, 3), "var(--accent)", 9) : "") +
      marks +
      `</svg>`
    );
  }

  function scoreSection(stock) {

      weightsBlock +

  function opportunitySection(stock) {

  function sectionPlan(stock) {
    if (!stock.customSections) {
      return SECTIONS.map((s) => ({
        num: s.num, key: s.key, title: s.title, nav: s.nav,
        body: s.key === "score" ? null : stock.sections[s.key],
      }));
    }
    const plan = [];
    let num = 1;
    stock.customSections.forEach((cs) => {
      if (num === stock.scoreIndex) {
        plan.push({ num: num, key: "score", title: "Score Compuesto FX", nav: "Score", body: null });
        num++;
      }
      plan.push({ num: num, key: "cs" + num, title: cs.title, nav: cs.nav || cs.title, body: cs.body });
      num++;
    });
    if (num === stock.scoreIndex) plan.push({ num: num, key: "score", title: "Score Compuesto FX", nav: "Score", body: null });
    return plan;
  }
  function withOpportunity(stock, plan) {
    if (!stock.opportunity || compositeOpp(stock) == null) return plan;
    const i = plan.findIndex((s) => s.key === "score");
    plan.splice(i + 1, 0, { key: "opportunity", title: "Oportunidad y plan de acción (6-18 meses)", nav: "Oportunidad", body: null });
    plan.forEach((s, idx) => (s.num = idx + 1));

  // — Calendario de eventos —
  const MONTHS_ES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const MONTH_ABBR = { ene: 0, feb: 1, mar: 2, abr: 3, may: 4, jun: 5, jul: 6, ago: 7, sep: 8, sept: 8, set: 8, oct: 9, nov: 10, dic: 11 };
  const WEEKDAYS_ES = ["dom","lun","mar","mié","jue","vie","sáb"];
  const KIND_LABELS = { earnings: "Resultados", macro: "Macro", corporate: "Corporativo" };

  function busDaysUntil(d, today0) {
    let n = 0;
    const cur = new Date(today0);
    while (cur < d && n < 30) {
      cur.setDate(cur.getDate() + 1);
      const wd = cur.getDay();
      if (wd !== 0 && wd !== 6) n++;
    }
    return n;
  }
  function parseISODate(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function parseSpanishDate(txt) {
    const m = /(\d{1,2})[-\s]*(ene|feb|mar|abr|may|jun|jul|ago|sept|sep|set|oct|nov|dic)[a-z]*\.?[-\s]*(\d{4})/i.exec(txt || "");
    if (!m) return null;
    const mo = MONTH_ABBR[m[2].toLowerCase()];
    return mo == null ? null : new Date(+m[3], mo, +m[1]);
  }
  function assetEvents(s) {
    const out = (s.events || [])
      .map((e) => ({ ...e, d: parseISODate(e.date) || parseSpanishDate(e.date) }))
      .filter((e) => e.d && e.label);
    if (!out.some((e) => (e.kind || "") === "earnings")) {
      const pair = statsPairs(s).find(([l]) => /earnings|evento/i.test(l));
      const d = pair && parseSpanishDate(pair[1]);
      if (d) out.push({ d: d, label: (/earnings/i.test(pair[0]) ? "Resultados — " : "") + pair[1], kind: /earnings/i.test(pair[0]) ? "earnings" : "macro" });
    }
    return out.map((e) => ({ ...e, ticker: s.ticker, isFx: s.ticker.includes("/") }));
  }
  // Agrupación de eventos macro compartidos (FOMC, BCE, IPC…): un mismo evento que
  // afecta a varios activos aparece una sola vez con la lista de afectados.
  const MACRO_KEYS = ["fomc", "fed", "bce", "ecb", "boj", "banco central", "bcch", "tpm",
    "ipc", "cpi", "pce", "payroll", "nfp", "ipom", "halving", "opep", "opec", "jackson hole"];
  function normLabel(l) {
    return (l || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim();
  }
  function eventKey(e) {
    if (e.econ) return null;  // los datos del calendario económico no se agrupan entre sí
    if ((e.kind || "macro") !== "macro") return null;  // earnings/corporate nunca se agrupan
    const n = normLabel(e.label);
    for (const k of MACRO_KEYS) if (n.includes(k)) return "k:" + k;
    return "l:" + n;
  }
  function mergeDay(dayEvts) {
    const groups = new Map();
    let uid = 0;
    dayEvts.forEach((e) => {
      const key = eventKey(e) || "u:" + uid++;
      if (!groups.has(key)) {
        groups.set(key, { ...e, tickers: [e.ticker] });
      } else {
        const g = groups.get(key);
        if (!g.tickers.includes(e.ticker)) g.tickers.push(e.ticker);
        if (e.label.length < g.label.length) g.label = e.label;  // se queda la etiqueta más limpia
        if (!g.time && e.time) g.time = e.time;
        if ((e.info || "").length > (g.info || "").length) g.info = e.info;
      }
    });
    return Array.from(groups.values());
  }

  // Calendario económico EE.UU. + Chile (solo 4★/5★), horneado a diario por update_numbers.py
  let ECON = [];
  try { ECON = JSON.parse(document.getElementById("econ-data").textContent) || []; } catch (e) { ECON = []; }
  const ECON_FLAGS = { US: "🇺🇸", CL: "🇨🇱" };
  let EVENT_RESULTS = [];
  try { EVENT_RESULTS = JSON.parse(document.getElementById("event-results").textContent) || []; } catch (e) { EVENT_RESULTS = []; }
  const RES_BY = {};
  EVENT_RESULTS.forEach((r) => { RES_BY[r.ticker + "|" + r.date] = r.result; });

  // a qué activos les es relevante el calendario económico de cada país (para el filtro)
  const ECON_RELEVANT = {
    US: ORDER.filter((t) => !["HDSY", "CCU", "CMPC", "CENCOSUD"].includes(t)),
    CL: ["CCU", "CMPC", "CENCOSUD", "USD/CLP"],
  };

  // Explicaciones breves por indicador (qué es y qué implica un dato mayor a lo esperado).
  // Se busca la primera clave contenida en el título; country restringe cuando aplica.
  const ECON_INFO = [
    ["US", "non farm", "Nóminas no agrícolas (NFP): empleos creados en EE.UU. en el mes, el dato laboral más seguido del mundo. Mayor a lo esperado = economía fuerte → suele ser alcista para el dólar."],
    ["US", "unemployment rate", "Tasa de desempleo de EE.UU. Menor a lo esperado = mercado laboral firme → alcista para el dólar; un alza sorpresiva lo debilita."],
    ["US", "core inflation", "Inflación subyacente (sin alimentos ni energía), la que más mira la Fed dentro del IPC. Mayor a lo esperado → Fed más dura → alcista para el dólar."],
    ["US", "inflation rate", "IPC: inflación al consumidor de EE.UU. Mayor a lo esperado → presiona a la Fed a mantener/subir tasas → alcista para el dólar (y suele golpear a acciones y bonos)."],
    ["US", "pce", "PCE: la medida de inflación favorita de la Fed para decidir tasas. Mayor a lo esperado → Fed más dura → alcista para el dólar."],

    ["US", "ism manufacturing", "ISM manufacturero: encuesta a gerentes de compras industriales. Sobre 50 = expansión. Mayor a lo esperado → alcista para el dólar."],
    ["US", "ism services", "ISM de servicios: salud del sector que domina la economía de EE.UU. Sobre 50 = expansión. Mayor a lo esperado → alcista para el dólar."],
    ["US", "s&p global", "PMI de S&P Global: encuesta rápida de actividad (adelanto de los ISM). Sobre 50 = expansión. Mayor a lo esperado → alcista para el dólar."],
